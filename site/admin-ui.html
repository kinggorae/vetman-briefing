<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>검수 · VetManLab</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1c1e;--mut:#6b7280;--line:#e2e4e8;--blue:#0066ff;--red:#e52222;--amb:#d47800;--grn:#009632}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px 80px}
body[data-reviewers="0"]::before{content:"실제 편집자 등록 필요 · 승인·발행은 등록된 사람과 Git 검수 기록 없이는 사용할 수 없습니다 · npm run people:add -- --id <id> --name <name> --role <role>";display:block;background:#fff4d6;color:#6b4d00;border-bottom:1px solid #e8c96b;padding:10px 18px;font-size:12px;line-height:1.5}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.bar{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);z-index:5}
select,button,input{font-family:inherit;font-size:14px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{border:0;border-radius:8px;padding:9px 15px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff}.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.stat{margin-left:auto;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.item.ex{opacity:.5;border-style:dashed}
.itop{display:flex;gap:12px;align-items:flex-start}
.itop input{width:18px;height:18px;margin-top:4px;flex:none}
.cat{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.ttl{font-size:17px;font-weight:800;margin:3px 0 4px;line-height:1.35}
.src{font-size:12px;color:var(--mut)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.flag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
.f-red{background:#feecec;color:var(--red)}.f-amb{background:#fef4e6;color:var(--amb)}.f-grn{background:#d9ffe6;color:var(--grn)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.metric b{display:block;font-size:20px;line-height:1.1}.metric span{display:block;color:var(--mut);font-size:11px;margin-top:5px}
@media(max-width:680px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.body{margin-top:10px;font-size:14px;line-height:1.75;color:#333;white-space:pre-wrap;display:none}
.item.open .body{display:block}
.toggle{font-size:12px;color:var(--blue);cursor:pointer;font-weight:700;margin-top:8px;display:inline-block}
.angle{margin-top:10px;padding:10px 12px;background:#f0f5ff;border-radius:8px;font-size:13px}
.gate{max-width:340px;margin:80px auto;text-align:center}
.gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:12px 0}
</style></head><body><div class="wrap" id="app"></div>
<script>
var TOKEN=sessionStorage.getItem('vm_admin_token')||'';
var app=document.getElementById('app');
var ISSUE=null, EX={};
var AUDIT=null;
var PERFORMANCE=null;
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function foreign(it){var m=JSON.stringify([it.titleKo,it.leadKo,it.bodyKo,it.keyPointsKo,it.angleKo]).match(/[一-鿿぀-ヿЀ-ӿ]+/g);return m?m.join(','):null;}
function flags(it){
  var out=[];
  if(it.needsReview) out.push(['f-red','검수필요']);
  var fr=foreign(it); if(fr) out.push(['f-red','외국어:'+fr.slice(0,16)]);
  var blen=(it.bodyKo||[]).join('').length;
  if(blen<250) out.push(['f-amb','본문짧음 '+blen+'자']);
  if(!it.imageUrl && it.sourceType!=='paper') out.push(['f-amb','이미지없음']);
  if(!it.sourceUrl||it.sourceUrl==='#') out.push(['f-red','출처링크없음']);
  if(!out.length) out.push(['f-grn','이상없음']);
  return out;
}
function gate(){
  app.innerHTML='<div class="gate"><h1>검수 대시보드</h1><p style="color:#6b7280;font-size:13px">관리자 키를 입력하세요.</p><input id="pw" type="password" placeholder="관리자 키" autocomplete="current-password"><button class="primary" style="width:100%" onclick="tryPw()">확인</button><p style="color:#9aa;font-size:11px;margin-top:16px">관리자 키는 공개 코드에 저장되지 않으며 서버에서만 확인됩니다.</p></div>';
}
function authFetch(url){return fetch(url,{headers:{Authorization:'Bearer '+TOKEN}}).then(function(r){if(r.status===401){TOKEN='';sessionStorage.removeItem('vm_admin_token');gate();throw new Error('unauthorized');}if(!r.ok)throw new Error('request failed');return r;});}
window.tryPw=function(){var v=document.getElementById('pw').value.trim();if(!v)return;TOKEN=v;sessionStorage.setItem('vm_admin_token',v);boot();};
function loadAudit(){return authFetch('/api/admin?resource=audit').then(function(r){return r.json();}).then(function(d){AUDIT=d;document.body.dataset.reviewers=(d.peopleStatus&&d.peopleStatus.reviewerCount===0)?'0':'ready';}).catch(function(){});}
function loadPerformance(){return authFetch('/api/admin?resource=performance').then(function(r){return r.json();}).then(function(d){PERFORMANCE=d;}).catch(function(){});}
function newsroomData(){return AUDIT||{drafts:[],queue:[],feedDiagnostics:{feeds:[]},updates:{rows:[]}};}
window.showNewsroom=function(){if(!AUDIT){loadAudit().then(showNewsroom);return;}var d=newsroomData(), drafts=d.drafts||[], q=d.queue||[], feeds=(d.feedDiagnostics&&d.feedDiagnostics.feeds)||[], updates=(d.updates&&d.updates.rows)||[];var risk=document.getElementById('nf-risk')?.value||'';var type=document.getElementById('nf-type')?.value||'';drafts=drafts.filter(function(x){return (!risk||x.clinicalRisk===risk)&&(!type||x.duplicateStatus===type);});app.innerHTML='<h1>뉴스룸·피드 운영</h1><div class="sub">인증된 관리자 전용 읽기 화면입니다. draft는 공개 빌드·sitemap·RSS에 포함되지 않으며, 승인·발행은 Git 기반 CLI와 실제 검수자 기록으로만 진행합니다.</div><div class="metrics"><div class="metric"><b>'+drafts.length+'</b><span>draft 후보</span></div><div class="metric"><b>'+q.length+'</b><span>통합 검수 큐</span></div><div class="metric"><b>'+feeds.length+'</b><span>피드 검사</span></div><div class="metric"><b>'+updates.length+'</b><span>update 후보</span></div></div><div class="bar"><select id="nf-risk" onchange="showNewsroom()"><option value="">전체 위험도</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select><select id="nf-type" onchange="showNewsroom()"><option value="">전체 중복 상태</option><option value="unique">unique</option><option value="update-of-existing">update</option><option value="exact-duplicate">duplicate</option></select><button class="ghost" onclick="showAudit()">기사 검수</button><button class="ghost" onclick="showFeeds()">피드 상태</button><span class="stat">자동 published 0건</span></div><h2>Draft 후보</h2><div class="audit-list">'+drafts.slice(0,100).map(function(x){return '<div class="item"><div class="cat">'+e(x.clinicalRisk||'미분류')+' · '+e(x.duplicateStatus||'미분류')+' · '+e(x.sourceStatus||'')+'</div><div class="ttl">'+e(x.title||x.sourceTitle)+'</div><div class="src">'+e(x.sourceLabel||x.sourceId||'')+' · '+e(x.publishedAt||'발행일 없음')+' · '+e(x.id)+'</div><div class="flags">'+((x.warnings||[]).map(function(w){return '<span class="flag f-amb">'+e(w)+'</span>';}).join('')||'<span class="flag f-grn">자동 경고 없음</span>')+'</div><div class="src" style="margin-top:8px">'+(x.sourceUrl?'<a href="'+e(x.sourceUrl)+'" target="_blank" rel="noopener noreferrer">공식 원문</a>':'공식 URL 미확정')+' · '+e(x.commands?.show||'review:show')+' · '+e(x.imageStatus||'이미지 권리 확인 필요')+'</div></div>';}).join('')+'</div><h2>우선 검수 큐</h2><div class="audit-list">'+q.slice(0,40).map(function(x){return '<div class="item"><div class="cat">우선순위 '+e(x.score)+' · '+e(x.type)+' · '+e(x.risk)+'</div><div class="ttl">'+e(x.title)+'</div><div class="src">'+e(x.id)+' · '+e(x.reason)+'</div></div>';}).join('')+'</div>';};
window.showFeeds=function(){if(!AUDIT){loadAudit().then(showFeeds);return;}var feeds=(newsroomData().feedDiagnostics||{}).feeds||[];app.innerHTML='<h1>공식 피드 상태</h1><div class="sub">ETag·Last-Modified·XML 파싱·canonical·발행 간격을 기록합니다. 대체 피드는 사람 승인 전 레지스트리에 반영하지 않습니다.</div><div class="bar"><button class="ghost" onclick="showNewsroom()">뉴스룸</button><button class="ghost" onclick="showAudit()">기사 검수</button><button class="ghost" onclick="showShadow()">Shadow 운영</button></div><div class="audit-list">'+feeds.map(function(x){return '<div class="item"><div class="cat">'+e(x.status)+' · '+e(x.sourceLabel)+'</div><div class="ttl">'+e(x.feedUrl)+'</div><div class="src">HTTP '+e(x.httpStatus||'실패')+' · '+e(x.contentType||'MIME 없음')+' · 최근 '+e(x.latestPublishedAt||'없음')+' · 평균 '+e(x.averageIntervalDays==null?'–':x.averageIntervalDays)+'일</div><div class="flags"><span class="flag '+(x.status==='healthy'||x.status==='quiet'?'f-grn':'f-amb')+'">canonical '+e(x.canonicalCoverage==null?'–':x.canonicalCoverage)+'</span><span class="flag f-amb">ETag '+e(x.etag||'없음')+'</span><span class="flag f-amb">304 '+(x.notModified?'예':'아니오')+'</span></div><div class="src">'+e(x.error||x.lastError||'최근 오류 없음')+'</div></div>';}).join('')+'</div>';};
window.showShadow=function(){if(!AUDIT){loadAudit().then(showShadow);return;}var d=newsroomData(),s=d.shadow||{},run=s.run||{},packet=s.packet||{},trend=d.shadowTrend||{},repair=d.feedRepairValidation||{},first=d.firstPublishCandidates||{},g=d.gscNaverChecklist||{};var steps=(run.steps||[]).filter(function(x){return !x.ok;}).map(function(x){return x.command;}).join(', ')||'없음';app.innerHTML='<h1>Shadow 뉴스룸</h1><div class="sub">인증 관리자·CI artifact 전용 읽기 화면입니다. shadow 자료는 공개 site·sitemap·RSS에 연결되지 않으며 자동 발행은 항상 0건입니다.</div><div class="metrics"><div class="metric"><b>'+e(run.date||'–')+'</b><span>최근 실행</span></div><div class="metric"><b>'+e(run.packetCount||0)+'</b><span>오늘 검수 패킷</span></div><div class="metric"><b>'+e((trend.runCount||0))+'</b><span>실제 누적 실행</span></div><div class="metric"><b>0</b><span>자동 published</span></div></div><div class="bar"><button class="ghost" onclick="showNewsroom()">뉴스룸</button><button class="ghost" onclick="showFeeds()">피드 상태</button><button class="ghost" onclick="showAudit()">기사 검수</button></div><h2>최근 실행</h2><div class="item"><div class="cat">'+e(run.ok===false?'warning':'success')+' · 실패 단계 '+e(steps)+'</div><div class="src">수집 '+e(run.stats?.collected||0)+' · unique '+e(run.stats?.unique||0)+' · duplicate '+e(run.stats?.duplicate||0)+' · update '+e(run.stats?.update||0)+' · draft '+e(run.stats?.draft||0)+' · canonical '+e(run.stats?.canonicalRate||0)+' · relay '+e(run.stats?.relayRate||0)+'</div></div><h2>오늘의 검수 후보</h2><div class="audit-list">'+(packet.candidates||[]).map(function(x){return '<div class="item"><div class="cat">우선순위 '+e(x.priority)+' · '+e(x.type)+' · '+e(x.clinicalRisk||'미분류')+'</div><div class="ttl">'+e(x.title||x.sourceTitle||x.id)+'</div><div class="src">'+e(x.id)+' · '+e(x.priorityReason)+' · '+(x.sourceUrl?'<a href="'+e(x.sourceUrl)+'" target="_blank" rel="noopener noreferrer">원문</a>':'공식 URL 미확정')+'</div><div class="flags">'+(x.warnings||[]).slice(0,5).map(function(w){return '<span class="flag f-amb">'+e(w)+'</span>';}).join('')+'</div></div>';}).join('')||'<div class="item">검수 후보 없음</div>'+'</div><h2>피드 복구 후보</h2><div class="src">'+e(JSON.stringify(repair.counts||{}))+' · 사람 승인 전 자동 적용하지 않음</div><h2>첫 발행 후보</h2><div class="src">'+(first.candidates||[]).map(function(x){return e(x.id)+' '+e(x.status);}).join(' · ')+'</div><h2>GSC·네이버 체크리스트</h2><div class="item"><div class="src">가져온 행 '+e(g.importedRows||0)+' · GSC: '+e(g.gscCommand)+' · 네이버: '+e(g.naverCommand)+'</div></div>';};
function auditRows(){return (AUDIT&&AUDIT.rows)||[];}
function filteredAudit(){var tier=document.getElementById('af-tier')?.value||'';var status=document.getElementById('af-status')?.value||'';var risk=document.getElementById('af-risk')?.value||'';var editorial=document.getElementById('af-editorial')?.value||'';var issue=document.getElementById('af-issue')?.value||'';return auditRows().filter(function(row){return (!tier||row.contentTier===tier)&&(!status||status===(row.indexable?'index':'noindex'))&&(!risk||row.clinicalRisk===risk)&&(!editorial||row.editorialStatus===editorial)&&(!issue||JSON.stringify(row).toLowerCase().indexOf(issue.toLowerCase())>=0);});}
window.showAudit=function(){if(!AUDIT){loadAudit().then(showAudit);return;}var rows=filteredAudit();var h='<h1>SEO·편집 검수</h1><div class="sub">인증된 관리자에게만 제공되는 읽기 전용 검수 큐입니다. 상태 변경은 review CLI와 Git 기록으로만 수행합니다.</div><div class="metrics"><div class="metric"><b>'+AUDIT.summary.total+'</b><span>전체 기사</span></div><div class="metric"><b>'+AUDIT.summary.index+'</b><span>index</span></div><div class="metric"><b>'+AUDIT.summary.relayUrl+'</b><span>중계 URL</span></div><div class="metric"><b>'+AUDIT.summary.reviewerNeeded+'</b><span>사람 검수 대기</span></div></div><div class="bar"><select id="af-status" onchange="showAudit()"><option value="">전체 색인 상태</option><option value="index">index</option><option value="noindex">noindex</option></select><select id="af-risk" onchange="showAudit()"><option value="">전체 임상 위험도</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select><input id="af-issue" placeholder="문제·기사·출처 검색" value="'+e(document.getElementById('af-issue')?.value||'')+'" onkeydown="if(event.key===\'Enter\')showAudit()"><button class="ghost" onclick="showPerformance()">검색 성과</button><button class="ghost" onclick="showNewsroom()">뉴스룸</button><button class="ghost" onclick="showFeeds()">피드 상태</button><button class="ghost" onclick="render()">날짜별 검수</button><span class="stat">'+rows.length+'건 표시</span></div><div class="audit-list">'+rows.slice(0,100).map(function(row){var fl=(row.qualityIssues||[]).map(function(x){return '<span class="flag f-red">'+e(x)+'</span>';}).join('');if(row.relayUrl)fl+='<span class="flag f-amb">중계 URL</span>';if(row.clinicalRisk==='high')fl+='<span class="flag f-red">임상 high</span>';if(row.reReviewRequired)fl+='<span class="flag f-amb">재검수</span>';return '<div class="item"><div class="cat">우선순위 '+row.priority+' · '+e(row.date)+' · '+e(row.workflowStatus||row.editorialStatus||'')+' · '+(row.indexable?'index':'noindex')+'</div><div class="ttl">'+e(row.title)+'</div><div class="src">'+e(row.source||'출처 없음')+' · '+e(row.id)+' · '+e(row.dataFile)+'</div><div class="flags">'+(fl||'<span class="flag f-grn">이상없음</span>')+'</div><div class="src" style="margin-top:8px"><a href="'+e(row.generatedUrl)+'" target="_blank">생성 기사</a> · '+(row.sourceUrl?'<a href="'+e(row.sourceUrl)+'" target="_blank" rel="noopener noreferrer">원문</a>':'원문 없음')+' · '+e(row.reviewerStatus||'')+' · 임상 '+e(row.clinicalRisk||'미분류')+'</div></div>';}).join('')+'</div>';app.innerHTML=h;};
window.showPerformance=function(){if(!PERFORMANCE){loadPerformance().then(showPerformance);return;}var rows=PERFORMANCE.rows||[];app.innerHTML='<h1>검색 성과</h1><div class="sub">인증된 관리자 전용 읽기 화면입니다. 실제 GSC·네이버 CSV를 가져오기 전에는 샘플을 만들지 않습니다.</div>'+(rows.length?'<div class="metrics"><div class="metric"><b>'+rows.length+'</b><span>가져온 행</span></div><div class="metric"><b>'+((PERFORMANCE.providers&&PERFORMANCE.providers.gsc||[]).length)+'</b><span>GSC</span></div><div class="metric"><b>'+((PERFORMANCE.providers&&PERFORMANCE.providers.naver||[]).length)+'</b><span>네이버</span></div></div><p>CSV 분석은 로컬 CLI <code>npm run seo:performance</code>로 갱신합니다.</p>':'<div class="item"><div class="ttl">아직 가져온 검색 성과 데이터가 없습니다.</div><div class="src">GSC Search results와 네이버 서치어드바이저 검색 유입 CSV를 각각 내려받아 <code>npm run seo:import:gsc -- 파일.csv</code> 또는 <code>npm run seo:import:naver -- 파일.csv</code>로 가져오세요.</div></div>')+'<button class="ghost" onclick="showAudit()">검수 큐로 돌아가기</button>';};
window.downloadAudit=function(kind){var rows=filteredAudit();if(kind==='json'){var blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vetman-seo-review.json';a.click();return;}var cols=['id','date','title','source','indexable','contentTier','priority','qualityIssues','sourceUrl','generatedUrl','dataFile','image','relayUrl','reviewerStatus'];var csv=[cols.join(',')].concat(rows.map(function(row){return cols.map(function(col){var val=Array.isArray(row[col])?row[col].join('|'):row[col];return '"'+String(val==null?'':val).replace(/"/g,'""')+'"';}).join(',');})).join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vetman-seo-review.csv';a.click();};
function load(date){
  authFetch('/api/admin?resource=raw&date='+encodeURIComponent(date)).then(function(r){return r.json();}).then(function(d){ISSUE=d;EX={};render();}).catch(function(){});
}
function render(){
  if(!ISSUE){app.innerHTML='<p>불러오는 중…</p>';return;}
  var items=ISSUE.items||[];
  var exCount=Object.keys(EX).filter(function(k){return EX[k];}).length;
  var reviewCount=items.filter(function(it){return it.needsReview||foreign(it);}).length;
  var imageCount=items.filter(function(it){return !!it.imageUrl;}).length;
  var sourceCount=items.filter(function(it){return !!it.sourceUrl&&it.sourceUrl!=='#';}).length;
  var h='<h1>검수 · '+e(ISSUE.date)+'</h1><div class="sub">발행 상태: '+e(ISSUE.status||'')+' · 총 '+items.length+'건</div>';
  h+='<div class="metrics"><div class="metric"><b>'+items.length+'</b><span>전체 항목</span></div><div class="metric"><b>'+reviewCount+'</b><span>검수 필요</span></div><div class="metric"><b>'+imageCount+'/'+items.length+'</b><span>대표 이미지</span></div><div class="metric"><b>'+sourceCount+'/'+items.length+'</b><span>원문 링크</span></div></div>';
  h+='<div class="bar"><select id="dsel" onchange="load(this.value)"></select><button class="primary" onclick="copyClean()">제외 반영 JSON 복사</button><button class="ghost" onclick="copyAll()">전체 JSON</button><button class="ghost" onclick="showAudit()">SEO·편집 검수</button><span class="stat">'+items.length+'건 중 <b>'+exCount+'건 제외</b> → 발행 '+(items.length-exCount)+'건</span></div>';
  h+=items.map(function(it,i){
    var fl=flags(it).map(function(f){return '<span class="flag '+f[0]+'">'+e(f[1])+'</span>';}).join('');
    var ex=EX[i]?' ex':'';
    return '<div class="item'+ex+'" id="it'+i+'"><div class="itop"><input type="checkbox" '+(EX[i]?'checked':'')+' onchange="toggleEx('+i+')" title="제외"><div style="flex:1;min-width:0"><div class="cat">'+e(it.category||'')+' · '+e(it.sourceLabel||'')+'</div><div class="ttl">'+(i+1)+'. '+e(it.titleKo)+'</div><div class="src">'+e(it.leadKo||'')+'</div><div class="flags">'+fl+'</div><span class="toggle" onclick="tg('+i+')">본문 펼치기 ▾</span><div class="body">'+(it.bodyKo||[]).map(e).join('\n\n')+'</div>'+(it.angleKo?'<div class="angle"><b>글감</b> · '+e(it.angleKo)+'</div>':'')+'<div class="src" style="margin-top:8px">원문: <a href="'+e(it.sourceUrl)+'" target="_blank">'+e(it.sourceTitle||it.sourceUrl)+'</a></div></div></div></div>';
  }).join('');
  app.innerHTML=h;
  // date dropdown
  authFetch('/api/admin?resource=archive').then(function(r){return r.json();}).then(function(a){var sel=document.getElementById('dsel');if(!sel)return;sel.innerHTML=(a.issues||[]).map(function(x){return '<option value="'+x.date+'"'+(x.date===ISSUE.date?' selected':'')+'>'+x.date+' ('+x.count+'건)</option>';}).join('');}).catch(function(){});
}
window.toggleEx=function(i){EX[i]=!EX[i];render();};
window.tg=function(i){document.getElementById('it'+i).classList.toggle('open');event.target.textContent=document.getElementById('it'+i).classList.contains('open')?'본문 접기 ▴':'본문 펼치기 ▾';};
window.copyClean=function(){var out=Object.assign({},ISSUE);out.items=ISSUE.items.filter(function(it,i){return !EX[i];});navigator.clipboard.writeText(JSON.stringify(out,null,2));alert('제외 반영 JSON을 복사했습니다.\n\ndata/issues/'+ISSUE.date+'.json 에 붙여넣고 재배포하세요.');};
window.copyAll=function(){navigator.clipboard.writeText(JSON.stringify(ISSUE,null,2));alert('전체 JSON 복사됨');};
function boot(){Promise.all([authFetch('/api/admin?resource=archive').then(function(r){return r.json();}),loadAudit(),loadPerformance()]).then(function(results){var a=results[0];var d=(a.issues&&a.issues[0])?a.issues[0].date:null;if(d)load(d);else app.innerHTML='<p>이슈가 없습니다.</p>';}).catch(function(){gate();});}
if(TOKEN) boot(); else gate();
</script><script src="https://cardkit.vetmanlab.com/switcher.js" defer></script></body></html>
