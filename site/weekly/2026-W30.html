<body>
<div class="vm-page" id="vm" data-theme="light" style="min-height:100vh;background:var(--color-background-normal);color:var(--color-label-normal);font-family:var(--font-sans);"></div>
<noscript><div style="max-width:720px;margin:0 auto;padding:40px 20px;font-family:sans-serif;">
<h1>베트맨랩 VetMan 해외 브리핑 — 2026-W30</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<ul style="list-style:none;padding:0;"><li style="margin-bottom:16px;"><a href="/article/2026-W30_1-수의-수술실-효율화-입체적-배치-전략"><b>수의 수술실 효율화, 입체적 배치 전략</b></a>
<div>수의학적 수술의 질은 단순한 술기 능숙도뿐 아니라 수술실과 준비공간의 배치에 의해 크게 영향을 받습니다. 고체화량 중성화 진료부터 복합적인 전문 술기까지, 원활한 수술 일정은 환자·보호자·의료팀을 위한 종합적인 준비에서 시작됩니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_2-고양이-만성신장질환-장내-대사물질-변화와-연관-발견"><b>고양이 만성신장질환, 장내 대사물질 변화와 연관 발견</b></a>
<div>네스커 퓨리나 연구팀과 미국 대학 연구자들이 고양이의 만성신장질환(CKD)이 장내 대사물질의 변화와 관련이 있다는 증거를 보고했습니다. 이 발견은 조기 발견과 맞춤형 관리의 새로운 기회를 열어줄 수 있습니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_3-개와-고양이-암-영양학의-단백질-권장량-수정"><b>개와 고양이 암 영양학의 단백질 권장량 수정</b></a>
<div>국제 학술지의 종양 영양학 리뷰에서 개와 고양이의 암 환자 단백질 권장량 표시에 오류가 발견되어 수정되었습니다. 임상 현장에서 영양 처방의 정확성을 위해 수정된 수치를 확인하는 것이 중요합니다.</div>
<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_4-개-타우린-대사와-심장건강-최신-임상-영양학-전망"><b>개 타우린 대사와 심장건강: 최신 임상 영양학 전망</b></a>
<div>타우린은 개에서 조건부 필수 아미노산으로, 심장, 망막, 신경계 등 주요 기관의 기능을 조절합니다. 타우린 결핍은 개의 흔한 심장질환인 확장형 심근병증과 밀접하게 연관되어 임상적으로 중요합니다.</div>
<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_5-미국-보호자-46-비용-문제로-수의료-지연-경험"><b>미국 보호자 46%, 비용 문제로 수의료 지연 경험</b></a>
<div>2026년 Lovet Checkup Report에 따르면 미국 개·고양이 보호자 46%가 지난 1년간 비용 상승으로 수의료 이용을 지연하거나 건너뛴 경험이 있는 것으로 조사되었습니다.반면 응답자의 91%는 애완동물의 생명을 구하기 위해 부채를 감수할 의향이 있다고 답변하여 보호자의 의사결정과 실제 치료 접근성 사이의 괴리가 드러났습니다.</div>
<small>보호자 소통 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_6-응급수의과-전문수의사의-중환자관리-QA"><b>응급수의과 전문수의사의 중환자관리 Q&amp;A</b></a>
<div>응급수의가 중환자관리의 핵심과 일반적인 응급실 오해에 대해 설명했습니다. 한국 동물병원에서 응급환자를 다루는 실무에 바로 적용할 수 있는 통찰을 담았습니다.</div>
<small>임상 · DVM360</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_7-고양이-소화선-종양-연관-급성-근무력증-1례"><b>고양이 소화선 종양 연관 급성 근무력증 1례</b></a>
<div>11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.</div>
<small>임상 · Veterinary Sciences</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_8-고령-동물-관절염-통증-약물비약물-복합-관리의-실제"><b>고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제</b></a>
<div>강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_9-가바펜틴트라조돈-말고-진정-프로토콜이-안-먹힐-때"><b>가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때</b></a>
<div>수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.</div>
<small>임상 · Dr. Andy Roark · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_10-수가-진료실-AI-필기-도구-도입이-필요한-이유"><b>수가 진료실 AI 필기 도구, 도입이 필요한 이유</b></a>
<div>미국 수의사 Patty Khuly 박사가 수개월간 다양한 AI 수의사 필기 앱을 테스트한 결과를 소개합니다. 진료 기록 작성에 대한 부담을 줄이고 환자 케어에 더 많은 시간을 할애할 수 있는 이 도구의 가치를 설명합니다.</div>
<small>병원 경영 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_11-수의사-고객-준수율-높이는-5가지-방법"><b>수의사 고객 준수율 높이는 5가지 방법</b></a>
<div>동물병원에서 최고의 치료 계획도 고객이 집에서 이행하지 않으면 의미가 없습니다. 전문 매체가 고객 준수를 높이는 구체적인 전략을 제시했습니다.</div>
<small>보호자 소통 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-W30_12-개-척수-수막염에서-발견된-진균성-농피전증-1례"><b>개 척수 수막염에서 발견된 진균성 농피전증 1례</b></a>
<div>영국에서 미니어처 슈나우저 한 마리의 척수에서 진균 감염이 발생한 드문 사례가 보고되었습니다. MRI와 조직검사를 통해 진균성 농피전증으로 확인되었고, 수술과 항진균제로 치료 후 증상이 호전된 사례입니다.</div>

<script id="vm-issue" type="application/json">{"date":"2026-W30","dateLabel":"2026-W30","dateline":"2026-W30 주간 요약 · 이번 주 가장 주목한 기사","editionNo":"2026 · W30","count":12,"cats":[{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"}],"articles":[{"id":"2026-W30_1","day":"2026-W30","ts":1784741468000,"cat":"clinical","kicker":"임상","isToday":false,"title":"수의 수술실 효율화, 입체적 배치 전략","dek":"수의학적 수술의 질은 단순한 술기 능숙도뿐 아니라 수술실과 준비공간의 배치에 의해 크게 영향을 받습니다. 고체화량 중성화 진료부터 복합적인 전문 술기까지, 원활한 수술 일정은 환자·보호자·의료팀을 위한 종합적인 준비에서 시작됩니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/july-2026-surgical-insights.jpg","sourceUrl":"https://www.veterinarypracticenews.com/space-final-frontier-surgical-efficiency/","body":["수술 전 준비단계는 수술실 입실 전 시작됩니다. 혈액검사, 방사선, 초음파 등 술 전 진단이 완료되어 마취 계획이 세워져 있어야 하며, 정맥 카테터 삽입, 마취 유도, 수술 부위 제모, 초기 소독 및 신경차단 등이 준비공간에서 이루어져야 합니다. 이 공간에는 마감 장비와 환자 보온 장비를 배치하되 불필요한 왕래를 최소화하고, 가능하다면 영상진단실과 가까운 위치가 이상적입니다.","환자를 수술실로 이동시킨 후에는 수술대 위치, 마취 담당자 동선, 조명 각도, 가스 호스 배치 등이 술 효율성을 결정합니다. 연부조직과 정형외과 전담 수술실을 각각 운영하는 것이 가장 이상적이며, 더러운 술기에 전용실을 두면 수술 부위 감염을 줄일 수 있습니다. 천장 트랙 시스템을 활용한 사지 고정, 큰 모니터로 영상 확인, 최소 침습 시술을 위한 카메라와 insufflation 장비 배치 등 시술 종류에 따른 유연한 공간 구성이 필요합니다.","수술 후 회복 공간까지의 동선도 효율의 일부입니다. 수술이 마무리되면 환자는 짧은 거리로 회복 구역으로 이동해야 하며, 이 모든 과정이 깔끔하고 정리된 환경에서 이루어져야 먼지와 교차 오염을 방지하고 소독을 효율적으로 수행할 수 있습니다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원 수술실, 이렇게 개선해보세요’ 시리즈로 실제 레이아웃 사진과 함께 소개하면 읽는이와 흥미 유발에 효과적입니다.","blogAngle":["술 전 진단(혈액검사, 영상검사 등)이 완료된 상태에서 마취 계획을 수립하고 수술실 입실 전 모든 준비를 마쳐야 합니다.","수술실에는 시술 유형에 맞는 전용 공간 확보가 이상적이며, 장비는 닫힌 수납장에 보관하고 명확히 구분된 수급함으로 신속하게 꺼낼 수 있어야 합니다.","마취 담당자는 준비실과 수술실 모두에서 장비에 접근하기 쉬워야 하며, 응급 약물과 reversal agents는 즉시 사용 가능한 곳에 비치해야 합니다.","최소 2명 이상의 인력이 기본이며, 수술 필드 오염 없이 모든 팀원이 역할을 수행할 수 있는 공간 배치가 필수적입니다."],"radar":{"owner":null,"clinical":"자신의 병원 수술실 동선, 장비 배치, 준비공간-수술실-회복실 연결성을 점검하고 개선할 점을 점검하시오.","evidence":null},"tag":""},{"id":"2026-W30_2","day":"2026-W30","ts":1784722397000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 만성신장질환, 장내 대사물질 변화와 연관 발견","dek":"네스커 퓨리나 연구팀과 미국 대학 연구자들이 고양이의 만성신장질환(CKD)이 장내 대사물질의 변화와 관련이 있다는 증거를 보고했습니다. 이 발견은 조기 발견과 맞춤형 관리의 새로운 기회를 열어줄 수 있습니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-141993062.jpg","sourceUrl":"https://www.veterinarypracticenews.com/study-links-feline-ckd-to-changes-in-gut-metabolites/","body":["네스커 퓨리나 연구소와 텍사스 A&M 대학, 오하이오 주립대학, 펜실베이니아 대학, 캔zas 주립대학의 연구자들이 공동으로 108마리의 고양이를 대상으로 연구를 수행했습니다. 이 고양이들은 건강한 동물과 다양한 단계의 만성신장질환 고양이들을 포함했습니다. 연구 결과는 시애틀에서 열린 미국수의내과학회 포럼에서 6월 12일에 발표되었습니다.","연구팀은 만성신장질환 고양이들에서 독특한 대사 프로파일이 확인되었으며, 많은 변화가 지방과 관련된 화합물에서 발견되었습니다. 특히 N1-methyl-2-pyridone-5-carboxamide(2PY)가 만성신장질환과 가장 강하게 연관된 분변 표지자로 나타났습니다. 초기 질환 단계에서도 혈청 2PY 수치가 증가했으며, 질환 심각도가 증가할수록 농도가 상승했습니다. 또한 만성신장질환 고양이들은 분지 사슬 지방산 농도도 높게 나타나 장내 미생물 활동의 변화를 시사합니다.","이 연구 결과는 고양이 만성신장질환에서 장-신장 축이 질환 병태생리와 장 대사에서 중요한 역할을 할 수 있음을 강조합니다. 연구 저자 Dr. Jonny Li는 이는 조기 발견과 더 표적화된 관리의 새로운 기회를 열어줄 수 있다고 밝혔습니다. 한국의 동물병원에서는 이 연구 결과를 바탕으로 만성신장질환 고양이들의 장 건강 모니터링 가능성을 고려해 볼 수 있습니다."],"blog":"한국 동물병원 블로그에서는 고양이 만성신장질환의 장 건강 관리의 중요성과 최신 연구 동향을 다루는 콘텐츠로 활용할 수 있습니다.","blogAngle":["108마리의 고양이(정상 고양이 및 다양한 단계의 만성신장질환 고양이)를 대상으로 한 연구에서 장내 대사물질의 변화가 확인되었습니다.","2PY(N1-methyl-2-pyridone-5-carboxamide)가 만성신장질환과 가장 강하게 연관된 분변 표지자로 확인되었으며, 질환 심각도와 농도가 비례합니다.","만성신장질환 고양이들은 분지 사슬 지방산 농도가 높아 장내 미생물 활동의 변화를 나타냅니다.","장-신장 축의 관찰은 고양이 만성신장질환의 조기 발견과 맞춤형 관리에 새로운 기회를 제공할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"고양이 신장병은 분변으로 조기 발견할 수 있다고 들었는데, 실제로 가능한가요?","script":"아직 임상에서 바로 사용 가능한 검사는 아니에요. 하지만 연구에서 분변 표지자 2PY가 초기 CKD 고양이에서도 증가하는 게 확인되었으니, 앞으로 검사로 개발되면 조기 발견에 도움이 될 수 있을 거예요. 현재는 정기적인 혈액·요검사 외에 몸무게 변화나 수분 섭취량 같은 일상 관찰이 중요해요."},"clinical":"CKD 고령묘 진료 시 장 증상(구토, 설사, 식욕 저하) 문진 항목을 추가하고, 장-신장 축 관련 최신 연구문을 주기적으로 검토하여 영양 관리 상담에 반영할 준비를 갖추세요.","evidence":null},"tag":""},{"id":"2026-W30_3","day":"2026-W30","ts":1784771627248,"cat":"clinical","kicker":"임상","isToday":false,"title":"개와 고양이 암 영양학의 단백질 권장량 수정","dek":"국제 학술지의 종양 영양학 리뷰에서 개와 고양이의 암 환자 단백질 권장량 표시에 오류가 발견되어 수정되었습니다. 임상 현장에서 영양 처방의 정확성을 위해 수정된 수치를 확인하는 것이 중요합니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1919852/full","body":["본 기사는 브라질 상파울루대학교 수의학부와 수의영양학 연구센터가 발표한 개의와 고양이 종양 영양학 종합 리뷰의 수정 공고입니다. 원본 기사에서는 단백질과 아미노산 섹션의 특정 단락에서 인용 표시에 오류가 있었으며, 권장량에 관한 참고문헌이 누락되어 있었습니다.","수정된 내용에 따르면, 인간 암 환자의 경우 체중 1kg당 하루 1.2~1.5g의 단백질 섭취가 권장되는데, 이는 건강인 권장량보다 50~87.5% 높은 수치입니다. 개와 고양이 암 환자의 경우 체중 1kg당 하루 1.0~1.2g의 단백질을 하루에 걸쳐 균등하게 섭취하도록 권장하고 있으며, 근육 소모(cachexia)나 근감소증(sarcopenia)이 있는 환동물은 유지 관리 수준의 1.5~2배까지 단백질 섭취를 늘려야 할 수 있습니다.","한국 동물병원 현장에서 종양 환동물의 영양 처방을 진행할 때, 단백질 섭취량 결정은 치료 성과에 중요한 영향을 미칩니다. 특히 진행성 종양으로 인한 근육 손실을 방지하기 위해서는 동물체의 상태를 면밀히 평가한 후 맞춤형 영양 관리가 필요하며, 원문의 구체적 권장량을 참고하여 임상에 적용하는 것이 권장됩니다."],"blog":"한국 동물병원 블로그에서 종양 환동물의 영양 관리 어려움을 겪는 보호자들에게 단백질 섭취의 중요성을 안내하는 콘텐츠로 활용할 수 있습니다","blogAngle":["인간 암 환자의 단백질 권장량은 건강인 대비 50~87.5% 증가한 1.2~1.5g/kg/일입니다","개와 고양이 암 환자의 단백질 권장량은 1.0~1.2g/kg/일이며 하루에 균등 분배가 권장됩니다","근육 소모나 근감소증이 있는 환동물은 유지량의 1.5~2배 단백질이 필요할 수 있습니다","종양 환동물의 영양 처방 시 동물체의 개별 상태에 맞춘 맞춤형 관리가 중요합니다"],"radar":{"owner":{"soon":true,"q":"강아지가 종양 진단받았는데 단백질 얼마나 먹여야 건강한가요?","script":"암 환동물은 근육 손실을 예방하기 위해 평소보다 많은 단백질이 필요하지만, 너무 많이 주어도 신장에 부담을 줄 수 있습니다. 현재 체중 1당 하루 1~1.2g 정도를 참고하되, 반드시 혈액검사 결과와 전반적인 건강 상태를 확인한 뒤 처방해 드려야 합니다."},"clinical":"종양 환동물 영양 처방 시 수정된 단백질 권장량(1.0~1.2g//일) 적용하고, 근육 소모가 현저한 환자에서는 1.5~2배로 조정 가능함을 진료 프로토콜에 반영한다.","evidence":null},"tag":""},{"id":"2026-W30_4","day":"2026-W30","ts":1784771626248,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 타우린 대사와 심장건강: 최신 임상 영양학 전망","dek":"타우린은 개에서 조건부 필수 아미노산으로, 심장, 망막, 신경계 등 주요 기관의 기능을 조절합니다. 타우린 결핍은 개의 흔한 심장질환인 확장형 심근병증과 밀접하게 연관되어 임상적으로 중요합니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1812065/full","body":["반려 및 활동 개에 대한 사회적 관심이 높아짐에 따라 건강 관리와 영양학 연구가 활발해지고 있습니다. 타우린은 비단백질성 아미노산으로 독특한 생물학적 활성을 가지며, 개의 건강 유지를 위한 필수적인 기능적 영양소로 주목받고 있습니다.","본 리뷰는 개에서 타우린의 생합성, 조직 분포, 핵심 생리적 기능을 체계적으로 정리합니다. 특히 심장, 망막, 신경계, 생식 시스템, 지질 대사 등 다양한 기관에서의 조절 기전을 분석하며, 타우린 결핍과 개의 확장형 심근병증 간의 기전적 연관성을 중점적으로 다릅니다. 또한 품종별 유전적 변이, 몸집 크기, 생리적 단계, 식이 조성에 따른 타우린 항상성 영향 요인을 검토합니다.","개체별로 내인성 타우린 합성 능력에 상당한 차이가 있으며, 이는 다양한 조건에서 동적인 생리적 요구량을 충족하기 어렵다는 것을 의미합니다. 따라서 외부 식이 보충이 타우린 항상성을 유지하고 개 건강을 지원하는 핵심 전략으로 자리 잡고 있습니다. 한국 동물병원에서는 특히 확장형 심근병증 위험 집합인 특정 대형 품종에서 타우린 상태 평가가 예방 및 관리에 중요할 것으로 사료됩니다."],"blog":"개 확장형 심근병증 환자를 진료할 때 타우린 결핍 가능성을 반드시 검토하고, 특히 위험 품종에 대해서는 예방적 타우린 보충을 권고하는 콘텐츠를 블로그에 작성해 보세요.","blogAngle":["타우린은 개의 심장, 망막, 신경계, 생식 시스템, 지질 대사에 핵심적인 역할을 합니다.","타우린 결핍은 개의 확장형 심근병증과 밀접하게 연관되어 있으며 기전적 이해가 필요합니다.","품종, 몸집 크기, 생리 단계에 따라 타우린 요구량이 달라져 개별화된 영양 관리가 필요합니다.","대부분의 개에서 내인성 합성만으로는 불충분하여 식이 보충이 권장됩니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 심장 건강을 위해 타우린 보충제가 필요할까요?","script":"타우린은 심장 건강에 중요한 영양소이지만, 모든 개에게 무조건 보충이 필요한 건 아닙니다. 특히 대형 품종이나 심장병 위험이 있는 경우 수의사가 검사를 통해 판단할 수 있습니다. 평소에는 균형 잡힌 사료로 충분한 경우가 많습니다."},"clinical":"대형 품종(도베르만, 복서, 그레이트 데인 등) 진료 시 확장형 심근병증 위험 평가를 위해 타우린 상태 관련 문진을 일상적으로 포함시키는 것을 검토하세요.","evidence":null},"tag":""},{"id":"2026-W30_5","day":"2026-W30","ts":1784660444000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"미국 보호자 46%, 비용 문제로 수의료 지연 경험","dek":"2026년 Lovet Checkup Report에 따르면 미국 개·고양이 보호자 46%가 지난 1년간 비용 상승으로 수의료 이용을 지연하거나 건너뛴 경험이 있는 것으로 조사되었습니다.반면 응답자의 91%는 애완동물의 생명을 구하기 위해 부채를 감수할 의향이 있다고 답변하여 보호자의 의사결정과 실제 치료 접근성 사이의 괴리가 드러났습니다.","source":"Veterinary Practice News","country":"미국","date":"07.21","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-Worried-Woman-Taking-Care-Of-W-463023999-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/report-highlights-financial-barriers-shaping-veterinary-care-decisions/","body":["이번 조사는 독립 연구기관 Censuswide가 미국 개·고양이 보호자 2,000명을 대상으로 실시했으며, 비용이 수의료 이용의 가장 큰 장벽임이 확인되었습니다.응답자 44%가 가장 최근에 수의사가 필요했을 때 비용 문제로 진찰을 거의 받지 못했으며, 25%는 증상이 심각한지 판단이 어려워 진료를 미룬 것으로 파악되었습니다.","온라인 정보에 대한 의존도도 두드러졌습니다.응답자의 80%가 수의사를 방문하기 전에 온라인에서 증상을 검색했으며, 이는 2025년 75%에서 증가한 수치입니다.34%는 애완동물이 아플 때 가장 먼저 온라인이나 AI를 검색하며, 25%는 온라인·AI 정보에 의존한 후 진료를 미룬 것을 후회했다고 밝혔습니다.","재정적 부담은 진찰실 밖에서도 나타났습니다.응답자 37%가 지난 1년간 수의비 지불을 위해 카드 사용이나 대출을 했으며, 같은 비율이 수의비 지출을 위해 가계 지출을 줄였다고 응답했습니다.한국 동물병원에서도 비용 투명성 확보와 보호자Communication 강화가 중요해졌습니다."],"blog":"한국 동물병원 블로그에서 '수의비 관련 보호자 소통법' 또는 '온라인 정보 의존 위험성'을 다루는 콘텐츠 기획에 활용할 수 있습니다.","blogAngle":["미국 보호자 46%가 지난 1년간 비용 문제로 수의료 이용을 지연하거나 건너뛴 경험이 있습니다.","응답자 44%가 비용 문제로 진찰을 거의 받지 못하는 상황에 놓였으며, 25%는 증상 심각성 불확실성도 장벽이었습니다.","80%가 수의사 방문 전 온라인 검색을 하며, 34%는 애완동물 발병 시 가장 먼저 온라인·AI를 활용합니다.","37%가 수의비 지불을 위해 카드·대출을 사용했고, 같은 비율이 가계 지출을 줄였습니다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지가 아픈 것 같은데 비용이 부담스러워서 진료를 미뤄도 될까요?","script":"비용 문제는 진료 결정에 큰 부담이 되시죠. 증상이 심해 보이시면 가능한 빨리 검사가 필요하고, 비용에 대한 우려가시면 치료 옵션과 예상 비용을 미리 상담해보세요. 필요한 경우 분할 결제나 관련 지원 프로그램에 대해서도 물어보셔도 됩니다."},"clinical":"비용 관련 보호자 상담 시 치료 옵션별 예상 비용을 투명하게 안내하고, 필요시 분할 결제나 병원 내 지원 프로그램 정보 함께 제공하기","evidence":null},"tag":""},{"id":"2026-W30_6","day":"2026-W30","ts":1784659153000,"cat":"clinical","kicker":"임상","isToday":false,"title":"응급수의과 전문수의사의 중환자관리 Q&A","dek":"응급수의가 중환자관리의 핵심과 일반적인 응급실 오해에 대해 설명했습니다. 한국 동물병원에서 응급환자를 다루는 실무에 바로 적용할 수 있는 통찰을 담았습니다.","source":"DVM360","country":"","date":"07.21","read":"1분 읽기","plate":"DVM360","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMirAFBVV95cUxNN2ZyTjFfaWRwQ1RTOWdCOFhSRXkxb2xQTzZ5OEEwanVTalYzUHBDdGRBSXJ0aDhLWVJHbTh4VmRMX3hQQTdicjFSQV80S2h3TTdIRmR4Tks1clNyQmNzUVl1U2pHQWFuQWRPNnZ0THVkdmFvNmFPcWlRM0ZNc0lWa0c2ei1lNmxqTUdrWGtGWU12YTFhbVpUemtzd0REU0ljUjVOSzVudUJUaThJ?oc=5","body":["응급수의 진료에서는 환자의 상태를 빠르게 평가하고 중증도를 정확히 판단하는 것이 무엇보다 중요합니다. 전문 응급수의는 응급실에 내원하는 많은 동물들이 초기 상담에서 예상보다 훨씬 심각한 상태인 경우가 많다고ointerview에서 밝혔습니다. 이는 예방의학적 접근의 필요성을 강조하며, 평소 건강검진의 중요성을 뒷받침하는 사례입니다.","응급 상황에서 흔히 접하는 오해 중 하나는 \"응급실은 모든 것을 해결해 준다\"는 것입니다. 실제로 중환자관리에서는-owner의 적극적 참여와 지속적인 모니터링이 치료 성과에 큰 영향을 미칩니다. 또한 응급 상황에서의 불안정한 혈압 관리나 수액 요법 등에서 과도한 치료보다 적정한 치료가 더 중요하다는 점이 강조되었습니다.","한국 동물병원 관점에서 이 interview는 응급실 운영의 질적 향상에 도움이 되는Practical한 시사점을 제공합니다. 응급환자 진료 시-owner와의 충분한 커뮤니케이션과 치료 기대치 설정이 치료 만족도를 높일 수 있습니다. 또한 중환자관리에서 예방의학의 역할과 적정 치료의 중요성을 직원 교육에 반영하는 것이 권장됩니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원 응급실 이용 시 주의사항'이나 '응급 상황에서-owner가 알아야 할 5가지 사실'이라는 제목으로 응급실의 현실과 올바른 이용 방법을 안내하는 글로 활용할 수 있습니다","blogAngle":["응급환자 평가에서 초기 중증도 판별이 치료 방향을 결정하는 핵심 요소입니다","응급실 오해 중 하나는 모든 문제가 응급실에서 해결 가능하다는 기대입니다","중환자관리에서-owner의 적극적 참여와 지속적인 모니터링이 치료 성과에 중요합니다","적정한 치료가 과도한 치료보다 더 나은 결과를 낼 수 있습니다"],"radar":{"owner":{"soon":true,"q":"응급실에 갔을 때 우리 강아지/고양이 상태가 얼마나 심각한지 어떻게 알 수 있나요?","script":"응급실에서는 환자의 호흡, 맥박, 의식 상태 등을 빠르게 평가해서 중증도를 판단합니다. 생각보다 상태가 심각한 경우도 많으니, 초기 평가 결과를 잘 들어주시고 추가 검사가 필요한 경우 협조해 주세요."},"clinical":"응급환자 진료 시 보호자와의 충분한 커뮤니케이션과 치료 기대치 설정이 치료 성과에 영향을 미친다는 점 반영하여 응급실 운영 프로토콜을 점검합니다.","evidence":null},"tag":""},{"id":"2026-W30_7","day":"2026-W30","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 소화선 종양 연관 급성 근무력증 1례","dek":"11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/711","body":["획득성 근무력증은 아세틸콜린 수용체에 대한 자가항체가 원인인 신경근접합부 질환으로, 개에서는 잘 알려진 질환이지만 고양이에서는 보고가 드물며, 급속 진행되는 중증 사례는 예후가 불량한 것으로 알려져 있습니다. 이번 사례에서는 11세 중성화된 암컷 페르시안 고양이가 급성 후지 쇠약으로 내원하여 4일 만에 사지마비로 진행되었습니다.","초기 임상양상이 급성 다발성 신경근염과 유사하여 근전도검사를 실시한 결과 양전파파동과 근전섬유자극 전위가 관찰되었습니다. 영상진단 결과 거대식도 동반 없이 낭성 전종격동 종괴가 확인되었고, 호흡근 마비가 악화되어 좌측 늑간 개흉술을 통해 종양 적출술을 실시하였습니다. 수술 후 환자는 지속적인 호흡부전이 있어 재삽관 및 기계환기, 일시적 기관절개술이 필요하였으며, 조직병리 및 면역조직화학 검사로 소화선 종양이 확인되었습니다. 혈청 아세틸콜린 수용체 항체 역가도 현저히 상승하여 소화선 종양 연관 급성 근무력증으로 확정진단되었으나, 피리도스티그민과 프레드니솔론 치료에도 불구하고 환기는 의존적인 상태로 유지되어 수술 후 3일차에 안락사되었습니다.","한국 동물병원에서 이러한 사례를 접할 경우, 고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시켜야 하며, 특히 호흡근 마비의 조기 발견과 집중적인 환기 지원이 예후 결정에 중요함을 인식해야 합니다. 소화선 종양이 확인될 경우 종양 적출과 함께 면역억제 치료를 병행하되, 급속 진행 사례에서는 예후가 불량할 수 있음을 소유자에게 사전에 안내하는 것이 필요합니다."],"blog":"한국 동물병원 블로그에서는 고양이의 사지 쇠약 호발 시 감별진단으로서의 근무력증과 소화선 종양 선별의 중요성을 알리는 콘텐츠로 활용할 수 있습니다","blogAngle":["고양이 획득성 근무력증은 드문 질환이나, 소화선 종양이 동반된 중증 사례에서는 급격히 악화하여 사지마비와 호흡근 마비로 진행될 수 있습니다","발병 초기에는 급성 다발성 신경근염과 임상양상이 유사하여 감별진단이 어려울 수 있으며, 혈청 아세틸콜린 수용체 항체 검사와 영상진단이 중요합니다","소화선 종양 적출술 후에도 집중적인 환기 지원이 필요하며, 피리도스티그민과 프레드니솔론 등의 면역억제 치료에도 예후가 불량할 수 있습니다","호흡근 마비의 조기 인식과 신속한 진단, 집중적인 호흡기 관리가 치료 성공의 열쇠입니다"],"radar":{"owner":{"soon":true,"q":"고양이가 갑자기 다리가 약해지면 무슨 병 때문이에요?","script":"고양이가 갑자기 사지가 약해지는 경우는 여러 병이 있을 수 있어요. 그중 하나로 근육과 신경 사이 신호를 막아서 근육을 약하게 만드는 근무력증도 있답니다. 개에서는 흔한 병이지만 고양이에서는 드물고, 특히 진행이 빠르면 치료가 어렵답니다."},"clinical":"고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시키고, 호흡근 마비 모니터링 및 환기 지원 준비 상태를 점검할 것","evidence":null},"tag":""},{"id":"2026-W30_8","day":"2026-W30","ts":1783666824000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제","dek":"강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.","source":"Veterinary Practice News","country":"미국","date":"07.10","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/palliative-care-pain.jpg","sourceUrl":"https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/","body":["관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.","다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜틴(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.","비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다."],"blog":"한국 동물병원 블로그에서 '노령 강아지/고양이 관절염,-관리 제대로 알아보자'라는 제목으로 보호자를 위한 안내글로 활용할 수 있습니다","blogAngle":["고령 관절염 환자의 치료 목표는 완치가 아닌 통증 완화와 기능 유지입니다","NSAID 단독 치료로 부족할 때 가바펜틴, 아만타딘, 항-NGF 단일클론항체 등 보조 약물을 단계적으로 추가합니다","침구·레이저·전자기장 치료는 약물과 다른 경로로 진통 효과를 발휘해 고령 환자에서 유용합니다","운동 제한은 오히려 해롭고, 짧은 규칙적 산책과 수중 트레드밀이 근육 유지에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지 관절염 있는데, 약물 외에 통증 조절에 좋은 방법은 없나요?","script":"관절염은 노령 동물에서 완치가 어려운 흔한 질환입니다. 약물 치료뿐만 아니라 레이저나 펄스 전자기장 같은 보습 치료, 그리고 짧은 산책이나 수중 트레드밀 같은 적절한 운동도 통증 조절에 도움을 드릴 수 있습니다. 각 동물의 상태에 맞게 조합해서 조절해 보겠습니다."},"clinical":"고령 관절염 환자에게 NSAID 기본 처방 외에 비약물 치료(레이저, 펄스 전자기장, 수중 트레드밀) 옵션 상담 및 처방 고려","evidence":null},"tag":""},{"id":"2026-W30_9","day":"2026-W30","ts":1784174400000,"cat":"clinical","kicker":"임상","isToday":false,"title":"가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때","dek":"수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.","source":"Dr. Andy Roark","country":"미국","date":"07.16","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-408-blog-pic.jpg","sourceUrl":"https://drandyroark.com/when-the-chill-protocol-isnt-chilling/","body":["반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.","Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.","한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다."],"blog":"자꾸 손을 물거나 짖는 불안한 강아지에게 기존 진정제가 안 먹힐 때, 대안적 약물 선택과 올바른 용량 조절 방법을 진료 블로그에 정리하면 도움이 됩니다.","blogAngle":["가바펜틴과 트라조돈 외에 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 진정제 옵션이 있습니다","진정이 불안감을 감추고 있는지 확인하고, 단순 진정 아닌 근본적 불안 해소를 목표로 해야 합니다","집에서의 시험 투여와 안전 계획 수립이 중요하며, 에세프로메진 사용 시 주의가 필요합니다","불안이 심각한 환자에게는 수의 행동학 전문의와 상담하는 것이 권장됩니다"],"radar":{"owner":null,"clinical":"불안 동반 환자에서 가바펜틴/트라조돈 효과 없을 때 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 약물 도입을 고려하되, 진정만 되고 불안이 남아있는지는 반드시 재평가할 것","evidence":null},"tag":""},{"id":"2026-W30_10","day":"2026-W30","ts":1784746255000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수가 진료실 AI 필기 도구, 도입이 필요한 이유","dek":"미국 수의사 Patty Khuly 박사가 수개월간 다양한 AI 수의사 필기 앱을 테스트한 결과를 소개합니다. 진료 기록 작성에 대한 부담을 줄이고 환자 케어에 더 많은 시간을 할애할 수 있는 이 도구의 가치를 설명합니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/GettyImages-1423830925.jpg","sourceUrl":"https://www.veterinarypracticenews.com/why-you-need-ai-vet-scribe-asap/","body":["저는 1986년 맥킨토시 컴퓨터를 구매하고 전기차를 가장 먼저 구입한 사람이면서도, 수의 분야 생산성 앱 도입에는 보수적이었습니다. 제가 사용해본 대부분의 수의 생산성 앱은 다루기 어렵고 실제 문제를 해결하지 못해 실망스러운 경험이 있었습니다. 저는 기존 인류 건강관리 기술을 수정하여 우회하는 방법에 만족해 왔습니다.","저는 최근 여러 AI 수의 필기 앱을 테스트하면서 놀라운 성과를 발견했습니다. 이 도구는 진료실에 들어가 녹음을 시작하면 대화 내용을 텍스트로 전환하고 SOAP 노트와 클라이언트 요약문으로 자동 정리합니다. 제가 테스트한 앱들은 수의 전문 용어(BAR, PU/PD 등)를 이해하고 클라이언트에게 설명하는 복잡한 의료 정보를 변환하는 데 능합니다. 스페인어에서 영어로의 번역 기능도 뛰어나며, 제 이중 언어 진료소에 특히 유용합니다.","제가 경험한 가장 큰 단점은 AI 시스템이 여전히 세부 사항을 누락하거나 대화를 오해하거나 가상의 정보를 만들어낼 수 있다는 점입니다. 저는 클라이언트와 환자에게 등을 돌린 채 컴퓨터에 기대어 있는 대신 진료에 집중하고 제때 퇴근하면서도 환자가 받을 자격이 있는 수준의 의료 기록을 유지할 수 있는지 여부가 핵심 질문이라고 강조합니다. 한국 동물병원에서도 진료 효율화와 환자 케어 품질 향상을 위해 이 도구의 도입을 검토할 가치가 있습니다."],"blog":"한국 동물병원 블로그에서는 \"AI 필기 도구로 진료 효율화와 환자 케어 품질 향상시키기\"라는 제목으로, 도입 전 체크리스트와 실제 사용 후기를 공유하는 글을 작성할 수 있습니다.","blogAngle":["AI 수의 필기 도구는 진료실 대화를 실시간으로 텍스트로 변환하여 SOAP 노트와 클라이언트 요약문을 자동 생성합니다.","제가 테스트한 결과, 수의 전문 용어(BAR, PU/PD, Librela, Cytopoint, Cerenia 등)를 정확히 인식하고 클라이언트에게 이해하기 쉬운 언어로 변환합니다.","AI 필기 도구는 완벽하지 않으며, 저는 최종 의료 기록의 모든 단어에 대한 수의사 책임이 중요하다고 강조합니다.","저는 이 도구가 문서화 시간을 줄이고 화면을 보는 시간보다 클라이언트와 환자와 상호작용하는 시간을 늘린다고 결론지었습니다."],"radar":{"owner":{"soon":false,"q":"AI 필기 도구를 도입하면 진료 시간이 줄어들고 더 꼼꼼한 진료를 받을 수 있나요?","script":"AI 도구를 활용하면 진료 기록 작성 시간을 단축하여 진료에 더 집중할 수 있습니다. 다만 생성된 기록은 반드시 의사가 검토하고 보정하므로 안심하셔도 됩니다."},"clinical":"AI가 생성한 SOAP 노트와 클라이언트 요약문을 수의사가 반드시 검토·보정하는 검증 프로토콜을 수립하고 정기적으로 정확도를 점검할 것","evidence":null},"tag":""},{"id":"2026-W30_11","day":"2026-W30","ts":1784739614000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"수의사 고객 준수율 높이는 5가지 방법","dek":"동물병원에서 최고의 치료 계획도 고객이 집에서 이행하지 않으면 의미가 없습니다. 전문 매체가 고객 준수를 높이는 구체적인 전략을 제시했습니다.","source":"IVC Journal","country":"미국","date":"07.22","read":"1분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_s7qba9s7qba9s7qb-600x372.png","sourceUrl":"https://ivcjournal.com/5-ways-veterinary-professionals-can-improve-client-compliance/","body":["수의학에서 고객 준수(compliance)는 가장 큰 도전 과제 중 하나입니다. 연구에 따르면 고객은 진료 중 들은 정보의 일부만 기억하며, 많은 사람들이 추천 사항의 이유를 이해하지 못하거나 부담을 느껴 실행하지 못합니다.","첫째, 전문 의학 용어를 피하고 간단한 표현으로 설명해야 합니다. 예를 들어 '경구로 하루 2회 식사와 함께 투약하세요'를 '아침과 저녁 식사와 함께 알약을 하나씩 주세요'로 바꾸는 것입니다. 둘째, 서면 또는 디지털 요약지를 제공하여 집에서 참고할 수 있게 해야 합니다. 셋째, 모든 추천에 대한 '왜'를 설명해야 합니다. 치과 질환이 혈액으로 세균이 전파되어 신장, 간, 심장을 손상시킬 수 있다고 설명하면 고객의 동기가 높아집니다. 넷째, 클리닉을 나가기 전에 후속 예약을 확정하고, 전화나 문자 확인을 통해 중간 점검을 해야 합니다. 다섯째, 비용과 시간을 고려하여 대안 옵션을 제시해야 합니다.","한국 동물병원에서도 같은 원칙이 적용됩니다. 한국 고객들은 치료비와 방문 시간의 제약이 큰 만큼, 개별 상황을 고려한 유연한 조언이 필요합니다. 긍정적 피드백과 지속적인 관계 구축이 장기적인 치료 성과를 높입니다."],"blog":"한국 동물병원 블로그에서 '우리 병원 고객 준수율 높이는 방법'이라는 제목으로 직접 활용할 수 있는 실용적인 콘텐츠입니다","blogAngle":["고객은 진료 중 들은 정보의 일부만 기억하므로 서면 지침 제공이 필수적입니다","추천의 이유('왜')를 설명하면 고객의 동기와 준수율이 높아집니다","후속 예약을 미리 잡으면 실행 책임감이 높아지고 치료 효과를 평가할 수 있습니다","비용과 시간을 고려한 대안 옵션을 제시하면 현실적인 치료 계획이 됩니다"],"radar":{"owner":null,"clinical":"5가지 고객 준수 전략(간단한 용어, 서면 요약, '왜' 설명, 후속 예약 확정, 비용·시간 고려)을 병원 프로세스에 반영하여 팀 교육 및 환자 안내 자료 점검","evidence":null},"tag":""},{"id":"2026-W30_12","day":"2026-W30","ts":1784771618248,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 척수 수막염에서 발견된 진균성 농피전증 1례","dek":"영국에서 미니어처 슈나우저 한 마리의 척수에서 진균 감염이 발생한 드문 사례가 보고되었습니다. MRI와 조직검사를 통해 진균성 농피전증으로 확인되었고, 수술과 항진균제로 치료 후 증상이 호전된 사례입니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1882308/full","body":["진균성 중추신경계 감염은 개에서 매우 드문 질환입니다. 7살 수컷 미니어처 슈나우저가 급성으로 진행하는 후지 무력감과 비정상 보행으로 내원했습니다. 임상검사에서 후지 마비 소견을 보였으며, T3-L3 부위의 척수병변이 의심되어 MRI를 실시했습니다.","MRI에서 T12-T13 부위에 조영 증강되는 척수 내 병변이 발견되었으며, 심각한 척수 부종과 수막 강화 소견을 보였습니다. 뇌척수액 분석에서 단핵구성 세포 증가(309 cells/μL)와 단백질 증가가 확인되었으나, Neospara caninum과 Toxoplasma gondii 혈청검사는 음성이었습니다. Steroid 치료를 시작했으나 증상이 악화되어 탐색적 수술을 실시했습니다.","수술 중 T12-T13 부위에서 견고한 척수 내 종괴를 적출하였으며, 조직검사에서 진균사체를 동반한 염증성 농피전증으로 확인되었습니다. Fluconazole 치료를 시작하여 6개월 후 추적 MRI에서 병변이 완전히 사라졌으며, 뇌척수액 소견도 호전되었습니다. 이후 12개월간 치료를 지속했으며, 최종적으로 경미한 후지마비만 남기고 보행 가능한 상태로 유지되었습니다.","이 사례는 개에서 원인 불명의 수막척수염 감별진단에 진균 감염을 포함시켜야 함을 시사합니다. 특히 영상소견과 뇌척수액 소견이 비특이적이어서 최종 진단에 조직검사가 필수적이라는 점을 기억해야 합니다. 항진균제 치료와 수술적 감압이 효과적일 수 있으며, 장기 추적 관찰이 중요합니다."],"blog":"한국 동물병원에서는 원인 불명의 수막척수염 환자에서 진균 감염을 감별진단에 포함시키고, 영상소견과 뇌척수액 분석만으로 치료 반응이 없는 경우 조직검사를 고려해야 한다는 점을 블로그 글로 공유할 수 있습니다.","blogAngle":["7살 미니어처 슈나우저에서 척수 내 진균성 농피전증이 발생하여 후지 마비 증상을 보였습니다.","MRI에서 T12-T13 부위에 조영 증강되는 척수 내 병변이 관찰되었으며, 뇌척수액에서 단핵구성 세포 증가와 단백질 증가가 확인되었습니다.","수술적 적출과 Fluconazole 치료 후 6개월 만에 MRI상 병변이 완전히 사라졌습니다.","18개월 추적 동안 경미한 후지마비만 남기고 양호한 상태로 유지되었습니다."],"radar":{"owner":{"soon":false,"q":"우리 강아지가 갑자기 뒷다리가 힘들어졌는데, 진균 감염일 수도 있나요?","script":"진균성 척수 감염은 개에서 정말 드문 질환입니다. 보통 세균이나바이러스 감염이 더 흔하죠. 다만 원인 불명의 수막척수염이 있을 때는 진균도 감별 진단에 포함시킬 수 있습니다. 정확한 원인은 MRI와 뇌척수액 검사, 때로는 조직검사로만 알 수 있습니다."},"clinical":"신경학적 증상(후지 마비, 비정상 보행)을 보이는 개에서 영상소견과 뇌척수액 소견이 비특이적일 때, 원인 불명의 수막척수염 감별진단에 진균 감염을 포함시켜 조직검사를 통한 최종 진단을 고려할 것","evidence":null},"tag":""}],"stories":[],"weekly":true}</script>

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.

      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;

    +'<button data-act="prev" '+(prev?'':'disabled')+' style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:'+(prev?'var(--color-label-normal)':'var(--color-label-assistive)')+';cursor:'+(prev?'pointer':'default')+';font-family:inherit;font-size:14px;font-weight:700;padding:12px 16px;border-radius:10px;">'+ARL+' 이전</button>'
    +'<a href="'+e(a.sourceUrl)+'" target="_blank" rel="noopener nofollow" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:12px 14px;border-radius:10px;">원문 '+EXT+'</a>'

    +'</div></div>';
  }

    var d=S.draft, inner;
    if(d.loading){ inner='<div style="padding:56px 20px;text-align:center;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--color-label-neutral);">블로그 초안을 작성하고 있어요…</div><p style="margin:8px 0 0;font-size:13px;">담아둔 글감 '+d.n+'개로 초안을 만드는 중입니다. 10~20초 걸립니다.</p></div>'; }
    else if(d.error){ inner='<div style="padding:48px 20px;text-align:center;color:var(--color-status-negative,#ff4242);"><div style="font-weight:700;">초안 생성에 실패했어요</div><p style="margin:8px 0 0;font-size:13px;color:var(--color-label-alternative);">'+e(d.error)+'</p></div>'; }
    else if(d.result){
      var r=d.result;
      var titles=(r.titles||[]).map(function(t,i){return '<button data-act="copytitle" data-t="'+encodeURIComponent(t)+'" style="display:block;width:100%;text-align:left;border:1px solid var(--color-line-normal);background:var(--color-background-normal);border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--color-label-strong);">'+(i+1)+'. '+e(t)+'</button>';}).join('');
      var tags=(r.hashtags||[]).map(function(t){return '<span style="display:inline-block;font-size:12.5px;color:var(--color-primary-normal);background:rgba(0,102,255,.08);border-radius:99px;padding:3px 10px;margin:0 6px 6px 0;">'+e(t)+'</span>';}).join('');
      inner='<div style="padding:22px 24px 26px;">'
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin-bottom:8px;">제목 후보 (클릭하면 복사)</div>'+titles
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin:18px 0 8px;">본문</div>'
        +'<div style="white-space:pre-wrap;font-size:15px;line-height:1.85;color:var(--color-label-neutral);background:var(--color-background-alternative);border-radius:10px;padding:16px 18px;">'+e(r.body||'')+'</div>'
        +'<div style="margin:16px 0 8px;">'+tags+'</div>'
        +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button data-act="copydraft" style="display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 제목+본문+태그 전체 복사</button><button data-act="draftclose" style="border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 16px;border-radius:10px;">닫기</button></div>'
        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'
        +'</div>';
    }
    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,website:(document.getElementById('vm-hp')||{}).value||''})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?(res.already?'이미 구독 중입니다':'구독 신청 완료! 매일 아침 받아보세요'):(res.error||'잠시 후 다시 시도해 주세요')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  // SPA라 기사를 열어도 페이지 이동이 없어 GA4가 조회를 못 잡는다 — 직접 보낸다
  function track(a){
    if(typeof gtag!=='function'||!a) return;
    try{
      gtag('event','article_view',{article_id:a.id,article_title:a.title,category:a.cat,source:a.source,issue_date:a.day});
    }catch(e){}
  }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); track(byId[id]); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
