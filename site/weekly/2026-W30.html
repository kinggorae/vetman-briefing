 치료 중 혈구 수치로 TT4 추적 가능","description":"루마니아 연구팀이 메티마졸 치료 중인 고양이 갑상선기능항진증에서 적혈구 용적치(Hct)와 평균적혈구용적(MCV)이 갑상선호르몬 수치(T4)와 강하게 상관함을 확인했습니다. 혈구 검사로 치료 효과 모니터링이 가능할 수 있다는 새로운 증거입니다.","url":"https://news.vetmanlab.com/weekly/2026-W30#2026-W30_7","datePublished":"2026-07-18T00:00:00.000Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://www.mdpi.com/2306-7381/13/7/706","inLanguage":"ko"}},{"@type":"ListItem","position":8,"item":{"@type":"NewsArticle","headline":"개 귀염증 Pseudomonas aeruginosa의 항균제 저항성 위험성","description":"헝가리에서 채집된 개 귀염증 관련 Pseudomonas aeruginosa 110개 분리주를 분석한 연구에서 다제내성 균주가 상당 비율을 차지하는 것으로 확인되었습니다. 전장유전체 분석을 통해 획기적 저항성 유전자들이 다수 검출되었으며, 이는 경험적 항생제 치료의 한계를 보여줍니다.","url":"https://news.vetmanlab.com/weekly/2026-W30#2026-W30_8","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","datePublished":"2026-07-21T16:13:12.766Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1902036/full","inLanguage":"ko"}},{"@type":"ListItem","position":9,"item":{"@type":"NewsArticle","headline":"개·고양이 자동바늘생검-site 미봉합시 장누출 위험 평가","description":"자동 니들코어 장치로 실시한 전층 장 생검에서 바늘 구멍을 봉합하지 않아도 되는지를 검증한 연구가 발표되었습니다.","url":"https://news.vetmanlab.com/weekly/2026-W30#2026-W30_9","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","datePublished":"2026-07-21T16:13:11.766Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://www.frontiersin.org/journals/ve <body>
<div class="vm-page" id="vm" data-theme="light" style="min-height:100vh;background:var(--color-background-normal);color:var(--color-label-normal);font-family:var(--font-sans);"></div>
<noscript><div style="max-width:720px;margin:0 auto;padding:40px 20px;font-family:sans-serif;">
<h1>베트맨랩 VetMan 해외 브리핑 — 2026-W30</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 소화선 종양 연관 급성 근무력증 1례</h2><p><b>11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.</b></p>
<p>획득성 근무력증은 아세틸콜린 수용체에 대한 자가항체가 원인인 신경근접합부 질환으로, 개에서는 잘 알려진 질환이지만 고양이에서는 보고가 드물며, 급속 진행되는 중증 사례는 예후가 불량한 것으로 알려져 있습니다. 이번 사례에서는 11세 중성화된 암컷 페르시안 고양이가 급성 후지 쇠약으로 내원하여 4일 만에 사지마비로 진행되었습니다.</p><p>초기 임상양상이 급성 다발성 신경근염과 유사하여 근전도검사를 실시한 결과 양전파파동과 근전섬유자극 전위가 관찰되었습니다. 영상진단 결과 거대식도 동반 없이 낭성 전종격동 종괴가 확인되었고, 호흡근 마비가 악화되어 좌측 늑간 개흉술을 통해 종양 적출술을 실시하였습니다. 수술 후 환자는 지속적인 호흡부전이 있어 재삽관 및 기계환기, 일시적 기관절개술이 필요하였으며, 조직병리 및 면역조직화학 검사로 소화선 종양이 확인되었습니다. 혈청 아세틸콜린 수용체 항체 역가도 현저히 상승하여 소화선 종양 연관 급성 근무력증으로 확정진단되었으나, 피리도스티그민과 프레드니솔론 치료에도 불구하고 환기는 의존적인 상태로 유지되어 수술 후 3일차에 안락사되었습니다.</p><p>한국 동물병원에서 이러한 사례를 접할 경우, 고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시켜야 하며, 특히 호흡근 마비의 조기 발견과 집중적인 환기 지원이 예후 결정에 중요함을 인식해야 합니다. 소화선 종양이 확인될 경우 종양 적출과 함께 면역억제 치료를 병행하되, 급속 진행 사례에서는 예후가 불량할 수 있음을 소유자에게 사전에 안내하는 것이 필요합니다.</p>
<p>원문: <a href="https://www.mdpi.com/2306-7381/13/7/711" rel="nofollow">Veterinary Sciences</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제</h2><p><b>강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.</b></p>
<p>관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.</p><p>다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜틴(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.</p><p>비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때</h2><p><b>수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.</b></p>
<p>반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.</p><p>Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.</p><p>한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다.</p>
<p>원문: <a href="https://drandyroark.com/when-the-chill-protocol-isnt-chilling/" rel="nofollow">Dr. Andy Roark</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축</h2><p><b>5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했습니다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었습니다.</b></p>
<p>평일 아침 만원인 동물병원에서 5세 터리어 믹스견 ‘요기'가 3일 동안 기력 없고, 구토하며 식사를 거부하는 증상으로 내원했습니다. 입을 벌리자 잇몸과 피부, 눈의 흰자위가 황달 색으로 변해 있었고, 심박수 160회/분으로 빈맥을 보여 신체적 스트레스가 의심되었습니다. 병원 내 혈액검사에서 빌리루빈과 간효소가 크게 상승했으며, 자동 혈구계산기에서 망상적혈구 증가, 중성구성 백혈구 증가증, 빈혈, 그리고 혈소판 감소 가능성을 보였습니다.</p><p>해당 동물병원은 Vetscan Imagyst®라는 AI 혈액도말 분석기를 보유하고 있었습니다. 1~3분 내에 AI는 디지털 도말을 분석하여 적혈구, 백혈구, 혈소판의 형태학적 이상을 체계적으로 보고했습니다. 그 결과, 수동 현미경 검사에서 발견하기 어려웠던 형태학적 이상 소견이 명확히 제시되었으며, Zoetis 위원회 인증 임상병리학 전문가의 추가 검토를 통해 수 시간 만에 IMHA 확정 진단이 내려졌습니다.</p><p>한국 동물병원 관점에서 이 사례는 중대한 시사점을 제공합니다. 많은 국내 병원에서 혈액도말 판독 전문가가 부족하고, 외주 검사 결과 대기 시간이 길어 진단이 지연될 수 있습니다. AI 분석기는 이러한 격차를 줄이고, 초기 검사를 바탕으로 신속한 치료 결정을 가능케 합니다. 또한 환자 보호자에게 도말 이미지를 보여주며 질환을 설명하면 진료 만족도 향상에도 도움이 됩니다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/bringing-specialist-level-interpretation-in-clinic/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개의 가스트린종, 반복 수술과 혈청 가스트린 모니터링으로 장기 생존 사례</h2><p><b>개의 Rare 종양인 가스트린종이 진단 시 이미 높은 전이율을 보이며 완치가 어려운 것으로 알려졌으나, 반복 수술과 혈청 가스트린 농도 모니터링을 통해 10년 이상 생존한 사례 2례가 보고되었습니다.</b></p>
<p>가스트린종은 개의 췌장 비베타 세포에서 발생하는 Rare한 신경내분비 종양으로, 과도한 가스트린을 분비하여 위산 과다 분비를 유발합니다. 이 종양은 진단 시 이미 높은 전이율을 보이며, 수술적 완치가 어려운 것으로 알려져 있습니다. 현재까지 개의 가스트린종 수술 치료의 장기 예후에 대한 보고가 드물며, 질병 진행을 모니터링하는 확립된 방법도 없습니다.</p><p>이번 보고에서는 성견 2마리의 췌장 가스트린종을 수술적 절제로 치료한 사례를 소개합니다. 위산 과다로 인한 위장 증상은 양성자 펌프 억제제로 조절하였으며, 일차 종양과 전이 병소를 줄이기 위해 여러 차례 수술을 실시했습니다. 추적 관찰 기간 동안 혈청 가스트린 농도를 보조 모니터링 지표로 활용하였으며, 농도 변화를 바탕으로 추가 영상 검사를 시행하고 수술 결정에 참고했습니다. Case 1은 총 4회, Case 2는 총 3회의 수술을 받았으며, 두 마리 모두 위장 증상이 잘 조절되면서 장기 생존을 유지했습니다.</p><p>이 사례들은 개의 가스트린종에서 반복 수술이 종양량 감소와 증상 조절에 효과적일 수 있음을 보여줍니다. 특히 혈청 가스트린 농도의 변화가 재발이나 종양 진행을 조기에 포착하는 데 유용한 지표가 될 수 있다는 점을 시사합니다. 한국 동물병원에서는 가스트린종 의심 사례에서 수술 가능성을 고려하고, 추적 관찰 시 혈청 가스트린 농도 모니터링을 병행하는 전략을 검토할 수 있을 것입니다.</p>
<p>원문: <a href="https://www.mdpi.com/2306-7381/13/7/715" rel="nofollow">Veterinary Sciences</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개의 안와 종양 4례 분석: 수술적 치료와 보존적 치료 비교</h2><p><b>개 안와 부위에 발생한 종양 4례를 후향적으로 분석한 연구에서, 수술적 적출술을 받은 3마리 중 2마리가 55개월 생존을 달성했으나, 종양의 유형과 범위에 따라 결과가 크게 달라졌음을 보고했습니다.</b></p>
<p>개의 안와 종양은 상대적으로 흔하지 않지만 안구 돌출, 누액 과다, 제3안검선 선종 탈출 등의 증상으로 나타나며, 임상 검사만으로 초기 의심이 가능하고 전산단층촬영(CT)으로 종양의 위치와 범위를 파악한 후 조직검사로 최종 진단합니다.</p><p>이번 연구에서 확인된 종양은 골다발성 종양 2례, 염증성 근육아래세포종양 1례, 피지선암종 1례이었습니다. 3마리에게는 측안와 절개술과 부분 골절제술을 포함한 광범위 종양 적출술을 시행했고, 나머지 1마리에게는 보존적 치료를 실시했습니다. 수술을 받은 2마리의 생존 기간은 55개월이었던 반면, 보존적 치료를 받은 1마리는 4개월에 불과했습니다.</p><p>한국 동물병원에서 안와 종양 환자를 진료할 때는 CT 영상을 통한 정밀한 종양 범위 파악이 수술 계획에 필수적이며, 종양 유형에 따른 예후 차이를 소유자에게 충분히 설명하는 것이 중요합니다. 특히 종양 음성 절제연이 확인된 경우가 제한적이었으므로, 수술 가능성과 한계에 대한 현실적 기대치 설정이 필요합니다.</p>
<p>원문: <a href="https://www.mdpi.com/2306-7381/13/7/714" rel="nofollow">Veterinary Sciences</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 갑상선기능항진증 치료 중 혈구 수치로 TT4 추적 가능</h2><p><b>루마니아 연구팀이 메티마졸 치료 중인 고양이 갑상선기능항진증에서 적혈구 용적치(Hct)와 평균적혈구용적(MCV)이 갑상선호르몬 수치(T4)와 강하게 상관함을 확인했습니다. 혈구 검사로 치료 효과 모니터링이 가능할 수 있다는 새로운 증거입니다.</b></p>
<p>고양이 갑상선기능항진증은 노령묘에서 가장 흔한 내분비 질환입니다. 현재 표준 치료 모니터링은 총티록신(TT4) 검사로, 비용이 높고 접근성이 떨어지는 문제가 있습니다. 연구팀은 43마리의 일차성 갑상선기능항진증 묘를 대상으로 치료 전(Baseline), 치료 1개월, 3개월, 6개월 후 시점에서 적혈구 용적치(Hct), 혈색소(Hgb), 평균적혈구용적(MCV), ALT, TT4를 측정했습니다.</p><p>결과적으로 TT4는 Hct(r=0.875~0.943), MCV(r=0.907~0.964), Hgb(r=0.836~0.946), ALT(r=0.919~0.981)와 매우 강한 양의 상관관계를 보였습니다. 특히 개인묘 내에서 Hct(rmcorr r=0.873)와 MCV(rmcorr r=0.881)가 TT4 추적을 잘 반영했습니다. ROC 분석에서는 치료 3개월 후 Hct ≥35.2%가 최적 절단값으로 민감도 96.7%, 특이도 92.3%를 나타냈습니다. 치료 중단 후 혈구 수치는 치료 전 값으로 돌아갔으며, 이는 이 수치가 갑상선기능항진증의 병태생리를 반영함을 보여줍니다.</p><p>한국 동물병원 관점에서, 혈구 수치 모니터링이 TT4 검사를 완전히 대체하진 못하나 보완 도구로 활용될 수 있습니다. 특히 외래 방문 사이 간격이 길어 TT4 재검사가 지연될 때, Hct나 MCV 상승이 치료 통제 상실을 시사하는 신호가 될 수 있습니다. 혈액 검사만으로 갑상선 호르몬 변화를 추정할 수 있다면 비용 절감과 접근성 향상에 기여할 수 있을 것입니다.</p>
<p>원문: <a href="https://www.mdpi.com/2306-7381/13/7/706" rel="nofollow">Veterinary Sciences</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개 귀염증 Pseudomonas aeruginosa의 항균제 저항성 위험성</h2><p><b>헝가리에서 채집된 개 귀염증 관련 Pseudomonas aeruginosa 110개 분리주를 분석한 연구에서 다제내성 균주가 상당 비율을 차지하는 것으로 확인되었습니다. 전장유전체 분석을 통해 획기적 저항성 유전자들이 다수 검출되었으며, 이는 경험적 항생제 치료의 한계를 보여줍니다.</b></p>
<p>개 귀염증은 개에서 흔히 발생하는 질환으로, 특히 만성·재발성·치료 저항성 증례에서 Pseudomonas aeruginosa가 주요 원인균으로 작용합니다. 이 균은 외막 투과성이 낮고 biofilm을 형성하며, efflux 시스템을 갖추고 있어 항생제에 대한 내성이 강합니다. 경험적 치료가 어려운 만큼 지역별 감시 데이터 확보가 중요합니다.</p><p>이번 연구는 부다페스트 수의과학대학에서 110개 분리주를 대상으로 14종 항생제 및 소독제에 대한 최소억제농도(MIC) 검사를 실시했습니다. 70개 균주는 전장유전체 분석에 의해 유전적 저항성 결정인자들이 분석되었으며, 다제내성 균주에서 획기적 내성유전자(CARD 데이터베이스 기준)가 다수 확인되었습니다.</p><p>한국 동물병원에서도 만성 귀염증 증례에서 P. aeruginosa 감수성 검사가 더욱 중요해질 것으로 보입니다. 특히 광범위 항생제 사용 경험을 가진 증례에서는 genomic 분석을 통한 맞춤형 치료 전략이 필요할 수 있습니다. 국내 동물 유래 P. aeruginosa의 저항성 현황에 대한 추가 조사가 기대됩니다.</p>
<p>원문: <a href="https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1902036/full" rel="nofollow">Frontiers in Veterinary Science</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개·고양이 자동바늘생검-site 미봉합시 장누출 위험 평가</h2><p><b>자동 니들코어 장치로 실시한 전층 장 생검에서 바늘 구멍을 봉합하지 않아도 되는지를 검증한 연구가 발표되었습니다.</b></p>
<p>이 연구는 개의 전자동 바늘 생검 기구(16게이지)를 활용하여 개와 고양이 소장에서 전층 생검을 실시한 후, 바늘 구멍을 봉합하지 않고 방치한 상태에서 장내 압력에 대한 견고성을 평가했습니다.</p><p>연구는 시체(in vitro) 실험과 생체(in vivo) 실험으로 나뉘었습니다. 시체 소장 39개 구간에서 평균 초기 누출 압력(ILP)은 20.7 mmHg로, 정상 생리적 최대 압력인 25 mmHg 이하에서 누출이 발생했습니다. 반면 생체 12마리(개 8마리, 고양이 4마리)에서 측정한 평균 ILP는 85.66 mmHg로, 모든 측정값이 26 mmHg 이상이었습니다.</p><p>시체 모델은 생체와 달리 혈류 및 조직 탄력성이 없어 장 압력 평가에 부적합한 것으로 나타났습니다. 생체에서는 1.3 mm 크기의 작은 바늘 구멍이 즉시 봉합하지 않아도 생리적 최대 압력 이상을 견디지만, 장기 치유 과정은 이번 연구에서 평가되지 않아서 일상적인 봉합이 필요한지에 대한 최종 결론은 내리지 못했습니다.</p>
<p>원문: <a href="https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1870783/full" rel="nofollow">Frontiers in Veterinary Science</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개 직장 근수막외 형질세포종으로 간 전이 사례 – 멜팔란 치료 프로토콜 수정</h2><p><b>미국에서 발생한 개의 직장 근수막외 형질세포종 사례가 Surgical excision 후 5개월 만에 간 전이로 발견되었으며, 치료 프로토콜을 수정한 펄스용량 멜팔란 요법으로 19개월 이상 생존을 연장한 사례가 보고되었습니다.</b></p>
<p>개에서 발생하는 근수막외 형질세포종(EMP)은 전체 개의 종양 중 약 2.4%를 차지하는 가장 흔한 형질세포 신생물입니다. 주로 피부(86%), 구강(9%), 직장(4%)에 발생하며, 피부와 구강에 발생한 EMP는 보통 양성으로 수술적 절제가 효과적입니다. 그러나 비피부 부위에서 발생한 EMP는 더 높은 악성 잠재력과 림프절 및 내장 전이 위험을 갖는 것으로 알려져 있습니다.</p><p>이번 사례는 10세 이상의 수컷 말티즈가 직장 EMP로 완전 절제 받았으나 5개월 후 다발성 간 형질세포종으로 재발한 경우입니다. 다발성골수종 증거 없이 간 전이만 확인되면서 펄스용량 멜팔란과 프레드니손 병용 요법을 시작하였으나, 골수억제 부작용으로 치료 프로토콜을 수정해야 했습니다. 멜팔란 투여 기간을 단축하는 방식으로 개별화한 결과, 초음파상 간 병변의 호전과 함께 진단 후 19개월 이상 생존을 달성했습니다.</p><p>한국 동물병원 관점에서 이 사례는 비피부 부위 EMP의 전이 가능성을 경고하는 동시에, 부작용 발생 시 치료 프로토콜의 유연한 조정이 가능함을 보여줍니다. 직장 EMP 수술 후 특히 간 전이에 대한 추적 관찰이 중요하며, 멜팔란 치료 시 골수억제 부작용 관리 전략이 필요할 수 있습니다.</p>
<p>원문: <a href="https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1854150/full" rel="nofollow">Frontiers in Veterinary Science</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>강아지 사회화, 평생의 자신감은 어린 시절부터</h2><p><b>강아지 사회화는 평생의 성격과 행동 패턴을 결정하는 중요한 시기입니다. 특정 시기에 다양한 경험을 쌓는 것이 성견의 두려움과 자신감에 큰 영향을 미친다는 연구 결과가 있습니다.</b></p>
<p>강아지 사회화의 핵심 시기는 생후 3주부터 14주까지입니다. 이 기간 동안 강아지는 새로운 사람, 동물, 환경, 소음, 표면 등을 경험하며 긍정적인 기억을 형성합니다. 이 시기의 경험이 부족하면 성견 때 두려움이나 공격성으로 이어질 수 있어 전문가들이 중요하게 강조하는 부분입니다.</p><p>훈련사와 수의사는 사회화 시기 강아지가 다양한 자극에 노출되도록 안내해야 합니다. 새로운 경험을할 때 강아지가 두려워하지 않도록 긍정적이고 점진적인 접근이 필요하며, 보상 기반 훈련이 효과적입니다. 강아지뿐 아니라 보호자 교육도 중요한데, 과도한 보호나 부적절한 노출은 오히려 역효과를 줄 수 있습니다.</p><p>한국 동물병원에서도 사회화 상담의 기회를 활용할 수 있습니다. 첫 예방접종 시기에 보호자에게 사회화의 중요성과 방법을 안내하고,ospital 환경에 대한 긍정적 노출을 돕는다면 강아지뿐 아니라 보호자 역시 병원 방문에 대한 스트레스를 줄일 수 있습니다. 이는 병원 충성도 향상에도 기여할 수 있습니다.</p>
<p>원문: <a href="https://news.google.com/rss/articles/CBMiqgFBVV95cUxQUzF6a3I1cHlsM1hqT1RfTjNwMHhOSHNFTk5KMG9iVWhmQkZLRWRpWkQ2b3hnSGJHVDY4Y0pvYW5oZE5wY0hnOWRhY0dac01JTjl6bEVrVzZhYlk4VHZKdVF1cUI2WHlDNFdtT0I3eU56SkQ0dV9HbENpTEE4NnlTSEZzcFBfMmFXaUNJc1MtNkhWcjB5UWVSRWNWbTFVbnIzb1o3dU9KTDNmQQ?oc=5" rel="nofollow">MSN</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>똑똑한 사회화 훈련으로 자신감 있는 강아지 키우기</h2><p><b>강아지 사회적 훈련(socialization)의 중요성이 강조되고 있습니다. 적절한 시기에 올바른 경험을 쌓으면 성격이 안정되고 문제 행동도 예방할 수 있다는 전문가 의견이 주목받고 있습니다.</b></p>
<p>강아지 사회화는 생후 3주에서 14주 사이에 가장 효과적이라는 연구 결과가 있습니다. 이 시기에 다양한 환경, 사람, 동물과 긍정적으로 접하게 하면 성격이 긍정적으로 발달하고 두려움을 줄일 수 있습니다. 다만 급격하거나 부정적인 경험은 오히려 역효과를 낳을 수 있어 주의가 필요합니다.</p><p>전문가들은 ‘노출(exposure)’과 ‘연상(association)’을 구분할 것을 권장합니다. 단순히 여러 환경을 보여주는 것뿐 아니라 각 경험을 긍정적으로 경험하게 만드는 것이 핵심입니다. treats와 칭찬을 활용하여 새로운 경험과 좋은 것을 연결시키는 것이 중요하며, 강아지의 속도를 맞춰주어야 합니다.</p><p>한국 동물병원에서도 사회적 훈련 관련 상담 요청이 증가하는 추세입니다. 수의사들은 예방의학적 관점에서 사회화의 중요성을 강조하며, 초기 문제 행동을 막기 위한 조기 개입의 필요성을 상담하고 있습니다. 특히 입원이나 진료 시 발생하는 스트레스를 줄이기 위해서도 평소 사회적 훈련이 도움이 된다는 점을 안내하고 있습니다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-W30","dateLabel":"2026-W30","dateline":"2026-W30 주간 요약 · 이번 주 가장 주목한 기사","editionNo":"2026 · W30","count":12,"cats":[{"key":"clinical","label":"임상"},{"key":"client_communication","label":"보호자 소통"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-W30_1","day":"2026-W30","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 소화선 종양 연관 급성 근무력증 1례","dek":"11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/711","body":["획득성 근무력증은 아세틸콜린 수용체에 대한 자가항체가 원인인 신경근접합부 질환으로, 개에서는 잘 알려진 질환이지만 고양이에서는 보고가 드물며, 급속 진행되는 중증 사례는 예후가 불량한 것으로 알려져 있습니다. 이번 사례에서는 11세 중성화된 암컷 페르시안 고양이가 급성 후지 쇠약으로 내원하여 4일 만에 사지마비로 진행되었습니다.","초기 임상양상이 급성 다발성 신경근염과 유사하여 근전도검사를 실시한 결과 양전파파동과 근전섬유자극 전위가 관찰되었습니다. 영상진단 결과 거대식도 동반 없이 낭성 전종격동 종괴가 확인되었고, 호흡근 마비가 악화되어 좌측 늑간 개흉술을 통해 종양 적출술을 실시하였습니다. 수술 후 환자는 지속적인 호흡부전이 있어 재삽관 및 기계환기, 일시적 기관절개술이 필요하였으며, 조직병리 및 면역조직화학 검사로 소화선 종양이 확인되었습니다. 혈청 아세틸콜린 수용체 항체 역가도 현저히 상승하여 소화선 종양 연관 급성 근무력증으로 확정진단되었으나, 피리도스티그민과 프레드니솔론 치료에도 불구하고 환기는 의존적인 상태로 유지되어 수술 후 3일차에 안락사되었습니다.","한국 동물병원에서 이러한 사례를 접할 경우, 고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시켜야 하며, 특히 호흡근 마비의 조기 발견과 집중적인 환기 지원이 예후 결정에 중요함을 인식해야 합니다. 소화선 종양이 확인될 경우 종양 적출과 함께 면역억제 치료를 병행하되, 급속 진행 사례에서는 예후가 불량할 수 있음을 소유자에게 사전에 안내하는 것이 필요합니다."],"blog":"한국 동물병원 블로그에서는 고양이의 사지 쇠약 호발 시 감별진단으로서의 근무력증과 소화선 종양 선별의 중요성을 알리는 콘텐츠로 활용할 수 있습니다","blogAngle":["고양이 획득성 근무력증은 드문 질환이나, 소화선 종양이 동반된 중증 사례에서는 급격히 악화하여 사지마비와 호흡근 마비로 진행될 수 있습니다","발병 초기에는 급성 다발성 신경근염과 임상양상이 유사하여 감별진단이 어려울 수 있으며, 혈청 아세틸콜린 수용체 항체 검사와 영상진단이 중요합니다","소화선 종양 적출술 후에도 집중적인 환기 지원이 필요하며, 피리도스티그민과 프레드니솔론 등의 면역억제 치료에도 예후가 불량할 수 있습니다","호흡근 마비의 조기 인식과 신속한 진단, 집중적인 호흡기 관리가 치료 성공의 열쇠입니다"],"radar":{"owner":{"soon":true,"q":"고양이가 갑자기 다리가 약해지면 무슨 병 때문이에요?","script":"고양이가 갑자기 사지가 약해지는 경우는 여러 병이 있을 수 있어요. 그중 하나로 근육과 신경 사이 신호를 막아서 근육을 약하게 만드는 근무력증도 있답니다. 개에서는 흔한 병이지만 고양이에서는 드물고, 특히 진행이 빠르면 치료가 어렵답니다."},"clinical":"고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시키고, 호흡근 마비 모니터링 및 환기 지원 준비 상태를 점검할 것","evidence":null},"tag":""},{"id":"2026-W30_2","day":"2026-W30","ts":1783666824000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제","dek":"강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.","source":"Veterinary Practice News","country":"미국","date":"07.10","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/palliative-care-pain.jpg","sourceUrl":"https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/","body":["관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.","다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜틴(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.","비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다."],"blog":"한국 동물병원 블로그에서 '노령 강아지/고양이 관절염,-관리 제대로 알아보자'라는 제목으로 보호자를 위한 안내글로 활용할 수 있습니다","blogAngle":["고령 관절염 환자의 치료 목표는 완치가 아닌 통증 완화와 기능 유지입니다","NSAID 단독 치료로 부족할 때 가바펜틴, 아만타딘, 항-NGF 단일클론항체 등 보조 약물을 단계적으로 추가합니다","침구·레이저·전자기장 치료는 약물과 다른 경로로 진통 효과를 발휘해 고령 환자에서 유용합니다","운동 제한은 오히려 해롭고, 짧은 규칙적 산책과 수중 트레드밀이 근육 유지에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지 관절염 있는데, 약물 외에 통증 조절에 좋은 방법은 없나요?","script":"관절염은 노령 동물에서 완치가 어려운 흔한 질환입니다. 약물 치료뿐만 아니라 레이저나 펄스 전자기장 같은 보습 치료, 그리고 짧은 산책이나 수중 트레드밀 같은 적절한 운동도 통증 조절에 도움을 드릴 수 있습니다. 각 동물의 상태에 맞게 조합해서 조절해 보겠습니다."},"clinical":"고령 관절염 환자에게 NSAID 기본 처방 외에 비약물 치료(레이저, 펄스 전자기장, 수중 트레드밀) 옵션 상담 및 처방 고려","evidence":null},"tag":""},{"id":"2026-W30_3","day":"2026-W30","ts":1784174400000,"cat":"clinical","kicker":"임상","isToday":false,"title":"가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때","dek":"수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.","source":"Dr. Andy Roark","country":"미국","date":"07.16","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-408-blog-pic.jpg","sourceUrl":"https://drandyroark.com/when-the-chill-protocol-isnt-chilling/","body":["반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.","Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.","한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다."],"blog":"자꾸 손을 물거나 짖는 불안한 강아지에게 기존 진정제가 안 먹힐 때, 대안적 약물 선택과 올바른 용량 조절 방법을 진료 블로그에 정리하면 도움이 됩니다.","blogAngle":["가바펜틴과 트라조돈 외에 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 진정제 옵션이 있습니다","진정이 불안감을 감추고 있는지 확인하고, 단순 진정 아닌 근본적 불안 해소를 목표로 해야 합니다","집에서의 시험 투여와 안전 계획 수립이 중요하며, 에세프로메진 사용 시 주의가 필요합니다","불안이 심각한 환자에게는 수의 행동학 전문의와 상담하는 것이 권장됩니다"],"radar":{"owner":null,"clinical":"불안 동반 환자에서 가바펜틴/트라조돈 효과 없을 때 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 약물 도입을 고려하되, 진정만 되고 불안이 남아있는지는 반드시 재평가할 것","evidence":null},"tag":""},{"id":"2026-W30_4","day":"2026-W30","ts":1784520024000,"cat":"industry","kicker":"업계","isToday":false,"title":"AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축","dek":"5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했습니다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었습니다.","source":"Veterinary Practice News","country":"미국","date":"07.20","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/Yogi-Hi-res-1-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/bringing-specialist-level-interpretation-in-clinic/","body":["평일 아침 만원인 동물병원에서 5세 터리어 믹스견 ‘요기'가 3일 동안 기력 없고, 구토하며 식사를 거부하는 증상으로 내원했습니다. 입을 벌리자 잇몸과 피부, 눈의 흰자위가 황달 색으로 변해 있었고, 심박수 160회/분으로 빈맥을 보여 신체적 스트레스가 의심되었습니다. 병원 내 혈액검사에서 빌리루빈과 간효소가 크게 상승했으며, 자동 혈구계산기에서 망상적혈구 증가, 중성구성 백혈구 증가증, 빈혈, 그리고 혈소판 감소 가능성을 보였습니다.","해당 동물병원은 Vetscan Imagyst®라는 AI 혈액도말 분석기를 보유하고 있었습니다. 1~3분 내에 AI는 디지털 도말을 분석하여 적혈구, 백혈구, 혈소판의 형태학적 이상을 체계적으로 보고했습니다. 그 결과, 수동 현미경 검사에서 발견하기 어려웠던 형태학적 이상 소견이 명확히 제시되었으며, Zoetis 위원회 인증 임상병리학 전문가의 추가 검토를 통해 수 시간 만에 IMHA 확정 진단이 내려졌습니다.","한국 동물병원 관점에서 이 사례는 중대한 시사점을 제공합니다. 많은 국내 병원에서 혈액도말 판독 전문가가 부족하고, 외주 검사 결과 대기 시간이 길어 진단이 지연될 수 있습니다. AI 분석기는 이러한 격차를 줄이고, 초기 검사를 바탕으로 신속한 치료 결정을 가능케 합니다. 또한 환자 보호자에게 도말 이미지를 보여주며 질환을 설명하면 진료 만족도 향상에도 도움이 됩니다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원에서도 도입 가능한 AI 진단 도구, 어떤 상황에서 도움이 되는가?’라는 주제로 클리닉 사례와 함께 소개하면 좋은 콘텐츠가 될 것입니다","blogAngle":["AI 혈액도말 분석은 수 시간 내 혈구 이상을 객관적으로 보고하여 신속한 진단을 가능케 합니다","IMHA와 같은 긴급 질환에서 치료 시작 시간 단축은 환자 예후에 직접적 영향을 미칩니다","AI 분석과 전문병리학 전문가 검토의 병행 모델이 정확도와 신뢰도를 높입니다","환자 보호자에게 형태학적 이상 소견을 시각적으로 보여주면 진료 설명과 신뢰 구축에 효과적입니다"],"radar":{"owner":null,"clinical":"AI 혈액도말 분석기 도입을 검토하고, 특히 황달·빈혈 환축에서 신속한 형태학적 분석이 필요한 경우 장비 활용도를 점검해 보세요.","evidence":null},"tag":""},{"id":"2026-W30_5","day":"2026-W30","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 가스트린종, 반복 수술과 혈청 가스트린 모니터링으로 장기 생존 사례","dek":"개의 Rare 종양인 가스트린종이 진단 시 이미 높은 전이율을 보이며 완치가 어려운 것으로 알려졌으나, 반복 수술과 혈청 가스트린 농도 모니터링을 통해 10년 이상 생존한 사례 2례가 보고되었습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/715","body":["가스트린종은 개의 췌장 비베타 세포에서 발생하는 Rare한 신경내분비 종양으로, 과도한 가스트린을 분비하여 위산 과다 분비를 유발합니다. 이 종양은 진단 시 이미 높은 전이율을 보이며, 수술적 완치가 어려운 것으로 알려져 있습니다. 현재까지 개의 가스트린종 수술 치료의 장기 예후에 대한 보고가 드물며, 질병 진행을 모니터링하는 확립된 방법도 없습니다.","이번 보고에서는 성견 2마리의 췌장 가스트린종을 수술적 절제로 치료한 사례를 소개합니다. 위산 과다로 인한 위장 증상은 양성자 펌프 억제제로 조절하였으며, 일차 종양과 전이 병소를 줄이기 위해 여러 차례 수술을 실시했습니다. 추적 관찰 기간 동안 혈청 가스트린 농도를 보조 모니터링 지표로 활용하였으며, 농도 변화를 바탕으로 추가 영상 검사를 시행하고 수술 결정에 참고했습니다. Case 1은 총 4회, Case 2는 총 3회의 수술을 받았으며, 두 마리 모두 위장 증상이 잘 조절되면서 장기 생존을 유지했습니다.","이 사례들은 개의 가스트린종에서 반복 수술이 종양량 감소와 증상 조절에 효과적일 수 있음을 보여줍니다. 특히 혈청 가스트린 농도의 변화가 재발이나 종양 진행을 조기에 포착하는 데 유용한 지표가 될 수 있다는 점을 시사합니다. 한국 동물병원에서는 가스트린종 의심 사례에서 수술 가능성을 고려하고, 추적 관찰 시 혈청 가스트린 농도 모니터링을 병행하는 전략을 검토할 수 있을 것입니다."],"blog":"가스트린종은 Rare하지만 한국의 동물병원에서도 의심 증상(만성 구토, 설사, 체중 감소)이 있는 환자에서 진단 가능하며, 혈청 가스트린 농도 모니터링과 수술적 치료 옵션을 가족에게 설명하는 근거 자료로 활용할 수 있습니다.","blogAngle":["개의 가스트린종은 진단 시 전이율이 높아 완치가 어렵지만, 수술적 절제가 장기 생존에 도움이 될 수 있습니다","혈청 가스트린 농도 변화가 종양 재발 및 진행 모니터링의 보조 지표로 활용 가능할 수 있습니다","반복 수술을 통해 일차 종양과 전이 병소를 감소시키면 증상 조절과 생존 기간 연장이 가능합니다","양성자 펌프 억제제는 가스트린종이 유발한 위산 과다 증상 조절에 중요한 약물 치료입니다"],"radar":{"owner":null,"clinical":"개의 가스트린종 의심 시 혈청 가스트린 농도 검사 가능성을 점검하고, 영상 추적 및 반복 수술 계획 수립을 사전에 검토하세요.","evidence":null},"tag":""},{"id":"2026-W30_6","day":"2026-W30","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 안와 종양 4례 분석: 수술적 치료와 보존적 치료 비교","dek":"개 안와 부위에 발생한 종양 4례를 후향적으로 분석한 연구에서, 수술적 적출술을 받은 3마리 중 2마리가 55개월 생존을 달성했으나, 종양의 유형과 범위에 따라 결과가 크게 달라졌음을 보고했습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"1분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/714","body":["개의 안와 종양은 상대적으로 흔하지 않지만 안구 돌출, 누액 과다, 제3안검선 선종 탈출 등의 증상으로 나타나며, 임상 검사만으로 초기 의심이 가능하고 전산단층촬영(CT)으로 종양의 위치와 범위를 파악한 후 조직검사로 최종 진단합니다.","이번 연구에서 확인된 종양은 골다발성 종양 2례, 염증성 근육아래세포종양 1례, 피지선암종 1례이었습니다. 3마리에게는 측안와 절개술과 부분 골절제술을 포함한 광범위 종양 적출술을 시행했고, 나머지 1마리에게는 보존적 치료를 실시했습니다. 수술을 받은 2마리의 생존 기간은 55개월이었던 반면, 보존적 치료를 받은 1마리는 4개월에 불과했습니다.","한국 동물병원에서 안와 종양 환자를 진료할 때는 CT 영상을 통한 정밀한 종양 범위 파악이 수술 계획에 필수적이며, 종양 유형에 따른 예후 차이를 소유자에게 충분히 설명하는 것이 중요합니다. 특히 종양 음성 절제연이 확인된 경우가 제한적이었으므로, 수술 가능성과 한계에 대한 현실적 기대치 설정이 필요합니다."],"blog":"한국 동물병원 블로그에는 안와 종양 의심 증상과 CT 진단의 중요성, 종양 유형별 예후 차이를 실제 사례와 함께 다룬 글감이 될 수 있습니다.","blogAngle":["6~8세 된 4마리 개의 안와 종양 사례를 분석했으며, 가장 흔한 임상 증상은 진행성 안구 돌출과 누액 과다였습니다.","3마리에게는 측안와 절개술을 포함한 광범위 종양 적출술을, 1마리에게는 보존적 치료를 실시했습니다.","수술적 치료를 받은 2마리의 생존 기간은 55개월이나, 조직학적으로 종양 음성 절제연이 확인된 경우는 1례에 불과했습니다.","보존적 치료를 받은 1마리의 생존 기간은 4개월에 불과했으며, 종양 유형과 범위에 따라 예후가 크게 달랐습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 눈이 많이 튀어나오고 눈물이 많은데, 혹시 안와 종양일 수 있을까요?","script":"안와 종양은 상대적으로 흔하지는 않지만 눈이 돌출되거나 눈물이 많이 나고 제3안검이 나오시는 증상이 있을 수 있습니다. 정밀한 검사와 CT로 종양 위치와 범위를 파악한 후 적절한 치료법을 결정하게 되세요."},"clinical":"안와 종양 의심 환자에게 CT 영상 분석을 포함한 정밀 검진과 함께 종양 유형별 예후 차이를 반드시 설명하고, 수술 가능성과 한계에 대한 현실적 기대치를 설정할 것","evidence":null},"tag":""},{"id":"2026-W30_7","day":"2026-W30","ts":1784332800000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 갑상선기능항진증 치료 중 혈구 수치로 TT4 추적 가능","dek":"루마니아 연구팀이 메티마졸 치료 중인 고양이 갑상선기능항진증에서 적혈구 용적치(Hct)와 평균적혈구용적(MCV)이 갑상선호르몬 수치(T4)와 강하게 상관함을 확인했습니다. 혈구 검사로 치료 효과 모니터링이 가능할 수 있다는 새로운 증거입니다.","source":"Veterinary Sciences","country":"","date":"07.18","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/706","body":["고양이 갑상선기능항진증은 노령묘에서 가장 흔한 내분비 질환입니다. 현재 표준 치료 모니터링은 총티록신(TT4) 검사로, 비용이 높고 접근성이 떨어지는 문제가 있습니다. 연구팀은 43마리의 일차성 갑상선기능항진증 묘를 대상으로 치료 전(Baseline), 치료 1개월, 3개월, 6개월 후 시점에서 적혈구 용적치(Hct), 혈색소(Hgb), 평균적혈구용적(MCV), ALT, TT4를 측정했습니다.","결과적으로 TT4는 Hct(r=0.875~0.943), MCV(r=0.907~0.964), Hgb(r=0.836~0.946), ALT(r=0.919~0.981)와 매우 강한 양의 상관관계를 보였습니다. 특히 개인묘 내에서 Hct(rmcorr r=0.873)와 MCV(rmcorr r=0.881)가 TT4 추적을 잘 반영했습니다. ROC 분석에서는 치료 3개월 후 Hct ≥35.2%가 최적 절단값으로 민감도 96.7%, 특이도 92.3%를 나타냈습니다. 치료 중단 후 혈구 수치는 치료 전 값으로 돌아갔으며, 이는 이 수치가 갑상선기능항진증의 병태생리를 반영함을 보여줍니다.","한국 동물병원 관점에서, 혈구 수치 모니터링이 TT4 검사를 완전히 대체하진 못하나 보완 도구로 활용될 수 있습니다. 특히 외래 방문 사이 간격이 길어 TT4 재검사가 지연될 때, Hct나 MCV 상승이 치료 통제 상실을 시사하는 신호가 될 수 있습니다. 혈액 검사만으로 갑상선 호르몬 변화를 추정할 수 있다면 비용 절감과 접근성 향상에 기여할 수 있을 것입니다."],"blog":"메티마졸 치료 중인 갑상선기능항진증 묘에서 정기 혈액검사 결과가 tt4 수치 변화의 간접 지표가 될 수 있음을 설명하는 클라이언트 교육 자료를 작성해보세요","blogAngle":["메티마졸 치료 중 Hct, MCV, Hgb, ALT가 TT4와 매우 강한 양의 상관관계(상관계수 0.8 이상)를 보였습니다","개인묘 내 추적에서 Hct와 MCV가 TT4 변화를 민감하게 반영했습니다","치료 3개월 후 Hct ≥35.2%일 때 민감도 96.7%, 특이도 92.3%로 치료 효과 판별에 유용했습니다","치료 중단 후 혈구 수치가 치료 전 값으로 복귀하여 이 지표의 특이도를 확인했습니다"],"radar":{"owner":{"soon":true,"q":"선생님, 고양이 갑상선 치료 중인데 혈구 검사만으로도 호르몬 상황 알 수 있어요?","script":"이번 연구에 따르면 적혈구 용적치()와 평균적혈구용적(MCV)이 갑상선 호르몬(T4)와 매우 강하게 연동돼요. 그래서 혈구 검사만으로 치료 효과를 간접적으로 볼 수 있는 단서가 될 수 있습니다. 다만 TT4 검사를 완전히 대신하진 못하고, 보완 도구로 활용하는 건 어떠실까요?"},"clinical":"고양이 갑상선기능항진증 외래에서 TT4 재검사 전, /MCV 수치 상승 여부를 함께 점검하여 치료 통제 상실 조기 탐지 고려","evidence":null},"tag":""},{"id":"2026-W30_8","day":"2026-W30","ts":1784650392766,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 귀염증 Pseudomonas aeruginosa의 항균제 저항성 위험성","dek":"헝가리에서 채집된 개 귀염증 관련 Pseudomonas aeruginosa 110개 분리주를 분석한 연구에서 다제내성 균주가 상당 비율을 차지하는 것으로 확인되었습니다. 전장유전체 분석을 통해 획기적 저항성 유전자들이 다수 검출되었으며, 이는 경험적 항생제 치료의 한계를 보여줍니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1902036/full","body":["개 귀염증은 개에서 흔히 발생하는 질환으로, 특히 만성·재발성·치료 저항성 증례에서 Pseudomonas aeruginosa가 주요 원인균으로 작용합니다. 이 균은 외막 투과성이 낮고 biofilm을 형성하며, efflux 시스템을 갖추고 있어 항생제에 대한 내성이 강합니다. 경험적 치료가 어려운 만큼 지역별 감시 데이터 확보가 중요합니다.","이번 연구는 부다페스트 수의과학대학에서 110개 분리주를 대상으로 14종 항생제 및 소독제에 대한 최소억제농도(MIC) 검사를 실시했습니다. 70개 균주는 전장유전체 분석에 의해 유전적 저항성 결정인자들이 분석되었으며, 다제내성 균주에서 획기적 내성유전자(CARD 데이터베이스 기준)가 다수 확인되었습니다.","한국 동물병원에서도 만성 귀염증 증례에서 P. aeruginosa 감수성 검사가 더욱 중요해질 것으로 보입니다. 특히 광범위 항생제 사용 경험을 가진 증례에서는 genomic 분석을 통한 맞춤형 치료 전략이 필요할 수 있습니다. 국내 동물 유래 P. aeruginosa의 저항성 현황에 대한 추가 조사가 기대됩니다."],"blog":"만성 귀염증 증례에서 P. aeruginosa 감염이 의심될 때 단순 항생제 처방 대신 감수성 검사 결과를 확인하는 진료 문화를 강조하는 블로그 글로 활용할 수 있습니다.","blogAngle":["개 귀염증 관련 P. aeruginosa 110개 분리주 중 다제내성 균주가 상당 비율 차지","14종 항생제·소독제에 대한 MIC 분포 및 임상적 해석 기준 적용","전장유전체 분석으로 획기적 저항성 유전자 다수 검출, Carbapenem 내성 유전자도 확인","경험적 치료 한계 드러내며, 감수성 검사 기반 치료의 필요성 강조"],"radar":{"owner":{"soon":true,"q":"강아지 귀염증이 오래되거나 재발하면 보통 어떤 약으로 치료해요?","script":"귀염증이 오래 지속되거나 재발하는 경우에는 단순한 경험적 치료만으로는 부족할 수 있습니다. 세균 배양 검사를 통해 어떤 세균인지, 어떤 약에 반응하는지 확인한 후 맞춤형 치료를 진행하는 것이 중요합니다."},"clinical":"개 귀염증 치료 프로토콜 재점검, 특히 만성·재발성 증례에서 세균배양 및 감수성 검사 시행 빈도 확인","evidence":null},"tag":""},{"id":"2026-W30_9","day":"2026-W30","ts":1784650391766,"cat":"clinical","kicker":"임상","isToday":false,"title":"개·고양이 자동바늘생검-site 미봉합시 장누출 위험 평가","dek":"자동 니들코어 장치로 실시한 전층 장 생검에서 바늘 구멍을 봉합하지 않아도 되는지를 검증한 연구가 발표되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1870783/full","body":["이 연구는 개의 전자동 바늘 생검 기구(16게이지)를 활용하여 개와 고양이 소장에서 전층 생검을 실시한 후, 바늘 구멍을 봉합하지 않고 방치한 상태에서 장내 압력에 대한 견고성을 평가했습니다.","연구는 시체(in vitro) 실험과 생체(in vivo) 실험으로 나뉘었습니다. 시체 소장 39개 구간에서 평균 초기 누출 압력(ILP)은 20.7 mmHg로, 정상 생리적 최대 압력인 25 mmHg 이하에서 누출이 발생했습니다. 반면 생체 12마리(개 8마리, 고양이 4마리)에서 측정한 평균 ILP는 85.66 mmHg로, 모든 측정값이 26 mmHg 이상이었습니다.","시체 모델은 생체와 달리 혈류 및 조직 탄력성이 없어 장 압력 평가에 부적합한 것으로 나타났습니다. 생체에서는 1.3 mm 크기의 작은 바늘 구멍이 즉시 봉합하지 않아도 생리적 최대 압력 이상을 견디지만, 장기 치유 과정은 이번 연구에서 평가되지 않아서 일상적인 봉합이 필요한지에 대한 최종 결론은 내리지 못했습니다."],"blog":"한국 동물병원에서는 개·고양이 소장 생검 시 미봉합 가능성을 임상적으로 검토하되, 환자 상태와 조직 치유력을 고려한 개별화 접근이 필요하다는 점을 블로그 글로 다룰 수 있습니다.","blogAngle":["시체 장 구간의 누출 압력은 평균 20.7 mmHg로 생리적 최대 압력보다 낮았습니다.","생체에서는 평균 85.66 mmHg의 누출 압력을 보여 모든 시료가 25 mmHg를 상회했습니다.","1.3 mm 크기의 미봉합 바늘 구멍은 즉시 조직 견고성을 유지하는 것으로 나타났습니다.","장기 치유 과정은 평가되지 않아서 미봉합의 장기적 안전성에 대한 추가 연구가 필요합니다."],"radar":{"owner":null,"clinical":"자동 바늘 생검 후 봉합 생략 가능성에 대해 임상 판단을 유보하되, 현행 프로토콜(봉합)을 유지하고 향후 추가 연구 결과를 모니터링한다","evidence":null},"tag":""},{"id":"2026-W30_10","day":"2026-W30","ts":1784650390766,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 직장 근수막외 형질세포종으로 간 전이 사례 – 멜팔란 치료 프로토콜 수정","dek":"미국에서 발생한 개의 직장 근수막외 형질세포종 사례가 Surgical excision 후 5개월 만에 간 전이로 발견되었으며, 치료 프로토콜을 수정한 펄스용량 멜팔란 요법으로 19개월 이상 생존을 연장한 사례가 보고되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"NaN.NaN","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1854150/full","body":["개에서 발생하는 근수막외 형질세포종(EMP)은 전체 개의 종양 중 약 2.4%를 차지하는 가장 흔한 형질세포 신생물입니다. 주로 피부(86%), 구강(9%), 직장(4%)에 발생하며, 피부와 구강에 발생한 EMP는 보통 양성으로 수술적 절제가 효과적입니다. 그러나 비피부 부위에서 발생한 EMP는 더 높은 악성 잠재력과 림프절 및 내장 전이 위험을 갖는 것으로 알려져 있습니다.","이번 사례는 10세 이상의 수컷 말티즈가 직장 EMP로 완전 절제 받았으나 5개월 후 다발성 간 형질세포종으로 재발한 경우입니다. 다발성골수종 증거 없이 간 전이만 확인되면서 펄스용량 멜팔란과 프레드니손 병용 요법을 시작하였으나, 골수억제 부작용으로 치료 프로토콜을 수정해야 했습니다. 멜팔란 투여 기간을 단축하는 방식으로 개별화한 결과, 초음파상 간 병변의 호전과 함께 진단 후 19개월 이상 생존을 달성했습니다.","한국 동물병원 관점에서 이 사례는 비피부 부위 EMP의 전이 가능성을 경고하는 동시에, 부작용 발생 시 치료 프로토콜의 유연한 조정이 가능함을 보여줍니다. 직장 EMP 수술 후 특히 간 전이에 대한 추적 관찰이 중요하며, 멜팔란 치료 시 골수억제 부작용 관리 전략이 필요할 수 있습니다."],"blog":"직장 종양 수술 후 발생한 간 전이 사례를 통해 비피부 EMP의 전이 가능성과 치료 프로토콜 개별화의 중요성을 강조하는 블로그 콘텐츠로 활용할 수 있습니다","blogAngle":["개의 EMP는 피부, 구강, 직장 등 주로 피부 근처에 발생하지만 비피부 부위는 전이 위험이 더 높습니다","직장 EMP 완전 절제 후 5개월 만에 다발성 간 전이가 발견된 사례가 보고되었습니다","골수억제 부작용으로 멜팔란 투여 기간을 단축하는 개별화 치료로 19개월 이상 생존 연장","비피부 부위 EMP 수술 후 장기적인 간 추적 초음파 검사가 권장됩니다"],"radar":{"owner":null,"clinical":"직장 근수막외 형질세포종 수술 후 비피부 부위 EMP의 전이 가능성을 고려하여 간 전이에 대한 추적 관찰 프로토콜을 점검하고, 멜팔란 치료 시 골수억제 부작용 관리 전략을 점검할 것","evidence":null},"tag":""},{"id":"2026-W30_11","day":"2026-W30","ts":1784580923000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"강아지 사회화, 평생의 자신감은 어린 시절부터","dek":"강아지 사회화는 평생의 성격과 행동 패턴을 결정하는 중요한 시기입니다. 특정 시기에 다양한 경험을 쌓는 것이 성견의 두려움과 자신감에 큰 영향을 미친다는 연구 결과가 있습니다.","source":"MSN","country":"","date":"07.21","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiqgFBVV95cUxQUzF6a3I1cHlsM1hqT1RfTjNwMHhOSHNFTk5KMG9iVWhmQkZLRWRpWkQ2b3hnSGJHVDY4Y0pvYW5oZE5wY0hnOWRhY0dac01JTjl6bEVrVzZhYlk4VHZKdVF1cUI2WHlDNFdtT0I3eU56SkQ0dV9HbENpTEE4NnlTSEZzcFBfMmFXaUNJc1MtNkhWcjB5UWVSRWNWbTFVbnIzb1o3dU9KTDNmQQ?oc=5","body":["강아지 사회화의 핵심 시기는 생후 3주부터 14주까지입니다. 이 기간 동안 강아지는 새로운 사람, 동물, 환경, 소음, 표면 등을 경험하며 긍정적인 기억을 형성합니다. 이 시기의 경험이 부족하면 성견 때 두려움이나 공격성으로 이어질 수 있어 전문가들이 중요하게 강조하는 부분입니다.","훈련사와 수의사는 사회화 시기 강아지가 다양한 자극에 노출되도록 안내해야 합니다. 새로운 경험을할 때 강아지가 두려워하지 않도록 긍정적이고 점진적인 접근이 필요하며, 보상 기반 훈련이 효과적입니다. 강아지뿐 아니라 보호자 교육도 중요한데, 과도한 보호나 부적절한 노출은 오히려 역효과를 줄 수 있습니다.","한국 동물병원에서도 사회화 상담의 기회를 활용할 수 있습니다. 첫 예방접종 시기에 보호자에게 사회화의 중요성과 방법을 안내하고,ospital 환경에 대한 긍정적 노출을 돕는다면 강아지뿐 아니라 보호자 역시 병원 방문에 대한 스트레스를 줄일 수 있습니다. 이는 병원 충성도 향상에도 기여할 수 있습니다."],"blog":"한국 동물병원 블로그에서 첫 예방접종 방문 시 보호자를 위한 사회화 가이드로 활용할 수 있는 콘텐츠입니다.","blogAngle":["강아지 사회화의 핵심 시기는 생후 3주에서 14주까지이며, 이 기간의 경험이 평생의 행동 패턴을 형성합니다.","긍정적이고 점진적인 새로운 경험 노출이 두려움 없는 성격 형성에 중요합니다.","보호자에 대한 교육도 사회화 성공의 핵심 요소입니다.","병원의 첫 방문을 긍정적 경험으로 만들면 강아지뿐 아니라 보호자의 병원 충성도도 높아질 수 있습니다."],"radar":{"owner":{"soon":true,"q":"강아지 사회화는 언제부터 어떻게 해야 하나요?","script":"생후 3주부터 14주까지가 가장 중요한 사회화 시기예요. 새로운 사람, 동물, 소음, 환경에 긍정적으로 노출시키는 것이 핵심인데, 강아지가 두려워하면 억지로 하지 말고 천천히, 맛있는 간식으로 이끌어보세요."},"clinical":"첫 예방접종 방문 시 보호자에게 사회화 방법과 병원 긍정적 노출을 함께 안내하여 병원 충성도와 진료 협조도 향상에 활용한다.","evidence":null},"tag":""},{"id":"2026-W30_12","day":"2026-W30","ts":1784417860000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"똑똑한 사회화 훈련으로 자신감 있는 강아지 키우기","dek":"강아지 사회적 훈련(socialization)의 중요성이 강조되고 있습니다. 적절한 시기에 올바른 경험을 쌓으면 성격이 안정되고 문제 행동도 예방할 수 있다는 전문가 의견이 주목받고 있습니다.","source":"MSN","country":"","date":"07.19","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiswFBVV95cUxOS19taHgtdlV4S2Y4TC1ra01zemhhbmtpclNVVFJmZmswYk1EdVFnRmVHMVR0ZU5PM3h6bXR1SEhTVUtkTDJSQWk4Q2hDaURfWFBxUWgxMmdpVmZLemZBWG9wUDA2UDRXc0pFU2xSMEo2blN5QWtoclZiQmthWFdjX01raEJzQ3VwVHBYTVhoYjhQTE5ISUFNS1E3TlRlMU9wXzdnbTBYaVNrNGIyNGwtM29iZw?oc=5","body":["강아지 사회화는 생후 3주에서 14주 사이에 가장 효과적이라는 연구 결과가 있습니다. 이 시기에 다양한 환경, 사람, 동물과 긍정적으로 접하게 하면 성격이 긍정적으로 발달하고 두려움을 줄일 수 있습니다. 다만 급격하거나 부정적인 경험은 오히려 역효과를 낳을 수 있어 주의가 필요합니다.","전문가들은 ‘노출(exposure)’과 ‘연상(association)’을 구분할 것을 권장합니다. 단순히 여러 환경을 보여주는 것뿐 아니라 각 경험을 긍정적으로 경험하게 만드는 것이 핵심입니다. treats와 칭찬을 활용하여 새로운 경험과 좋은 것을 연결시키는 것이 중요하며, 강아지의 속도를 맞춰주어야 합니다.","한국 동물병원에서도 사회적 훈련 관련 상담 요청이 증가하는 추세입니다. 수의사들은 예방의학적 관점에서 사회화의 중요성을 강조하며, 초기 문제 행동을 막기 위한 조기 개입의 필요성을 상담하고 있습니다. 특히 입원이나 진료 시 발생하는 스트레스를 줄이기 위해서도 평소 사회적 훈련이 도움이 된다는 점을 안내하고 있습니다."],"blog":"한국 동물병원 블로그에서 '첫 내원도 두려워하지 않아! 강아지 사회화 훈련으로 진료 스트레스 줄이기'라는 제목으로 사회적 훈련의 진료 편의를 위한 실천법을 소개하는 글을 쓸 수 있습니다.","blogAngle":["강아지 사회화 핵심기는 생후 3~14주이며, 이 시기의 경험이 평생의 성격에 영향을 미침","긍정적 연상을 위해 새롭고 경험할 때마다 간식과 칭찬으로 보상하는 것이 효과적","부정적 경험은 오히려 두려움을 키울 수 있어 급격한 노출은 피해야 함","사회적 훈련은 문제 행동 예방뿐 아니라 진료 시 스트레스 감소에도 도움이 됨"],"radar":{"owner":{"soon":true,"q":"강아지 사회화는 언제부터 시작하는 게 좋고, 어떻게 해야 할까요? 정신건강의학과 의사들이 강아지 사회화의 적절한 시기와 방법에 대해 설명할 때, 보호자들의 질문에 대해 명확하고 실용적인 조언을 제공해야 합니다. 특히 3주에서 14주 사이의 중요한 사회화 기간 동안 긍정적인 경험을 쌓는 것이 강아지의 성격 발달에 결정적입니다. 보호자들은 간식과 칭찬을 활용하여 새로운 경험을 긍정적으로 연결시키는 것이 중요합니다. 또한, 보호자들은 강아지의 편안함 수준에 맞춰 훈련 속도를 조절하고, 개별 강아지의 정서적 준비 상태를 존중하는 지지적이고 점진적인 사회화 접근을 안내하는 것이 필수적입니다. 어린 강아지를 키우고 있는데, 사회화 훈련을 전혀 안 시켜서 문제가 생길까요?","script":"사회화는 생후 3주에서 14주 사이에 가장 효과적으로 일어나기 때문에, 이 시기에 긍정적인 경험을 쌓는 것이 중요합니다. 아직 사회화를 못했다 하더라도 지금부터 천천히 긍정적으로 도입하면 도움이 됩니다. 진료를 받으러 올 때도 평소의 사회화 훈련이 스트레스를 줄이는 데 효과가 있으니, 노출과 연상을 구분해서 진행해보세요."},"clinical":"새로 강아지를 입양한 보호자에게 첫 방문 시 사회화 일정을 상담하고, 진료 스트레스 감소를 위한 가정 훈련 가이드 제공을 점검하세요.","evidence":null},"tag":""}],"stories":[],"weekly":true}</script>

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;
        x.style.display=x.tagName==='P'?'-webkit-box':'block';
        if(slack()<0) x.style.display='none';
      });
      // ② 그래도 남으면 마지막 카드의 말줄임을 한 줄씩 푼다
      var ps=el.querySelectorAll('p[style*="line-clamp"]');
      if(!ps.length) return;
      var p=ps[ps.length-1], guard=0;
      while(guard++<20){
        if(slack()<26) break;                            // 한 줄 넣을 자리도 없다
        if(p.scrollHeight<=p.clientHeight+2) break;       // 더 보여줄 문장이 없다
        p.style.webkitLineClamp=(parseInt(getComputedStyle(p).webkitLineClamp)||3)+1;
      }
    }); });
  }
  var balTimer;
  addEventListener('resize',function(){ clearTimeout(balTimer); balTimer=setTimeout(function(){ FP.steps=0; fitFold(); },160); });

  function homeView(){
    var arr=activeList();
    if(!arr.length){ return '<div style="text-align:center;padding:64px 0;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-label-neutral);">해당 조건의 글이 없습니다</div><p style="margin:8px 0 0;font-size:14px;">필터를 바꿔보세요.</p></div>'; }
    // 기사가 적은 필터에서는 2단을 쓰지 않는다. 오른쪽 단(카드 4 + TOP 5)이
    // 목록 전체보다 길어 어떻게 나눠도 한쪽에 수백 px 빈칸이 남기 때문이다.
    if(arr.length<14){
      var h1='<div><div style="padding:28px 0 34px;border-bottom:2px solid var(--color-label-strong);">'
      +leadCard(arr[0])+arr.slice(1).map(leadFollow).join('')+'</div>'
      +mostRead(arr.slice(0,5));
      h1+=qaColumn(arr);
      h1+=recentSection();
      h1+=storyBoard();
      return h1+'</div>';
    }
    // ── 1면 구성 ──
    // 신문 1면은 아래로 갈수록 단 수와 비중이 바뀐다. 같은 2단이 끝까지 반복되면
    // 리듬이 죽는다. 구역마다 폭을 달리하되, 구역 안에서는 행을 공유해 선을 맞춘다.
    //   폴드   3단(1 : 2.3 : 1.15) — 브리프 리스트 | 톱기사(본문 2단 조판) | 사이드
    //   쿼드   4단 — 같은 무게의 카드 4장
    //   피처   2단(1.7 : 1) 비대칭 — 해설 기사 | TOP 5
    var i=1, lead=arr[0];
    var side=arr.slice(i,i+FP.side); i+=FP.side;
    var brief=arr.slice(i,i+FP.brief); i+=FP.brief;
    var quad=arr.slice(i,i+4); i+=quad.length>=2?quad.length:0;
    if(quad.length<2) quad=[];
    var feat=arr[i++];
    var bandAll=arr.slice(i);
    var band=S.showAll?bandAll:bandAll.slice(0,12);
    var top5=arr.slice(0,5), more=bandAll.length-band.length;

    var h='<div>'
    // ① 폴드 — 3단 비대칭
    +'<div id="vm-fold" class="vm-fold" style="display:grid;grid-template-columns:1fr 2.3fr 1.15fr;gap:0;border-bottom:3px solid var(--color-label-strong);padding-bottom:30px;">'
      +'<div id="vm-leadcell" style="grid-column:2;padding:26px 34px 0;border-left:1px solid var(--color-line-normal);border-right:1px solid var(--color-line-normal);">'+fpLead(lead)+'</div>'
      +'<div id="vm-brief" style="grid-column:1;grid-row:1;padding:26px 26px 0 0;">'
        +'<div style="font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-label-strong);padding-bottom:10px;border-bottom:2px solid var(--color-label-strong);">한눈에</div>'
        +brief.map(briefRow).join('')+'</div>'
      +'<div id="vm-side" style="grid-column:3;grid-row:1;padding:26px 0 0 26px;">'+side.map(railCard).join('')+sponsorBlock(slotAt('fold'))+'</div>'
    +'</div>'
    // ② 광고/제휴 띠 — 폴드와 쿼드 사이. 슬롯이 비면 아무것도 나오지 않는다
    +sponsorBlock(slotAt('mid'),true)
    // ③ 쿼드 — 같은 무게 4단
    // 칸이 다 차지 않으면 빈 셀이 생긴다 → 카드 수에 맞춰 단 수를 줄이고, 2장 미만이면 생략
    +(quad.length>=2?'<div class="vm-quadzone" style="display:grid;grid-template-columns:repeat('+quad.length+',1fr);gap:0;border-bottom:2px solid var(--color-label-strong);">'
      +quad.map(function(a,qi){ return '<div class="vm-quad" style="padding:22px 20px 26px;'+(qi?'border-left:1px solid var(--color-line-normal);':'padding-left:0;')+(qi===quad.length-1?'padding-right:0;':'')+'">'+quadCard(a,qi)+'</div>'; }).join('')
    +'</div>':'')
    // ③ 피처 — 비대칭 2단
    +(feat?'<div class="vm-featzone" style="display:grid;grid-template-columns:1.7fr 1fr;gap:0;border-bottom:2px solid var(--color-label-strong);">'
      +'<div id="vm-feat-l" style="padding:26px 40px 30px 0;">'+featureCard(feat)+'</div>'
      +'<div id="vm-feat-r" style="padding:26px 0 30px 40px;border-left:1px solid var(--color-line-normal);">'+mostRead(top5)+'</div>'
    +'</div>':'');
    if(bandAll.length){
      h+='<div style="padding:16px 0 13px;border-bottom:1px solid var(--color-line-normal);"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">오늘의 다른 소식</span></div>'
      +bandGrid(band);
      if(more>0){ h+='<div style="display:flex;justify-content:center;padding:28px 0 0;"><button data-act="more" style="display:inline-flex;align-items:center;gap:8px;border:1px solid var(--color-line-strong);background:var(--color-background-normal);color:var(--color-label-strong);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:12px 24px;border-radius:10px;">기사 '+more+'건 더 보기</button></div>'; }
    }
    h+=qaColumn(arr);
    h+=recentSection();
    h+=storyBoard();
    return h+'</div>';
  }

  function draftModal(){

    if(d.loading){ inner='<div style="padding:56px 20px;text-align:center;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--color-label-neutral);">블로그 초안을 작성하고 있어요…</div><p style="margin:8px 0 0;font-size:13px;">담아둔 글감 '+d.n+'개로 초안을 만드는 중입니다. 10~20초 걸립니다.</p></div>'; }

        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin-bottom:8px;">제목 후보 (클릭하면 복사)</div>'+titles
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin:18px 0 8px;">본문</div>'
        +'<div style="white-space:pre-wrap;font-size:15px;line-height:1.85;color:var(--color-label-neutral);background:var(--color-background-alternative);border-radius:10px;padding:16px 18px;">'+e(r.body||'')+'</div>'
        +'<div style="margin:16px 0 8px;">'+tags+'</div>'
        +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button data-act="copydraft" style="display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 제목+본문+태그 전체 복사</button><button data-act="draftclose" style="border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 16px;border-radius:10px;">닫기</button></div>'
        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'
        +'</div>';
    }
    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,website:(document.getElementById('vm-hp')||{}).value||''})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?(res.already?'이미 구독 중입니다':'구독 신청 완료! 매일 아침 받아보세요'):(res.error||'잠시 후 다시 시도해 주세요')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  // SPA라 기사를 열어도 페이지 이동이 없어 GA4가 조회를 못 잡는다 — 직접 보낸다
  function track(a){
    if(typeof gtag!=='function'||!a) return;
    try{
      gtag('event','article_view',{article_id:a.id,article_title:a.title,category:a.cat,source:a.source,issue_date:a.day});
    }catch(e){}
  }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); track(byId[id]); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
</html>
