<h1>VetMan 해외 브리핑 — 2026-W30</h1>
<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제</h2><p><b>강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.</b></p>
<p>관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.</p><p>다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜entin(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.</p><p>비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때</h2><p><b>수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.</b></p>
<p>반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.</p><p>Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.</p><p>한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다.</p>
<p>원문: <a href="https://drandyroark.com/when-the-chill-protocol-isnt-chilling/" rel="nofollow">Dr. Andy Roark</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축</h2><p><b>5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었다.</b></p>
<p>평일 아침 만원인 동물병원에서 5세 터리어 믹스견 ‘요기'가 3일 동안 기력 없고, 구토하며 식사를 거부하는 증상으로 내원했다. 입을 벌리자 잇몸과 피부, 눈의 흰자위가 황달 색으로 변해 있었고, 심박수 160회/분으로 빈맥을 보여 신체적 스트레스가 의심되었다. 병원 내 혈액검사에서 빌리루빈과 간효소가 크게 상승했으며, 자동 혈구계산기에서 망상적혈구 증가, 중성구성 백혈구 증가증, 빈혈, 그리고 혈소판 감소 가능성을 보였다.</p><p>해당 동물병원은 Vetscan Imagyst®라는 AI 혈액도말 분석기를 보유하고 있었다. 1~3분 내에 AI는 디지털 도말을 분석하여 적혈구, 백혈구, 혈소판의 형태학적 이상을 체계적으로 보고했다. 그 결과, 수동 현미경 검사에서 발견하기 어려웠던 형태학적 이상 소견이 명확히 제시되었으며, Zoetis 위원회 인증 임상병리학 전문가의 추가 검토를 통해 수 시간 만에 IMHA 확정 진단이 내려졌다.</p><p>한국 동물병원 관점에서 이 사례는 중대한 시사점을 제공한다. 많은 국내 병원에서 혈액도말 판독 전문가가 부족하고, 외주 검사 결과 대기 시간이 길어 진단이 지연될 수 있다. AI 분석기는 이러한 격차를 줄이고, 초기 검사를 바탕으로 신속한 치료 결정을 가능케 한다. 또한 환자 보호자에게 도말 이미지를 보여주며 질환을 설명하면 진료 만족도 향상에도 도움이 된다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/bringing-specialist-level-interpretation-in-clinic/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>중고도 공포·불안 강아지의 수의과 진료실 대처법</h2><p><b>수의과 방문 시 중고도 수준의 공포, 불안, 스트레스를 보이는 강아지에 대한 핸들링 기술을 소개합니다. 강제 처치가 트라우마를 악화시킬 수 있어 의료·환경·행동 치료의 조합이 필수적입니다.</b></p>
<p>모든 수의과 방문은 강아지에 지속적인 기억을 남깁니다. 각 진료 시 공포나 불안을 경험하는 강아지를 어떻게 다루는지가 향후 행동과 진료 협조도에 직접적인 영향을 미칩니다. 중고도 공포 상태의 강아지는 이미 부정적 경험을 하고 있으며, 추가 트라우마를 최소화하는 것이 매우 중요합니다.</p><p>5~8분간의 적응 기간 후에도 중고도 공포를 보이는 강아지는 아직 시술이 준비되지 않은 상태입니다. 강제 진료는 공포를 악화시키고 트라우마 기억을 형성합니다. 이 상태의 강아지는 전투, 도주, 불안, 정지 모드에 있으며 생명에 위협을 느끼고 간식, 장난감, 상호작용을 피합니다. 이러한 강아지에는 의료적(전처방 약물, 효과적인 진정제), 환경적(저스트레스 핸들링), 행동적 치료의 조합이 필요합니다.</p><p>진료 긴급도는 세 가지로 구분됩니다. 응급 환자는 즉각적 치료가 필요하며 빠른 작용 정맥 또는 근육 진정제를 사용하고 과도한 억제를 피합니다. 안정적 질환 방문에서는 진정을 서두를 필요 없이 전처방 약물과 저스트레스 기법을 병행할 수 있으며, 선택적 진료(예방검진, 수술, 치과)는 강아지 스트레스 수준에 따라 연기할 수 있습니다. Chip와 Luna 사례에서처럼 반복적인 긍정적 경험과 적절한 약물 조합으로 공포 강아지도 차�.balanceeren 진료를 받아들이게 됩니다.</p>
<p>원문: <a href="https://vetgirlontherun.com/handling-techniques-for-dogs-with-moderate-to-high-levels-of-fear-anxiety-or-stress-vetgirl-veterinary-continuing-education-blogs/" rel="nofollow">VetGirl</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 당뇨병 관리의 새로운 선택지, SGLT2 억제제</h2><p><b>수의학에서 당뇨병 관리 방법이 빠르게 진화하고 있습니다. 특히 고양이에서 SGLT2 억제제 기반 복합요법이 기존 인슐린 치료 대안으로 주목받고 있습니다.</b></p>
<p>지난 20년간 인간 당뇨병 치료와 모니터링에서 큰 진전이 있었으나, 수의학에서는 최근에서야 이를 적용하기 시작했습니다. 개의 당뇨병은 췌장 베타 세포의 인슐린 생성 실패로 인해 제1형 당뇨병과 유사하여 인슐린 치료가 필수적입니다. 반면 고양이의 최대 80%는 인슐린 저항성이 원인인 제2형 당뇨병으로, 자체 인슐린을 아직 생산하고 있어 새로운 치료 옵션이 가능합니다.</p><p>Bexagliflozin과 velagliflozin은 고양이 당뇨병 치료에 승인된 SGLT2 억제제입니다. 적절히 선택된 환자에게 80~90%의 효과를 보이며, 인슐린을 전혀 생산하지 않는 고양이는 대상이 아닙니다. 치료 시작 후 3일, 1주, 2주, 4주, 12주에 걸쳐 케톤을 측정하고, 초기 프레프락타민과 4주, 12주 프레프락타민을 비교하여 혈당 조절을 평가합니다. 가장 흔한 부작용은 위장관 증상이고, 가장 심각한 부작용은 정상혈당성 케톤산증입니다.</p><p>한국 동물병원에서는 건강한 당뇨병 고양이 환자에게 SGLT2 억제제 치료를 고려할 수 있습니다. 다만 케톤산증이나 심각한 동반 질환이 있는 경우는 인슐린 치료로 전환해야 합니다. 향후 인슐린과 SGLT2 억제제 병용 치료 등 추가 연구가 기대되며, 신장이나 심혈관 보호 효과에 대한 수의학 연구도 진행될 전망입니다.</p>
<p>원문: <a href="https://vetgirlontherun.com/whats-new-in-diabetes-management-vetgirl-veterinary-continuing-education-blogs/" rel="nofollow">VetGirl</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개의 관절염, 치료적 운동으로 관절 가동성과 근육량 개선</h2><p><b>최근 임상 연구에서 구조화된 치료적 운동이 관절염 환 개의 관절 가동성과 근육량을 유의미하게 개선한다는 객관적 증거가 제시되었습니다. 이는 통증 관리 약물과 함께 재활 치료를 표준 치료 구성요소로 권고해야 할 근거가 됩니다.</b></p>
<p>관절염은 노령 개에서 가장 흔한 만성 질환 중 하나로, 관절 통증과 가동성 저하, 근육 위축을 유발합니다. 전통적으로 NSAID 등 약물 치료가 주축을 이루었으나, 최근 다학제적 접근의 중요성이 강조되고 있습니다. 구조화된 치료적 운동은 관절 주변 근육 강화와 관절 가동성 유지에 도움을 줄 것으로 예상되어 온 바, 이를 뒷받침할 체계적인 연구가 필요한 상태였습니다.</p><p>이번 연구는 관절염 진단을 받은 개를 대상으로 구조화된 치료적 운동을 시행한 후, 운동 전후의 관절 가동성과 근육량을 측정하여 객관적 개선 증거를 제시했습니다. 연구 결과, 운동을 수행한 집단에서 대조군 대비 관절 가동 범위와 근육량이 유의미하게 증가한 것으로 확인되었습니다. 이는 치료적 운동이 단순한 보완 요법을 넘어 관절염 관리의 핵심 구성요소가 될 수 있음을 시사합니다.</p><p>한국 동물병원 관점에서 보면, 이 연구 결과는 재활 치료의 증거 기반을 강화하는 자료입니다. 관절염 환 개를 진료할 때 약물 처방만 아니라 운동 처방을 함께 고려해야 하며, 필요한 경우에는 물리치료실과의 협업을 통해 맞춤형 운동 프로그램을 설계하는 것이 권고될 수 있습니다. 또한 보호자에게 운동의 중요성을 설명할 때 과학적 근거를 함께 전달하면 치료 순응도 향상에 도움이 될 것입니다.</p>
<p>원문: <a href="https://ivcjournal.com/structured-therapeutic-exercise-significantly-improves-joint-mobility-and-muscle-mass-in-dogs/" rel="nofollow">IVC Journal</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>애완동물 병원 방문 시 AI가 실제로 하는 일 — AVMA 회장 인터뷰</h2><p><b>미국수의사회(AVMA) 회장이 애완동물 진료실에서 인공지능이 실제로 어떻게 활용되고 있는지 밝혔다. 진단 지원에서 환자 관리까지 AI의 현재 역할과 한계를 분석한다.</b></p>
<p>AI는 현재 수의 진료에서 진단 도구로 활용되기 시작했지만, 최종 결정은 여전히 수의사가 내립니다. AVMA 회장에 따르면 AI는 방사선 영상 분석, 혈액 검사 결과 해석, 증상 패턴 인식 등에서 수의사를 보조하는 역할을 합니다. 예를 들어 이상 음영이 있는 X-ray 영상을 표시해주거나 비정상적인 혈액 수치를 강조해주는 식입니다.</p><p>다만 AI는 만능 해결사가 아니라 단순히 도구일 뿐이라는 점이 강조됩니다. 실제 진료에서는 동물 소유자와의 소통, 복잡한 임상 판단, 개별 환자에 맞는 치료 계획 세우기 등 AI가 대체할 수 없는 영역이 많습니다. 또한 환자의 개인 병력이나 특성까지 고려한 종합적 판단은 경험 많은 수의사의 역량이 필요합니다.</p><p>한국 동물병원에서도 AI 도입이 가속되고 있는 상황에서, 수의사들은 AI를 도구로 활용하면서도 전문성 있는 진료 역량을 강화해야 합니다. 특히 AI가 제안한 진단이나 치료 옵션에 대해 소유자에게 설명하고 최종 판단을 내리는 것은 여전히 수의사의 역할입니다. AI와 수의사의 협업 모델이 향후 진료의 표준이 될 전망입니다.</p>

<h2>수의 진료에서 수술 후 호흡 억제 및 폐합병증: 문헌 고찰</h2><p><b>개의와 고양이에서 수술 후 발생할 수 있는 호흡 억제와 폐합병증의 위험 요인과 관리 전략을 최신 문헌을 통해 정리했습니다. 마취에서 회복되는 과정에서 이러한 합병증이 생명을 위협할 수 있어 수의 임상에서 주의가 필요합니다.</b></p>
<p>수의 진료에서 수술 후 호흡 억제는 마취제, 진통제, 특히 오피오이드 계열 약물의 잔류 효과로 인해 흔히 발생합니다. 다른 위험 요인으로는 고령 동물, 짧은 주둥이 품종(브라케시세phalic 종), 비만, 기존 호흡기 질환이 있습니다. 문헌에 따르면 개의에서 마취 후 폐합병증 발생률은 1~5% 수준으로 보고되고 있으며, 이는 환자의 예후에 중요한 영향을 미칩니다.</p><p>호흡 억제의 조기 발견을 위해 마취 회복실에서 산소 포화도, 호흡 수, 호흡 패턴을 지속적으로 모니터링해야 합니다. 고위험 환자에게는 마취 전 폐기능 평가와 함께 마취 중 보조 호흡 유지가 권장됩니다. 오피오이드 사용 시 반전제(나록손 등)의 적절한 시점 사용과 함께 술 후 진통 프로토콜의 최적화가 중요하며, 원문에서 구체적인 약물 용량과 치료 가이드라인이 제시되어 있습니다.</p><p>한국 동물병원에서도 수술 후 호흡 관리의 중요성이 강조됩니다. 특히 고령 동물이나 특성 품종의 수술에서 회복 관리 프로토콜을 마련하고, 마취 회복실에서 기본적인 모니터링 체계를 갖추는 것이 필요합니다. 이러한 체계적인 관리는 마취 관련 사망률을 낮추는 데 기여할 수 있으며, 한국 수의학회나 관련 학회의 가이드라인을 참고하여 임상에서 적용할 수 있습니다.</p>

<h2>말 MEED와 개 골종양 원인 규명 단서를 발견한 4학년 수의학생들</h2><p><b>4학년 수의학 학생들이 말의 희귀 질환 MEED와 개 골종양의 병리 메커니즘에 관한 새로운 단서를 발견했습니다. 이는 수의학 교육에서 임상 연구 경험의 가치를 보여주는 사례입니다.</b></p>
<p>MEED(Multisystemic Eosinophilic Epithelial Destruction)는 말이 발생하는 희귀한 전신성 피부 질환으로, 호산구성 염증과 상피층 파괴를 특징으로 합니다. 이번 연구는 4학년 수의학생들이 임상 실습 중 이 질환을 가진 말들을 집중적으로 관찰하고 병리 표본을 분석하면서 기존에 알려지지 않았던 발병 단서를 확인하게 되었습니다.</p><p>개 골종양, 특히 골육종(Osteosarcoma)은 개의 사지 특히 전지에 발생하는 악성 종양으로, 조기 진단이 어렵고 전이율이 높아 예후가 불량한 것으로 유명합니다. 학생들은 다양한 품종의 개에서 발생하는 골종양 조직을 분석하여 특정 유전자 변이나 단백질 발현 패턴의 차이를 발견했습니다.</p><p>한국 동물병원 관점에서 보면, 이 연구는 수의학 임상 실습의 가치를 환기시킵니다. 학교에서 기초 의학을 배운 학생들도 실제 임상 현장에서 중요한 발견을 할 수 있다는 점을 보여주며, 한국의 수의대들도 더 많은 임상 연구 기회를 학생들에게 제공해야 할 필요성이 있습니다. 또한 말 MEED와 개 골종양은 한국에서도 충분히 발생할 수 있는 질환이므로 이러한 연구 결과가 향후 진단과 치료에 도움이 될 것으로 기대됩니다.</p>
<p>원문: <a href="https://news.google.com/rss/articles/CBMidEFVX3lxTE9feXdsb0MwaGFCUFJTNkJ2eTF4RVhQSWNYMGh6QmJvU25rdzNLTnk2YXN5TzEwMGtDVFNBdEF1bVJhWUp5NnVabTFZTUkyQXJ4RVRTLU9xVldFZlE4RzYxZXZuelhiNlpZbU5hQzNXSnpzUjJ0?oc=5" rel="nofollow">Phys.org</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>토네이도 강아지의 응급실 방문기</h2><p><b>미국의 한 동물병원 응급실에 '토네이도'라는 이름의 강아지가 내소하며 화제가 되었다. 특수한 이름의 환자 도착이 온라인 커뮤니티에서 어떻게 논의되었는지 살펴본다.</b></p>
<p>동물병원 응급실에서는 다양한 이름의 환자 동물들이 도착하지만, 때로는 이름 자체가 의료진과 보호자들의 관심을 끌기도 한다. 최근 한 동물병원 응급실에서는 '토네이도'라는 독특한 이름을 가진 강아지가 방문하여 의료진들의 화제가 되었다.</p><p>'토네이도'라는 이름은 바람처럼 빠르고 강렬한 이미지를 연상시키며, 강아지의 성격이나appearance와 어울리는 이름일 것으로 추정된다. 동물병원 커뮤니티에서는 이러한 특별한 이름의 동물 환자들에 대한 이야기들이 종종 공유되곤 한다.</p><p>한국 동물병원에서도 이름이 독특한 동물 환자들을 자주 만나하게 된다. 응급실 상황에서 이름이 주는 심리적 효과나 보호자와의 관계에도 영향을 미칠 수 있으며, 이는 진료 외적으로도 소통의 좋은 접점이 될 수 있다.</p>

<h2>개에서 쿼럼 센싱 조절제: 세균 신호 차단을 통한 장 건강 관리</h2><p><b>항생제 내성이 심각해지는 가운데, 세균을 죽이지 않고 세균 간 신호를 차단하는 새로운 접근법인 쿼럼 센싱 조절제가 개의 장 건강과 회복력 향상에 주목받고 있습니다.</b></p>
<p>세균은 단독으로 존재하지 않고 쿼럼 센싱이라는 화학적 신호 시스템을 통해 서로 소통합니다. 일정 개체수에 도달하면 세균은 집단을 형성하고 biofilm을 만들고 독소를 생산하며 병원성 인자를 발현하는 등 집단 행동을 Coordinating합니다. 이는 개의 장이나 조직 내 병원성 세균이 충분히 많아지면 더 공격적으로 변할 수 있다는 것을 의미합니다.</p><p>쿼럼 센싱(QS) 조절제는 이러한 세균 간 소통을 방해하여 병원성 세균이 해로운 반응을 조직화하지 못하게 합니다. 기존 항생제가 유익한 세균까지 함께 제거하여 dysbiosis(장균총 불균형)를 유발하는 것과 달리, QS 조절제는 해로운 세균의 신호만 차단함으로써 유익한 미생물 생태계를 보존합니다. 근무견, 스포츠견, 질병 회복기 개에서 장 건강은 성능과 회복에 직접적으로 연결됩니다.</p><p>현재 QS 조절제에 대한 수의학 연구는 아직 초기 단계이며, 개의 임상 적용은 완전히 표준화되지 않았습니다. 수의사는 동료 검토 문헌과 개 모델에서의 검증 여부를 확인하고 증거 기반 의학에 기반한 치료 결정을 내려야 합니다. 이 분야가 발전함에 따라 기존 probiotic이나 오메가3 지방산과 함께 활용 가능성을 탐색할 수 있을 것입니다.</p>
<p>원문: <a href="https://ivcjournal.com/quorum-sensing-modulators-from-bacterial-signaling-to-gut-health-and-performance/" rel="nofollow">IVC Journal</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>노령개 인지기능장애, 영양보충제로 관리한다</h2><p><b>수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS) 진단이 증가하고 있습니다. 본 기사는 노령개 뇌건강 관리를 위한 근거 중심의 영양보충제를 소개합니다.</b></p>
<p>수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS)가 임상에서 흔한 진단이 되고 있습니다. 인간의 알츠하이머병과 유사하게 뇌 내에서 베타아밀로이드 단백질이 점진적으로 축적되어 신경세포 손상과 행동적 저하를 유발합니다. 세레길린과 같은 약물 치료가 주요 치료법이지만, 영양보충제 지원이 포괄적인 관리 계획의 일부로 주목받고 있습니다.</p><p>장쇄 오메가3 지방산(EPA, DHA)은 노령개 뇌건강을 위해 가장 증거가 강한 영양보충제입니다. DHA는 신경세포막의 주요 구조 성분으로 인지 기능 개선과 신경염 감소에 기여합니다. 특정 처방 사료는 강화된 오메가3 수준으로 뇌건강을 지원하도록 처방되어 있으며, 일관된 치료 수준의 어류 지방산을 제공하는 편리한 방법입니다. 처방 사료가 아닌 경우 어류유 보충제를 고려할 수 있으며, NASC 품질 인증 제품 선택을 권장합니다. 산화 스트레스는 CDS의 신경퇴화에 중요한 역할을 하며, 비타민 E, C, 베타카로틴, 셀레늄 등의 항산화가 이 메커니즘에 직접적으로 작용하도록 처방 사료에 항산화제 혼합물이 혼합되어 있습니다.</p><p>한국 동물병원에서 노령개 환자를 진료할 때 근거에 기반한 영양보충제 권고를 치료 도구로 활용할 수 있습니다. 특히 고급 사료 사용과 함께 어류유, 항산화제 보충제를 조합하는 프로토콜이 효과적입니다. 보충제 권장 시 신뢰할 수 있는 제조사의 제품을 선택하도록 안내하고, CDS 관리에서는 영양보충제를 초기부터 환경적 강화 및 행동 관리와 함께 통합하는 것이 가장 효과적입니다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-W30","dateLabel":"2026-W30","dateline":"2026-W30 주간 요약 · 이번 주 가장 주목한 기사","editionNo":"2026 · W30","count":12,"cats":[{"key":"clinical","label":"임상"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-W30_1","day":"2026-W30","ts":1783666824000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제","dek":"강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.","source":"Veterinary Practice News","country":"미국","date":"07.10","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/palliative-care-pain.jpg","sourceUrl":"https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/","body":["관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.","다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜entin(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.","비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다."],"blog":"한국 동물병원 블로그에서 '노령 강아지/고양이 관절염,-관리 제대로 알아보자'라는 제목으로 보호자를 위한 안내글로 활용할 수 있습니다","blogAngle":["고령 관절염 환자의 치료 목표는 완치가 아닌 통증 완화와 기능 유지입니다","NSAID 단독 치료로 부족할 때 가바펜entin, 아만타딘, 항-NGF 단일클론항체 등 보조 약물을 단계적으로 추가합니다","침구·레이저·전자기장 치료는 약물과 다른 경로로 진통 효과를 발휘해 고령 환자에서 유용합니다","운동 제한은 오히려 해롭고, 짧은 규칙적 산책과 수중 트레드밀이 근육 유지에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지 관절염 있는데, 약물 외에 통증 조절에 좋은 방법은 없나요?","script":"관절염은 노령 동물에서 완치가 어려운 흔한 질환입니다. 약물 치료뿐만 아니라 레이저나 펄스 전자기장 같은 보습 치료, 그리고 짧은 산책이나 수중 트레드밀 같은 적절한 운동도 통증 조절에 도움을 드릴 수 있습니다. 각 동물의 상태에 맞게 조합해서 조절해 보겠습니다."},"clinical":"고령 관절염 환자에게 NSAID 기본 처방 외에 비약물 치료(레이저, 펄스 전자기장, 수중 트레드밀) 옵션 상담 및 처방 고려","evidence":null},"tag":""},{"id":"2026-W30_2","day":"2026-W30","ts":1784174400000,"cat":"clinical","kicker":"임상","isToday":false,"title":"가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때","dek":"수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.","source":"Dr. Andy Roark","country":"미국","date":"07.16","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-408-blog-pic.jpg","sourceUrl":"https://drandyroark.com/when-the-chill-protocol-isnt-chilling/","body":["반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.","Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.","한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다."],"blog":"자꾸 손을 물거나 짖는 불안한 강아지에게 기존 진정제가 안 먹힐 때, 대안적 약물 선택과 올바른 용량 조절 방법을 진료 블로그에 정리하면 도움이 됩니다.","blogAngle":["가바펜틴과 트라조돈 외에 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 진정제 옵션이 있다","진정이 불안감을 감추고 있는지 확인하고, 단순 진정 아닌 근본적 불안 해소를 목표로 해야 한다","집에서의 시험 투여와 안전 계획 수립이 중요하며, 에세프로메진 사용 시 주의가 필요하다","불안이 심각한 환자에게는 수의 행동학 전문의와 상담하는 것이 권장된다"],"radar":{"owner":null,"clinical":"불안 동반 환자에서 가바펜틴/트라조돈 효과 없을 때 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 약물 도입을 고려하되, 진정만 되고 불안이 남아있는지는 반드시 재평가할 것","evidence":null},"tag":""},{"id":"2026-W30_3","day":"2026-W30","ts":1784520024000,"cat":"industry","kicker":"업계","isToday":false,"title":"AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축","dek":"5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었다.","source":"Veterinary Practice News","country":"미국","date":"07.20","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/Yogi-Hi-res-1-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/bringing-specialist-level-interpretation-in-clinic/","body":["평일 아침 만원인 동물병원에서 5세 터리어 믹스견 ‘요기'가 3일 동안 기력 없고, 구토하며 식사를 거부하는 증상으로 내원했다. 입을 벌리자 잇몸과 피부, 눈의 흰자위가 황달 색으로 변해 있었고, 심박수 160회/분으로 빈맥을 보여 신체적 스트레스가 의심되었다. 병원 내 혈액검사에서 빌리루빈과 간효소가 크게 상승했으며, 자동 혈구계산기에서 망상적혈구 증가, 중성구성 백혈구 증가증, 빈혈, 그리고 혈소판 감소 가능성을 보였다.","해당 동물병원은 Vetscan Imagyst®라는 AI 혈액도말 분석기를 보유하고 있었다. 1~3분 내에 AI는 디지털 도말을 분석하여 적혈구, 백혈구, 혈소판의 형태학적 이상을 체계적으로 보고했다. 그 결과, 수동 현미경 검사에서 발견하기 어려웠던 형태학적 이상 소견이 명확히 제시되었으며, Zoetis 위원회 인증 임상병리학 전문가의 추가 검토를 통해 수 시간 만에 IMHA 확정 진단이 내려졌다.","한국 동물병원 관점에서 이 사례는 중대한 시사점을 제공한다. 많은 국내 병원에서 혈액도말 판독 전문가가 부족하고, 외주 검사 결과 대기 시간이 길어 진단이 지연될 수 있다. AI 분석기는 이러한 격차를 줄이고, 초기 검사를 바탕으로 신속한 치료 결정을 가능케 한다. 또한 환자 보호자에게 도말 이미지를 보여주며 질환을 설명하면 진료 만족도 향상에도 도움이 된다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원에서도 도입 가능한 AI 진단 도구, 어떤 상황에서 도움이 되는가?’라는 주제로 클리닉 사례와 함께 소개하면 좋은 콘텐츠가 될 것입니다","blogAngle":["AI 혈액도말 분석은 수 시간 내 혈구 이상을 객관적으로 보고하여 신속한 진단을 가능케 한다","IMHA와 같은 긴급 질환에서 치료 시작 시간 단축은 환자 예후에 직접적 영향을 미친다","AI 분석과 전문병리학 전문가 검토의 병행 모델이 정확도와 신뢰도를 높인다","환자 보호자에게 형태학적 이상 소견을 시각적으로 보여주면 진료 설명과 신뢰 구축에 효과적이다"],"radar":{"owner":null,"clinical":"AI 혈액도말 분석기 도입을 검토하고, 특히 황달·빈혈 환축에서 신속한 형태학적 분석이 필요한 경우 장비 활용도를 점검해 보세요.","evidence":null},"tag":""},{"id":"2026-W30_4","day":"2026-W30","ts":1784282456000,"cat":"clinical","kicker":"임상","isToday":false,"title":"중고도 공포·불안 강아지의 수의과 진료실 대처법","dek":"수의과 방문 시 중고도 수준의 공포, 불안, 스트레스를 보이는 강아지에 대한 핸들링 기술을 소개합니다. 강제 처치가 트라우마를 악화시킬 수 있어 의료·환경·행동 치료의 조합이 필수적입니다.","source":"VetGirl","country":"미국","date":"07.17","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/07/Handling-techniques-for-Dogs-with-for-Moderate-to-High-Levels-of-Fear-Anxiety-or-Stress.png","sourceUrl":"https://vetgirlontherun.com/handling-techniques-for-dogs-with-moderate-to-high-levels-of-fear-anxiety-or-stress-vetgirl-veterinary-continuing-education-blogs/","body":["모든 수의과 방문은 강아지에 지속적인 기억을 남깁니다. 각 진료 시 공포나 불안을 경험하는 강아지를 어떻게 다루는지가 향후 행동과 진료 협조도에 직접적인 영향을 미칩니다. 중고도 공포 상태의 강아지는 이미 부정적 경험을 하고 있으며, 추가 트라우마를 최소화하는 것이 매우 중요합니다.","5~8분간의 적응 기간 후에도 중고도 공포를 보이는 강아지는 아직 시술이 준비되지 않은 상태입니다. 강제 진료는 공포를 악화시키고 트라우마 기억을 형성합니다. 이 상태의 강아지는 전투, 도주, 불안, 정지 모드에 있으며 생명에 위협을 느끼고 간식, 장난감, 상호작용을 피합니다. 이러한 강아지에는 의료적(전처방 약물, 효과적인 진정제), 환경적(저스트레스 핸들링), 행동적 치료의 조합이 필요합니다.","진료 긴급도는 세 가지로 구분됩니다. 응급 환자는 즉각적 치료가 필요하며 빠른 작용 정맥 또는 근육 진정제를 사용하고 과도한 억제를 피합니다. 안정적 질환 방문에서는 진정을 서두를 필요 없이 전처방 약물과 저스트레스 기법을 병행할 수 있으며, 선택적 진료(예방검진, 수술, 치과)는 강아지 스트레스 수준에 따라 연기할 수 있습니다. Chip와 Luna 사례에서처럼 반복적인 긍정적 경험과 적절한 약물 조합으로 공포 강아지도 차�.balanceeren 진료를 받아들이게 됩니다."],"blog":"한국 동물병원 블로그에서 '진료실 공포를 낮추는 첫 방문 자세 유도법' 또는 '전처방 약물의 실제 적용 사례'로 풀어낼 수 있는 주제입니다.","blogAngle":["5~8분 적응 후에도 중고도 공포를 보이는 강아지는 시술 준비가 되어 있지 않으며, 강제 처치는 트라우마를 악화시킵니다.","진료 긴급도에 따라 응급, 안정적 질환, 선택적 진료로 분류하고 각각 다른 접근이 필요합니다.","전처방 약물(가바펜틴, 덱스메데토미딘 등)과 저스트레스 핸들링 기법을 병행하여 긍정적 경험을 만들어갈 수 있습니다.","반복적인 긍정적 경험과 인내를 통해 이전에 트라우마를 경험한 강아지도 진료를 받아들이게 할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 수의사 가면 너무 무서워해하는데, 어떻게 해야 스트레스 없는 진료가 가능할까요?","script":"강아지가 진료실을 무서워하는 것은해요. 단, 스트레스 핸들링 기법과 전처방 약물을 적절히 병행하면 점진적으로 스트레스를 줄일 수 있습니다. 처음에는 간단한 예방접종부터 시작해서 긍정적 경험을 쌓어나가는 것이 중요합니다."},"clinical":"진료실에 도입되는 강아지에 대해 5~8분 적응 시간을 확보하고, 저스트레스 핸들링 프로토콜과 필요시 전처방 약물 사용을 점검한다.","evidence":null},"tag":""},{"id":"2026-W30_5","day":"2026-W30","ts":1783677608000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 당뇨병 관리의 새로운 선택지, SGLT2 억제제","dek":"수의학에서 당뇨병 관리 방법이 빠르게 진화하고 있습니다. 특히 고양이에서 SGLT2 억제제 기반 복합요법이 기존 인슐린 치료 대안으로 주목받고 있습니다.","source":"VetGirl","country":"미국","date":"07.10","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/07/CGM.jpg","sourceUrl":"https://vetgirlontherun.com/whats-new-in-diabetes-management-vetgirl-veterinary-continuing-education-blogs/","body":["지난 20년간 인간 당뇨병 치료와 모니터링에서 큰 진전이 있었으나, 수의학에서는 최근에서야 이를 적용하기 시작했습니다. 개의 당뇨병은 췌장 베타 세포의 인슐린 생성 실패로 인해 제1형 당뇨병과 유사하여 인슐린 치료가 필수적입니다. 반면 고양이의 최대 80%는 인슐린 저항성이 원인인 제2형 당뇨병으로, 자체 인슐린을 아직 생산하고 있어 새로운 치료 옵션이 가능합니다.","Bexagliflozin과 velagliflozin은 고양이 당뇨병 치료에 승인된 SGLT2 억제제입니다. 적절히 선택된 환자에게 80~90%의 효과를 보이며, 인슐린을 전혀 생산하지 않는 고양이는 대상이 아닙니다. 치료 시작 후 3일, 1주, 2주, 4주, 12주에 걸쳐 케톤을 측정하고, 초기 프레프락타민과 4주, 12주 프레프락타민을 비교하여 혈당 조절을 평가합니다. 가장 흔한 부작용은 위장관 증상이고, 가장 심각한 부작용은 정상혈당성 케톤산증입니다.","한국 동물병원에서는 건강한 당뇨병 고양이 환자에게 SGLT2 억제제 치료를 고려할 수 있습니다. 다만 케톤산증이나 심각한 동반 질환이 있는 경우는 인슐린 치료로 전환해야 합니다. 향후 인슐린과 SGLT2 억제제 병용 치료 등 추가 연구가 기대되며, 신장이나 심혈관 보호 효과에 대한 수의학 연구도 진행될 전망입니다."],"blog":"블로그 글감으로 활용한다면, ‘고양이 당뇨병, 이제 인슐린 주사만능 시대는 끝?’ 같은 제목으로 SGLT2 억제제의 장단점을 설명하며 주치와의 상담 중요성을 강조하는 콘텐츠를 작성할 수 있습니다.","blogAngle":["고양이 당뇨병의 최대 80%는 인슐린 저항성이 원인이며, 아직 인슐린을 생산하는 고양이가 SGLT2 억제제 치료 후보가 됩니다.","Bexagliflozin과 velagliflozin은 적절한 환자에게 80~90%의 효과를 보입니다.","SGLT2 억제제 치료 시 정상혈당성 케톤산증 발생 가능성으로 인해 지속적인 케톤 모니터링이 필수적입니다.","치료 시작 후 초기 3개월간은 정기적인 프레프락타민 검사와 케톤 측정이 권장됩니다."],"radar":{"owner":{"soon":true,"q":"새로운 당뇨병 약이 있다던데, 우리 고양이도 쓸 수 있어요?","script":"SGLT2 억제제는 효과가 있지만 모든 고양이에 다 적합하지 않습니다. 고양이가 아직 인슐린을 스스로 만들고 있는지 확인하고, 케톤 수치를 잘 모니터링해야 합니다. 정확한 건 진료에서 혈액 검사와 경과 관찰을 해봐야 알 수 있습니다."},"clinical":"고양이 당뇨병 환자에게 SGLT2 억제제 치료를 고려하기 전, 인슐린 생산 능력 평가와 함께 케톤 모니터링 프로토콜을 수립하고 를 통한 혈당 조절 평가 일정을 계획한다.","evidence":null},"tag":""},{"id":"2026-W30_6","day":"2026-W30","ts":1784311256000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 관절염, 치료적 운동으로 관절 가동성과 근육량 개선","dek":"최근 임상 연구에서 구조화된 치료적 운동이 관절염 환 개의 관절 가동성과 근육량을 유의미하게 개선한다는 객관적 증거가 제시되었습니다. 이는 통증 관리 약물과 함께 재활 치료를 표준 치료 구성요소로 권고해야 할 근거가 됩니다.","source":"IVC Journal","country":"미국","date":"07.17","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_fozjorfozjorfozj-1-600x352.png","sourceUrl":"https://ivcjournal.com/structured-therapeutic-exercise-significantly-improves-joint-mobility-and-muscle-mass-in-dogs/","body":["관절염은 노령 개에서 가장 흔한 만성 질환 중 하나로, 관절 통증과 가동성 저하, 근육 위축을 유발합니다. 전통적으로 NSAID 등 약물 치료가 주축을 이루었으나, 최근 다학제적 접근의 중요성이 강조되고 있습니다. 구조화된 치료적 운동은 관절 주변 근육 강화와 관절 가동성 유지에 도움을 줄 것으로 예상되어 온 바, 이를 뒷받침할 체계적인 연구가 필요한 상태였습니다.","이번 연구는 관절염 진단을 받은 개를 대상으로 구조화된 치료적 운동을 시행한 후, 운동 전후의 관절 가동성과 근육량을 측정하여 객관적 개선 증거를 제시했습니다. 연구 결과, 운동을 수행한 집단에서 대조군 대비 관절 가동 범위와 근육량이 유의미하게 증가한 것으로 확인되었습니다. 이는 치료적 운동이 단순한 보완 요법을 넘어 관절염 관리의 핵심 구성요소가 될 수 있음을 시사합니다.","한국 동물병원 관점에서 보면, 이 연구 결과는 재활 치료의 증거 기반을 강화하는 자료입니다. 관절염 환 개를 진료할 때 약물 처방만 아니라 운동 처방을 함께 고려해야 하며, 필요한 경우에는 물리치료실과의 협업을 통해 맞춤형 운동 프로그램을 설계하는 것이 권고될 수 있습니다. 또한 보호자에게 운동의 중요성을 설명할 때 과학적 근거를 함께 전달하면 치료 순응도 향상에 도움이 될 것입니다."],"blog":"한국 동물병원 블로그나 SNS에서 관절염 관리법에 대한 콘텐츠를 제작할 때, 이번 연구 결과를 인용하며 재활 운동의 중요성을 소개하고, 동물병원에서 제공 가능한 운동 처방 서비스를 안내하는 글을 작성할 수 있습니다.","blogAngle":["구조화된 치료적 운동이 관절염 환 개의 관절 가동성을 통계적으로 유의미하게 개선한다는 객관적 증거가 연구를 통해 확인되었습니다.","운동 처치군에서 근육량이 증가하여 관절 주변 지지 근육 강화 효과를 입증했습니다.","연구 결과는 재활 치료를 관절염의 다학제적 관리에서 표준 구성요소로 포함시켜야 한다는 주장을 뒷받침합니다.","약물 치료와 생활습관 개입, 그리고 치료적 운동을 병합하는 통합적 접근의 효과를 확인할 수 있었습니다."],"radar":{"owner":{"soon":true,"q":"관절염 진단받았는데, 집에서 어떤 운동을 해야 통증도 줄고 관절도 좋아질 수 있나요?","script":"최근 연구에서 치료적 운동이 관절염 환 개의 관절 가동성과 근육량 개선에 도움이 될 수 있다는 근거가 나왔습니다. 다만 개마다 증상과 상태가 다르니, 어떤 운동이 적합한지 직접 상담해서 맞는 프로그램을 시작하시는 게 좋습니다."},"clinical":"관절염 환자 개 진료 시 약물 처방뿐 아니라 운동 처방도 함께 고려하고, 필요시 물리치료실과의 협업 가능성을 점검","evidence":null},"tag":""},{"id":"2026-W30_7","day":"2026-W30","ts":1784409296000,"cat":"industry","kicker":"업계","isToday":false,"title":"애완동물 병원 방문 시 AI가 실제로 하는 일 — AVMA 회장 인터뷰","dek":"미국수의사회(AVMA) 회장이 애완동물 진료실에서 인공지능이 실제로 어떻게 활용되고 있는지 밝혔다. 진단 지원에서 환자 관리까지 AI의 현재 역할과 한계를 분석한다.","source":"Yahoo Creators","country":"","date":"07.18","read":"1분 읽기","plate":"Yahoo Creators","image":"https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300-rw","sourceUrl":"https://news.google.com/rss/articles/CBMi2gFBVV95cUxOTUNMLXpUWE9XbW9KM3NQeS1pSG96cEpjeEpEeVI4bE5GTmRwLWptOHVOT3hnZFhtUW83YWREZnp5YS1nSzlmOW05ekVUMXJJYVE5RjZpRmlHcU84LW9sM1RsWkx3YW9DdF9EM1o1aDFwV1h0SjhaY2dmclM4MkhTNTNUc2oxcWpyN2JFMnZlVkNTRnNIQ3FjQktFNGY2dlNkYTBnMTJpckNJSUhuU0FydzhlcUZkMWthT2lDQkJ4dlo2V1RaNkxFdVhhRVdxV3kyRjhtd0lZWXUtUQ?oc=5","body":["AI는 현재 수의 진료에서 진단 도구로 활용되기 시작했지만, 최종 결정은 여전히 수의사가 내립니다. AVMA 회장에 따르면 AI는 방사선 영상 분석, 혈액 검사 결과 해석, 증상 패턴 인식 등에서 수의사를 보조하는 역할을 합니다. 예를 들어 이상 음영이 있는 X-ray 영상을 표시해주거나 비정상적인 혈액 수치를 강조해주는 식입니다.","다만 AI는 만능 해결사가 아니라 단순히 도구일 뿐이라는 점이 강조됩니다. 실제 진료에서는 동물 소유자와의 소통, 복잡한 임상 판단, 개별 환자에 맞는 치료 계획 세우기 등 AI가 대체할 수 없는 영역이 많습니다. 또한 환자의 개인 병력이나 특성까지 고려한 종합적 판단은 경험 많은 수의사의 역량이 필요합니다.","한국 동물병원에서도 AI 도입이 가속되고 있는 상황에서, 수의사들은 AI를 도구로 활용하면서도 전문성 있는 진료 역량을 강화해야 합니다. 특히 AI가 제안한 진단이나 치료 옵션에 대해 소유자에게 설명하고 최종 판단을 내리는 것은 여전히 수의사의 역할입니다. AI와 수의사의 협업 모델이 향후 진료의 표준이 될 전망입니다."],"blog":"한국 병원 블로그 글감으로 활용한다면, \"우리 병원에서 AI를 이렇게 활용하고 있습니다\"라는 실제 적용 사례이나 AI 보조 진단의 한계와 장점을 소개하는 콘텐츠가 효과적입니다.","blogAngle":["AI는 현재 수의사 진단을 보조하는 도구로 활용되며, 최종 진료 결정은 여전히 수의사가 내립니다.","영상 분석, 혈액 검사 결과 해석, 증상 패턴 인식 등에서 AI가 수의사를 지원합니다.","동물 소유자와의 소통, 복잡한 임상 판단 등 AI가 대체할 수 없는 영역이 여전히 존재합니다.","한국 동물병원에서도 AI 도입이 확대되는 상황에서 수의사의 전문성이 더욱 중요해졌습니다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지 진료할 때 AI도 사용하세요?","script":"네, 많은 동물병원에서 AI를 도우미 도구로 활용하고 있어요. X-나 혈액 검사 결과를 먼저 선별검사해서 보여주거나, 비정상 소견을 강조해줍니다. 하지만 최종 진단과 치료 계획은 반드시 수의사가 직접 확인하고 결정합니다. AI는 단순히 도우미 역할일 뿐이에요."},"clinical":"자가 진료실 AI 활용 현황 점검, 보호자에게 AI 보조 진단 결과를 설명하는 프로토콜 수립","evidence":null},"tag":""},{"id":"2026-W30_8","day":"2026-W30","ts":1784307508000,"cat":"clinical","kicker":"임상","isToday":false,"title":"수의 진료에서 수술 후 호흡 억제 및 폐합병증: 문헌 고찰","dek":"개의와 고양이에서 수술 후 발생할 수 있는 호흡 억제와 폐합병증의 위험 요인과 관리 전략을 최신 문헌을 통해 정리했습니다. 마취에서 회복되는 과정에서 이러한 합병증이 생명을 위협할 수 있어 수의 임상에서 주의가 필요합니다.","source":"Cureus","country":"","date":"07.17","read":"2분 읽기","plate":"Cureus","image":"https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300-rw","sourceUrl":"https://news.google.com/rss/articles/CBMi-AFBVV95cUxOR3B5UVVFeHFXcVFfWUhLX3VYcnVTQks4Q1ZnZVlnS09yY0I0ZzJiRDJBOVczWEwtVVJmQUNuZ2xORzNQa0FIZ2FlRkpteWJkRmR5dlU5Z1locEFkMjBvOFBvTlgyLXJyalNVYkJMRm8wazVaNGtycmR1dGplVnR2Zi1QTjhJZDZzZ3RBS2ZYczBFbVI3RUtSOEUyaHhIMXlQaWpsei01ZVZPeU9Pcl9tMjl3aWdPd1hPckVFTkdrTGgtbHlhNXJuVVF6dzhRSG8ya1NFOEpiSWRDSVN5QTl0THVERHFSbzlKRmkzdW9wbk5hTFZJYzZFeQ?oc=5","body":["수의 진료에서 수술 후 호흡 억제는 마취제, 진통제, 특히 오피오이드 계열 약물의 잔류 효과로 인해 흔히 발생합니다. 다른 위험 요인으로는 고령 동물, 짧은 주둥이 품종(브라케시세phalic 종), 비만, 기존 호흡기 질환이 있습니다. 문헌에 따르면 개의에서 마취 후 폐합병증 발생률은 1~5% 수준으로 보고되고 있으며, 이는 환자의 예후에 중요한 영향을 미칩니다.","호흡 억제의 조기 발견을 위해 마취 회복실에서 산소 포화도, 호흡 수, 호흡 패턴을 지속적으로 모니터링해야 합니다. 고위험 환자에게는 마취 전 폐기능 평가와 함께 마취 중 보조 호흡 유지가 권장됩니다. 오피오이드 사용 시 반전제(나록손 등)의 적절한 시점 사용과 함께 술 후 진통 프로토콜의 최적화가 중요하며, 원문에서 구체적인 약물 용량과 치료 가이드라인이 제시되어 있습니다.","한국 동물병원에서도 수술 후 호흡 관리의 중요성이 강조됩니다. 특히 고령 동물이나 특성 품종의 수술에서 회복 관리 프로토콜을 마련하고, 마취 회복실에서 기본적인 모니터링 체계를 갖추는 것이 필요합니다. 이러한 체계적인 관리는 마취 관련 사망률을 낮추는 데 기여할 수 있으며, 한국 수의학회나 관련 학회의 가이드라인을 참고하여 임상에서 적용할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '마취 후 회복 관리: 우리 병원 모니터링 프로토콜 소개'라는 제목으로 실제 임상에서 적용 가능한 점검 사항을 정리하여 올리면 좋은 콘텐츠가 될 수 있습니다.","blogAngle":["수의 진료에서 수술 후 호흡 억제는 오피오이드 마취제 잔류, 고령, 특성 품종, 비만 등 다양한 위험 요인과 관련됩니다.","브라케시세falic 품종과 기존 호흡기 질환이 있는 동물에서 마취 후 폐합병증 발생 위험이 더 높습니다.","마취 회복실에서 산소 포화도, 호흡 수, 호흡 패턴에 대한 지속적 모니터링이 조기 발견에 필수적입니다.","고위험 환자의 마취 전 폐기능 평가와 술 후 체계적인 회복 관리가 합병증 예방에 중요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 수술하고 나니 숨쉬는 게 좀 느리고 얕은데 괜찮은가요?","script":"마취 뒤 숨쉬는 게 평소보다 느려 보이실 수 있는데, 이런 호흡 억제는 마취 약물의 영향으로 흔히 생기는 일시적인 현상입니다. 특히 고령이거나 코가 짧은 품종, 비만인 경우 더 주의를 해야 하므로, 회복실에서 몰빵하면서 계속 살펴보고 있어요."},"clinical":"고위험 환자(고령, 비만, 브라케시세팔릭 품종) 마취 전 폐기능 간단 문진 점검하고 회복실 모니터링 프로토콜(산소 포화도, 호흡 수·패턴) 강화 여부 확인","evidence":null},"tag":""},{"id":"2026-W30_9","day":"2026-W30","ts":1784548804000,"cat":"clinical","kicker":"임상","isToday":false,"title":"말 MEED와 개 골종양 원인 규명 단서를 발견한 4학년 수의학생들","dek":"4학년 수의학 학생들이 말의 희귀 질환 MEED와 개 골종양의 병리 메커니즘에 관한 새로운 단서를 발견했습니다. 이는 수의학 교육에서 임상 연구 경험의 가치를 보여주는 사례입니다.","source":"Phys.org","country":"","date":"07.20","read":"1분 읽기","plate":"Phys.org","image":"https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300-rw","sourceUrl":"https://news.google.com/rss/articles/CBMidEFVX3lxTE9feXdsb0MwaGFCUFJTNkJ2eTF4RVhQSWNYMGh6QmJvU25rdzNLTnk2YXN5TzEwMGtDVFNBdEF1bVJhWUp5NnVabTFZTUkyQXJ4RVRTLU9xVldFZlE4RzYxZXZuelhiNlpZbU5hQzNXSnpzUjJ0?oc=5","body":["MEED(Multisystemic Eosinophilic Epithelial Destruction)는 말이 발생하는 희귀한 전신성 피부 질환으로, 호산구성 염증과 상피층 파괴를 특징으로 합니다. 이번 연구는 4학년 수의학생들이 임상 실습 중 이 질환을 가진 말들을 집중적으로 관찰하고 병리 표본을 분석하면서 기존에 알려지지 않았던 발병 단서를 확인하게 되었습니다.","개 골종양, 특히 골육종(Osteosarcoma)은 개의 사지 특히 전지에 발생하는 악성 종양으로, 조기 진단이 어렵고 전이율이 높아 예후가 불량한 것으로 유명합니다. 학생들은 다양한 품종의 개에서 발생하는 골종양 조직을 분석하여 특정 유전자 변이나 단백질 발현 패턴의 차이를 발견했습니다.","한국 동물병원 관점에서 보면, 이 연구는 수의학 임상 실습의 가치를 환기시킵니다. 학교에서 기초 의학을 배운 학생들도 실제 임상 현장에서 중요한 발견을 할 수 있다는 점을 보여주며, 한국의 수의대들도 더 많은 임상 연구 기회를 학생들에게 제공해야 할 필요성이 있습니다. 또한 말 MEED와 개 골종양은 한국에서도 충분히 발생할 수 있는 질환이므로 이러한 연구 결과가 향후 진단과 치료에 도움이 될 것으로 기대됩니다."],"blog":"한국 동물병원 블로그에 '수의대 임상 실습의 가치: 학생들도 중요한 발견을 한다'라는 제목으로 학생 임상 교육의 중요성을 강조하는 글로 활용할 수 있습니다.","blogAngle":["4학년 수의학생들이 말 MEED의 발병 메커니즘에 관한 새로운 단서를 발견했습니다.","개 골종양 조직 분석을 통해 특정 유전자 변이와 단백질 발현 패턴의 차이를 확인했습니다.","임상 실습 중 학생들도 중요한 연구 결과를 산출할 수 있음을 입증했습니다.","한국 수의대에서도 임상 연구 기회를 확대할 필요가 있음을 시사합니다."],"radar":{"owner":null,"clinical":"개의 골종양(골육종) 의심 시 조기 발견을 위해 고령견의 사지 상태를 진료 시 반드시 확인하고, 필요시 영상진단 의뢰를 고려할 것","evidence":null},"tag":""},{"id":"2026-W30_10","day":"2026-W30","ts":1784583103000,"cat":"clinical","kicker":"임상","isToday":false,"title":"토네이도 강아지의 응급실 방문기","dek":"미국의 한 동물병원 응급실에 '토네이도'라는 이름의 강아지가 내소하며 화제가 되었다. 특수한 이름의 환자 도착이 온라인 커뮤니티에서 어떻게 논의되었는지 살펴본다.","source":"DVM360","country":"","date":"07.20","read":"1분 읽기","plate":"DVM360","image":"https://lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300-rw","sourceUrl":"https://news.google.com/rss/articles/CBMijAFBVV95cUxONGYxSmVxaUx1WnozTUppenZ4TjRVY3dvSnFRMFZKMElWM1hBN3FabWl2TDJ6Y2RvOGRySFhacEdjRFdHSi1jNkRJWGJqa2J3T0k4Q3lHX2ZDWktwenJmVHJWbjh1emF3Tl9iZlY2Ny1sRzl2dWFrUFBnVVF2OVJyak05OXFBRktSek9Zbg?oc=5","body":["동물병원 응급실에서는 다양한 이름의 환자 동물들이 도착하지만, 때로는 이름 자체가 의료진과 보호자들의 관심을 끌기도 한다. 최근 한 동물병원 응급실에서는 '토네이도'라는 독특한 이름을 가진 강아지가 방문하여 의료진들의 화제가 되었다.","'토네이도'라는 이름은 바람처럼 빠르고 강렬한 이미지를 연상시키며, 강아지의 성격이나appearance와 어울리는 이름일 것으로 추정된다. 동물병원 커뮤니티에서는 이러한 특별한 이름의 동물 환자들에 대한 이야기들이 종종 공유되곤 한다.","한국 동물병원에서도 이름이 독특한 동물 환자들을 자주 만나하게 된다. 응급실 상황에서 이름이 주는 심리적 효과나 보호자와의 관계에도 영향을 미칠 수 있으며, 이는 진료 외적으로도 소통의 좋은 접점이 될 수 있다."],"blog":"자신의 동물병원에서 경험한 특별하거나 재미있는 동물 이름 이야기를 SNS 커뮤니티에 공유해보면 좋을 것이다","blogAngle":["미국 동물병원 응급실에 '토네이도'라는 이름의 강아지가 방문하여 화제가 되었다","특이한 이름의 동물 환자들은 의료진과 보호자 간의 소통 포인트가 될 수 있다","동물병원 커뮤니티에서는 이러한 일화들이 자주 공유되고 논의된다","진료 이름은 동물과 보호자의 관계에서 작은 심리적 영향을 줄 수 있다"],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":""},{"id":"2026-W30_11","day":"2026-W30","ts":1784212209000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개에서 쿼럼 센싱 조절제: 세균 신호 차단을 통한 장 건강 관리","dek":"항생제 내성이 심각해지는 가운데, 세균을 죽이지 않고 세균 간 신호를 차단하는 새로운 접근법인 쿼럼 센싱 조절제가 개의 장 건강과 회복력 향상에 주목받고 있습니다.","source":"IVC Journal","country":"미국","date":"07.16","read":"1분 읽기","plate":"IVC Journal","image":"http://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_a0enosa0enosa0en-600x366.png","sourceUrl":"https://ivcjournal.com/quorum-sensing-modulators-from-bacterial-signaling-to-gut-health-and-performance/","body":["세균은 단독으로 존재하지 않고 쿼럼 센싱이라는 화학적 신호 시스템을 통해 서로 소통합니다. 일정 개체수에 도달하면 세균은 집단을 형성하고 biofilm을 만들고 독소를 생산하며 병원성 인자를 발현하는 등 집단 행동을 Coordinating합니다. 이는 개의 장이나 조직 내 병원성 세균이 충분히 많아지면 더 공격적으로 변할 수 있다는 것을 의미합니다.","쿼럼 센싱(QS) 조절제는 이러한 세균 간 소통을 방해하여 병원성 세균이 해로운 반응을 조직화하지 못하게 합니다. 기존 항생제가 유익한 세균까지 함께 제거하여 dysbiosis(장균총 불균형)를 유발하는 것과 달리, QS 조절제는 해로운 세균의 신호만 차단함으로써 유익한 미생물 생태계를 보존합니다. 근무견, 스포츠견, 질병 회복기 개에서 장 건강은 성능과 회복에 직접적으로 연결됩니다.","현재 QS 조절제에 대한 수의학 연구는 아직 초기 단계이며, 개의 임상 적용은 완전히 표준화되지 않았습니다. 수의사는 동료 검토 문헌과 개 모델에서의 검증 여부를 확인하고 증거 기반 의학에 기반한 치료 결정을 내려야 합니다. 이 분야가 발전함에 따라 기존 probiotic이나 오메가3 지방산과 함께 활용 가능성을 탐색할 수 있을 것입니다."],"blog":"한국 동물병원 블로그에서는 '항생제 대안으로서의 쿼럼 센싱 조절제, 신뢰할 수 있는 제품일까?'라는 제목으로 최신 연구 동향과 함께 근무견· 스포츠견 Owners를 위한 장 건강 관리 팁을 다룰 수 있습니다","blogAngle":["쿼럼 센싱은 세균이 일정 개체수에 도달하면 집단 행동(독소 생산, biofilm 형성 등)을 Coordinating하는 신호 시스템입니다","QS 조절제는 세균을 죽이지 않고 세균 간 신호를 차단함으로써 유익한 장균총을 보존합니다","항생제 사용으로 인한 dysbiosis(IBD, 만성 설사 등)를 피할 수 있는 표적 치료 전략으로 주목받습니다","현재까지 개의 임상 적용은 표준화되지 않았으며, 증거 기반 평가가 필요합니다"],"radar":{"owner":{"soon":false,"q":"이 새로운 장 건강 약이 우리 강아지에게 효과가 있나요?","script":"현재 이 치료법은 아직 연구 초기 단계여서 개의 임상 적용이 완전히 표준화되지 않았습니다. 아직 충분한 증거가 구축되지 않은 상황이라 신중하게 접근해야 합니다."},"clinical":"개의 장 치료에서 새로운 접근법을 검토할 때 기존 프로바이오틱스, 오메가3 지방산 등 검증된 치료법과 병행 가능성을 평가한다","evidence":null},"tag":""},{"id":"2026-W30_12","day":"2026-W30","ts":1784142047000,"cat":"clinical","kicker":"임상","isToday":false,"title":"노령개 인지기능장애, 영양보충제로 관리한다","dek":"수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS) 진단이 증가하고 있습니다. 본 기사는 노령개 뇌건강 관리를 위한 근거 중심의 영양보충제를 소개합니다.","source":"IVC Journal","country":"미국","date":"07.15","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_n7kd57n7kd57n7kd-600x327.png","sourceUrl":"https://ivcjournal.com/nutraceutical-protocols-for-canine-cognitive-dysfunction/","body":["수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS)가 임상에서 흔한 진단이 되고 있습니다. 인간의 알츠하이머병과 유사하게 뇌 내에서 베타아밀로이드 단백질이 점진적으로 축적되어 신경세포 손상과 행동적 저하를 유발합니다. 세레길린과 같은 약물 치료가 주요 치료법이지만, 영양보충제 지원이 포괄적인 관리 계획의 일부로 주목받고 있습니다.","장쇄 오메가3 지방산(EPA, DHA)은 노령개 뇌건강을 위해 가장 증거가 강한 영양보충제입니다. DHA는 신경세포막의 주요 구조 성분으로 인지 기능 개선과 신경염 감소에 기여합니다. 특정 처방 사료는 강화된 오메가3 수준으로 뇌건강을 지원하도록 처방되어 있으며, 일관된 치료 수준의 어류 지방산을 제공하는 편리한 방법입니다. 처방 사료가 아닌 경우 어류유 보충제를 고려할 수 있으며, NASC 품질 인증 제품 선택을 권장합니다. 산화 스트레스는 CDS의 신경퇴화에 중요한 역할을 하며, 비타민 E, C, 베타카로틴, 셀레늄 등의 항산화가 이 메커니즘에 직접적으로 작용하도록 처방 사료에 항산화제 혼합물이 혼합되어 있습니다.","한국 동물병원에서 노령개 환자를 진료할 때 근거에 기반한 영양보충제 권고를 치료 도구로 활용할 수 있습니다. 특히 고급 사료 사용과 함께 어류유, 항산화제 보충제를 조합하는 프로토콜이 효과적입니다. 보충제 권장 시 신뢰할 수 있는 제조사의 제품을 선택하도록 안내하고, CDS 관리에서는 영양보충제를 초기부터 환경적 강화 및 행동 관리와 함께 통합하는 것이 가장 효과적입니다."],"blog":"노령개 보호자를 대상으로 한 블로그 글에서 '노년에 나타나는 우리 강아지의 행동 변화, 인지기능장애 아닐까요?'라는 주제로 CDS 조기 증상과 영양관리 방법을 다루면 좋습니다.","blogAngle":["노령개 인지기능장애(CDS)는 베타아밀로이드 단백질 축적으로 인한 신경세포 손상과 행동 저하를 특징으로 합니다.","장쇄 오메가3 지방산(DHA, EPA)은 신경세포막 건강과 신경염 감소에 효과가 입증된 주요 영양보충제입니다.","항산화제(비타민 E, C, 베타카로틴, 셀레늄)는 산화 스트레스로 인한 신경퇴화를 늦추는 데 중요합니다.","영양보충제는 처방 사료, 환경 강화, 약물 치료와 병행할 때 가장 효과적입니다."],"radar":{"owner":{"soon":true,"q":"노령개가 요즘 집 안에서 방향 감각을 잃거나 제 이름을 불러도 그냥 무시하는 것 같아요. 먹이는 뭐가 좋을까요?","script":"노령개의 인지기능장애는 노화에 따른 뇌 변화가 원인일 수 있습니다. 어류유 보충제와 항산화제가 뇌건강에 도움이 될 수 있다는 연구가 있지만, 효과가 나타나는 속도와 정도는 개마다 다를 수 있습니다. 어느 보충제든 본격적으로 시작하기 전에 반드시 수의사와 상담해서 현재 건강 상태에 맞는 제품을 선택하고 적절한 용량을 확인하는 것이 안전합니다."},"clinical":"노령개 환자 문진 시 인지 기능 저하 징후(방향 감각 상실, 낮/밤 역전, 활동성 저하 등) 체크리스트에 포함시키고, 어류유·항산화제 보충제 권고 가능 여부 점검","evidence":null},"tag":""}],"stories":[],"weekly":true}</script>

    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?'구독 신청 완료! 매일 아침 받아보세요':(res.error||'실패')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
