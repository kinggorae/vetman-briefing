<h1>VetMan 해외 브리핑 — 2026-W26</h1>
<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 배설 장애: 수의사를 위한 실용적 접근법</h2><p><b>부정렬 배뇨는 소동물 임상에서 가장 흔한 행동 고소 내용 중 하나로, 고양이 유기 주요 원인이다. 의료적·행동적 원인을 모두 고려한 체계적 접근이 필요하다.</b></p>
<p>고양이 배설 문제는 대부분 다중 원인을 가지며, 먼저 의료 상태를 배제하는 것이 필수적이다. 방광염, 요로 결석, 갑상선 기능 항진증 등의 의료 질환이 있는지 충분히 검사해야 한다. 의료 질환이 치료 이후에도 부정적 학습된 정서 반응이 지속될 수 있어 행동 치료가 함께 필요하다. 또한 요 표시와 단순 부정렬 배뇨를 구분하는 것이 중요하다. 둘의 근본 동기가 다르기 때문에 치료 접근도 달라진다.</p><p>다중 고양이 가구에서는 범 고양이를 정확히 확인하는 것이 치료의 핵심이다. 모션 감지 카메라 같은 도구를 활용하면 분리(격리)로 인한 스트레스 없이 범행을 특정할 수 있다. FVMA와 ISFM는 고양이 수 plus 1개 이상의 모래통을 권장하며, 장소를 분산시키고 매일 배설물을 청소할 것을 권고한다. 환경 스트레스는 하부 요로 질환에 큰 영향을 미치므로 'Five Pillars of a Healthy Feline Environment' 개념을 적용해야 한다.</p><p>치료는 의료 치료, 환경 관리, 행동 치료를 결합한 복합 접근이 필요하다. 페로몬 제품과 처방 영양식이 보완적으로 활용되고, 불안이나 고양이 간 갈등이 심한 경우 약물 치료도 고려한다. 클라이언트 교육과 현실적인 기대치 설정이 치료 성공의 핵심이며, 정기적인 후속 조치로 계획을 조정해 나가는 것이 중요하다.</p>
<p>원문: <a href="https://vetgirlontherun.com/feline-elimination-disorders-a-practical-approach-for-veterinarians-vetgirl-veterinary-continuing-education-blog/" rel="nofollow">VetGirl</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>중증 외상 고양이 환자, 안정화가 먼저입니다</h2><p><b>중증 외상을 않은 위중한 고양이 환자가 도착했을 때, 통증으로 인한 불안으로 바로 마취를 진행하고 싶은 충동을 조절해야 합니다. 안정화를 먼저 수행하는 것이 올바른 치료의 시작입니다.</b></p>
<p>수의학 전문가 타샤 맥너니는 중증 외상을 받은 고양이 환자 관리에서 가장 중요한 원칙은 '안정화 먼저'라고 강조합니다. 많은 수의사들이 고통받는 고양이를 빠른 마취로 바로 보내고 싶은 충동을 느끼지만, 이는 환자 예후에 심각한 문제를 야기할 수 있습니다.</p><p>산소 공급, 쇼크 관리, 진통, 마취 프로토콜의 순서를 지키는 것이 핵심입니다. 먼저 호흡기를 안정화하고 산소를 충분히 공급한 후, 쇼크 상태를 인지하고 적절한 수액 치료를 진행합니다. 그 후에 진통제를 투약하고, 마지막으로 마취 프로토콜을 결정합니다. 각 단계에서 환자의 활력 징후를 지속적으로 모니터링해야 합니다.</p><p>한국 동물병원에서도 유사한 상황을 자주 접합니다. 사고나 추락으로 인한 외상 고양이가 도착했을 때, 보호자의 불안과 환자의 통증으로 인해 성급하게 마취를 진행하기 쉽습니다. 그러나 안정화를 먼저 하면 환자 사망률을 낮추고 치료 성과를 개선할 수 있습니다. 또한 마취 전 환자 상태를 충분히 평가하면 마취 합병증을 예방할 수 있습니다.</p>
<p>원문: <a href="https://drandyroark.com/hdytt-the-critical-feline/" rel="nofollow">Dr. Andy Roark</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 식이 칼륨 보충, 요로결석 위험 낮추는 효과 확인</h2><p><b>고양이 Calcium Oxalate 요로결석은 관리와 예방이 어려운 질환으로, 최근 연구에서 식이성 칼륨 클로라이드 보충이 안전하게 수분 섭취와 요량을 증가시켜 결석 위험을 낮출 수 있음이 확인되었다.</b></p>
<p>고양이 요로건강은 수의학에서 중요한 관심사로, 특히 칼슘옥살레이트(CaOx) 요로결석은 치료와 예방 모두에서 도전적인 질환이다. 최근 대조 연구들은 건강한 성체 고양이에서 식이 칼륨 클로라이드(KCl) 보충제가 수분 섭취와 요량을 증가시켜 요로 광물 농도를 희석하고 칼슘옥살레이트 상대 과포화도(RSS)를 낮출 수 있는지 검증하였다.</p><p>세 가지 보완 연구에서 식이 건조 사료에 칼륨 클로라이드를 1.95%까지 첨가한 결과, 건강한 성체 고양이에서 통계적으로 유의한 수분 섭취 증가와 요량 증가가 관찰되었다. 이로 인해 요중 광물 농도가 낮아졌으며, 칼슘옥살레이트 RSS도 감소하는 경향을 보였다. 장기적으로도 특별한 부작용 없이 안전하게 적용 가능한 것으로 나타났다.</p><p>한국 동물병원 관점에서 이 연구결과는 요로결석 고위험 고양이에 대한 영양학적 예방 전략으로 활용될 수 있다. 수분 섭취 촉진을 위한 다른 조치와 병행하고, 식이 광물 함량 관리와 요 pH 모니터링을 함께 적용한다면 보다 효과적인 결석 예방이 가능할 것이다. 다만 원문에서 처치법과 용량 세부사항은 충분히 검토가 필요하며, 결석 병력 고양이에 대한 장기 연구가 추가로 진행되어야 한다.</p>
<p>원문: <a href="https://ivcjournal.com/dietary-potassium-supplementation-in-cats-a-safe-strategy-to-reduce-urinary-stone-risk/" rel="nofollow">IVC Journal</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>H5N1, 소 유선에서만 심한 감염 보이는 이유 규명</h2><p><b>피츠버그 대학 연구팀이 H5N1 조류 인플루엔자가 소의 폐가 아닌 유선에서만 심각한 감염을 보이는 생물학적 메커니즘을 규명했다. 이 발견으로 향후 새로운 동물 종에서의 바이러스 확산을 예측하고 예방하는 데 도움이 될 전망이다.</b></p>
<p>2024년 초 미국 유방우에서 H5N1 조류 인플루엔자 감염이 처음 확인되었을 때, 수의사들은 원인을 파악하기 어려워했다. 바이러스가 소에서 다른 포유류와 전혀 다른 양상으로 작용했기 때문이다. 주로 폐를 감염시키는 대신 유선(젖샘)에서 심각한 감염을 일으키면서 호흡기 계통은 대부분 정상이었다.</p><p>연구팀은 당단백질 수용체(glycan receptors)의 세밀한 분석을 통해 이 비정상적인 감염 양상의 원인을 밝혔다. H5N1은 N-linked sialic acid라는 특정 수용체 하위 유형에만 결합할 수 있었으며, 이 수용체는 소의 유선 조직 전체에 풍부하게 존재하지만 호흡기 조직에는 거의 존재하지 않았다. 연구자들은 이를 위해 하버드 의대와 협력하여 고해상도 이미징 기술과 결합 실험을 수행했다.</p><p>한국 동물병원 관점에서 이 발견은 향후 발생 가능한 신종 감염병에 대한 대비에 중요하다. 같은 방법으로 다른 동물 종과 조직의 감수성을 사전에 screening할 수 있어, 소에서 유선염만 나타나는지, 고양이에서와 같은 신경 질환이 나타나는지 사전에 예측할 수 있다. 또한 원유 급여를 통한 반려동물 감염 위험과 살균 처리의 중요성도 재확인된다.</p>
<p>원문: <a href="https://www.sciencedaily.com/releases/2026/06/260620100315.htm" rel="nofollow">ScienceDaily</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개와 고양이 소음 민감증, 삼중 접근법으로 관리하기</h2><p><b>반려동물의 소음 과민증은 동물병원에서 흔히 접하는 행동 문제로, 불꽃놀이, 천둥, 교통 소음 등에 과도하게 반응하는 동물들의 스트레스가 심각합니다. 음향 치료, 영양보충제, 체계적 감작 훈련을 결합한 통합 접근법이 효과적인 것으로 보고되고 있습니다.</b></p>
<p>소음에 민감한 반려동물은 단순히 놀라는 것이 아니라 초기 스트레스 반응에서 회복하지 못하는 상태입니다. 구체적 증상으로는 호흡이 급해지거나, 떨림, 숨기, 과도한 울음, 파괴 행동, 심지어 자해까지 포함됩니다. 적절한 관리가 이루어지지 않으면 반복적인 노출이 공포 반응을 악화시키는 감작 과정을 통해 시간이 지날수록 증상이 심해질 수 있으며, 초기 개입이 중요합니다.</p><p>음향 치료는 소음을 치료 도구로 활용하는 방법입니다. Through a Dog's Ear 생음향 음악과 같이 임상적으로 검증된 옵션들이 불안 관련 행동을 줄이는 것으로 확인되었습니다. 이러한 녹음물은 느린 템포와 낮은 음향 복잡성을 가진 심리음향적으로 설계된 클래식 음악을 사용하여 더 안정적인 생리적 상태를 유도합니다. 백색 소음 기기 또한 갑작스러운 환경 소음을 차단하여 공포 반응을 유발하는 급격한 음향 대비를 줄일 수 있습니다. 영양보충제는 약물 사용에 우려가 있는 소유자에게 우수한 보조 도구이며, 효과가 나타나기까지 시간이 걸리므로 빠른 구조용 옵션이 아닙니다.</p><p>체계적 감작 훈련은 장기적인 행동 변화를 위한 금표준 치료입니다. 기록된 소음을 공포 반응을 유발하는 임계값보다 훨씬 낮은 볼륨에서 점진적으로 노출시키고, 고가의 간식이나 놀이와 쌍으로 연계시킵니다. 가장 효과적인 치료 계획은 세 가지 접근법을 결합합니다. 음향 치료는 더 안정적인 일일 환경을 만들고, 영양보충제는 신경계가 학습에 더 반응적으로 반응하도록 기초 불안을 낮추며, 감작 훈련 프로토콜은 근본적 공포 반응을 직접 해결합니다.</p><p>한국 동물병원 관점에서, 소음 민감증을 보이는 환자들을 위한 행동 병력 채득과 개별화된 치료 계획 수립이 필수적입니다. 통합 접근법의 세 가지 요소를 층층히 적용하면 더욱 효과적인 결과를 기대할 수 있으며, 필요시 수의사 감독 하에 약물 지원을 추가할 수 있습니다. 소유교육을 통해 미리 예측되는 트리거 사건 전에 진정 음악을 틀어주고, 영양보충제는 빠른 효과가 아닌 점진적 효능을 고려하도록 안내하는 것이 중요합니다.</p>
<p>원문: <a href="https://ivcjournal.com/three-pronged-approach-to-sound-sensitivity-in-dogs-and-cats/" rel="nofollow">IVC Journal</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>신입 수의사 주목 영역, 고난도 수술·가정방문·난치 케이스</h2><p><b>Dr. Andy Roark가 수의대 졸업 시즌을 맞아 신입 수의사들에게 미래를 보장하는 세 가지 진로 전략을 제시했다. 민간 자본 진출, AI, 외부 약국 등 업계 변화 속에서 자신의 가치를 높이는 방법론을 조언한다.</b></p>
<p>올해 수의대 졸업 시즌이 다가오면서 업계에 새-blood가 유입되는 시기다. 민간 자본의 동물병원 인수, AI 도입, 외부 약국 확장 등 업계 전반에 걸쳐 변화가 일어나고 있지만, 이러한 변화가 반드시 부정적인 결과만 가져오지는 않을 것이라는 전망이다. 전문 수의사 중심의 진료가 일반화될 것이고, 반려동물과 보호자들에게 가장 도움이 되는 것은 라이선스 범위 내에서 최상의 진료를 제공하려는 의사가 될 것이라 전망했다.</p><p>이러한 변화 속에서 AI나 중간 관리자, 향후 수의대 졸업생 공급 과잉으로 인한 충격으로부터 안전한 영역으로 포지셔닝하라는 조언이 나온다. 첫 번째는 고난도 수술로, 스펙·네이터 이상의 수술 수요는 영구히 사라지지 않으며 일반 진료에서도 보람 있는 일과 생계를 유지할 수 있다. 두 번째는 가정 방문 진료로, 타인의 집에 찾아가 인간적인 유대감을 형성하며 제공하는 서비스는 Luxury로 인식되어 가격 민감도가 낮다. 세 번째는 난치 케이스로, 다른 수의사가 어려움을 겪는 분야(치과 합병증, 각막 궤양, 피부 질환, 게르만 셰퍼드 모aimer fistulas 등)에서 명성을 쌓는 것이다.</p><p>한국 동물병원 관점에서 보면, 이 조언은 개인 병원의 생존 전략과도 맞닿아 있다. 대형 병원과의 차별화가 필수적인 상황에서 고난도 수술 역량을 갖춘 수의사는 referral 환자를 유치할 수 있고, 가정 방문 진료는 프리미엄 서비스를 원하는 보호자들에게 직접적이다. 또한 특정 질환군에 특화된 전문성은 지역 내 입소문을 통해 환자 유입을 높일 수 있다.</p>
<p>원문: <a href="https://drandyroark.com/three-areas-for-new-vets/" rel="nofollow">Dr. Andy Roark</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>말 정맥 카테터 삽입 완벽 가이드: 합병증 예방을 위한 실천적 단계</h2><p><b>미국 수의테크니언 전문 미디어에서 소개된 말 정맥 카테터(IVC) 삽입 기술 가이드. 정확하고 위생적인 카테터 삽입은 혈전정맥염, 색전증, 패혈증 등 심각한 합병증을 예방하는 핵심입니다.</b></p>
<p>말에서 정맥 카테터는 정맥 내 약물 및 수액 투여, 반복적인 채혈, 안마제 주입, 안락사 등 다양한 목적으로 사용됩니다. 자격을 갖춘 수의테크니언은 수의사의 지시에 따라 카테터 삽입 적응증을 판단하고, 필요한 장비를 준비하며, 적절한 기술을 적용할 수 있어야 합니다. 카테터 삽입 부위와 재료를 결정할 때는 카테터 사용 목적, 환자 크기, 환자 상태를 고려해야 하며, 비용 문제도 적절히 검토할 수 있습니다.</p><p>가장 흔히 사용되는 것은 바늘 위로 카테터가 통과하는 Over-the-needle 방식입니다. 성체 말에는 14게이지, 길이 13cm 정도가 적합하고, 탈수 및 저혈량 환아에서는 10~12게이지의 큰 카테터가 급격한 수액 투여에 적합합니다. 테플론 재질은 삽입이 용이하고 가격이 합리적이지만 3일 이내 사용이 원칙이며, 폴리우레탄 재질은 2주까지 사용 가능하여 입원 환아에 적합합니다. 주입 부위는 목 상단 1/3 지점이 안전하며, 이 부위에서 외경정맥이 가장 표면적이고 동맥은 더 깊은 위치에 있습니다.</p><p>한국 동물병원에서도 말이 아닌 개, 고양이 등 소동물 정맥 카테터 삽입 시 같은 원칙이 적용됩니다. 무균 기술(asptic technique) 준수는 모든 종에서 합병증 예방의 금기 준수로 평가받으며, 카테터 유지 기간, 재료 선택, 정맥 위치 선정 기준은 동일하게 중요합니다. 수의테크니언이 이러한 기술적 역할을 원활히 수행할 수 있도록 업무 범위와 교육 기회를 확장하는 것이 진료 효율성 향상에 도움이 됩니다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-W26","dateLabel":"2026-W26","dateline":"2026-W26 주간 요약 · 이번 주 가장 주목한 기사","editionNo":"2026 · W26","count":7,"cats":[{"key":"clinical","label":"임상"},{"key":"career","label":"커리어"}],"articles":[{"id":"2026-W26_1","day":"2026-W26","ts":1782468055000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 배설 장애: 수의사를 위한 실용적 접근법","dek":"부정렬 배뇨는 소동물 임상에서 가장 흔한 행동 고소 내용 중 하나로, 고양이 유기 주요 원인이다. 의료적·행동적 원인을 모두 고려한 체계적 접근이 필요하다.","source":"VetGirl","country":"미국","date":"06.26","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/06/Feline-Elimination-Disorders-A-Practical-Approach-for-Veterinarians.png","sourceUrl":"https://vetgirlontherun.com/feline-elimination-disorders-a-practical-approach-for-veterinarians-vetgirl-veterinary-continuing-education-blog/","body":["고양이 배설 문제는 대부분 다중 원인을 가지며, 먼저 의료 상태를 배제하는 것이 필수적이다. 방광염, 요로 결석, 갑상선 기능 항진증 등의 의료 질환이 있는지 충분히 검사해야 한다. 의료 질환이 치료 이후에도 부정적 학습된 정서 반응이 지속될 수 있어 행동 치료가 함께 필요하다. 또한 요 표시와 단순 부정렬 배뇨를 구분하는 것이 중요하다. 둘의 근본 동기가 다르기 때문에 치료 접근도 달라진다.","다중 고양이 가구에서는 범 고양이를 정확히 확인하는 것이 치료의 핵심이다. 모션 감지 카메라 같은 도구를 활용하면 분리(격리)로 인한 스트레스 없이 범행을 특정할 수 있다. FVMA와 ISFM는 고양이 수 plus 1개 이상의 모래통을 권장하며, 장소를 분산시키고 매일 배설물을 청소할 것을 권고한다. 환경 스트레스는 하부 요로 질환에 큰 영향을 미치므로 'Five Pillars of a Healthy Feline Environment' 개념을 적용해야 한다.","치료는 의료 치료, 환경 관리, 행동 치료를 결합한 복합 접근이 필요하다. 페로몬 제품과 처방 영양식이 보완적으로 활용되고, 불안이나 고양이 간 갈등이 심한 경우 약물 치료도 고려한다. 클라이언트 교육과 현실적인 기대치 설정이 치료 성공의 핵심이며, 정기적인 후속 조치로 계획을 조정해 나가는 것이 중요하다."],"blog":"한국 동물병원 블로그에서 '고양이 배설 문제, 먼저 이것부터 확인하세요'라는 제목으로 클라이언트 안내 글을 작성하면 예방과 치료 협조도를 높일 수 있다","blogAngle":["부정렬 배뇨는 의료 질환을 먼저 배제하고 행동 문제로 돌리기 전 반드시 전신 검사가 필요하다","FVMA/ISFM 권고에 따라 고양이 수 plus 1개 이상의 모래통을 배치하고 매일 청소해야 한다","요 표시와 부정렬 배뇨를 구분하여 치료 계획을 세우는 것이 치료 성공의 핵심이다","치료 효과와 환경 변화를 지속적으로 모니터링하고 계획을 유연하게 조정해야 한다"],"radar":{"owner":{"soon":true,"q":"고양이가 갑자기 변기 밖이나 침대 위에 오줌/똥을 누는데, 뭐가 원인일까요?","script":"먼저 방광염이나 요로 결석 같은 의료 질환이 있는지 검사를 해야 합니다. 의료 질환이 없다면 환경 스트레스나 행동적 원인을 살펴보게 되는데, 고양이는 환경 변화에 매우 민감해서 모래통 위치나 수, 다른 고양이와의 갈등 등도 문제가 될 수 있습니다. 치료는 의료 치료와 환경 개선, 행동 치료를 같이 해야 하며, 오래된 문제는 오래 걸리니 인내심이 필요합니다."},"clinical":"배설 문제 호소 고양이 환자에 대해 의료 질환 배제를 위한 기본 검사(소변 검사, 영상 검사 등) 프로토콜을 점검하고, 환경 스트레스 평가 항목을 문진에 포함시키세요.","evidence":null},"tag":""},{"id":"2026-W26_2","day":"2026-W26","ts":1782363600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"중증 외상 고양이 환자, 안정화가 먼저입니다","dek":"중증 외상을 않은 위중한 고양이 환자가 도착했을 때, 통증으로 인한 불안으로 바로 마취를 진행하고 싶은 충동을 조절해야 합니다. 안정화를 먼저 수행하는 것이 올바른 치료의 시작입니다.","source":"Dr. Andy Roark","country":"미국","date":"06.25","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-404-blog-pic.jpg","sourceUrl":"https://drandyroark.com/hdytt-the-critical-feline/","body":["수의학 전문가 타샤 맥너니는 중증 외상을 받은 고양이 환자 관리에서 가장 중요한 원칙은 '안정화 먼저'라고 강조합니다. 많은 수의사들이 고통받는 고양이를 빠른 마취로 바로 보내고 싶은 충동을 느끼지만, 이는 환자 예후에 심각한 문제를 야기할 수 있습니다.","산소 공급, 쇼크 관리, 진통, 마취 프로토콜의 순서를 지키는 것이 핵심입니다. 먼저 호흡기를 안정화하고 산소를 충분히 공급한 후, 쇼크 상태를 인지하고 적절한 수액 치료를 진행합니다. 그 후에 진통제를 투약하고, 마지막으로 마취 프로토콜을 결정합니다. 각 단계에서 환자의 활력 징후를 지속적으로 모니터링해야 합니다.","한국 동물병원에서도 유사한 상황을 자주 접합니다. 사고나 추락으로 인한 외상 고양이가 도착했을 때, 보호자의 불안과 환자의 통증으로 인해 성급하게 마취를 진행하기 쉽습니다. 그러나 안정화를 먼저 하면 환자 사망률을 낮추고 치료 성과를 개선할 수 있습니다. 또한 마취 전 환자 상태를 충분히 평가하면 마취 합병증을 예방할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '고양이 외상 환자의 마취 전 안정화 protocol'로 재편집하면 매우 좋은 교육 콘텐츠가 됩니다","blogAngle":["중증 외상 고양이 환자에서 불안정한 활력 징후는 마취 전 반드시 안정화해야 합니다","산소 공급 → 쇼크 관리 → 진통 → 마취 순서로 치료를 진행합니다","빠른 마취는 환자 예후를 악화시킬 수 있어 충동을 억제해야 합니다","마취 전 충분한 평가와 안정화가 마취 합병증을 예방합니다"],"radar":{"owner":{"soon":true,"q":"선생님, 고양이가 사고나서 너무 아파하는데 왜 바로 마취를 안 해주시고 불안정하셨어요?","script":"고양이가 외상을 받았을 때는 먼저 산소를 공급하고 쇼크 상태를 관리한 후 진통제를 투여하는 단계가 필요합니다. 이 안정화 과정을 거쳐야 마취 시 합병증 위험을 낮출 수 있고 오히려 더 안전합니다. 지금부터 천천히 상태를 안정시키면서 진행하겠습니다."},"clinical":"중증 외상 고양이 환자가 도착했을 때 산소 공급→쇼크 관리→진통→마취 순서 프로토콜을 반드시 준수하는지 점검하고, 각 단계에서 활력징후 모니터링을 철저히 할 것","evidence":null},"tag":""},{"id":"2026-W26_3","day":"2026-W26","ts":1782219649000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 식이 칼륨 보충, 요로결석 위험 낮추는 효과 확인","dek":"고양이 Calcium Oxalate 요로결석은 관리와 예방이 어려운 질환으로, 최근 연구에서 식이성 칼륨 클로라이드 보충이 안전하게 수분 섭취와 요량을 증가시켜 결석 위험을 낮출 수 있음이 확인되었다.","source":"IVC Journal","country":"미국","date":"06.23","read":"1분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_1oxrva1oxrva1oxr-600x355.png","sourceUrl":"https://ivcjournal.com/dietary-potassium-supplementation-in-cats-a-safe-strategy-to-reduce-urinary-stone-risk/","body":["고양이 요로건강은 수의학에서 중요한 관심사로, 특히 칼슘옥살레이트(CaOx) 요로결석은 치료와 예방 모두에서 도전적인 질환이다. 최근 대조 연구들은 건강한 성체 고양이에서 식이 칼륨 클로라이드(KCl) 보충제가 수분 섭취와 요량을 증가시켜 요로 광물 농도를 희석하고 칼슘옥살레이트 상대 과포화도(RSS)를 낮출 수 있는지 검증하였다.","세 가지 보완 연구에서 식이 건조 사료에 칼륨 클로라이드를 1.95%까지 첨가한 결과, 건강한 성체 고양이에서 통계적으로 유의한 수분 섭취 증가와 요량 증가가 관찰되었다. 이로 인해 요중 광물 농도가 낮아졌으며, 칼슘옥살레이트 RSS도 감소하는 경향을 보였다. 장기적으로도 특별한 부작용 없이 안전하게 적용 가능한 것으로 나타났다.","한국 동물병원 관점에서 이 연구결과는 요로결석 고위험 고양이에 대한 영양학적 예방 전략으로 활용될 수 있다. 수분 섭취 촉진을 위한 다른 조치와 병행하고, 식이 광물 함량 관리와 요 pH 모니터링을 함께 적용한다면 보다 효과적인 결석 예방이 가능할 것이다. 다만 원문에서 처치법과 용량 세부사항은 충분히 검토가 필요하며, 결석 병력 고양이에 대한 장기 연구가 추가로 진행되어야 한다."],"blog":"고양이 요로결석 고위험 환아 보호자에게 수분 섭취 중요성을 설명하며, 식이 조정 방안의 하나로 칼륨 보충 전략을 언급하는 블로그 콘텐츠로 활용할 수 있다","blogAngle":["칼륨 클로라이드 보충제 1.95%(사료 내)까지는 건강한 고양이에게 안전하며 부작용이 관찰되지 않았다","식이성 칼륨 보충은 수분 섭취와 요량을 증가시켜 요중 광물 농도를 희석한다","칼슘옥살레이트 상대 과포화도(RSS) 감소를 통해 요로결석 형성 위험을 낮출 수 있다","영양학적 예방 전략으로 수분 섭취 촉진, 식이 관리, 요 pH 모니터링과 병행 적용이 권장된다"],"radar":{"owner":{"soon":true,"q":"우리 고양이한테 칼륨 보충제도 줘도 되나요? 요로결석 예방에 좋대던데","script":"칼륨 클로라이드 보충이 수분 섭취를 높이고 요로를 희석시키는 연구 결과가 있습니다. 다만 아직 결석 경험이 있는 고양이에서의 장기 연구는 더 필요하고, 무조건 보충제를 주는보다는 수분 섭취를 늘리는 여러 방법을 병행하는 게 좋습니다. 결석이 있었던 고양이라면 영영 먼저 상담해 주세요."},"clinical":"고양이 요로결석 고위험군 문진 시 식이 내용과 수분 섭취량 점검하고, 수분 섭취 촉진 조치를 병행하는 영양 관리 계획 수립 고려","evidence":null},"tag":""},{"id":"2026-W26_4","day":"2026-W26","ts":1782225111000,"cat":"clinical","kicker":"임상","isToday":false,"title":"H5N1, 소 유선에서만 심한 감염 보이는 이유 규명","dek":"피츠버그 대학 연구팀이 H5N1 조류 인플루엔자가 소의 폐가 아닌 유선에서만 심각한 감염을 보이는 생물학적 메커니즘을 규명했다. 이 발견으로 향후 새로운 동물 종에서의 바이러스 확산을 예측하고 예방하는 데 도움이 될 전망이다.","source":"ScienceDaily","country":"","date":"06.23","read":"1분 읽기","plate":"ScienceDaily","image":"https://www.sciencedaily.com/images/1920/holstein-cow-with-ear-tags-on-pasture-looking.webp","sourceUrl":"https://www.sciencedaily.com/releases/2026/06/260620100315.htm","body":["2024년 초 미국 유방우에서 H5N1 조류 인플루엔자 감염이 처음 확인되었을 때, 수의사들은 원인을 파악하기 어려워했다. 바이러스가 소에서 다른 포유류와 전혀 다른 양상으로 작용했기 때문이다. 주로 폐를 감염시키는 대신 유선(젖샘)에서 심각한 감염을 일으키면서 호흡기 계통은 대부분 정상이었다.","연구팀은 당단백질 수용체(glycan receptors)의 세밀한 분석을 통해 이 비정상적인 감염 양상의 원인을 밝혔다. H5N1은 N-linked sialic acid라는 특정 수용체 하위 유형에만 결합할 수 있었으며, 이 수용체는 소의 유선 조직 전체에 풍부하게 존재하지만 호흡기 조직에는 거의 존재하지 않았다. 연구자들은 이를 위해 하버드 의대와 협력하여 고해상도 이미징 기술과 결합 실험을 수행했다.","한국 동물병원 관점에서 이 발견은 향후 발생 가능한 신종 감염병에 대한 대비에 중요하다. 같은 방법으로 다른 동물 종과 조직의 감수성을 사전에 screening할 수 있어, 소에서 유선염만 나타나는지, 고양이에서와 같은 신경 질환이 나타나는지 사전에 예측할 수 있다. 또한 원유 급여를 통한 반려동물 감염 위험과 살균 처리의 중요성도 재확인된다."],"blog":"한국 동물병원 블로그에서는 소와 고양이 등 가축에서 나타나는 비전형적 감염 양상과 원유 급여의 위험성에 대해 다루는 콘텐츠로 활용할 수 있다.","blogAngle":["H5N1은 소에서 주로 폐가 아닌 유선에 심각한 감염을 일으켜 괴사성 유선염을 유발했다","바이러스는 특정 N-linked sialic acid 수용체에만 결합할 수 있으며, 이 수용체는 유선에는 풍부하지만 호흡기에는 거의 없다","이 발견은 향후 동물 종별 감수성을 사전에 예측하고 대응 전략을 세우는 데 활용될 수 있다","살균 처리된 우유는 안전하지만 원유 급여는 반려동물에게 치명적일 수 있다"],"radar":{"owner":{"soon":true,"q":"강아지에게 우유를 줘도 괜찮을까요? 조류 인플루엔자가 유행해서 우려됩니다.","script":"원유를 충분히 끓이거나 살균 처리하면 바이러스는 안전하게 제거됩니다. 다만 조류 인플루엔자가 유행하신다면 원유 대신 강아지 전용 우유나 일반 우유를 끓여서 주시는 것이 좋습니다. 일상적으로는 새 똥이나 야생 조류와의 접촉을 피하게어 주세요."},"clinical":"원유 급여에 대한 보호자 문의 시 살균 처리 중요성을 안내하고, 야생 조류 접촉 차단 권고 문안을 점검·비치한다.","evidence":null},"tag":""},{"id":"2026-W26_5","day":"2026-W26","ts":1782133225000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개와 고양이 소음 민감증, 삼중 접근법으로 관리하기","dek":"반려동물의 소음 과민증은 동물병원에서 흔히 접하는 행동 문제로, 불꽃놀이, 천둥, 교통 소음 등에 과도하게 반응하는 동물들의 스트레스가 심각합니다. 음향 치료, 영양보충제, 체계적 감작 훈련을 결합한 통합 접근법이 효과적인 것으로 보고되고 있습니다.","source":"IVC Journal","country":"미국","date":"06.22","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_f5t5xf5t5xf5t5xf-scaled-e1782118196201-600x322.png","sourceUrl":"https://ivcjournal.com/three-pronged-approach-to-sound-sensitivity-in-dogs-and-cats/","body":["소음에 민감한 반려동물은 단순히 놀라는 것이 아니라 초기 스트레스 반응에서 회복하지 못하는 상태입니다. 구체적 증상으로는 호흡이 급해지거나, 떨림, 숨기, 과도한 울음, 파괴 행동, 심지어 자해까지 포함됩니다. 적절한 관리가 이루어지지 않으면 반복적인 노출이 공포 반응을 악화시키는 감작 과정을 통해 시간이 지날수록 증상이 심해질 수 있으며, 초기 개입이 중요합니다.","음향 치료는 소음을 치료 도구로 활용하는 방법입니다. Through a Dog's Ear 생음향 음악과 같이 임상적으로 검증된 옵션들이 불안 관련 행동을 줄이는 것으로 확인되었습니다. 이러한 녹음물은 느린 템포와 낮은 음향 복잡성을 가진 심리음향적으로 설계된 클래식 음악을 사용하여 더 안정적인 생리적 상태를 유도합니다. 백색 소음 기기 또한 갑작스러운 환경 소음을 차단하여 공포 반응을 유발하는 급격한 음향 대비를 줄일 수 있습니다. 영양보충제는 약물 사용에 우려가 있는 소유자에게 우수한 보조 도구이며, 효과가 나타나기까지 시간이 걸리므로 빠른 구조용 옵션이 아닙니다.","체계적 감작 훈련은 장기적인 행동 변화를 위한 금표준 치료입니다. 기록된 소음을 공포 반응을 유발하는 임계값보다 훨씬 낮은 볼륨에서 점진적으로 노출시키고, 고가의 간식이나 놀이와 쌍으로 연계시킵니다. 가장 효과적인 치료 계획은 세 가지 접근법을 결합합니다. 음향 치료는 더 안정적인 일일 환경을 만들고, 영양보충제는 신경계가 학습에 더 반응적으로 반응하도록 기초 불안을 낮추며, 감작 훈련 프로토콜은 근본적 공포 반응을 직접 해결합니다.","한국 동물병원 관점에서, 소음 민감증을 보이는 환자들을 위한 행동 병력 채득과 개별화된 치료 계획 수립이 필수적입니다. 통합 접근법의 세 가지 요소를 층층히 적용하면 더욱 효과적인 결과를 기대할 수 있으며, 필요시 수의사 감독 하에 약물 지원을 추가할 수 있습니다. 소유교육을 통해 미리 예측되는 트리거 사건 전에 진정 음악을 틀어주고, 영양보충제는 빠른 효과가 아닌 점진적 효능을 고려하도록 안내하는 것이 중요합니다."],"blog":"한국 동물병원 블로그에서 '반려동물의 소음 공포증, 집에서 쉽게 실천할 수 있는 세 가지 관리법'이라는 제목으로 소유자를 위한 실용 가이드로 활용할 수 있습니다","blogAngle":["소음 민감증은 단순한 놀람이 아니라 스트레스 반응에서 회복하지 못하는 상태로, 적절한 치료 없이는 시간이 지날수록 악화될 수 있습니다","음향 치료는 심리음향적으로 설계된 클래식 음악이나 백색 소음을 활용하여 불안 감소에 도움을 주며, 트리거 사건 전에 미리 틀어주는 것이 효과적입니다","영양보충제는 기초 불안을 낮추어 신경계가 학습에 더 반응하도록 하지만, 빠른 효과가 아닌 점진적 효능을 기대해야 합니다","체계적 감작 훈련은 기록된 소음을 낮은 볼륨에서 점진적으로 노출시키고 긍정적 경험과 연계하는 것이 장기적 행동 변화의 금표준입니다","한국 동물병원에서는 세 가지 접근법을 결합한 개별화된 치료 계획을 수립하고, 소유 교육과 함께 장기적인 관리 전략을 제공하는 것이 중요합니다"],"radar":{"owner":{"soon":true,"q":"천둥이나 불꽃놀이 소리에 너무 무서워하는데, 음악 치료나 영양 보충제가 효과가 있을까요?","script":"소음 민감증은 음향 치료, 영양 보충제, 체계적 감작 훈련을 함께 쓰면 더 효과적입니다.집에서 느린 클래식 음악을 틀어두면 불안감을 줄이는 데 도움이 되지만, 보충제는 서서히 효과를 보기 때문에 급격한 개선은 기대하기 어렵습니다.천둥 소리나 불꽃놀이 전에는 미리 음악을 틀어주고 강아지를 익숙하게 만드는 훈련을 시작하는 것이 좋습니다."},"clinical":"소음 민감증 환자를 위해 행동 병력을 체계적으로 채득하고, 음향 치료·영양 보충제·감작 훈련을 조합한 개별화된 치료 계획을 수립하세요.","evidence":null},"tag":""},{"id":"2026-W26_6","day":"2026-W26","ts":1782446400000,"cat":"career","kicker":"커리어","isToday":false,"title":"신입 수의사 주목 영역, 고난도 수술·가정방문·난치 케이스","dek":"Dr. Andy Roark가 수의대 졸업 시즌을 맞아 신입 수의사들에게 미래를 보장하는 세 가지 진로 전략을 제시했다. 민간 자본 진출, AI, 외부 약국 등 업계 변화 속에서 자신의 가치를 높이는 방법론을 조언한다.","source":"Dr. Andy Roark","country":"미국","date":"06.26","read":"2분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/three-areas.jpg","sourceUrl":"https://drandyroark.com/three-areas-for-new-vets/","body":["올해 수의대 졸업 시즌이 다가오면서 업계에 새-blood가 유입되는 시기다. 민간 자본의 동물병원 인수, AI 도입, 외부 약국 확장 등 업계 전반에 걸쳐 변화가 일어나고 있지만, 이러한 변화가 반드시 부정적인 결과만 가져오지는 않을 것이라는 전망이다. 전문 수의사 중심의 진료가 일반화될 것이고, 반려동물과 보호자들에게 가장 도움이 되는 것은 라이선스 범위 내에서 최상의 진료를 제공하려는 의사가 될 것이라 전망했다.","이러한 변화 속에서 AI나 중간 관리자, 향후 수의대 졸업생 공급 과잉으로 인한 충격으로부터 안전한 영역으로 포지셔닝하라는 조언이 나온다. 첫 번째는 고난도 수술로, 스펙·네이터 이상의 수술 수요는 영구히 사라지지 않으며 일반 진료에서도 보람 있는 일과 생계를 유지할 수 있다. 두 번째는 가정 방문 진료로, 타인의 집에 찾아가 인간적인 유대감을 형성하며 제공하는 서비스는 Luxury로 인식되어 가격 민감도가 낮다. 세 번째는 난치 케이스로, 다른 수의사가 어려움을 겪는 분야(치과 합병증, 각막 궤양, 피부 질환, 게르만 셰퍼드 모aimer fistulas 등)에서 명성을 쌓는 것이다.","한국 동물병원 관점에서 보면, 이 조언은 개인 병원의 생존 전략과도 맞닿아 있다. 대형 병원과의 차별화가 필수적인 상황에서 고난도 수술 역량을 갖춘 수의사는 referral 환자를 유치할 수 있고, 가정 방문 진료는 프리미엄 서비스를 원하는 보호자들에게 직접적이다. 또한 특정 질환군에 특화된 전문성은 지역 내 입소문을 통해 환자 유입을 높일 수 있다."],"blog":"한국 동물병원 블로그에서 '우리 병원의 특화 진료 소개' 또는 '신입 수의사 위한 커리어 advice' 시리즈의 소재로 활용할 수 있다","blogAngle":["민간 자본·AI·외부 약국 등 업계 변화는 위협이 아닌 기회가 될 수 있다","고난도 수술, 가정 방문 진료, 난치 케이스 세 영역이 AI와 중간 관리자로부터 비교적 안전하다","가정 방문 진료는 가격 민감도가 낮은 프리미엄 서비스로, 인간적 유대가 핵심이다","난치 케이스에서 명성을 얻으려면 다른 의사가 어려워하는 분야를 선택하고 깊이 파고들어야 한다"],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":""},{"id":"2026-W26_7","day":"2026-W26","ts":1782414196000,"cat":"clinical","kicker":"임상","isToday":false,"title":"말 정맥 카테터 삽입 완벽 가이드: 합병증 예방을 위한 실천적 단계","dek":"미국 수의테크니언 전문 미디어에서 소개된 말 정맥 카테터(IVC) 삽입 기술 가이드. 정확하고 위생적인 카테터 삽입은 혈전정맥염, 색전증, 패혈증 등 심각한 합병증을 예방하는 핵심입니다.","source":"Today's Veterinary Nurse","country":"미국","date":"06.26","read":"2분 읽기","plate":"Today's Veterinary Nurse","image":"https://todaysveterinarynurse.com/wp-content/uploads/sites/3/2026/06/Cripe_EquineIVs_TVN2026Web_MainImage.png","sourceUrl":"https://todaysveterinarynurse.com/equine-medicine/a-step-by-step-guide-to-intravenous-catheter-placement-in-the-equine-patient/","body":["말에서 정맥 카테터는 정맥 내 약물 및 수액 투여, 반복적인 채혈, 안마제 주입, 안락사 등 다양한 목적으로 사용됩니다. 자격을 갖춘 수의테크니언은 수의사의 지시에 따라 카테터 삽입 적응증을 판단하고, 필요한 장비를 준비하며, 적절한 기술을 적용할 수 있어야 합니다. 카테터 삽입 부위와 재료를 결정할 때는 카테터 사용 목적, 환자 크기, 환자 상태를 고려해야 하며, 비용 문제도 적절히 검토할 수 있습니다.","가장 흔히 사용되는 것은 바늘 위로 카테터가 통과하는 Over-the-needle 방식입니다. 성체 말에는 14게이지, 길이 13cm 정도가 적합하고, 탈수 및 저혈량 환아에서는 10~12게이지의 큰 카테터가 급격한 수액 투여에 적합합니다. 테플론 재질은 삽입이 용이하고 가격이 합리적이지만 3일 이내 사용이 원칙이며, 폴리우레탄 재질은 2주까지 사용 가능하여 입원 환아에 적합합니다. 주입 부위는 목 상단 1/3 지점이 안전하며, 이 부위에서 외경정맥이 가장 표면적이고 동맥은 더 깊은 위치에 있습니다.","한국 동물병원에서도 말이 아닌 개, 고양이 등 소동물 정맥 카테터 삽입 시 같은 원칙이 적용됩니다. 무균 기술(asptic technique) 준수는 모든 종에서 합병증 예방의 금기 준수로 평가받으며, 카테터 유지 기간, 재료 선택, 정맥 위치 선정 기준은 동일하게 중요합니다. 수의테크니언이 이러한 기술적 역할을 원활히 수행할 수 있도록 업무 범위와 교육 기회를 확장하는 것이 진료 효율성 향상에 도움이 됩니다."],"blog":"개와 고양이 등 소동물 정맥 카테터 삽입 시 주의할 점과 합병증 예방법에 대해 한국 동물병원 블로그에서 다루기 좋은 주제입니다.","blogAngle":["정맥 카테터 삽입은 수의테크니언의 업무 범위 내에 있으며, 적절한 교육과 훈련을 통해.mastery 가능","목 상단 1/3 부위에 삽입하면 외경정맥이 가장 표면적이고 동맥 손상 위험이 낮음","테플론 재질 카테터는 최대 3일, 폴리우레탄은 최대 2주 사용 가능하며 용도에 따라 선택","무균 기술 준수는 혈전정맥염, 패혈증 등 심각한 합병증 예방을 위한 필수적인 원칙"],"radar":{"owner":null,"clinical":"정맥 카테터 삽입 시 무균 기술 준수 여부와 카테터 유지 기간, 재료를 확인하고 점검","evidence":null},"tag":""}],"stories":[],"weekly":true}</script>

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.
  function qaColumn(arr){

      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';

  }

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){
    var pad=(3-(list.length%3))%3, fill='';

    return '<div class="vm-band" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--color-line-normal);">'+list.map(bandCard).join('')+fill+'</div>';

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';

    return '<div style="margin-top:32px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 13px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">최근 브리핑</span><span style="font-size:12.5px;color:var(--color-label-alternative);">지난 며칠 사이 주요 기사</span></div>'

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';

    var rows=list.map(function(a,i){
      return '<div class="vm-story'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:14px;align-items:baseline;padding:14px 2px;border-top:1px solid var(--color-line-normal);cursor:pointer;">'
      +'<span style="flex:none;width:20px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--color-label-assistive);text-align:center;">'+(i+1)+'</span>'

      +'<div class="vm-hl" style="font-size:15.5px;font-weight:700;line-height:1.45;color:var(--color-label-strong);text-wrap:pretty;">'+(a.tag?'<span style="color:var(--color-primary-normal);font-weight:800;">['+e(a.tag)+']</span> ':'')+e(a.title)+'</div>'

    }).join('');
    return '<div style="margin-top:32px;padding:22px 24px 24px;background:var(--color-background-alternative);border-radius:16px;">'
    +'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:2px;"><span style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 밖 이야기</span><span style="font-size:12.5px;color:var(--color-label-alternative);">해외에서 화제가 된 반려동물·병원 썰</span></div>'

  function homeView(){
    var arr=activeList();
    if(!arr.length){ return '<div style="text-align:center;padding:64px 0;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-label-neutral);">해당 조건의 글이 없습니다</div><p style="margin:8px 0 0;font-size:14px;">필터를 바꿔보세요.</p></div>'; }
    var lead=arr[0], rail=arr.slice(1,3), bandAll=arr.slice(3);

  function listView(items,emptyT,emptyH){

    return '<div style="padding-top:8px;">'+items.map(rowCard).join('')+'</div>';

    return '<div style="padding-top:16px;"><div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;"><button data-act="makedraft" style="display:inline-flex;align-items:center;gap:8px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">✍️ AI 블로그 초안 만들기</button><button data-act="copyall" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--color-primary-normal);border:1px solid var(--color-primary-normal);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 전체 복사</button></div>'+items.map(ideaCard).join('')+'</div>';

      +'<div style="flex:none;font-size:12px;color:'+(cur?'var(--color-primary-normal)':'var(--color-label-alternative)')+';font-weight:700;white-space:nowrap;">'+(cur?'현재 · ':'')+x.count+'건</div></button>';

        +'<div style="white-space:pre-wrap;font-size:15px;line-height:1.85;color:var(--color-label-neutral);background:var(--color-background-alternative);border-radius:10px;padding:16px 18px;">'+e(r.body||'')+'</div>'
        +'<div style="margin:16px 0 8px;">'+tags+'</div>'
        +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button data-act="copydraft" style="display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 제목+본문+태그 전체 복사</button><button data-act="draftclose" style="border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 16px;border-radius:10px;">닫기</button></div>'
        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'
        +'</div>';
    }
    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?'구독 신청 완료! 매일 아침 받아보세요':(res.error||'실패')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
