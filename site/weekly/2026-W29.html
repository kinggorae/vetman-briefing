<h2>웨일스 동물병원, '통증 제로' 인증 획득</h2><p><b>영국 웨일스의 한 동물병원이 통증 관리 분야의 최고 수준의 인증을 획득했습니다. 이 인증은 동물들의 수술 전후 통증을 최소화하기 위한 체계적인 프로토콜을 갖추고 있음을 의미합니다.</b></p>
<p>영국수의사회(RCVS)가 운영하는 통증 관리 인증제는 병원이 수술 전, 수술 중, 수술 후 전 과정에 걸쳐 체계적인 통증 관리를 제공하고 있음을 인정하는 프로그램입니다. 이번에 인증을 획득한 병원은 통증 평가 도구를 정기적으로 사용하고, 각 동물에 맞는 맞춤형 진통 프로토콜을 적용하며, 보호자에게 퇴원 후 관리 방법을 상세히 안내하는 시스템을 갖추고 있습니다.</p><p>인증 심사에는 통증 평가 및 기록 체계, 약물 선택 및 용량 설정 기준, 모니터링 프로토콜, 비상 상황 대응 절차 등이 포함됩니다. 특히 수술 후 통증 관리는 단순히 진통제 투여에만 그치지 않고, 동물의 행동 변화를 세밀히 관찰하여 통증 수준을 지속적으로 평가하는 것이 중요합니다.</p><p>한국의 동물병원들도 통증 관리의 중요성을 인식하고 있지만, 체계적인 인증 시스템은 아직 발전 중인 단계입니다. 이번 사례는 한국의 동물병원들이 통증 관리 표준화 노력의 참고 자료가 될 수 있으며, 보호자에게 더욱 수준 높은 의료 서비스를 제공하기 위한 자극제가 될 것으로 보입니다.</p>
<p>원문: <a href="https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70994?af=R" rel="nofollow">Veterinary Record</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>플루니키신, 송아지 플루오로퀴놀론 약물동태에 미치는 영향</h2><p><b>송아지 호흡기 질병 치료 시 항생제와 진통제의 병용이 흔하지만, 두 약물 간 약물동태 상호작용에 대한 연구가 부족했습니다.</b></p>
<p>본 연구는 생후 20~30일령의 건강한 홀ANDO 아르헨티노 송아지 10마리를 대상으로 플루오로퀴놀론 계통 항생제(enrofloxacin, marbofloxacin)와 진통제 플루니키신의 병용 시 약물동태 변화를 평가했습니다. 우선 항생제만 투여하고 15일 세척기간 후 플루니키신을 함께 투여하여 비교 분석했습니다.</p><p>플루니키신 병용 시 두 항생제의 제거 반감기가 유의하게 연장되었으나, 농도-시간 곡선하면적(AUC)에는 변화가 없었습니다. 특히 enrofloxacin의 대사물인 ciprofloxacin으로의 전환이 감소했습니다. 약효평가 지표(PK/PD 지표)는 Pasteurella multocida와 Histophilus somni에 대해서는 목표를 달성했으나, Mannheimia haemolytica와 Mycoplasma bovis에 대해서는 목표에 미치지 못했습니다.</p><p>한국 동물병원에서 송아지 호흡기 질병 치료 시 항생제와 진통제 병용에 대한 재고가 필요합니다. 플루니키신이 항생제의 체내 잔류 시간을 연장시킬 수 있으나, 원인균에 따라 치료 효과가 달라질 수 있음을 유의해야 합니다. 특히 소의 호흡기 질환에서 주요 병원체에 대한 맞춤형 치료 전략 수립이 중요합니다.</p>
<p>원문: <a href="https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70473?af=R" rel="nofollow">Veterinary Record</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>로미피딘이 말 인두 기능 등급에 미치는 영향 연구</h2><p><b>영국수의학저널에 발표된 연구로, 로미피딘 안정제가 말 인두 기능 내시경 검사 결과에 영향을 미치는지 조사했습니다. 경미한 용량(0.04mg/kg)에서는 영향이 없었으나, 용량 증가 시 성문 면적이 유의하게 감소했습니다.</b></p>
<p>의학적 맥락에서 말의 인두 기능 평가는 호흡기 질환 진단에 중요한 과정입니다. 그러나 안정제 사용이 검사 결과에 영향을 미칠 수 있다는 우려가 있어 왔습니다. 특히 로미피딘은 말에서 흔히 사용되는 α2 작용제 계열 안정제이지만, 인두 기능에 미치는 구체적 효과는 제대로 연구되지 않았습니다.</p><p>이번 연구는 10두의 말을 대상으로 세 차례 내시경 검사를 실시했습니다. 안정제 미투여군, 로미피딘 0.04mg/kg 정맥주사군, 그리고 총 0.08mg/kg 투여군으로 나누어 인두 기능 등급과 성문 면적을 측정했습니다. 그 결과, 경미한 용량에서는 인두 기능 등급과 성문 면적 모두 유의한 변화가 없었습니다. 그러나 반복 투여 후 총 용량이 증가하자 성문 면적이 유의하게 감소했습니다.</p><p>한국 동물병원 관점에서 볼 때, 이 연구는 말 호흡기 검진 시 안정제 선택과 용량 결정에 중요한 근거를 제공합니다. 경미한 용량의 로미피딘은 인두 기능 평가에 영향을 미치지 않으므로, 임상 현장에서 진단 목적의 안정제로 활용 가능할 것으로 보입니다. 다만, 용량 증가 시 성문 면적이 감소할 수 있음을 고려해야 합니다.</p>
<p>원문: <a href="https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70804?af=R" rel="nofollow">Veterinary Record</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의사의 애완동물 말하기, 보호자 재방문 의향 높여</h2><p><b>영국 수의사 400명 이상을 대상으로 한 설문조사 결과, 약 80%의 수의사가 진료 중 강아지·고양이 대상으로 특정 말하기 방식을 사용하며, 약 90%가 이를 사용한 수의사를 다시 찾고 싶다는 응답을 보였다.</b></p>
<p>여러 연구에서 수의사들이 진료 중 '반려동물 대상 말하기(pet-directed speech)'를 사용하는 것이 관찰되어 왔다. 이번 연구는 이 말하기 방식이 동물병원 방문 시 얼마나 흔히 사용되는지, 그리고 이것이 보호자들의 수의사 인식에 어떤 영향을 미치는지 파악하기 위해 온라인 설문조사를 실시했다.</p><p>설문 결과를 분석한 결과, 응답자 400명 중 약 80%가 수의사가 진료 중 애완동물에게 특정 방식으로 말을 걸었다고 보고했다. 대부분의 보호자들은 이것이 '매우 중요하다'거나 '아주 중요하다'고 평가했으며, 약 90%는 이러한 말하기 방식을 사용하는 수의사를 다시 방문하고 싶어 할 것다고 응답했다. 자유 기술 응답 분석에서는 '반려동물을 중심에', '말만이 아니다', '보호자를 포함하라', '수의사 인상'이라는 네 가지 주요 주제가 도출되었다.</p><p>한국 동물병원 관점에서 보면, 이 연구결과는 진료 실전에서 간단한 소통 기법이 고객 충성도에 큰 영향을 줄 수 있음을 보여준다. 강아지·고양이뿐 아니라 보호자를 바라보며 대화하고, 진찰대에 올라온 동물에게 부드럽게 말을 걸며, 보호자를 진료 과정에 포함시키는 작은 노력이 재방문율과 추천 의향에 긍정적 영향을 미칠 수 있다. 이는 별도의 장비나 약물 없이도 가능한 서비스 품질 향상 방안이 될 수 있다.</p>
<p>원문: <a href="https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70500?af=R" rel="nofollow">Veterinary Record</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>벨기에 고양이 사료 급이량, 권장 에너지 초과 가능</h2><p><b>벨기에 판매 고양이 사료의 급이 지침을 분석한 결과, 일부 제품이 유럽업계 단체(FEDIAF)의 권장 에너지 섭취량을 초과할 수 있는 것으로 나타났습니다. 과체중·비만 고양이가 많은 상황에서 사료 라벨의 정확성이 관심입니다.</b></p>
<p>연구팀은 벨기에 상점에서 판매되는 성체 영양완전 고양이 사료 100개 이상을 대상으로 급이 지침을 분석했습니다. 각 제품의 라벨 급이 권장과 FEDIAF가 제시한 성체 고양이 평균 에너지 요구량을 비교했으며, 그램 단위 급이 지침이 포장을 포함한 측정 단위보다 FEDIAF 지침과 더 밀접하게 일치했습니다.</p><p>분석 결과, 대부분의 개별 사료 라벨은 FEDIAF 평균 권장 범위 내의 일일 에너지 섭취량을 제시했습니다. 그러나 제품 그룹별 중앙값을 FEDIAF 권장 에너지 계수와 비교했을 때 일부 차이점이 관찰되었으며, 특히 포장을 기준으로 한 급이량 추정에서 차이가 발생했습니다.</p><p>한국 동물병원 관점에서 보면, 사료 라벨의 급이 지침이 개별 반려동물의 에너지 필요량을 완벽히 반영하지 못할 수 있음을 의미합니다. 수의사는 고양이 보호자에게 라벨 권장을 출발점으로 삼되, 각 고양이의 적정 체중 유지를 위해 급이량을 조절하는 방법을 안내하는 것이 좋습니다. 특히 비만 위험이 있는 고양이에서는 라벨 급이량보다 적은 양을 권고하는 것이 유리할 수 있습니다.</p>
<p>원문: <a href="https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70802?af=R" rel="nofollow">Veterinary Record</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">

<p>원문: <a href="https://www.myvetcandy.com/news/2026/7/15/scientists-just-found-the-same-intestinal-disease-fingerprint-in-cows-dogs-and-humans-heres-why-that-matters" rel="nofollow">Vet Candy</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의사도 Relax 못할까? 전문가의 자기 비판적 마음</h2><p><b>미국 수의사 Dr. Andy Roark가 아버지(외과 의사)의 퇴임 후에도 완전히 Relax할 수 없었던 경험을 공유하며, 환자 돌보는 전문가가 끊임없이 자기 비판을 피할 수 없는 이유를 성찰합니다.</b></p>
<p>Dr. Andy Roark의 아버지는 퇴임한 외과 의사로, 퇴임할 때까지 완전히 Relax할 수 없었다고 합니다. &quot;조금이라도 더 나았을까, 환자에게 다르게 말했으면 마음을 진정시킬 수 있었을까, 합병증을 예견했으면 하는 마음&quot;을 끊임없이 가졌다고 이야기합니다. 이것이 의료의 진리이며, 좋은 간병인이 되려면 끝까지 자기 비판을 멈추지 말아야 하는지 고민하게 됩니다.</p><p>진정한 전문가라면 모든 좌절을 마치 상처처럼 되새기게 됩니다. 치료 후 과거는 치유되어 방치해야 하지만 우리는 그 상처를 건드리고 만집니다. 저자는 주말에 완전히 Relax하고 싶지만, 그 긴장은 피할 수 있는 것이 아니라 중요하기 때문에 나타나는 &quot;그림자&quot;라고 생각합니다. 자기 분석이 과해지면 해로우나, 끊임없는 자기 개선으로의 끈끈함은 소중한 Gift이기도 합니다.</p><p>한국 동물병원에서도 같은 상황이 적용됩니다. 수술이 완벽하지 못했거나, 환자에게 충분히 설명하지 못한 것 같다는 생각, 다음에는 더 나은 진료를 해야 한다는 마음은 많은 수의사가 경험하는 것입니다. 이 긴장은 결점이 아니라 더 나은 수의사가 되라는 부릅니다. 과거를 용서하고 미래에 집중하는 것이 중요하며, 이것이 환자를 돌보는 대가로 내는 &quot;세금&quot;이라면 값어치가 있습니다.</p>
<p>원문: <a href="https://drandyroark.com/why-you-cant-relax/" rel="nofollow">Dr. Andy Roark</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>전자건강기록으로 가축 질병 감시한다…영국 연구의 시사점</h2><p><b>영국 Wales의 축산 수의원에서 수집한 3만여 건의 전자건강기록을 분석한 연구에서 텍스트 마이닝과 AI 기반 토픽 모델링이 가축 질병 감시 도구로 효과적임을 확인했습니다. 특히 항생제 사용량 모니터링과 질병 발생 추적에서 기존 감시 체계를 보완할 수 있는 방법으로 주목됩니다.</b></p>
<p>영국 Wales 4개 축산수의원에서 2024년 2월부터 1년간 수집된 총 32,799건의 전자건강기록(EHR) 분석 결과, 소에서 32.6%, 양에서 63.8%의 기록에서 항생제가 처방된 것으로 나타났습니다. 가장 많이 사용된 항생제 클래스는 테트라사이클린, 마크로라이드, 페니실린 및 페니실린-아미노글라이코사이드 복합제였으며, 영국에서 가장 높은 우선순위인 A분류 항생제는 전혀 사용되지 않았고, B분류 항생제도 소 0.12%, 양 0.04%의 극소수에서만 처방되었습니다.</p><p>텍스트 마이닝과 토픽 모델링 기법을 적용한 결과, 유방염, 관절염, 저는병, 폐렴 등 주요 증후군을 효과적으로 식별할 수 있었고 각 질병에 대한 치료 패턴까지 파악할 수 있었습니다. 연구진은 이러한 텍스트 분석 방법이 실시간으로 대규모 데이터를 처리할 수 있어 기존의 수동 감시 체계를 보완할 수 있는 잠재력을 갖추고 있다고 밝혔습니다.</p><p>한국의 가축 질병 감시 체계에 있어 이 연구는 여러 가지 시사점을 제공합니다. 국내 축산수의원에서의 전자처방전 시스템 확대와 데이터 표준화가 뒷받침된다면, 전국의 가축 건강 기록을 활용한 실시간 질병 감시 네트워크 구축이 가능할 것입니다. 또한 항생제 사용량 모니터링 시스템과 연계시 농장 단위의 항생제 내성 관리에 유용한 데이터로 활용될 수 있습니다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-W29","dateLabel":"2026-W29","dateline":"2026-W29 주간 요약 · 이번 주 가장 주목한 기사","editionNo":"2026 · W29","count":12,"cats":[{"key":"clinical","label":"임상"},{"key":"client_communication","label":"보호자 소통"},{"key":"career","label":"커리어"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-W29_1","day":"2026-W29","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"웨일스 동물병원, '통증 제로' 인증 획득","dek":"영국 웨일스의 한 동물병원이 통증 관리 분야의 최고 수준의 인증을 획득했습니다. 이 인증은 동물들의 수술 전후 통증을 최소화하기 위한 체계적인 프로토콜을 갖추고 있음을 의미합니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70994?af=R","body":["영국수의사회(RCVS)가 운영하는 통증 관리 인증제는 병원이 수술 전, 수술 중, 수술 후 전 과정에 걸쳐 체계적인 통증 관리를 제공하고 있음을 인정하는 프로그램입니다. 이번에 인증을 획득한 병원은 통증 평가 도구를 정기적으로 사용하고, 각 동물에 맞는 맞춤형 진통 프로토콜을 적용하며, 보호자에게 퇴원 후 관리 방법을 상세히 안내하는 시스템을 갖추고 있습니다.","인증 심사에는 통증 평가 및 기록 체계, 약물 선택 및 용량 설정 기준, 모니터링 프로토콜, 비상 상황 대응 절차 등이 포함됩니다. 특히 수술 후 통증 관리는 단순히 진통제 투여에만 그치지 않고, 동물의 행동 변화를 세밀히 관찰하여 통증 수준을 지속적으로 평가하는 것이 중요합니다.","한국의 동물병원들도 통증 관리의 중요성을 인식하고 있지만, 체계적인 인증 시스템은 아직 발전 중인 단계입니다. 이번 사례는 한국의 동물병원들이 통증 관리 표준화 노력의 참고 자료가 될 수 있으며, 보호자에게 더욱 수준 높은 의료 서비스를 제공하기 위한 자극제가 될 것으로 보입니다."],"blog":"한국 동물병원 블로그에서는 통증 관리의 중요성과 체계적인 접근 방법에 대해 소개하고, 자신의 병원에서 실천하고 있는 통증 관리법을 공유하는 콘텐츠로 활용할 수 있습니다.","blogAngle":["영국수의사회(RCVS)의 통증 관리 인증은 동물병원 전반의 통증 관리 체계를 인정하는 공식 프로그램입니다.","통증 관리는 수술 전부터 수술 후 퇴원까지 전 과정을 체계적으로 관리해야 합니다.","진통제 투여뿐 아니라 행동 관찰을 통한 지속적인 통증 평가가 중요합니다.","한국 동물병원에서도 통증 관리 표준화의 필요성이 대두되고 있습니다."],"radar":null,"tag":""},{"id":"2026-W29_2","day":"2026-W29","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"플루니키신, 송아지 플루오로퀴놀론 약물동태에 미치는 영향","dek":"송아지 호흡기 질병 치료 시 항생제와 진통제의 병용이 흔하지만, 두 약물 간 약물동태 상호작용에 대한 연구가 부족했습니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70473?af=R","body":["본 연구는 생후 20~30일령의 건강한 홀ANDO 아르헨티노 송아지 10마리를 대상으로 플루오로퀴놀론 계통 항생제(enrofloxacin, marbofloxacin)와 진통제 플루니키신의 병용 시 약물동태 변화를 평가했습니다. 우선 항생제만 투여하고 15일 세척기간 후 플루니키신을 함께 투여하여 비교 분석했습니다.","플루니키신 병용 시 두 항생제의 제거 반감기가 유의하게 연장되었으나, 농도-시간 곡선하면적(AUC)에는 변화가 없었습니다. 특히 enrofloxacin의 대사물인 ciprofloxacin으로의 전환이 감소했습니다. 약효평가 지표(PK/PD 지표)는 Pasteurella multocida와 Histophilus somni에 대해서는 목표를 달성했으나, Mannheimia haemolytica와 Mycoplasma bovis에 대해서는 목표에 미치지 못했습니다.","한국 동물병원에서 송아지 호흡기 질병 치료 시 항생제와 진통제 병용에 대한 재고가 필요합니다. 플루니키신이 항생제의 체내 잔류 시간을 연장시킬 수 있으나, 원인균에 따라 치료 효과가 달라질 수 있음을 유의해야 합니다. 특히 소의 호흡기 질환에서 주요 병원체에 대한 맞춤형 치료 전략 수립이 중요합니다."],"blog":"한국 동물병원 블로그에서는 소 호흡기 질병 치료 시 항생제와 진통제 병용의 장단점과 원인균 별 맞춤형 치료 전략을 다뤄볼 만합니다.","blogAngle":["플루니키신 병용 시 enrofloxacin과 marbofloxacin의 제거 반감기가 유의하게 연장되었다","플루니키신은 enrofloxacin의 ciprofloxacin 대사 전환을 감소시켰다","PK/PD 지표가 모든 원인균에서 목표에 도달한 것은 아니다","항생제-진통제 병용 시 원인균 별 치료 효과에 대한 재평가가 필요하다"],"radar":null,"tag":""},{"id":"2026-W29_3","day":"2026-W29","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"로미피딘이 말 인두 기능 등급에 미치는 영향 연구","dek":"영국수의학저널에 발표된 연구로, 로미피딘 안정제가 말 인두 기능 내시경 검사 결과에 영향을 미치는지 조사했습니다. 경미한 용량(0.04mg/kg)에서는 영향이 없었으나, 용량 증가 시 성문 면적이 유의하게 감소했습니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70804?af=R","body":["의학적 맥락에서 말의 인두 기능 평가는 호흡기 질환 진단에 중요한 과정입니다. 그러나 안정제 사용이 검사 결과에 영향을 미칠 수 있다는 우려가 있어 왔습니다. 특히 로미피딘은 말에서 흔히 사용되는 α2 작용제 계열 안정제이지만, 인두 기능에 미치는 구체적 효과는 제대로 연구되지 않았습니다.","이번 연구는 10두의 말을 대상으로 세 차례 내시경 검사를 실시했습니다. 안정제 미투여군, 로미피딘 0.04mg/kg 정맥주사군, 그리고 총 0.08mg/kg 투여군으로 나누어 인두 기능 등급과 성문 면적을 측정했습니다. 그 결과, 경미한 용량에서는 인두 기능 등급과 성문 면적 모두 유의한 변화가 없었습니다. 그러나 반복 투여 후 총 용량이 증가하자 성문 면적이 유의하게 감소했습니다.","한국 동물병원 관점에서 볼 때, 이 연구는 말 호흡기 검진 시 안정제 선택과 용량 결정에 중요한 근거를 제공합니다. 경미한 용량의 로미피딘은 인두 기능 평가에 영향을 미치지 않으므로, 임상 현장에서 진단 목적의 안정제로 활용 가능할 것으로 보입니다. 다만, 용량 증가 시 성문 면적이 감소할 수 있음을 고려해야 합니다."],"blog":"집중 Treatment & Procedure: 말 호흡기 질환이 의심되는 환마에서 로미피딘 안정 하 내시경 검사의 적절한 용량과 시점을 결정하는 임상 지침으로 활용 가능","blogAngle":["로미피딘 0.04mg/kg 정맥주사는 말의 인두 기능 등급과 성문 면적에 유의한 영향을 주지 않았다","총 0.08mg/kg 용량에서는 성문 면적이 유의하게 감소했다(Group R1 대비 p\u003c0.001, Group R2 대비 p=0.045)","인두 기능 등급 자체는 모든 군에서 유의한 차이가 없었다","연구진은 표본 수 부족(10두)으로 인해 해석에 주의가 필요하다고 밝혔다"],"radar":null,"tag":""},{"id":"2026-W29_4","day":"2026-W29","ts":1784289087000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"수의사의 애완동물 말하기, 보호자 재방문 의향 높여","dek":"영국 수의사 400명 이상을 대상으로 한 설문조사 결과, 약 80%의 수의사가 진료 중 강아지·고양이 대상으로 특정 말하기 방식을 사용하며, 약 90%가 이를 사용한 수의사를 다시 찾고 싶다는 응답을 보였다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"2분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70500?af=R","body":["여러 연구에서 수의사들이 진료 중 '반려동물 대상 말하기(pet-directed speech)'를 사용하는 것이 관찰되어 왔다. 이번 연구는 이 말하기 방식이 동물병원 방문 시 얼마나 흔히 사용되는지, 그리고 이것이 보호자들의 수의사 인식에 어떤 영향을 미치는지 파악하기 위해 온라인 설문조사를 실시했다.","설문 결과를 분석한 결과, 응답자 400명 중 약 80%가 수의사가 진료 중 애완동물에게 특정 방식으로 말을 걸었다고 보고했다. 대부분의 보호자들은 이것이 '매우 중요하다'거나 '아주 중요하다'고 평가했으며, 약 90%는 이러한 말하기 방식을 사용하는 수의사를 다시 방문하고 싶어 할 것다고 응답했다. 자유 기술 응답 분석에서는 '반려동물을 중심에', '말만이 아니다', '보호자를 포함하라', '수의사 인상'이라는 네 가지 주요 주제가 도출되었다.","한국 동물병원 관점에서 보면, 이 연구결과는 진료 실전에서 간단한 소통 기법이 고객 충성도에 큰 영향을 줄 수 있음을 보여준다. 강아지·고양이뿐 아니라 보호자를 바라보며 대화하고, 진찰대에 올라온 동물에게 부드럽게 말을 걸며, 보호자를 진료 과정에 포함시키는 작은 노력이 재방문율과 추천 의향에 긍정적 영향을 미칠 수 있다. 이는 별도의 장비나 약물 없이도 가능한 서비스 품질 향상 방안이 될 수 있다."],"blog":"한국 동물병원 블로그에서 '진료 중 동물에게 말 걸기' 실례와 함께 보호자들과 신뢰를 쌓는 간단한 소통 팁을 공유하는 글을 쓰는 것은 좋은 콘텐츠가 될 수 있다.","blogAngle":["영국 수의사 대상 설문조사에서 약 80%가 진료 중 '반려동물 대상 말하기'를 사용한다고 응답했다","보호자 약 90%는 이 방식의 수의사를 다시 방문하고 싶어 하며, 대부분을 매우 중요하게 인식했다","분석된 네 가지 주제는 '반려동물을 중심에', '말만이 아니다', '보호자를 포함하라', '수의사 인상'이다","한국 동물병원에서도 보호자와 동물 모두에게 부드럽게 말을 거는 간단한 소통 기법이 진료 만족도와 재방문율 향상에 도움될 수 있다"],"radar":null,"tag":""},{"id":"2026-W29_5","day":"2026-W29","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"벨기에 고양이 사료 급이량, 권장 에너지 초과 가능","dek":"벨기에 판매 고양이 사료의 급이 지침을 분석한 결과, 일부 제품이 유럽업계 단체(FEDIAF)의 권장 에너지 섭취량을 초과할 수 있는 것으로 나타났습니다. 과체중·비만 고양이가 많은 상황에서 사료 라벨의 정확성이 관심입니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70802?af=R","body":["연구팀은 벨기에 상점에서 판매되는 성체 영양완전 고양이 사료 100개 이상을 대상으로 급이 지침을 분석했습니다. 각 제품의 라벨 급이 권장과 FEDIAF가 제시한 성체 고양이 평균 에너지 요구량을 비교했으며, 그램 단위 급이 지침이 포장을 포함한 측정 단위보다 FEDIAF 지침과 더 밀접하게 일치했습니다.","분석 결과, 대부분의 개별 사료 라벨은 FEDIAF 평균 권장 범위 내의 일일 에너지 섭취량을 제시했습니다. 그러나 제품 그룹별 중앙값을 FEDIAF 권장 에너지 계수와 비교했을 때 일부 차이점이 관찰되었으며, 특히 포장을 기준으로 한 급이량 추정에서 차이가 발생했습니다.","한국 동물병원 관점에서 보면, 사료 라벨의 급이 지침이 개별 반려동물의 에너지 필요량을 완벽히 반영하지 못할 수 있음을 의미합니다. 수의사는 고양이 보호자에게 라벨 권장을 출발점으로 삼되, 각 고양이의 적정 체중 유지를 위해 급이량을 조절하는 방법을 안내하는 것이 좋습니다. 특히 비만 위험이 있는 고양이에서는 라벨 급이량보다 적은 양을 권고하는 것이 유리할 수 있습니다."],"blog":"한국 동물병원 블로그에 '고양이 사료 급이량, 라벨만 믿어도 될까?'라는 제목으로 비만 고양이 고객을 위한 맞춤형 급이 안내 팁을 정리한 기사를 작성할 수 있습니다.","blogAngle":["벨기에 판매 성체 고양이 사료 100개 이상의 급이 지침을 FEDIAF 권장과 비교 분석했습니다.","그램 단위 급이량이 포장 기준 급이량보다 FEDIAF 권장과 더 정확히 일치했습니다.","대부분의 개별 라벨은 FEDIAF 평균 권장 범위 내였으나, 중앙값 비교에서 일부 차이가 확인되었습니다.","사료 라벨 급이량은 출발점으로 활용하되, 개별 고양이의 체중 관리에 따라 조절이 필요합니다."],"radar":null,"tag":""},{"id":"2026-W29_6","day":"2026-W29","ts":1784222289000,"cat":"clinical","kicker":"임상","isToday":false,"title":"","dek":"","source":"Vet Candy","country":"미국","date":"07.17","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a5912517e387f268a4ebea4/1784222466615/Zoetis+launches+Lenivia.jpg?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/16/zoetis-launches-lenivia-a-three-month-osteoarthritis-injection-for-dogs-in-canada-and-europe","body":[""],"blog":"","blogAngle":[""],"radar":null,"tag":""},{"id":"2026-W29_7","day":"2026-W29","ts":1784137535000,"cat":"clinical","kicker":"임상","isToday":false,"title":"","dek":"","source":"Vet Candy","country":"미국","date":"07.16","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a57c73ffc35b9012df8e066/1784143071414/fecal+biome+diagnosis+diseases+2026.jpg?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/15/scientists-just-found-the-same-intestinal-disease-fingerprint-in-cows-dogs-and-humans-heres-why-that-matters","body":[],"blog":"","blogAngle":[],"radar":null,"tag":""},{"id":"2026-W29_8","day":"2026-W29","ts":1784174400000,"cat":"career","kicker":"커리어","isToday":false,"title":"수의사도 Relax 못할까? 전문가의 자기 비판적 마음","dek":"미국 수의사 Dr. Andy Roark가 아버지(외과 의사)의 퇴임 후에도 완전히 Relax할 수 없었던 경험을 공유하며, 환자 돌보는 전문가가 끊임없이 자기 비판을 피할 수 없는 이유를 성찰합니다.","source":"Dr. Andy Roark","country":"미국","date":"07.16","read":"2분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cant-relax.jpg","sourceUrl":"https://drandyroark.com/why-you-cant-relax/","body":["Dr. Andy Roark의 아버지는 퇴임한 외과 의사로, 퇴임할 때까지 완전히 Relax할 수 없었다고 합니다. \"조금이라도 더 나았을까, 환자에게 다르게 말했으면 마음을 진정시킬 수 있었을까, 합병증을 예견했으면 하는 마음\"을 끊임없이 가졌다고 이야기합니다. 이것이 의료의 진리이며, 좋은 간병인이 되려면 끝까지 자기 비판을 멈추지 말아야 하는지 고민하게 됩니다.","진정한 전문가라면 모든 좌절을 마치 상처처럼 되새기게 됩니다. 치료 후 과거는 치유되어 방치해야 하지만 우리는 그 상처를 건드리고 만집니다. 저자는 주말에 완전히 Relax하고 싶지만, 그 긴장은 피할 수 있는 것이 아니라 중요하기 때문에 나타나는 \"그림자\"라고 생각합니다. 자기 분석이 과해지면 해로우나, 끊임없는 자기 개선으로의 끈끈함은 소중한 Gift이기도 합니다.","한국 동물병원에서도 같은 상황이 적용됩니다. 수술이 완벽하지 못했거나, 환자에게 충분히 설명하지 못한 것 같다는 생각, 다음에는 더 나은 진료를 해야 한다는 마음은 많은 수의사가 경험하는 것입니다. 이 긴장은 결점이 아니라 더 나은 수의사가 되라는 부릅니다. 과거를 용서하고 미래에 집중하는 것이 중요하며, 이것이 환자를 돌보는 대가로 내는 \"세금\"이라면 값어치가 있습니다."],"blog":"한국 동물병원 블로그에 \"수의사도 자신에게 너무 큰 압박을 주나요? 전공 진료에서 오는 자기 비판 극복법\"이라는 제목으로, 진료 중 들었던 아쉬움과 그것을 성장의 동력으로 바꾸는 방법을 공유하는 글이 어울릴 것입니다.","blogAngle":["부모 세대 의료 전문가들도 퇴임 후에도 자기 비판을 완전히 놓지 못했다","진정한 전문가들은 좌절을 상처처럼 되새기는 경향이 있으며, 이 긴장은 중요함을 반영한다","자기 비판적 성향은 결점이 아니라 더 나은 간병인으로 성장하는 소중한 Gift이다","과거를 용서하고 미래에 집중하는 것이 전문직으로서 건강한 자세이다"],"radar":null,"tag":""},{"id":"2026-W29_9","day":"2026-W29","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"전자건강기록으로 가축 질병 감시한다…영국 연구의 시사점","dek":"영국 Wales의 축산 수의원에서 수집한 3만여 건의 전자건강기록을 분석한 연구에서 텍스트 마이닝과 AI 기반 토픽 모델링이 가축 질병 감시 도구로 효과적임을 확인했습니다. 특히 항생제 사용량 모니터링과 질병 발생 추적에서 기존 감시 체계를 보완할 수 있는 방법으로 주목됩니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"2분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70501?af=R","body":["영국 Wales 4개 축산수의원에서 2024년 2월부터 1년간 수집된 총 32,799건의 전자건강기록(EHR) 분석 결과, 소에서 32.6%, 양에서 63.8%의 기록에서 항생제가 처방된 것으로 나타났습니다. 가장 많이 사용된 항생제 클래스는 테트라사이클린, 마크로라이드, 페니실린 및 페니실린-아미노글라이코사이드 복합제였으며, 영국에서 가장 높은 우선순위인 A분류 항생제는 전혀 사용되지 않았고, B분류 항생제도 소 0.12%, 양 0.04%의 극소수에서만 처방되었습니다.","텍스트 마이닝과 토픽 모델링 기법을 적용한 결과, 유방염, 관절염, 저는병, 폐렴 등 주요 증후군을 효과적으로 식별할 수 있었고 각 질병에 대한 치료 패턴까지 파악할 수 있었습니다. 연구진은 이러한 텍스트 분석 방법이 실시간으로 대규모 데이터를 처리할 수 있어 기존의 수동 감시 체계를 보완할 수 있는 잠재력을 갖추고 있다고 밝혔습니다.","한국의 가축 질병 감시 체계에 있어 이 연구는 여러 가지 시사점을 제공합니다. 국내 축산수의원에서의 전자처방전 시스템 확대와 데이터 표준화가 뒷받침된다면, 전국의 가축 건강 기록을 활용한 실시간 질병 감시 네트워크 구축이 가능할 것입니다. 또한 항생제 사용량 모니터링 시스템과 연계시 농장 단위의 항생제 내성 관리에 유용한 데이터로 활용될 수 있습니다."],"blog":"국내 축산수의원의 전자처방 데이터 활용을 통해 질병 발생 추이와 항생제 사용량을 모니터링하는 시스템을 구축할 경우, 구제역·조류인플루엔자 등 가축 질병의 조기 경보와 항생제 내성 관리에 크게 기여할 수 있을 것입니다.","blogAngle":["영국 Wales 4개 축산수의원에서 1년간 32,799건의 전자건강기록 수집·분석","소 32.6%, 양 63.8%에서 항생제 처방, 최우선 항생제(A분류) 사용은 전무","텍스트 마이닝으로 유방염, 관절염, 저는병, 폐렴 등 주요 질병 증후군 자동 식별 가능","전자건강기록 기반 감시는 기존 수동 감시 체계의 보완 수단으로 유용"],"radar":null,"tag":""},{"id":"2026-W29_10","day":"2026-W29","ts":1784142027000,"cat":"clinical","kicker":"임상","isToday":false,"title":"","dek":"","source":"Vet Candy","country":"미국","date":"07.16","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a57d8cb03bbcb574d8c6444/1784143191607/Toxoplasmosis+in+NYC+cats+2026+study.jpg?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/15/more-than-half-of-sampled-free-roaming-cats-in-nyc-are-infected-with-zoonotic-parasites","body":[],"blog":"","blogAngle":[],"radar":null,"tag":""},{"id":"2026-W29_11","day":"2026-W29","ts":1784119525000,"cat":"clinical","kicker":"임상","isToday":false,"title":"","dek":"","source":"Vet Candy","country":"미국","date":"07.15","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a5780e5c55c143a053e5a0a/1784119822113/Arkansas+tick+season+2026.JPG?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/15/arkansas-tick-season-is-worse-than-usual-public-health-veterinarian-warns","body":[],"blog":"","blogAngle":[],"radar":null,"tag":""},{"id":"2026-W29_12","day":"2026-W29","ts":1784118415000,"cat":"industry","kicker":"업계","isToday":false,"title":"","dek":"","source":"Vet Candy","country":"미국","date":"07.15","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a577c8f864c0736ba20186e/1784119846313/Zoetis+buys+xray+digital.jpg?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/15/zoetis-acquired-vitalrads-heres-what-that-means-for-your-practice","body":[""],"blog":"","blogAngle":[""],"radar":null,"tag":""}],"stories":[],"weekly":true}</script>

    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?'구독 신청 완료! 매일 아침 받아보세요':(res.error||'실패')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
