<noscript><div style="max-width:720px;margin:0 auto;padding:40px 20px;font-family:sans-serif;">
<h1>베트맨랩 VetManLab 해외 브리핑 — 2026-07-25</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<ul style="list-style:none;padding:0;"><li style="margin-bottom:16px;"><a href="/article/2026-07-25_1-개의-아토피-피부염-JAK-억제제-치료-최신-관점"><b>개의 아토피 피부염 JAK 억제제 치료 최신 관점</b></a>
<div>피부 알레르기가 13년 연속 개 보험 청구 가장 많은 원인을 차지하며, 수의 피부과 전문의가 최신 JAK 억제제의 작용 기전과 임상적 활용법을 설명합니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_2-개-만성-재발성-회음부-탈장-외과적-치료-사례"><b>개 만성 재발성 회음부 탈장 외과적 치료 사례</b></a>
<div>중증의 만성 재발성 회음부 헤르니아 환개에서 근막이식술과 복강경 결장고정술을 연속으로 시행하여 성공적으로 치료한 사례가 국내 연구진에 의해 보고되었습니다.</div>
<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_3-고양이-동맥혈전-용해제-치료-성과-비교-연구"><b>고양이 동맥혈전 용해제 치료 성과 비교 연구</b></a>
<div>총 183마리의 고양이 동맥혈전증을 대상으로 한 다기관후향연구에서 조직형 플라즈미노겐 활성화제(TPA) 치료군이 비치료군보다 재관류율과 기능 회복률이 유의하게 높은 것으로 나타났습니다. 다만 갑작스러운 사망률도 함께 증가했다는 점이 주목됩니다.</div>
<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_4-치료식-선택-도우미-도구-2600명-이상-수의사-사용-중"><b>치료식 선택 도우미 도구, 2600명 이상 수의사 사용 중</b></a>
<div>마크 모리스 연구소가 출시한 MMI 영양 가이드가 수의사들이 건강 상태별 치료식을 선택하는 데 활용되고 있습니다. 주요 보호사료 제조사의 치료식을 한눈에 비교할 수 있는 디지털 도구로, 현재 2600명 이상의 수의사가 사용하고 있습니다.</div>
<small>임상 · Today's Veterinary Business · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_5-개-열치료-이-6가지-상황에-효과적"><b>개 열치료, 이 6가지 상황에 효과적</b></a>
<div>운동 후 근육 경직부터 관절염, 수술 후 회복까지 열치료가 도움이 되는 개의 6가지 상황을 소개합니다. 통증 관리와 회복 촉진에 활용도를 정리해드립니다.</div>
<small>임상 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_6-유기축산-우유-소-아-임상적-유방염에-대한-음파펄스와-냉각레이저-요법-비"><b>유기축산 우유 소 아 임상적 유방염에 대한 음파펄스와 냉각레이저 요법 비교 평가</b></a>
<div>미국 연구진이 유기축산 조건의 우유 소에서 발생한 아 임상적 유방염 치료에 음파펄스 요법과 냉각레이저 요법의 효과를 비교 평가했습니다. 항생물질 사용이 제한적인 유기축산 환경에서 비항생제 치료 전략의 가능성을 확인한 연구입니다.</div>
<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_7-강아지가-리콜-사료-먹었을-때-수의사가-알려주는-대처법"><b>강아지가 리콜 사료 먹었을 때 수의사가 알려주는 대처법</b></a>

<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-25_12-미국-Galveston-벼룩-매개-티푸스-재출현-연구의-중심지로"><b>미국 Galveston, 벼룩 매개 티푸스 재출현 연구의 중심지로</b></a>

<script id="vm-issue" type="application/json">{"date":"2026-07-25","dateLabel":"2026.07.25","dateline":"2026년 7월 25일 · 토요일","editionNo":"2,031","count":27,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"client_communication","label":"보호자 소통"},{"key":"career","label":"커리어"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-07-25_1","legacySlug":null,"day":"2026-07-25","ts":1784892608000,"publishedAt":"2026-07-24T11:30:08.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"개의 아토피 피부염 JAK 억제제 치료 최신 관점","dek":"피부 알레르기가 13년 연속 개 보험 청구 가장 많은 원인을 차지하며, 수의 피부과 전문의가 최신 JAK 억제제의 작용 기전과 임상적 활용법을 설명합니다.","source":"Veterinary Practice News","country":"미국","date":"07.24","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/july-2026-jak-inhibitors.jpg","sourceUrl":"https://www.veterinarypracticenews.com/vet-dermatologist-perspective-on-jak-inhibitors-2/","body":["개 아토피 피부염은 피부 장벽, 피부 미생물군, 피부 세포 집단 간의 복잡한 상호작용으로 인해 발생하며, 특히 알레르겐에 대한 Th2 면역 반응이 과증폭되어 IL-2, IL-4, IL-5, IL-6, IL-13, IL-31 등의 interleukin이 상승하고 가려증과 염증이 유발됩니다. 아토피 피부염은 확진적 진단 검사나 병적 징후가 없으며, 2차 감염, 비알레르기 질환, 벼룩 알레르기 피부염, 식품 부작용을 배제한 후 진단할 수 있습니다.","JAK 억제제는 최근 가장 중요한 진전으로, JAK 단백질이 세포 표면 수용체와 연관되어 특정 cytokine과 성장 인자의 발현을 조절하는 것을 차단합니다. 미국에서 사용 가능한 수의용 JAK 억제제는 oclacitinib, ilunocitinib, 2026년 2월 승인된 atinvicitinib이며, 각각 다른 선택성을 보입니다. Oclacitinib는 JAK1에 가장 강하게 작용하고, ilunocitinib는 JAK1, JAK2, TYK2에 높은 potency를 보이며, atinvicitinib는 JAK1에 대해 JAK2, JAK3, TYK2보다 10배 더 강하게 작용하여 가장 선택적인 것으로 보고됩니다.","한국 동물병원에서 JAK 억제제를 활용할 때, 모든 JAK 억제제는 수 시간 내에 개선이 가능할 정도로 빠른 작용 발현을 보인다는 점이 특징입니다. Ilunocitinib가 14일 이후 once daily 투약 시 oclacitinib보다 유의하게 우수한 것으로 나타났으며, 이는 선택성 차이로 설명됩니다. Oclacitinib는 표외 사용으로 고양이 아토피 피부 증후군, pemphigus foliaceus, 다발성 종양 등 다양한 질환에서도 효과가 보고되었으나, 수의사-고객-환자 관계 수립 하에 표외 처방의 적응증과 부작용을 충분히 설명하고 문서화해야 합니다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원 사례를 통한 JAK 억제제 선택 가이드: oclacitinib vs ilunocitinib 효과 비교’ 제목으로 임상의들이 실제 임상에서 참고할 수 있는 실용적 정보를 제공하면 좋습니다.","blogAngle":["개 아토피 피부염은 Th2 면역 반응에 의한 interleukin 상승이 핵심 기전이며, 6개월에서 4세 사이에 발병하고 계절성 가려증이 특징적인 임상 양상을 보입니다.","미국 승인 수의용 JAK 억제제 3종은 각각 다른 JAK 선택성을 가지며, atinvicitinib이 가장 선택적인 JAK1 억제제로 보고됩니다.","Ilunocitinib는 14일 이후 once daily 유지 용량에서 oclacitinib보다 가려증 및 피부 병변 점수가 유의하게 우수하게 나타났습니다.","JAK 억제제 표외 사용 시에는 적응증, 기대 효과, 부작용, 비용을 충분히 설명하고 고객의 동의를 문서화해야 합니다."],"radar":{"owner":{"soon":true,"q":"강아지 아토피 피부염에 JAK 억제제 주사가 전통 약보다 더 잘 통하나요?","script":"JAK 억제제는 작용이 빠르고 효과적인 편입니다. 약마다 특징이 있어서 동물 상태에 따라 선택하고, 처방 후 이상 반응이 있는지 관찰하면 됩니다."},"clinical":"개 아토피 피부염 환자에서 JAK 억제제 선택 시 와 의 차이점을 숙지하고, 적응증 외 사용 시에는 적응증과 부작용을 충분히 설명하고 문서화할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_2","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 만성 재발성 회음부 탈장 외과적 치료 사례","dek":"중증의 만성 재발성 회음부 헤르니아 환개에서 근막이식술과 복강경 결장고정술을 연속으로 시행하여 성공적으로 치료한 사례가 국내 연구진에 의해 보고되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1858804/full","body":["회음부 헤르니아는 골반횡격막 근육의 약화로 인해 직장이 확장되거나 탈출하거나 골반 내 장기가 탈출하는 질환입니다. 만성 변비, 전립선 질환, 근육 위축 등이 위험 요인으로 작용하며, 중견 이상의 비거세 수컷 개에서 흔히 발생합니다.","본 사례는 6kg의 중성화 수컷 혼합견(추정 10세 이상)으로, 양측 Herniorrhaphy 후 재발한 우측 회음부 헤르니아와 변비, 직장을 동반하여 내원했습니다. 수술 중 심한 골반 근육 위축이 확인되어 대퇴근막이식술(Fascia lata transposition)을 시행하였으나, 수술 후 직장이 탈출하는 직장 탈출이 발생했습니다. 이에 복강경하 결장고정술(Laparoscopic colopexy)을 추가 시행하여 성공적으로 고정했습니다.","한국 동물병원 관점에서 이 사례는 복잡한 회음부 헤르니아에서 근피부나 근육이 부족할 경우 자가 이식이 유효한 치료 option임을 시사합니다. 특히 소형견에서 직장 탈출이 발생한 경우 복강경적 결장고정술이 최소 침습적으로 효과적인 해결책이 될 수 있습니다. 27개월 추적 관찰 결과 합병증 없이 양호한 상태를 유지하여 장기적 예후도 긍정적입니다."],"blog":"한국 동물병원 블로그에서는 만성 변비를 동반한 회음부 헤르니아 환개의 수술적 치료 과정과 재발 방지 관리 포인트를 임상 사례 소갱으로 활용할 수 있습니다.","blogAngle":["10세 이상 된 중형견에서 양측 Herniorrhaphy 후 재발한 복잡한 회음부 헤르니아를 대퇴근막이식술으로 치료했습니다.","술 후 발생한 직장 탈출은 복강경적 결장고정술로 성공적으로 해결되었습니다.","27개월 추적 관찰 결과 배변, 배뇨, 보행 상에 아무런 이상 없이 양호하게 회복되었습니다.","복잡한 회음부 헤르니아에서 근육 재건이 어려운 경우 자가 이식 특히 대퇴근막이 효과적인 대안이 될 수 있습니다."],"radar":{"owner":{"soon":false,"q":"우리 강아지도 회음부 헤르니아 수술했는데, 재발할 수 있어요?","script":"회음부 헤르니아는 수술 후에도 재발할 수 있는 질환입니다. 특히 근육 약화가 심하거나 중형견 이상의 비거세 수컷에서 발생률이 높아요. 수술 방법으로는 근막이식술이나 복강경 결장고정술 등 여러 가지가 있는데, 각 상황에 맞게 선택하게 됩니다."},"clinical":"복잡한 회음부 헤르니아 수술 시 근막이식술과 복강경 결장고정술 옵션을 수술 계획에 포함시키고, 특히 근피부나 근육이 부족한 경우 자가 이식의 가능성을 고려할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_3","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 동맥혈전 용해제 치료 성과 비교 연구","dek":"총 183마리의 고양이 동맥혈전증을 대상으로 한 다기관후향연구에서 조직형 플라즈미노겐 활성화제(TPA) 치료군이 비치료군보다 재관류율과 기능 회복률이 유의하게 높은 것으로 나타났습니다. 다만 갑작스러운 사망률도 함께 증가했다는 점이 주목됩니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1845133/full","body":["고양이 동맥혈전증(FATE)은 사망률이 높은 중증 질환으로, Colorado State University와 프랑스 Lyon수의과대학에서 2007~2020년 사이 입원한 고양이 183마리의 의무기록을 후향적으로 분석했습니다. 입원 6시간 이내 안락사된 68마리와 기록이 불완전한 8마리를 제외한 115마리가 최종 분석에 포함되었으며, 이 중 50마리가 TPA 치료를, 65마리가 비치료로 분류되었습니다.","TPA 치료군의 병원 내 재관류율은 54%로 비치료군(20%)보다 유의하게 높았으며(p\u003c0.001), 기능 회복률 역시 36%로 비치료군(14%)을 앞서았습니다(p=0.008). 그러나 갑작스러운 사망은 TPA 치료군에서 46%에 달해 비치료군(19%)보다 두 배 이상 높았습니다(p=0.002). 급성 신장 손상과 고칼륨혈증 발생률은 두 그룹 간에 유의한 차이가 없었고(p>0.05), 퇴원 시 생존율도 두 그룹이 거의 같았습니다(34% vs 35%, p>0.999).","이 연구는 TPA 치료가 고양이 동맥혈전증의 재관류와 기능 회복을 개선할 수 있음을 보여주지만, 치료와 관련된 갑작스러운 사망 위험도 함께 고려해야 함을 시사합니다. 한국 동물병원에서는 해당 질환의 중증도와 안락사 결정 시점을 보호자들과 충분히 논의하고, TPA 치료의 위험과 이익을 균형 있게 평가하는 것이 중요합니다."],"blog":"임상 동료들의 의견과 안락사 결정에 대한 보호자 소통 사례와 함께 블로그에 공유하면 좋은 콘텐츠가 될 것입니다","blogAngle":["TPA 치료군 재관류율(54%)이 비치료군(20%)보다 유의하게 높았습니다","기능 회복률도 TPA 치료군(36%)이 비치료군(14%)보다 우수했습니다","갑작스러운 사망률은 TPA 치료군(46%)이 비치료군(19%)보다 오히려 높았습니다","퇴원 시 생존율은 두 그룹 모두 약 34~35%로 차이가 없었습니다"],"radar":{"owner":{"soon":true,"q":"선생님, 고양이 동맥혈전증이 생기면 TPA 치료를 받아야 할까요?","script":"이 연구에 따르면 TPA 치료가 재관류율을 높이고 기능 회복에 도움을 줄 수 있지만, 갑작스러운 사망 위험도 같이 높아질 수 있습니다. 고양이의 전체적인 상태와 보호자분의 의견을 종합해서 치료 방향을 함께 정해야 합니다."},"clinical":"고양이 동맥혈전증 환아에서 TPA 치료 도입 시 보호자와의 사전 충분한 논의 및 갑작스러운 사망 위험에 대한 명확한 안내가 필요함을 진료 프로토콜에 반영한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_4","legacySlug":null,"day":"2026-07-25","ts":1784846411000,"publishedAt":"2026-07-23T22:40:11.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"치료식 선택 도우미 도구, 2600명 이상 수의사 사용 중","dek":"마크 모리스 연구소가 출시한 MMI 영양 가이드가 수의사들이 건강 상태별 치료식을 선택하는 데 활용되고 있습니다. 주요 보호사료 제조사의 치료식을 한눈에 비교할 수 있는 디지털 도구로, 현재 2600명 이상의 수의사가 사용하고 있습니다.","source":"Today's Veterinary Business","country":"미국","date":"07.24","read":"2분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/shutterstock_2492694907.jpg","sourceUrl":"https://todaysveterinarybusiness.com/nutrition-resource-helps-veterinarians-choose-therapeutic-diets/","body":["미국 마크 모리스 연구소(Mark Morris Institute)에서 최근 출시한 MMI 영양 가이드는 개와 고양이의 건강 상태에 맞는 치료식을 선택할 수 있도록 도와주는 디지털 도구입니다. Royal Canin, Nestlé Purina, Hill's, EmerAid 등 주요 보호사료 제조사의 치료식 제품 가이드와 함께 대표적인 질환별 영양 관리 권고 사항을 요약하여 제공하고 있으며, 서로 다른 식품의 영양 성분 프로필을 비교할 수 있는 기능도 포함되어 있습니다.","마크 모리스 연구소의 최고 학업 책임자이자 집행 이사인 Caitlyn Heinze 수의사(국제 수의 영양학 전문의)는 현재 2600명 이상의 수의 전문인이 이 가이드를 사용하고 있다고 밝혔습니다. 그녀는 “올해 여름에는 예상치 못한 업그레이드를 계획하고 있으며, 이 도구가 미국 중소 동물병원이라면 어디든 갖추어져야 한다고 확신합니다”라고 밝혔으며, 가이드의 정보와 영양 성분은 보호사료 제조사로부터 직접 제공받거나 가장 최근 공개된 제품 가이드에서 확보한 것으로 알려졌습니다.","한국 동물병원 관점에서 보면, 이 가이드는 치료식 처방 시 근거 있는 결정을 내리는 데 참고가 될 만한 도구입니다. 치료식의 영양 성분을 체계적으로 비교할 수 있어 수의사 스스로 처방 근거를 검토하거나 소유주에게 설명할 때 유용할 수 있습니다. 다만 한국에서 사용 가능한 치료식의 브랜드와 종류가 미국과 다를 수 있으므로, 실제 적용 시에는 국내 유통 제품을 확인하는 것이 필요합니다."],"blog":"치료식을 처방할 때 고객에게 영양 성분의 근거를 어떻게 설명하고 있는지, 치료식 선택 가이드의 활용법을 블로그 글로 작성해 보면 어떨까요?","blogAngle":["MMI 영양 가이드는 Royal Canin, Nestlé Purina, Hill's, EmerAid의 치료식을 비교할 수 있는 디지털 도구입니다.","현재 2600명 이상의 미국 수의사들이 치료식 선택 시 이 가이드를 활용하고 있습니다.","가이드는 국제 수의 영양학 전문의가 이끄는 마크Morris 연구소에서 무료로 제공하고 있습니다.","치료식 선택 시 근거를 확인하고 소유주에게 설명하는 데 활용할 수 있습니다."],"radar":{"owner":null,"clinical":"자가 진료소 등에서 치료 처방 시 MMI 영양 가이드와 유사한 디지털 도구나 제품 가이드를 참고하여 근거 기반 처방을 하고 있는지 점검하고, 처방 근거를 소유주에게 명확히 설명할 수 있도록 점검한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_5","legacySlug":null,"day":"2026-07-25","ts":1784811616000,"publishedAt":"2026-07-23T13:00:16.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"개 열치료, 이 6가지 상황에 효과적","dek":"운동 후 근육 경직부터 관절염, 수술 후 회복까지 열치료가 도움이 되는 개의 6가지 상황을 소개합니다. 통증 관리와 회복 촉진에 활용도를 정리해드립니다.","source":"IVC Journal","country":"미국","date":"07.23","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_vjyhcyvjyhcyvjyh-600x403.png","sourceUrl":"https://ivcjournal.com/6-canine-conditions-that-can-benefit-from-heat-therapy/","body":["열치료(thermotherapy)는 체표면에 따뜻한 열을 가해 치유와 쾌적함을 증진시키는 방법입니다. 급성 부상 초기에는 염증이 악화될 수 있어 사용을 피하고, 초기 부종과 염증이 감소한 이후에 적용하는 것이 가장 좋습니다. 열을 가하면 국소 혈류가 증가하고 근육이 relaxes하며 관절 유연성이 향상되어 약물, 수술 회복, 재활 운동 등 다른 치료 계획의 좋은 보완제가 됩니다.","열치료가 특히 효과적인 첫 번째 상황은 운동 후 뻣뻣함으로, 운동선수나 작업견에서 근육이 풀어지고 움직임이 부드러워집니다. 관절염은 노령 개에서 가장 흔한 만성 관절 통증과 경직으로, 열치료가 관절 가동성을 개선하고 일상생활의 불편을 줄여줍니다. 고관절 이형성증은 비정상적인 고관절 발달로 인한 통증과 이동성 저하를 일으키며, 주변 근육을 풀어주는 열치료가 장기 관리 계획에 유용합니다. 추간판 질환(IVDD)은 척추 통증, 신경 문제, 가끔 마비를 일으키는 심각한 질환으로, 급성기가 지나면 척추 주변 근육 긴장을 완화하고 회복을 돕습니다. 근육 경련은 통증과 스트레스를 유발하며, 열의 이완 효과로 근육 경련의 빈도와 강도를 효과적으로 감소시킵니다. 수술 후 회복에는 근육 긴장과 움직임 감소가 동반되는데, 열치료를 재활 프로그램에 병행하면 혈류 개선과 근육 유연성 유지를 통해 회복을 가속화할 수 있습니다.","한국 동물병원에서 열치료 적용 시 고려할 점은 안전이 최우선입니다. 열원 온도는 개가 견딜 수 있는 수준으로 조절하고, 피부 화상을 예방하기 위해 반드시 확인해야 합니다. 열치료는 비침습적이고 비용이 저렴하며 효과적인 도구로, 적절한 수의적 치료, 약물 관리, 구조화된 재활 계획과 병행하면 개의 이동성을 개선하고 삶의 질을 높일 수 있습니다. 각 환자는 모두 다르므로 전문가의 신중한 평가가 치료 결과를 좌우합니다."],"blog":" blog에 '노령견 관절건강 관리: 열치료 활용법' 또는 '수술 후 회복 과정에서 열치료 이렇게 적용하세요' 같은ractical한 가이드 포스팅으로 활용할 수 있습니다","blogAngle":["열치료는 급성 부상 초기(염증 악화 위험)가 아닌 초기 염증이 감소한 이후에 적용해야 합니다","개의 열치료 적합 상황: 운동 후 경직, 관절염, 고관절 이형성증, 추간판 질환(IVDD), 근육 경련, 수술 후 회복","열치료 효과: 국소 혈류 증가, 근육 이완, 관절 유연성 향상으로 약물·수술·재활의 보완 치료 역할","안전 가이드: 열원 온도 조절, 피부 화상 예방, 개체별 적절한 적용 시간 확인 필요"],"radar":{"owner":{"soon":true,"q":"우리 강아지가 너무 늙어서 걷기가 힘들어졌는데, 열치료 같은 거도 도움이 될까요?","script":"열치료는 관절염이나 근육 경직이 있는 노령 개에서 관절 가동성을 조금이라도 개선하고 불편을 줄이는 데 참고가 될 수 있는 방법입니다. 다만 각 개마다 상황 다르니까, 먼저 동물병원에서 전문가가 상태를 평가해보고 가장 맞는 계획을 세우는 것이 좋습니다."},"clinical":"열치료 적용 전 반드시 환축 개체의 피부 상태, 심혈관계 문제, 급성 염증 여부를 개별 평가하고 온도·시간을 조절한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_6","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"유기축산 우유 소 아 임상적 유방염에 대한 음파펄스와 냉각레이저 요법 비교 평가","dek":"미국 연구진이 유기축산 조건의 우유 소에서 발생한 아 임상적 유방염 치료에 음파펄스 요법과 냉각레이저 요법의 효과를 비교 평가했습니다. 항생물질 사용이 제한적인 유기축산 환경에서 비항생제 치료 전략의 가능성을 확인한 연구입니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1856042/full","body":["유기축산에서는 항생물질 사용에 제약이 있어 유방염 치료 선택지가 제한적인 문제가 있습니다. 미국 텍사스 A&M 대학 연구팀은 이러한 조건에서 항생제를 대체할 수 있는 물리치료 요법의 효과를 과학적으로 검증하고자 본 연구를 수행했습니다. 연구에는 아 임상적 유방염에 걸린 유기축산 우유 소 81두가 참여했으며, 음파펄스 요법군, 냉각레이저 요법군, 대조군으로 나뉘어 25일간 치료 효과와 세균학적 관해를 비교했습니다.","연구 결과, 음파펄스 요법군은 냉각레이저 요법군과 대조군에 비해 유방염 관해율이 유의하게 높게 나타났습니다. somatic cell counts(SCC) 수치와 우유 성분 변화, 세균 배양 결과를 종합한 분석에서 음파펄스 요법이 아 임상적 유방염 치료에 더 효과적인 것으로 확인되었습니다. 특히 세균학적 관해율과 우유 생산량 회복 측면에서 음파펄스 요법이 다른 두 군보다 우수한 성과를 보였습니다.","한국 동물병원 관점에서 이 연구는 반려동물을 포함한 가축 유방염 치료에 비약물 요법의 가능성을 제시합니다. 유기축산뿐 아니라 항생제 내성 문제로 항생제 사용을 줄이고 싶은 농장에서도 음파펄스 치료가 대안이 될 수 있음을 시사합니다. 다만 동물 종류와 상태에 따른 최적 치료 프로토콜은 원문 참고가 필요하며, 한국 실정에 맞는 추가 연구가 뒷받침되어야 합니다."],"blog":"이 연구 결과를 바탕으로 반려동물 유방염에서도 항생제 대안 치료법에 대한 동물병원 교육 자료를 만들어볼 수 있습니다.","blogAngle":["유기축산 우유 소 아 임상적 유방염 치료를 위해 음파펄스 요법과 냉각레이저 요법을 비교 평가했습니다.","음파펄스 요법군이 냉각레이저 요법군과 대조군보다 유방염 관해율이 유의하게 높게 나타났습니다.","SCC 수치, 우유 성분, 세균학적 관해율을 종합한 분석으로 효과가 확인되었습니다.","항생제 사용이 제한적인 상황에서 비약물 치료 전략으로 활용 가능성이 확인되었습니다."],"radar":{"owner":null,"clinical":"본 연구는 우유 소(가축)의 유방염 치료에 관한 것으로, 개·고양이 등 반려동물 진료에 직접 적용하기 어려운 내용입니다. 진료 프로토콜 변경은 필요하지 않습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_7","legacySlug":null,"day":"2026-07-25","ts":1784887200000,"publishedAt":"2026-07-24T10:00:00.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"강아지가 리콜 사료 먹었을 때 수의사가 알려주는 대처법","dek":"최근 수백만 개의 강아지 사료가 리콜되면서 애완동물 소유자들에게 비상 상황이 발생했습니다. 수의사가 리콜 사료를 섭취한 강아지의 주인이 취해야 할 단계를 상세히 안내했습니다.","source":"Newsweek","country":"","date":"07.24","read":"1분 읽기","plate":"Newsweek","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMinAFBVV95cUxQZ0RnRkNaeGJqTW43VFIwRlZFS0M2dV9ia2plTDB1NW13RkpfVTdEU0FVQ3JhdU9XR3NIX21oRTA5WS1uTmZ6VkpMZm5aNE1iZFJFRXkybXI2V0RGX1dfNG52MGt2VjdnRjdYWloyeXZEWnZZblRtVEE4WHBaYXdjNXNBTG9wTElORzNVbWx5QU1wTUNxdUt1S0pqRWU?oc=5","body":["현재 미국에서 여러 브랜드의 사료가 살모넬라 및 리스테리아 오염 우려로 리콜되었습니다. 이는 강아지뿐만 아니라 인간에게도 전염 위험이 있으며, 특히 면역력이 약한 아동과 노인에게 더욱 위험합니다.","식이 오염된 사료를 섭취한 강아지는 구토, 설사, 발열, 무기력증 등의 증상을 보일 수 있습니다. 즉시 수의사에게 연락하여 사료 브랜드, 배치 번호, 구매처, 섭취량을 정확히 전달해야 하며, 가능하면 남은 사료나 포장지를 함께 가져가는 것이 도움이 됩니다.","한국 동물병원 입장에서는 리콜 정보 실시간 확인 체계를 마련하고, 동물 병원 현장에서 오는 문의에 체계적으로 대응하는 것이 중요합니다. 또한 리콜 사료 섭취 후 발생하는 응급 상황 대비 진료 프로토콜을 사전에 준비해두면 신속한 대응이 가능합니다."],"blog":"한국 동물병원 블로그에 '사료 리콜 시 애완동물 보호를 위한 대처법'이라는 제목으로 주인의 행동 가이드라인을 정리한 글을 게재하면 유용한 정보 제공이 됩니다.","blogAngle":["살모넬라나 리스테리아에 오염된 사료는 강아지뿐 아니라 인간에게도 전염 위험이 있습니다.","리콜 사료 섭취 의심 시 즉시 수의사에게 연락하고 사료 정보를 정확히 전달해야 합니다.","강아지 증상이 없어도 최소 72시간 동안 건강 상태를 면밀히 관찰해야 합니다.","남은 사료나 포장지는 수의사 진단에 중요한 증거가 됩니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 리콜된 사료를 먹었는데 지금 어떻게 해야 하나요?","script":"리콜 사료를 섭취했다면 우선 남은 사료와 포장지를 보관하고, 강아지의 증상을 주의 깊게 관찰하세요. 구토, 설사, 발열, 무기력 등이 나타나면 즉시 내원해야 하지만, 증상이 없어도 가까운 동물병원에서 진찰을 받는 것이 좋습니다."},"clinical":"리콜 사료 섭취 관련 응급 진료 프로토콜을 사전에 준비하고, 리콜 정보 실시간 확인 체계를 구축할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_8","legacySlug":null,"day":"2026-07-25","ts":1784905642000,"publishedAt":"2026-07-24T15:07:22.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":true,"title":"개의 음식 중독 위험, 예상치 못한 25가지 식품","dek":"미국수의협회 등이 개의 생명에 위협이 되는 25가지 유해 식품을 공개했습니다. 예상치 못한 식품들도 포함되어 있어 소유자들의 주의가 필요합니다.","source":"qz.com","country":"","date":"07.25","read":"1분 읽기","plate":"qz.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiSkFVX3lxTE44b1d0dTFfY3N4bU9LSFpHOC1ndDNRSlZWNC1xYVJ0MThnYUpocTltMWdsMXNxSVZmY2VwWXlBdl9xQmxIUm9Qd2pR?oc=5","body":["미국수의협회(AVMA)와 Pet Poison Helpline 등이 개의 음식 중독을 유발하는 25가지 식품 목록을 공개했습니다. 일반적으로 알려진 초콜릿, 포도, 양파뿐만 아니라 avocado, macadamia nuts, xylitol 함유 식품들도 포함되어 있습니다. 최근 연구에 따르면 강아지에서 xylitol 노출 건수가 크게 증가한 것으로 보고되었습니다.","목록에서 특히 주목할 점은 소유주들이 자주 주, 그저 간단한 간식이라고 생각하는 식품들입니다. 예를 들어, 사과 씨, 체리 씨, 감자 생즙 등이 의외로 위험할 수 있습니다. 또한 일부 개는 인간용 처방약이나 보충제에도 노출될 수 있어 의학적 조치가 필요합니다.","한국 동물병원에서는 소유주들에게 이러한 유해 식품에 대한 교육이 중요합니다. 특히 국내에서 쉽게 구할 수 있는 식품들(예: 양파, 마늘, 포도)도 주의가 필요하며, xylitol이 함유된 Sugar-free 제품 노출 시 신속한 치료가 요구됩니다. 예방을 위한 소유주 가이드라인 제공이 권장됩니다."],"blog":"한국 동물병원 블로그에 '개의 음식으로 인한 중독 예방을 위한 소유주 가이드'를 주제로 작성하여 소유주의 주의호를 높이고, xylitol 함유 국내 제품 정보를 공유하는 글을 기획해 볼 수 있습니다.","blogAngle":["미국수의협회 등은 개의 음식 중독을 유발하는 25가지 유해 식품 목록을 공개했습니다.","초콜릿, 포도, 양파 외에도 avocado, macadamia nuts, xylitol 등이 위험합니다.","사과 씨, 체리 씨, 감자 생즙 등 예상치 못한 식품들도 주의가 필요합니다.","한국 동물병원에서는 소유주 교육과 예방 가이드라인 제공이 중요합니다."],"radar":{"owner":{"soon":true,"q":"개한테 사과나 채소 간식으로 줘도 되나요?","script":"사과 자체는 안전하지만 씨에는 시안화물이 들어있어서 위험해요. 채소는 삶아서 지방 없이 주는 게 안전하고요. 무엇보다 이 들어간 무가당 제품이 가장 위험하니 무가당 간식이나 음료는 절대 주면 안 됩니다."},"clinical":"신규 보호자 교육 시 유해 식품 목록을 제공하고, 급성 위장관 증상 환자의 문진에서 노출된 음식물을 반드시 확인하며, 함유 제품 노출 시 신속한 응급 처치 준비","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_9","legacySlug":null,"day":"2026-07-25","ts":1784734910000,"publishedAt":"2026-07-22T15:41:50.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 삶의 질 평가 도구 등장","dek":"영국에서 고양이 소유주를 위한 새로운 삶의 질 평가 도구가 출시되었습니다. 노령 고양이의 관리 결정을 돕기 위해 개발된 이 도구는 동물병원에서도 활용할 수 있습니다.","source":"Vet Times","country":"","date":"07.23","read":"1분 읽기","plate":"Vet Times","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiugFBVV95cUxPS3l1WGNqMDh6ekt1cUJIT0xCdzJ6akRUeDVoeFBMZGdpWGdNNExCMExpUHZoRzJ0Ni1BTzFqb2dpSWdocVVTLXlhaW9ycFd1ckxaOHJFQ3VYZTV1S0JFaHBQbjFZWGUzZ3Q4WS1MUEUxRUswcXdsNTZieVk2QWRyWUZWNGVVMGdOZHlXX1BIcHhiNGRFcFFmdFc5UFdra1Q2bDM0N2VGWmZXZzZlb0lwN1JrLVpSdURIVHc?oc=5","body":["고양이의 삶의 질 평가는 강아지에 비해 상대적으로 주목받지 못해왔습니다. 대부분의 평가 도구는 개를 기반으로 개발되어 있어, 고양이의 고유한 행동 특성과 스트레스 반응을 반영하지 못한다는 지적이 있었습니다. 영국 애니멀웰빙 연구소(Animal Welfare Research Institute)는 이러한 격차를 해소하기 위해 본 도구를 개발했습니다.","본 도구는 고양이의 주요 삶의 질 영역 5가지를 체계적으로 점검할 수 있도록 설계되었습니다. 식사, 수면, 활동성, 사회적 상호작용, 통증 징후 등 일상적 관찰 항목을 포함하며, 소유주가 직접 기록할 수 있는 체크리스트 형태로 제공됩니다. 점수화 시스템을 통해 시간에 따른 변화를 추적할 수 있어 노령 고양이나 만성 질환 고양이 관리에 실용적입니다.","한국 동물병원에서도 본 도구를 진찰실 도구로 활용할 수 있습니다. 특히 노령 고양이 진료 시 보호자와 삶의 질에 대한 논의를 돕는 보조 자료로 쓰이며, 치료방향 결정 과정에서 객관적 기준을 제시할 수 있습니다. 병원 블로그나 소셜미디어에서 고령 고양이 관리 팁으로 소개하면 보호자 교육 콘텐츠로 활용됩니다."],"blog":"한국 동물병원에서는 고령 고양이 보호자를 대상으로 한 교육 콘텐츠나 블로그 글의 소재로 활용할 수 있습니다.","blogAngle":["영국에서 고양이 전용 삶의 질 평가 도구가 최초로 개발되어 출시되었습니다.","식사, 수면, 활동성, 사회적 상호작용, 통증 등 5개 영역을 체계적으로 점검합니다.","소유주가 직접 기록하고 시간에 따른 변화를 추적할 수 있는 체크리스트 형태입니다.","만성 질환이나 노령 고양이의 관리 결정에 실용적인 도구로 활용됩니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이도 일상적으로 어떻게 삶의 질을 체크하면 되나요?","script":"식사량, 수면 패턴, 활동성, 사람이나 다른 동물과의 상호작용, 통증 징후 등 5가지를 일상적으로 관찰해보세요. 매주 간단히 기록하면 변화 추적에 도움이 됩니다. 구체적인 평가 방법은 진료 시 상담해드리겠습니다."},"clinical":"노령 고양이 진료 시 이 평가 도구를 진찰실 보조 자료로 활용하고, 보호자와의 삶의 질 논의를 체계적으로 진행하는 것을 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_10","legacySlug":null,"day":"2026-07-25","ts":1784857955000,"publishedAt":"2026-07-24T01:52:35.000Z","cat":"career","kicker":"커리어","isToday":false,"title":"Vet Candy, 동물 의료 서비스 품질 보장 정책 발표","dek":"수의학 전문 미디어 플랫폼 Vet Candy가 고객 서비스 강화 프로그램을 발표했습니다. 해당 플랫폼은 상품 구매 고객을 위한 100% 만족 보장과 30일 이내 무료 반품 정책을 시행합니다.","source":"Vet Candy","country":"미국","date":"07.24","read":"1분 읽기","plate":"Vet Candy","image":"http://static1.squarespace.com/static/5c2aec4b1137a6d8849debf1/6512489d8040f03c02fce8a0/6a62c563b3f2266e5177eff0/1784858074236/veterianry+surgery+unit+training+veterinary+students+texas.jpg?format=1500w","sourceUrl":"https://www.myvetcandy.com/news/2026/7/23/a-new-texas-center-will-train-300-new-grads-a-year-in-the-skill-vet-school-runs-out-of-time-to-teach","body":["Vet Candy는 회원님들의 만족을 최우선으로 생각하며, 어떠한 이유든 구매하신 상품에 완전히 만족하지 못하신 경우 환불이 가능하다고 발표했습니다. 고객은 hello@myvetcandy.com으로 연락하여 문제를 해결할 수 있으며, 모든 제품에 대해 번거로움 없는 100% 만족 보증을 제공하고 있습니다.","반품은 고객님께서 직접 요청하시며, 상품 수령 후 30일 이내에 가능합니다. 반품 요청 시 무료 shipping 라벨이 제공되며, 배송비를 제외한 금액이 결제하신 신용카드로 환불됩니다. 재고료는 부과되지 않습니다.","한국 동물병원에서도 최근 고객 서비스 품질 강화의 중요성이 부각되고 있습니다. Vet Candy의 고객 중심 정책은 동물병원 실무에서도 참고할 만한 고객 만족 전략의 사례가 됩니다. 또한 온라인 플랫폼을 통한 수의학 교육 자료 및 용품 배포의 신뢰성 확보 방안에도 시사점을 제공합니다."],"blog":"한국 동물병원 블로그에서 동물의료 서비스의 고객 만족 보장 정책에 대한 논평으로 활용할 수 있습니다","blogAngle":["Vet Candy는 모든 상품에 대해 100% 만족 보증을 제공합니다","반품 및 환불은 상품 수령 후 30일 이내에 가능하며 무료 반품 라벨이 제공됩니다","재고료는 부과되지 않으며 결제 금액에서 배송비를 제외하고 환불됩니다","고객 정보 보호를 위해 개인정보 보호정책을 수립하고 있습니다"],"radar":{"owner":null,"clinical":"동물병원에서도 진료 외 서비스(예: 사료·보조제 구매, 예약 시스템 등)의 환불·교환 정책을 명확히 하고, 필요시 고객에게 안내할 수 있는 절차를 마련하는 것이 고객 만족도 향상에 도움이 됩니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_11","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개와 고양이 경추뼈 미세구조 연구, Toy 견에서 피질골 밀도 높아","dek":"미세 전산화 단층촬영(Micro-CT)을 활용하여 개와 고양이의 경추뼈 피질골과 해면골 미세구조를 분석한 연구가 발표되었습니다. 소형견과 토이견, 고양이 간의 해부학적 차이가 확인되었으며, 이는 수의 정형외과 영역에 중요한 시사점을 제공합니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1888800/full","body":["경추뼈, 특히 상부 경추의 미세구조에 대한 연구는 지금까지 제한적이었습니다. 독일 뮌헨 소동물외과 클리닉 연구팀은 euthanasia된 개 20마리(토이견 10마리, 소형견 10마리)와 고양이 20마리의 첫 4개 경추체를 Micro-CT로 분석했습니다. 연구에서는 골용적률, 골표면대용적비, 연결밀도, 해면골 수, 해면골 두께, 해면골 분리도, 이방성 지수, 피질골 밀도, 고실-축 추 길이비 등 9가지 매개변수를 측정했습니다.","분석 결과, 토이견과 소형견 간의 해면골 미세구조는 대체로 유사했으나, 피질골 밀도는 토이견에서 유의하게 높게 나타났습니다. 개와 고양이를 비교하면, 고양이에서는 더 큰 골표면대용적비, 더 높은 이방성 지수, 더 큰 해면골 분리가 빈번하게 관찰되었습니다. 반면 토이견은 고양이보다 더 두꺼운 해면골을 보이는 경향이 있었습니다.","이 연구결과는 수의 정형외과 및 신경외과에서 경추 질환을 가진 환자 진료 시 종특이적 접근의 중요성을 강조합니다. 토이견에서 높은 피질골 밀도는 내고정 재료 선택이나 고정 방법에 고려해야 할 사항이며, 고양이의 해면골 특성은 퇴행성 관절질환이나 추간판 질환 평가 시 참고할 수 있습니다. 한국 동물병원에서도 경추 질환 진료 시 이러한 종특이적 미세구조 데이터를 임상적으로 활용할 수 있을 것입니다."],"blog":"경추 추간판 탈출증이나 경추 척수 질환을 가진 환자를 진료할 때, 종(개/고양이)별 골밀도 차이를 고려한 치료 계획을 세우는 이야기를 블로그에 작성해 보세요.","blogAngle":["토이견의 피질골 밀도가 소형견보다 유의하게 높게 나타나 종특이적 골밀도 차이가 확인되었습니다.","고양이는 개보다 높은 이방성 지수와 더 큰 해면골 분리를 보여 해면골 구조의 종차가 두드러집니다.","경추 질환 진료 시 개와 고양이의 미세구조적 차이를 고려한 접근이 필요합니다.","Micro-CT 기술이 소동물의 경추뼈 미세구조 연구에 효과적으로 활용될 수 있습니다."],"radar":{"owner":null,"clinical":"경추 질환 환아 진료 시 종특이적 접근을 고려하되, 특히 토이견에서 피질골 밀도가 높다는 점을 내고정 재료 선택 시 참고하되, 개별 환자의 구체적 상태를 우선 검토할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_12","legacySlug":null,"day":"2026-07-25","ts":1784816462000,"publishedAt":"2026-07-23T14:21:02.000Z","cat":"industry","kicker":"업계","isToday":false,"title":"미국 Galveston, 벼룩 매개 티푸스 재출현 연구의 중심지로","dek":"미국 질병통제예방센터가 Galveston 지역을 중심으로 벼룩에 의해 전파되는 티푸스의 재출현에 대한 새로운 연구를 진행하고 있습니다. 이 질병은 최근 미국 남부 해안가 지역에서 증가 추세를 보이고 있어 수의학과 공중보건 분야에 경각심을 사고 있습니다.","source":"Houston Public Media","country":"","date":"07.23","read":"2분 읽기","plate":"Houston Public Media","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMivAFBVV95cUxOYlU2U0VDYWdLUE55d0lzeWJjUTU2RndJMkhLSTRYTFVDbmZHa05ON3RpVVV6RHBiZGtBXzNzTUJFeElpMDloOThhWlJDNkZPV0RNbWV3ZGc4eXJmY0lsRU5LV19JbG9SUWl6RVVMaFFzQldxbWVhd1JhSVdjZXNjWHJseDZaWWttcFRxSkV5cVF2bVJhUmdWeWRFWm1ZSmtNTl9RVWRYZUMxSC1rOFdyeTg0TlFvR1RlSGZpb9IBvAFBVV95cUxOYlU2U0VDYWdLUE55d0lzeWJjUTU2RndJMkhLSTRYTFVDbmZHa05ON3RpVVV6RHBiZGtBXzNzTUJFeElpMDloOThhWlJDNkZPV0RNbWV3ZGc4eXJmY0lsRU5LV19JbG9SUWl6RVVMaFFzQldxbWVhd1JhSVdjZXNjWHJseDZaWWttcFRxSkV5cVF2bVJhUmdWeWRFWm1ZSmtNTl9RVWRYZUMxSC1rOFdyeTg0TlFvR1RlSGZpbw?oc=5","body":["Flea-borne typhus는 Rickettsia typhi 세균에 의해 발생하는 질환으로, 쥐 벼룩을 매개체로 하여 인간에게 전파됩니다. 역사적으로 미국 남부 해안가에서 발생해 왔으나, 최근 몇 년간 그 사례가 다시 증가하면서 CDC의 연구 대상이 되었습니다. Galveston은 이 연구의 중심지로 선정되어 해당 지역에서의 감염 사례와 위험 인자에 대한 조사가 이루어지고 있습니다.","이 질병의 증상에는 발열, 두통, 근육통, 발진 등이 포함되며, 적절한 치료 없이는 심각한 합병증을 유발할 수 있습니다. 그러나 일찍 발견하여 항생제로 치료하면 대부분 완치됩니다. 전문가들은 기후 변화와 도시 쥐 개체수의 증가가 재출현의 주요 원인으로 보고 있습니다. 연구팀은 해당 지역의 동물 종과 환경적 요인을 분석하여 예방 방안을 모색하고 있습니다.","한국 동물병원에 시사하는 바는 중요합니다. 반려동물, 특히 야외 활동을 자주 하는 개와 고양이가 벼룩에 노출될 위험이 있습니다. 수의사들은 주님에게 예방적 해충방제 중요성을 설명하고, 벼룩 매개 질환의 초기 증상에 대한 교육이 필요합니다. 이는 반려동물의 건강 보호와 함께 가족 전체의 공중보건 향상에 기여할 수 있습니다."],"blog":"한국 동물병원 블로그 글감으로 활용한다면, '최근 증가하는 벼룩 매개 질환, 예방을 위해 우리가 할 수 있는 것'이라는 제목으로 반려동물의 벼룩 관리 방법과 질병 초기 증상에 대한 정보를 제공하는 원고를 쓸 수 있습니다.","blogAngle":["미국 질병통제예방센터가 Galveston을 중심으로 벼룩에 의해 전파되는 티푸스의 재출현에 대한 대규모 연구를 진행하고 있습니다.","이 질병은 Rickettsia typhi 세균에 의해 발생하며, 쥐 벼룩을 통해 인간에게 전파됩니다.","최근 기후 변화와 도시 쥐 개체수 증가로 인해 발생 사례가 다시 증가하고 있는 것으로 파악됩니다.","한국 동물병원에서는 벼룩 예방 관리와 질병 초기 증상에 대한 교육이 더욱 중요해졌습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 벼룩에 물리면 티푸스 같은 병에 걸릴 수도 있나요?","script":"벼룩 매개 티푸스는 세균이 벼룩을 통해 전파되는 질병입니다. 미국에서는 최근 증가 추세지만, 국내에서는 아직 보고가 거의 없습니다. 정기적인 벼룩 예방과 야외 활동 후 몸 점검이 필요합니다."},"clinical":"외부 활동 빈도가 높은 개·고양이 환자에게 벼룩 예방 실시 여부와 야외 환경 노출력을 문진에 포함시킬지 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_13","legacySlug":null,"day":"2026-07-25","ts":1784808000000,"publishedAt":"2026-07-23T12:00:00.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"반려동물 구강건강 영양학: 근본부터 개선하는 영양제품 개발동향","dek":"반려동물 구강건강 관리를 위한 영양학적인 접근이 주목받고 있습니다. 구취, 치주질환 등 구강문제는 반려동물 삶의 질을 저하시키는 주요 원인으로 작용하며, 이를 해결하기 위한 기능성 사료 개발이 활발해지고 있습니다.","source":"Pet Food Processing","country":"","date":"07.23","read":"1분 읽기","plate":"Pet Food Processing","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMitAFBVV95cUxNYnpOcHMxbXBTOF9uQXVuc1U0YXJFckFadkJ4N0pxUmxzUG9xRUd1NHNFV0l1NzZ1MWRMYnZCalc0VTJkUHptTUpmc3JueXZnaUJxa2xMakd3bGxMNGFINlUtWDdtUk9zQ1VfUng5azNwX1k4WC1ibFJDMzU4SmozaENpeUIyd1JXV1NDUGpPcjI5Q1ZjT2VTdnZwU09aS1pOMEI3cDQ2b1M1OUdKenc1cFgtNEY?oc=5","body":["반려동물의 구강건강은 전체 건강과 밀접하게 연관되어 있습니다. 최근 연구에 따르면 3세 이상 성견의 80% 이상에서 치주질환이 관찰되며, 이는 심장, 신장 등 전신 질환으로 이어질 수 있습니다. 전통적인 칫솔질이나 저작 치료에만 의존하기 어려운 상황에서, 영양학을 활용한 구강관리 접근이 대안으로 부상하고 있습니다.","구강건강 기능을 가진 펫푸드는 크게 기계적 작용과 화학적 작용으로 구분됩니다. 기계적 작용은 특수한 형태의 그레인,섬유,저작 유형을 통해 치석 제거를 돕는 방식이며, 화학적 작용은 클로르헥시딘,테오브로민,폴리페놀 등 성분이 세균 증식을 억제하거나 치석 형성을 저해하는 원리입니다. 최근에는 이 두 가지 접근법을 결합한 하이브리드 제품이 시장에서 입증되고 있습니다.","한국 동물병원 관점에서 보면, 구강건강 영양학은 예방의학의 중요한 축이 됩니다. 수의사들은 정기 검진 시 영양 상담을 통해 구강문제의 조기 발견과 관리를 권장할 수 있으며, 기능성 사료의 적절한 선택은 치료 효과를 높이는 보조 수단이 됩니다. 향후 펫푸드 업계와수의계의 협력을 통한 근거 기반의 구강영양 관리가 표준화될 것으로 전망됩니다."],"blog":"한국 동물병원 블로그에서 '반려동물 구강건강, 사료로 관리하기'라는 주제로 수의사 상담 사례와 함께 기능성 사료 선택 가이드로 활용할 수 있습니다","blogAngle":["3세 이상 성견의 80% 이상에서 치주질환이 관찰되어 전신 건강에 영향을 미칩니다","기능성 사료는 기계적 치석제거와 화학적 세균억제 성분의 결합으로 작동합니다","영양학적 관리는 칫솔질과 병행하여 구강건강 관리 효과를 높일 수 있습니다","수의사들은 예방의학 차원에서 구강영양 상담의 역할을 확대할 수 있습니다"],"radar":{"owner":{"soon":true,"q":"강아지 구강건강에 좋은 사료나 간식이 있을까요?","script":"구강건강 기능성 사료나 간식은 치석 감소에 도움을 줄 수 있지만, 이것만으로 치주질환을 치료할 수는 없습니다. 정기적인 구강 검사와 칫솔질이 가장 중요하며, 사료는 보조 수단으로 생각해 주세요."},"clinical":"구강건강 문진 시 기존 사료 유형 및 저작 간식 섭취 여부 함께 파악하고, 필요시 기능성 사료 권고 여부 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_14","legacySlug":null,"day":"2026-07-25","ts":1784585686000,"publishedAt":"2026-07-20T22:14:46.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"힐스 글로벌 심포지엄, 피부·장 건강 영양 전략 논의","dek":"힐스 펫뉴트리션이 태국 푸켓에서 '건강한 피부는 내부에서 시작된다'를 주제로 2026 힐스 글로벌 심포지엄을 개최했습니다. 피부과와 소화기 건강에 대한 최신 영양 전략을 논의한 이 자원은 수의 전문가에게 무료로 제공됩니다.","source":"Vet Practice Magazine","country":"호주","date":"07.21","read":"1분 읽기","plate":"Vet Practice Magazine","image":"https://www.vetpracticemag.com.au/wp-content/uploads/2026/07/Hills-audience.jpg","sourceUrl":"https://www.vetpracticemag.com.au/hills-global-symposium-resources-for-veterinary-professionals/","body":["힐스 펫뉴트리션이 개최한 2026 힐스 글로벌 심포지엄은 세계 각국의 주요 수의 전문가들이 참여한 대규모 무료 교육 기회입니다.이번 행사는 'Healthy Skin Starts from Within(건강한 피부는 내부에서 시작된다)'라는 주제 아래 피부과 및 소화기 건강에 대한 최신 인사이트와 영양 전략을 공유하기 위해 마련되었습니다.","전 세계 유수의 수의 전문가들이 강사로 참석하여 피부와 장 건강의 연관성에 대한 최신 연구 결과를 발표했습니다.강의록과 심포지엄 자료는 참여하지 못한 수의 전문가들도 열람할 수 있도록 공개되어, Gut-skin 축(Gut-Skin Axis)에 대한 전문적 학습 기회를 제공합니다.","한국 동물병원에서도 피부 질환을 호소하는 환축을 진료할 때 영양학적인 접근의 중요성을 다시 한번 확인할 수 있는 기회입니다.특히 장 건강과 피부 건강의 연관성에 대한 최신 지견은 사료 상담 및 영양 처방의 근거로 활용될 수 있으며, 힐스에서 제공하는 학술 자료를 참고하여 임상에 적용할 수 있습니다."],"blog":"한국 동물병원 블로그에서 환축 보호자에게 피부와 장 건강의 연관성을 설명하는 교육 콘텐츠로 활용할 수 있습니다.","blogAngle":["2026 힐스 글로벌 심포지엄이 태국 푸켓에서 '건강한 피부는 내부에서 시작된다'를 주제로 개최되었습니다.","피부과와 소화기 건강의 연관성, 특히 Gut-Skin 축에 대한 최신 영양 전략이 논의되었습니다.","힐스에서 심포지엄 강의록과 학술 자료를 수의 전문가에게 무료로 제공합니다.","한국 동물병원에서도 피부 질환 관리에 영양학적 접근의 중요성을 다시 한번 살펴볼 수 있습니다."],"radar":{"owner":{"soon":true,"q":"강아지 피부가 갑자기 가려운데 사료 때문에 그런 건가요?","script":"피부 건강에 사료가 영향을 미칠 수 있다는 연구가 있습니다. 특히 장 건강과 피부 건강이 연관되어 있다는 장-피부 축 연구 결과들이 나오고 있어요. 다만 정확한 원인은 다양하므로 진료를 통해 확인해보는 것이 좋습니다."},"clinical":"피부 질환 환자 진료 시 사료 내 영양성분(오메가3, 지방산 등) 확인 및 장 건강과의 연관성 문진 고려","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_15","legacySlug":null,"day":"2026-07-25","ts":1784834379000,"publishedAt":"2026-07-23T19:19:39.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"말 관절경 시술의 탄소 발자국 연구, 운반과 소모품이 주요 배출원","dek":"영국 equine 병원에서 실시된 말 관절경 시술 10건의 탄소 배출량 분석 결과, 총 2044 kgCO2e의 온실가스가 배출된 것으로 확인되었습니다. 운반이 전체 배출량의 42%를 차지해 병원 운영의 지속가능성 개선이 시급한 것으로 나타났습니다.","source":"Veterinary Record","country":"영국","date":"07.24","read":"2분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70981?af=R","body":["인간 활동이 지구 생물권 한계를 초과함에 따라 의료 분야 전반의 탄소 발자국 감축이 중요해지고 있습니다. 영국 한 equine 병원에서 2025년 1~3월 사이에 관절경 시술을 받은 말이 10마리를 대상으로prospectve 연구가 수행되었으며, 마취, 의약품, 일회용 소모품, 폐기물, 건물 에너지 및 직원·환자 이동 데이터를 수집하여 탄소 배출량을 산출했습니다.","분석 결과 총 배출량 2044 kgCO2e 중 운반이 42%(860 kgCO2e)로 가장 큰 비중을 차지했으며, 일회용 소모품 21%, 의약품 11%, 폐기물 3%, 건물 에너지 1% 미만이었습니다. 소유자 이동 거리의 중앙값이 251km였으며, 이는 운반 배출량의 86%를 차지했습니다. 마취 가스 포획 장치인 Vet-Can은 1199분간 490g의 이소플루레인을 포집했습니다.","한국 동물병원에서도 관절경 등 외과 시술 시 탄소 배출 저감 전략을 검토할 필요가 있습니다. 특히 보호자 교통 수단 최소화 방안, 일회용 소모품 사용 최적화, 마취 가스 관리 체계 개선 등이 현실적인 접근 방법이 될 수 있습니다. 이는 환경 보호와 병원 운영 효율성 향상을 동시에 달성할 수 있는 기회가 됩니다."],"blog":"한국 동물병원에서도 외과 시술의 탄소 발자국을 평가하고, 보호자 교통 및 소모품 사용 최적화를 통해 지속가능성을 높이는 방안을 블로그로 소개할 수 있습니다.","blogAngle":["말 관절경 시술 10건의 총 탄소 배출량은 2044 kgCO2e로 산출되었습니다.","운반(42%)과 일회용 소모품(21%)이 전체 배출량의 63%를 차지해 가장 큰 개선 대상으로 확인되었습니다.","소유자 이동 거리의 중앙값은 251km였으며, 이는 운반 배출량의 86%를 차지했습니다.","마취 가스 포획 장치는 1199분간 490g의 이소플루레인을 포집했습니다."],"radar":{"owner":null,"clinical":"말 관절경 시술 시 소유자 이동 거리가 전체 탄소 배출의 상당 부분을 차지하므로, 원격 진료나 지역사회 협력 진료 활성화 가능성을 점검해 볼 수 있습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_16","legacySlug":null,"day":"2026-07-25","ts":1784610608000,"publishedAt":"2026-07-21T05:10:08.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"환형고래에서 신규 헬리코박터균 3종 확인","dek":"미국 플로리다 대학교 연구팀이 20년 이상의 고래 좌초 기록을 분석해 환형고래(Kogia breviceps)에서 이전에 알려지지 않은 헬리코박터균 3종을 발견했습니다. 이 세균은 고래의 위장염과 위궤양과 연관되어 있어 해양포유류 건강에 대한 새로운 의문을 제기합니다.","source":"ScienceDaily","country":"","date":"07.21","read":"2분 읽기","plate":"ScienceDaily","image":"https://www.sciencedaily.com/images/1920/stranded-pygmy-sperm-whale.webp","sourceUrl":"https://www.sciencedaily.com/releases/2026/07/260721000847.htm","body":["환형고래는 연안에서 멀리 떨어져 생활하고 수면 위에서 거의 보이지 않아 과학자들이 직접 관찰하기 매우 어려운 포유류입니다. 연구자들은 주로 좌초된 고래를 통해 이 종에 대해 알게 되었고, 미국 남동부 해안에서 좌초가 특히 자주 발생합니다. Florida Atlantic University Harbor Branch는 1999년부터 2020년 사이 59건의 환형고래 좌초에 대응했으며, 그 중 80%에서 사후 검사가 실시되었습니다.","연구팀은 4마리의 고래 조직에서 스피릴형 세균을 발견하고 유전자 분석을 진행한 결과, 이전에 알려지지 않은 헬리코박터 유전자형을 3종 확인했습니다. 이 세균들은 'Kogia Helicobacter 1, 2, 3'로 명명되었으며, 특히 Kogia Helicobacter 3은 기존 헬리코박터 종과 유전적으로 크게 다른 계통에 속합니다. 네 마리 모두 위장염, 위궤양, 조직 반흔 및 기생충 감염의 증거를 보였으나, 헬리코박터가 직접적인 사인으로 확인되지는 않았습니다.","이 발견은 해양포유류 건강 연구의 중요성을 보여주는 동시에, 비교의학 관점에서 한국 동물병원에도 시사점을 제공합니다. 환형고래와 마찬가지로 개와 고양이 등 동물에서도 헬리코박터 관련 위장 질환이 보고되고 있어, 해당 세균의 종 특이성과 질병과의 연관성에 대한 추가 연구가 필요합니다.","연구팀은 이번 발견이 장기적인 좌초 대응 프로그램의 가치를 입증한다고 밝혔습니다. 환형고래는 해양에서 직접 연구가 어렵기 때문에, 이번에 발견된 세균이 고래 개체군 전반에 얼마나 광범위하게 분포하는지는 아직 알려져 있지 않습니다."],"blog":"개와 고양이에서도 보고되는 헬리코박터 관련 위장 질환과의 비교를 통해, 한국 동물병원 블로그에서 해양포유류와 인간·애완동물의 공통 질병에 대해 다루는 글감이 될 수 있습니다.","blogAngle":["연구팀이 20년 이상의 고래 좌초 기록을 분석해 환형고래에서 신규 헬리코박터균 3종(Kogia Helicobacter 1, 2, 3)을 최초로 확인했습니다.","네 마리 모두에서 위장염, 위궤양, 조직 반흔 등 명확한 위장 질환 증거가 관찰되었으나, 세균이 직접적인 사인으로 확인되지는 않았습니다.","Kogia Helicobacter 3은 기존 헬리코박터 종과 유전적으로 크게 다르며, 해양에는 아직 발견되지 않은 세균이 훨씬 많을 수 있음을 시사합니다.","환형고래는 연구가 매우 어렵기 때문에 해당 세균의 광범위 분포와 장기적 영향에 대해서는 추가 조사가 필요합니다."],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_17","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"쥐 낙관적 편향의 trait·state 차원 구분 연구","dek":"독일 뮌스터 대학 연구팀이 쥐의 낙관 수준을 3주간 반복 측정하여 긍정적 편향의 일관된 trait 특성을 확인했습니다. 동물 복지 평가 지표로 활용되는 인지적 판단 편향 검사의 한계를 파악하고, state 차원의 추가 연구 필요성을 확인한 연구입니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1849399/full","body":["낙관과 비관이라는 용어는 개인이 모호한 정보를 긍정적 또는 부정적으로 해석하는 경향을 나타냅니다. 동물 복지 과학에서는 이러한 판단 편향을 동물의 정서 상태를 측정하는 지표로 활용해왔습니다. 그러나 최근 연구에서 동물들이 일관되게 낙관적 또는 비관적 편향을 보이는 경향이 확인되면서, 낙관에는 일시적인 state 차원뿐 아니라 안정적인 trait 차원도 존재할 수 있다는 가능성이 제기되고 있습니다.","연구팀은 공간 인지 판단 편향 검사를 활용하여 실험용 쥐의 낙관 수준을 반복적으로 측정하고, 측정값의 반복성을 분석하여 trait 낙관의 존재를 검증했습니다. 그 결과, 3주에 걸쳐 일관된 낙관 수준이 관찰되어 trait 차원의 존재를 확인할 수 있었습니다. 이어서 쥐를 부정적 valence를 가진 22kHz 또는 긍정적 valence를 가진 50kHz 초음파 자극에 노출시켜 state 낙관 수준을 변화시키려 했으나, 예상과 달리 낙관 수준이나 불안 유사 행동에 통계적으로 유의미한 영향을 미치지 못했습니다.","이 연구는 낙관의 trait 차원에 대한 추가 증거를 제공하지만, state 차원의 체계적 검증에는 실패했습니다. 이는 동물 복지 평가에서 정서 상태 지표로 판단 편향을 활용하는 데 한계가 있음을 시사합니다. 한국 동물병원에서는 동물의 정서 상태를 객관적으로 파악하기 어려운 현실에서, 이러한 연구 결과가 향후 보다 정교한 평가 방법 개발의 기초 자료가 될 수 있습니다."],"blog":"이 연구 결과를 한국 동물병원 블로그에서 '반려동물의 긍정적 사고를 측정할 수 있을까?'라는 제목으로, 동물의 정서와 복지 평가 방법에 대한 교육 콘텐츠로 활용할 수 있습니다.","blogAngle":["쥐의 낙관 수준은 3주에 걸쳐 반복적으로 측정되어 일관된 trait 특성을 보였습니다.","22kHz와 50kHz 초음파 자극은 낙관 수준과 불안 유사 행동에 유의미한 영향을 주지 못했습니다.","낙관의 trait 차원은 확인되었으나 state 차원의 체계적 검증에는 추가 연구가 필요합니다.","인지적 판단 편향 검사는 동물의 정서 상태를 측정하는 데 한계가 있음을 보여줍니다."],"radar":{"owner":null,"clinical":"동물의 정서 상태 평가 지표로서 인지적 판단 편향 검사의 한계가 확인된 만큼, 진료 시 행동 평가 외에 추가적인 정서 상태 객관화 방안을 점검하고 최신 연구를 지속적으로 관심을 기울일 필요가 있다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_18","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"젖소 발굽뼈 질환의 유병률과 위험요인 분석","dek":"한국축산학연구진이 젖소의 메타포디얼(발굽뼈)과 팔랑제(발가락뼈) 질환에 대한 방사선 평가 및 위험요인 연구를 수행했습니다. 이 질환은 Clermont 질환에 비해 상대적으로 주목받지 못했지만, 동물 복지와 경제적 손실에 큰 영향을 미치는 것으로 확인되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1831766/full","body":["연구팀은 205마리의 영향을 받은 젖소를 대상으로 코호트 연구를 수행하여 메타포디얼과 팔랑제 병변의 유병률, 방사선학적 특성, 위험요인 및 사회적 경제적 영향을 조사했습니다. 연구 결과, 이 질환이 젖소 산업에서 주요한 복지 및 경제적 문제임이 부각되었습니다.","분석 결과, 바닥 유형과 체중 범주와 같은 환경적 및 생물학적 요인들이 이 질환의 발생에 중요한 위험요인으로 작용했습니다. 방사선학적 특징과 공간적 분포를 통해 임상 증상 및 통증 징후가 발굽뼈와 발가락뼈 질환에서 어떻게 나타나는지 상세히 규명되었습니다.","한국 동물병원 관점에서, 이 연구는 소의 근골격계 질환 진단에 방사선 검사의 중요성을 강조합니다. 특히, 발굽 관련 질환이claw horn disorders뿐만 아니라 다른 뼈 질환으로도 이어질 수 있음을 인식하고, 예방 및 조기 진단 전략을 수립하는 데 활용할 수 있습니다."],"blog":"한국 동물병원에서는 소의 발굽 질환 진단 시 방사선 검사를 활용하여 메타포디얼 및 팔랑제 병변을 조기에 발견하고, 바닥 환경 개선과 체중 관리 예방접종을 권고하는 진료 가이드라인을 개발할 수 있습니다","blogAngle":["메타포디얼(발굽뼈)과 팔랑제(발가락뼈) 질환이 젖소 산업에서 주요한 복지 및 경제적 문제로 확인되었습니다","205마리 젖소 코호트 연구를 통해 방사선학적 평가 및 임상 증상 분석이 수행되었습니다","바닥 유형과 체중 범주가 주요 위험요인으로 작용하는 것으로 나타났습니다","이 연구는 소 근골격계 질환의 조기 진단 및 예방 전략 수립에 중요한 기초 자료를 제공합니다"],"radar":{"owner":null,"clinical":"소 발굽뼈 질환에서 방사선 소견의 특징적 양상 및 위험요인(바닥 유형, 체중)을 향후 소 진료 시 문진 및 검사 프로토콜에 참고한다","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_19","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"환경 스트레스와 종마 불임의 분자 기전","dek":"기후 변화와 고온 환경이 종마의 번식 능력에 미치는 영향을 리뷰한 연구가 발표되었습니다. 현재까지의 증거에서 산화 스트레스가 종마 번식 기능 저하와 가장 강하게 연결되어 있습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.25","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1873966/full","body":["기후변화와 고온 환경이 지속됨에 따라 종마 번식 능력에 대한 환경 스트레스의 영향이 주목받고 있습니다. 종마의 정자 형성은 온도에 매우 민감하며, 계절적 생리 변화에 의해 조절되기 때문에 다른 포유류보다 환경 변화에 취약합니다. 특히 여름철 고온과 관리 시스템의 집약화가 진행되면서 번식 종마의 생식 기능 저하가 보고되고 있습니다.","이번 리뷰에서는 산화 스트레스, 세포 사멸, 미토콘드리아 기능 이상, 표지 유전자 조절 등 다양한 분자 기전을 검토했습니다. 종마 특정 증거가 가장 강하게 지지는 것은 산화 스트레스이며, 세포 사멸과 미토콘드리아 이상은 주로 다른 포유류 종에서의 연구에 기반합니다. 또한 환경 스트레스는 정자 형성 자체뿐만 아니라 수정에 필요한 정자 기능적 역량까지 저하시킬 수 있어, 기존 정액 검사에서 정상으로 보이더라도 불임이 발생할 수 있습니다.","한국 동물병원 관점에서 보면, 종마 번식 진료 시 여름철이나 고온 환경에서의 관리 상담이 중요합니다. 산화 스트레스 완화를 위한 영양 보충제나 관리 방안이 실제 임상에 적용될 수 있으나, 종마 특유의 분자 기전에 대해서는 아직 증거가 부족합니다. 향후 종마 특유의 연구가 더 필요하며, 이는 반려동물 진료와 축산 임상 모두에 시사점을 제공할 것입니다."],"blog":"종마를 기르는 농장이나 번식 시설에서 여름철 관리 요령과 산화 스트레스 감소를 위한 영양 관리 상담글로 활용할 수 있습니다","blogAngle":["종마의 정자 형성은 온도에 매우 민감하여 고온 환경에서 기능 저하가 발생합니다","산화 스트레스가 환경 스트레스와 종마 번식 기능 저하를 연결하는 가장 강한 증거입니다","정자 형성뿐 아니라 수정 과정에 필요한 기능적 역량도 환경 스트레스의 영향을 받을 수 있습니다","다른 포유류 종에서의 기전 연구는 많으나 종마 특유의 검증은 아직 부족합니다"],"radar":{"owner":null,"clinical":"종마 번식 진료 시 여름철·고온 환경 관리 상담 제공하고, 산화 스트레스 완화 영양 보충제 권고 고려하되 종마 특이적 증거 부족 유의","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-25_20","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 고등급 수막내 희소돌기아교종 2년간 비정상적으로 느린 진행","dek":"개의 희귀한 수막내 고등급 희소돌기아교종이 2년간 비정상적으로 느린 속도로 진행한 사례를 MRI 소견과 함께 보고합니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.25","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag151","body":["7.5세 중성화 암컷 프렌치 불도그가 소파에서 뛰어내린 후 발생한 요통으로 내원하였습니다. 보존적 치료에 반응하지 않아 자기공명영상을 시행하였으며, 종양이 의심되는 수막내 병변이 확인되었습니다. 단일 동물병원에서 경과 관찰을 목적으로 추적 MRI를 실시하였습니다.","초기 MRI에서 병변은 T2 고신호, T1 등~저신호, STIR 고신호, 강한 고환음영, 조영증강 후 T2-FLAIR에서 중심억제 소견을 보였습니다. 조직병리학적으로 고등급 희소돌기아교종으로 확정 진단되었습니다. 2년간 보존적 치료를 지속하면서 임상 증상이 점진적으로 악화되었고, 추적 MRI에서 병변이 진행되어 다중 격실 영역이 새로 나타났습니다.","개의 수막내 종양은 매우 희귀하며, 고등급 희소돌기아교종의 경우 급격한 진행이 예상되지만 본 사례는 비정상적으로 느린 임상 경과를 보였습니다. MRI 소견은 종양의 조직학적 등급이나 악성도를 예측하는 데 유용할 수 있으나, 단일 사례 보고이므로 일반화에 한계가 있습니다. 보호자들에게 이러한 희귀 종양의 예후에 대한 정확한 정보 제공과 장기적인 추적 관찰의 필요성을 설명하는 것이 중요합니다."],"blog":"반려견이 요통을 보이면 단순 근육통으로만 생각하지 말고, 보존적 치료에 반응하지 않으면MRI 검사를 고려해야 한다는 점을 강조하는 콘텐츠를 작성하면 좋습니다.","blogAngle":["7.5세 프렌치 불도그에서 발생한 수막내 고등급 희소돌기아교종이 2년간 비정상적으로 느린 속도로 진행하였습니다.","초기 MRI에서 T2 고신호, STIR 고신호, 강한 고환음영, 중심억제 소견을 보였으며, 2년 후 추적 MRI에서 다중 격실 영역이 새로 나타났습니다.","보존적 치료만으로 2년간 생존하였으나, 최종적으로 임상 증상이 진행되고 병변이 확대되었습니다.","수의학에서 수막내 희소돌기아교종의 장기 경과에 대한 보고가 매우 드물어 본 사례가 임상적 참고점이 됩니다."],"radar":{"owner":null,"clinical":"수의사 관점에서 이 증례는 수막내 종양의 비정형적 경과를 인식하고, MRI 소견과 조직학적 등급 간의 관계를 항상성 있게 검토하는 기회이며, 고령견에서 신경학적 증상이 나타나면 종양 감별진단에 MRI 활용을 고려할 수 있음","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례 보고이므로 일반화에 한계가 있으며, 고등급 종양의 느린 진행은 예외적 사례로 해석해야 함"}},"tag":"","tier":"deep"},{"id":"2026-07-25_21","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 두개골 골화성 섬유종의 영상 소견 및 수술·방사선 치료 사례","dek":"6세 Boxer 암컷 개에서 두개골 골화성 섬유종을 진단하고 부분적 수술적 절제 후 VMAT(용적변조방사선치료)를 시행하여 1년 이상 무병 생존을 달성한 사례를 보고합니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.25","read":"2분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70215","body":["본 연구는 6세 Boxer 암컷 개에서 좌측 안와 주위 부종, 비분비물, 코출혈 및 경미한 돌출안을 주소로 내원하여 두개골 골화성 섬유종으로 진단한 단일 사례 보고입니다. 진단을 위해 14개월간 5회의 컴퓨터단층촬영(CT), 초음파유도 바늘흡인, 수술적 생검 및 CT유도 중심생검을 시행하였으며, 좌측 전두골 안와 부위에 경계가 명확한 비석회화 확장 병변이 관찰되었고 후안와 조직 전위와 함께 Lobular 비강종괴가 확인되어 코티 누기 파괴를 동반하였습니다.","CT 추적 검사에서 수술 및 방사선 치료 후 병변의 점진적 석회화가 관찰되었으며, 조직병리학검사에서 좌측 전두골과 비강종괴 양측 모두 골화성 섬유종으로 확인되었습니다. 환자는 부분적 수술적 절제 후 최종 외부-beam VMAT를 시행받았으며, 1년 이상 재발 없이 지속적인 국소 조절을 달성하였습니다.","본 사례는 두개골 골화성 섬유종에서 CT 영상이 비석회화 확장 병변으로 초기 발견되고 치료 후 석회화 진행을 보인다는 점을 제시합니다. 단일 사례이므로 일반화에 한계가 있으나, 한국 동물병원에서 안와 주위 종괴와 코 증상을 보이는 개의 감별 진단 시 두개골 골화성 섬유종을 고려할 필요가 있습니다. 또한 방사선 치료 후 안과적 모니터링과 장기 약물 치료가 필수적입니다."],"blog":"강아지의 얼굴 부종과 코 출혈, 안 돌출 증상이 있다면 두개골 종양까지 의심해볼 수 있으며, 이른 시기의 정밀 영상 검사가 중요합니다.","blogAngle":["6세 Boxer 암컷 개의 좌측 전두골과 비강에서 이소성 골화성 섬유종이 이중 병변으로 발생하였습니다.","14개월간 5회의 CT 추적 검사를 통해 치료 후 병변의 점진적 석회화 소견을 확인하였습니다.","부분적 수술적 절제 후 VMAT를 시행하여 1년 이상 재발 없이 장기 조절에 성공하였습니다.","방사선 치료 후 지속적인 안과 모니터링과 장기 약물 치료가 필요합니다."],"radar":{"owner":null,"clinical":"안와 주위 종괴, 코출혈, 돌출안 증상을 보이는 개의 감별 진단 시 두개골 골화성 섬유종을 고려하고, 필요한 경우 CT 영상의학적 검사를 요청하는 것이 좋습니다.","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례보고여서 일반화에 한계가 있으며, 이는 특정 품종()에서 발생한 드문 사례입니다."}},"tag":"","tier":"deep"},{"id":"2026-07-25_22","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 진행성 치주염에서 특이적으로 증가하는 세균과 엑소솜 치료 가능성","dek":"개의 치주염 진행 단계별 구강 미생물총을 분석한 결과, Parvimonas micra가 중증 치주염에서 특이적으로 증가함을 확인하고 지방유래줄기세포 엑소솜이 이 세균이 유발하는 염증 반응을 완화할 수 있음을 확인했습니다.","source":"Veterinary microbiology","country":"","date":"07.25","read":"2분 읽기","plate":"Veterinary microbiology","image":null,"sourceUrl":"https://doi.org/10.1016/j.vetmic.2026.111078","body":["개의 치주염은 만성 염증성 질환으로 구강 미생물총 불균형과 면역 반응 이상과 관련됩니다.본 연구는 60마리의 개(S0-S4 단계)를 대상으로 치주낭과 치은상(plaque) 표본을 채취하여 16S rRNA 시퀀싱으로 미생물총을 분석하고, 지방유래줄기세포(ADSCs)에서 추출한 엑소솜의 면역 조절 효과를 시험관 내에서 평가했습니다.","알파다양성 분석 결과, 진행성 치주염은 종풍부도 증가와 균등도 변화와 관련되었고, 베타다양성 분석은 군 간 구조적 차이가 있음을 확인했습니다(R²=0.161, P=0.001). Parvimonas micra는 중증 치주염(S4)에서 유의하게 증가했으며, LEfSe,Random Forest, ANOVA 분석에서 일관되게 동정되었습니다(LDA>3.5, P\u003c0.01). 시험관 내에서 P. micra는 개의 대식세포(DH82) 생존율을 감소시키고 전염증 표현형을 촉진했습니다(P\u003c0.05). ADSCs 엑소솜은 대식세포에 내재화되어 전염증 사이토카인(IL-1β, IL-6, iNOS)을 감소시키고 항염증 표지자(Arg-1, CD163, IL-10)를 증가시켰으며, P. micra가 유발한 염증 불균형을 부분적으로 교정했습니다(P\u003c0.05).","한국 동물병원 임상 관점에서, 본 연구는 개의 치주염 진단 및 예후 판단에 P. micra가 생물학적 표지자로 활용될 가능성을 제시합니다. 그러나 표본이 특정 기관에 집중되어 있고 시험관 내 실험으로 한계가 있으며, 임상 적용을 위해서는 동물 실험과 임상 시험이 필요합니다. ADSCs 엑소솜은 개의 치주염에서 숙주 조절 치료제로서의 잠재력을 보이며, 이는 기존의 항생제 중심 치료에서 벗어나 염증 경로 조절을 통한 새로운 치료 전략을 제시합니다."],"blog":"반려견의 잇몸 질환이 의심될 때 특정 세균의 증식을 확인하면 병의 진행 정도를 예측하고, 줄기세포에서 유래된 엑소솜으로 치료할 수 있는 새로운 가능성이 있다는 내용을 보호자에게 소개할 수 있습니다.","blogAngle":["60마리의 개(S0-S4)를 대상으로 한 16S rRNA 분석에서 진행성 치주염(S4)의 구강 미생물총이 종풍부도가 증가하고 군 간 구조적 차이가 확인되었습니다(R²=0.161, P=0.001).","Parvimonas micra가 중증 치주염(S4)에서 유의하게 증가하여(LDA>3.5, P\u003c0.01), 진행성 치주염과 관련된 세균으로 동정되었습니다.","P. micra는 개의 대식세포(DH82) 생존율을 감소시키고 전염증 반응을 촉진했습니다(P\u003c0.05).","ADSCs 엑소솜은 전염증 사이토카인을 감소시키고 항염증 표지자를 증가시켜 P. micra 유발 염증을 부분적으로 완화했습니다(P\u003c0.05)."],"radar":{"owner":{"soon":true,"q":"우리 강아지 치주염이 있어요. 지금 하는 치료 이외에 새로운 치료법은 없나요?","script":"이번 연구에서 발견된 세균은 아직 진단 도구로만 제안된 단계예요. 엑소솜 치료는 시험관 내 실험 단계라서, 임상 적용까지는 아직 시간이 걸릴 거예요. 지금은 정기적인 치과 검진과 일상적인 구강 관리가 가장 중요해요."},"clinical":"개의 중증 치주염 환자에서 P. 검사를 생물학적 표지자로 활용할 가능성을 두고, 기존 치주 치료 프로토콜을 재점검하며 보호자에게 구강 관리 중요성을 안내한다.","evidence":{"design":"전향적 코호트(미생물총 분석) + 시험관 내 실험","n":"개 60마리","stars":2,"note":"단일 기관 연구이고 시험관 내 실험만 수행되어 임상 적용에는 한계가 있으며, 동물 실험과 임상 시험이 추가로 필요합니다."}},"tag":"","tier":"deep"},{"id":"2026-07-25_23","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 각막 손상에 대한 HA 기반 광경화 접착제 적용 사례","dek":"수술이 어려운 개 각막 손상 환자 3마리에 히알루론산 기반 광경화 접착제를 적용한 결과, 모든 사례에서 각막 무결성과 투명성이 유지됨을 확인했습니다.","source":"Veterinary medicine and science","country":"","date":"07.25","read":"1분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71046","body":["본 연구는 심한 각막 손상을 가진 개에서 수술적 치료가 불가능할 때 적용할 수 있는 비수술적 대안 치료법을 평가하기 위해 수행되었습니다. 16세 Pekingese(전망체 탈장), 14세 Malta(당뇨병 동반 각막 천공), 10세 혼종견(50% 공막 침윤 각막 열상) 총 3마리를 대상으로 국부마취와 경미한 진정 후 히알루론산 기반 광경화 접착제를 도포하고 가시광선(405nm, 4.3초)으로 경화시키는 시술을 시행했습니다."," Case 1에서는 9개월간 16회 적용하여 각막 무결성과 투명성을 유지했으며, Case 2에서는 3개월간 5회 적용 후 상피 재형성과 공막 재형성이 관찰되었습니다. Case 3에서는 1회 시술만으로 2주 후 상피 봉합이 완전하게 이루어졌으며, 8주 후 각막 투명도와 시력 기능이 완전히 회복되었습니다.","본 치료법은 수술이 어려운 환자나 수술 위험이 높은 노령개에서 최소 침습적으로 각막 기계적 안정성을 제공할 수 있는 대안이 될 수 있습니다. 그러나 3마리만 참여한 사례군으로, 대상이 매우 제한적이고 장기적 예후에 대한 추가 연구가 필요합니다. 또한 한국 임상 현장에서는 해당 제품의 국내 사용 가능성과 비용-effective 분석이 요구됩니다."],"blog":"노령이거나 전신 질환이 있어 수술이 어려운 개의 각막 손상에서, 짧은 광조사만으로 각막을 봉합할 수 있는 비수술적 대안 치료법을 보호자에게 소개할 수 있는 좋은 소재입니다.","blogAngle":["3마리의 개 각막 손상 환자 모두에서 히알루론산 기반 광경화 접착제가 각막 무결성과 투명성을 유지하는 결과를 보였습니다","Case 1(전망체 탈장)은 9개월간 16회 적용, Case 2(천공)는 3개월간 5회 적용, Case 3(열상)은 1회 적용만으로 치료 효과를 얻었습니다","시술은 국부마취와 경미한 진정 하에 4.3초의 가시광선 조사만으로 완료되어 수술보다 최소 침습적이었습니다","대상이 3마리뿐인 사례군이므로, 더 많은 표본과 장기 추적 관찰을 통한 추가 검증이 필요합니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 각막 손상인데 수술 대신 다른 치료 방법 없나요?","script":"현재 이 치료법은 아직 국내에 도입되지 않았고, 연구에서도 단 3마리만 시도된 단계입니다. 각막 손상 정도와 강아지 상태에 따라 수의사가 수술 여부를 판단하게 되는데, 노령 강아지나 수술 위험이 높은 경우 비수술적 대안도 논의될 수 있습니다."},"clinical":"각막 손상 환자 진료 시 수술 불가능하거나 위험이 높은 경우 HA 기반 광경화 접착제 대안 가능성을 점검하고, 국내 도입 여부를 확인","evidence":{"design":"증례보고","n":"개 3마리","stars":1,"note":"3마리만 참여한 소규모 증례로 일반화에 한계가 있으며, 국내 미도입 제품이라 실 임상 적용 어려움"}},"tag":"","tier":"deep"},{"id":"2026-07-25_24","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 인슐린종 수술 후 영양 치료로 혈당 개선","dek":"췌장 인슐린종으로 인한 지속적인 저혈당에 관한 영양 보충 치료 사례를 보고합니다. 저비용으로 접근 가능한 영양 치료가 개 인슐린종의 보조 치료로 유효함을 확인했습니다.","source":"Research in veterinary science","country":"","date":"07.25","read":"1분 읽기","plate":"Research in veterinary science","image":null,"sourceUrl":"https://doi.org/10.1016/j.rvsc.2026.106186","body":["12세 수컷 라사아프소트가 지속적인 저혈당과 신경학적 증상을 주소로 내원했습니다. 보충 검사 결과 인슐린종이 의심되었으며, 조직병리학 검사로 확정 진단받았습니다. 수술은 순조롭게 완료되었으나 수술 후에도 저혈당이 지속되어 떨림과 쇠약감이 잦게 나타나고, 평균 혈당 농도는 36 mg/dL였습니다.","특수 약물 치료에 대한 접근이 제한되어 당뇨병용 사료에 렌틸, 사이llium, 베타글루칸을 보충한 영양 관리를 실시했습니다. 영양 치료 후 혈당 변동성이 감소하고 저혈당 관련 임상 증상이 사라지며, glucocorticoid 용량이 줄어들었습니다. 평균 혈당 농도는 53 mg/dL로 개선되었습니다.","본 사례는 단일 후향적 사례이지만, 영양 치료가 개 인슐린종의 보조 치료로 저비용이고 접근 가능한 옵션이 될 수 있음을 시사합니다. 다만 표본수가 1마리이므로 추가 연구가 필요합니다."],"blog":"강아지가 저혈당으로 떨림이나 힘이 없다면? 인슐린종 진단을 받았다면 특수 사료와 보충제로 영양 관리를 통한 혈당 조절을 수의사와 상담해 보세요.","blogAngle":["12세 수컷 라사아프소스에서 인슐린종으로 인한 평균 혈당 36 mg/dL의 지속적인 저혈당이 확인되었습니다","당뇨병용 사료에 렌틸, 사이llium, 베타글루칸 보충 영양 치료 후 평균 혈당 53 mg/dL로 개선되었습니다","저혈당 관련 떨림과 쇠약 증상이 사라지고 glucocorticoid 용량이 감소했습니다","영양 치료가 개 인슐린종의 저비용이고 접근 가능한 보조 치료 옵션이 될 수 있습니다"],"radar":{"owner":{"soon":true,"q":"수술했는데도 저혈당이 계속되는데 음식으로 관리할 수 있나요?","script":"영양 치료가 인슐린종 수술 후 저혈당 관리에 보조 방법으로 도움이 될 수 있습니다. 저혈당 증상이 나타나면 즉시 식사를시키거나 포도당 보충제를 주는 것이 중요합니다. 다만 각 동물마다 상황이 다르므로 구체적인 식이 관리는 진료 상황에서 직접 확인해야 합니다."},"clinical":"인슐린종 수술 후 저혈당 관리에서 영양 치료 옵션을 점검하고, 저혈당 증상 발현 시 비상 식이 계획 수립 여부 확인","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례이므로 다른 개에게 일반화하기 어렵고, 특수 약물 접근이 제한된 상황이라는 점을 고려해야 합니다"}},"tag":"","tier":"deep"},{"id":"2026-07-25_25","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 신장 혈관육종에 인한 내장 동정맥류 1례","dek":"고양이에서 종양으로 인한 내장 동정맥류가 처음 보고되었습니다. 이는 비특이적 증상을 보이는 고양이에서 영상 진단의 중요성을 보여줍니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.25","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70217","body":["11세 중성화 수컷 유럽장모고양이가 진행성 체중감소, 다식/다뇨, 무기력증, 재발성 방광염으로 내원했습니다. 복부 초음파에서 우측 신장 실질 내에 굴곡지고 확장된 혈관과 자발적 에코 대비가 관찰되었으며, pulsed-wave 도플러에서 동정맥 교통에 적합한 연속적 흐름과 박동성 성분이 확인되었습니다.","전산단층촬영 혈관조영술에서 현저한 신장 내 혈관 확장, 강한 동맥기 조영증강, 우측 등측 신정맥의 동맥류성 확장과 조기 후대정맥 조영이 확인되었습니다. 사후 조직병리 및 면역조직화학 검사 결과 신장 혈관육종으로 진단되었습니다.","이 질환은 고양이에서 종양에 의해 유발된 내장 동정맥류의 첫 보고례로, 비특이적 전신 증상을 보이는 고양이에서 신장 질환의 감별 진단에 복부 초음파와 도플러 검사의 역할을 강조합니다. 단일 사례 보고이므로 추가 연구가 필요합니다."],"blog":"고양이가 많이 먹고 많이 마시면서 이유 없이 피곤해한다면, 단순 방광염이 아닌 더 심각한 신장 질환이 있을 수 있다는 점을 보호자에게 안내할 수 있습니다","blogAngle":["고양이 신장 혈관육종이 동정맥류를 유발한 최초 보고 사례입니다","도플러 초음파에서 연속적 흐름과 박동성 성분이 동정맥 교통을 확인하는 데 핵심적이었습니다","전산단층촬영에서 조기 정맥 조영이 동정맥류의 특징적인 소견으로 나타났습니다","다식다뇨와 방광염 같은 비특이적 증상으로도 신장 종양이 가능함을 보여줍니다"],"radar":{"owner":null,"clinical":"고양이에서 비특이적 전신 증상(체중감소, 다식/다뇨, 무기력)이 있을 때 신장 질환 가능성을 고려하고, 복부 초음파에서 비정상 혈관 소견이 보이면 도플러 검사를 추가로 시행할 것을 점검","evidence":{"design":"증례보고","n":"고양이 1마리","stars":1,"note":"단일 증례이므로 이 소견을 일반적인 임상 지침으로 직접 적용하기에는 한계가 있습니다"}},"tag":"","tier":"deep"},{"id":"2026-07-25_26","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 경추 정맥총 이상에 따른 만성 통증, 초음파 유도 코르티코스테로이드 주사로 호전","dek":"2세 Greyhound에서 경추 정맥총 확장에 따른 치료하기 어려운 경추 통증에 초음파 유도 신경 주사 코르티코스테로이드를 사용한 사례를 보고합니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.25","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag148","body":["2세 중성화 수컷 Greyhound가 만성 진행성 우측 전지 비대 및 경추 통증으로 내원했습니다. 경추 자기공명영상(MRI)에서 우측 C6 내부 정맥총의 중등도 확장이 확인되었고, 약물 치료 및 물리치료에 반응하지 않았습니다. 재발 MRI에서 C5-T1 내부 척추 정맥총 확장과 방사선통이 동반된 것으로 나타났습니다.","우측 C5-C6, C6-C7, C7-T1에 초음파 유도 피：admin신경 methylprednisolone acetate 주사(1mg/kg 부위당)를 3회 시행한 후 우전지 비대와 경추 불편감이 호전되었고, 이상 반응은 관찰되지 않았습니다.","본 사례는 경추 정맥총 이상에 따른 치료하기 어려운 경추 통증에 대한 새로운 치료 옵션으로 초음파 유도 신경 주사 코르티코스테로이드의 가능성을 보여줍니다. 그러나 단일 사례 보고이므로 다기관 연구를 통한 추가 검증이 필요하며, 한국 동물병원에서는 이 치료법의 적용 가능성과 안전성을 신중히 평가해야 합니다."],"blog":"강아지가 목 통증과 다리절름거림을 보이면서 오래도록 낫지 않는 경우, 척추 정맥총의 문제가 있을 수 있으며 초음파로 정확한 위치에 주사하는 새로운 치료법이 도움될 수 있다는 점을 보호자에게 안내할 수 있습니다.","blogAngle":["2세 Greyhound에서 경추 정맥총 확장(C6→C5-T1)으로 인한 치료하기 어려운 경추 통증 및 전지 대에 초음파 유도 신경 주사 methylprednisolone acetate를 3회 시행했습니다.","C5-C6, C6-C7, C7-T1 각 부위에 1mg/kg methylprednisolone acetate를 주사한 결과 우전지 비대와 경추 불편감이 호전되었습니다.","이상 반응이 없어 치료의 안전성을 확인했으나, 단일 사례이므로 치료 효과의 일반화에 한계가 있습니다.","경추 정맥총 이상에 따른 만성 통증에 대한 약물 치료 및 물리치료에 반응하지 않는 경우 초음파 유도 신경 주사 코르티코스테로이드가 대체 치료 옵션이 될 수 있습니다."],"radar":{"owner":null,"clinical":"경추 정맥총 이상 의심 시 MRI 정확한 영상 진단을 바탕으로 초음파 유도 신경 주사 치료 가능성을 고려하되, 현재로서는 특수한 사례에 대한 연구 결과로 주의 깊게 지켜보는 수준에서 임상 점검을 진행한다.","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 사례 보고이므로 일반화에 주의하고, 추가 다기관 연구가 필요하다"}},"tag":"","tier":"deep"},{"id":"2026-07-25_27","legacySlug":null,"day":"2026-07-25","ts":1784905200000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"말 경추 추간공의 해부학적 특성 규명","dek":"말의 C5/C6와 C6/C7 경추 추간공에 대한 상세 해부학적 분석을 수행하여 경추 추간공확장술을 위한 해부학적 근거를 제시했습니다.","source":"Anatomia, histologia, embryologia","country":"","date":"07.25","read":"1분 읽기","plate":"Anatomia, histologia, embryologia","image":null,"sourceUrl":"https://doi.org/10.1111/ahe.70154","body":["말의 경추 추간공은 척수신경과 혈관이 통과하는 중요한 해부학적 영역으로, 진단 및 수술적 처치의 안전성을 위해 정확한 해부학적 이해가 필수적입니다. 기존 문헌에서 경추 추간공의 해부학적 기술이 부족하다는 문제를 고려하여, 본 연구는 가축말(Equus caballus)의 시체를 대상으로 C5/C6와 C6/C7 추간공에 대한 해부학적 분석을 수행했습니다. 외부 근육에 대한 해부 후 정밀 해부 및 서술을 진행했고, 해부학적 도면을 개발하여 골격, 근육, 신경, 혈관 구조의 공간적 관계를 시각적으로 문서화했습니다.","연구 결과 C5/C6와 C6/C7 추간공의 형태학적 묘사, 구조적 배열, 인접 조직면이 상세하게 제시되었으며, 수술 시 흔히 접하는 골표지에 대한 신경·혈관 구조의 근접성이 규명되었습니다. 이는 경추 추간공확장술과 같은 수술적 개입 시 중요한 해부학적 지표를 제공합니다.","본 연구는 말 경추 추간공 영역에 대한 새로운 해부학적 해석을 제공하며, 임상 및 수술적 처치가 필요한 질환 관리에서 더 안전하고 증거 기반의 임상 관행 확대에 기여할 수 있습니다. 다만 시체 해부 연구의 한계가 있으며, 생체 내 적용 시 추가 검증이 필요합니다."],"blog":"보호자에게는 말의 경추 질환 진단과 수술 시 의사결정에 필요한 해부학적 기초 지식을 이해하도록 돕는 콘텐츠로 활용할 수 있습니다","blogAngle":["C5/C6와 C6/C7 경추 추간공의 형태학적 특징과 구조적 배열을 상세히 기술했습니다","신경·혈관 구조와 골표지 간의 공간적 근접성을 규명하여 수술적 안전성 정보를 제공합니다","경추 추간공확장술을 위한 증거 기반 해부학적 근거를 최초로 제시했습니다","말 경추 추간공의 임상 해부학적 연구가 부족한 부분을 보완했습니다"],"radar":{"owner":null,"clinical":null,"evidence":{"design":"해부학적 연구(시체)","n":"","stars":1,"note":"시체 해부 연구의 한계가 있으며, 생체 내 적용 시 추가 검증이 필요"}},"tag":"","tier":"deep"}],"briefs":[{"id":"2026-07-25_30","legacySlug":null,"day":"2026-07-25","ts":1784855732000,"publishedAt":"2026-07-24T01:15:32.000Z","cat":"brief","kicker":"brief","isToday":false,"title":"온라인 말 이 교육 프로그램 출시","dek":"수의사들을 위한 온라인 교육 플랫폼이 말 이() 수업을 2시에도 제공합니다. Pajamas를 입고 집에서 편하게 지식을 배울 수 있는 기회가 확대되었습니다.","source":"Vet Candy","country":"미국","date":"07.24","read":"1분 읽기","plate":"Vet Candy","image":null,"sourceUrl":"https://www.myvetcandy.com/news/2026/7/23/clelvj2s32lvrnkxd3h6xnyonqfw49","body":["수의사들을 위한 온라인 교육 플랫폼이 말 이() 수업을 2시에도 제공합니다. Pajamas를 입고 집에서 편하게 지식을 배울 수 있는 기회가 확대되었습니다."],"blog":"","blogAngle":[],"radar":null zE4aXE5ZDI0SXQwNjdXeEpDMDZtZFRGNDNSMnlPUWVYZHc3NmxENGtIOXJFLUZYUWlBb3FVakc1TFd2S2J1T2NpRTFlNURWNlJZQVVKRmFPRXV4T0Y2SlhvWjJ2NmszNEpZeWVMTkVqdzFBdU1ocTVodUtDTTA?oc=5","body":["라스베이거스의 한 동물병원에 입에 이상한 물체가 관통된 고양이 새끼가 도착했습니다. 새끼 고양이의 입에서 금속 물체가 발견되었는데, 쉽게 뽑을 수 없는 상황이었답니다. 병원에서는 119에 도움을 요청했고, 화재대원이 도착해 특수 도구로 금속 조각을 안전하게 제거했어요.","새끼 고양이는 무사히 치료를 받고 회복 중이라고 합니다. 입에 물체가 관통되는 경우는 흔하지 않지만, 다행히 빠른 대응으로 새 생명구가 구해졌네요. 진료실 밖에서 보면 이런 일도 있네요."],"blog":"","blogAngle":[],"radar":null,"tag":"충격","tier":"deep"},{"id":"2026-07-25_29","legacySlug":null,"day":"2026-07-25","ts":1782802800000,"publishedAt":"2026-06-30T07:00:00.000Z","cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"애완동물 응급진료비 3천 달러! 주인의 긴급 결단","dek":"사랑하는 강아지를 살리기 위해 주인이 경험한 응급 동물 진료의 현실","source":"New York Post","country":"","date":"06.30","read":"1분 읽기","plate":"New York Post","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMibEFVX3lxTFA4WHVnQzNsdWlQLWNTNEZvNUlaWTZFOXNYZEI4OC1Tdlo3aC12ZEtVMlJDQWxQR0dqYU9ma0pFN205QmFkcWFuMGs0d1BFTTRId2NyOU1MYWpZem9wMTlWRm90UkphejdZaDdmWA?oc=5","body":["사랑하는 강아지가 갑자기 위급해지자, 주인은 막대한 비용을 감수하면서도 응급 동물병원을 찾았습니다. 응급 진료는 보통 일반 진료보다 훨씬 비싸고, 시간 외 진료나 집중 치료가 필요한 경우 수천 달러가 깨질 수 있습니다. 이 주인은 3천 달러를 지출하면서라도 아이를 살리고 싶었습니다.","결국 주인의 사랑이 승리했을까요? 응급 동물 진료는 인간의 응급 진료와 마찬가지로 시간과의 싸움입니다. 진찰비와 검사비, 입원비, 약품비 등이 쌓이면서 순식간에 큰 금액이 됩니다. 진료실 밖에서 보면 이런 일도 있네요, 우리 펫들도 가족이라는 것을 다시 한번 생각하게 됩니다."],"blog":"","blogAngle":[],"radar":null,"tag":"감동","tier":"deep"}],"isHome":true,"recent":[{"id":"2026-07-24_1","legacySlug":null,"day":"2026-07-24","ts":1784806303000,"publishedAt":"2026-07-23T11:31:43.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"소동물 종양 조기 발견, 천자흡인검사가 답이다","dek":"소동물 임상에서 가장 가치 있는 진단 도구 중 하나인 천자흡인검사(FNA)의 기술적 핵심과 활용법에 대한 전문 가이드를 소개합니다. 크기나 모양만으로는 종양의 양성을 판단할 수 없으며, 1개월 이상 지속되는 종괴나 1cm 이상 큰 종괴는 반드시 검사가 필요합니다.","source":"Veterinary Practice News","country":"미국","date":"07.23","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/FNA-aspiration-technique-300.jpg","sourceUrl":"https://www.veterinarypracticenews.com/art-of-aspirate-collection-techniques-slide-preparation-common-mistakes/","body":["천자흡인검사는 빠르고 비용이 적으며 최소침습적인 진단 도구로, 수 분 내에 진단 정보를 제공할 수 있습니다. 특히 수의학에서 초기 종양 발견은 매우 중요한데, 피부 종괴, 림프절 비대, 구강 병변 등이 초기에는 양성으로 보일 수 있지만 조기 세포학적 평가로 염증성 병변이나 악성 종양을 조기에 발견할 수 있습니다. 따라서 ‘모든 종괴는 천자흡인검사한다’는 원칙이 임상에서 강조됩니다.","천자흡인검사에는 음압을 사용하는 흡인법과 모세관 작용을 이용하는 비흡인법 두 가지 기법이 있습니다. 대부분 종괴에는 22게이지 바늘을 사용하며, 혈관이 많은 조직에서는 25게이지 바늘로 혈액 오염을 줄일 수 있습니다. 음압이 너무 강하면 세포 손상과 혈액 오염이 증가하므로, 표피 종괴에서는 더 깨끗한 표본을 제공하는 모세관 기법을 선호하는 수의사들도 있습니다. 검체 수집 후 바로 슬라이드를 건조시키고 95% 메탄올로 2~5분간 고정한 후 염색합니다.","한국 동물병원에서는 1개월 이상 지속되는 종괴나 1cm 이상의 종괴에 대해 Routine하게 천자흡인검사를 실시하는 것이 좋습니다. 검체 준비 시 음압 조절과 슬라이드 spreading 기법에 주의하면 진단 가능한 표본 획득률을 크게 높일 수 있습니다. 세포병리 전문의의 판독이 필요할 수 있으므로, 의심스러운 종괴는 전문 검사기관으로 전송하는 체계적인 흐름을 마련하는 것이 관점입니다."],"blog":"한국 동물병원 블로그에서 ‘반려동물 종괴 발견 시보호자가 알아야 할 점검 사항’ 콘텐츠로 활용할 수 있습니다.","blogAngle":["종괴의 크기와 모양만으로는 양성인지 악성인지 판단할 수 없어서 천자흡인검사가 필수적입니다.","1개월 이상 지속되는 종괴나 1cm 이상 큰 종괴는 반드시 천자흡인검사를 실시해야 합니다.","음압 조절과 바늘 크기 선택이 혈액 오염을 줄이는 핵심 요령입니다.","표면 피부 종괴에서는 모세관 기법이 더 깨끗한 표본을 제공할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지/고양이 몸에 종괴가 있는데, 이것이 종양인지 바로 검사를 받아야 하나요?","script":"1개월 이상 지속되는 종괴나 1 이상 큰 종괴는 천자흡인검사를 해보는 것이 좋습니다. 빠르고 비용이 적으며 최소침습적인 검사라서 추가 검사나 치료 방향을 결정하는 데 도움이 됩니다."},"clinical":"1개월 이상 지속되는 종괴나 1 이상 큰 종괴에 대한 천자흡인검사 프로토콜을 진료 체계에 표준화하고, 의심 종괴는 세포병리 전문 검사기관으로 전송하는 체계적 흐름을 마련한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_2","legacySlug":null,"day":"2026-07-24","ts":1784835660000,"publishedAt":"2026-07-23T19:41:00.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"캔 카운티, 애완동물 광견병 예방접종 효과 저하 가능성 발표","dek":"미국 일리노이주 캔 카운티 당국이 지난 해 동물에게 예방접종한 광견병 백신이 효과를 잃었을 수 있으며 리콜되었다고 발표했습니다. 해당 백신은 운송 과정에서 적절한 온도 관리를 받지 못해 효력이 저하된 것으로 파악되었습니다.","source":"CBS News","country":"","date":"07.24","read":"1분 읽기","plate":"CBS News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQMVNURGEzN2ZzYkFGQ2l6QVB4bjBYajMyQ1NXSU9ENlhuSzBtS1VzU2s1NVRnOWVYQzNXQUh5ZThyNFItTTdPYlI5cGdxU3pBNW1XXy1vanJoR0p5aFJEaHJudmlQSGxCbXlVbk5kdUl6anc0cERoZDdfWmQ5RlRPTmo5OFVHRURIR0ZoUA?oc=5","body":["광견병은 치사율이 100%에 달하는 치명적인 바이러스 질환으로, 동물과 인간 모두에게 치명적입니다. 따라서 대부분의 국가에서 개와 고양이에 대한 광견병 예방접종은 법적 필수 사항입니다. 미국에서는 연간 수백만 건의 광견병 예방접종이 실시되며, 예방접종을 받은 동물의 발병 사례는 극히 드뭅니다.","캔 카운티 당국에 따르면, 지난 해 제공된 일부 광견병 백신 배치가 권장 보관 온도를 충족하지 못한 상태로 운송된 것으로 밝혀졌습니다. 효력이 저하된 백신으로 예방접종한 동물은 광견병에 대한 완전한 보호력을 얻지 못했을 가능성이 있습니다. 당국은 영향을 받은 동물들에게 추가 예방접종을 권장하며, 해당 배치는 이미 회수되었습니다.","한국의 동물병원에서도 냉장 및 온도 관리 체계의 중요성을 다시 한번 확인하는 계기가 됩니다. 국내에서 사용되는 광견병-vaccine 역시 유통 과정에서 온도 관리 실패 시 효력 저하의 위험이 존재합니다. 동물병원에서는 예방접종 시 해당 백 sin의 유통 기류와 보관 상태를 점검하고, 보호자에게 예방접종을 받은 동물이라도 추가 노출 위험이 있음을 안내하는 것이 좋습니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원백신 관리 시스템 소개' 또는 '강아지·고양이 예방접종 후 주의사항'이라는 제목으로 이번 해외 사례를 인용하여 운영하는 것이 좋습니다.","blogAngle":["캔 카운티에서 지난 해 예방접종한 광견병-vaccine이 운송 중 온도 관리 실패로 효력 저하 가능성","영향받은 동물들은 완전한 광견병 보호력을 얻지 못했을 수 있어 추가 예방접종 권장","백신은 이미 회수되었으며 별도의 안전 사고 보고는 아직 없음","동물병원에서는 예방접종백신의 보관 및 유통 관리 철저가 중요"],"radar":{"owner":{"soon":true,"q":"우리 강아지/고양이 예방접종 했는데, 이거 때문에 광견병 방어가 안 되는 건 아닌가요?","script":"광견병 예방접종은 매우 중요합니다. 일반적으로 국내에서 유통되는 백신은 엄격한 온도 관리를 거치므로 문제가 없습니다. 다만, 예방접종 후에도 동물 건강에 이상이 있거나 노출 위험이 있었다면 수의사와 상담해 보세요."},"clinical":"동물병원에서 예방접종 시 해당 백신의 유통 기류와 보관 상태를 점검하고, 보호자에게 예방접종을 받은 동물이라도 추가 노출 위험이 있음을 안내하는 것이 좋습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_3","legacySlug":null,"day":"2026-07-24","ts":1784661355000,"publishedAt":"2026-07-21T19:15:55.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"미국 콜로라도에 고양이 전용 동물병원 개원... 진료 공백 해소 도전","dek":"미국 콜로라도주 Aurora에 고양이 전용 동물병원이 가을에 개원합니다. 약 7600만 마리의 고양이가 미국 가정에서 사육되지만, 2025년 의료를 받은 고양이는 약 3분의 1에 불과해 개(70%)와의 큰 격차가 보고되었습니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-Doctor-Veterinarian-At-Clinic-214965265-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/new-feline-only-organizations-aims-close-gap-veterinary-care/","body":["미국 CATalyst Council의 '2026 State of the Cat Report'에 따르면 고양이 진료 격차의 주요 원인은 동물병원 방문에 대한 스트레스, 고양이 운반용 케이지 운송의 어려움, 치료비에 대한 불확실성 등으로 분석됩니다. 고양이 전용 병원 CatsOnly Veterinary Services는 이러한 장벽을 낮추는 것을 목표로 합니다.","CatsOnly의 Craig Wallace 공동창립자 겸 CEO는 \"고양이 보호자가 관을 다르기 때문에가 아니라 동물병원 진화가 개 중심으로 이루어져 왔다\"고 밝혔습니다. 병원에는 고양이 의학 및 행동 전문가들로 구성된 의료자문위원회가 임상 방향을 이끌며, 첫 번째 병원은 Aurora의 Stanley Marketplace에 개원하고 2027년 초 Denver 지역에 두 번째 병원을 열 계획입니다.","한국 동물병원에게도 시사점이 있습니다. 국내 고양이 사육 비율은 지속적으로 증가하고 있으나, 고양이 주인의 병원 방문 저조는 유사한 패턴을 보입니다. 고양이 진료 특화 공간이나 이동식 진료 서비스 도입 검토가 필요하며, 고양이의 특성을 고려한 환경 조성(예: 냄새 관리, 낮은 소음, 개별 대기 공간)이 경쟁력이 될 수 있습니다."],"blog":"고양이 보호자들의 병원 방문 장벽을 낮추는 서비스 모델(고양이 전용 대기 공간, 이동식 진료, 가격 정보 투명화 등)을 한국 동물병원 블로그에 소개한다면 차별화된 마케팅 자료가 될 수 있습니다.","blogAngle":["미국 가정에는 약 7600만 마리의 고양이가 사육되지만, 2025년 의료를 받은 고양이는 약 33%에 불과합니다.","CatsOnly는 고양이 이동 스트레스, 병원 스트레스, 치료비 불확실성 등 3가지를 주요 장벽으로 인식하고 있습니다.","의료자문위원회에 고양이 전문 수의사 및 전문가들이 참여하여 고양이 관점의 진료 모델을 설계합니다.","한국에서도 고양이 전용 진료 공간이나 서비스 도입이 고객 충성도 확보에 기여할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이도 동물병원 가면 너무 스트레스 엄청 받는데, 병원 환경이 달라진 건 없나요?","script":"고양이 보호자님, 요즘 고양이 전용 공간을 둔 병원이 관심을 받고 있죠. 아직 한국에 본격적인 고양이 전용 병원은 드물지만, 고양이 스트레스를 낮추는 환경(냄새 관리, 조용한 대기 공간 등)을 갖춘 병원을 찾아보시는 것도 방법입니다. 고양이 진료 경험이 많은 병원에 먼저 문의해 보세요."},"clinical":"고양이 환자가 동물병원에서 진료 환경(냄새, 소음, 대기 공간)을 점검하고, 고양이 스트레스를 줄이는 환경 조성 가능성을 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_4","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"염소백시균 불활화 백신, 돼지 살모넬라 choleraesuis 감염 예방 효과","dek":"스페인 연구팀이 돼지에서 살모넬라 choleraesuis에 대한 예방법을 탐구했습니다. 불활화시킨 염소유래 BCG 균주와 전통적 백신을 병용했을 때 세균 배양량이 가장 낮았으며 이질 혈청형에 대한 면역 반응도 개선된 것으로 나타났습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1879508/full","body":["살모넬라 enterica subsp. enterica serovar choleraesuis는 돼지에서 심한 전신 질환을 유발하며 경제적 손실과 인수공통 감염 위험을 초래하는 병원체입니다. 현재 사용되는 백신은 표적 균주뿐 아니라 비표적 균주에 대해서도 보호 효과가 제한적이라는 문제가 있습니다.","연구팀은 훈련면역 개념을 적용하여 불활화시킨 돼지유래 BCG 균주(dpB)와 전통적인 살모넬라 choleraesuis 백신을 함께 투여했을 때의 효과를 확인했습니다. 그 결과, 불활화 dpB를 병용한 그룹에서 분변과 회맹막림프절에서의 살모넬라 검출량이 가장 낮았고, 이질 혈청형에 대한 면역 반응도 개선되는 경향을 보였습니다. 반면 생균 dpB를 투여한 그룹에서는 폐 병변이 가장 심하고 탐식 능력이 가장 낮았으며 사이토카인 균형이 깨지는 모습이 관찰되었습니다.","이 연구는 동물병원에서 Vaccination 전략을 개발할 때 균주의 생존 여부가 치료 효과에 중요한 영향을 미친다는 점을 시사합니다. 특히 불활화 균주를 활용하면 과도한 염증 반응 없이도 넓은 범위의 보호 면역을 얻을 수 있을 것으로 기대됩니다. 한국 중소 돼지 농가에서도 이와 같은 복합 백신 접근법이 살모넬라 감염 관리에 도움이 될 수 있습니다."],"blog":"한국 동물병원에서는 돼지 농가 고객에게 살모넬라 예방을 위한 Vaccination 전략 상담 시 균주의 생존 여부가 보호 효과에 미치는 영향을 함께 설명하는 콘텐츠를 제작할 수 있습니다.","blogAngle":["살모넬라 choleraesuis는 돼지에서 심한 전신 질환을 유발하며 현재 백신의 보호 효과가 제한적입니다.","불활화 dpB와 전통적 백신을 병용한 그룹에서 세균 배양량이 가장 낮았습니다.","생균 dpB를 투여한 그룹은 오히려 폐 병변이 악화되고 면역 균형이 깨지는 부작용을 보였습니다.","불활화 균주를 활용한 훈련면역 접근이 이질 혈청형에도 효과적인 보호를 제공할 수 있습니다."],"radar":{"owner":{"soon":false,"q":"우리 강아지도 살모넬라 예방 주사가 가능한가요?","script":"강아지에서 살모넬라 감염은 드물지 않으며, 주로 환경이나 음식물을 통해 전파됩니다. 현재 강아지 전용 살모넬라 백신은 상용화되어 있지 않지만, 위장관 건강 관리와 위생 관리가 예방에 중요합니다. 구체적인 예방 방법은 진료 시 상담해 드리겠습니다."},"clinical":"개의 및 고양이 대상 살모넬라 예방접종 여부 및 각 동물별 맞춤 예방 관리법 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_5","legacySlug":"2026-07-24_5-개-Taurine-영양학-심장대사질환-예방-위한-최신-지향","day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 타우린 영양학: 심장·대사질환 예방 위한 최신 지향","dek":"타우린이 개의 심장, 신경, 시각, 생식 기관의 기능을 조절하는 핵심 영양소로 재조명되고 있습니다. 특정 품종에서 발생하는 확장형 심근병증과 타우린 결핍의 연관성이 보고되면서 개의 영양 관리에 새로운 패러다임이 제시되고 있습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1812065/full","body":["개의 타우린 대사는 품종, 체구크기, 생리적 상태에 따라 큰 개인차이를 보입니다. 특히 대형견과 중형견은 내인성 합성 능력이 제한적이어서 식이적 보충이 필수적입니다. 연구에 따르면 개의 전혈, 혈장, 혈청 내 타우린 농도는 품종별로 상이하며, 이 차이는 유전적 요인과 식이 구성에 의해 영향을 받습니다.","타우린은 심장 기능 조절에서 핵심적 역할을 하며, 결핍 시 확장형 심근병증(dilated cardiomyopathy) 발생 위험이 증가합니다. 이 외에도 시신경, 중추신경계, 생식기관의 기능 유지 및 지방 대사 조절에 관여합니다. 특히 고령 개, 임신·수유 중인 개, 운동량이 많은 작업견에서는 타우린 요구량이 증가하여 식이 보충이 권장됩니다.","한국 동물병원 실무에서 고려해야 할 점은 개의 품종별 특성과 생활습관에 맞춘 영양 전략의 필요성입니다. 특히 대형견 번식자에게 타우린 보충의 중요성을 안내하고, 심장질환 임상 징후가 있는 개에서 타우린 농도 검사를 고려해야 합니다. 이 논문은 맞춤형 기능성 사료 개발과 예방수의학 관점의 영양 관리 방향을 제시합니다."],"blog":"국내 대형견 사육자 및 번식자를 대상으로 '심장질환 예방을 위한 타우린 영양 관리' 주제로 교육 캠페인 콘텐츠로 활용할 수 있습니다.","blogAngle":["타우린은 개의 조건부 필수 아미노산으로 심장, 신경, 시각, 지방 대사 조절에 관여합니다.","품종과 체구에 따른 타우린 대사 차이로 인해 대형견에서 확장형 심근병증 발생 위험이 높아집니다.","고령 개, 임신·수유 개, 작업견에서는 생리적 요구량 증가로 외인성 보충이 필요합니다.","개의 타우린 영양 관리는 예방수의학과 기능성 사료 전략의 핵심 영역으로 부상하고 있습니다."],"radar":{"owner":{"soon":true,"q":"대형견인데 심장건강을 위해 타우린 보충제를 줘도 될까요?","script":"타우린은 심장 근육 기능에 중요한 영양소이지만, 모든 개에게 무조건 보충이 필요한 건 아닙니다. 특히 대형견은 자체 합성 능력이 부족하여 식이 보충이 권장되기도 하지만, 현재 심장질환이 있는지가 중요합니다. 정확한 것은 심장 초음파와 혈액검사 등 진료를 통해 확인하는 것이 맞아요."},"clinical":"심장질환 임상 징후가 있는 개(특히 대형견)에서 타우린 농도 검사 실시 여부 점검, 대형견 번식 고객에게 예방적 영양 안내 시행","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_6","legacySlug":null,"day":"2026-07-24","ts":1784617200000,"publishedAt":"2026-07-21T07:00:00.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"신대륙 파리유충 미국 확산... 동물병원 경고","dek":"미국 농무부APHIS가 신대륙 파리유충(NWS) 대유행 확산에 따른 긴급 경고를 발령했습니다. 이 기생 파리는 온혈동물의 상처에 알을 낳아 유충이 조직을 파고드는 치명적 질환입니다.","source":"aphis.usda.gov","country":"","date":"07.21","read":"1분 읽기","plate":"aphis.usda.gov","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigAFBVV95cUxNcnp4eEc5X1JGV3llb18xS1hMekV6bXNSWjhDWjhIb2d0ZnlEaExqalh6WTAwMV9xYzJSNFZoeDJFZmdOYmJ2WGt3RXBrbkZKYmc1ckF1aVFBNjRNX2Jpbm0taWRLeGR3MWN1czFiQVg2UXA1ZnhnWWIwTm5sZDFjeA?oc=5","body":["신대륙 파리유충은 파리목(Oestridae)과에 속하는 Cochliomyia hominivorax종의 유충으로, 따뜻한 피부를 가진 포유류의 상처에 기생합니다. 암 파리는 열린 상처에 수백 개의 알을 낳으며, 부화한 유충은 조직을 뚫고 들어가는 특성이 있습니다. 20세기 중반 미국과 중앙아메리카 지역 근절 프로그램의 성과를 이루어내었으나, 최근 Fla주에서 확인되면서 확산 우려가 커지고 있습니다.","최근 Fla주에서 야생 동물의 상처에서 신대륙 파리유충이 검출되면서 농축산 업계에 경고음이 울리고 있습니다. 이 파리는 소, 양, 돼지 등 가축뿐만 아니라 개, 고양이 등 애완동물과 인간에게도 감염될 수 있으며, 치료하지 않을 경우 사망에 이를 수 있습니다. 현재 Fla주 남부 지역을 중심으로 조기 경보가 발령되었으며, 인근 주들은 검역 강화에 나섰습니다.","한국 동물병원에서도 최근 해외 여행 이력이 있는 동물이나 수입 동물을 진료할 때 주의를 기울여야 합니다. 특히 귀, 코, 눈 주위의 상처를 입체적으로 검사하고, 유충 발견 시 원문 참고 수준의 처치와 함께 관련 기관에 보고해야 합니다. 앞으로 중소 동물병원에서도 이 기생충에 대한 인식 제고가 필요합니다."],"blog":"한국 동물병원 블로그에서는 '최근 미국서 대유행한 신대륙 파리유충, 국내에서는?'이라는 제목으로 해외 여행 반려동물의 상처 관리 점검법을 다룬다면 좋은 콘텐츠가 됩니다.","blogAngle":["신대륙 파리유충은 온혈동물의 상처에 기생하여 조직을 파고드는 치명적 기생충입니다.","Fla주에서 야생 동물 감염이 확인되어 미국 전역에 긴급 경보가 발령되었습니다.","감염 시 상처 세척, 유충 제거, 항생제 투여 등 집요한 관리가 필요하며, 원문 참고 수준의 처치가 요구됩니다.","해외 여행 이력이 있는 동물을 진료할 때 이 파리유충 가능성도 고려해야 합니다."],"radar":{"owner":null,"clinical":"수입 동물이나 해외 여행 이력이 있는 동물의 상처 진료 시 신대륙 파리유충 가능성을 고려하고, 특히 귀·코·눈 주위 상처를 주의 깊게 검사하세요.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_7","legacySlug":null,"day":"2026-07-24","ts":1784753879000,"publishedAt":"2026-07-22T20:57:59.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"AAVSB, 미국 수의진료보조 자격시험 개발 담당","dek":"미국 수의사국면허평가위원회(AAVSB)가 수의진료보조(VPA) 자격시험 개발을 맡게 되었습니다. 이는 미국 전역에서 수의진료보조 종사자의 자격 기준을 통일하기 위한 법적 요구에 따른 것입니다.","source":"DVM360","country":"","date":"07.23","read":"1분 읽기","plate":"DVM360","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigwFBVV95cUxOWjJXcjlYU3Y0ajEyVHdaUGlVdm5aZHB5aVhxTzQtRGNCYzNaNjd0ZUlDMTgzeHBBNjMyNGVheWNMRWFWeTBzUC1aNDdId0hZR1VNRDNRLW1maWhEYXhrQTVHTm1sNmctS3J3OVpacHlPQV9WeldwdGRqYWFpUGJ2UVh4VQ?oc=5","body":["미국에서는 주별로 수의진료보조의 면허 요건이 상이하여, 일부 주에서는 별도의 면허나 자격증이 필수인 반면 다른 주에서는 경험만으로 업무를 수행할 수 있었습니다. 이러한 불균형은 종사자들의 이직 장벽이 되고, 소비자 보호 측면에서도 우려가 제기되어왔습니다. 이를 해결하기 위해 전국 단위의 통일된 자격 시험 체계가 필요하게 되었습니다.","AAVSB는 이미 수의사 면허 시험(NBE)을 운영하는 경험이 있는 기관으로, VPA 시험 개발을 통해 수의진료보조 종사자들의 전국 상호 인정 가능성을 모색하고 있습니다. 시험 개발 과정에는 기술표준 설정, 항목 개발, 검증 단계가 포함될 예정이며, 각 주별로 자발적으로 채택할 수 있는 구조로 운영될 것입니다.","한국 동물병원 입장에서는 수의진료보조 인력 양성과 자격 관리 체계에 대한 논의가 필요한 시점입니다. 미국에서 진행 중인 이러한 전국 표준화 노력은 한국에서도 참고할 만한 사안이며, 특히 동물 의료 서비스 품질 보장 측면에서 자격 기준의 중요성이 부각될 수 있습니다."],"blog":"한국 동물병원 블로그에서는 '수의진료보조 자격, 어디까지 체계화해야 하는가'라는 제목으로 미국 사례를 소개하며 한국의 인력 자격 관리 방향을 논의하는 글이 될 수 있습니다.","blogAngle":["AAVSB가 수의진료보조(VPA) 국가 자격시험 개발을 담당하게 되었습니다","미국 내 주별 면허 요건 차이로 인해 전국 상호 인정의 필요성이 대두되었습니다","AAVSB는 기존 수의사 면허 시험 운영 경험을 바탕으로 시험 개발을 진행합니다","한국에서도 수의진료보조 인력의 자격 표준화 논의가 필요할 수 있습니다"],"radar":{"owner":null,"clinical":"한국 동물병원에서도 수의진료보조 인력의 자격 기준과 교육 체계 정립 가능성을 검토할 시점입니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_8","legacySlug":null,"day":"2026-07-24","ts":1784797662000,"publishedAt":"2026-07-23T09:07:42.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"동물병원 진료비 상승 이유와 대처법","dek":"미국 샌안토니오에서 동물병원 진료비가 지속적으로 상승하고 있습니다. 경기 침체에도 동물 의료비가 올라가는 배경에는 어떤 이유가 있을까요.","source":"San Antonio Express-News","country":"","date":"07.23","read":"1분 읽기","plate":"San Antonio Express-News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijgFBVV95cUxNWTFMNV90MXBNYkgzUnV0Mkg4cFN6V1UwdnJla0JpSXI5RU5jZlhWRXhKN1JxTjMwTWJmZ0hiLU5ZYXdMRlpBMHpHa2tzeVVTMS1GQURUa0dkaWdlZHZ4VVI1QjdUVWh4NmhEUVBVT1k0VVR3UDlMdDUwdGhIS01uX2hJdF9OZEJJTUtodEpB?oc=5","body":["최근 미국 동물병원 업계에서는 진료비 상승이 큰 화제입니다. 샌안토니오 지역뿐만 아니라 전국적으로 동물 의료 비용이 증가하고 있으며, 이는 단순한 물가 상승만으로는 설명할 수 없습니다. 동물 의료 기술의 발전과 함께 동물병원 운영에 필요한 다양한 비용이 크게 상승했습니다.","진료비 상승의 주요 원인으로 분석되는 것은 직원 인건비, 약품 및 의료용품 비용, 그리고 시설 유지비입니다. 특히 동물병원 종사자의 최저임금 상승과 수의사 보조 인력 부족으로 인한 급여 경쟁이 비용 상승의 핵심 요인으로 작용합니다. 또한 고급 의료 장비 도입과 최신 치료법 도입으로 초기 투자 비용이 증가했으며, 이는 진료비에 반영되고 있습니다.","한국 동물병원들도 이러한 추세를 참고할 필요가 있습니다. 진료비 상승에 대해 동물 보호자들에게 투명하게 설명하고, 비용 구조를 공유하는 것이 신뢰 구축에 도움이 됩니다. 또한 운영 효율화 방안을 모색하고, 환자 당 진료 시간을 최적화하는 것이 중요합니다. 궁극적으로 진료비 상승을 서비스 품질 향상의 기회로 삼아야 합니다."],"blog":"한국 동물병원 블로그에 '진료비 상승의 진짜 이유와 우리 병원만의 차별화 전략'이라는 제목으로 글을 쓸 수 있습니다","blogAngle":["미국 동물병원에서 직원 인건비와 약품 비용 상승이 진료비 상승의 주요 원인으로 작용하고 있습니다","동물 의료 기술 발전과 고급 장비 투자 비용이 진료비에 반영되고 있습니다","동물병원 보조 인력 부족으로 인한 급여 경쟁이 비용 상승을 가중시키고 있습니다","한국 동물병원들은 진료비 상승에 대해 투명하게 소통하고 운영 효율화를 모색해야 합니다"],"radar":{"owner":{"soon":true,"q":"왜 동물병원 진료비가 이렇게 많이 올라가는 건가요?","script":"진료비 상승에는 직원 인건비, 약품 비용, 최신 장비 도입 등 여러 비용이 영향을 합니다. 그래도 우리는 항상 최선의 진료를 제공하려 노력하고 있습니다."},"clinical":"한국 동물병원에서도 진료비 상승 원인을 보호자에게 투명하게 안내하고, 운영 효율화와 진료 시간 최적화를 점검할 것.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_9","legacySlug":null,"day":"2026-07-24","ts":1784751298000,"publishedAt":"2026-07-22T20:14:58.000Z","cat":"career","kicker":"커리어","isToday":false,"title":"수의병리학 위기, AI 진단 시대 지속 가능한 모델 필요","dek":"수의 임상병리학자들이 급여 압축과 고볼륨 업무 환경으로 인한 번아웃을 경험하고 있습니다. AI 진단 기술이 '있으면 좋은' 진단에서 '필요 없는' 진단으로 변화를 이끌어낼 수 있다는 우려가 제기되고 있습니다.","source":"Dr. Andy Roark","country":"미국","date":"07.23","read":"2분 읽기","plate":"Dr. Andy Roark","image":null,"sourceUrl":"https://drandyroark.com/cry-for-help-from-pathology/","body":["수의 임상병리학 현장은 최근 어두운 상황을 겪고 있습니다. Dr. Eric Fish에 따르면, 임상병리학자들의 급여 압축이 심화되어 전문 병리학자가 신입 가정의학과 수의사보다 적게 버는 현상이 나타나고 있습니다. 또한 실험실 시장 Consolidation으로 가격이 하락하고, 디지털화가 세포검사를 포인트오브케어 고볼륨 workflow로 전환하면서 케이스당 보너스가 8~12달러까지 떨어지는 상황입니다.","병리학자들은 단순한 검사진행자가 아닌 의학적 고문을 제공하는 상담 전문가의 역할을 강조합니다. 그러나 현재 디지털화와 자동화 흐름은 검사를 빠르게 처리하는 '돌아다니며 태우는' 작업으로 전락하고 있으며, 비용과 턴어라운드 시간 압박으로 세포검사의 가치가 점점 떨어지고 있습니다. 이러한 변화로 인해 상담 실험실 의학이 내과 전문의로 이동하고 있는 현실입니다.","한국 동물병원 관점에서 보면, AI 진단 도구가 보편화될 경우 외부 검체 분석 의뢰 구조에 변화가 올 수 있습니다. 그러나 최종 의학적 판단에는 여전히 인간 병리학자의 역할이 필수적이며, AI가 병리학자를 대체하기보다는 증례 분류와 선별 작업을 도와주는 보완 도구로 활용되는 미래가 이상적입니다. 한국의 수의사들도 이러한 기술 변화에 대응하며 전문성의 가치를 인식하고 강화해야 합니다."],"blog":"한국 동물병원에서도 AI 진단 도입 시 전문병리학자의 역할을 어떻게 보존하고 강화할 것인지에 대한 논의가 필요하며, 이는 향후 수의의료 품질 유지를 위한 핵심 과제가 될 것입니다","blogAngle":["수의 임상병리학자들의 급여 압축이 심화되어 전문 병리학자가 신입 수의사보다 적게 버는 현상이 발생하고 있습니다","디지털화와 고볼륨 workflow 전환으로 케이스당 보너스가 8~12달러까지 하락했습니다","AI 기술이 '있으면 좋은' 진단에서 '필요 없는' 진단으로 전환될 가능성에 대한 우려가 제기됩니다","상담병리학의 가치는 검사와 해석의 결합에 있으며, AI는 인간 전문가를 대체하지 않고 보완하는 방향으로 발전해야 합니다"],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_10","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"구제역 바이러스 3D 단백질이 네크로프토시스 유도 — RIPK3 경로 활성화 확인","dek":"중국 간쑤 농업대학교 연구팀이 구제역(FMD)바이러스가 숙주 세포에서 RIPK3/MLKL 경로를 통한 네크로프토시스를 유도한다는 사실을 발견했습니다. 특히 비구조 단백질 3D가 RIPK3와 직접 상호작용하여 이 경로를 활성화하는 것이 확인되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1872229/full","body":["구제역(FMD)은 구제역바이러스(FMDV)에 의해 발생하는 고감염성 전염병으로, 상피세포에서 수포성 병변을 유발할 뿐 아니라 심근과 골격근 조직에서도 증식하여 심근염을 일으키고 감염 동물에서 치명적 결과를 초래할 수 있습니다. RIPK3/MLKL 매개 네크로프토시스는 바이러스 감염에서 중요한 역할을 하는 전염성 세포 사멸 과정입니다.","연구팀은 PK-15 세포와 BHK-21 세포에서 FMDV 감염이 RIPK3/MLKL 경로를 활성화하고 네크로프토시스를 유도하는지 분석했습니다. GSK'872(RIPK3 인산화 저해제)와 NSA(MLKL 인산화 저해제)를 사용한 저해 실험에서 RIPK3 또는 MLKL 인산화를 억제하면 FMDV VP1 발현과 바이러스 역가가 유의하게 감소하였으며, 이는 네크로프토시스 경로가 FMDV 증식을 촉진함을 나타냅니다. 또한 Co-면역침강 분석과 AlphaFold3 구조 예측을 통해 비구조 단백질 3D가 RIPK3의 RHIM 영역과 직접 결합하며, 3D의 R320, H322, E324, Y346 잔류구가 RIPK3의 N466, V469, K471 잔류구와 상호작용함을 확인했습니다.","한국 동물병원 관점에서 이 발견은 구제역의 발병 메커니즘 이해에 새로운 시각을 제공합니다. 네크로프토시스가 바이러스 증식을 촉진한다는 사실은 향후 항바이러스 전략 수립 시 세포 사멸 경로를 표적으로 하는 접근 가능성을 열어줍니다. 또한 구제역은 소, 돼지, 양 등 가축에서 대규모 경제적 손실을 초래하는 질병으로, 이번 연구 결과는 한국 가축 축산업의 질병 관리 및 방제 정책 수립에도 참고가 될 수 있습니다."],"blog":"한국 동물병원 블로그에서는 '가축 질병의 세포 수준 발병 기전' 또는 '구제역 최신 연구 동향' 제목으로 이 내용을 다뤘을 때, 수의학과 학생이나 축산농가에게 전문적이면서도 접근하기 쉬운 콘텐츠가 될 수 있습니다.","blogAngle":["FMDV 감염이 PK-15와 BHK-21 세포에서 RIPK3/MLKL 경로를 활성화하여 네크로프토시스를 유도합니다.","비구조 단백질 3D가 RIPK3와 직접 상호작용하여 네크로프토시스 경로를 활성화하는 핵심 단백질임이 확인되었습니다.","RIPK3 또는 MLKL 인산화를 억제하면 바이러스 VP1 발현과 역가가 감소하여 네크로프토시스가 바이러스 증식을 촉진함을 보여줍니다.","AlphaFold3 예측 결과, 3D 단백질의 R320, H322, E324, Y346 잔류구가 RIPK3의 RHIM 영역과 결합합니다."],"radar":{"owner":null,"clinical":"구제역은 소, 돼지, 양 등 가축 질병이므로 개·고양이 진료 중심 한국 동물병원에 직접적인 임상 적용은 없으나, 연구 동향으로서 주목할만합니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_11","legacySlug":null,"day":"2026-07-24","ts":1784643870000,"publishedAt":"2026-07-21T14:24:30.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"노령 개·고양이 건강 관리, 수의사가 전하는 핵심 팁","dek":"노령 동물들의 건강 관리는 젊은 시절과 다른 접근이 필요합니다. 수의사가 경험에서 우러난 실질적인 관리법을 소개합니다.","source":"Yahoo Creators","country":"","date":"07.21","read":"1분 읽기","plate":"Yahoo Creators","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiyAFBVV95cUxOdmp2MVczcTlZQy1xanZoZzJQWjAwQ1JCbndMekpRSDA1OXo4cnpPVi0tQVR4dDZUSy13YnJfcUM5ZlFyalBUa0duUlhIdHhTMW5yUFVCMU9NX1RDWl9sNzl6VzZ2VGltalZZdjdrWWhpRVFWQ1MtVF8yMkU4cGhjU2FnRm1JZnBfRFlFb1VBbnFHVVUyYkhWdXJuVTdmaUEwcEI4cWJDaHRha080WkV1SW1jZnRwRWkzejVicURHbS1BSFd4cVdLTg?oc=5","body":["노령 동물은 젊은 시절보다 신체 기능이 점차 저하됩니다. 관절염, 치아 질환, 신장 기능 저하 등이 흔하게 나타납니다. 정기적인 건강 검진을 통해 조기 발견과 관리가 중요합니다.","식이 관리도 노령 동물의 건강을 좌우하는 핵심 요소입니다. 연령에 맞는 영양 공급과 체중 관리가 필요합니다. 수분의 섭취량과 배변 상태도 일상적으로 확인하는 것이 좋습니다.","우리 병원에서는 노령 동물들의 삶의 질 향상을 위한 맞춤 관리를 권장합니다. 환경 조정, 적절한 운동, 스트레스 최소화 등이 중요합니다. 보호자분의 세심한 관찰과 수의사와의 정기적인 소통이 건강을 지탱하는 힘이 됩니다."],"blog":"한국 동물병원 블로그에 '노령 동물 진료 경험담'으로 전개하면 읽을만합니다","blogAngle":["노령 동물은 정기적인 건강 검진이 젊은 시절보다 더욱 중요합니다","식이 요법과 영양 관리가 건강 유지의 핵심입니다","일상적인 배변·배뇨 상태 관찰이 질병 발견에 도움이 됩니다","환경 조정과 스트레스 관리가 삶의 질을 향상시킵니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지·고양이 건강 관리에는 어떤 점들을 특히 주의해야 하나요?","script":"노령 동물은 젊은 시절과 달리 신체 기능이 점차 저하되어 관절염, 치아 질환, 신장 기능 저하 등이 흔하게 나타납니다. 정기적인 건강 검진을 통해 조기 발견과 관리가 중요하며, 연령에 맞는 영양 공급과 체중 관리, 수분 섭취량 및 배변 상태 확인도 일상적으로 점검해 주세요."},"clinical":"노령 동물 건강 검진 프로토콜에 관절·치아·신장 기능 검사 항목 확대 적용 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_12","legacySlug":null,"day":"2026-07-24","ts":1784835195000,"publishedAt":"2026-07-23T19:33:15.000Z","cat":"career","kicker":"커리어","isToday":false,"title":"수의대 커뮤니티 메디슨, 지역에서 동물과 사람 만나","dek":"미국 수의대들의 지역사회 의료 프로그램이 가정없거나 저소득 가정의 동물들에게 직접 찾아가는 서비스로 발전하고 있습니다. 이는 동물 건강 접근성 확대와 수의사 인력 확보의 새로운 방향으로 주목받고 있습니다.","source":"American Animal Hospital Association - A…","country":"","date":"07.24","read":"1분 읽기","plate":"American Animal Hospital Association - A…","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi0wFBVV95cUxPcHplcFVEMFJlX3pfeEdrSnZHVjd6eFhTUU9kUWxxNXV5SDlXMHVXWHd0aHhydFBmRElUTFB0djhSSlNacVBQcGlCU1VhNVdRQ2pCUVRueXc2SVM4b05KUHlxMUlIanNSN2NHd2V4a2lTRlV2STFmblpiUnM2S2Jid09VRGJfaFJlWk0zb0lkUE85SVhMREJaRG96WmRPUnd3VnZSOW1nTENXdWVJRHdQRURoaFVLMlBydWpLenp6V2pZQW5FSFFKTUUwTmdnVzlYbXg0?oc=5","body":["미국의 여러 수의대에서는 전통적인 병원 중심 의료에서 벗어나 지역사회로 나가는 Shelter Medicine 및 Community Medicine 프로그램을 강화하고 있습니다. Cornell 대, Colorado State 대, Texas A&M 대 등은 가정없거나 저소득 가정의 동물들에게 무료 또는 저렴한 의료 서비스를 제공하는 프로그램을 운영하며, 동물과 사람의 welfare를 동시에 향상시키는 것을 목표로 하고 있습니다.","이러한 프로그램은 단순한 진료 제공을 넘어 수의대 학생들에게 실제 지역사회에서 복합적인 문제를 다루는 경험을 제공합니다. 학생들은 동물 유기, 주거 불안정, 경제적 궁핍 등 다양한 사회적 요인이 동물 건강에 미치는 영향을 직접 배우게 되며, 이는 졸업 후 다양한 환경에서 일하는 데 필요한 역량을 키우는 데 도움이 됩니다.","한국의 동물병원 입장에서도 시사하는 바가 큽니다. 한국의 경우에도 동물 복지와 함께 발생할 수 있는 사회적인 문제들이 증가하고 있으며, 지역 사회 중심의 의료 서비스 모델에 대한 관심이 높아지고 있습니다. 수의대 교육에서 이러한 접근을 도입하거나 동물병원 차원에서 지역사회 협력 프로그램을 검토하는 것이 미래 방향이 될 수 있습니다."],"blog":"한국 동물병원 블로그에서 '지역 사회 동물 의료의 가능성'이라는 제목으로 한국의 동물 복지 문제와 병원 차원의 지역사회 참여 방안을 논의하는 글로 전개할 수 있습니다.","blogAngle":["미국 주요 수의대들이 지역사회 동물 의료 프로그램을 확대하며 가정없고 저소득 가정의 동물들에게 직접 서비스를 제공하고 있습니다.","학생들이 지역사회에서 복합적인 사회적 문제를 경험하며 실전 역량을 키울 수 있는 교육적 가치를 제공합니다.","프로그램은 동물 건강 증진과 함께 인류의 welfare까지 고려하는 포괄적 접근을 추구합니다.","한국 동물병원에서도 지역사회 협력 모델에 대한 검토와 논의가 필요한 시점입니다."],"radar":{"owner":null,"clinical":"지역사회 기반 동물 의료 서비스 모델에 대한 검토 및 동물 복지 관련 사회적 문제 인식을 진료 현장에 반영할 것","evidence":null},"tag":"","tier":"deep"}],"totalArticles":277}</script>
