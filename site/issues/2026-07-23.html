<h1>베트맨랩 VetManLab 해외 브리핑 — 2026-07-23</h1>

<div>전산 스크리닝을 통해 고양이 심근비대증 치료용 mTOR 억제제 후보 물질 17종을 찾았으며, 특히 dihydro-alpha-ergocryptine이 기존 약물 rapamycin보다 더 높은 결합 친화력을 보였습니다.</div>
<small>최신 연구 · Journal of molecular modeling</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-23_25-개-호중구성-염증성-장염-27례-임상-분석"><b>개 호중구성 염증성 장염 27례 임상 분석</b></a>
<div>호중구성 염증성 장염(NIE) 개 27례를 분석한 결과, 이 질환이 낮은 생존율과 관련되며 말초 호중구증이 불량한 예후 지표일 수 있음을 확인했습니다.</div>
<small>최신 연구 · Journal of veterinary internal medicine</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-23_26-식도-이물이-유발한-개-유미흉-1례"><b>식도 이물이 유발한 개 유미흉 1례</b></a>
<div>식도 이물과 식도 협착을 가진 개에서 유미흉이 발생할 수 있음을 보고하며, 내시경적 이물 제거 후 추적 초음파로 호전되었음을 확인합니다.</div>
<small>최신 연구 · Journal of the American Animal Hospital…</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-23_27-고양이-비종양-CT-소견-악성과-유사한-종양양-성장"><b>고양이 비종양 CT 소견: 악성과 유사한 종양양 성장</b></a>
<div>고양이 비종양은 양성 질환이지만 CT에서 악성 종양과 매우 유사하게 나타나 감별 진단이 어렵다는 점을 확인했습니다.</div>
<small>최신 연구 · Veterinary radiology &amp; ultrasound</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-23_28-MRI-정상인-시바-이누에서-생식-기반-식이로-인한-티아민-결핍-1례"><b>MRI 정상인 시바 이누에서 생식 기반 식이로 인한 티아민 결핍 1례</b></a>
<div>MRI에서 이상 소견이 없었던 시바 이누에서 생선 기반 생식을 원인으로 추정되는 티아민 결핍이 확인되고 식이 교정과 티아민 보충으로 호전되었습니다.</div>
<small>최신 연구 · The Canadian veterinary journal</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-23_29-재발성-요도-폐쇄-수고양이-초기-발병보다-질소혈증-발생-위험-낮아"><b>재발성 요도 폐쇄 수고양이, 초기 발병보다 질소혈증 발생 위험 낮아</b></a>
<div>600마리 이상의 수고양이를 대상으로 한 다기관 연구에서 재발성 요도 폐쇄 발병 시 초기 발병 대비 질소혈증 유병률이 낮았으며, 대다수가 48시간 내 회복되는 것으로 나타났습니다.</div>

<script id="vm-issue" type="application/json">{"date":"2026-07-23","dateLabel":"2026.07.23","dateline":"2026년 7월 23일 · 목요일","editionNo":"2,029","count":29,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"}],"articles":[{"id":"2026-07-23_1","day":"2026-07-23","ts":1784741468000,"cat":"clinical","kicker":"임상","isToday":false,"title":"수의 수술실 효율화, 입체적 배치 전략","dek":"수의학적 수술의 질은 단순한 술기 능숙도뿐 아니라 수술실과 준비공간의 배치에 의해 크게 영향을 받습니다. 고체화량 중성화 진료부터 복합적인 전문 술기까지, 원활한 수술 일정은 환자·보호자·의료팀을 위한 종합적인 준비에서 시작됩니다.","source":"Veterinary Practice News","country":"미국","date":"07.23","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/july-2026-surgical-insights.jpg","sourceUrl":"https://www.veterinarypracticenews.com/space-final-frontier-surgical-efficiency/","body":["수술 전 준비단계는 수술실 입실 전 시작됩니다. 혈액검사, 방사선, 초음파 등 술 전 진단이 완료되어 마취 계획이 세워져 있어야 하며, 정맥 카테터 삽입, 마취 유도, 수술 부위 제모, 초기 소독 및 신경차단 등이 준비공간에서 이루어져야 합니다. 이 공간에는 마감 장비와 환자 보온 장비를 배치하되 불필요한 왕래를 최소화하고, 가능하다면 영상진단실과 가까운 위치가 이상적입니다.","환자를 수술실로 이동시킨 후에는 수술대 위치, 마취 담당자 동선, 조명 각도, 가스 호스 배치 등이 술 효율성을 결정합니다. 연부조직과 정형외과 전담 수술실을 각각 운영하는 것이 가장 이상적이며, 더러운 술기에 전용실을 두면 수술 부위 감염을 줄일 수 있습니다. 천장 트랙 시스템을 활용한 사지 고정, 큰 모니터로 영상 확인, 최소 침습 시술을 위한 카메라와 insufflation 장비 배치 등 시술 종류에 따른 유연한 공간 구성이 필요합니다.","수술 후 회복 공간까지의 동선도 효율의 일부입니다. 수술이 마무리되면 환자는 짧은 거리로 회복 구역으로 이동해야 하며, 이 모든 과정이 깔끔하고 정리된 환경에서 이루어져야 먼지와 교차 오염을 방지하고 소독을 효율적으로 수행할 수 있습니다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원 수술실, 이렇게 개선해보세요’ 시리즈로 실제 레이아웃 사진과 함께 소개하면 읽는이와 흥미 유발에 효과적입니다.","blogAngle":["술 전 진단(혈액검사, 영상검사 등)이 완료된 상태에서 마취 계획을 수립하고 수술실 입실 전 모든 준비를 마쳐야 합니다.","수술실에는 시술 유형에 맞는 전용 공간 확보가 이상적이며, 장비는 닫힌 수납장에 보관하고 명확히 구분된 수급함으로 신속하게 꺼낼 수 있어야 합니다.","마취 담당자는 준비실과 수술실 모두에서 장비에 접근하기 쉬워야 하며, 응급 약물과 reversal agents는 즉시 사용 가능한 곳에 비치해야 합니다.","최소 2명 이상의 인력이 기본이며, 수술 필드 오염 없이 모든 팀원이 역할을 수행할 수 있는 공간 배치가 필수적입니다."],"radar":{"owner":null,"clinical":"자신의 병원 수술실 동선, 장비 배치, 준비공간-수술실-회복실 연결성을 점검하고 개선할 점을 점검하시오.","evidence":null},"tag":""},{"id":"2026-07-23_2","day":"2026-07-23","ts":1784722397000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 만성신장질환, 장내 대사물질 변화와 연관 발견","dek":"네스커 퓨리나 연구팀과 미국 대학 연구자들이 고양이의 만성신장질환(CKD)이 장내 대사물질의 변화와 관련이 있다는 증거를 보고했습니다. 이 발견은 조기 발견과 맞춤형 관리의 새로운 기회를 열어줄 수 있습니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-141993062.jpg","sourceUrl":"https://www.veterinarypracticenews.com/study-links-feline-ckd-to-changes-in-gut-metabolites/","body":["네스커 퓨리나 연구소와 텍사스 A&M 대학, 오하이오 주립대학, 펜실베이니아 대학, 캔zas 주립대학의 연구자들이 공동으로 108마리의 고양이를 대상으로 연구를 수행했습니다. 이 고양이들은 건강한 동물과 다양한 단계의 만성신장질환 고양이들을 포함했습니다. 연구 결과는 시애틀에서 열린 미국수의내과학회 포럼에서 6월 12일에 발표되었습니다.","연구팀은 만성신장질환 고양이들에서 독특한 대사 프로파일이 확인되었으며, 많은 변화가 지방과 관련된 화합물에서 발견되었습니다. 특히 N1-methyl-2-pyridone-5-carboxamide(2PY)가 만성신장질환과 가장 강하게 연관된 분변 표지자로 나타났습니다. 초기 질환 단계에서도 혈청 2PY 수치가 증가했으며, 질환 심각도가 증가할수록 농도가 상승했습니다. 또한 만성신장질환 고양이들은 분지 사슬 지방산 농도도 높게 나타나 장내 미생물 활동의 변화를 시사합니다.","이 연구 결과는 고양이 만성신장질환에서 장-신장 축이 질환 병태생리와 장 대사에서 중요한 역할을 할 수 있음을 강조합니다. 연구 저자 Dr. Jonny Li는 이는 조기 발견과 더 표적화된 관리의 새로운 기회를 열어줄 수 있다고 밝혔습니다. 한국의 동물병원에서는 이 연구 결과를 바탕으로 만성신장질환 고양이들의 장 건강 모니터링 가능성을 고려해 볼 수 있습니다."],"blog":"한국 동물병원 블로그에서는 고양이 만성신장질환의 장 건강 관리의 중요성과 최신 연구 동향을 다루는 콘텐츠로 활용할 수 있습니다.","blogAngle":["108마리의 고양이(정상 고양이 및 다양한 단계의 만성신장질환 고양이)를 대상으로 한 연구에서 장내 대사물질의 변화가 확인되었습니다.","2PY(N1-methyl-2-pyridone-5-carboxamide)가 만성신장질환과 가장 강하게 연관된 분변 표지자로 확인되었으며, 질환 심각도와 농도가 비례합니다.","만성신장질환 고양이들은 분지 사슬 지방산 농도가 높아 장내 미생물 활동의 변화를 나타냅니다.","장-신장 축의 관찰은 고양이 만성신장질환의 조기 발견과 맞춤형 관리에 새로운 기회를 제공할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"고양이 신장병은 분변으로 조기 발견할 수 있다고 들었는데, 실제로 가능한가요?","script":"아직 임상에서 바로 사용 가능한 검사는 아니에요. 하지만 연구에서 분변 표지자 2PY가 초기 CKD 고양이에서도 증가하는 게 확인되었으니, 앞으로 검사로 개발되면 조기 발견에 도움이 될 수 있을 거예요. 현재는 정기적인 혈액·요검사 외에 몸무게 변화나 수분 섭취량 같은 일상 관찰이 중요해요."},"clinical":"CKD 고령묘 진료 시 장 증상(구토, 설사, 식욕 저하) 문진 항목을 추가하고, 장-신장 축 관련 최신 연구문을 주기적으로 검토하여 영양 관리 상담에 반영할 준비를 갖추세요.","evidence":null},"tag":""},{"id":"2026-07-23_3","day":"2026-07-23","ts":1784883294300,"cat":"clinical","kicker":"임상","isToday":false,"title":"개와 고양이 암 영양학의 단백질 권장량 수정","dek":"국제 학술지의 종양 영양학 리뷰에서 개와 고양이의 암 환자 단백질 권장량 표시에 오류가 발견되어 수정되었습니다. 임상 현장에서 영양 처방의 정확성을 위해 수정된 수치를 확인하는 것이 중요합니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.23","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1919852/full","body":["본 기사는 브라질 상파울루대학교 수의학부와 수의영양학 연구센터가 발표한 개의와 고양이 종양 영양학 종합 리뷰의 수정 공고입니다. 원본 기사에서는 단백질과 아미노산 섹션의 특정 단락에서 인용 표시에 오류가 있었으며, 권장량에 관한 참고문헌이 누락되어 있었습니다.","수정된 내용에 따르면, 인간 암 환자의 경우 체중 1kg당 하루 1.2~1.5g의 단백질 섭취가 권장되는데, 이는 건강인 권장량보다 50~87.5% 높은 수치입니다. 개와 고양이 암 환자의 경우 체중 1kg당 하루 1.0~1.2g의 단백질을 하루에 걸쳐 균등하게 섭취하도록 권장하고 있으며, 근육 소모(cachexia)나 근감소증(sarcopenia)이 있는 환동물은 유지 관리 수준의 1.5~2배까지 단백질 섭취를 늘려야 할 수 있습니다.","한국 동물병원 현장에서 종양 환동물의 영양 처방을 진행할 때, 단백질 섭취량 결정은 치료 성과에 중요한 영향을 미칩니다. 특히 진행성 종양으로 인한 근육 손실을 방지하기 위해서는 동물체의 상태를 면밀히 평가한 후 맞춤형 영양 관리가 필요하며, 원문의 구체적 권장량을 참고하여 임상에 적용하는 것이 권장됩니다."],"blog":"한국 동물병원 블로그에서 종양 환동물의 영양 관리 어려움을 겪는 보호자들에게 단백질 섭취의 중요성을 안내하는 콘텐츠로 활용할 수 있습니다","blogAngle":["인간 암 환자의 단백질 권장량은 건강인 대비 50~87.5% 증가한 1.2~1.5g/kg/일입니다","개와 고양이 암 환자의 단백질 권장량은 1.0~1.2g/kg/일이며 하루에 균등 분배가 권장됩니다","근육 소모나 근감소증이 있는 환동물은 유지량의 1.5~2배 단백질이 필요할 수 있습니다","종양 환동물의 영양 처방 시 동물체의 개별 상태에 맞춘 맞춤형 관리가 중요합니다"],"radar":{"owner":{"soon":true,"q":"강아지가 종양 진단받았는데 단백질 얼마나 먹여야 건강한가요?","script":"암 환동물은 근육 손실을 예방하기 위해 평소보다 많은 단백질이 필요하지만, 너무 많이 주어도 신장에 부담을 줄 수 있습니다. 현재 체중 1당 하루 1~1.2g 정도를 참고하되, 반드시 혈액검사 결과와 전반적인 건강 상태를 확인한 뒤 처방해 드려야 합니다."},"clinical":"종양 환동물 영양 처방 시 수정된 단백질 권장량(1.0~1.2g//일) 적용하고, 근육 소모가 현저한 환자에서는 1.5~2배로 조정 가능함을 진료 프로토콜에 반영한다.","evidence":null},"tag":""},{"id":"2026-07-23_4","day":"2026-07-23","ts":1784883293300,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 타우린 대사와 심장건강: 최신 임상 영양학 전망","dek":"타우린은 개에서 조건부 필수 아미노산으로, 심장, 망막, 신경계 등 주요 기관의 기능을 조절합니다. 타우린 결핍은 개의 흔한 심장질환인 확장형 심근병증과 밀접하게 연관되어 임상적으로 중요합니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.23","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1812065/full","body":["반려 및 활동 개에 대한 사회적 관심이 높아짐에 따라 건강 관리와 영양학 연구가 활발해지고 있습니다. 타우린은 비단백질성 아미노산으로 독특한 생물학적 활성을 가지며, 개의 건강 유지를 위한 필수적인 기능적 영양소로 주목받고 있습니다.","본 리뷰는 개에서 타우린의 생합성, 조직 분포, 핵심 생리적 기능을 체계적으로 정리합니다. 특히 심장, 망막, 신경계, 생식 시스템, 지질 대사 등 다양한 기관에서의 조절 기전을 분석하며, 타우린 결핍과 개의 확장형 심근병증 간의 기전적 연관성을 중점적으로 다릅니다. 또한 품종별 유전적 변이, 몸집 크기, 생리적 단계, 식이 조성에 따른 타우린 항상성 영향 요인을 검토합니다.","개체별로 내인성 타우린 합성 능력에 상당한 차이가 있으며, 이는 다양한 조건에서 동적인 생리적 요구량을 충족하기 어렵다는 것을 의미합니다. 따라서 외부 식이 보충이 타우린 항상성을 유지하고 개 건강을 지원하는 핵심 전략으로 자리 잡고 있습니다. 한국 동물병원에서는 특히 확장형 심근병증 위험 집합인 특정 대형 품종에서 타우린 상태 평가가 예방 및 관리에 중요할 것으로 사료됩니다."],"blog":"개 확장형 심근병증 환자를 진료할 때 타우린 결핍 가능성을 반드시 검토하고, 특히 위험 품종에 대해서는 예방적 타우린 보충을 권고하는 콘텐츠를 블로그에 작성해 보세요.","blogAngle":["타우린은 개의 심장, 망막, 신경계, 생식 시스템, 지질 대사에 핵심적인 역할을 합니다.","타우린 결핍은 개의 확장형 심근병증과 밀접하게 연관되어 있으며 기전적 이해가 필요합니다.","품종, 몸집 크기, 생리 단계에 따라 타우린 요구량이 달라져 개별화된 영양 관리가 필요합니다.","대부분의 개에서 내인성 합성만으로는 불충분하여 식이 보충이 권장됩니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 심장 건강을 위해 타우린 보충제가 필요할까요?","script":"타우린은 심장 건강에 중요한 영양소이지만, 모든 개에게 무조건 보충이 필요한 건 아닙니다. 특히 대형 품종이나 심장병 위험이 있는 경우 수의사가 검사를 통해 판단할 수 있습니다. 평소에는 균형 잡힌 사료로 충분한 경우가 많습니다."},"clinical":"대형 품종(도베르만, 복서, 그레이트 데인 등) 진료 시 확장형 심근병증 위험 평가를 위해 타우린 상태 관련 문진을 일상적으로 포함시키는 것을 검토하세요.","evidence":null},"tag":""},{"id":"2026-07-23_5","day":"2026-07-23","ts":1784746255000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수가 진료실 AI 필기 도구, 도입이 필요한 이유","dek":"미국 수의사 Patty Khuly 박사가 수개월간 다양한 AI 수의사 필기 앱을 테스트한 결과를 소개합니다. 진료 기록 작성에 대한 부담을 줄이고 환자 케어에 더 많은 시간을 할애할 수 있는 이 도구의 가치를 설명합니다.","source":"Veterinary Practice News","country":"미국","date":"07.23","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/GettyImages-1423830925.jpg","sourceUrl":"https://www.veterinarypracticenews.com/why-you-need-ai-vet-scribe-asap/","body":["저는 1986년 맥킨토시 컴퓨터를 구매하고 전기차를 가장 먼저 구입한 사람이면서도, 수의 분야 생산성 앱 도입에는 보수적이었습니다. 제가 사용해본 대부분의 수의 생산성 앱은 다루기 어렵고 실제 문제를 해결하지 못해 실망스러운 경험이 있었습니다. 저는 기존 인류 건강관리 기술을 수정하여 우회하는 방법에 만족해 왔습니다.","저는 최근 여러 AI 수의 필기 앱을 테스트하면서 놀라운 성과를 발견했습니다. 이 도구는 진료실에 들어가 녹음을 시작하면 대화 내용을 텍스트로 전환하고 SOAP 노트와 클라이언트 요약문으로 자동 정리합니다. 제가 테스트한 앱들은 수의 전문 용어(BAR, PU/PD 등)를 이해하고 클라이언트에게 설명하는 복잡한 의료 정보를 변환하는 데 능합니다. 스페인어에서 영어로의 번역 기능도 뛰어나며, 제 이중 언어 진료소에 특히 유용합니다.","제가 경험한 가장 큰 단점은 AI 시스템이 여전히 세부 사항을 누락하거나 대화를 오해하거나 가상의 정보를 만들어낼 수 있다는 점입니다. 저는 클라이언트와 환자에게 등을 돌린 채 컴퓨터에 기대어 있는 대신 진료에 집중하고 제때 퇴근하면서도 환자가 받을 자격이 있는 수준의 의료 기록을 유지할 수 있는지 여부가 핵심 질문이라고 강조합니다. 한국 동물병원에서도 진료 효율화와 환자 케어 품질 향상을 위해 이 도구의 도입을 검토할 가치가 있습니다."],"blog":"한국 동물병원 블로그에서는 \"AI 필기 도구로 진료 효율화와 환자 케어 품질 향상시키기\"라는 제목으로, 도입 전 체크리스트와 실제 사용 후기를 공유하는 글을 작성할 수 있습니다.","blogAngle":["AI 수의 필기 도구는 진료실 대화를 실시간으로 텍스트로 변환하여 SOAP 노트와 클라이언트 요약문을 자동 생성합니다.","제가 테스트한 결과, 수의 전문 용어(BAR, PU/PD, Librela, Cytopoint, Cerenia 등)를 정확히 인식하고 클라이언트에게 이해하기 쉬운 언어로 변환합니다.","AI 필기 도구는 완벽하지 않으며, 저는 최종 의료 기록의 모든 단어에 대한 수의사 책임이 중요하다고 강조합니다.","저는 이 도구가 문서화 시간을 줄이고 화면을 보는 시간보다 클라이언트와 환자와 상호작용하는 시간을 늘린다고 결론지었습니다."],"radar":{"owner":{"soon":false,"q":"AI 필기 도구를 도입하면 진료 시간이 줄어들고 더 꼼꼼한 진료를 받을 수 있나요?","script":"AI 도구를 활용하면 진료 기록 작성 시간을 단축하여 진료에 더 집중할 수 있습니다. 다만 생성된 기록은 반드시 의사가 검토하고 보정하므로 안심하셔도 됩니다."},"clinical":"AI가 생성한 SOAP 노트와 클라이언트 요약문을 수의사가 반드시 검토·보정하는 검증 프로토콜을 수립하고 정기적으로 정확도를 점검할 것","evidence":null},"tag":""},{"id":"2026-07-23_6","day":"2026-07-23","ts":1784739614000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"수의사 고객 준수율 높이는 5가지 방법","dek":"동물병원에서 최고의 치료 계획도 고객이 집에서 이행하지 않으면 의미가 없습니다. 전문 매체가 고객 준수를 높이는 구체적인 전략을 제시했습니다.","source":"IVC Journal","country":"미국","date":"07.23","read":"1분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_s7qba9s7qba9s7qb-600x372.png","sourceUrl":"https://ivcjournal.com/5-ways-veterinary-professionals-can-improve-client-compliance/","body":["수의학에서 고객 준수(compliance)는 가장 큰 도전 과제 중 하나입니다. 연구에 따르면 고객은 진료 중 들은 정보의 일부만 기억하며, 많은 사람들이 추천 사항의 이유를 이해하지 못하거나 부담을 느껴 실행하지 못합니다.","첫째, 전문 의학 용어를 피하고 간단한 표현으로 설명해야 합니다. 예를 들어 '경구로 하루 2회 식사와 함께 투약하세요'를 '아침과 저녁 식사와 함께 알약을 하나씩 주세요'로 바꾸는 것입니다. 둘째, 서면 또는 디지털 요약지를 제공하여 집에서 참고할 수 있게 해야 합니다. 셋째, 모든 추천에 대한 '왜'를 설명해야 합니다. 치과 질환이 혈액으로 세균이 전파되어 신장, 간, 심장을 손상시킬 수 있다고 설명하면 고객의 동기가 높아집니다. 넷째, 클리닉을 나가기 전에 후속 예약을 확정하고, 전화나 문자 확인을 통해 중간 점검을 해야 합니다. 다섯째, 비용과 시간을 고려하여 대안 옵션을 제시해야 합니다.","한국 동물병원에서도 같은 원칙이 적용됩니다. 한국 고객들은 치료비와 방문 시간의 제약이 큰 만큼, 개별 상황을 고려한 유연한 조언이 필요합니다. 긍정적 피드백과 지속적인 관계 구축이 장기적인 치료 성과를 높입니다."],"blog":"한국 동물병원 블로그에서 '우리 병원 고객 준수율 높이는 방법'이라는 제목으로 직접 활용할 수 있는 실용적인 콘텐츠입니다","blogAngle":["고객은 진료 중 들은 정보의 일부만 기억하므로 서면 지침 제공이 필수적입니다","추천의 이유('왜')를 설명하면 고객의 동기와 준수율이 높아집니다","후속 예약을 미리 잡으면 실행 책임감이 높아지고 치료 효과를 평가할 수 있습니다","비용과 시간을 고려한 대안 옵션을 제시하면 현실적인 치료 계획이 됩니다"],"radar":{"owner":null,"clinical":"5가지 고객 준수 전략(간단한 용어, 서면 요약, '왜' 설명, 후속 예약 확정, 비용·시간 고려)을 병원 프로세스에 반영하여 팀 교육 및 환자 안내 자료 점검","evidence":null},"tag":""},{"id":"2026-07-23_7","day":"2026-07-23","ts":1784725086000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수의 인력 분석 플랫폼 출시, 리프스태핑 성과 데이터로 확인한다","dek":"미국 샌프란isco 소재 인력 플랫폼 '루(Roo)'가 수의 병원용 분석 도구 'Analytics Center'를 출시했습니다. 이 도구는 리프 인력의 시프트 충족률, 취소율, 생산성 등을 데이터로 시각화하여 병원 경영자들이 합리적인 인력 의사결정을 내릴 수 있도록 지원합니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/Analytics-5-Product-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/new-analytics-platform-bolsters-veterinary-workforce-management/","body":["수의 병원 업계에서는 인력 부족, 예약 수요 변동, 직원 휴가, 시설 용량 문제 등을 해결하기 위해 리프 수의사 및 수의테크니션을 활용하는 경우가 많습니다. 그러나 특히 여러 지점을 운영하는 의료 그룹의 경우, 리프 인력 운용이 업무에 미치는 영향을 평가하기가 어렵다는 문제가 있었습니다.","루의Charlotte Weir 파트너십 부문 부사장에 따르면, 병원들은 수년 동안 리프 전문가들에게 병원 운영을 유지하고 팀의 번아웃을 예방해달 의존했지만, 그 인력 투입이 실제로 원하는 결과를 낳고 있는지 측정할 방법이 없었다고 합니다.Analytics Center는 연간 100개 이상의 리프 시프트를 예약하는 대형 기업 고객들도 데이터가 아닌 직관에 의존해왔던 문제를 해결하며, 시프트 충족률이 낮은 지점이나 취소 활동이 빈번한 곳을 식별하여 일정을 조정하고 자원을 효율적으로 배분할 수 있도록 합니다.","한국의 수의 병원들도 인력 부족과 과로 문제에 직면해 있으며, 리프 인력 활용이 증가하는 추세입니다.Analytics Center 같은 도구가 한국 시장에 직접 출시되지 않았더라도, 자체적으로 시프트 충족률이나 취소율, 생산성 등의 지표를 기록하고 분석하는 시스템을 도입하는 것이 검토될 수 있습니다. 이를 통해 경영진은 인력 배치 계획을 미리 수립하고, 필요한 곳에 리프 자원을 효율적으로 배분하며, 궁극적으로 직원들의 번아웃을 예방하는 데 활용할 수 있습니다."],"blog":"한국 수의 병원 블로그에서는 '우리 병원에도 데이터 기반 인력 관리가 필요한가'라는 제목으로, 인력 부족 문제와 이를 해결하기 위한 데이터 활용 방안을 제시하는 글이 잘 맞을 것입니다.","blogAngle":["루(Roo)가 수의 병원용 분석 플랫폼 'Analytics Center'를 출시했으며, 시프트 충족률과 취소율, 생산성 등의 주요 지표를 제공합니다.","이 도구는 단일 병원부터 최대 수백 개 지점을 운영하는 대형 네트워크까지 다양한 규모에 적용됩니다.","루는 400만 시간 이상의 리프 커버리지를 제공한 경험을 보유하고 있으며, 이를 바탕으로 종합적인 인력 데이터를 분석할 수 있습니다.","분석 결과를 통해 병원 경영진은 인력 배치 계획을 조기에 수립하고, 필요한 곳에 리프 자원을 효율적으로 배분할 수 있습니다."],"radar":{"owner":null,"clinical":"리프 인력 활용 시 시프트 충족률, 취소율, 생산성 지표를 정기적으로 기록하고 분석하여 인력 배치 계획 수립","evidence":null},"tag":""},{"id":"2026-07-23_8","day":"2026-07-23","ts":1784725223000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 고양이 영양 검사, 미량영양소 결핍 확인 가능","dek":"고급 사료나 보충제를 급여해도 실제 미량영양소 수준은 확인하기 어렵습니다. 영양 검사를 통해 비타민 D, B12, 엽산, 마그네슘 등 핵심 영양소 결핍을 조기에 파악하고 증거에 기반한 영양 관리 제안이 가능해졌습니다.","source":"IVC Journal","country":"미국","date":"07.22","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/eating-dog-cat_shutterstock_1433171606-scaled-e1784659951946.jpg","sourceUrl":"https://ivcjournal.com/nutritional-testing-for-dogs-and-cats-ascertain-if-patients-are-getting-the-right-nourishment/","body":["국내외 동물병원에서는 다양한 급이 전략을 채택하고 있으나, 사료 표기나 급이 이력만으로는 실제 영양 상태를 확인하기 어렵다는 문제가 있습니다. 특히 프리미엄 사료를 급여하거나 보충제를 복용하는 경우에도 흡수 장애, 소화기 기능 저하, 만성 질환 등으로 인해 영양 결핍이 발생할 수 있습니다.","핵심 비타민 검사는 비타민 D, 비타민 B12, 엽산, 마그네슘 등 주요 영양소 수준을 평가합니다. 여기에 모발 미네랄 분석을 더하면 혈액 또는 소변 검사에서 포착되지 않는 만성적인 영양 불균형과 노출 históricas을 확인할 수 있어, 장기적인 영양 상태를 종합적으로 파악할 수 있습니다.","영양 검사는 만성 소화기 질환이 있거나 장기간 약물을 복용하는 동물, 프리미엄 사료 급이에도 불구하고 건강 문제 증상이 있는 동물에게 특히 유용합니다. 결핍된 영양소는 장 Microbiome 다양성을 감소시키고 유익한 세균수를 줄이며 장벽 기능과 면역 기능을 약화시킬 수 있어, 영양 검사는 미생물 건강 문제 진단에도 단서를 제공합니다. 한국 동물병원에서는 이 검사를 통해 근거에 기반한 맞춤형 영양 권고안을 제시하고, 보호자에게 식품 선택의 근거를 설명할 수 있어 진료 신뢰도 향상에 도움이 됩니다."],"blog":"한국 동물병원 블로그에서 '사료는 있는데 왜 컨디션이 안 좋은가?'라는 보호자 질문에 영양 검사의 필요성을 설명하는 콘텐츠로 활용할 수 있습니다.","blogAngle":["비타민 D, B12, 엽산, 마그네슘 등 핵심 미량영양소 검사를 통해 흡수 장애나 소화기 질환으로 인한 영양 결핍을 식별할 수 있습니다.","모발 미네랄 분석은 혈액 검사에서 발견되지 않는 만성적인 영양 불균형과 노출 이력을 파악할 수 있어, 장기 영양 상태 평가에 도움이 됩니다.","영양 결핍은 장 Microbiome 다양성 감소, 유익균 감소, 대사산물 생성 저하, 장벽 기능 약화를 유발할 수 있어 소화기 건강 진단의 단서가 됩니다.","프리미엄 사료나 보충제 급이 중에도 실제 영양 상태는 확인되지 않을 수 있어 증거에 기반한 영양 관리가 필요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 프리미엄 사료를 먹는데도 영양 결핍일 수 있나요? 영양 검사가 필요할까요?","script":"네, 사료 표기만으로는 실제로 몸에 흡수된 영양소 양을 확인하기 어렵습니다. 특히 소화기 문제가 있거나 장기간 약물을 복용하는 동물은 영양 결핍이 있을 수 있어서, 혈액검사나 모발분석으로 확인해보는 것이 좋습니다."},"clinical":"영양 검사 프로토콜을 도입하여 만성 소화기 질환 동물이나 장기 약물 복용 환자에게 영양 상태 평가를 권고하고, 검사 결과를 근거로 맞춤형 영양 관리 방안을 제안할 준비를 한다.","evidence":null},"tag":""},{"id":"2026-07-23_9","day":"2026-07-23","ts":1784602139000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개에게 유해한 5가지 음식, 주의가 필요한 이유","dek":"반려동물 주위에서 어떤 인간 음식이 개에게 치명적일 수 있는지 인식하는 것이 중요합니다. MSN은 개에게 독성이 있는 대표적인 5가지 음식을 소개하며, 동물병원 방문 경험이 있는 수의사가 설명한 증상과 응급 처치 방법을 전해줍니다.","source":"MSN","country":"","date":"07.21","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiiwFBVV95cUxNWGVBdk1vUWlkT0psa1VnUUhuTXY5bVlwNmkxQk9sREV2b0c0UG9pTUNmSEJxUGZmOXRwZWJZVllGNE1RXzQzZzA4NVZCT0Y3ZWM3ajVTd3VVNG9lR0w1NDNMeTZNaUVMb3lwNWNMbWlBQmVkNGxvWFhYbkFOZEZBR2ZFSkJ4UGtkVjBV?oc=5","body":["개 주변의 보호자들은 많은 경우 무심코 반려견에게 인간 음식을 주게 됩니다. 그러나 몇 가지 일반적인 음식은 개에게 심각한 건강 문제를 유발할 수 있으며, 경우에 따라 사망에 이를 수도 있습니다. 이는 매일 접할 수 있는 사소한 실수가 큰 사고로 이어질 수 있음을 의미합니다.","가장 위험한 음식으로는 초콜릿, 포도 및 건포도, 양파와 마늘, 자일리톨이 포함됩니다. 초콜릿에는 테오브로민이라는물질이 들어 있어 개에게 구토, 설사, 심한 경우 사망을 유발할 수 있습니다. 포도와 건포도는 개에게 신부전을 일으킬 수 있으며, 양파와 마늘은 용혈성 빈혈을 일으킬 수 있습니다. 자일리톨은 인슐린 과분비를 촉발하여 저혈당과 간 기능 부전을 야기할 수 있습니다. 또한, 마카다미 너트와 알코올 역시 신경학적 증상이나 호흡 곤란을 일으킬 수 있습니다.","개가 유독한 음식을 섭취했다면 즉시 수의사와 상담하는 것이 중요합니다. 증상이 나타나기 전이라도 예방적 처치가 필요할 수 있으며, 섭취량과 시간에 따라 치료 방법이 달라집니다. 한국 동물병원에서는 이러한 응급 상황에 대한 안내와 함께, 보호자들에게 일상적인 식이 관리의 중요성을 교육하는 것이 권장됩니다."],"blog":"한국 동물병원 블로그에서 '반려견 식이 관리의 기초: 동물병원에서 자주 묻는 질문'이라는 제목으로, 고객분들께 실제 응급 사례를 포함하여 교육 콘텐츠로 활용할 수 있습니다","blogAngle":["초콜릿에 함유된 테오브로민은 개에게 구토, 설사, 심장 문제, 사망을 유발할 수 있습니다","포도와 건포도는 개 신장에 치명적인 손상을 줄 수 있는 것으로 알려져 있습니다","양파와 마늘은 개에게 용혈성 빈혈을 일으킬 수 있는 대표적인 재료입니다","자일리톨은 개에서 급격한 인슐린 분비를 촉발하여 저혈당과 간 기능 부전을 초래합니다","개가 유독한 음식을 섭취했다면 즉시 수의사와 상담하여 응급 처치를 받아야 합니다"],"radar":{"owner":{"soon":true,"q":"강아지에게 초콜릿을 조금 줬는데 괜찮을까요?","script":"초콜릿은 개에게 독성이 있는 음식입니다. 초콜릿에 들어있는 테오브로민이라는 성분이 구토, 설사 등을 일으킬 수 있고, 섭취량에 따라 더 심각한 증상이 나타날 수 있습니다. 조금이라도 주셨다면 바로 병원으로 내원해서 진료를 받으시는 것이 좋습니다."},"clinical":"접수 시 유해 음식 섭취 가능성 문진 항목을 확인하고, 보호자에게도 금지 음식 목록을 안내하는 교육 자료를 비치","evidence":null},"tag":""},{"id":"2026-07-23_10","day":"2026-07-23","ts":1784628000000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"비영리단체, 외과 멘토링 센터 개소로 수의사 부족 해결 도전","dek":"미국 텍사스주 달러스에서 비영리단체들이 협력하여 외과 멘토링 센터를 개소했습니다. 심각한 수의사 부족 상황에서 경험 많은 수의사들의 실전 멘토링을 통해 젊은 수의사들의 역량을 강화하려는 시도입니다.","source":"NBC 5 Dallas-Fort Worth","country":"","date":"07.21","read":"1분 읽기","plate":"NBC 5 Dallas-Fort Worth","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMizwFBVV95cUxOOXUwVTFaTzd3Nmp6RzJTYUtOc21FcUtERmtmYkFMa3ZqQWh4TGw2a19xMHNHSmYwR0dpLUJDZ1JZZnVlMTNTQWZfdEVHTkJ rSDBmMTZZN1Q?oc=5","body":["고관절 형성불량은 소형 개와 고양이에서 흔히 발생하는 근골격계 질환입니다. 특히 토이 품종이나 소형 견종, 그리고 고양이에서 발생 빈도가 높으며, 심한 경우 통증과 운동 장애를 유발해 삶의 질이 크게 저하됩니다. 기존에는 시멘트를 이용한 고관절 치환술이 주로 시행되었으나, 소형 동물에서는 뼈 크기가 작아 시멘트 고정 기술에 한계가 있었습니다.","새로운 비시멘트 고관절 치환술은 뼈가 임플란트 표면으로 성장해 자연스럽게 결합하는 원리입니다. 이 방식은 뼈 성장을 통해 장기적인 안정성을 제공하며, 특히 뼈 크기가 작은 소형 동물에서 시멘트 방식보다 장점이 있습니다. NC State 대학은 이 수술을 소형 개와 고양이 환자에게 본격적으로 제공할 계획입니다.","한국 동물병원 관점에서 이 기술은 소형 견종과 고양이의 고관절 질환 치료 옵션을 확대하는 시사점을 제공합니다. 국내에서도 소형 동물의 고관절 질환 발생률이 증가하고 있는 만큼, 비시멘트 기술의 도입 가능성과 임상 적용 방안에 대한 관심이 높아질 것으로 보입니다. 원문의 구체적 수술 기법과 임플란트 종류는 원문을 참고하시기 바랍니다."],"blog":"비시멘트 고관절 치환술이 국내 소형 개·고양이 환자에게 도입된다면, 진료 환경과 치료 선택에 어떤 변화가 있을지 블로그 글로 다루어 볼 만합니다.","blogAngle":["소형 개와 고양이에서 고관절 형성불량은 흔한 질환으로 삶의 질에 큰 영향을 미칩니다","비시멘트 고관절 치환술은 뼈가 성장해 임플란트에 결합하는 장기적으로 안정적인 방식입니다","NC State 대학이 소형 동물에 특화된 이 수술을 본격적으로 제공합니다","한국에서도 소형 동물 고관절 치료 옵션 확대를 위한 논의가 필요할 전망입니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지가 고관절 문제가 있는데 비시멘트 고관절 치환술도 가능해요?","script":"비시멘트 고관절 치환술은 소형 개와 고양이에서 뼈가 자연스럽게 결합해 장기적으로 안정성을 얻는 최신 기술입니다. 아직 국내 도입 초기 단계라서, 고관절 질환이 의심되시면 정밀 검사를 통해 개별 환자에게 맞는 치료 옵션을 상담해 보시는 것이 좋습니다."},"clinical":"고관절 질환 환축 진료 시 비시멘트 고관절 치환술 가능성 여부를 확인하고, 최신 기술 도입 시점에 맞춰 학습 준비","evidence":null},"tag":""},{"id":"2026-07-23_12","day":"2026-07-23","ts":1784634295000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"개 암 진단 후 동물병원 강도 사건... 직원 위협하며 강아지 도난","dek":"미국 플로리다주 타마락의 한 동물병원에서 암 진단을 받은 개의 보호자가 \"개를 죽였다\"고 주장하며 직원들을 위협하고 강아지를 도난가는 사건이 발생했습니다. 동물병원 내 불안정한 보호자 관리와 보안 체계의 중요성이 부각되고 있습니다.","source":"Tamarac Talk","country":"","date":"07.21","read":"2분 읽기","plate":"Tamarac Talk","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMisAFBVV95cUxONWFxUlBWa280d3FvNF96dVJYdEY2MEx0Q19pbTlyLVdUVlpibE9uOUV4Nnk4a1FwNThLdjlOLXJ2cHlRd2hQY2FhQmtTb0lRMlBJd1AxS2NyZ2NwU21rUW5zUnBTTE8tV0hycEg0ZUVRbVY1ODktUTlpYzAtaS1EYTNiQjNSdXFKYzlhZWJfbEkwSXZlVF9maHFGdkxMRG5hcDZCcERLUzBVaE5yckFMVw?oc=5","body":["범인은 Range Master Animal Hospital을 방문하여 자신의 개가 암 진단을 받았다고 주장하며 \"개가 죽었다! 여기 있는 모든 사람을 죽이겠다!\"라고 위협했습니다. deputies에 따르면 범인은 병원 내 강아지를 들고 밖으로 뛰쳐나갔고, 이를 저지하려는 직원들을 위협하며 \"다들 죽을 거다\"라고 또 다시 위협했습니다. 사건 당시 병원 관계자들은 경악하여 즉시 911에 신고했습니다.","조사 결과 범인은 보호자가 아닌 전혀 다른 사람으로 밝혀졌습니다. 그는 자신의 개가 암 진단을 받았다고 거짓 주장하며 동물병원을 찾아왔다고 합니다. sheriff's office는 범인을 체포하기 위해 수배 중이며, 현재까지 도난된 개의 행방은 확인되지 않았습니다. 이러한 폭력 행위는 동물병원 종사자들의 안전을 위협하는 심각한 사건으로 기록되고 있습니다.","이번 사건은 한국 동물병원에도 중요한 시사점을 제공합니다. 보호자나 외부인의 위협에 대비한 비상 대피 절차와 직원 안전 교육이 필요합니다. 또한 암 진단과 같은 충격적인 소식을 전할 때 보호자의 정서적 반응을 예측하고 대응하는 전문적인 매뉴얼을 마련하는 것이 좋습니다. 동물병원 내 CCTV 설치와 보안 체계 강화도 검토할 필요가 있습니다."],"blog":"개의 암 진단 후 보호자의 예기치 않은 폭력적인 반응에 대비한 동물병원 비상 대응 프로토콜을 블로그 글로 작성하면 유용할 것입니다","blogAngle":["미국 플로리다 타마락의 동물병원에서 범인이 암 진단을 핑계로 직원들을 위협하고 강아지를 도난가는 사건이 발생했습니다","범인은 \"개를 죽었다\" \"여기 있는 모든 사람을 죽이겠다\" 등 생명 위협 발언을 하며 병원 관계자들을 놀라게 했습니다","실제 보호자가 아닌 제3자가 범행했으며, 현재 도난된 개의 소재는 확인되지 않고 수배 중입니다","한국 동물병원에서도 불안정한 보호자 대응 매뉴얼과 직원 안전 교육, 보안 체계 강화가 필요합니다"],"radar":{"owner":null,"clinical":"동물병원 비상 대피 절차와 직원 안전 교육 매뉴얼을 점검하고, 충격적인 진단 결과 전달 시 보호자 대응 프로토콜을 점검하거나 마련한다.","evidence":null},"tag":""},{"id":"2026-07-23_13","day":"2026-07-23","ts":1784583790000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 갑상선기능항진증 치료제 세계 최초.generic 출시","dek":"미국 Felixvet이 갑상선기능항진증 치료제 Methimazole 코팅정제를 FDA 승인받아 출시했습니다. 이는 기존 브랜드의 대안으로 비용 절감을 기대할 수 있어 한국 동물병원에도 의미 있는 소식입니다.","source":"Today's Veterinary Business","country":"미국","date":"07.21","read":"1분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/04/TVB-NEWS_Header.jpg","sourceUrl":"https://todaysveterinarybusiness.com/veterinary-news-07202026/","body":["고양이 갑상선기능항진증은 중증도를 불문하고 임상에서 흔히 접하는 내분비 질환입니다. 기존에 사용되던 Methimazole은 효과적인 치료제였지만, 브랜드 약물의 비용이 부담스러웠던 보호자들에게 새로운 선택지를 제공할 수 있게 되었습니다.","이번에 출시된 Felixvet의 Methimazole Coated Tablets는 2.5mg와 5mg 두 가지 용량으로 제공되며, 미국 FDA의 승인을 받은 최초의 범용 의약품(generic)입니다. 이는 치료비 절감과 접근성 향상을 동시에 기대할 수 있습니다.","한국 동물병원 입장에서는 갑상선기능항진증으로 내원하는 고양이 환자에게 처방 옵션이 늘어나게 됩니다. 비용 문제로 치료를 미루던 보호자들에게 보다 경제적인 대안을 제안할 수 있고, 기존 치료에서 부작용이 발생했을 때 대체 약물로 활용할 수 있습니다."],"blog":"고양이 갑상선기능항진증 환자를 진료할 때 비용 부담을 고려해 치료 옵션을 논의하는 블로그 글을 작성하면 좋습니다","blogAngle":["고양이 갑상선기능항진증 치료제 Methimazole의 세계 최초 FDA 승인 범용 의약품이 출시되었습니다","2.5mg와 5mg 두 가지 용량으로 제공되어 개별화된 투약 계획이 가능합니다","브랜드 약물 대비 비용 절감 효과를 기대할 수 있어 경제적 부담을 줄일 수 있습니다","치료 중단이나 미진료로 이어지던 비용 장벽을 낮출 수 있는 기회가 됩니다"],"radar":{"owner":{"soon":true,"q":"선생님, 고양이 갑상선약 새로 나온 거 있다던데 한국에서도 쓸 수 있어요?","script":"네, 최근 미국에서 범용의약품이 출시되었어요. 국내 도입 여부는 아직 확인 중이지만, 도입된다면 치료비 부담을 줄일 수 있어서 좋은 선택지가 될 것 같습니다. 현재는 기존 약물을 사용하고 계시죠, 정기적인 혈액검사 점검이 중요해요."},"clinical":"갑상선기능항진증 고양이에서 투약 시 간 기능과 신장 수치 모니터링을 정기적으로 점검할 것","evidence":null},"tag":""},{"id":"2026-07-23_14","day":"2026-07-23","ts":1784883283300,"cat":"clinical","kicker":"임상","isToday":false,"title":"어린 가축 건강 관리의 새로운 추세: 뽕나무잎 플라보노이드, 항생제 대안으로 부상","dek":"전 세계적으로 어린 가축 사료 내 항생제 사용으로 인한 내성 문제와 환경 오염이 심각해지는 가운데, 뽕나무잎에서 추출한 플라보노이드가 안전한 대안으로 주목받고 있습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.23","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1903941/full","body":["글로벌 축산업과 양식업에서는 어린 가축 사료에 항생제 성장촉진제를 오래 사용해왔으나, 이로 인해 약물 잔류, 세균 내성 획득, 환경 오염 등 공중보건학적 위험이 점차 커지고 있어 항생제 대안 개발이 시급한 상황입니다.","뽕나무잎 플라보노이드(FML)는 천연 폴리페놀 화합물로 강력한 항산화, 항염증, 면역조절, 장 Microbiota 조절, 대사 개선 효과를 보여줍니다. 연구에 따르면 FML은 Nrf2 경로를 활성화하여 산화 손상을 완화하고, NF-κB/TLR4/MAPK 염증 신호전달경로를 억제하며, IRS-1/PI3K/GLUT4와 PPARα 경로를 조절하여 당지와 지방 대사를 최적화합니다. 특히 돼지 새끼, 송아지, 물고기 치어, 육계 등 다양한 어린 가축 모델에서 이주 스트레스 완화, 설사 발생률 감소, 비특이적 면역력 강화 효과가 확인되었습니다.","한국 동물병원 관점에서 보면, 이 연구결과는 companion animal의 영양 보충제 개발과 어린 동물 건강관리에 직접적으로 응용될 수 있습니다. 다만 현재까지의 연구는 주로 식용 동물에 집중되어 있으므로, 반려동물에 대한 임상 적용 시에는 안전성과 용량 설정에 대한 추가 검증이 필요합니다."],"blog":"한국 동물병원 블로그에서는 '반려동물 건강을 위한 천연 항산화제 활용'이라는 관점으로, 뽕나무잎 추출물의 항염증·면역증강 효과를 소개하며 영양 보충제 선택 가이드로 활용할 수 있습니다.","blogAngle":["어린 가축 사료 항생제 사용으로 인한 약물 잔류와 세균 내성 문제가 심각해지고 있습니다.","뽕나무잎 플라보노이드는 항산화, 항염증, 면역조절, 장 건강 개선 등 다양한 생리활성 효과를 나타냅니다.","FML은 Nrf2, NF-κB, IRS-1/PI3K/GLUT4, PPARα 등 핵심 신호경로를 통해 다중 표적을 조절합니다.","돼지 새끼, 송아지, 물고기 치어, 육계에서 이주 스트레스 완화, 설사 감소, 면역력 강화 효과가 보고되었습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지한테 뽕나무잎 추출물 같은 천연 영양 보충제도 효과가 있을까요?","script":"현재까지 연구가 돼지나 송아지 같은 식용 동물에 집중되어 있어서, 강아지나 고양이 같은 반려동물에 대한 직접적인 증거는 아직 부족한 상황입니다. 그런 물질이 면역이나 소화 개선에 도움이 될 수 있다는 연구는 있지만,반려동물에게 안전하고 얼마나 줘야 하는지는 아직 더 검증이 필요합니다. 어린 동물에게 영양제를 주시려면 반드시 수의사와 상담해보시는 게 좋습니다."},"clinical":"영양 보충제 처방 시 ‘천연이 곧 안전을 의미하지는 않는다’는 점을 인식하고, 어린 반려동물에 적용 시 식용 동물 연구 결과를 그대로 확대 해석하지 않도록 주의","evidence":null},"tag":""},{"id":"2026-07-23_15","day":"2026-07-23","ts":1784745240000,"cat":"clinical","kicker":"임상","isToday":false,"title":"새러소타 군 광견병 발생…공중보건 경보 발령","dek":"미국 플로리다 주 새러소타 군에서 광견병 사례가 확인되어 지역 공중보건 당국이 경보음을 냈습니다. 광견병은 치사율 100%의 치명적 질환으로, 동물병원에서 예방접종 의향을 확인하고 보호자에게 안내할 필요가 있습니다.","source":"Your Observer","country":"","date":"07.23","read":"1분 읽기","plate":"Your Observer","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQMHZXTmRCbEVIR051cENoX1hLTWNLeHZodEZSdWlRazF0U2t3cm14dlY0MEV6TGg2dmc2cDAxckp3aDRrbTFRUEZOd0ZsaUpFNHRsaWstX2FaVXJrR3F6QUNLdjg2ajlfR2tmOEZUM3lYWFd2akR0ZXkxdUtfWFlOVjRod3ZOM2lpRkliYw?oc=5","body":["광견병은 라비레스바이러스(Rabies virus)에 의해 발생하는 치명적인 신경계 질환입니다. 대부분의 사례는 박쥐, 너구리, 여우, 스컹크 등 야생동물에서 발견되지만, 인간과 가축, 애완동물에게도 전염될 수 있어 공중보건상 중요한 질환입니다.","새러소타 군 보건당국은 이번 사례를 확인한 후 지역 주민들에게 야생동물과의 접촉을 피하고, 애완동물의 예방접종을 완료할 것을 권고했습니다. 예방접종은 광견병 예방의 가장 효과적인 방법으로, Cornell University College of Veterinary Medicine 등에 따르면 정기적인 예방접종이 강아지와 고양이의 감염 위험을 크게 낮추는 것으로 알려져 있습니다.","한국 동물병원에서도 야외 활동이 증가하는 계절에 맞춰 보호자에게 예방접종 현황을 확인하고 미접종 동물에 대한 상담을 제공하는 것이 좋습니다. 특히 야생동물 접촉 가능성이 있는 동물이나 해외 여행을 계획한 보호자에게는 사전 예방접종 안내가 중요합니다."],"blog":"한국 동물병원 블로그 글감: '우리 강아지·고양이 예방접종 했나요? 광견병 예방의 중요성'","blogAngle":["미국 새러소타 군에서 광견병 사례가 확인되어 공중보건 경보가 발령되었습니다.","광견병은 치사율 100%의 치명적 질환으로, 예방접종이 유일한 효과적인 예방법입니다.","야생동물과의 접촉 피하기와 애완동물 예방접종 완수가 주요 예방 수칙입니다.","한국 동물병원에서도 예방접종 미실시 동물에 대한 보호자 상담이 필요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 광견병 예방접종 아직 안 했는데, 지금 맞춰야 하나요?","script":"최근 예방접종을 안 받으셨다면 맞춰드리는 것이 좋습니다. 야외 활동이 많은 계절이니 예방이 중요하죠. 정확한 일정은 동물 상태를 확인한 후 진료에서 상담해 드리겠습니다."},"clinical":"신규 환자 문진 시 광견병 예방접종력 확인하고 미접종 시 상담 제공","evidence":null},"tag":""},{"id":"2026-07-23_16","day":"2026-07-23","ts":1784759961000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"폴크 카운티, 광견병 확인에 무료 예방접종 및 마이크로칩 시술EVENT 개최","dek":"미국 플로리다주 폴크 카운티에서 광견병 사례가 확인되면서 무료 예방접종 및 마이크로칩 시술 이벤트가 개최됩니다.","source":"Tampa Bay 28","country":"","date":"07.23","read":"1분 읽기","plate":"Tampa Bay 28","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi4wFBVV95cUxQX3F3d2Q1OFVpZWpwcUJPX2FVMlZwaU5HeWRacllyME9WOFkzcFpWLXV6dEp5dld2S0VJRFJHS2dXQmljNzFQS2lhbmlvdGFDUVlGY1cwZlNkN2VjblNoMHJCOVU3QlpQWFBhd0JzYlRjdTY1SjN2LTJEb0t4bnFjVkoySWNBRkd5Qm5FX09BY1NLUWY3QUhHb1UxNXQ3dnVLZ0d6cGM5MFM5TGMyQmNtc29aMnNPRlhvRlVObjVZeEQxU1ExcDlCQXpxRXJINV94bXl5b3U2RGhvMmNaX1V2SVJ2QQ?oc=5","body":["폴크 카운티 보건당국은 최근 발생한 광견병 사례를 확인하고 지역 동물 소유자들의 예방의식을 높이기 위해 무료 예방접종 및 마이크로칩 시술 이벤트를 추진하고 있습니다. 광견병은 치사율이 100%에 달하는 치명적인 바이러스성 질환으로, 동물과 사람 모두에게 전염될 수 있어 공공보건 측면에서 매우 중요한 질환입니다.","이번 이벤트는 오는 5월에 개최될 예정이며, 지역 주민들은 무료로 광견병 예방접종과 함께 마이크로칩 시술을 받을 수 있습니다. 마이크로칩은 동물 등록증으로서 분실 시 소유자를 신속하게 확인하는 데 중요한 역할을 합니다. 보건당국은 특히 야생동물과의 접촉이 빈번한 농촌 지역 주민들의 참여를 촉구했습니다.","한국 동물병원에서도 이러한 사례를 참고할 수 있습니다. 광견병은 국내에서도 여전히 위협적인 질환이며, 특히 최근 야생동물 감염 보고가 증가하는 상황에서 예방접종률 향상이 중요합니다. 동물병원들은 무료 예방접종 이벤트나 주기적인 예방접종 캠페인을 통해 고객들의 예방의식을 높이고, 마이크로칩 등록의 중요성을 안내하는 것이 좋습니다."],"blog":"한국 동물병원 블로그에서 '광견병 예방의 중요성과 마이크로칩 등록의 이점'이라는 주제로 지역 고객들을 위한 예방접종 캠페인을 안내하는 글을 작성해볼 수 있습니다.","blogAngle":["폴크 카운티에서 광견병 사례가 확인되어 무료 예방접종 및 마이크로칩 이벤트가 개최됩니다.","광견병은 치사율 100%의 치명적 질환으로 동물과 사람 모두에게 전염됩니다.","마이크로칩 시술은 동물 분실 시 소유자 확인에 중요한 역할을 합니다.","한국 동물병원에서도 예방접종률 향상과 마이크로칩 등록 안내가 필요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 광견병 예방접종 아직 안 했는데, 지금 맞아도 될까요? 마이크로칩도 등록하고 싶어요.","script":"광견병 예방접종은 매우 중요해요. 강아지의 경우 1차 예방접종 후 추가접종 일정이 있는데, 연령과 건강상태를 확인해서 맞는 시기에 진행하면 됩니다. 마이크로칩은 분실 시 찾는데 큰 도움이 되므로 함께 등록하시는 것을 추천합니다. 정확한 일정은 내원 시 상담해 드리겠습니다."},"clinical":"자원의원에서 광견병 예방접종 일정 준수 여부 및 마이크로칩 등록 상태를 문진 시 확인하고, 미접종/미등록 동물에 대해 예방접종 및 등록 안내","evidence":null},"tag":""},{"id":"2026-07-23_17","day":"2026-07-23","ts":1784735156000,"cat":"clinical","kicker":"임상","isToday":false,"title":"버지니아텍, 인터랙티브 3D 모델로 수의학 교육 확대","dek":"버지니아텍 수의과대학이 인터랙티브 3D 모델을 활용한 새로운 교육 플랫폼을 도입했습니다. 이는 학생들의 해부학적 이해도를 높이고 실습 기회의 한계를 극복하기 위한 혁신적 시도입니다.","source":"Virginia Tech News","country":"","date":"07.23","read":"1분 읽기","plate":"Virginia Tech News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiakFVX3lxTE5RYTQtVTVySjRQUTJRRXlDZGNvc1hDd2ljU2g3bmRWWjVnbkZ4ajRXQnJrcWN3Z3QwTTdTdmFCN1RpZk1lX1ljVlYwVW8wQlRYMGRNMHBxRTlxNUpaTFJBRzA1Zm8zNTVXVXc?oc=5","body":["수의학 교육은 전통적으로 시체 해부나 박제 표본에 의존해왔습니다. 그러나 이러한 방법은 시료의 확보가 어렵고, 반복 학습이 제한적이라는 단점이 있습니다. 버지니아텍은 이러한 전통적 교육 방식의 한계를 극복하기 위해 디지털 기술 기반의 학습 도구를 도입하기 시작했습니다.","새로운 플랫폼은 개, 고양이 등 다양한 동물의 기관을 3D로 재현하여 학생들이 화면상에서 확대, 회전, 분해하며 학습할 수 있게 합니다. 이를 통해 학생들은 실제 시료 없이도 반복적으로 해부학적 구조를 연습할 수 있게 되었습니다. 또한 가상 환경에서 오류를 범해도 안전하며 비용 부담이 없다는 점이 큰 장점으로 평가됩니다.","한국 동물병원 관점에서 보면, 이러한 디지털 교육 도구의 도입은 임상 실습 기회 확대와 교육 품질 향상 측면에서 시사하는 바가 큽니다. 국내 수의과 대학에서도 유사한 디지털 교재 도입을 검토할 수 있으며, 신규 수의사 인력 양성에 이러한 기술이 활용될 가능성이 있습니다. 다만 실제 환자를 대하는 임상 현장의 경험을 완전히 대체하기 위해서는 추가적인 실습 프로그램과의 병행이 필요할 것으로 보입니다."],"blog":"한국 동물병원 블로그에서는 '미래의 수의사는 게임처럼 배우는 시대가 온다'라는 제목으로 디지털 교육 도구의 가능성과 한계에 대해 논의해볼 수 있습니다.","blogAngle":["버지니아텍 수의과대학이 인터랙티브 3D 모델 기반 교육 플랫폼을 도입했습니다.","3D 모델은 학생들이 기관을 확대, 회전, 분해하며 반복 학습할 수 있게 합니다.","가상 환경은 안전하고 비용 효율적이라는 장점이 있습니다.","한국 수의학 교육에도 디지털 교재 도입과 임상 실습 병행이 권장됩니다."],"radar":{"owner":null,"clinical":"향후 채용 시 신입 수의사의 3D 해부학 교육 이수 여부를 확인하고, 해부학적 이해도를 평가 기준으로 고려할 수 있음","evidence":null},"tag":""},{"id":"2026-07-23_18","day":"2026-07-23","ts":1784733389000,"cat":"clinical","kicker":"임상","isToday":false,"title":"MSU 수의사, 아프리카 페인티드 도그 긴급 수술 성공","dek":"미시간주립대학교 수의팀이 동물원에서 발생한 아프리카 페인티드 도그의 긴급 복강 수술을 성공적으로 수행했습니다. 희귀 종의 야생동물 진료에서 전문 의료팀의 역할이 다시 한번 주목받고 있습니다.","source":"Michigan State University","country":"","date":"07.23","read":"1분 읽기","plate":"Michigan State University","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigAFBVV95cUxNSnRGbUFic3lBU19GeTBDZkdEMXVaWnpjTFl2Q2tTMVFqa05xb1ZRX2kzWVdYcDU5b2RuVnpINkdGc0NUWm8xRzRDQzU2aU9xeWxBTmNIMTBBVU1LVWtvekFWc01PcUJCTEc1R1hMLXN0NU1Ea2tVS0ZubnlmYV9SXw?oc=5","body":["아프리카 페인티드 도그(Lycaon pictus)는 야생에서 개체수가 급격히 감소한 멸종위기종입니다. 주로 동아프리카의 건조 초원 지대에 서식하며, 사냥과 서식지 파괴로 인해 전 세계 약 6,600마리만 남아있는 것으로 알려져 있습니다. 동물원에서의 체계적인 보전 번식 프로그램이 이 종의 유지에 중요한 역할을 하고 있습니다.","MSU 수의대학 의료팀은 동물원에서 보호 중인 한 마리의 페인티드 도그가 갑작스러운 건강 악화를 보여 응급 진료를 진행했습니다. 복강 내 장기 조직이 복벽으로 돌출되는 협색 탈장으로 진단되었으며, 긴급 수술이 필요했습니다. 수의외과 전문의들은 복부 정중선 절개를 통해 손상된 장기를 정복하고 복벽을 재건하는 고난도 시술을 성공적으로 완료했습니다. 수술 후 환축은 집중적인 관리 하에 회복 중입니다.","한국 동물병원에서도 다양한 외래 진료와 수술을 통해 야생동물이나 특수 동물 진료 역량을 강화하고 있습니다. 특히 긴급 상황에 대응할 수 있는 중환자실 시설과 전문 외과 장비의 확보가 중요합니다. 이 사례는 동물원 의료진과 대학병원 수의팀 간의 협업 모델이 어떻게 효과적인 진료 결과를 만들어낼 수 있는지 보여주는 좋은 예시입니다."],"blog":"한국 동물병원 블로그에서는 야생동물 응급 진료 체계 구축의 중요성과 전문 수의외과의 역할에 대해 다뤄볼 만한 글감이 됩니다.","blogAngle":["아프리카 페인티드 도그는 전 세계적으로 약 6,600마리만 남은 멸종위기종입니다.","MSU 수의팀은 협색 탈장 진단 후 긴급 복강 수술을 성공적으로 수행했습니다.","야생동물 진료에서는 대학병원 수준의 전문 의료팀과 동물원 의료진 간의 협업이 중요합니다.","한국 동물병원에서도 긴급 진료 체계와 전문 외과 장비 확보가 필요합니다."],"radar":{"owner":null,"clinical":"야생동물 진료는 일반 개·고양이 진료와 다르므로, 동물원 등 특수 환자를 다루는 경우 전문 장비와 협진 체계를 미리 점검해 두는 것이 좋습니다.","evidence":null},"tag":""},{"id":"2026-07-23_19","day":"2026-07-23","ts":1784883278300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 비대성 심근증에서 심혈관 생체표지자의 임상적 유용성: 10년 간 체계적 고찰","dek":"지난 10년간 발표된 연구를 체계적으로 분석한 결과, NT-proBNP와 심근 트로포닌 I가 고양이 비대성 심근증의 진단과 예후 평가에 가장 많이 활용되는 생체표지자임이 확인되었습니다.","source":"Veterinary research communications","country":"","date":"07.23","read":"1분 읽기","plate":"Veterinary research communications","image":null,"sourceUrl":"https://doi.org/10.1007/s11259-026-11408-9","body":["본 체계적 고찰은 2015년 1월부터 2025년 6월까지 PubMed, Scopus, Web of Science에서 발표된 연구를 대상으로 수행되었으며, 단일 검토자가 연구를 선정하고 2명의 검토자가 JBI 도구를 사용하여 편향 위험을 평가했습니다. 초기에 220개의 연구를 검토한 결과 63개 연구가 포함 기준을 충족했으며, 대부분의 연구는 낮은 편향 위험과 높은 방법론적 품질을 보였습니다.","분석된 연구에서 가장 많이 보고된 생체표지자는 N-terminal pro-B-type natriuretic peptide(NT-proBNP)와 심근 트로포닌 I(cTnI)였으며, 이들은 임상 상태, 심초음파 소견, 예후 위험과 밀접하게 연관되어 있었습니다. 또한 심근 재형성과 섬유화와 관련된 분자 및 유전적 표지자를 포함한 새로운 생체표지자들도 임상적 유용성을 보여 추가 연구가 필요합니다.","고양이 비대성 심근증 평가에서 심초음파가 최종 진단의 금표준으로 남아있는 반면, 생체표지자는 보조적 역할을 합니다. 포함된 연구 대부분이 후향적이거나 표본 크기가 제한적이어서 결과 해석에 한계가 있으며, 향후 전향적 대규모 연구가 필요합니다."],"blog":"고양이 비대성 심근증이 의심되는 보호자에게 생체표지자 검사가 심초음파 진단을 어떻게 보완할 수 있는지 설명하는 블로그 글을 작성해 보세요.","blogAngle":["63개 연구 분석 결과, NT-proBNP와 cTnI가 고양이 비대성 심근증에서 가장 많이 연구된 심혈관 생체표지자입니다.","이 생체표지자들은 임상 상태, 심초음파 소견, 예후 위험과 통계적으로 유의한 연관성을 보였습니다.","심근 재형성과 섬유화 관련 분자·유전적 표지자가 새로운 가능성 있는 생체표지자로 주목받고 있습니다.","심초음파가 최종 진단의 금표준이며, 생체표지자는 보조 진단 도구로 활용됩니다."],"radar":{"owner":{"soon":false,"q":"우리 고양이 심장 검사하려는데 NT- 생체표지자 검사도 해야 하나요?","script":"NT-는 심장이 늘어서 스트레스가 걸릴 때 증가하는 호르몬으로, 심부전의 정도를 추정하는 데 도움이 됩니다. 하지만 심초음파가 더 정확한 진단을 내리는 데 필요하므로, 먼저 심초음파를 받으신 후 필요시 생체표지자 검사를 함께 고려해 보시면 됩니다."},"clinical":"고양이 HCM이 의심될 때 NT-와 검사를 보조적으로 고려하되, 심초음파 금표준을 우선시할 것","evidence":{"design":"체계적 문헌고찰","n":"63개 연구","stars":4,"note":"포함된 연구 대부분이 후향적이고 표본 크기가 제한적이어서 일반화에 주의가 필요함"}},"tag":""},{"id":"2026-07-23_20","day":"2026-07-23","ts":1784883277300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 흉부 종양, 호흡에 따라 3차원 위치 변화 관찰","dek":"개의 흉부 종양이 호흡 주기 중 얼마나 움직이는지를 처음 규명하고, 종양 크기와 위치에 따른 움직임 차이를 보고합니다. 이는 방사선 치료 시 정확도를 높이기 위한 개별화 계획의 필요성을 제시합니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.23","read":"2분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70212","body":["본 연구는 개의 흉부 종양이 호흡Cycle에서 어떻게 움직이는지를 평가하기 위해 수행되었습니다. 14마리의 개를 대상으로 inspiratory와 expiratory breath hold를 시행한 흉부 CT를 전향적으로 촬영하고, 각 시상의 종양 부피(GTV)와 정상 조직을 delineation한 후 3차원적 위치 변화를 분석했습니다.","주요 결과로서, 작은 종양이 큰 종양보다 dorsoventral 방향(p=0.047, rs=-0.44)과 craniocaudal 방향(p=0.008, rs=-0.56)으로 더 많이 움직였습니다. 다발성 종양을 가진 개는 단일 종양 개보다 두 방향 모두 더 큰 움직임을 보였습니다(p=0.035, p=0.022). 후방 종양은 전방 종양보다 3차원 움직임(p\u003c0.001)과 craniocaudal 움직임(p\u003c0.001)이 유의하게 컸습니다.","한국 동물병원에서 종양 방사선 치료를 계획할 때, 종양의 위치와 크기에 따라 움직임 범위가 다르다는 점이 중요합니다. 후방 종양이나 작은 종양에서는 더 큰 motion margin이 필요할 수 있으며, 이는 치료 계획 시 고려해야 할 요소입니다. 단, 14마리라는 표본 수가 작고 단일 기관 연구이므로 결과의 일반화에 한계가 있음을 인식해야 합니다."],"blog":"반려견의 흉부 종양에 방사선 치료를 받으신다면, 종양이 얼마나 움직이는지가 치료 정확도에 영향을 미치므로 담당 수의사와 종양 위치에 따른 운동 범위에 대해 논의해 보세요","blogAngle":["개의 흉부 종양은 호흡에 따라 3차원적으로 움직이며, 그 범위는 종양 특성에 따라 크게 달라집니다","작은 종양이 큰 종양보다 dorsoventral 방향으로 평균 약 0.44배, craniocaudal 방향으로 평균 약 0.56배 더 많이 움직였습니다","다발성 종양 개는 단일 종양 개보다 유의하게 큰 움직임을 보여 번호가 2개 이상일 때 주의가 필요합니다","후방 종양은 전방 종양보다 3차원 움직임이 유의하게 크며(p\u003c0.001), 치료 계획 시 더 큰 safety margin을 확보해야 합니다"],"radar":{"owner":null,"clinical":"개의 흉부 종양 방사선 치료 시 종양 크기와 위치에 따른 종양 움직임 범위를 고려하여 모션 마진을 개별화된 치료 계획에 반영할 것","evidence":{"design":"전향적 CT 연구","n":"개 14마리","stars":2,"note":"단일 기관·소표본(14마리) 연구로 결과의 일반화에 주의가 필요함"}},"tag":""},{"id":"2026-07-23_21","day":"2026-07-23","ts":1784883276300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개에서 단두증과 수면호흡장애, 염증 반응의 연관성 규명","dek":"단두증 개에서 수면호흡장애와 전신성 염증 표지자 증가가 연관되어 있음을 확인하며, 이 발견이 단두증종의 복지를 향상시키는 데 기여할 수 있습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.23","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag126","body":["수면은 모든 동물에게 근본적인 welfare 요소이며, 수면 분절화는 건강에 해롭습니다. 단두증은 상기도 연부조직 용적 감소 없이 두개와 주둥이가 심하게 짧아진 상태로, 수면호흡장애(SDB)를 포함한 많은 복지 문제를 야기합니다. 이 연구는 단두증 개와 비단두증 대조군을 대상으로 수면호흡장애의 위험 인자와 전신 염증 표지자(TNF-α, IL-6, CRP) 수준을 비교 분석했습니다.","연구 결과, 단두증 군에서 수면호흡장애 유병률이 유의하게 높았으며, 중등도에서 중증의 단두폐쇄성기도증후군(BOAS) 증상과 과체중이 주요 위험 인자로 확인되었습니다. 또한 수면호흡장애가 있는 개에서 전신염증 표지자 수치가 대조군 대비 증가되어 있으며, 이러한 만성 저등급 염증이 사망률 상승과 관련됩니다.","한국 동물병원 임상 관점에서, 이 연구는 단두증 종(불독, 프랑스 불독, 페키니즈 등)의 수면 호흡 상태 평가의 중요성을 강조합니다. 그러나 단일 기관 연구로 표본 수가 제한적이므로, 대규모 전향적 연구가 필요합니다. 수면호흡장애는 수술적 및 보존적 치료로 일부 치료 가능하므로, 보호자에게 수면 문제에 대한 인식 제고가 중요합니다."],"blog":"단두증 친구의 코 고는 소리, 숨쉬기 어려워하는 증상에 주의하세요. 이는 단순한 수면 문제가 아니라 전신 염증과 건강에 영향을 줄 수 있는 수면호흡장애일 수 있습니다.","blogAngle":["단두증 개에서 수면호흡장애 유병률이 비단두증 대조군보다 유의하게 높았습니다","중등도~중증 BOAS 증상과 과체중이 수면호흡장애의 주요 위험 인자로 확인되었습니다","수면호흡장애가 있는 개에서 TNF-α, IL-6, CRP 등 전신염증 표지자가 증가했습니다","수면호흡장애로 인한 간헐적 저산소증이 만성 저등급 염증과 연관되어 있습니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지가 잘 자는지 모르겠는데, 단두증이라 수면호흡장애가 있을까요?","script":"단두증 종은 해부학적으로 기도가 좁아 수면호흡장애가 잘 생깁니다. 하지만 수면 상태만으로 바로 진단하기는 어려워서, 호흡음 검사나 필요시 전문 검사가 필요합니다. 평소 잘 코고는 자는지, 수면 중 숨이 멈추는 경우는 없는지 확인해 보세요."},"clinical":"단두증 종(불독, 프랑스 불독, 페키니즈 등) 진료 시 수면 상태 문진 항목을 정기적으로 확인하고, 필요시 호흡기 전문 검사를 고려한다.","evidence":{"design":"후향적 코호트","n":"개 142마리","stars":3,"note":"단일 기관 후향적 연구로 일반화에 주의가 필요하며, 대규모 전향적 연구가 필요하다."}},"tag":""},{"id":"2026-07-23_22","day":"2026-07-23","ts":1784883275300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 폐초음파 B-선 탐지를 위한 딥러닝 모델의 검증","dek":"인간 폐초음파 이미지로 학습된 딥러닝 모델이 개 폐초음파에서도 87%의 정확도와 93%의 특이도를 달성했습니다. 종 간 일반화가 가능함을 입증하여 수의학 진단 혁신에 기여합니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.23","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag152","body":["본 연구는 인간 폐초음파 이미지로 사전 학습된 딥러닝 모델(B-line 탐지 알고리즘, BLDA)을 개 이미지에 적용하여 성능을 평가했습니다. 총 90마리의 개에서 수행된 201건의 폐초음파 검사로부터 1,950개의 동영상을 수집했으며, 전문가 검토자가 A-선 또는 B-선 프로파일을 레이블링했습니다.","테스트 세트에서 BLDA는 전체 정확도 87%, 민감도 73%, 특이도 93%를 나타냈습니다. 특히 강한 B-선 프로파일(약한 B-선보다)에서 더 우수한 성능을 보였으며, 원시 모델 예측의 제로샷 성능은 AUC 0.96으로 excellent했습니다. 히트맵 분석은 모델이 폐초음파 판독에 타당한 영역을 활용함을 확인했습니다.","본 연구는 인간 데이터로 훈련된 모델이 개에서도 유효한 성능을 유지함을 보여줍니다. 다만, 표본이 90마리로 제한적이고 4개 연구에서 수집된 점이 한계로 작용합니다. 향후 더 많은 개 코호트로 검증이 필요하지만, 종 간 일반화를 통해 수의학 진단 도구 개발 시간을 단축할 수 있는 가능성을 확인한 연구입니다."],"blog":"강아지가 기침을 하거나 호흡이 힘들어 폐초음파를 받아야 할 때, 인공지능이 이를 빠르게 분석하여 수의사의 진단을 도울 수 있다는 최신 연구입니다.","blogAngle":["총 90마리 개 201건의 폐초음파에서 1,950개 동영상을 분석했습니다","딥러닝 모델은 전체 정확도 87%, 민감도 73%, 특이도 93%를 달성했습니다","강한 B-선 프로파일에서 더 우수한 성능을 보였으며 제로샷 AUC는 0.96이었습니다","인간 데이터로 학습된 모델이 종 간 일반화 가능함을 입증했습니다"],"radar":{"owner":{"soon":false,"q":"선생님, 우리 강아지 폐 초음파 검사할 때 AI 모델도 활용하세요?","script":"현재는 연구 단계입니다. 아직 임상 적용은 안 되지만, 앞으로 도움이 될 수 있을 것 같습니다."},"clinical":"AI 기반 폐초음파 판독 도구 도입 가능성을 지속적으로 주시하되, 현재로는 기존 프로토콜 유지","evidence":{"design":"후향적 검증 연구","n":"개 90마리 (검사 201건, 동영상 1,950개)","stars":2,"note":"90마리라는 제한된 표본에서 수집된 연구이므로, 향후 더 큰 규모의 종단 연구가 필요함"}},"tag":""},{"id":"2026-07-23_23","day":"2026-07-23","ts":1784883274300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"반려동물 뇌장 건강.axis: 미생물군 기반 신경·행동장애 치료 전략","dek":"이 검토 논문은 뇌장.axis의 신경전달 기전과 함께 개·고양이의 종특이적 미생물군 특성을 분석하고, 정신생물제와 변이이식술 등 신규 치료 전략의 임상 적용 가능성을 평가합니다.","source":"Veterinary medicine and science","country":"","date":"07.23","read":"2분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71105","body":["뇌장.axis는 신경·내분비·면역·대사 경로를 통해 장내 미생물군과 중추신경계가 쌍방향 소통을 하는 체계로, Veterinary neuropharmacology에서 새로운 패러다임으로 부상하고 있습니다. 본 연구는 2011년부터 2026년 3월까지 PubMed, Google Scholar, Scopus 데이터베이스를 활용하여 서술적 검토를 수행하였으며, 불안·공격성·인지기능장애·뇌전증 등 다양한 신경·행동장애를 대상으로 종특이적 약물 개발 전략을 탐구했습니다.","현재까지 Bifidobacterium longum BL999와 Lactiplantibacillus plantarum PS128 등 특정 균주에서 유망한 결과가 보고되었으나, 미생물군 연구의 방법론적 한계와 상관관계에 그치는 증거 predominance가 주요 문제점으로 지적되었습니다. 표준화된 진단 도구의 부재와 함께 종단적 대규모 임상시험의 필요성이 강조되었습니다.","한국 동물병원 임상의 관점에서 보면, 본 연구는 미생물군 기반 치료제가 기존의 행동치료나 약물요법으로 효과가 미흡한 경우 보완 치료제로 활용될 수 있는 가능성을 제시합니다. 다만 현재 증거가 주로 상관관계에 근거하고 있어 인과관계 입증 전에는 신중한 적용이 필요하며, 종특이적이고 개인화된 치료 프로토콜 개발을 위한 추가 연구가 요구됩니다."],"blog":"반려동물의 불안이나 공격성 행동이 기존 치료로 잘 조절되지 않는 경우, 장 건강을 개선하는 보충제가 행동 개선에 도움을 줄 수 있다는 최신 연구 결과를 보호자에게 안내할 수 있습니다.","blogAngle":["뇌장.axis는 신경, 내분비, 면역, 대사 경로를 통해 장내 미생물군과 중추신경계가 쌍방향 소통을 하는 복잡한 체계입니다.","Bifidobacterium longum BL999와 Lactiplantibacillus plantarum PS128 등 특정 정신생물제 균주에서 불안, 공포, 공격성 감소 효과가 보고되었습니다.","현재 미생물군 연구의 주요 한계로는 표본 크기 부족, 후향적 연구 predominance, 표준화된 진단 도구 부재가 있습니다.","종단적 대규모 임상시험과 다중 오믹스 접근법을 통해 인과관계 입증과 개인화 치료 개발이 필요합니다."],"radar":{"owner":{"soon":true,"q":"개·고양이 행동문제에 장 건강 보충제나 프로바이오틱스가 효과가 있는지 물어보고 싶어요.","script":"현재까지 연구에서 일부 유산균이 불안이나 공격성에 도움이 될 수 있다는 초기 결과가 나왔는데, 아직 인과관계가 입증된 건 아니에요. 효과가 확인된 표준화된 제품도 없어서 함부로 추천하기는 어렵고, 우선 기존 치료를 유지하면서 관찰하는 것이 좋아요."},"clinical":"미생물군 기반 보충제 도입 전, 기존 행동치료·약물 요법의 효과 충분히 평가하고 보호자와 기대치 충분히 논의하기","evidence":{"design":"체계적 문헌고찰","n":"","stars":2,"note":"상관관계에 근거한 근거여서 인과관계 입증 전 일반화 주의, 종특이적 표준화된 치료 프로토콜 미확립"}},"tag":""},{"id":"2026-07-23_24","day":"2026-07-23","ts":1784883273300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"전산기법으로 발견한 고양이 심장병 후보 치료제","dek":"전산 스크리닝을 통해 고양이 심근비대증 치료용 mTOR 억제제 후보 물질 17종을 찾았으며, 특히 dihydro-alpha-ergocryptine이 기존 약물 rapamycin보다 더 높은 결합 친화력을 보였습니다.","source":"Journal of molecular modeling","country":"","date":"07.23","read":"2분 읽기","plate":"Journal of molecular modeling","image":null,"sourceUrl":"https://doi.org/10.1007/s00894-026-06786-5","body":["심근비대증은 고양이에서 약 14.7%의 유병률을 보이는 주요 심장 질환으로, mTOR 단백질이 심장의 구조적 재형성 관여한다는 점에서 억제제가 치료제가 될 수 있습니다. 연구진은 공개 소프트웨어(MODELLER, SWISS-MODEL)를 이용해 고양이 mTOR의 호모로지 모델을 구축하고, DrugBank 데이터베이스의 저분자 화합물을 AutoDock Vina로 가상 스크리닝하는 통합 전산 파이프라인을 적용했습니다.","가상 스크리닝 결과 17개의 후보 화합물이 rapamycin보다 우수한 결합 친화력을 보였으며, 분자 동역학 시뮬레이션과 MM/PBSA 계산 결과 dihydro-alpha-ergocryptine이 고양이 mTOR에 대해 rapamycin보다 더 높은 결합 안정성을 나타냈습니다. ADMET 분석에서도 해당 화합물이 좋은 약물 유사 특성을 보였다고 합니다.","본 연구는 전산 기반으로 준비된 후보 물질로, 실제 고양이에서의 치료 효과와 안전성은 아직 검증되지 않았습니다. 그러나 향후 이 후보 화합물이 실제 약물로 개발된다면, 현재 치료 옵션이 제한적인 심근비대증 고양이에게 새로운 치료 가능성을 제시할 수 있습니다. 단일 전산 연구의 한계를 인식하고 생체 내 실험이 필요합니다."],"blog":"고양이 심근비대증은 흔한 질환이지만 치료 옵션이 제한적이어서, 새로운 약물 개발 가능성을 보여주는 흥미로운 연구입니다.","blogAngle":["고양이 심근비대증 유병률은 약 14.7%입니다.","DrugBank 데이터베이스에서 rapamycin보다 결합 친화력이 높은 후보 화합물 17종을 발견했습니다.","Dihydro-alpha-ergocryptine이 분자 동역학 시뮬레이션에서 rapamycin보다 우수한 결합 안정성을 보였습니다.","본 연구는 전산 스크리닝 결과로, 실제 동물 실험에 의한 효과는 아직 입증되지 않았습니다."],"radar":{"owner":null,"clinical":"향후 고양이 심근비대증 치료제 개발 소식을 확인하고, 실제 임상 사용 시점이 되면 치료 프로토콜을 점검","evidence":{"design":"전산 스크리닝 연구","n":"후보 화합물 17종","stars":1,"note":"컴퓨터 기반 가상 스크리닝 연구로 실제 동물 실험이 없어 임상 적용에는 한계가 있음"}},"tag":""},{"id":"2026-07-23_25","day":"2026-07-23","ts":1784883272300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 호중구성 염증성 장염 27례 임상 분석","dek":"호중구성 염증성 장염(NIE) 개 27례를 분석한 결과, 이 질환이 낮은 생존율과 관련되며 말초 호중구증이 불량한 예후 지표일 수 있음을 확인했습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.23","read":"2분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag130","body":[" chronic inflammatory enteropathy(CIE)는 개에서 흔하며, 호중구성 염증성 장염(NIE)은 그중 드문 아형으로 병인, 치료, 예후에 대한 논쟁이 있습니다. 본 연구는 조직학적으로 확인된 NIE 개에서 임상양상, 검사소견, 영상소견, 치료, 생존을 기술하는 것을 목표로 했습니다. 2015년 1월부터 2025년 1월까지 병원 데이터베이스에서 후향적으로 NIE 개를 탐색했으며, 수정된 WSAVA 지침에 따라 경미(경미 염증) 그룹과 중등도/중증(중등도 또는 중증 염증) 그룹으로 분류했습니다. 총 27례가 확인되었으며, 경미 그룹 8례, 중증 그룹 19례였습니다. 평균 연령은 7.7±3.5세였습니다.","가장 흔한 임상 증상은 설사(78%), 구토(78%), 체중 감소(74%), 식욕 감퇴/식욕 부진(48%), 멜레나(26%)였습니다. 검사소견 이상에는 호중구증(44%), 저알부민혈증(52%), 저글로불린혈증(85%), 저콜레스테롤혈증(41%), 총 저칼슘혈증(41%), 저코발라민혈증(58%)이 포함되었습니다. 27례 중 24례(89%)가 퇴원할 때까지 생존했으며, 전체 중앙 생존 기간은 267일이었습니다. 경미 그룹과 중증 그룹 간 통계적으로 유의미한 차이는 없었습니다. 그러나 말초 호중구증은 사망 위험 증가(HR 4.43, 95% CI 1.16-16.99, P=0.03)와 유의미하게 짧은 중앙 생존 기간과 관련이 있었습니다.","호중구성 염증성 장염은 불량한 생존율과 관련될 수 있으며, 이는 임상적으로 중요한 발견입니다. 말초 호중구증은 더 불량한 예후를 나타낼 수 있는 지표로 활용될 수 있습니다. 본 연구는 후향적 단일기관 연구로 표본 수가 작아 한계가 있으며, 더 대규모 전향적 연구가 필요합니다. 한국의 임상 현장에서는 NIE 의심 증상(설사, 구토, 체중 감소)이 지속되는 개에서 이러한 검사소견 이상을 확인하고 예후를 평가할 때 말초 호중구증을 고려해야 합니다."],"blog":"강아지의 만성 설사, 구토, 체중 감소가 지속되면 중대한 장 질환의 가능성을 고려하여 신속한 동물병원 진찰이 권장됩니다.","blogAngle":["호중구성 염증성 장염 27례에서 가장 흔한 증상은 설사와 구토(각 78%)였으며, 저글로불린혈증(85%)과 저알부민혈증(52%)이 빈번했습니다.","89%(24/27)의 개가 퇴원할 때까지 생존했지만 전체 중앙 생존 기간은 267일에 불과했습니다.","말초 호중구증은 사망 위험을 4.43배 증가시켰으며(95% CI 1.16-16.99, P=0.03), 이는 불량한 예후 지표입니다.","경미 염증 그룹과 중증 염증 그룹 간 생존율에 유의미한 차이는 없었습니다."],"radar":{"owner":{"soon":true,"q":"강아지가 설사와 구토를 오래 하는데, 이게 호중구성 장염일까요?","script":"호중구성 염증성 장염은 전체 염증성 장질환 중 드문 형태입니다. 설사, 구토, 체중 감소가 오래 지속되는 경우 혈액 검사에서 말초 호중구증, 저알부민혈증, 저코발라민혈증 등이 나타날 수 있으며, 이러한 검사 이상은 예후를 판단하는 데 도움이 됩니다. 그러나 정확한 진단은 조직 검사로 확정하므로 영상 검사와 함께 추가 검사가 필요합니다."},"clinical":"개의 만성 설사·구토·체중 감소 진료 시 말초 호중구증, 저알부민혈증, 저코발라민혈증 등 검사소견 이상 여부를 함께 확인하고, NIE 가능성을 고려한 조직학적 검사를 검토할 것","evidence":{"design":"후향적 코호트","n":"개 27마리","stars":2,"note":"단일기관 후향적 연구로 표본 수가 작아 일반화에 주의가 필요하며, 경미 그룹과 중증 그룹 간 유의미한 차이가 없어 해석에 한계가 있음"}},"tag":""},{"id":"2026-07-23_26","day":"2026-07-23","ts":1784883271300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"식도 이물이 유발한 개 유미흉 1례","dek":"식도 이물과 식도 협착을 가진 개에서 유미흉이 발생할 수 있음을 보고하며, 내시경적 이물 제거 후 추적 초음파로 호전되었음을 확인합니다.","source":"Journal of the American Animal Hospital…","country":"","date":"07.23","read":"1분 읽기","plate":"Journal of the American Animal Hospital…","image":null,"sourceUrl":"https://doi.org/10.5326/JAAHA-MS-7556","body":["10세령 암수 금색 리트리버가 지속적 구토로 응급실에 내원하였습니다. 해당 환자는 이상성 오른쪽 쇄골하 동맥과 이후 발생한 식도 협착 및 식도 확장증 병력이 있었으며, 흉부 방사선 검사로 식도 이물이 확인되었습니다.","초음파 검사를 통해 흉막 삼출액을 확인하고 천자 후 림프액(chyle)임을 판독하여 유미흉으로 진단하였습니다. 내시경적으로 이물을 제거한 후 환자는 다음 날 퇴원하였으며, 퇴원 후 1주 이내 폐흡인 폐렴이 발생하여 외래 치료를 받았습니다.","초음파 추적 검사에서 21일 후 유미흉과 폐렴이 모두 소실된 것으로 확인되었습니다. 본 증례는 식도 이물이 유미흉의 원인일 수 있음을 보여주며, 특히 식도 협착이나 식도 확장증이 있는 개에서 발생할 수 있습니다. 그러나 단일 사례 보고이므로 일반화에 한계가 있음을 고려해야 합니다."],"blog":"강아지가 구토를 오래 지속하면 식도에 이물이 있을 수 있고, 이를 방치하면 유미흉 같은 심각한 합병증이 올 수 있으므로 신속한 수의과 진료가 중요함을 알릴 수 있습니다.","blogAngle":["식도 이물과 식도 협착을 가진 10세 금색 리트리버에서 유미흉이 발생하였습니다.","초음파 유도 천자로 림프액임을 확인하여 유미흉을 진단하였습니다.","내시경적 이물 제거 후 21일째 추적 초음파에서 유미흉이 완전히 소실되었습니다.","단일 사례 보고이므로 더 많은 연구가 필요하며, 식도 이물과 유미흉의 연관성에 대한 추가 검토가 요구됩니다."],"radar":{"owner":{"soon":true,"q":"강아지가 뼈 같은 걸 먹어서 식도에 걸렸을 때 유미흉 같은 다른 병도 올 수 있나요?","script":"식도 이물이 있는 경우 드물지만 유미흉이 발생할 수 있다는 보고가 있습니다. 특히 식도 협착이나 식도 확장증 같은 기존 식도 문제가 있으면 더 위험할 수 있어요. 의심되면 영상 검사로 확인하는 게 중요합니다."},"clinical":"식도 이물 환축에서 유미흉 가능성을 고려하고, 특히 식도 협착/확장증 병력 있는 경우 흉부 초음파 검사를 병행 점검","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례이므로 일반화에 한계가 있으며, 기저 식도 질환이 있는 특수한 경우임"}},"tag":""},{"id":"2026-07-23_27","day":"2026-07-23","ts":1784883270300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 비종양 CT 소견: 악성과 유사한 종양양 성장","dek":"고양이 비종양은 양성 질환이지만 CT에서 악성 종양과 매우 유사하게 나타나 감별 진단이 어렵다는 점을 확인했습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.23","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70185","body":["본 연구는 고양이 비종양의 CT 소견을 기술하기 위해 후향적으로 14마리의 고양이를 분석했습니다. 6마리는 중간엽 비종양, 6마리는 혼합 조직 비종양, 각각 1마리씩 상피 및 혈관 비종양이 포함되었습니다.","중간엽 비종양과 혼합 조직 비종양 12례에서 연조직 및 광물 감쇄를 보이는 국소 침습성 비 종양이 확인되었으며, 9례는 일측성, 3례는 양측성이었습니다. 모든 경우에서 '뇌형 패턴'으로 불리는 과발생된 무질서한 광물 밀도가 코 중심부를 대체했습니다. 대비 증강은 75%에서 중간 정도로 관찰되었습니다.","비종양은 드문 종양양 성장이지만, 비강 종양의 감별 진단에 반드시 포함해야 합니다. 특히 '뇌형 패턴' 소견은 비종양을 의심할 수 있는 단서가 되며, 조직학적 검사를 통해 최종 진단을 확정해야 합니다. 이는 치료 계획과 예후 판단에 중요한 정보가 됩니다."],"blog":"고양이 코에 종양이 발견되면 악성뿐 아니라 비종양 가능성도 있으며, 특히 CT에서 '뇌형 패턴'이 보인다면 비종양을 의심해볼 수 있습니다","blogAngle":["14마리 고양이 중 12마리(86%)에서 '뇌형 패턴'으로 불리는 특징적인 광물 소견이 관찰되었습니다","일측성이 9례(75%), 양측성이 3례(25%)였으며, 대부분 코안쪽으로 침습적으로 자랐습니다","대부분의 경우에서 부비골의 용해 또는 위축이 동반되었습니다(10/12례, 83%)","비종양은 양성 질환이지만 CT에서 악성과 구분하기 어렵기 때문에 감별 진단에 포함해야 합니다"],"radar":{"owner":{"soon":true,"q":"우리 고양이 코에 종양이 보이신다고 했는데, 양성일 수도 있는 건가요?","script":"CT에서 악성 종양처럼 보이는 양성 질환이 있을 수 있습니다. 다만 CT만으로는 최종 판단이 어려우므로 조직 검사가 필요합니다.양성과 악성을 확실히 구분하려면 조직학적 검사를 받아야 합니다."},"clinical":"비종양 가능성을 고려하여 비강 CT 소견에서 '뇌형 패턴' 유무 및 광물 감쇄 여부를 점검하고, 악성 종양 진단 전 조직 확인을 권고하는 진료 흐름 점검","evidence":{"design":"후향적 단면조사","n":"고양이 14마리","stars":2,"note":"소규모 후향적 연구로, 특정 유형의 비종양에 치우쳐 있어 모든 고양이 비종양으로 일반화하기 어렵고 선택 편향 가능성 존재"}},"tag":""},{"id":"2026-07-23_28","day":"2026-07-23","ts":1784883269300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"MRI 정상인 시바 이누에서 생식 기반 식이로 인한 티아민 결핍 1례","dek":"MRI에서 이상 소견이 없었던 시바 이누에서 생선 기반 생식을 원인으로 추정되는 티아민 결핍이 확인되고 식이 교정과 티아민 보충으로 호전되었습니다.","source":"The Canadian veterinary journal","country":"","date":"07.23","read":"1분 읽기","plate":"The Canadian veterinary journal","image":null,"sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/42368687/","body":["6세 중성화 암컷 시바 이누가 2주 동안 진행된 사지마비로 내원하였으며, 소뇌 징후를 동반한 비보행성 사지마비로 발전했습니다. 영양 불균형의 상업적 동결건조 생선 기반 생식을 제공하고 있었으며, 흉추와 뇌 MRI에서는 이상 소견이 없었고, CSF 분석에서 알부민세포 해리가 관찰되었습니다.","식이 이력, 임상 진행 과정, 치료 반응을 종합하여 티아민 결핍을 추정 진단하였고, 식이 조절과 경구 티아민 보충 치료를 실시하여 거의 완전한 신경학적 회복을 이루었습니다.","이 증례는 MRI에서 이상 소견이 없더라도 식이 이력의 중요성을 보여주며, 특히 생식을 오래 섭취한 동물에서 신경학적 증상이 있을 때 티아민 결핍을 감별해야 합니다. 단일 증례이고 보철적 진단이므로 대규모 연구가 필요합니다."],"blog":"반려견이 오래된 생식을 섭취하고 있으면 신경학적 증상과 관계없이 정기적으로 티아민 영양 상태를 확인하고, 이상이 있다면 식이 교정과 보충제 섭취를 고려해야 합니다.","blogAngle":["6세 시바 이누가 2주 동안 진행된 사지마비로 내원했으며, MRI와 CSF 분석에서 특이 소견이 없었습니다.","식이 이력에서 영양 불균형의 동결건조 생선 기반 생식이 확인되었습니다.","식이 교정과 티아민 보충 치료 후 거의 완전한 신경학적 회복을 이루었습니다.","MRI 정상 소견에서도 진행성 신경 질환에서 식이 원인의 가능성을 반드시 고려해야 합니다."],"radar":{"owner":{"soon":true,"q":"강아지에게 생선만 오래 줘도 티아민이 부족해질 수 있나요?","script":"생선에는 티아민을 분해하는 효소가 있어서 오래 먹이면 부족해질 수 있어요. 다만 모든 생선이 문제가 되는 건 아니고, 특히 오래된 날생선이나 다양한 영양소를 보충하지 않은 경우는 주의가 필요해요. 지금은 식이 교정과 보충제로 충분히 호전되었으니까 너무 불안해하지 마세요."},"clinical":"생식 섭취 이력이 있는 개에서 신경학적 증상이 있으면 MRI 이상 유무와 관계없이 식이 이력을 반드시 검토하고 티아민 결핍을 감별진단할 것","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례이고 보존적 진단이므로 인과관계 입증에는 한계가 있으며, 일반적인 개의 식이 관리에 직접 적용하기엔 증거 수준이 낮음"}},"tag":""},{"id":"2026-07-23_29","day":"2026-07-23","ts":1784883268300,"cat":"research","kicker":"최신 연구","isToday":false,"title":"재발성 요도 폐쇄 수고양이, 초기 발병보다 질소혈증 발생 위험 낮아","dek":"600마리 이상의 수고양이를 대상으로 한 다기관 연구에서 재발성 요도 폐쇄 발병 시 초기 발병 대비 질소혈증 유병률이 낮았으며, 대다수가 48시간 내 회복되는 것으로 나타났습니다.","source":"Journal of feline medicine and surgery","country":"","date":"07.23","read":"2분 읽기","plate":"Journal of feline medicine and surgery","image":null,"sourceUrl":"https://doi.org/10.1177/1098612X261457846","body":["본 연구는 2020~2024년 동안 다수의 동물병원에서 요도 카테터 삽입술을 받은 수고양이 601마리를 대상으로 후향적으로 실시되었습니다. 연구 대상에서 만성 신장병 진단례, 의뢰 후 진료례, 의무기록 미비례를 제외하였으며, 질소혈증은 혈청 크레아티닌 140μmol/l 이상으로 정의하였습니다. 초기 발병과 재발성 발병 간 질소혈증 유병률과 회복 소요 시간, 그리고 카테터 삽입과 입원 기간 연장의 위험 인자를 비교하였습니다.","연구 결과, 요도 폐쇄나 하부 요로 증상 경험력이 있는 수고양이는 초기 발병 시 질소혈증일 가능성이 유의하게 낮았다(각 p=0.015, p=0.014). 질소혈증 고양이는 비질소혈증 고양이 대비 카테터 삽입 기간이 길어질 확률이 1.92배(95% CI 1.40-2.65, p\u003c0.001), 입원 기간이 길어질 확률이 1.81배(95% CI 1.28-2.57, p\u003c0.001)였습니다. 질소혈증 발현 127마리 중 89마리(70.1%, 95% CI 61.3-77.9%)가 48시간 이내에 회복되었고, 재발성 요도 폐쇄는 질소혈증 회복 시간과 관련이 없었다(p=0.395).","한국 동물병원 임상 관점에서, 재발성 요도 폐쇄 수고양이의 보호자들은 증상 조기 발견을 위해 주의 깊은 관찰이 필요하며, 질소혈증이 동반된 경우 카테터와 입원 기간이 길어질 수 있음을 고려해야 합니다. 본 연구는 후향적 설계의 한계가 있으나, 다기관 대단위 표본으로 신뢰성을 확보하였습니다. 또한 재발력의 경우 질소혈증 발현 빈도가 낮아 보호자 경각심이 치료 예후에 긍정적 영향을 미칠 수 있음을 시사합니다."],"blog":"지난번 요도 폐쇄 경험이 있는 수고양이의 보호자는 증상 재발 시 조기 발견으로 질소혈증 위험을 낮출 수 있으므로 평소 배변·배뇨 패턴을 주의 깊게 관찰해야 합니다.","blogAngle":["재발성 요도 폐쇄 수고양이는 초기 발병 시보다 질소혈증으로 발현될 가능성이 낮았다(p=0.015).","질소혈증 고양이는 카테터 삽입 기간이 길어질 확률이 1.92배, 입원 기간이 길어질 확률이 1.81배였다(p\u003c0.001).","질소혈증 고양이의 70.1%(89/127마리)가 48시간 이내에 회복되었습니다.","재발성 요도 폐쇄와 초기 발병 간 카테터 삽입 및 입원 기간에는 유의한 차이가 없었다(p=0.395)."],"radar":{"owner":{"soon":true,"q":"고양이가 요도 폐쇄가 다시 재발하면 처음 걸렸을 때보다 신장 문제가 더 심각해지나요?","script":"재발성 요도 폐쇄가 반드시 더 위험한 것은 아닙니다. 오히려 이 연구에서는 재발성 발병 시 질소혈증 발생 위험이 초기 발병보다 낮았고, 질소혈증이 생긴 경우 대부분 48시간 이내에 정상화되었습니다. 다만 질소혈증이 있으면 카테터와 입원 기간이 길어질 수 있으니 증상을 지켜보는 것이 중요합니다."},"clinical":"요도 폐쇄 고양이 진료 시 과거 발병력 여부를 반드시 확인하고, 재발성 고양이는 상대적으로 질소혈증 위험이 낮다는 점은 보호자 안심에 활용하되, 질소혈증인 고양이는 카테터 유지·입원 기간 연장을 예상하여 치료 계획을 세우시오.","evidence":{"design":"후향적 코호트","n":"수고양이 601마리","stars":3,"note":"후향적 연구로 인과관계보다 연관성 해석에 적합하고, 단일 시간점 혈청 크레아티닌 측정이라는 한계가 있으나 다기관 대단위 표본으로 신뢰성 보완"}},"tag":""}],"stories":[{"id":"2026-07-23_30","day":"2026-07-23","ts":1784049480000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"트리니티 베이서 박쥐에 광견병 발견","dek":"해외에서 화제가 된 박쥐 광견병 소식이 화제가 되고 있습니다.","source":"VOCM","country":"","date":"07.15","read":"1분 읽기","plate":"VOCM","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiS0FVX3lxTFB5QUFxMDFtcFhhR0lldlAzRmFCelRRTDlQcjJtV2hvOXozUmZYbDk1N3V3VXJsSU9LRTJuSFVnU3RVVF9oV0VJclA4Zw?oc=5","body":["최근 캐나다 Trinity Bay 지역에서 박쥐가 광견병에 감염된 사례가 확인되었습니다. 이는 해당 지역에서 보기 드문 일이면서도 주의를 기울여야 할 상황입니다. 광견병은 치사율이 높기로 유명하지만, 박쥐에게서는 비교적 흔하지 않은 질병이죠.","반려동물을 키우는 이들은 박쥐와의 접촉에 주의하고, 이상 행동 보이는 박쥐를 보면 전문가에게 문의하는 것이 좋겠습니다. 물론 광견병은 치료가 늦어지면 위험하니 신속한 진료를 받는 것이 중요합니다. 진료실 밖에서 보면 이런 일도 있네요."],"blog":"","blogAngle":[],"radar":null,"tag":"충격"},{"id":"2026-07-23_31","day":"2026-07-23","ts":1784599325000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"800만 원 수술 증가...'침묵의 병' 강아지 위협","dek":"해외에서 조용히 퍼지는 강아지 질병이 수술비를 치솟게 하고 있습니다.","source":"thesenior.com.au","country":"","date":"07.21","read":"1분 읽기","plate":"thesenior.com.au","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMioAFBVV95cUxQN0RFajMtTzNDUWZCTzdwOW1KTFMzSmNwWXo1cVdKVDBGNlR3cW00QXRrZnV1akZQcndrUkRaRF9BZnBzNTZDYlBEak5IaUxOMmRQZ0k1RHZFdDVtVjNiSHBJQXA3WDQtaXZfVUxRN0VUMFhzck9aZFNuTW9kV0p5X1prYXp4WmR1cDB1bHEzYm53STZINkF2WXZhb0I3elcy?oc=5","body":["최근 해외 수의과 대학에서 침묵의 병으로 불리는 질환을 가진 강아지가 급증하고 있습니다. 이 병은 초기 증상이 거의 없어 늦게 발견되는 경우가 많고, 결국 수술 비용이 800만 원을 넘어서는 상황이라고 합니다.","진단 받으려면 전문 검사가 필요하고, 수술비만 800만 원을 넘기 때문에 많은 주인들이 충격을 받고 있습니다. 아직 국내에서는 본격 보고가 없지만, 진료실 밖에서도 강아지 건강 관찰은 중요하겠죠."],"blog":"","blogAngle":[],"radar":null,"tag":"충격"},{"id":"2026-07-23_32","day":"2026-07-23","ts":1782284400000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"호주 퍼스 강아지 1300만원 진료비에 놀란 네티즌들","dek":"비싼 강아지 품종도 병원비 앞에서는 마찬가지로 적자가 되네요.","source":"PerthNow","country":"","date":"06.24","read":"1분 읽기","plate":"PerthNow","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi8AFBVV95cUxNZUxLcVRxZlJ5ay1HSXFuQl82aVQtNDR6Ry1hVEh6dTVmSDdCazdSeWVIY3NEaXpiNVZiTVg5SS1TOGRXeXUydWJXYmhVd3lGZWpZSWg5R1BHTUJReWk4OEJIcmJlT3F2Ymd5RG8yRXZULU5FWDltcTlJbVM3bjlXMGJSVnBsUzNFWDJTWVRtLU5UWWtvSi1FUHoxZk5uVVZuREktbFo4WHh0OUZfeHFDTFVzamRtRHNrNTQwbWdwSG5LQUltVVlBUERsODBKY1lHUWRzWHM1dXF6Z2NUeDRfeW1YQjFNeVFkMzJXZVNFWnU?oc=5","body":["호주 퍼스에서 강아지 한 마리가 갑작스러운 건강 문제로 동물병원에 갔더니, 13,000호주달러(약 1,300만원)의 진료비가 청구되었다고 합니다. 해당 강아지는 이른바 '비싼 품종'으로 알려진     var ideaBtn = '<button data-idea="'+a.id+'" title="글감 담기" style="flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--color-line-normal);background:var(--color-background-normal);border-radius:9px;cursor:pointer;color:'+(isIdea(a.id)?'var(--color-primary-normal)':'var(--color-label-assistive)')+';">'+IDEA.replace(/W/g,16)+'</button>';
    return '<article class="vm-row'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:20px;padding:24px 0;border-bottom:1px solid var(--color-line-normal);cursor:pointer;">'
    +'<div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;"><span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-primary-normal);">'+e(a.kicker)+'</span>'+tag(a.isToday,16,10)+'</div>'
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.017em;margin:0 0 8px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:14.5px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 8px;max-width:70ch;">'+e(a.dek)+'</p>'
    +'<div style="font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-label-alternative);">'+meta(a)+'</div></div>'
    +'<div style="flex:none;display:flex;flex-direction:column;gap:8px;">'+bookmarkBtn(a.id,17,'box')+ideaBtn+'</div></article>';
  }

  function catRow(){
    if(!DATA.cats.length) return '';
    var chips='<button class="vm-chip" data-cat="all" aria-pressed="'+(S.cat==='all')+'">전체</button>';
    chips+=DATA.cats.map(function(c){return '<button class="vm-chip" data-cat="'+c.key+'" aria-pressed="'+(S.cat===c.key)+'">'+e(c.label)+'</button>';}).join('');
    var total=DATA.articles.length, readCnt=DATA.articles.filter(function(a){return isRead(a.id);}).length;
    var pct=total?Math.round(readCnt/total*100):0;
    return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 4px;">'

    +'<button class="vm-chip" data-act="unread" aria-pressed="'+S.unreadOnly+'">안 읽은 글만</button>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;padding:8px 0 2px;font-size:11.5px;color:var(--color-label-alternative);"><div style="flex:1;height:4px;border-radius:99px;background:var(--color-material-base);overflow:hidden;"><div class="vm-progress" style="width:'+pct+'%;"></div></div><span style="font-variant-numeric:tabular-nums;">'+readCnt+' / '+total+' 읽음</span></div>';
  }

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.
  function qaColumn(arr){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var soon=arr.filter(function(a){return a.radar&&a.radar.owner&&a.radar.owner.q;}).slice(0,6);
    if(soon.length<3) return '';
    var items=soon.map(function(a){
      return '<div class="vm-qa-i'+readCls(a.id)+'" data-open="'+a.id+'" style="cursor:pointer;padding:15px 0;border-top:1px solid var(--color-line-normal);">'
      +'<div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-label-alternative);margin-bottom:6px;">'+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div>'
      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';
    }).join('');
    return '<div style="margin-top:6px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 4px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 문답</span><span style="font-size:12.5px;color:var(--color-label-alternative);">이번 주, 보호자가 묻는 것</span></div>'
    +'<div class="vm-qa-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:0 44px;">'+items+'</div></div>';
  }

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){
    var pad=(3-(list.length%3))%3, fill='';
    for(var i=0;i<pad;i++) fill+='<div class="vm-band-fill" style="background:var(--color-background-normal);"></div>';
    return '<div class="vm-band" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--color-line-normal);">'+list.map(bandCard).join('')+fill+'</div>';
  }

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var list=DATA.recent||[]; if(!list.length) return '';
    return '<div style="margin-top:32px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 13px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">최근 브리핑</span><span style="font-size:12.5px;color:var(--color-label-alternative);">지난 며칠 사이 주요 기사</span></div>'
    +bandGrid(list)+'</div>';
  }

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var list=DATA.stories||[]; if(!list.length) return '';
    var rows=list.map(function(a,i){
      return '<div class="vm-story'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:14px;align-items:baseline;padding:14px 2px;border-top:1px solid var(--color-line-normal);cursor:pointer;">'
      +'<span style="flex:none;width:20px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--color-label-assistive);text-align:center;">'+(i+1)+'</span>'
      +'<div style="min-width:0;flex:1;">'
      +'<div class="vm-hl" style="font-size:15.5px;font-weight:700;line-height:1.45;color:var(--color-label-strong);text-wrap:pretty;">'+(a.tag?'<span style="color:var(--color-primary-normal);font-weight:800;">['+e(a.tag)+']</span> ':'')+e(a.title)+'</div>'
      +'<div style="margin-top:4px;font-size:11.5px;color:var(--color-label-alternative);">'+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div>'
      +'</div><span style="flex:none;color:var(--color-label-assistive);align-self:center;">'+ARR+'</span></div>';
    }).join('');
    return '<div style="margin-top:32px;padding:22px 24px 24px;background:var(--color-background-alternative);border-radius:16px;">'
    +'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:2px;"><span style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 밖 이야기</span><span style="font-size:12.5px;color:var(--color-label-alternative);">해외에서 화제가 된 반려동물·병원 썰</span></div>'
    +'<div>'+rows+'</div></div>';
  }

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;
        x.style.display=x.tagName==='P'?'-webkit-box':'block';
        if(slack()<0) x.style.display='none';
      });
      // ② 그래도 남으면 마지막 카드의 말줄임을 한 줄씩 푼다
      var ps=el.querySelectorAll('p[style*="line-clamp"]');
      if(!ps.length) return;
      var p=ps[ps.length-1], guard=0;
      while(guard++<20){
        if(slack()<26) break;                            // 한 줄 넣을 자리도 없다
        if(p.scrollHeight<=p.clientHeight+2) break;       // 더 보여줄 문장이 없다
        p.style.webkitLineClamp=(parseInt(getComputedStyle(p).webkitLineClamp)||3)+1;
      }
    }); });
  }
  var balTimer;
  addEventListener('resize',function(){ clearTimeout(balTimer); balTimer=setTimeout(function(){ FP.steps=0; fitFold(); },160); });
  // 본문 서체는 CDN에서 늦게 온다. 폴백 서체 기준으로 맞춰놓으면 서체가 바뀌는
  // 순간 글자 높이가 달라져 세 단이 어긋나는데, 다시 맞출 계기가 없다.
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ FP.steps=0; fitFold(); }); }

  function homeView(){
    var arr=activeList();
    if(!arr.length){ return '<div style="text-align:center;padding:64px 0;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--color-label-neutral);">해당 조건의 글이 없습니다</div><p style="margin:8px 0 0;font-size:14px;">필터를 바꿔보세요.</p></div>'; }
    // 기사가 적은 필터에서는 2단을 쓰지 않는다. 오른쪽 단(카드 4 + TOP 5)이
    // 목록 전체보다 길어 어떻게 나눠도 한쪽에 수백 px 빈칸이 남기 때문이다.
    if(arr.length<14){
      var h1='<div><div style="padding:28px 0 34px;border-bottom:2px solid var(--color-label-strong);">'
      +leadCard(arr[0])+arr.slice(1).map(leadFollow).join('')+'</div>'
      +mostRead(arr.slice(0,5));
      h1+=qaColumn(arr);
      h1+=recentSection();
      h1+=storyBoard();
      return h1+'</div>';
    }
    // ── 1면 구성 ──
    // 신문 1면은 아래로 갈수록 단 수와 비중이 바뀐다. 같은 2단이 끝까지 반복되면
    // 리듬이 죽는다. 구역마다 폭을 달리하되, 구역 안에서는 행을 공유해 선을 맞춘다.
    //   폴드   3단(1 : 2.3 : 1.15) — 브리프 리스트 | 톱기사(본문 2단 조판) | 사이드
    //   쿼드   4단 — 같은 무게의 카드 4장
    //   피처   2단(1.7 : 1) 비대칭 — 해설 기사 | TOP 5
    var i=1, lead=arr[0];
    var side=arr.slice(i,i+FP.side); i+=FP.side;
    var brief=arr.slice(i,i+FP.brief); i+=FP.brief;
    var quad=arr.slice(i,i+4); i+=quad.length>=2?quad.length:0;
    if(quad.length<2) quad=[];
    var feat=arr[i++];
    var bandAll=arr.slice(i);
    var band=S.showAll?bandAll:bandAll.slice(0,12);
    var top5=arr.slice(0,5), more=bandAll.length-band.length;

    var h='<div>'
    // ① 폴드 — 3단 비대칭
    +'<div id="vm-fold" class="vm-fold" style="display:grid;grid-template-columns:1fr 2.3fr 1.15fr;gap:0;border-bottom:3px solid var(--color-label-strong);padding-bottom:30px;">'
      +'<div id="vm-leadcell" style="grid-column:2;padding:26px 34px 0;border-left:1px solid var(--color-line-normal);border-right:1px solid var(--color-line-normal);">'+fpLead(lead)+'</div>'
      +'<div id="vm-brief" style="grid-column:1;grid-row:1;padding:26px 26px 0 0;">'
        +'<div style="font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-label-strong);padding-bottom:10px;border-bottom:2px solid var(--color-label-strong);">한눈에</div>'
        +brief.map(briefRow).join('')+'</div>'
      +'<div id="vm-side" style="grid-column:3;grid-row:1;padding:26px 0 0 26px;">'+side.map(railCard).join('')+sponsorBlock(slotAt('fold'))+'</div>'
    +'</div>'
    // ② 광고/제휴 띠 — 폴드와 쿼드 사이. 슬롯이 비면 아무것도 나오지 않는다
    +sponsorBlock(slotAt('mid'),true)
    // ③ 쿼드 — 같은 무게 4단
    // 칸이 다 차지 않으면 빈 셀이 생긴다 → 카드 수에 맞춰 단 수를 줄이고, 2장 미만이면 생략
    +(quad.length>=2?'<div class="vm-quadzone" style="display:grid;grid-template-columns:repeat('+quad.length+',1fr);gap:0;border-bottom:2px solid var(--color-label-strong);">'
      +quad.map(function(a,qi){ return '<div class="vm-quad" style="padding:22px 20px 26px;'+(qi?'border-left:1px solid var(--color-line-normal);':'padding-left:0;')+(qi===quad.length-1?'padding-right:0;':'')+'">'+quadCard(a,qi)+'</div>'; }).join('')
    +'</div>':'')
    // ③ 피처 — 비대칭 2단
    +(feat?'<div class="vm-featzone" style="display:grid;grid-template-columns:1.7fr 1fr;gap:0;border-bottom:2px solid var(--color-label-strong);">'
      +'<div id="vm-feat-l" style="padding:26px 40px 30px 0;">'+featureCard(feat)+'</div>'
      +'<div id="vm-feat-r" style="padding:26px 0 30px 40px;border-left:1px solid var(--color-line-normal);">'+mostRead(top5)+'</div>'
    +'</div>':'');
    if(bandAll.length){
      h+='<div style="padding:16px 0 13px;border-bottom:1px solid var(--color-line-normal);"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">오늘의 다른 소식</span></div>'
      +bandGrid(band);
      if(more>0){ h+='<div style="display:flex;justify-content:center;padding:28px 0 0;"><button data-act="more" style="display:inline-flex;align-items:center;gap:8px;border:1px solid var(--color-line-strong);background:var(--color-background-normal);color:var(--color-label-strong);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:12px 24px;border-radius:10px;">기사 '+more+'건 더 보기</button></div>'; }
    }
    h+=qaColumn(arr);
    h+=recentSection();
    h+=storyBoard();
    return h+'</div>';
  }
  function listView(items,emptyT,emptyH){
    if(!items.length){ return '<div style="text-align:center;padding:72px 0;color:var(--color-label-alternative);"><div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--color-label-neutral);">'+emptyT+'</div><p style="margin:8px 0 0;font-size:14px;">'+emptyH+'</p></div>'; }
    return '<div style="padding-top:8px;">'+items.map(rowCard).join('')+'</div>';
  }
  function ideaCard(a){
    var angle=(a.blogAngle||[]).map(function(p){return '<li style="margin-bottom:3px;">'+e(p)+'</li>';}).join('');
    return '<article style="border:1px solid var(--color-primary-normal);border-radius:12px;padding:18px 20px;margin-bottom:16px;">'
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;"><div style="min-width:0;"><div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-primary-normal);margin-bottom:6px;">글감 · '+e(a.kicker)+' · '+e(a.source)+'</div><div style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--color-label-strong);line-height:1.35;">'+e(a.blog)+'</div></div><button data-idea="'+a.id+'" title="빼기" style="flex:none;width:32px;height:32px;border:1px solid var(--color-line-normal);background:transparent;border-radius:8px;cursor:pointer;color:var(--color-label-alternative);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
    + (angle?'<ul style="margin:12px 0 0;padding-left:18px;color:var(--color-label-neutral);font-size:14px;line-height:1.7;">'+angle+'</ul>':'')
    +'<div style="margin-top:12px;display:flex;gap:8px;"><button data-act="copyone" data-id="'+a.id+'" style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-primary-normal);background:transparent;color:var(--color-primary-normal);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;">'+COPY+' 이 글감 복사</button>'+(byId[a.id]?'<button data-open="'+a.id+'" style="border:1px solid var(--color-line-normal);background:transparent;color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:8px;">기사 보기</button>':'')+'</div></article>';
  }
  function ideasView(){

      var titles=(r.titles||[]).map(function(t,i){return '<button data-act="copytitle" data-t="'+encodeURIComponent(t)+'" style="display:block;width:100%;text-align:left;border:1px solid var(--color-line-normal);background:var(--color-background-normal);border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--color-label-strong);">'+(i+1)+'. '+e(t)+'</button>';}).join('');

  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }
