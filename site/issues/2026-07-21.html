anlab.com/issues/2026-07-21#2026-07-21_19","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","datePublished":"2026-07-24T08:49:22.464Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1881134/full","inLanguage":"ko"}},{"@type":"ListItem","position":20,"item":{"@type":"NewsArticle","headline":"개 전십자 인대 파열수술, TPLO와 TTA 관절염 진행은 어떤 것이 더 나은가?","description":"개의 전십자 인대 파열수술 시 TPLO와 TTA 중 어느 수술법이 수술 후 관절염 진행을 줄이는지에 대한 연구를 분석했습니다. 현재 증거로는 아직 확립된 결론이 없다고 합니다.","url":"https://news.vetmanlab.com/issues/2026-07-21#2026-07-21_20","datePublished":"2026-07-09T23:00:00.000Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://veterinaryevidence.org/index.php/ve/article/view/749","inLanguage":"ko"}},{"@type":"ListItem","position":21,"item":{"@type":"NewsArticle","headline":"개 무릎 수술 통증관리: 신경마비 차단 대 경막외 마취 어떤 게 더 효과적인가","description":"6개 무작위 대조 임상시험을 분석한 연구에 따르면, 개 무릎 관절 수술에서 신경마비 차단이 경막외 마취의 효과적인 대안으로 사용될 수 있으며, 특히 잔류 마비 발생률이 더 낮은 것으로 나타났습니다.","url":"https://news.vetmanlab.com/issues/2026-07-21#2026-07-21_21","datePublished":"2026-06-08T23:00:00.000Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://veterinaryevidence.org/index.php/ve/article/view/736","inLanguage":"ko"}},{"@type":"ListItem","position":22,"item":{"@type":"NewsArticle","headline":"캔버라 수의사 경고...'레고·백합' 섭취 급증, 보험금 1천300만원 달해","description":"호주 캔버라의 수의사가 반려동물들이 레고 블록부터 백합에 이르기까지 다양한 물체를 삼키는 사례가 급증하고 있으며, 관련 보험 청구 금액이 최대 1만3천500호러달(약 1천300만원)에 달한다고 경고했습니다. 백합은 고양이에게 치명적인 신독성을 유발할 수 있어 특히 주의가 필요합니다.","url":"https://news.vetmanlab.com/is 64Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1111/vop.70217","inLanguage":"ko"}},{"@type":"ListItem","position":26,"item":{"@type":"NewsArticle","headline":"애완동물에서 발견된 인류기생 Trichophyton tonsurans 22례, 프랑스 2021-2025","description":"인류기생 피부사상균 T. tonsurans가 프랑스 애완동물 22마리(고양이 13, 강아지 9)에서 확인되었습니다. 이는 사람에서 동물로의 전파 가능성을 제시하며, 축구 Dermatophyte 감염 관리에 새로운 관점을 제공합니다.","url":"https://news.vetmanlab.com/issues/2026-07-21#2026-07-21_26","datePublished":"2026-07-24T08:49:15.464Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1093/mmy/myag066","inLanguage":"ko"}},{"@type":"ListItem","position":27,"item":{"@type":"NewsArticle","headline":"개 복지 평가 도구 AWAG, 임상 의사결정에 유용","description":"개의 동물 복지 평가를 위한 표준화된 도구인 AWAG의 임상 유용성을 조사한 결과, 96% 이상의 수의 및 동물 복지 전문가가 의사결정에 도움이 된다고 평가했습니다.","url":"https://news.vetmanlab.com/issues/2026-07-21#2026-07-21_27","datePublished":"2026-07-24T08:49:14.464Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1002/vms3.70993","inLanguage":"ko"}},{"@type":"ListItem","position":28,"item":{"@type":"NewsArticle","headline":"카발리에 킹 찰스 스파니엘의 무릎뼈 탈구 유병률과 위험인자","description":"호주의 1차 수의 진료소를 방문한 카발리에 킹 찰스 스파니엘에서 무릎뼈 탈구의 10년 유병률이 12.5%에 달하며, 중성화된 강아지와 특정 체중군에서 위험이 현저히 높다는 것을 확인했습니다.","url":"https://news.vetmanlab.com/issues/2026-07-21#2026-07-21_28","datePublished":"2026-07-24T08:49:13.464Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1002/vms3.71026","inLanguage":"ko"}},{"@type":"ListItem","position":29,"item":{"@type":"NewsArticle","headline":"수의사가 강조하는 고양이 건강 관리의 7가지 핵심","description":"미국 수의사들이 고양이 건강 관리에서 가장 중요하다고 강조하는 7가지 포인트를 소개합니다. 일상적으로 놓치기 쉬운 건강 신호를 파악하고, 적절한 예방 <noscript><div style="max-width:720px;margin:0 auto;padding:40px 20px;font-family:sans-serif;">
<h1>베트맨랩 VetManLab 해외 브리핑 — 2026-07-21</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<ul style="list-style:none;padding:0;"><li style="margin-bottom:16px;"><a href="/article/2026-07-21_1-고양이-소화선-종양-연관-급성-근무력증-1례"><b>고양이 소화선 종양 연관 급성 근무력증 1례</b></a>
<div>11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.</div>
<small>임상 · Veterinary Sciences</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_2-AI-혈액도말-분석-개-IMHA-진단-시간-획기적-단축"><b>AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축</b></a>
<div>5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했습니다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었습니다.</div>
<small>업계 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_3-개-발치-후-생체재료가-치조골-높이를-보존한다"><b>개 발치 후 생체재료가 치조골 높이를 보존한다</b></a>
<div>개 대형 하악 치아 발치 후 신생 골점착제(RBA)가 치조능의 높이를 유의하게 보존한다는 다기관 연구 결과가 발표되었습니다. 기존 혈병 응고만으로 치유된 대조군 대비 12개월 후 설측 치조능이 약 2mm 더 높게 유지되어, 발치 후 골흡수 예방에 유효한 임상적 대안이 될 수 있습니다.</div>
<small>최신 연구 · Journal of the American Animal Hospital…</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_4-개고양이-refractory-감염각막염에서-Rose-Bengal-광동력치"><b>개·고양이 refractory 감염각막염에서 Rose Bengal 광동력치료의 임상 성과</b></a>
<div>초기에 약물치료에 반응하지 않은 개와 고양이의 감염각막염 22안을 Rose Bengal 광동력치료(RB-PDAT)로 치료한 결과, 모든 안에서 각막 상피 치유가 확인되었습니다.</div>

<small>최신 연구 · Veterinary medicine and science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_28-카발리에-킹-찰스-스파니엘의-무릎뼈-탈구-유병률과-위험인자"><b>카발리에 킹 찰스 스파니엘의 무릎뼈 탈구 유병률과 위험인자</b></a>

<small>최신 연구 · Veterinary medicine and science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_29-수의사가-강조하는-고양이-건강-관리의-7가지-핵심"><b>수의사가 강조하는 고양이 건강 관리의 7가지 핵심</b></a>
<div>미국 수의사들이 고양이 건강 관리에서 가장 중요하다고 강조하는 7가지 포인트를 소개합니다. 일상적으로 놓치기 쉬운 건강 신호를 파악하고, 적절한 예방 관리와 식이를 실현하는 것이 고양이의 수명 연장에 중요합니다. 중국사회과학원 학회는 인간이 동물 건강에 대한 관심을 점점 더 높임에 따라 이 분야 연구가 지속적으로 심화될 전망이라고 밝혔습니다.</div>
<small>보호자 소통 · MSN</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_30-수의-원격-진료와-디지털-접근성-확대"><b>수의 원격 진료와 디지털 접근성 확대</b></a>
<div>인도 Kashmir 지방에서 수의 원격 진료 서비스가 확산되면서 농촌 지역 축산 농가들의 진료 접근성이 크게 개선되고 있습니다. 이는 한국 동물병원에서도 참고할 만한 디지털 건강관리 모델입니다.</div>
<small>병원 경영 · Rising Kashmir</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_31-마이크-던-수의사-장학금-2026년-수상자-발표-7월-29일-신청-시작"><b>마이크 던 수의사 장학금 2026년 수상자 발표, 7월 29일 신청 시작</b></a>

<small>커리어 · DVM360</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_32-레드팜유와-천연추출물-복합-펫샴푸의-항균항진균항염-효과-연구"><b>레드팜유와 천연추출물 복합 펫샴푸의 항균·항진균·항염 효과 연구</b></a>
<div>반려 동물에서 흔한 피부 세균 및 진균 감염에 대응하기 위해 레드팜유와 네 가지 한약초 추출물을 혼합한 샴푸가 개발되었습니다. 이 연구는 천연물질 기반의 항균치료제가 항생제 내성 문제에 대안이 될 수 있는지를 확인했습니다.</div>
<small>임상 · Veterinary Sciences</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_33-소-Liver-Abscess-초기-항생제-투여가-장기-위험에-영향"><b>소 Liver Abscess, 초기 항생제 투여가 장기 위험에 영향</b></a>

<small>임상 · Frontiers in Veterinary Science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_34-수의학의-새로운-접근법-환자-전체를-고려하는-상황적-케어"><b>수의학의 새로운 접근법: 환자 전체를 고려하는 상황적 케어</b></a>

<small>병원 경영 · Veterinary Evidence</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_35-고양이-비침습-혈압-측정-침습-측정과-얼마나-일치할까"><b>고양이 비침습 혈압 측정, 침습 측정과 얼마나 일치할까?</b></a>

<small>임상 · Veterinary Evidence</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_36-BioCraft-세포배양-사료-성분-안전문서-공개수출-규제-대응-가속화"><b>BioCraft, 세포배양 사료 성분 안전문서 공개…수출 규제 대응 가속화</b></a>
<div>미국 BioCraft Pet Nutrition이 세포배양 기술을 활용한 사료 성분의 안전성 문서를 공개했습니다. 이는 향후 글로벌 수출 규제 심사를 통과하기 위한 핵심 과정으로 관심을 받고 있습니다.</div>
<small>임상 · Pet Food Processing</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_37-반려동물-보험-병원비-절약에-얼마나-효과적일까"><b>반려동물 보험, 병원비 절약에 얼마나 효과적일까?</b></a>

<small>보호자 소통 · TAPinto</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-21_39-콜로라도-고양이전용-수의원-Aurora에-신규-개원"><b>콜로라도 '고양이전용' 수의원 Aurora에 신규 개원</b></a>
