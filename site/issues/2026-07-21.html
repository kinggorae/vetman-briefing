<script id="vm-issue" type="application/json">{"date":"2026-07-21","dateLabel":"2026.07.21","dateline":"2026년 7월 21일 · 화요일","editionNo":"2,027","count":39,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"},{"key":"career","label":"커리어"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-07-21_1","day":"2026-07-21","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 소화선 종양 연관 급성 근무력증 1례","dek":"11세 페르시안 고양이에서 소화선 종양이 동반된 급속 진행성 근무력증이 발생하여 발병 4일 만에 사지마비로 진행된 사례가 보고되었습니다. 고양이에서 이러한 중증 근무력증은 매우 드물며 예후가 불량한 것으로 알려져 있습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/711","body":["획득성 근무력증은 아세틸콜린 수용체에 대한 자가항체가 원인인 신경근접합부 질환으로, 개에서는 잘 알려진 질환이지만 고양이에서는 보고가 드물며, 급속 진행되는 중증 사례는 예후가 불량한 것으로 알려져 있습니다. 이번 사례에서는 11세 중성화된 암컷 페르시안 고양이가 급성 후지 쇠약으로 내원하여 4일 만에 사지마비로 진행되었습니다.","초기 임상양상이 급성 다발성 신경근염과 유사하여 근전도검사를 실시한 결과 양전파파동과 근전섬유자극 전위가 관찰되었습니다. 영상진단 결과 거대식도 동반 없이 낭성 전종격동 종괴가 확인되었고, 호흡근 마비가 악화되어 좌측 늑간 개흉술을 통해 종양 적출술을 실시하였습니다. 수술 후 환자는 지속적인 호흡부전이 있어 재삽관 및 기계환기, 일시적 기관절개술이 필요하였으며, 조직병리 및 면역조직화학 검사로 소화선 종양이 확인되었습니다. 혈청 아세틸콜린 수용체 항체 역가도 현저히 상승하여 소화선 종양 연관 급성 근무력증으로 확정진단되었으나, 피리도스티그민과 프레드니솔론 치료에도 불구하고 환기는 의존적인 상태로 유지되어 수술 후 3일차에 안락사되었습니다.","한국 동물병원에서 이러한 사례를 접할 경우, 고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시켜야 하며, 특히 호흡근 마비의 조기 발견과 집중적인 환기 지원이 예후 결정에 중요함을 인식해야 합니다. 소화선 종양이 확인될 경우 종양 적출과 함께 면역억제 치료를 병행하되, 급속 진행 사례에서는 예후가 불량할 수 있음을 소유자에게 사전에 안내하는 것이 필요합니다."],"blog":"한국 동물병원 블로그에서는 고양이의 사지 쇠약 호발 시 감별진단으로서의 근무력증과 소화선 종양 선별의 중요성을 알리는 콘텐츠로 활용할 수 있습니다","blogAngle":["고양이 획득성 근무력증은 드문 질환이나, 소화선 종양이 동반된 중증 사례에서는 급격히 악화하여 사지마비와 호흡근 마비로 진행될 수 있습니다","발병 초기에는 급성 다발성 신경근염과 임상양상이 유사하여 감별진단이 어려울 수 있으며, 혈청 아세틸콜린 수용체 항체 검사와 영상진단이 중요합니다","소화선 종양 적출술 후에도 집중적인 환기 지원이 필요하며, 피리도스티그민과 프레드니솔론 등의 면역억제 치료에도 예후가 불량할 수 있습니다","호흡근 마비의 조기 인식과 신속한 진단, 집중적인 호흡기 관리가 치료 성공의 열쇠입니다"],"radar":{"owner":{"soon":true,"q":"고양이가 갑자기 다리가 약해지면 무슨 병 때문이에요?","script":"고양이가 갑자기 사지가 약해지는 경우는 여러 병이 있을 수 있어요. 그중 하나로 근육과 신경 사이 신호를 막아서 근육을 약하게 만드는 근무력증도 있답니다. 개에서는 흔한 병이지만 고양이에서는 드물고, 특히 진행이 빠르면 치료가 어렵답니다."},"clinical":"고양이에서 사지 쇠약이 급격히 진행될 때 근무력증을 감별진단에 포함시키고, 호흡근 마비 모니터링 및 환기 지원 준비 상태를 점검할 것","evidence":null},"tag":""},{"id":"2026-07-21_2","day":"2026-07-21","ts":1784520024000,"cat":"industry","kicker":"업계","isToday":false,"title":"AI 혈액도말 분석, 개 IMHA 진단 시간 획기적 단축","dek":"5세 터리어 믹스견이 황달과 빈혈 증상으로 내원했습니다. 전통적인 workflow에서는 수일이 걸리는 혈액도말 분석이, AI 분석기를 통해 수 시간 만에 완료되어 면역매개성 용혈성 빈혈(IMHA)이 확정 진단되었습니다.","source":"Veterinary Practice News","country":"미국","date":"07.20","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/Yogi-Hi-res-1-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/bringing-specialist-level-interpretation-in-clinic/","body":["평일 아침 만원인 동물병원에서 5세 터리어 믹스견 ‘요기'가 3일 동안 기력 없고, 구토하며 식사를 거부하는 증상으로 내원했습니다. 입을 벌리자 잇몸과 피부, 눈의 흰자위가 황달 색으로 변해 있었고, 심박수 160회/분으로 빈맥을 보여 신체적 스트레스가 의심되었습니다. 병원 내 혈액검사에서 빌리루빈과 간효소가 크게 상승했으며, 자동 혈구계산기에서 망상적혈구 증가, 중성구성 백혈구 증가증, 빈혈, 그리고 혈소판 감소 가능성을 보였습니다.","해당 동물병원은 Vetscan Imagyst®라는 AI 혈액도말 분석기를 보유하고 있었습니다. 1~3분 내에 AI는 디지털 도말을 분석하여 적혈구, 백혈구, 혈소판의 형태학적 이상을 체계적으로 보고했습니다. 그 결과, 수동 현미경 검사에서 발견하기 어려웠던 형태학적 이상 소견이 명확히 제시되었으며, Zoetis 위원회 인증 임상병리학 전문가의 추가 검토를 통해 수 시간 만에 IMHA 확정 진단이 내려졌습니다.","한국 동물병원 관점에서 이 사례는 중대한 시사점을 제공합니다. 많은 국내 병원에서 혈액도말 판독 전문가가 부족하고, 외주 검사 결과 대기 시간이 길어 진단이 지연될 수 있습니다. AI 분석기는 이러한 격차를 줄이고, 초기 검사를 바탕으로 신속한 치료 결정을 가능케 합니다. 또한 환자 보호자에게 도말 이미지를 보여주며 질환을 설명하면 진료 만족도 향상에도 도움이 됩니다."],"blog":"한국 동물병원 블로그에서는 ‘우리 병원에서도 도입 가능한 AI 진단 도구, 어떤 상황에서 도움이 되는가?’라는 주제로 클리닉 사례와 함께 소개하면 좋은 콘텐츠가 될 것입니다","blogAngle":["AI 혈액도말 분석은 수 시간 내 혈구 이상을 객관적으로 보고하여 신속한 진단을 가능케 합니다","IMHA와 같은 긴급 질환에서 치료 시작 시간 단축은 환자 예후에 직접적 영향을 미칩니다","AI 분석과 전문병리학 전문가 검토의 병행 모델이 정확도와 신뢰도를 높입니다","환자 보호자에게 형태학적 이상 소견을 시각적으로 보여주면 진료 설명과 신뢰 구축에 효과적입니다"],"radar":{"owner":null,"clinical":"AI 혈액도말 분석기 도입을 검토하고, 특히 황달·빈혈 환축에서 신속한 형태학적 분석이 필요한 경우 장비 활용도를 점검해 보세요.","evidence":null},"tag":""},{"id":"2026-07-21_3","day":"2026-07-21","ts":1784882978464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 발치 후 생체재료가 치조골 높이를 보존한다","dek":"개 대형 하악 치아 발치 후 신생 골점착제(RBA)가 치조능의 높이를 유의하게 보존한다는 다기관 연구 결과가 발표되었습니다. 기존 혈병 응고만으로 치유된 대조군 대비 12개월 후 설측 치조능이 약 2mm 더 높게 유지되어, 발치 후 골흡수 예방에 유효한 임상적 대안이 될 수 있습니다.","source":"Journal of the American Animal Hospital…","country":"","date":"07.21","read":"2분 읽기","plate":"Journal of the American Animal Hospital…","image":null,"sourceUrl":"https://doi.org/10.5326/JAAHA-MS-7542","body":["본 연구는 10개 동물병원에서 수의치과 전문의가 수행한 무작위 대조 임상시험으로, 대형 하악 치아 발치 환자 47마리(총 59개 발치 부)를 대상으로 하였습니다. 시험군은 발치 와동에 RBA를 치조골 연까지 충전하였고, 대조군은 자연 혈병 치유만 시행하였으며, 단기(6~12주) 및 장기(6~12개월) 추적 시점별로 컴퓨터단층촬영을 실시하여 치조능 높이를 측정하였습니다.","분석 결과, RBA 처리 부위는 단기 및 장기 추적 모두에서 치조능 높이의 회복과 보존에 통계적으로 유의한 차이를 보였으며(P\u003c.001), 장기 추적 시 설측 치조능 높이가 대조군 대비 약 2mm 더 높게 유지되었습니다. 이 생체재료의 점착 특성, 기계적 강도, 그리고 골전도성 덕분에 발치 와동이 골치유 과정에서 높이를 잃지 않고 유지될 수 있었습니다.","한국 동물병원에서 발치 후 임플란트 시술이나 치과 보철 계획 시 본 연구 결과를 참고할 수 있습니다. 다만 본 연구는 다양한 기관에서 수행되었으나 후향적 분석의 한계가 있으며, 표본 수가 제한적이므로 추가 전향적 연구가 필요합니다. 실제 임상 적용 시에는 해당 재료를 국내에서 수입·사용 가능한지 확인해야 합니다."],"blog":"반려동물 보호자에게는 발치 후 뼈가 줄어드는 것을 예방할 수 있는 최신 생체재료 치료 옵션이 있음을 안내하고, 임플란트나 보철 계획이 필요한 경우 수의 상담을 권유할 수 있습니다.","blogAngle":["다기관 무작위 대조 임상시험으로 개 대형 하악 치아 발치 59개 부위를 대상으로 RBA와 혈병 치유를 비교하였습니다.","RBA 처리 부위는 단기 및 장기 추적 모두에서 치조능 높이의 보존 효과가 통계적으로 유의하게 나타났다(P\u003c.001).","12개월 장기 추적 시 RBA 처리군이 대조군 대비 설측 치조능 높이를 약 2mm 더 유지하였습니다.","RBA의 점착성, 기계적 강도, 골전도성이 발치 와드의 골치유 과정에서 높이를 보존하는 데 기여하였습니다."],"radar":{"owner":null,"clinical":"발치 후 임플란트 시술 계획 시 신생 골점착제(RBA) 사용을 검토하되, 해당 재료의 국내 수입 가능성과 법적 사용 기준을 먼저 확인한다.","evidence":{"design":"무작위 대조 임상시험(후향적 분석)","n":"개 47마리(59개 발치 부)","stars":2,"note":"다기관 연구이나 후향적 분석의 한계가 있고 표본 수가 제한적이어서 일반화에 주의가 필요함"}},"tag":""},{"id":"2026-07-21_4","day":"2026-07-21","ts":1784882977464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개·고양이 refractory 감염각막염에서 Rose Bengal 광동력치료의 임상 성과","dek":"초기에 약물치료에 반응하지 않은 개와 고양이의 감염각막염 22안을 Rose Bengal 광동력치료(RB-PDAT)로 치료한 결과, 모든 안에서 각막 상피 치유가 확인되었습니다.","source":"Veterinary ophthalmology","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary ophthalmology","image":null,"sourceUrl":"https://doi.org/10.1111/vop.70218","body":["본 연구는 2024년 12월부터 2025년 9월까지 개인 동물병원에서 초기 약물치료에 실패한 14마리 개와 8마리 고양이(총 22안)를 대상으로 후향적으로 수행되었습니다. 0.1% Rose Bengal 용액을 이온투입법으로 적용한 후 520-525nm 녹색 레이저를 2분간 2사이클 조사(10.8 J/cm²)하는 방식으로 시술하였으며, 시술 후 국소 항생제 사용 횟수를 점진적으로 감량했습니다.","모든 안에서 30일 이내에 완전한 각막 상피 치유가 이루어졌으며, 개는 중앙값 9일, 고양이는 평균 14일이었습니다. 16안에서 양성 배양이 확인되어 30개의 균주(다제내성균 포함)가 동정되었고, 모든 환자에서 임상적 호전이 관찰되었습니다. 유의한 부작용은 발생하지 않았으며, 어떤 안에서도 추가적인 수술이 필요하지 않았습니다.","본 치료는 기존의 공격적 항생제 요법 의존도를 낮추고 수술 가능성을 줄일 수 있는 대안으로 제시됩니다. 그러나 후향적 설계에 따른 선택 편향과 표본 수의 한계가 있으므로, 더 큰 규모의 전향적 연구가 필요합니다. 다제내성균 감염 증례에서도 효과적이었다는 점은 항생제 내성 문제가 심각한 국내 동물의료 현장에서 의미 있는 치료 옵션이 될 수 있습니다."],"blog":"반려동물의 안과 감염이 약물치료로 잘 호전되지 않을 때, 레이저를 활용한 새로운 광동력치료 옵션이 있음을 보호자에게 안내할 수 있습니다.","blogAngle":["22안(개 14안, 고양이 8안) 모두에서 30일 이내 각막 상피 치유 달성","개는 중앙값 9일, 고양이는 평균 14일 소요","다제내성균을 포함한 30개 균주에서 임상적 호전","수술이 필요한 경우는 없었습니다"],"radar":{"owner":{"soon":true,"q":"우리 애가 각막염 약물치료가 잘 안 되는데, 레이저 같은 다른 치료 방법 없나요?","script":"최근 광동력치료라는 방법이 연구되고 있습니다. 초기 약물치료에 반응하지 않은 22안에서 30일 이내 완전한 치유가 확인되었는데, 다제내성균까지 포함되어 있었습니다. 다만 후향적 연구여서 더 큰 규모의 연구가 필요하긴 합니다."},"clinical":"항생제 내성이 의심되는 감염각막염에서 광동력치료 도입 가능성을 점검하고, 필요하다면 시행 가능한지 확인","evidence":{"design":"후향적 코호트","n":"22안 (개 14마리, 고양이 8마리)","stars":2,"note":"소규모 후향적 연구로 선택 편향이 있을 수 있어 전향적 검증이 필요합니다"}},"tag":""},{"id":"2026-07-21_5","day":"2026-07-21","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 가스트린종, 반복 수술과 혈청 가스트린 모니터링으로 장기 생존 사례","dek":"개의 Rare 종양인 가스트린종이 진단 시 이미 높은 전이율을 보이며 완치가 어려운 것으로 알려졌으나, 반복 수술과 혈청 가스트린 농도 모니터링을 통해 10년 이상 생존한 사례 2례가 보고되었습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/715","body":["가스트린종은 개의 췌장 비베타 세포에서 발생하는 Rare한 신경내분비 종양으로, 과도한 가스트린을 분비하여 위산 과다 분비를 유발합니다. 이 종양은 진단 시 이미 높은 전이율을 보이며, 수술적 완치가 어려운 것으로 알려져 있습니다. 현재까지 개의 가스트린종 수술 치료의 장기 예후에 대한 보고가 드물며, 질병 진행을 모니터링하는 확립된 방법도 없습니다.","이번 보고에서는 성견 2마리의 췌장 가스트린종을 수술적 절제로 치료한 사례를 소개합니다. 위산 과다로 인한 위장 증상은 양성자 펌프 억제제로 조절하였으며, 일차 종양과 전이 병소를 줄이기 위해 여러 차례 수술을 실시했습니다. 추적 관찰 기간 동안 혈청 가스트린 농도를 보조 모니터링 지표로 활용하였으며, 농도 변화를 바탕으로 추가 영상 검사를 시행하고 수술 결정에 참고했습니다. Case 1은 총 4회, Case 2는 총 3회의 수술을 받았으며, 두 마리 모두 위장 증상이 잘 조절되면서 장기 생존을 유지했습니다.","이 사례들은 개의 가스트린종에서 반복 수술이 종양량 감소와 증상 조절에 효과적일 수 있음을 보여줍니다. 특히 혈청 가스트린 농도의 변화가 재발이나 종양 진행을 조기에 포착하는 데 유용한 지표가 될 수 있다는 점을 시사합니다. 한국 동물병원에서는 가스트린종 의심 사례에서 수술 가능성을 고려하고, 추적 관찰 시 혈청 가스트린 농도 모니터링을 병행하는 전략을 검토할 수 있을 것입니다."],"blog":"가스트린종은 Rare하지만 한국의 동물병원에서도 의심 증상(만성 구토, 설사, 체중 감소)이 있는 환자에서 진단 가능하며, 혈청 가스트린 농도 모니터링과 수술적 치료 옵션을 가족에게 설명하는 근거 자료로 활용할 수 있습니다.","blogAngle":["개의 가스트린종은 진단 시 전이율이 높아 완치가 어렵지만, 수술적 절제가 장기 생존에 도움이 될 수 있습니다","혈청 가스트린 농도 변화가 종양 재발 및 진행 모니터링의 보조 지표로 활용 가능할 수 있습니다","반복 수술을 통해 일차 종양과 전이 병소를 감소시키면 증상 조절과 생존 기간 연장이 가능합니다","양성자 펌프 억제제는 가스트린종이 유발한 위산 과다 증상 조절에 중요한 약물 치료입니다"],"radar":{"owner":null,"clinical":"개의 가스트린종 의심 시 혈청 가스트린 농도 검사 가능성을 점검하고, 영상 추적 및 반복 수술 계획 수립을 사전에 검토하세요.","evidence":null},"tag":""},{"id":"2026-07-21_6","day":"2026-07-21","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 안와 종양 4례 분석: 수술적 치료와 보존적 치료 비교","dek":"개 안와 부위에 발생한 종양 4례를 후향적으로 분석한 연구에서, 수술적 적출술을 받은 3마리 중 2마리가 55개월 생존을 달성했으나, 종양의 유형과 범위에 따라 결과가 크게 달라졌음을 보고했습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"1분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/714","body":["개의 안와 종양은 상대적으로 흔하지 않지만 안구 돌출, 누액 과다, 제3안검선 선종 탈출 등의 증상으로 나타나며, 임상 검사만으로 초기 의심이 가능하고 전산단층촬영(CT)으로 종양의 위치와 범위를 파악한 후 조직검사로 최종 진단합니다.","이번 연구에서 확인된 종양은 골다발성 종양 2례, 염증성 근육아래세포종양 1례, 피지선암종 1례이었습니다. 3마리에게는 측안와 절개술과 부분 골절제술을 포함한 광범위 종양 적출술을 시행했고, 나머지 1마리에게는 보존적 치료를 실시했습니다. 수술을 받은 2마리의 생존 기간은 55개월이었던 반면, 보존적 치료를 받은 1마리는 4개월에 불과했습니다.","한국 동물병원에서 안와 종양 환자를 진료할 때는 CT 영상을 통한 정밀한 종양 범위 파악이 수술 계획에 필수적이며, 종양 유형에 따른 예후 차이를 소유자에게 충분히 설명하는 것이 중요합니다. 특히 종양 음성 절제연이 확인된 경우가 제한적이었으므로, 수술 가능성과 한계에 대한 현실적 기대치 설정이 필요합니다."],"blog":"한국 동물병원 블로그에는 안와 종양 의심 증상과 CT 진단의 중요성, 종양 유형별 예후 차이를 실제 사례와 함께 다룬 글감이 될 수 있습니다.","blogAngle":["6~8세 된 4마리 개의 안와 종양 사례를 분석했으며, 가장 흔한 임상 증상은 진행성 안구 돌출과 누액 과다였습니다.","3마리에게는 측안와 절개술을 포함한 광범위 종양 적출술을, 1마리에게는 보존적 치료를 실시했습니다.","수술적 치료를 받은 2마리의 생존 기간은 55개월이나, 조직학적으로 종양 음성 절제연이 확인된 경우는 1례에 불과했습니다.","보존적 치료를 받은 1마리의 생존 기간은 4개월에 불과했으며, 종양 유형과 범위에 따라 예후가 크게 달랐습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 눈이 많이 튀어나오고 눈물이 많은데, 혹시 안와 종양일 수 있을까요?","script":"안와 종양은 상대적으로 흔하지는 않지만 눈이 돌출되거나 눈물이 많이 나고 제3안검이 나오시는 증상이 있을 수 있습니다. 정밀한 검사와 CT로 종양 위치와 범위를 파악한 후 적절한 치료법을 결정하게 되세요."},"clinical":"안와 종양 의심 환자에게 CT 영상 분석을 포함한 정밀 검진과 함께 종양 유형별 예후 차이를 반드시 설명하고, 수술 가능성과 한계에 대한 현실적 기대치를 설정할 것","evidence":null},"tag":""},{"id":"2026-07-21_7","day":"2026-07-21","ts":1784332800000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 갑상선기능항진증 치료 중 혈구 수치로 TT4 추적 가능","dek":"루마니아 연구팀이 메티마졸 치료 중인 고양이 갑상선기능항진증에서 적혈구 용적치(Hct)와 평균적혈구용적(MCV)이 갑상선호르몬 수치(T4)와 강하게 상관함을 확인했습니다. 혈구 검사로 치료 효과 모니터링이 가능할 수 있다는 새로운 증거입니다.","source":"Veterinary Sciences","country":"","date":"07.18","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/706","body":["고양이 갑상선기능항진증은 노령묘에서 가장 흔한 내분비 질환입니다. 현재 표준 치료 모니터링은 총티록신(TT4) 검사로, 비용이 높고 접근성이 떨어지는 문제가 있습니다. 연구팀은 43마리의 일차성 갑상선기능항진증 묘를 대상으로 치료 전(Baseline), 치료 1개월, 3개월, 6개월 후 시점에서 적혈구 용적치(Hct), 혈색소(Hgb), 평균적혈구용적(MCV), ALT, TT4를 측정했습니다.","결과적으로 TT4는 Hct(r=0.875~0.943), MCV(r=0.907~0.964), Hgb(r=0.836~0.946), ALT(r=0.919~0.981)와 매우 강한 양의 상관관계를 보였습니다. 특히 개인묘 내에서 Hct(rmcorr r=0.873)와 MCV(rmcorr r=0.881)가 TT4 추적을 잘 반영했습니다. ROC 분석에서는 치료 3개월 후 Hct ≥35.2%가 최적 절단값으로 민감도 96.7%, 특이도 92.3%를 나타냈습니다. 치료 중단 후 혈구 수치는 치료 전 값으로 돌아갔으며, 이는 이 수치가 갑상선기능항진증의 병태생리를 반영함을 보여줍니다.","한국 동물병원 관점에서, 혈구 수치 모니터링이 TT4 검사를 완전히 대체하진 못하나 보완 도구로 활용될 수 있습니다. 특히 외래 방문 사이 간격이 길어 TT4 재검사가 지연될 때, Hct나 MCV 상승이 치료 통제 상실을 시사하는 신호가 될 수 있습니다. 혈액 검사만으로 갑상선 호르몬 변화를 추정할 수 있다면 비용 절감과 접근성 향상에 기여할 수 있을 것입니다."],"blog":"메티마졸 치료 중인 갑상선기능항진증 묘에서 정기 혈액검사 결과가 tt4 수치 변화의 간접 지표가 될 수 있음을 설명하는 클라이언트 교육 자료를 작성해보세요","blogAngle":["메티마졸 치료 중 Hct, MCV, Hgb, ALT가 TT4와 매우 강한 양의 상관관계(상관계수 0.8 이상)를 보였습니다","개인묘 내 추적에서 Hct와 MCV가 TT4 변화를 민감하게 반영했습니다","치료 3개월 후 Hct ≥35.2%일 때 민감도 96.7%, 특이도 92.3%로 치료 효과 판별에 유용했습니다","치료 중단 후 혈구 수치가 치료 전 값으로 복귀하여 이 지표의 특이도를 확인했습니다"],"radar":{"owner":{"soon":true,"q":"선생님, 고양이 갑상선 치료 중인데 혈구 검사만으로도 호르몬 상황 알 수 있어요?","script":"이번 연구에 따르면 적혈구 용적치()와 평균적혈구용적(MCV)이 갑상선 호르몬(T4)와 매우 강하게 연동돼요. 그래서 혈구 검사만으로 치료 효과를 간접적으로 볼 수 있는 단서가 될 수 있습니다. 다만 TT4 검사를 완전히 대신하진 못하고, 보완 도구로 활용하는 건 어떠실까요?"},"clinical":"고양이 갑상선기능항진증 외래에서 TT4 재검사 전, /MCV 수치 상승 여부를 함께 점검하여 치료 통제 상실 조기 탐지 고려","evidence":null},"tag":""},{"id":"2026-07-21_8","day":"2026-07-21","ts":1784882973464,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 귀염증 Pseudomonas aeruginosa의 항균제 저항성 위험성","dek":"헝가리에서 채집된 개 귀염증 관련 Pseudomonas aeruginosa 110개 분리주를 분석한 연구에서 다제내성 균주가 상당 비율을 차지하는 것으로 확인되었습니다. 전장유전체 분석을 통해 획기적 저항성 유전자들이 다수 검출되었으며, 이는 경험적 항생제 치료의 한계를 보여줍니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.21","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1902036/full","body":["개 귀염증은 개에서 흔히 발생하는 질환으로, 특히 만성·재발성·치료 저항성 증례에서 Pseudomonas aeruginosa가 주요 원인균으로 작용합니다. 이 균은 외막 투과성이 낮고 biofilm을 형성하며, efflux 시스템을 갖추고 있어 항생제에 대한 내성이 강합니다. 경험적 치료가 어려운 만큼 지역별 감시 데이터 확보가 중요합니다.","이번 연구는 부다페스트 수의과학대학에서 110개 분리주를 대상으로 14종 항생제 및 소독제에 대한 최소억제농도(MIC) 검사를 실시했습니다. 70개 균주는 전장유전체 분석에 의해 유전적 저항성 결정인자들이 분석되었으며, 다제내성 균주에서 획기적 내성유전자(CARD 데이터베이스 기준)가 다수 확인되었습니다.","한국 동물병원에서도 만성 귀염증 증례에서 P. aeruginosa 감수성 검사가 더욱 중요해질 것으로 보입니다. 특히 광범위 항생제 사용 경험을 가진 증례에서는 genomic 분석을 통한 맞춤형 치료 전략이 필요할 수 있습니다. 국내 동물 유래 P. aeruginosa의 저항성 현황에 대한 추가 조사가 기대됩니다."],"blog":"만성 귀염증 증례에서 P. aeruginosa 감염이 의심될 때 단순 항생제 처방 대신 감수성 검사 결과를 확인하는 진료 문화를 강조하는 블로그 글로 활용할 수 있습니다.","blogAngle":["개 귀염증 관련 P. aeruginosa 110개 분리주 중 다제내성 균주가 상당 비율 차지","14종 항생제·소독제에 대한 MIC 분포 및 임상적 해석 기준 적용","전장유전체 분석으로 획기적 저항성 유전자 다수 검출, Carbapenem 내성 유전자도 확인","경험적 치료 한계 드러내며, 감수성 검사 기반 치료의 필요성 강조"],"radar":{"owner":{"soon":true,"q":"강아지 귀염증이 오래되거나 재발하면 보통 어떤 약으로 치료해요?","script":"귀염증이 오래 지속되거나 재발하는 경우에는 단순한 경험적 치료만으로는 부족할 수 있습니다. 세균 배양 검사를 통해 어떤 세균인지, 어떤 약에 반응하는지 확인한 후 맞춤형 치료를 진행하는 것이 중요합니다."},"clinical":"개 귀염증 치료 프로토콜 재점검, 특히 만성·재발성 증례에서 세균배양 및 감수성 검사 시행 빈도 확인","evidence":null},"tag":""},{"id":"2026-07-21_9","day":"2026-07-21","ts":1784882972464,"cat":"clinical","kicker":"임상","isToday":false,"title":"개·고양이 자동바늘생검-site 미봉합시 장누출 위험 평가","dek":"자동 니들코어 장치로 실시한 전층 장 생검에서 바늘 구멍을 봉합하지 않아도 되는지를 검증한 연구가 발표되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.21","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1870783/full","body":["이 연구는 개의 전자동 바늘 생검 기구(16게이지)를 활용하여 개와 고양이 소장에서 전층 생검을 실시한 후, 바늘 구멍을 봉합하지 않고 방치한 상태에서 장내 압력에 대한 견고성을 평가했습니다.","연구는 시체(in vitro) 실험과 생체(in vivo) 실험으로 나뉘었습니다. 시체 소장 39개 구간에서 평균 초기 누출 압력(ILP)은 20.7 mmHg로, 정상 생리적 최대 압력인 25 mmHg 이하에서 누출이 발생했습니다. 반면 생체 12마리(개 8마리, 고양이 4마리)에서 측정한 평균 ILP는 85.66 mmHg로, 모든 측정값이 26 mmHg 이상이었습니다.","시체 모델은 생체와 달리 혈류 및 조직 탄력성이 없어 장 압력 평가에 부적합한 것으로 나타났습니다. 생체에서는 1.3 mm 크기의 작은 바늘 구멍이 즉시 봉합하지 않아도 생리적 최대 압력 이상을 견디지만, 장기 치유 과정은 이번 연구에서 평가되지 않아서 일상적인 봉합이 필요한지에 대한 최종 결론은 내리지 못했습니다."],"blog":"한국 동물병원에서는 개·고양이 소장 생검 시 미봉합 가능성을 임상적으로 검토하되, 환자 상태와 조직 치유력을 고려한 개별화 접근이 필요하다는 점을 블로그 글로 다룰 수 있습니다.","blogAngle":["시체 장 구간의 누출 압력은 평균 20.7 mmHg로 생리적 최대 압력보다 낮았습니다.","생체에서는 평균 85.66 mmHg의 누출 압력을 보여 모든 시료가 25 mmHg를 상회했습니다.","1.3 mm 크기의 미봉합 바늘 구멍은 즉시 조직 견고성을 유지하는 것으로 나타났습니다.","장기 치유 과정은 평가되지 않아서 미봉합의 장기적 안전성에 대한 추가 연구가 필요합니다."],"radar":{"owner":null,"clinical":"자동 바늘 생검 후 봉합 생략 가능성에 대해 임상 판단을 유보하되, 현행 프로토콜(봉합)을 유지하고 향후 추가 연구 결과를 모니터링한다","evidence":null},"tag":""},{"id":"2026-07-21_10","day":"2026-07-21","ts":1784882971464,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 직장 근수막외 형질세포종으로 간 전이 사례 – 멜팔란 치료 프로토콜 수정","dek":"미국에서 발생한 개의 직장 근수막외 형질세포종 사례가 Surgical excision 후 5개월 만에 간 전이로 발견되었으며, 치료 프로토콜을 수정한 펄스용량 멜팔란 요법으로 19개월 이상 생존을 연장한 사례가 보고되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.21","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1854150/full","body":["개에서 발생하는 근수막외 형질세포종(EMP)은 전체 개의 종양 중 약 2.4%를 차지하는 가장 흔한 형질세포 신생물입니다. 주로 피부(86%), 구강(9%), 직장(4%)에 발생하며, 피부와 구강에 발생한 EMP는 보통 양성으로 수술적 절제가 효과적입니다. 그러나 비피부 부위에서 발생한 EMP는 더 높은 악성 잠재력과 림프절 및 내장 전이 위험을 갖는 것으로 알려져 있습니다.","이번 사례는 10세 이상의 수컷 말티즈가 직장 EMP로 완전 절제 받았으나 5개월 후 다발성 간 형질세포종으로 재발한 경우입니다. 다발성골수종 증거 없이 간 전이만 확인되면서 펄스용량 멜팔란과 프레드니손 병용 요법을 시작하였으나, 골수억제 부작용으로 치료 프로토콜을 수정해야 했습니다. 멜팔란 투여 기간을 단축하는 방식으로 개별화한 결과, 초음파상 간 병변의 호전과 함께 진단 후 19개월 이상 생존을 달성했습니다.","한국 동물병원 관점에서 이 사례는 비피부 부위 EMP의 전이 가능성을 경고하는 동시에, 부작용 발생 시 치료 프로토콜의 유연한 조정이 가능함을 보여줍니다. 직장 EMP 수술 후 특히 간 전이에 대한 추적 관찰이 중요하며, 멜팔란 치료 시 골수억제 부작용 관리 전략이 필요할 수 있습니다."],"blog":"직장 종양 수술 후 발생한 간 전이 사례를 통해 비피부 EMP의 전이 가능성과 치료 프로토콜 개별화의 중요성을 강조하는 블로그 콘텐츠로 활용할 수 있습니다","blogAngle":["개의 EMP는 피부, 구강, 직장 등 주로 피부 근처에 발생하지만 비피부 부위는 전이 위험이 더 높습니다","직장 EMP 완전 절제 후 5개월 만에 다발성 간 전이가 발견된 사례가 보고되었습니다","골수억제 부작용으로 멜팔란 투여 기간을 단축하는 개별화 치료로 19개월 이상 생존 연장","비피부 부위 EMP 수술 후 장기적인 간 추적 초음파 검사가 권장됩니다"],"radar":{"owner":null,"clinical":"직장 근수막외 형질세포종 수술 후 비피부 부위 EMP의 전이 가능성을 고려하여 간 전이에 대한 추적 관찰 프로토콜을 점검하고, 멜팔란 치료 시 골수억제 부작용 관리 전략을 점검할 것","evidence":null},"tag":""},{"id":"2026-07-21_11","day":"2026-07-21","ts":1784580923000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"강아지 사회화, 평생의 자신감은 어린 시절부터","dek":"강아지 사회화는 평생의 성격과 행동 패턴을 결정하는 중요한 시기입니다. 특정 시기에 다양한 경험을 쌓는 것이 성견의 두려움과 자신감에 큰 영향을 미친다는 연구 결과가 있습니다.","source":"MSN","country":"","date":"07.21","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiqgFBVV95cUxQUzF6a3I1cHlsM1hqT1RfTjNwMHhOSHNFTk5KMG9iVWhmQkZLRWRpWkQ2b3hnSGJHVDY4Y0pvYW5oZE5wY0hnOWRhY0dac01JTjl6bEVrVzZhYlk4VHZKdVF1cUI2WHlDNFdtT0I3eU56SkQ0dV9HbENpTEE4NnlTSEZzcFBfMmFXaUNJc1MtNkhWcjB5UWVSRWNWbTFVbnIzb1o3dU9KTDNmQQ?oc=5","body":["강아지 사회화의 핵심 시기는 생후 3주부터 14주까지입니다. 이 기간 동안 강아지는 새로운 사람, 동물, 환경, 소음, 표면 등을 경험하며 긍정적인 기억을 형성합니다. 이 시기의 경험이 부족하면 성견 때 두려움이나 공격성으로 이어질 수 있어 전문가들이 중요하게 강조하는 부분입니다.","훈련사와 수의사는 사회화 시기 강아지가 다양한 자극에 노출되도록 안내해야 합니다. 새로운 경험을할 때 강아지가 두려워하지 않도록 긍정적이고 점진적인 접근이 필요하며, 보상 기반 훈련이 효과적입니다. 강아지뿐 아니라 보호자 교육도 중요한데, 과도한 보호나 부적절한 노출은 오히려 역효과를 줄 수 있습니다.","한국 동물병원에서도 사회화 상담의 기회를 활용할 수 있습니다. 첫 예방접종 시기에 보호자에게 사회화의 중요성과 방법을 안내하고,ospital 환경에 대한 긍정적 노출을 돕는다면 강아지뿐 아니라 보호자 역시 병원 방문에 대한 스트레스를 줄일 수 있습니다. 이는 병원 충성도 향상에도 기여할 수 있습니다."],"blog":"한국 동물병원 블로그에서 첫 예방접종 방문 시 보호자를 위한 사회화 가이드로 활용할 수 있는 콘텐츠입니다.","blogAngle":["강아지 사회화의 핵심 시기는 생후 3주에서 14주까지이며, 이 기간의 경험이 평생의 행동 패턴을 형성합니다.","긍정적이고 점진적인 새로운 경험 노출이 두려움 없는 성격 형성에 중요합니다.","보호자에 대한 교육도 사회화 성공의 핵심 요소입니다.","병원의 첫 방문을 긍정적 경험으로 만들면 강아지뿐 아니라 보호자의 병원 충성도도 높아질 수 있습니다."],"radar":{"owner":{"soon":true,"q":"강아지 사회화는 언제부터 어떻게 해야 하나요?","script":"생후 3주부터 14주까지가 가장 중요한 사회화 시기예요. 새로운 사람, 동물, 소음, 환경에 긍정적으로 노출시키는 것이 핵심인데, 강아지가 두려워하면 억지로 하지 말고 천천히, 맛있는 간식으로 이끌어보세요."},"clinical":"첫 예방접종 방문 시 보호자에게 사회화 방법과 병원 긍정적 노출을 함께 안내하여 병원 충성도와 진료 협조도 향상에 활용한다.","evidence":null},"tag":""},{"id":"2026-07-21_12","day":"2026-07-21","ts":1784417860000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"똑똑한 사회화 훈련으로 자신감 있는 강아지 키우기","dek":"강아지 사회적 훈련(socialization)의 중요성이 강조되고 있습니다. 적절한 시기에 올바른 경험을 쌓으면 성격이 안정되고 문제 행동도 예방할 수 있다는 전문가 의견이 주목받고 있습니다.","source":"MSN","country":"","date":"07.19","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiswFBVV95cUxOS19taHgtdlV4S2Y4TC1ra01zemhhbmtpclNVVFJmZmswYk1EdVFnRmVHMVR0ZU5PM3h6bXR1SEhTVUtkTDJSQWk4Q2hDaURfWFBxUWgxMmdpVmZLemZBWG9wUDA2UDRXc0pFU2xSMEo2blN5QWtoclZiQmthWFdjX01raEJzQ3VwVHBYTVhoYjhQTE5ISUFNS1E3TlRlMU9wXzdnbTBYaVNrNGIyNGwtM29iZw?oc=5","body":["강아지 사회화는 생후 3주에서 14주 사이에 가장 효과적이라는 연구 결과가 있습니다. 이 시기에 다양한 환경, 사람, 동물과 긍정적으로 접하게 하면 성격이 긍정적으로 발달하고 두려움을 줄일 수 있습니다. 다만 급격하거나 부정적인 경험은 오히려 역효과를 낳을 수 있어 주의가 필요합니다.","전문가들은 ‘노출(exposure)’과 ‘연상(association)’을 구분할 것을 권장합니다. 단순히 여러 환경을 보여주는 것뿐 아니라 각 경험을 긍정적으로 경험하게 만드는 것이 핵심입니다. treats와 칭찬을 활용하여 새로운 경험과 좋은 것을 연결시키는 것이 중요하며, 강아지의 속도를 맞춰주어야 합니다.","한국 동물병원에서도 사회적 훈련 관련 상담 요청이 증가하는 추세입니다. 수의사들은 예방의학적 관점에서 사회화의 중요성을 강조하며, 초기 문제 행동을 막기 위한 조기 개입의 필요성을 상담하고 있습니다. 특히 입원이나 진료 시 발생하는 스트레스를 줄이기 위해서도 평소 사회적 훈련이 도움이 된다는 점을 안내하고 있습니다."],"blog":"한국 동물병원 블로그에서 '첫 내원도 두려워하지 않아! 강아지 사회화 훈련으로 진료 스트레스 줄이기'라는 제목으로 사회적 훈련의 진료 편의를 위한 실천법을 소개하는 글을 쓸 수 있습니다.","blogAngle":["강아지 사회화 핵심기는 생후 3~14주이며, 이 시기의 경험이 평생의 성격에 영향을 미침","긍정적 연상을 위해 새롭고 경험할 때마다 간식과 칭찬으로 보상하는 것이 효과적","부정적 경험은 오히려 두려움을 키울 수 있어 급격한 노출은 피해야 함","사회적 훈련은 문제 행동 예방뿐 아니라 진료 시 스트레스 감소에도 도움이 됨"],"radar":{"owner":{"soon":true,"q":"강아지 사회화는 언제부터 시작하는 게 좋고, 어떻게 해야 할까요? 정신건강의학과 의사들이 강아지 사회화의 적절한 시기와 방법에 대해 설명할 때, 보호자들의 질문에 대해 명확하고 실용적인 조언을 제공해야 합니다. 특히 3주에서 14주 사이의 중요한 사회화 기간 동안 긍정적인 경험을 쌓는 것이 강아지의 성격 발달에 결정적입니다. 보호자들은 간식과 칭찬을 활용하여 새로운 경험을 긍정적으로 연결시키는 것이 중요합니다. 또한, 보호자들은 강아지의 편안함 수준에 맞춰 훈련 속도를 조절하고, 개별 강아지의 정서적 준비 상태를 존중하는 지지적이고 점진적인 사회화 접근을 안내하는 것이 필수적입니다. 어린 강아지를 키우고 있는데, 사회화 훈련을 전혀 안 시켜서 문제가 생길까요?","script":"사회화는 생후 3주에서 14주 사이에 가장 효과적으로 일어나기 때문에, 이 시기에 긍정적인 경험을 쌓는 것이 중요합니다. 아직 사회화를 못했다 하더라도 지금부터 천천히 긍정적으로 도입하면 도움이 됩니다. 진료를 받으러 올 때도 평소의 사회화 훈련이 스트레스를 줄이는 데 효과가 있으니, 노출과 연상을 구분해서 진행해보세요."},"clinical":"새로 강아지를 입양한 보호자에게 첫 방문 시 사회화 일정을 상담하고, 진료 스트레스 감소를 위한 가정 훈련 가이드 제공을 점검하세요.","evidence":null},"tag":""},{"id":"2026-07-21_13","day":"2026-07-21","ts":1784882968464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"탄자니아 농촌에서 지역사회 기반 개 광견병 예방접종 실행 평가","dek":"탄자니아 Mara 지역에서 무작위대조시험의 일환으로 지역사회 기반 지속적 개 예방접종(CBC-MDV) 접근법의 실행 과정을 사회인류학적 프레임워크로 평가했습니다.","source":"PLoS neglected tropical diseases","country":"","date":"07.21","read":"1분 읽기","plate":"PLoS neglected tropical diseases","image":null,"sourceUrl":"https://doi.org/10.1371/journal.pntd.0014091","body":["집중 계획 방식의 연례 예방접종 캠페인과 달리 분산된 지역사회 기반 지속적 예방접종 접근법의 실행 과정을 평가했습니다. Mara 지역의 RCT에 혼합방법 과정 평가를 통합하여 현지 실무자와 주민 대상 심층 면담, 지역 리더 대상 집단 면접, 비참여 관찰, 예방접종 활동 감사를 수행했습니다. 사회인류학적 5개 영역(환경적 맥락, 사회적 차이, 전략과 유인, 사회물질성, 거버넌스)을 따라 분석했습니다.","88%의 구성요소가 계획대로 수행되었으며, 우기·농사철, 학교 일정, 시장일, 장례식 등이 예방접종을 중단시켰습니다. 문화 축제와 사회적 지위는 전달을 저해했으나, 마을 규율과 광견병 위험 인식은 개선에 기여했습니다. 중앙 집단 전달 방식이 가가호호·수요 대응 방식보다 효과적이었으며, 수의관과 주민 리더의 밀착 감독이 실행을 도왔습니다.","지역사회 기반 광견병 예방접종은 탄자니아 농촌 지형에서 지역 백신 냉장 보관과 함께 배치될 수 있습니다. 주민 참여와 계획 수립에 대한 깊은 관여가 개 소유자의 참여 장벽을 해결할 수 있습니다. 단, 단일 지역 연구이며 RCT 내 과정 평가로 일반화에 한계가 있습니다."],"blog":"우리 지역에서도 지역사회 참여 형 예방접종 캠페인을 계획할 때 주민 논의에 참여시키는 것이 참여율 향상에 도움이 될 수 있습니다.","blogAngle":["탄자니아 Mara 지역 8개 마을에서 지역사회 기반 지속적 개 광견병 예방접종 접근법 실행 과정을 평가했습니다.","실무자가 계획한 구성요소의 88%를 성공적으로 전달했습니다.","우기, 농사철, 시장일 등 환경적 요인이 예방접종 접근성에 영향을 미쳤습니다.","중앙 집단 전달 방식이 가가호호 방식보다 효과적이고 실무자 부담이 적었습니다."],"radar":{"owner":{"soon":true,"q":"개 광견병 예방접종을 정기적으로 계속 맞혀도 되는 거예요?","script":"광견병 예방접종은 국내에서도 법적 의무로 정기적으로하셔야 합니다. 연구에서 지역사회 기반 예방접종이 효과를 보였다고, 한국의 경우는 동물 예방접종법대로 정기를 받으시는 게 중요합니다."},"clinical":"개 예방접종 안내 시 일정과 함께 사정(우기, 농사철 등)이 예방접종률에 영향을 줄 수 있음을 보호자에게 안내","evidence":{"design":"무작위대조시험 내 혼합방법 과정 평가","n":"설계 불명확","stars":3,"note":"단일 지역 연구여서 한국과 다른 사회문화적 맥락에 직접 적용하기 어렵고, RCT 내 과정 평가로 인한 선택편향 가능성"}},"tag":""},{"id":"2026-07-21_14","day":"2026-07-21","ts":1784882967464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 호산구성 각막염, 약물 종류에 따른 치료 성적 비교","dek":"고양이 호산구성 각막염에서 국소 스테로이드와 국소 칼시뉴린 저해제의 초기 치료 효과를 비교한 연구입니다. 두 약물군 모두 유의한 차이 없이 호전을 보였으나, 스테로이드군이 더 낮은 투약 빈도로 질병을 조절할 수 있었습니다.","source":"Veterinary ophthalmology","country":"","date":"07.21","read":"2분 읽기","plate":"Veterinary ophthalmology","image":null,"sourceUrl":"https://doi.org/10.1111/vop.70202","body":["2014~2022년에 호산구성 각막염으로 진단된 고양이 28마리(32안)를 대상으로 후향적 의무기록 분석을 실시했습니다. 임상 증상이나 세포학 검사 결과가 호산구성 각막염과 일치하고, 국소 스테로이드(CS) 또는 국소 칼시뉴린 저해제(CI)로 치료한 고양이를 포함했습니다.수의안과 전문의가 최소 2회 이상 검진했으며, 치료 약물 종류와 투약 빈도를 기록했습니다.","전체 28마리 중 17마리(61%)는 스테로이드, 11마리(39%)는 칼시뉴린 저해제로 치료받았습니다. 호전까지 걸린 중앙값 시간은 스테로이드군 19일, 칼시뉴린 저해제군 16일로 유의한 차이를 보이지 않았습니다( p>0.10). 최종 추적 중앙값 91일 시 질병 조절율은 스테로이드군 88%(15/17), 칼시류린 저해제군 55%(6/11)로 스테로이드군이 유의하게 높았습니다( p\u003c0.05). 하루 1회 이하 투약으로 조절된 비율도 스테로이드군 80%(12/15), 칼시류린 저해제군 33%(2/6)으로 유의한 차이를 보였습니다( p\u003c0.05).","이 연구는 후향적 단일기관 연구로 표본수가 적다는 한계가 있습니다. 두 약물 모두 초기 반응은 유사했지만, 국소 스테로이드가 더 낮은 투약 빈도로 질병을 효과적으로 조절할 수 있음을 시사합니다. 각막 궤양은 두 그룹에서 각각 71%, 91%에서 발생했으나 모두 치유되었고, 급성 수포성 각막병증이 각 그룹에서 1마리씩 발생했습니다. 임상 현장에서는 투약 편의성과 질병 조절율을 고려한 약물 선택이 필요합니다."],"blog":"고양이가 눈을 가려워하거나 눈물이 많이 나면 호산구성 각막염일 수 있으며, 대부분의 경우 약물 치료로 잘 조절되므로 지속적인 관리가 중요합니다.","blogAngle":["호산구성 각막염에 대한 국소 스테로이드와 칼시뉴린 저해제의 초기 호전 시간은 유의한 차이가 없었습니다(각각 19일, 16일).","질병 조절율(추적 중앙값 91일)은 스테로이드군 88%(15/17)가 칼시류린 저해제군 55%(6/11)보다 유의하게 높았습니다( p\u003c0.05).","하루 1회 이하 투약으로 질병 조절이 달성된 비율은 스테로이드군 80%, 칼시류린 저해제군 33%로 유의한 차이를 보였습니다( p\u003c0.05).","각막 궤양은 전체적으로 높은 발생율을 보였으나(71~91%), 모든 사례에서 치료와 관계없이 치유되었습니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이 각막염 치료할 때 스테로이드 연고와 칼시뉴린 저해제 중 어느 게 더 좋을까요?","script":"두 약물 다 초기 호전은 비슷하게 나타났습니다. 연구에 따르면 스테로이드가 더 낮은 투약 빈도로 질병을 잘 조절할 수 있었는데, 하루 1회 이하로 맞혀도 조절된 비율이 더 높았습니다. 다만 어떤 약이 절대적으로 좋다고 말하기는 어렵고, 각 동물마다 상황이 다르므로 진료 상황에서 같이 정해보겠습니다."},"clinical":"호산구성 각막염 진단 고양이에서 약물 선택 시 투약 편의성과 질병 조절율 모두 고려하되, 각막 궤양·급성 수포성 각막병증 등 부작용 발생 여부를 함께 모니터링할 것","evidence":{"design":"후향적 의무기록 분석","n":"고양이 28마리(32안)","stars":2,"note":"단일기관 후향적 연구로 표본수가 적고 대조군 무작위 배정이 없어 인과관계 해석에 주의가 필요함"}},"tag":""},{"id":"2026-07-21_15","day":"2026-07-21","ts":1784548804000,"cat":"clinical","kicker":"임상","isToday":false,"title":"말 MEED와 개 골종양 원인 규명 단서를 발견한 4학년 수의학생들","dek":"4학년 수의학 학생들이 말의 희귀 질환 MEED와 개 골종양의 병리 메커니즘에 관한 새로운 단서를 발견했습니다. 이는 수의학 교육에서 임상 연구 경험의 가치를 보여주는 사례입니다.","source":"Phys.org","country":"","date":"07.20","read":"1분 읽기","plate":"Phys.org","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMidEFVX3lxTE9feXdsb0MwaGFCUFJTNkJ2eTF4RVhQSWNYMGh6QmJvU25rdzNLTnk2YXN5TzEwMGtDVFNBdEF1bVJhWUp5NnVabTFZTUkyQXJ4RVRTLU9xVldFZlE4RzYxZXZuelhiNlpZbU5hQzNXSnpzUjJ0?oc=5","body":["MEED(Multisystemic Eosinophilic Epithelial Destruction)는 말이 발생하는 희귀한 전신성 피부 질환으로, 호산구성 염증과 상피층 파괴를 특징으로 합니다. 이번 연구는 4학년 수의학생들이 임상 실습 중 이 질환을 가진 말들을 집중적으로 관찰하고 병리 표본을 분석하면서 기존에 알려지지 않았던 발병 단서를 확인하게 되었습니다.","개 골종양, 특히 골육종(Osteosarcoma)은 개의 사지 특히 전지에 발생하는 악성 종양으로, 조기 진단이 어렵고 전이율이 높아 예후가 불량한 것으로 유명합니다. 학생들은 다양한 품종의 개에서 발생하는 골종양 조직을 분석하여 특정 유전자 변이나 단백질 발현 패턴의 차이를 발견했습니다.","한국 동물병원 관점에서 보면, 이 연구는 수의학 임상 실습의 가치를 환기시킵니다. 학교에서 기초 의학을 배운 학생들도 실제 임상 현장에서 중요한 발견을 할 수 있다는 점을 보여주며, 한국의 수의대들도 더 많은 임상 연구 기회를 학생들에게 제공해야 할 필요성이 있습니다. 또한 말 MEED와 개 골종양은 한국에서도 충분히 발생할 수 있는 질환이므로 이러한 연구 결과가 향후 진단과 치료에 도움이 될 것으로 기대됩니다."],"blog":"한국 동물병원 블로그에 '수의대 임상 실습의 가치: 학생들도 중요한 발견을 한다'라는 제목으로 학생 임상 교육의 중요성을 강조하는 글로 활용할 수 있습니다.","blogAngle":["4학년 수의학생들이 말 MEED의 발병 메커니즘에 관한 새로운 단서를 발견했습니다.","개 골종양 조직 분석을 통해 특정 유전자 변이와 단백질 발현 패턴의 차이를 확인했습니다.","임상 실습 중 학생들도 중요한 연구 결과를 산출할 수 있음을 입증했습니다.","한국 수의대에서도 임상 연구 기회를 확대할 필요가 있음을 시사합니다."],"radar":{"owner":null,"clinical":"개의 골종양(골육종) 의심 시 조기 발견을 위해 고령견의 사지 상태를 진료 시 반드시 확인하고, 필요시 영상진단 의뢰를 고려할 것","evidence":null},"tag":""},{"id":"2026-07-21_16","day":"2026-07-21","ts":1784882965464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 췌장 초음파, 연령과 체지방이 영상에 미치는 영향","dek":"이 연구는 개 췌장의 초음파 영상에서 연령과 체지방이 주관적·정량적 평가에 어떤 영향을 미치는지 분석하여 췌장 질환 진단의 객관성을 높이려는 목적을 가졌습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70208","body":["이 연구는 2016~2019년 복부 초음파를 받은 고객 소유 개 72마리를 대상으로 전향적으로 진행되었습니다. 연구진은 주관적 에코원성과 에코 질감을 평가하고, 췌장 및 복부 지방 두께를 측정했으며, 이미지 분석 소프트웨어를 통해 관심 영역에서 정량적 강도 및 텍스처 특성을 추출했습니다. 104명의 수의방사선 전문의가 병행 연구에서 합의 분류를 생성하여 검증을 수행했습니다.","평균 췌장 두께는 10.8mm(표준편차 3.1)였고 체중과 양의 상관관계를 보였습니다. 췌장 고에코원성은 드물었으며(8.3%). 정량적 췌장 강도는 연령과 연관되었습니다. 이질적 에코 질감은 흔했으며(43%), 주관적 평가에서 고연령과 낮은 탐촉자 주파수와 관련되었습니다. 정량적 텍스처 특성은 연령, 췌장 두께, 췌장 방향 및 탐촉자 주파수와 연관되었습니다.","이 연구는 췌장 이질성이 흔하며 연령과 연관되어 있다는 점을 보여줍니다. 그러나 72마리 단일 기관 연구로, 결과의 일반화에 한계가 있습니다. 따라서 한국 동물병원에서 췌장 초음파 판독 시 개체별 연령과 체형을 고려하고 기술적 변수를 통제하는 것이 중요합니다."],"blog":"반려견의 췌장 초음파에서 이질적 음영이 노령이나 체형에 따라 나타날 수 있음을 보호자에게 알려주시면 불필요한 검사를 줄이는 데 도움이 됩니다","blogAngle":["평균 췌장 두께는 10.8mm(SD 3.1)였으며 체중과 양의 상관관계를 보였습니다","췌장 고에코원성은 드물게 관찰되었으며(8.3%)","이질적 에코 질감은 43%의 개체에서 흔하게 나타났습니다","정량적 텍스처 특성은 연령, 췌장 두께, 방향, 탐촉자 주파수와 연관되었습니다"],"radar":{"owner":null,"clinical":"개 췌장 초음파 판독 시 환동물의 연령과 체형을 함께 고려하고, 탐촉자 주파수 등 기술적 변수를 기록하여 일관된 평가 프로토콜을 수립하는 것이 좋습니다.","evidence":{"design":"전향적 코호트","n":"개 72마리","stars":2,"note":"단일 기관 연구로 표본 수가 적어 결과의 일반화에 한계가 있으며, 대조군이 없어 인과관계 추론에 제약이 있습니다."}},"tag":""},{"id":"2026-07-21_17","day":"2026-07-21","ts":1784882964464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"뼈대 학습 재구성 MRI, 개 무릎 관절 영상 화질 향상","dek":"뼈대 학습 기반 재구성 기법을 무릎 관절 MRI에 적용하면 얇은 절편 두께로도 기존 영상보다 우수한 화질과 해부학적 구조 가시성을 얻을 수 있음을 확인했습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70189","body":["본 연구는 건강한 비글 8마리의 무릎 관절 MRI를 대상으로 전향적 비교 연구를 실시했습니다. 시상면 T2강조 지방 포화 시퀀스와 양성자 밀도 강조 지방 포화 시퀀스를 사용하여 기존 2mm 절편 영상(CON)과 뼈대 학습 재구성을 적용한 2mm, 1.5mm, 1mm 세 군을 비교했습니다.","양성자 밀도 강조 시퀀스에서 뼈대 학습 재구성 적용 모든 군이 기존 영상 대비 유의하게 높은 신호 대 잡음비를 나타냁으며, 구조 가시성(전방십자인대, 반월판, 뼈), 인지된 신호 대 잡음비, 전체 영상 화질 모든 항목에서 유의하게 높은 점수를 받았습니다. 특히 1mm 절편 군에서 전방십자인대 가시성이 가장 높았습니다.","임상적으로 뼈대 학습 재구성 MRI는 얇은 절편으로 세밀한 관절 내 구조 평가를 가능하게 하여 무릎 관절 질환의 진단 정확도를 높일 수 있습니다. 다만 건강한 비글 8마리의 소규모 연구로, 다양한 품종과 임상 환자에서의 추가 검증이 필요합니다."],"blog":"반려견 무릎 관절 질환이 의심될 때 뼈대 학습 재구성 MRI를 통해 더 얇은 절편으로 정밀한 영상을 얻어 전방십자인대 손상 등 관절 내 미세 손상을 조기에 발견할 수 있습니다","blogAngle":["건강한 비글 8마리의 무릎 관절 MRI에서 뼈대 학습 재구성 적용 영상이 기존 영상 대비 유의하게 높은 신호 대 잡음비를 보였습니다","전방십자인대, 반월판, 뼈의 구조 가시성과 전체 영상 화질이 모든 뼈대 학습 재구성 군에서 유의하게 향상되었습니다","1mm 얇은 절편에서도 2mm 기존 영상 이상의 전방십자인대 가시성을 달성했습니다","단일 기관 소규모 연구(8마리)이며 건강한 동물만 대상으로 하였다는 한계가 있습니다"],"radar":{"owner":{"soon":true,"q":"개 다리 절편은 게 MRI로 무릎 관절까지 자세히 볼 수 있어요?","script":"전방십자인대나 반월판 같은 관절 내 구조는 MRI가 가장 잘 보여줍니다. 뼈대 학습이라는 새로운 기법을 쓰면 더 얇은 절편으로도 선명한 영상을 얻을 수 있어서 작은 손상도 잘 찾을 수 있습니다. 다만 아직 건강한 개를 대상으로 한 연구 단계여서 실제 임상 환자에서는 아직 더 검증이 필요합니다."},"clinical":"MRI 사용 시 뼈대 학습 재구성 기법 적용을 검토하고, 전방십자인대 의심 환아에서 얇은 절편(1) 프로토콜 도입을 고려하세요.","evidence":{"design":"전향적 비교 연구","n":"비글 8마리","stars":2,"note":"건강한 비글만 대상으로 했고 품종·나이 다양성이 부족해 실제 임상 환자에게 그대로 적용하기엔 한계가 있습니다"}},"tag":""},{"id":"2026-07-21_18","day":"2026-07-21","ts":1784504098000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"호주 동물 입양률 40% 급락…주거 불안정 주요 원인","dek":"호주 최대 동물 입양 플랫폼 PetRescue가 입양률이 사상 최저 수준으로 떨어졌다고 발표했습니다. 6개월 동안 90%에서 50% 이하로 급락한 이 현상은 주거비 위기와 결합하며 유기 동물 증가로 이어질 전망입니다.","source":"Vet Practice Magazine","country":"호주","date":"07.20","read":"2분 읽기","plate":"Vet Practice Magazine","image":"https://www.vetpracticemag.com.au/wp-content/uploads/2026/06/pet-rescue.jpg","sourceUrl":"https://www.vetpracticemag.com.au/why-pet-adoption-rates-are-in-decline/","body":["PetRescue는 호주 최초의 전국 동물 입양 플랫폼으로 850개 이상의 동물 보호소와 구조단체, 수의사, 지방자치단체와 협력해 지난 20년간 100만 마리 이상의 동물 입양을 도왔습니다. 그러나 최근 입양 희망자가 급격히 줄어들면서 동물 보호 체계가 붕괴 위기에 직면하고 있습니다.","데이터에 따르면 입양률은 지난 6개월 동안 90%에서 50% 이하로 급락했으며, 이는 유기 가능성이 있는 약 10만 마리의 건강한 동물이 매년 안락사당할 수 있음을 의미합니다. 가장 큰 원인은 주거 불안정으로, 2020년부터 2025년 7월 사이 4,664건의 가정 재분양 신청 중 4,100건 이상이 주거 문제를 이유로 꼽혔습니다. 세대주들은 임대인이 애완동물 소유를 허용하지 않을 것으로 인식하고 있지만, 실제로 구조 동물은 중성화·예방접종·성격 평가가 완료된 경우가 많습니다.","한국 동물병원에서도 이 트렌드를 주목할 필요가 있습니다. 주거 불안정과 사육비 부담이 증가하는 상황에서 입양 문화 활성화는 동물 건강과 복지 증진에 기여할 수 있습니다. 수의사는 입양 고객에게 구조 동물의 장점을 설명하고, 지역사회 동물 보호 활동과의 연계 방안을 모색함으로써 사회적 역할을 확대할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '입양 vs 구매' 논쟁을 다루어 충분히 동물의 행동적·건강적 이점을 소개하고, 임대 거주 고객을 위한 사육 팁을 공유하는 콘텐츠를 제작해 볼 만합니다.","blogAngle":["호주 PetRescue 입양률이 6개월 동안 90%에서 50% 이하로 급락해 사상 최저 기록 수립","주거 불안정이 입양 실패 최대 원인…임대주택에서 애완동물 사육 제한이 주요 장애물","구조 동물은 중성화, 예방접종, 성격 평가가 완료되어 보호자 입장에서 예측 가능한 동물 기르기 가능","올해 약 10만 마리 건강한 동물이 입양률 하락으로 인해 안락사당할 위기 발생"],"radar":{"owner":{"soon":true,"q":"구조 동물 입양해도 건강하게 키울 수 있을까요?","script":"구조 동물도 예방접종과 중성화가 되어 있는 경우가 많아 건강하게 키울 수 있습니다. 하지만 입양 직후에는 기본 건강검진을 받고, 이전의 건강 이력을 확인하는 것이 좋습니다."},"clinical":"입양 동물 진료 시 과거 건강 이력(예방접종, 중성화 여부) 확인을 문진에 포함시키고, 보호자에게 구조 동물의 장점을 설명하는 상담 기회로 활용","evidence":null},"tag":""},{"id":"2026-07-21_19","day":"2026-07-21","ts":1784882962464,"cat":"clinical","kicker":"임상","isToday":false,"title":"개·고양이 전용 프로바이오틱스 시대 도래","dek":"반려동물 기능성 사료에 사용되는 프로바이오틱스의 최신 연구동향을 소개합니다. 기존 범용 제품에서 특정 종 맞춤형으로 발전하는 추세와 한국 동물병원에서의 활용 방안을 다룹니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.21","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1881134/full","body":["전 세계 반려동물 산업이 급속히 성장하면서 단순한 영양 공급을 넘어 건강 간섭으로 발전하고 있으며, 기능성 사료가 산업 성장을 이끄는 핵심 동력으로 부상하고 있습니다. 프로바이오는 안전성과 무독성, 다중 건강 조절 장점을 갖춘 가장 널리 사용되는 기능성 소재로, 개와 고양이의 설사, 변비, 염증성 장질환 등 소화기 장애를 완화하는 것으로 보고되고 있습니다.","개와 고양이의 장 건강, 장벽 기능, 면역 조절, 대사 항상성 유지를 위해 프로바이오틱스가 활용되며, 만성 신장 질환, 비만, 알레르기, 구취 완화에도 효과가 있습니다. 현재 연구에서는 숙주 특이성 부족, 엄격한 임상시험 부족, 가공 안정성 문제 등이 도전 과제로 제시되고 있으며, 향후 정밀 프로바이오틱스 개발이 방향으로 제시되고 있습니다.","한국 동물병원에서 기능성 사료를 처방하거나 추천할 때, 개와 고양이의 종 특이적 미생물군을 고려한 맞춤형 프로바이오틱스 선택이 중요해졌습니다. 임상 현장에서는 단순 장 건강 개선을 넘어 대사 질환이나 만성 질환 관리에도 활용 가능하며, 향후 국내에서도 종 특이적 프로바이오틱스 제품군이 확대될 것으로 기대됩니다."],"blog":"\"우리 집 고양이가 최근 설사를 자주 하는데, 사료에 프로바이오틱스가 도움이 될까요?\"라는 보호자 질문에 한국 동물병원 블로그에서 과학적 근거와 함께 답변하는 콘텐츠로 활용할 수 있습니다","blogAngle":["반려동물 기능성 사료 시장이 성장하며 프로바이오틱스 활용이 급증하고 있습니다","개와 고양이마다 장내 미생물군이 다르므로 숙주 특이적 프로바이오틱스 개발이 필요합니다","현재 임상시험 부족과 가공 안정성 문제가 프로바이오틱스 적용의 과제로 남아 있습니다","소화기 질환 외 비만, 신장 질환, 알레르기 등 다양한 질환 관리에도 프로바이오틱스 활용이 연구되고 있습니다"],"radar":{"owner":{"soon":true,"q":"개 사료나 고양이 사료에 프로바이오틱스가 들어있는데, 우리 강아지/고양이에게 맞는 건가요?","script":"개와 고양이의 장 속 미생물 군집은 서로 다르기 때문에, 프로바이오틱스도 종에 맞게 선택해주는 것이 중요합니다. 최근에는 개 전용, 고양이 전용 제품을 개발하는 추세이며, 단순히 많이 넣는 것보다 종 특성을 고려한 제품이 더 효과적이라고 알려져 있습니다."},"clinical":"자사 처방 사료의 프로바이오틱스 종류와 종 특이성을 확인하고, 보호자에게 처방 시 해당 근거를 설명할 수 있도록 점검","evidence":null},"tag":""},{"id":"2026-07-21_20","day":"2026-07-21","ts":1783638000000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 전십자 인대 파열수술, TPLO와 TTA 관절염 진행은 어떤 것이 더 나은가?","dek":"개의 전십자 인대 파열수술 시 TPLO와 TTA 중 어느 수술법이 수술 후 관절염 진행을 줄이는지에 대한 연구를 분석했습니다. 현재 증거로는 아직 확립된 결론이 없다고 합니다.","source":"Veterinary Evidence","country":"","date":"07.10","read":"2분 읽기","plate":"Veterinary Evidence","image":null,"sourceUrl":"https://veterinaryevidence.org/index.php/ve/article/view/749","body":["개의 전십자 인대 파열은 canine orthopedic 가장 흔한 질환 중 하나로, 주요 수술법으로 TPLO(tibial plateau levelling osteotomy)와 TTA(tibial tuberosity advancement)가 널리 사용됩니다. 두 방법은 모두 안정성을 회복시키지만, 장기적으로 관절염이 얼마나 진행하느냐가 수의사들의 주요 관심사다. 기존에 발표된 임상 연구들이 상반된 결과를 보고해온 점이 있었습니다.","이번 분석에서는 총 3편의 연구를 검토했습니다. 첫 번째 전향적 무작위 임상시험에서는 TTA가 6개월 추적에서 TPLO보다 관절염 진행이 적었으나, 두 번째 전향적 무작위 대조 임상시험에서는 오히려 TPLO 후 관절염이 적었다고 보고했습니다. 세 번째 후향적 코호트 연구에서는 TTA 그룹에서 TPLO 그룹보다 관절염 점수가 유의하게 증가했다고 밝혔으나, 흥미롭게도 양 그룹 간 차이가 유의하지 않은 경우가 대부분이었습니다. 연구들 모두 대조군 부재, 작은 표본 크기, 짧은 추적 기간, 블라인드 부족 등의 한계가 있었습니다.","한국 동물병원 관점에서 보면, 아직까지 TPLO와 TTA 중 관절염 진행 측면에서 우월한 수술법을 확정하기 어렵습니다. 수의사는 개별 환자의 상태(체중, 활동 수준, 동반 손상 등)를 고려해 수술법을 선택해야 하며, 수술 후 rehabilitation과 관리도 관절염 진행에 중요한 요소다. 향후 더 대규모의 장기 추적 연구가 필요하며, 수술법 선택 시에는 최신 증거와 임상 경험을 종합적으로 판단하는 것이 현명할 것입니다."],"blog":"한국 동물병원 블로그에서는 '전십자 인대 파열수술 후 관절염, 예방하려면?'이라는 제목으로 수의사와 보호자 모두를 위한 재활 관리 팁을 공유하는 글을 작성해 볼 만합니다.","blogAngle":["TPLO와 TTA 모두 전십자 인대 파열에 유효한 수술법으로 사용되지만, 관절염 진행 감소 측면에서의 우월성은 아직 확립되지 않았습니다.","3편의 연구 중 2편에서 그룹 간 차이가 유의하지 않았으며, 한 연구에서만 TTA가 TPLO보다 관절염 점수가 높았다고 보고했습니다.","모든 연구들은 표본 크기가 작고 추적 기간이 짧으며 방법론적 한계가 있어 결과 해석에 주의가 필요합니다.","수술법 선택 시에는 개체의 개별 상황(체중, 연령, 균형, 동반 병변 등)을 고려하고 장기적 예후를 평가해야 합니다."],"radar":{"owner":{"soon":true,"q":"선생님, 개 전십자 인대 파열 수술할 때 TPLO랑 TTA 중에 뭐가 관절염 더 안 일어나는 거예요?","script":"아직 연구들이 하나로 정해지지 않았고, 각기 다른 결과를 보이고 있어요. 어느 수술이 관절염을 더 적게 일으킨다 확정적으로 말씀드리기는 어려워요. 다만 개의 몸무게, 활동 수준, 다른 질환 유무를 고려해서 가장 적합한 방법을 정하는 게 중요해요."},"clinical":"TPLO와 TTA 수술 후 관절염 진행을 체계적으로 모니터링하는 추적 시스템을 점검하고, 수술법 선택 시 개체별 상태(체중, 활동 수준, 동반 손상)를 반영한 개별화 수술 계획을 수립한다.","evidence":null},"tag":""},{"id":"2026-07-21_21","day":"2026-07-21","ts":1780959600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 무릎 수술 통증관리: 신경마비 차단 대 경막외 마취 어떤 게 더 효과적인가","dek":"6개 무작위 대조 임상시험을 분석한 연구에 따르면, 개 무릎 관절 수술에서 신경마비 차단이 경막외 마취의 효과적인 대안으로 사용될 수 있으며, 특히 잔류 마비 발생률이 더 낮은 것으로 나타났습니다.","source":"Veterinary Evidence","country":"","date":"06.09","read":"1분 읽기","plate":"Veterinary Evidence","image":null,"sourceUrl":"https://veterinaryevidence.org/index.php/ve/article/view/736","body":["개 무릎 관절 수술에서 통증 관리를 위해 경막외 마취(EPID)와 국소 신경차단(locoregional nerve blocks)을 비교한 6개의 전향적 무작위 대조 임상시험이 분석되었습니다. 모든 연구에서 신경차단 방법이 일관된 성공률을 보인 반면, 2개의 연구에서 경막외 마취가 실패한 사례가 보고되었습니다.","세부적으로는 경막외 부피바카인이 수술 중 통증 조절은 더 뛰어났지만 구제 진통제가 더 많이 필요한 반면, 대퇴신경과 좌골신경 차단(F+S)은 부피바카인으로 요축류 발생률이 더 낮았습니다. 또한 복재신경과 좌골신경 차단(SSNB) 집단은 경막외 집단보다 수술 후 4시간과 8시간에서 통증 점수가 더 낮았고, 요추신경총과 좌골신경 차단(LPS)은 운동 기능의 조기 회복을 가능케 했습니다.","한국 동물병원 관점에서 보면, 무릎 수술 시 신경차단 방법이 경막외 마취의 대안으로 충분한 효과를 제공하면서도 잔류 마비 위험을 줄일 수 있다는 점이 중요합니다. 특히 요축류와 운동 기능 회복 측면에서 신경차단이 우위할 수 있어, 개별 환자의 상태에 따라 방법 선택이 달라질 수 있습니다."],"blog":"한국 동물병원 블로그에서는 TPLO 같은 무릎 수술 후 통증 관리 옵션으로, 경막외 마취 대신 신경차단을 선택하는 전략과 그 임상적 이점을 다루는 글이 좋은 반응을 얻을 수 있습니다.","blogAngle":["6개 전향적 무작위 대조 임상시험 분석 결과, 신경차단과 경막외 마취는 유사한 수술 중 진통 효과를 보였습니다","2개 연구에서 경막외 마취 실패가 보고된 반면, 신경차단은 모든 연구에서 일관된 성공률을 보였습니다","복재신경-좌골신경 차단은 경막외 마취보다 수술 후 4~8시간 통증 점수가 낮았습니다","신경차단은 경막외 마취 대비 요축류 발생률↓, 운동 기능 조기 회복이라는 장점이 있습니다"],"radar":{"owner":{"soon":true,"q":"무릎 수술할 때 경막외 마취보다 신경차단 방법이 더 좋나요?","script":"연구에 따르면 신경차단 방법이 경막외 마취의 효과적인 대안으로 사용될 수 있고, 특히 잔류 마비 발생률이 더 낮은 것으로 나타났습니다. 다만 방법마다 장단점이 있어 수술 종류와 개별 환자의 상태에 따라 가장 적합한 방법을 선택합니다. 수술 전 진료실에서 상담해 보시면 좋겠습니다."},"clinical":"무릎 관절 수술 시 신경차단(LPS, F+S, SSNB 등)을 경막외 마취 대안으로 고려하되, 각 환자의 상태에 따라 방법을 개별화하고 수술 후 통증 점수와 운동 기능 회복을 점검할 것","evidence":null},"tag":""},{"id":"2026-07-21_22","day":"2026-07-21","ts":1784596623000,"cat":"clinical","kicker":"임상","isToday":true,"title":"캔버라 수의사 경고...'레고·백합' 섭취 급증, 보험금 1천300만원 달해","dek":"호주 캔버라의 수의사가 반려동물들이 레고 블록부터 백합에 이르기까지 다양한 물체를 삼키는 사례가 급증하고 있으며, 관련 보험 청구 금액이 최대 1만3천500호러달(약 1천300만원)에 달한다고 경고했습니다. 백합은 고양이에게 치명적인 신독성을 유발할 수 있어 특히 주의가 필요합니다.","source":"Region Canberra","country":"","date":"07.21","read":"1분 읽기","plate":"Region Canberra","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMixAFBVV95cUxNcHZ5SVZqU2dBVmpxVEQzdWJENTlDOGNtODNBbXpRU0gweXBHXzQzd2syS2hwZ2dlNWN3MklVM1pDS0s1RHZsOWQ1czZxd3RCS0RpRkhrQVU5cVZiZVpBWG80QmxzalBadDRkVXpjaXh3UE9mQWIzYklFUDg5cngxLV8zc29kZDQyV1FDVDRSckpfaWs0cUNUUzhEc1kzanlkM3M1Z3hkOUtmdU42TVM2Y3dSMC1vbm83RXJMWEFBRVE2NktZ?oc=5","body":["캔버라의 Russell William 수의사는 최근 집 Pets이 Lego 블록, 장난감 부품, 식물 등 이물질을 삼키는 사고가 급증하고 있다고 밝혔습니다. 그는 10년 전과 비교해 이러한 사례가 현저히 증가했으며, 특히 강아지에서 장난감 파편 섭취가 흔하다고 설명했습니다. 이는 반려동물 보험 청구 증가로 이어지고 있습니다.","보험 회사 데이터에 따르면 이물질 섭취 관련 보험 청구의 최대 금액은 1만3천500호러달(약 1천300만원)에 달했습니다. 특히 백합(Lily)은 고양이에게 극도로 위험한 식물로, 꽃가루나 잎을 섭취할 경우 심각한 신장 손상을 유발할 수 있습니다. 수의사는 백합을 집안에서 기르거나 선물받는 것 자체를 피할 것을 권고하고 있습니다.","한국 동물병원에서도 강아지·고양이의 이물질 섭취 진료 사례가 지속적으로 보고되고 있습니다. 소유주들에게 장난감 파편, 가정용 식물, 작은 물체 등의 위험성을 사전에 안내하고, 백합 등 유독 식물에 대한 경각심을 높이는 것이 중요합니다. Blogs나 sns를 통한 예방 교육 콘텐츠가 효과적입니다."],"blog":"한국 동물병원 블로그나 sns에 '집에서 키우면 안 되는 위험한 식물' 리스트와 '강아지·고양이가 삼키기 쉬운 물체 5가지' 같은 예방 콘텐츠를 작성하면 좋습니다.","blogAngle":["캔버라 수의사, 이물질 섭취 관련 보험 청구 최대 1천300만원 급증 경고","강아지 Lego·장난감 파편, 고양이 백합 섭취가 주요 원인","백합은 고양이에서 신독성 유발, 꽃가루만으로도 위험","한국 병원에서도 이물질 섭취 진료 증가 추세, 예방 교육 필요"],"radar":{"owner":{"soon":true,"q":"강아지가 장난감 부품을 먹었는데 수의 확인이 필요한가요?","script":"장난감 조각을 먹었을 때 증상이 없어도 위장관 내 문제가 있을 수 있어 수의 검사가 필요합니다. 구토, 식욕 감소, 변비 등이 나타나면 반드시 내원해 주세요."},"clinical":"이물질 섭취 진료 프로토콜에 위내시경 필요성 판단 기준을 점검하고, 장난감 파편 섭취 고위험 강아지 목록을 확보해 두세요.","evidence":null},"tag":""},{"id":"2026-07-21_23","day":"2026-07-21","ts":1784882958464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"슬로베니아·체코 고양이 톡소플라즈마·FIV 공동감염율 4.8%, 임상증상 발생률 높아","dek":"슬로베니아와 체코 공화국에서 함께사는 고양이 105마리를 대상으로 톡소플라즈마와 FIV 항체를 조사한 결과, 두 감염 모두 임상증상과 유의한 연관성을 보였습니다.","source":"Acta parasitologica","country":"","date":"07.21","read":"1분 읽기","plate":"Acta parasitologica","image":null,"sourceUrl":"https://doi.org/10.1007/s11686-026-01334-w","body":["톡소플라즈마와 FIV는 고양이에서 면역억제를 유발할 수 있어 기회감염 위험을 높일 수 있습니다. 유럽에서 자연적 공동감염에 대한 자료가 부족하여, 슬로베니아와 체코 공화국 수의원과 보호소에서 고양이 105마리를 대상으로 ELISA로 톡소플라즈마 항체, 면역크로마토그래피 테스트로 FIV 항체를 각각 검출했습니다.","톡소플라즈마 항체는 18.1%, FIV 항체는 10.5%, 공동감염은 4.8%에서 검출되었습니다. 톡소플라즈마 양성은 어린 나이, 개인 소유 고양이, 임상증상 있는 동물에서 유의하게 높았습니다. FIV 양성은 수컷, 어린 나이, 개인 소유 고양이에서 더 흔했습니다. 톡소플라즈마 또는 FIV 양성 고양이는 음성 고양이보다 임상증상이 훨씬 자주 나타났습니다(68% vs 35%, p=0.0036).","본 연구는 유럽 중앙부에서 고양이의 톡소플라즈마와 FIV 공동감염 실태를 처음으로 보고했습니다. 표본 수가 105마리로 제한적이고 혈청학적 검사만 수행했다는 한계가 있으나, 임상증상을 보이는 고양이에서 두 감염을 함께 검사할 필요가 있음을 시사합니다. 특히 길고양이나 면역력이 약한 고양이를 진료할 때 두 병원체 모두 선별하는 것이 권장됩니다."],"blog":"보호자분들께서는 특히 어린 고양이나 여러 고양이를 함께 키우는 경우, 임상증상이 있다면 톡소플라즈마와 FIV 모두 검사해보시는 것을 권장합니다.","blogAngle":["슬로베니아·체코 공화국 고양이 105마리 중 톡소플라즈마 항체 양성율 18.1%, FIV 항체 양성율 10.5%","공동감염율은 4.8%로, 톡소플라즈마 또는 FIV 양성 고양이가 음성 고양이보다 임상증상 발생률이 약 2배 높음(68% vs 35%)","톡소플라즈마 양성은 어린 나이와 개인 소유 고양이에서, FIV 양성은 수컷에서 더 흔하게 나타남","표본 수가 105마리로 제한적이고 단면 연구라는 한계가 있어 결과 해석에 주의 필요"],"radar":{"owner":{"soon":true,"q":"고양이에게 설사나 기침 같은 증상이 있으면 톡소플라즈마와 FIV 검사를 함께 받아야 하나요?","script":"연구에 따르면 톡소플라즈마나 FIV에 걸린 고양이가 임상증상을 보이는 비율이 훨씬 높았습니다. 특히 증상이 있는 고양이에서는 두 병원체를 함께 검사해보는 것이 권장됩니다. 정확한 진단은 병원에서 검사를 받아야만 확인할 수 있습니다."},"clinical":"임상증상이 있는 고양이 진료 시 톡소플라즈마와 FIV 선별 검사를 함께 고려하고, 특히 길고양이나 면역력이 약한 고양이에서 우선적으로 검진한다.","evidence":{"design":"단면조사","n":"고양이 105마리","stars":2,"note":"단일 지역에서 표본 수가 적고 혈청학적 검사만 수행되어 실제 감염 확인에는 한계가 있다."}},"tag":""},{"id":"2026-07-21_24","day":"2026-07-21","ts":1784882957464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 유방암 수술에서 CBD/THC 유지류 유분의 진정 및 마약절감 효과","dek":"중견 이상의 암컷 개가 유방절제술 및 양측난소자궁적출술을 받는 동안 전처치한 CBD/THC 유지류 유분이 진정 효과를 보이고(propofol 2.33 vs 5.98 mg/kg, p=0.001) 마취제를 절감할 수 있음을 확인했습니다. 이는 수의학에서 다중 마취 프로토콜에서 카나비노이드 활용 가능성을 보여줍니다.","source":"Veterinary research communications","country":"","date":"07.21","read":"2분 읽기","plate":"Veterinary research communications","image":null,"sourceUrl":"https://doi.org/10.1007/s11259-026-11367-1","body":["본 연구는 유방종양을 가진 중견 이상의 암컷 개 20마리를 대상으로 일측 유방절제술 및 양측난소자궁적출술을 받는 동안 전처치한 전체-spectrum cannabis oil(FSCO)의 진정 효과와 마약절감 효과를 평가했습니다. FSCO는 7일간 하루 2회 경구 투여하고 마취 1시간 전에 추가 투여했습니다. 대조군과 처치군 간 연령(9.6 vs 10.2세)과 체중(7.4 vs 6.8kg)은 유사했습니다.","FSCO 처치군은 대조군보다 propofol 필요량이 유의하게 적었습니다(2.33 vs 5.98 mg/kg, p=0.001). sevoflurane 농도는 T0부터 T4까지 모든 시점에서 유의하게 낮았습니다(p\u003c0.05). 진정 점수는 40분(중앙값 4 vs 0, p=0.015)과 60분(중앙값 6.5 vs 0.5, p=0.002)에서 처치군이 유의하게 높았습니다. 구제진통제는 처치군 3/10마리, 대조군 6/10마리로 통계적 유의성은 없었으나(p=0.178) 감소 추세를 보였습니다. 카테터 삽관, 기관내 삽관, 부작용에서 두 군 간 차이는 없었습니다.","본 연구는 단일기관에서 20마리 소규모로 수행되어 결과의 일반화에 한계가 있으나, 카나비노이드를 마취 전 처치로 활용할 때 진정 효과가 있고 마취제 필요량을 줄일 수 있음을 보여줍니다. 특히 노령·질병이 있는 개에서 마취 위험을 낮추는 보조제로서 잠재적 가치를 가집니다. 추후 더 많은 표본수로 다기관 연구가 필요합니다."],"blog":"노령 견이나 만성 질환이 있는 강아지의 수술에서 마취 위험을 낮추고 싶다면, 수술 전 카나비노이드 보충제가 진정 효과를 도와 마약을 줄일 수 있다는 최신 연구 결과를 보호자에게 안내할 수 있습니다.","blogAngle":["FSCO 처치군에서 propofol 필요량이 대조군 대비 약 61% 감소했습니다(2.33 vs 5.98 mg/kg, p=0.001).","sevoflurane 유지 농도가 수술 전체 기간(T0~T4)에 걸쳐 유의하게 낮았습니다(p\u003c0.05).","진정 점수는 마취 후 60분에 처치군이 대조군 대비 약 13배 높았습니다(중앙값 6.5 vs 0.5, p=0.002).","카테터 삽관, 기관내 삽관, 부작용 발생에서 두 군 간 차이가 없어 안전성을 확인했습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지도 수술할 때 카나비노이드 같이 쓰면 마취량 줄일 수 있어요?","script":"카나비노이드는 진정 효과가 있고 마취제를 줄일 수 있다는 연구가 있지만, 아직 개에서 안전한 용량과 방법은 더 연구가 필요합니다. 또한 한국의 카나비노이드 규제 상황을 확인해야 하고, 실제 사용은 수의사와 충분히 상담한 후 결정해야 합니다."},"clinical":"마취 프로토콜에 카나비노이드 보조 사용 가능성을 점검하되, 현 시점에서는 신중하게 접근하고 향후 더 큰 규모의 연구 결과를 확인하는 것이 좋습니다.","evidence":{"design":"전향적 무작위대조시험","n":"개 20마리","stars":2,"note":"단일기관 소규모 연구로 일반화에 주의가 필요하며, 구제진통제 사용 감소는 통계적 유의성이 없었습니다."}},"tag":""},{"id":"2026-07-21_25","day":"2026-07-21","ts":1784882956464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 안구 위협 질환에서 자기 체막 이식의 임상적 유용성","dek":"자가 체막을 이용한 이식술이 공막 Stapyloma, 결막 침식, 윤부 종양 절제 후 재건 등 다양한 안구 위협 상황에서 안정적인 지지를 제공함을 5례에서 확인했습니다.","source":"Veterinary ophthalmology","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary ophthalmology","image":null,"sourceUrl":"https://doi.org/10.1111/vop.70217","body":["2024년 11월부터 2025년 11월까지 자기 체막 이식을 받은 5마리 개를 후향적으로 분석했습니다. 적응증은 돼지 소장 점막하 이식 실패 후 재발한 공막 Stapyloma 2례, 녹내장 배액관 위의 결막 얇아짐 1례, 윤부 멜라닌세포 종양 절제 후 재건 2례이었습니다. 체막은 대퇴부에서 채취해 최소 침습적으로 이식했습니다.","5례 모두에서 이식이 성공적으로 이루어졌으며, 공막 Stapyloma 2례에서는 6개월과 13개월 추적 시 재발이 없었습니다. 결막 침식 사례에서는 6개월 후 결막이 온전하게 유지되었고, 윤부 종양 절제 후 2례에서는 각각 10주와 5개월 추적 시 안구 조직이 보존되었습니다. 체막 채취 부위의 합병증은 모든 사례에서 최소였습니다.","임상적 시사점: 자기 체막 이식은 개의 안구 위협 질환에서 신뢰할 수 있는 조직 지지대를 제공합니다. 다만, 5례의 소규모 사례군이며 단일 기관 후향적 연구이므로 대규모 전향적 연구가 필요합니다. 특히 기존 이식재가 실패한 복잡한 경우나 종양 절제 후 대규모 조직 결손이 있는 경우에 유용한 옵션으로 고려될 수 있습니다."],"blog":"자가 체막 이식은 애완견의 심각한 안구 질환에서 기존 이식재가 실패했을 때 안구 보존을 위한 혁신적인 치료 옵션이 될 수 있습니다.","blogAngle":["5마리 모두에서 자기 체막 이식술이 성공적으로 시행되어 안구를 보존했습니다.","공막 Stapyloma 2례에서는 이식 후 6~13개월 추적 시 재발 없이 안정적인 조직 지지 효과가 확인되었습니다.","녹내장 배액관 위 결막 얇아짐에서는 6개월 후 결막 침식이 재발하지 않았습니다.","체막 채취 부위의 합병증은 모든 사례에서 최소였으며, 생체 적합성이 양호했습니다."],"radar":{"owner":null,"clinical":"자가 체막 이식술은 공막, 결막 결손, 윤부 종양 절제 후 재건 등 복잡한 안구 질환에서 조직 지지대로 활용 가능하나, 현재 근거 수준이 낮아 일반 진료 도입에는 아직 이르지 않았습니다.","evidence":{"design":"단일기관 후향적 사례 분석","n":"개 5마리","stars":2,"note":"5례의 소규모 연구이며 후향적 연구로 인과관계 추론에 한계가 있어 일반화에 주의가 필요합니다."}},"tag":""},{"id":"2026-07-21_26","day":"2026-07-21","ts":1784882955464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"애완동물에서 발견된 인류기생 Trichophyton tonsurans 22례, 프랑스 2021-2025","dek":"인류기생 피부사상균 T. tonsurans가 프랑스 애완동물 22마리(고양이 13, 강아지 9)에서 확인되었습니다. 이는 사람에서 동물로의 전파 가능성을 제시하며, 축구 Dermatophyte 감염 관리에 새로운 관점을 제공합니다.","source":"Medical mycology","country":"","date":"07.21","read":"1분 읽기","plate":"Medical mycology","image":null,"sourceUrl":"https://doi.org/10.1093/mmy/myag066","body":["인류기생 피부사상균에 의한 수의 감염은 매우 희귀하며, 주로 T. rubrum이 보고되었습니다. 본 연구는 2021년부터 2025년까지 프랑스에서 companion animal으로 사육되는 고양이와 강아지에서 T. tonsurans 양성 Culture가 확인된 22례를 검토했습니다.","22건 중 11마리(50%)는 증상성 감염이었고, 나머지 11마리(50%)는 무증상 보균자였습니다. T. tonsurans는 고양이 13마리와 강아지 9마리에서 분리되었으며, 대부분 동물에게서 전염되었을 것으로 추정되었습니다.","본 연구는 T. tonsurans가 사람에서 동물로 전파될 수 있음을 시사합니다. 그러나 이는 프랑스 단일 국가의 후향적 분석으로, 표본이 제한적이며 다른 국가나 지역으로 일반화하는 데 한계가 있습니다. 한국 동물병원에서도 이와 같은 환자의 동물 동반자를 검사할 때 인류기생균을 고려할 필요가 있습니다."],"blog":"애완동물을 키우는 보호자가 T. tonsurans 피부 감염 시 동물과의 밀접접촉을 피해야 합니다.","blogAngle":["프랑스에서 2021-2025년간 T. tonsurans 양성 애완동물 22례 확인(고양이 13, 강아지 9)","11마리(50%)는 증상성 감염, 나머지 11마리(50%)는 무증상 보균자","대부분 동물이 사람(보호자)에게서 전염되었을 것으로 추정","인류기생균의 동물 전파는 매우 희귀하나, T. tonsurans는 증가 추세"],"radar":{"owner":{"soon":true,"q":"가족 중 피부병이 있으면 우리 강아지/고양이도 검사해야 하나요?","script":"인수공통균이 동물에서 발견된 사례가 있지만, 아직 흔치는 않습니다. 가족에게 피부병이 있고 동물에게도 피부 증상이 있다면 진찰 시 함께 검사해보는 것이 좋습니다."},"clinical":"피부병 환자의 동물 동반자 진찰 시 인수공통균 감별 진단 항목에 포함시킬 것","evidence":{"design":"후향적 분석","n":"고양이 13마리, 강아지 9마리","stars":2,"note":"단일 국가 후향적 연구로 표본수가 적어 일반화에 주의가 필요함"}},"tag":""},{"id":"2026-07-21_27","day":"2026-07-21","ts":1784882954464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 복지 평가 도구 AWAG, 임상 의사결정에 유용","dek":"개의 동물 복지 평가를 위한 표준화된 도구인 AWAG의 임상 유용성을 조사한 결과, 96% 이상의 수의 및 동물 복지 전문가가 의사결정에 도움이 된다고 평가했습니다.","source":"Veterinary medicine and science","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.70993","body":["수의 임상과 동물 복지 현장에서의 윤리적 의사결정은 주관적 판단에 의존하는 경우가 많습니다. 본 연구는 개의 복지 평가를 위한 표준화된 도구인 Animal Welfare Assessment Grid(AWAG)의 임상적 유용성을 파악하기 위해 온라인 혼합방법 설문조사를 실시했습니다. 수의학, 보호소, 보조견 훈련기관 등 다양한 분야에서 AWAG를 실무에 활용한 전문가 99명 중 38명이 응답했습니다.","응답자의 96% 이상이 AWAG가 의사결정에 유용하다고 인정했습니다. 또한 이 도구가 동료와 개의 보호자 간 복지에 대한 논의를 촉진하는 것으로 보고되었습니다. 전반적으로 긍정적인 평가가 주를 이루었으나, 일부 사용자는 도구 사용에 어려움을 겪었으며 이는 향후 개선이 필요한 영역으로 지적되었습니다.","임상적 시사점: AWAG는 개의 복지를 객관적으로 평가하고 치료 및 관리 의사결정을 내리는 데 유용한 도구로 활용될 수 있습니다. 한국 동물병원에서도 이 같은 표준화된 평가 도구를 도입하면 복잡한 임상 상황에서의 판단을 보다 체계적으로 내릴 수 있을 것으로 기대됩니다. 단, 본 연구는 소표본(38명) 규모의 조사이므로 결과의 일반화에 한계가 있으며, 다양한 임상 환경에서의 추가 검증이 필요합니다."],"blog":"반려견 복지에 대한 객관적 평가 도구를 활용하면 보호자와 수의사 간 더 명확하고 생산적인 진료를 논의할 수 있습니다","blogAngle":["수의 및 동물 복지 전문가 38명 대상 설문조사 결과, 96% 이상이 AWAG의 의사결정 지원 유용성을 인정했습니다","도구가 동료와 보호자 간 복지 관련 논의 촉진에 기여하는 것으로 나타났습니다","일부 사용자는 도구 활용에 어려움을 느껴 향후 개선이 필요한 영역으로 남아 있습니다","표준화된 평가 도구가 복잡한 임상 의사결정 과정에 객관적 근거를 제공할 수 있습니다"],"radar":{"owner":{"soon":false,"q":"선생님, 우리 강아지 건강할 때 복지도 평가해주시는 거예요?","script":"현재 진료에서는 종합적인 건강검진을 통해 동물의 전반적인 상태를 확인하고 있습니다. 개의 복지를 체계적으로 평가하는 도구가 국내에 도입되면 더 도움이 될 것 같습니다."},"clinical":"AWAG와 같은 표준화된 복지 평가 도구의 도입 가능성을 병원 내 진료 프로토콜 검토 시 고려","evidence":{"design":"온라인 혼합방법 설문조사","n":"응답자 38명","stars":2,"note":"소표본 조사로 결과의 일반화에 한계가 있으며, 다양한 임상 환경에서의 추가 검증이 필요함"}},"tag":""},{"id":"2026-07-21_28","day":"2026-07-21","ts":1784882953464,"cat":"research","kicker":"최신 연구","isToday":false,"title":"카발리에 킹 찰스 스파니엘의 무릎뼈 탈구 유병률과 위험인자","dek":"호주의 1차 수의 진료소를 방문한 카발리에 킹 찰스 스파니엘에서 무릎뼈 탈구의 10년 유병률이 12.5%에 달하며, 중성화된 강아지와 특정 체중군에서 위험이 현저히 높다는 것을 확인했습니다.","source":"Veterinary medicine and science","country":"","date":"07.21","read":"1분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71026","body":["호주 VetCompass Australia에서 321,517개의 환자 기록을 분석하여 18개월 이상 된 강아지에서 무릎뼈 탈구 진단을 받은 집단과 그렇지 않은 대조군을 비교하고, 탈구 등급에 영향을 미치는 위험인자를 평가했습니다. 후향적 연구로 설계되었습니다.","10년 유병률은 12.5%(95% 신뢰구간 0.12~0.13)로 나타났습니다. 중성화된 강아지(OR 3.00), 체중 11~13kg인 강아지(OR 2.52), 루비색 털색을 가진 강아지(OR 2.04)에서 무릎뼈 탈구 진단 위험이 현저히 증가했습니다. 10세 이상 강아지는 오히려 위험이 낮았고(OR 0.44), 빅토리아주에서 고등급 무릎뼈 탈구가 더 흔했습니다(OR 1.68). 양측성 탈구는 일측성보다 고등급 탈구와 관련이 있었습니다.","임상적 시사점: 카발리에 킹 찰스 스파니엘에서 무릎뼈 탈구가 매우 흔한 질환이므로, 위험 집단의 조기 검진과 이상 번식 방지가 중요합니다. 다만 단일 국가 후향적 연구이므로 다른 지역으로의 일반화에는 한계가 있습니다."],"blog":"카발리에 킹 찰스 스파니엘을 키우는 보호자분들은 강아지 시기의 무릎 검사 받기를 권장하며, 특히 루비색이면서 중성화된 경우에는 더욱 주의가 필요합니다.","blogAngle":["카발리에 킹 찰스 스파니엘의 무릎뼈 탈구 10년 유병률은 12.5%에 달합니다.","중성화된 강아지는 비중성화 강아지 대비 무릎뼈 탈구 위험이 3배 높았습니다(OR 3.00).","체중 11~13kg인 강아지에서 위험이 2.5배 증가했으며(OR 2.52), 루비색 털색을 가진 강아지도 2배 높았습니다(OR 2.04).","10세 이상 강아지는 오히려 위험이 56% 감소했습니다(OR 0.44)."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 무릎뼈 탈구가 될 수도 있나요? 예방할 수 있는 방법은 없나요?","script":"카발리에 킹 찰스 스파니엘은 무릎뼈 탈구가 흔한 품종입니다. 특히 중성화된 강아지나 체중이 11~13인 강아지에서 위험이 더 높다고 알려져 있네요. 다만 정확한 진단은 진료실에서 몸검사와 영상 검사를 받아야 알 수 있습니다."},"clinical":"카발리에 킹 찰스 스파니엘 진료 시 무릎뼈 탈구 문진을 기본으로하고, 중성화·체중·털색 등의 위험인자 존재 시 영상의학 검사 고려","evidence":{"design":"후향적 코호트","n":"321,517개 환자 기록","stars":2,"note":"단일 국가(호주) 후향적 연구로 다른 지역으로의 일반화에 주의가 필요하며, 품종 특이적 결과이므로 타 품종에 직접 적용 불가"}},"tag":""},{"id":"2026-07-21_29","day":"2026-07-21","ts":1784495532000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"수의사가 강조하는 고양이 건강 관리의 7가지 핵심","dek":"미국 수의사들이 고양이 건강 관리에서 가장 중요하다고 강조하는 7가지 포인트를 소개합니다. 일상적으로 놓치기 쉬운 건강 신호를 파악하고, 적절한 예방 관리와 식이를 실현하는 것이 고양이의 수명 연장에 중요합니다. 중국사회과학원 학회는 인간이 동물 건강에 대한 관심을 점점 더 높임에 따라 이 분야 연구가 지속적으로 심화될 전망이라고 밝혔습니다.","source":"MSN","country":"","date":"07.20","read":"2분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMitAFBVV95cUxNYmVoY3RTTmp1ZDd3RGplRmc4TV9HNGpJVmh5UHQxRzBwSV9ucW9WaEt5eG5TSGxCU0NYcFV2emwxU0FLQzRYUWpCcGU5bnlSNWhpY2diVXFaeWFtdjZEWU5xN2hhWDhqQTNrbGk1TDVGWERBRGpYSEJjV1Rua2NfQWcyVld6SHVoM040MS1tb1F3YUU4czBjbU9aYUJBN1pqT1ZDaGhIVnhkSTFaRlFlMC1WUlc?oc=5","body":["고양이는 본능적으로 아픔을 숨기는 습성을 가진 동물로, 외부에서 보이는 증상이 없을 때도 이미 병이 진행된 경우가 많습니다. 미국수의협회(AVMA)에 따르면 고양이 보호자의 약 50%가 개 보호자에 비해 동물병원 방문 빈도가 낮은 것으로 조사되었습니다. 이는 고양이 건강 관리의 소홀을 보여주는 통계입니다.","수의사들이 가장 강조하는 포인트는 첫째, 정기적인 건강검진의 중요성입니다. 고양이는 7살 이상 되면 연간 2회 이상 검진 받는 것이 권장되며, 이는 초기 질병 발견에 결정적입니다. 둘째, 비만 관리로 약 60%의 가정 고양이가 과체중이며 비만은 당뇨, 관절질환, 요로질환 위험을 높입니다. 셋째, 구강건강으로 3세 이상 고양이의 70%에서 치주병이 발생하며 이는 전신 질환과 연관됩니다. 넷째, 수분 섭취로 습식 사료나 워터 폴른 활용이 요로건강에 필수적입니다.","한국 동물병원 관점에서 보면, 고양이 환자의 정기검진율 확대가 시급한 상황입니다. 특히 중고령 고양이에서 발견되는 만성 신장병, 갑상선기능항진증, 당뇨병 등은 초기 관리 여부에 따라 예후가 크게 달라집니다. 한국 고양이 보호자들도 '고양이는 동물 병원을 가기를 싫어한다'는 생각보다는 '예방이 치료보다 중요하다'는 관점으로 전환할 필요가 있습니다."],"blog":"한국 동물병원 블로그에서는 '고양이 건강검진, 몇 살부터 시작할까?' 또는 '고양이 비만, 내 고양이는 괜찮을까?' 같은 제목으로 일상적인 주제를 다뤄주시면 고양이 보호자의 예방의식을 높이는 것이 좋습니다","blogAngle":["고양이는 아픔을 본능적으로 숨기는 동물이라 증상이 보여도 병이 진행된 경우가 많습니다","7세 이상 중고령 고양이는 연간 2회 이상 건강검진을 받고, 비만·구강·요로 건강을 집중 관리해야 합니다","고양이 비만은 당뇨, 관절질환, 요로질환 위험을 높이며 예방관리가 필수다","한국 동물병원에서는 고양이 정기검진율 확대와 예방의료 체계 강화가 필요한 상황입니다"],"radar":{"owner":{"soon":true,"q":"고양이 건강검진은 얼마나 자주 받아야 하고, 무엇을 확인해야 하나요?","script":"고양이는 아픔을 잘 숨기기 때문에 정기적인 건강검진이 정말 중요합니다. 7살 이상 되시면 연간 2회 이상 받으시는 것을 권장드리고, 평소에도 체중·식욕·배변·활력 상태를 매일 확인해주시면 됩니다. 특히 비만·구강건강·수분 섭취를 체크해주세요."},"clinical":"고양이 환자의 정기검진 시 비만도·구강건강·수분 섭취 상태를 점검하고, 중고령 고양이에서는 만성 신장병·갑상선기능항진증·당뇨병 스크리닝을 강화한다","evidence":null},"tag":""},{"id":"2026-07-21_30","day":"2026-07-21","ts":1784488615000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수의 원격 진료와 디지털 접근성 확대","dek":"인도 Kashmir 지방에서 수의 원격 진료 서비스가 확산되면서 농촌 지역 축산 농가들의 진료 접근성이 크게 개선되고 있습니다. 이는 한국 동물병원에서도 참고할 만한 디지털 건강관리 모델입니다.","source":"Rising Kashmir","country":"","date":"07.20","read":"1분 읽기","plate":"Rising Kashmir","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMimAFBVV95cUxPTmVhc1dia3hnMjBRNzFGWUJtRnBJU184cGRwd1VYdU9PR2tMdkhEWC0yZVllQzI3Y0RvY0p1LVp4LXR5cUZSaTh4aXNNLTFSRWRSMVdLUFVGMmltWlBYbkxlcldrbXhoZ0NpcV9IanRnQng2QTloTWJfSjd4NFhjTDlUckpIQ2lsTnZCV3lmaUF0Z3l3bUJ2OA?oc=5","body":["전통적으로 Kashmir 지역의 목축 농가들은 가까운 수의원을 찾기 위해 수십리를 이동해야 했고,이로 인해 가축 질병 초기 증상을 놓치는 경우가 빈번했습니다. 특히 계절 변화 시 호흡기 질환과 기생충 감염이 빈발했으나 진료 접근의 어려움으로 피해가 확대되는 사례가 많았습니다.","최근 도입된 원격 진료 플랫폼은 농가들이 스마트폰을 통해 증상 사진을 전송하고 수의사와 화상 상담을 진행할 수 있게 했습니다. 이를 통해 초기 진단과 처방이 신속해졌을 뿐 아니라, 응급 상황에서는 빠른 대피 조치를 취할 수 있게 되었습니다. 시범 운영 결과 농가 만족도가 크게 향상했으며, 치료 지연으로 인한 경제적 손실도 감소했습니다.","한국의 동물병원 입장에서도 원격 진료는 성과를 확대할 수 있는 기회다. 농촌 지역 동물병원이나 특수 동물 클리닉에서 원격 상담 시스템을 도입하면 진료 범위를 넓힐 수 있습니다. 다만 한국의 수의사 법규와 원격 진료 허용 범위를 먼저 확인하고, 안전하고 체계적인 운영 방안을 마련하는 것이 중요합니다."],"blog":"한국 동물병원 블로그에서 '원격 진료, 우리 병원에서도 도입할 수 있을까?'라는 주제로 원격 상담의 장점과 주의점을 다루는 글을 쓰면 readers의 관심을 끌 수 있습니다.","blogAngle":["Kashmir 농촌 지역에서 원격 진료를 통해 가축 질병 초기 대응이 가능해졌습니다","스마트폰 기반 화상 상담과 증상 사진 전송으로 진료 접근성이 크게 개선되었습니다","시범 운영 결과 농가 만족도 향상과 경제적 손실 감소 효과가 나타났습니다","한국 동물병원의 경우 법규 검토와 안전한 운영 체계 구축이 선행되어야 합니다"],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지도 원격 진료를 받을 수 없어요?","script":"원격 진료는 아직 법적으로 명확하게 허용된 범위가 아닙니다. 전화나 화상 상담으로 간단한 상담은 가능할 수 있지만, 정확한 진단과 치료는 직접 내원해 주셔야 합니다. 다만 앞으로 제도 변화가 있을 수 있으니 계속 관심을 가져주세요."},"clinical":"원격 진료 도입 전 한국 수의사 법규의 원격 진료 허용 범위를 반드시 확인하고, 병원 운영 규정과 안전 시스템을 마련할 것","evidence":null},"tag":""},{"id":"2026-07-21_31","day":"2026-07-21","ts":1784583103000,"cat":"career","kicker":"커리어","isToday":false,"title":"마이크 던 수의사 장학금 2026년 수상자 발표, 7월 29일 신청 시작","dek":"미국의 마이크 던 수의사 장학금 프로그램이 2026년 수상자를 확정하고, 오는 7월 말부터 2027년 지원자를 모집합니다. 수의학 전공 대학생들에게 재정 지원과 전문가 네트워킹 기회를 제공합니다.","source":"DVM360","country":"","date":"07.21","read":"1분 읽기","plate":"DVM360","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiwgFBVV95cUxOUU1EeG5KOUMtMXFjdjROalZiUzJqcGg3NU42SU9rWDAwQW1sUFI4TVJOYkpNOE9XQXBjZ1RGVTlIcVRXSTVGQ0M3TDlXdDJ0MG9TUnJqdmRYalF2alA2My1nZmNWXzZONDlRbEk4eWtLRlNuNGZjZUliSWsyZnQ0X3dBSnlER2pfN19oOFpGQ3pnbXZFcFhDbzRiME9nZjJzd1Q4NHpEQnpLVG9yT09MNnhXMTVoaHMtb1BnQ3IxaU15dw?oc=5","body":["마이크 던 장학금은 수의학 분야에서 권위 있는 재정 지원 프로그램 중 하나로, 미래 수의사 인력 양성을 목표로 합니다. 이 프로그램은 학업 성적이 우수한 수의학 전공 학생들을 선정하여 학비 부담을 완화하고, 전문 현장에서 필요한 인맥 형성을 돕습니다.","2026년 수상자들이 확정되었으며, 다음 달 말부터 2027년 입학 대상자들의 신청 접수를 정식으로 시작합니다. 정확한 지원 자격 요건과 금액, 심사 기준에 대한 상세 정보는 공식 홈페이지를 통해 확인할 수 있습니다.","한국 동물병원 관점에서 보면, 이러한 해외 장학금 프로그램은 국내 수의대생들에게 국제 진출과 네트워킹의 기회를 제공합니다. 국내 동물병원들도 장기적으로 우수 인력을 확보하기 위해 유사한 형태의 장학금이나 인턴십 프로그램을 고려해볼 만합니다."],"blog":"한국 동물병원들도 우수 인력 확보를 위한 장학금 프로그램 도입을 검토할 만합니다.","blogAngle":["마이크 던 수의사 장학금 2026년 수상자 발표, 7월 29일 이후 2027년 지원자 모집 시작","수의학 전공 대학생 대상 재정 지원 및 전문가 네트워킹 기회 제공","지원 자격, 금액, 심사 기준은 공식 홈페이지를 통해 확인 필요","한국 동물병원들도 우수 인력 확보 위한 장학금 프로그램 도입 검토 필요"],"radar":{"owner":null,"clinical":"국내 수의대생 대상 국제 장학금 프로그램 정보 파악 및 우수 인력 확보를 위한 인턴십 연계 가능성 점검","evidence":null},"tag":""},{"id":"2026-07-21_32","day":"2026-07-21","ts":1784505600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"레드팜유와 천연추출물 복합 펫샴푸의 항균·항진균·항염 효과 연구","dek":"반려 동물에서 흔한 피부 세균 및 진균 감염에 대응하기 위해 레드팜유와 네 가지 한약초 추출물을 혼합한 샴푸가 개발되었습니다. 이 연구는 천연물질 기반의 항균치료제가 항생제 내성 문제에 대안이 될 수 있는지를 확인했습니다.","source":"Veterinary Sciences","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary Sciences","image":null,"sourceUrl":"https://www.mdpi.com/2306-7381/13/7/712","body":["반려동물에서 세균성 및 진균성 피부 감염은 흔하며, 기존의 항균제 치료는 항생제 내성 증가와 관련이 있습니다. 본 연구에서는 레드팜유(RPO)에 비단초(Rhinacanthus nasutus), 강황(Curcuma longa), 산양강남(Zingiber montanum), 생강(Zingiber officinale) 추출물을 혼합하여 항균, 항진균, 항산화, 항염증 작용을 제공하는 샴푸를 개발했습니다. 추출물은 마이크로파 추출법(MAE)으로 제조되었으며, 총 페놀 함량, DPPH 항산화 활성, COX-2 억제를 통한 항염증 활성, 그리고 항균·항진균 활성를 평가했습니다.","레드팜유는 비타민 E와 베타카로틴을 풍부하게 포함하고 있었습니다. 비단초 추출물은 가장 강한 항산화 활성을 보였고(DPPH IC50 = 15.23 μg/mL), 비단초와 산양강남은 황색포도상구균과 메티실린 내성 황색포도상구균(MRSA)에 대해 가장 강한 항균 활성를 나타냈습니다(MIC = 8 μg/mL). 생강 추출물은 Malassezia pachydermatis와 Microsporum gypseum에 대해 가장 강한 항진균 활성를 보였습니다(MIC = 2 μg/mL). 개발된 복합 샴푸는 적절한 pH와 점도를 유지하면서 유의한 항균 및 진균 억제 효과를 보였습니다.","한국 동물병원에서 이 연구결과는 천연성분 기반 피부 관리제 개발의 가능성을 보여줍니다. 특히 개·고양이에서 흔한 피부염에 항생제 대안으로 천연 추출물을 활용할 수 있는 근거가 되며, 향후 임상 시험을 통해 실제 치료제로 개발될 수 있습니다. 원문의 구체적 용량 및 처치 방법은 원문을 참고하시기 바랍니다."],"blog":"개·고양이 피부염 환축 진료 시 천연 한약성분 기반 샴푸 처방의 근거 자료로 활용하거나, 항생제 내성 문제를 설명하는 교육 콘텐츠로 사용할 수 있습니다","blogAngle":["비단초, 강황, 산양강남, 생강 추출물 모두 COX-2 발현을 유의하게 감소시켜 항염증 효과를 확인했습니다","비단초 추출물은 DPPH 실험에서 IC50 15.23 μg/mL의 가장 강한 항산화를 보였습니다","산양강남과 비단초는 황색포도상구균과 MRSA에 대해 MIC 8 μg/mL의 강한 항균 작용을 나타냈습니다","생강 추출물은 Malassezia와 Microsporum 진균에 대해 MIC 2 μg/mL의 가장 강한 항진균 효과를 보였습니다"],"radar":{"owner":{"soon":true,"q":"천연성분 들어간 샴푸가 우리 강아지 고양이 피부염에 좋을까요?","script":"이 연구은 아직 실험실 단계고요, 실제 동물에 사용해본 연구는 아니에요. 천연성분이라도 원인에 따라 피부 자극이 있을 수 있어서, 피부 문제가 있으면 먼저 진찰을 받으시는 게 좋아요."},"clinical":"연구 단계이므로 실제 임상 적용은 아직 이르고, 천연샴푸 도입 전 기존 치료 프로토콜 우선 확인","evidence":null},"tag":""},{"id":"2026-07-21_33","day":"2026-07-21","ts":1784882948464,"cat":"clinical","kicker":"임상","isToday":false,"title":"소 Liver Abscess, 초기 항생제 투여가 장기 위험에 영향","dek":"미국 USDA 연구팀이 9,527두의 비육우를 분석한 결과, 이십 항생제 투여가 간 농양 발생과 연관될 수 있다는 놀라운 결과를 확인했습니다. 특히 초기 단계의 투여 여부가 평생의 농양 위험에 영향을 미칠 수 있어 동물 복지와 경제적 손실 측면에서 중요한 시사점을 제공합니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.21","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1875341/full","body":["간 농양은 소육 산업에서 막대한 경제적 손실을 유발하는 주요 질병입니다. 미국 육류동물연구센터 연구팀은 비위험 교잡 비육우 9,527두를 대상으로 평생 치료 기록과 간 농양 발생 여부를 분석하여 건강 진단, 치료 유형, 항생제 종류가 간 농양 발생과 어떤 관계가 있는지 조사했습니다.","분석 결과, 전체적인 치료적 항생제 사용은 간 농양 발생과 유의미한 연관성을 보이지 않았습니다(p > 0.10). 그러나 특정 항생제 종류에서는 성별에 따른 차이가 확인되었습니다. 송아지기에 툴라트로마이신을 투여받은 수소는 그렇지 않은 수소보다 간 농양 위험이 감소했으며(p = 0.02), 이는 평생 전체 기간에도 동일하게 관찰되었습니다. 반면 암소에서는 이러한 효과가 나타나지 않았습니다. 옥시테트라싸이클린에서는 성별 상호작용이 확인되었으나(p = 0.01), 쌍별 비교에서는 유의미한 차이를 보이지 않았습니다. 추가로, 감염성 질환(주로 소각막결막염)으로 진단된 암소는 그렇지 않은 암소보다 간 농양 발생 가능성이 더 낮았습니다(p = 0.03).","이 연구 결과는 초기 수명주기, 특히 이십기의 건강 사건이 평생의 간 농양 감수성에 지속적인 영향을 미칠 수 있음을 시사합니다. 한국 동물병원에서는 소 농양 환축 관리 시 초기 치료 이력을 확인하고, 성별에 따른 차별화된 예방 전략의 필요성을 고려해야 할 것입니다. 다만 이는 관찰 연구이므로 실험적 검증이 필요하며, 항생제 없이 농양을 예방할 수 있는 대안적 전략 개발이 요구됩니다."],"blog":"한국 동물병원 블로그에서는 소 간 농양 환축의 초기 치료 이력을 확인하여 예후를 예측하고, 성별에 따른 맞춤형 관리 방법을 제안하는 콘텐츠로 활용할 수 있습니다.","blogAngle":["전체 항생제 치료는 간 농양 발생과 직접적인 연관성이 없었으나, 특정 항생제 종류와 투여 시기에 따라 성별에 따른 차이점이 확인되었습니다.","수소에서 이십기 툴라트로마이신 투여는 간 농양 위험을 유의미하게 감소시켰으며(p = 0.02), 암소에서는 이러한 효과가 관찰되지 않았습니다.","감염성 질환(소각막결막염 등)로 진단된 암소는 간 농양 발생 가능성이 오히려 낮았으며, 이는 면역 체계와의 관련성을 추정할 수 있습니다.","초기 수명주기 건강 사건이 평생 질병 감수성에 영향을 미칠 수 있다는 점이 확인되었으며, 비항생제 예방 전략 개발의 필요성이 강조됩니다."],"radar":{"owner":null,"clinical":"소 농양 환축 진료 시 초기 치료 이력 확인 및 성별에 따른 차별화된 예방 전략 고려","evidence":null},"tag":""},{"id":"2026-07-21_34","day":"2026-07-21","ts":1783292400000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수의학의 새로운 접근법: 환자 전체를 고려하는 상황적 케어","dek":"동물 복지와 삶의 질이 수의학의 핵심이 되면서, 단순한 치료를 넘어 환자와 보호자, 진료 환경, 나아가 사회적·환경적 지속가능성까지 고려하는 '상황적 케어' 개념이 국제 수의계에서 주목받고 있습니다.","source":"Veterinary Evidence","country":"","date":"07.06","read":"2분 읽기","plate":"Veterinary Evidence","image":null,"sourceUrl":"https://veterinaryevidence.org/index.php/ve/article/view/754","body":["수의학에서 동물 복지와 삶의 질은 진료의 중심 가치가 되었습니다. 이에 따라 치료 옵션이 다양해지는 동시에, 환자 특성뿐 아니라 보호자 상황, 진료 유형, 동물병원 환경, 더 넓은 사회적 환경 그리고 환경적·재정적 지속가능성까지 복합적인 요소를 고려해야 하는 시대가 왔습니다. 이러한 고려 사항을 설명하는 데 '상황적 케어(Contextualized Care)'와 '스펙트럼 오브 케어(Spectrum of Care)'라는 용어가 함께 사용되고 있습니다.","상황적 케어 또는 스펙트럼 오브 케어 기반의 의사결정은 최신 과학적 연구 증거에 기반해야 합니다. Veterinary Evidence 저널은 연구 결과를 수의 전문가가 해석하고 진료 결정에 활용할 수 있는 형태로 제공하는 것을 목표로 합니다. 영국에서는 RCVS Knowledge가 상황적 케어 로드맵을 발표했고, 미국 AAVMC는 수의사 교육 프로그램에 스펙트럼 오브 케어를 통합하기 위한 이니셔티브를 진행하고 있습니다.","한국 동물병원에게 이 개념은 환자 중심 진료의 새로운 프레임워크를 제시합니다. 단순히 최적의 치료법을 찾는 것이 아니라, 동물과 보호자의 상황, 경제적 부담, 진료 환경의 현실을 고려한 여러 옵션을 제공하고 함께 논의하는 진료 문화로 전환하는 계기가 될 수 있습니다. 이는 동물 의료의 질을 높이고 보호자 만족도 향상에도 기여할 것으로 기대됩니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원만의 상황적 케어 실천'으로 보호자와 함께 치료 옵션을 논의하는 진료 철학 소개글로 활용할 수 있습니다.","blogAngle":["동물 복지와 삶의 질이 수의학의 핵심 가치로 자리 잡으며 다양한 치료 옵션과 고려 요소가 증가하고 있습니다.","'상황적 케어'와 '스펙트럼 오브케어'는 환자, 보호자, 진료 환경, 사회, 지속가능성 등 복합적 요소를 고려하는 진료 접근법입니다.","진료 결정은 최신 과학적 연구 증거에 기반해야 하며, Veterinary Evidence 등의 저널이 이를 해석 가능한 형태로 제공합니다.","한국 동물병원에서도 동물과 보호자의 상황을 종합적으로 고려한 다중 옵션 진료 문화 도입을 검토할 필요가 있습니다."],"radar":{"owner":null,"clinical":"보호자와 치료 옵션 및 예상 비용을 미리 논의하는 프로세스를 진료 플로우에 반영한다","evidence":null},"tag":""},{"id":"2026-07-21_35","day":"2026-07-21","ts":1782255600000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 비침습 혈압 측정, 침습 측정과 얼마나 일치할까?","dek":"도플러와 발진계로 측정한 고양이 혈압이 침습적 동맥 혈압 측정과 얼마나 정확한지 체계적 고찰 결과가 발표되었습니다. 비침습적 방법의 한계를 명확히 인식하고 적절히 활용하는 것이 중요합니다.","source":"Veterinary Evidence","country":"","date":"06.24","read":"2분 읽기","plate":"Veterinary Evidence","image":null,"sourceUrl":"https://veterinaryevidence.org/index.php/ve/article/view/735","body":["고양이에서 비침습적 혈압 측정 방법인 도플러와 발진계의 정확성을 평가하기 위해 총 14개 연구(13개 방법 비교 연구, 1개 전향적 실험 연구)가 분석되었습니다. 이 연구들은 침습적 동맥 혈압 측정(직접 동맥 텔레메트리)을 참고 표준으로 삼고 비침습적 방법과의 일치도를 검토했습니다. 고양이 고혈압은 신장 질환, 갑상선 기능 항진증 등 다양한 질환과 연관되므로 정확한 혈압 측정이 진료 현장에서 매우 중요합니다.","발진계의 경우 11개 연구 중 2개 연구에서 침습 측정과 완전히 일치하는 것으로 나타났고, 5개 연구는 특정 조건에서만 일치하며, 4개 연구는 일치하지 않는 것으로 보고되었습니다. 도플러의 경우 7개 연구에서 완전히 일치하는 연구가 없었으며, 2개 연구가 특정 조건에서만 일치한다고 했고, 5개 연구는 일치하지 않았습니다. 특히 평균 동맥압(MAP) 측정에서 발진계가 도플러보다 더 많은 증거를 보이고 있습니다.","한국 동물병원 현장에 따르면, 고양이 고혈압 진단과 치료 효과 모니터링에서 비침습적 혈압 측정기는 널리 사용되지만 이 연구 결과는 방법의 한계를 명확히 보여줍니다. 도플러 측정 시 특히 수축기 혈압만 제공하고 정확도가 낮을 수 있으며, 발진계도 측정 조건( cuffs 위치, 동물 상태 등)에 따라 결과가 달라질 수 있습니다. 따라서 고혈압 의심 사례에서는 여러 측정값을 종합적으로 판단하고, 가능하면 참고 표준과의 교차 검증을 고려해야 합니다."],"blog":"고양이 고혈압 진료 시 비침습 혈압 측정기의 한계와 올바른 사용법에 대한 클리닉 내부 교육 자료로 활용하면 좋습니다.","blogAngle":["총 14개 연구 분석 결과, 도플러 방법은 완전히 침습 측정과 일치한 연구가 없어 비침습 혈압 측정기로서의 한계가 명확합니다.","발진계는 도플러보다 침습 측정과의 일치도가 약간 높았으나, 특정 조건에서만 일치하는 경우가 대부분이었습니다.","평균 동맥압 측정에서 발진계가 도플러보다 더 신뢰할 만한 결과를 보였습니다.","고양이 고혈압 진료 시 비침습 측정값만으로 진단하기보다는 임상 증상과 함께 종합적으로 판단해야 합니다."],"radar":{"owner":{"soon":true,"q":"고양이 혈압 측정할 때 도플러랑 발진계 중에 어느 게 더 정확해요?","script":"도플러와 발진계 모두 침습적 측정보다는 정확도가 낮을 수 있습니다. 다만 발진계가 평균 동맥압 측정에서 좀 더 신뢰할 만한 편입니다. 고혈압이 의심되는 경우 여러 번 측정해서 종합적으로 판단해 보겠습니다."},"clinical":"고양이 고혈압 의심 시 비침습적 측정값만 신뢰하지 말고, 가능하다면 반복 측정하거나 참고 표준과의 교차 검증을 고려한다.","evidence":null},"tag":""},{"id":"2026-07-21_36","day":"2026-07-21","ts":1784548800000,"cat":"clinical","kicker":"임상","isToday":false,"title":"BioCraft, 세포배양 사료 성분 안전문서 공개…수출 규제 대응 가속화","dek":"미국 BioCraft Pet Nutrition이 세포배양 기술을 활용한 사료 성분의 안전성 문서를 공개했습니다. 이는 향후 글로벌 수출 규제 심사를 통과하기 위한 핵심 과정으로 관심을 받고 있습니다.","source":"Pet Food Processing","country":"","date":"07.20","read":"1분 읽기","plate":"Pet Food Processing","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMizAFBVV95cUxPaDNyVXlTdUxYYjNxdU1NMVRiNTVEVGNEYjhxN1pFeTRNWGc2a3phN2Q5N0laSGNBLXRIa2FYYndCRXk0N0RDdEVMUTdHM0M4cXBnaFJqSVhjdnVGN1lLVXZNNjZrbnhQYVc5c2NqMEQ1RDZyT3RXUWNGRWsyaGRLSU9IbUJtYnBzNktJVHFTTlUyRWY2Qm93TGJIUkh4em9NZWliYlczYk5qVTZ0dWZxanA2TnZFQXVrZF9penBoZ2xZdnBFRXc3aXlNMmw?oc=5","body":["배양세포 기반 사료는 전통적인 육류 대신 분석 가능한 세포를 배양해 만들어지는 혁신적인 사료 원료다. BioCraft는 자사의 세포배양 사료 성분에 대한 포괄적인 안전성 데이터를 담은 문서를 미국 규제기관에 제출했으며, 이를 통해 식품 안전성을 공식적으로 입증하고자 합니다.","이번에 공개된 안전 문서에는 원료의 구성성분, 생산 공정상의 위생 관리 기준, 동물 실험 결과 등이 포함되어 있습니다. 세포배양 사료는 향후 미국 내 판매 허가뿐만 아니라 EU·일본 등 주요 수출 시장에서 필수적인 규제 심사를 거쳐야 하므로, 이 문서는 글로벌 시장 진출의 첫 번째 관문입니다.","한국 동물병원 관점에서, 세포배양 사료는 향후 국내 시장에 도입될 가능성 있으며, 관련 질환을 진료할 때 새로운 사료 유형에 대한 이해가 필요할 수 있습니다. 국내 사료 규제 동향과 각국의 안전 기준을 주시하고, 반려인에게 정확한 정보를 제공하는 것이 중요합니다."],"blog":"국내에서도 세포배양 사료 도입 가능성에 대비해 규제 동향을 주시하고, 관련 질환 진료 시 새로운 사료 원료에 대한 기초 지식을 갖추는 것이 필요합니다","blogAngle":["BioCraft가 세포배양 사료 성분의 안전성 문서를 공식 공개했습니다","안전 문서에는 원료 구성, 생산 공정, 안전성 실험 데이터가 포함됩니다","이번 문서는 미국 및 주요 수출 시장의 규제 심사를 위한 필수 제출 자료다","향후 국내 도입 시 진료 및 건강설명의 참고자료가 될 수 있습니다"],"radar":{"owner":null,"clinical":"세포배양 사료 출시 시점에 대비해 관련 안전성 자료와 국내 규제 동향을 지속적으로 모니터링한다","evidence":null},"tag":""},{"id":"2026-07-21_37","day":"2026-07-21","ts":1784610061000,"cat":"client_communication","kicker":"보호자 소통","isToday":true,"title":"반려동물 보험, 병원비 절약에 얼마나 효과적일까?","dek":"아일랜드에서 지난 10년간 애완동물 보험 가입자가 급증하는 가운데, 고비용 진료가 필요한 상황에서 보험이 실제로 비용을 절감하는지 논란이 되고 있습니다.","source":"The Irish Times","country":"","date":"07.21","read":"1분 읽기","plate":"The Irish Times","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMipAFBVV95cUxOUlJYMEFUQmJaeWZHOFdQMkY0elQxSUx5QXBqb0VPdXQ2LUctNlNSbHZaSW9BeVdFWGRJYUhDTmZoRU90bVNCNUFPUHNHM01TcmJYN3YySDZ2RUJ4UzRkanBpUkdZVjh0dUllMUFJTVNpaHpfdFRocnVCaFFRVEEwMzNCZTBZRXdBYmpOOVd2aW9peDVJQ0lMZWxNVlVaZmhKZkFNRw?oc=5","body":["아일랜드 금융감독청에 따르면 지난 10년간 애완동물 보험 시장은 크게 성장했으며, 현재 수십만 가구가 보험에 가입해 있습니다. 보험업계는 보장 범위 확대와 경쟁 심화를 통해 더 많은 동물 소유자에게 접근하고 있습니다. 그러나 일부 전문가들은 보험료 상승과 보장 제외 항목의 증가를 우려하고 있습니다.","실제로 대형 수술이나 만성질환 치료에는 연간 수천 유로의 비용이 들 수 있으며, 이에 대응해 보험회사는 다양한 플랜을 제공하고 있습니다. 중요한 것은 자신의 동물 종과 예상 진료 빈도를 고려해 적합한 상품을 선택하는 것입니다. 보험사에 따라 특정 종의 유전성 질환이나 기존 질환을 보장하지 않는 경우도 있어 계약 전 확인이 필수적입니다.","한국 동물병원에서도 보험 관련 문의가 증가하고 있으며, 진료 과정에서 보험 적용 가능 여부를 확인하는 사례가 흔해졌습니다. 병원 관계자들은 보험 가입 여부와 관계없이 진료비 관리의 중요성을 강조합니다. 이는 한국에서도 의료비 부담에 대한 동물 소유자들의 관심이 높아지고 있음을 보여줍니다."],"blog":"한국 동물병원 블로그에서는 보험 가입 전 확인해야 할 보장 범위와 동물 종별 유의점을 다뤄 동물 소유자들의 보험 선택을 도울 수 있습니다","blogAngle":["아일랜드에서 지난 10년간 애완동물 보험 시장이 크게 성장했습니다","고비용 진료 시 보험이 유의미한 비용 절감을 제공할 수 있으나, 보장 제외 항목과 보험료 상승을 고려해야 합니다","자신의 동물 종과 건강 상태에 맞는 보험 상품을 선택하는 것이 중요합니다","한국에서도 동물 의료비 부담에 대한 관심이 높아지면서 보험 관련 문의가 증가하고 있습니다"],"radar":{"owner":{"soon":true,"q":"보험 들어서 진료비 많이 절약할 수 있나요?","script":"보험은 큰 수술이나 만성질환 치료비가 들 때 도움이 될 수 있어요. 다만 보험료와 보장 범위를 잘 비교하고, 기존 질환은 보장되지 않을 수 있다는 점도 확인하셔야 합니다. 보험 가입 여부와 관계없이 미리 진료비 계획을 세워두는 것이 중요합니다."},"clinical":"보험 관련 문의를 받을 수 있으므로, 주요 보험사의 보장 범위와 제외 항목에 대한 기본 정보를 숙지하고 있으면 보호자 안내에 도움이 됩니다.","evidence":null},"tag":""},{"id":"2026-07-21_38","day":"2026-07-21","ts":1784494501000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"반려동물 보험의 진짜 가치: 진료비 부담 줄이기","dek":"미국 보험 대리인이 동물 보험의 경제적 중요성을 강조했습니다. 예상치 못한 동물 진료비 부담을 줄이기 위한 방법으로 반려동물 보험이 주목받고 있습니다.","source":"TAPinto","country":"","date":"07.20","read":"1분 읽기","plate":"TAPinto","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMikwJBVV95cUxQZmdSeEdiRmpvbXVyS2p0XzRocTFQUGIxU1FZUjZZMVRzSmIwenYzM0c1LU5PdVU5czJWWXYyMmNyMWtpdVRLcFcwRlE3MjNlVWYzVjIxb0twbS1OVno4Vy1Ua1NLeExkRlhlZTVxVHA1UW00UHNzNVVxcEdONV95MVBJYzhNaEZTem5MTVVaN0pYNGkwRTBxRk91SHhEVzR4RU40SG9TMmVKZTUwTjhjSEJkRm1qUkhMUVBZd3c0VnRFckVodFFrUDRvZVhOVVJJRzlRNVF1d3Q4LVlUTlh2OXA0N3RoMlhDUC1hdEtyem5TLTJLVGRMYmFWaUNudGoxbGE3YUM5djJyOG5YZmVIYXJtVQ?oc=5","body":["미국 뉴저지주(State Farm)에서 활동하는 보험 대리인 Teri DiGrande는 반려동물 보험의 가치를 강조했습니다. 동물 의료비 상승으로 인해 예상치 못한 진료 비용이 가족 전체의 재정에 큰 부담이 되고 있는 상황입니다. 특히 긴급 수술이나 만성질환 치료 시 수천만 원에 달하는 비용이 발생하며, 이에 대한 대비가 필요하다는 지적이 나오고 있습니다.","DiGrande 대리인은 동물 보험이 이러한 예상치 못한 비용으로부터 반려동물과 보호자를 보호하는 안전망 역할을 한다고 설명했습니다. 보험 가입 시 일상적인 진료부터 응급 수술, 만성질환 관리까지 다양한 상황에서 경제적 부담을 줄일 수 있습니다. 또한 동물 보험 시장에 다양한 상품이 출시되고 있어, 각 가정의 상황에 맞는 선택이 가능해졌습니다.","한국 동물병원 입장에서는 동물 보험에 대한 올바른 이해가 진료 만족도와 신뢰도 향상에 도움이 될 수 있습니다. 동물 보험 관련 상담을 진료 과정에 자연스럽게 통합하면 동물 보호자의 재정 불안감을 낮출 수 있습니다. 또한 보험 처리 과정에서 병원 운영 효율성을 높이는 방법도 검토할 가치가 있습니다."],"blog":"한국 동물병원 블로그에서 '반려동물 보험, 우리 병원에서는 이렇게 안내합니다'라는 제목으로 보험 상담의 중요성을 다룬다면 고객에게 유용한 정보가 될 수 있습니다","blogAngle":["동물 진료비 상승으로 인해 예상치 못한 비용이 가족 재정 부담이 되고 있습니다","동물 보험은 긴급 수술과 만성질환 치료 시 경제적 안전망 역할을 합니다","다양한 보험 상품이 출시되어 가족 상황에 맞는 선택이 가능해졌습니다","동물병원에서 보험 상담을 통합하면 고객 만족도 향상에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 보험 들어줄까요? 어떤 게 좋을까요?","script":"반려동물 보험은 예상치 못한 큰 비용부터 보호해 주는 안전망 역할을 합니다. 다만 보험마다 보장 범위와 자기부담금이 다르니, 각 가정의 상황에 맞게 선택하시는 게 중요합니다. 필요하시면 보험사가 제공하는 자료를 참고해보세요."},"clinical":"보험 처리 프로세스를 점검하고 보호자에게 보험 관련 정보를 자연스럽게 안내할 수 있도록 상담 프로세스를 정비하세요.","evidence":null},"tag":""},{"id":"2026-07-21_39","day":"2026-07-21","ts":1784584793000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"콜로라도 '고양이전용' 수의원 Aurora에 신규 개원","dek":"미국 콜로라도주 Aurora시에 고양이전용 수의 클리닉이 새로 문을 엽니다. 전문화 트렌드에 맞춘 이 개원이 동물병원 업계에 어떤 시사점을 던지는지 살펴봅니다.","source":"ColoradoBiz","country":"","date":"07.21","read":"1분 읽기","plate":"ColoradoBiz","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigwFBVV95cUxNd0RLRFAyZXFfV0hqUlR0c3ZuUzloTUJsMlQ4T1NxaHdxaGRJU2dqcXhBVWp3blIyeVVwSXVOMy16WDJoeUsxZk5SRDBOSUhMSVVUV1dPdVVjYl9aSWF0M3pKVU54cVJZVUI1eldiazh6SWNjQ05uMjBJdTFIYlFoWFdXUQ?oc=5","body":["미국 콜로라도주에서 운영하는 CatsOnly 수의원이 Aurora시에 고양이전용 클리닉을 새로 설립합니다. 기존의 Austin, Dallas, Phoenix 지역에 이어 Aurora가 새로운 시장을 확보하게 되었으며, 이는 고양이 중심의 진료 모델을 전국적으로 확대하는 전략의 일환으로 풀이됩니다.","고양이전용 수의원의 특징은 고양이의 고유한 행동 패턴과 건강 요구에 맞춘 환경으로 구성되어 있습니다. 병원 내부는 강아지 등 다른 동물과의 접촉을 최소화하여 고양이의 스트레스를 줄이고, 고양이 질환에 특화된 진료 장비와 전문의를 배치합니다. 이러한 전문화는 고양이 건강의 가치를 극대화하는 방향으로 자리 잡고 있습니다.","한국 동물병원에 있어 이 추세는 전문화 대 종합병원 모델의 선택에 대한 고려 자료가 됩니다. 고양이 환자를 많이 보유한 병원이라면 고양이전용 공간이나 시간을 확보하는 것도 하나의 차별화 전략이 될 수 있습니다. 이는 고양이 보호자들의 미충족 의료 수요를 해소하는 동시에 동물병원 브랜드 가치를 높일 수 있는 기회가 됩니다."],"blog":"한국의 고양이 보호자들이 선호하는 진료 환경은 어떤 요소인지 자체 조사해보면, 고양이전용 클리닉 수요를 파악하는 데 참고가 될 것입니다.","blogAngle":["CatsOnly 수의원이 콜로라도 Aurora시에 고양이전용 클리닉을 신규 개원","고양이전용 병원 환경은 다른 동물과의 접촉을 최소화하여 스트레스를 줄임","고양이 건강의 가치를 극대화하는 전문화 트렌드가 미국에서 확산 중","한국 동물병원에서도 종 특화 진료 공간 검토가 차별화 전략이 될 수 있음"],"radar":{"owner":null,"clinical":"고양이 환자 비중이 높은 병원인지 점검하고, 가능하다면 고양이 전용 진료 시간대나 공간 확보를 고려해보기","evidence":null},"tag":""}],"stories":[{"id":"2026-07-21_40","day":"2026-07-21","ts":1784552207000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"수간호사에게 감사한 미국 수의사 접수 담당자 주간 선물","dek":"해외에서 수의 진료실 접수 담당자에게 감사하는 선물이 화제입니다.","source":"aviglianonews.it","country":"","date":"07.20","read":"1분 읽기","plate":"aviglianonews.it","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMinAFBVV95cUxNRU43TEN0WHJUX19veW81dGNuNVlZaHhCYkxwX3pmUGVOc0d1WjJodW9Wc0s2TFE3aTBfSjdXNXVaM01CbndHeTdOUWV2YUZPM3puWlVMUC1KaV9SRmNmV1FjQ1NQZHFaSzk2VDhDMGlYUS0zRGhFV0p3dzJXV2Vzc0dIcFBuRXo5b09WMV9TcDlBNldRSDdZODl1ZEw?oc=5","body":["해외에서 수의학 진료실 행정 직원을 위한 선물이 화제가 되고 있습니다. 미국수의원에서는 접수 담당자 주간이 있고, 그에 따른 감사 선물이 유행이라고 하네요.","우리나라도 동물병원 방문 시 받는 친절한 응대 서비스에 감사를 전하는 문화가 자리 잡았으면 합니다. 수의사들의 고마운 노력을 바라보는 시선이 따뜻해졌으면 좋겠습니다."],"blog":"","blogAngle":[],"radar":null,"tag":"훈훈"},{"id":"2026-07-21_41","day":"2026-07-21","ts":1783666800000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"반려동물 보험, 과연 필요할까?","dek":"미국서 화제된 보험 가입 실태, 생각보다 복잡한 보상 구조","source":"NerdWallet","country":"","date":"07.10","read":"1분 읽기","plate":"NerdWallet","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMifEFVX3lxTE4xZWRGNmlZdXdlT0JKa1RlWWtUc0lfSFNtQVdyd191cDB3T05UVDhzZG5GU0huTWVMRGlpbUlVVk5WUE42N3FBWU5yNFhNNk9JX2VURDdXM29lMEtXckZSRTk4M3Q1c3lXYXVVdENPSFNSYkdhVlQtX0plZmM?oc=5","body":["미국 투자 정보 사이트 NerdWallet이 2026년 가이드에서 분석한 바로는, 반려동물 보험 시장이 급성장하고 있으나 보험료 대비 실제 혜택을 받는 비율은 기대보다 낮은 편입니다. 특히 사고보다 질병 보상이 더 까다롭다는 지적이 나오고 있습니다.","국내에서도 운영하는 애완동물 보험이 늘어나고 있지만, 계약 전 세부 약관을 꼼꼼히 확인해야 한다는 전문가의 조언이 나왔습니다. 진료실 밖에서 보면 이런 일도 있네요, 보험 들어야 하나 싶을 때는 미리 여러 제품을 비교해 보세요."],"blog":"","blogAngle":[],"radar":null,"tag":"반전"},{"id":"2026-07-21_42","day":"2026-07-21","ts":1782111600000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"애완동물 응급진료비 800만 원... 미국인들 '생사결정' 불안","dek":"미국서 애완동물 진료비 급등, 응급상황시 수천만 원 비용에 미국인들 발목","source":"Fortune","country":"","date":"06.22","read":"1분 읽기","plate":"Fortune","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMimwFBVV95cUxQWW81N21DbnVnTUlUUFlVaXM3QmpGZFdrVFV1MHIya0FsRWhuT05UNGhMTXBUUHZNbHc5TUZSUG9CNGNFQUpfMFAzUlE4YkJkZE5OUFhCbmpqVnA4ckw3TmwyZWx5bUpsS2VnLVVNSUVBbVVjMTlNUHFpS2c4STJ4cUlNWkVhM0NPdFhNQ1dKTXNGUUVTMHRnSXR4SQ?oc=5","body":["미국에서 애완동물 응급진료 비용이 800만 원(약 8천 달러)까지 치솟으며, 많은 가족들이 생사를 좌우하는 어려운 선택에 직면하고 있습니다. 팬데믹 이후 강아지·고양이를 키우는 사람이 크게 늘었지만, 병원 비용 상승과 경제 상황 악화로 진료비 감당 능력 하고 있는 상황입니다.","동물 병원들도 인력 부족과 재료비 상승으로 인해 어려움을 겪고 있어, 비용절감이 어려운 것이 현실입니다. 우리 나라에서도 동물 진료비가 점점 올라가면서 같은 어려움을 겪을 수 있다는 목소리가 나오고 있습니다. 진료실 밖에서 보면 이런 일도 있네요, 우리 강아지 병원비 조금이라도 아끼려면 건강하게만 살았으면 좋겠습니다."],"blog":"","blogAngle":[],"radar":null,"tag":"논란"},{"id":"2026-07-21_43","day":"2026-07-21","ts":1782284400000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"개 한 마리 구하려고 했더니... 뜻밖의 전개","dek":"평화로운 저녁, 개 한 마리를 구한 사람은 다음날 아침에 심각한 문제를 맞는다.","source":"DogTime","country":"","date":"06.24","read":"1분 읽기","plate":"DogTime","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMifEFVX3lxTE1KRkdBc1lkQmQ5SThDdWE0STVEYmlVMDlsSDlmUU5SMTdxLUV3U1pjSEJvNGlYV19GSUs0c1FjUzdzaV9fMDNOZ2JEblp5ZWdGRWtLRmpBd3l1Y2JMSnUtNXZodlliT296SXFUNnRMQ0VMZTFETTk1T1ZpMUrSAYIBQVVfeXFMTm9zelJCOEowWml0UkR0bzJUNV9nMk45TTVkWnRYTWE4SUk2RnR5eFRKb0g5TDJzbWFCcnVua1Rzcm1DVVJMelBRcEJmMG5ocDVpMFBUTFJkYmdJRGV0Mk8waHJKejR0ZkJFcncyTzdIRURpTEJQTk5vRHFJUkc0X1VDZw?oc=5","body":["어느 시민이 동물 보호소에서 구조된 개를 무리하게 데리고 왔다. 그 개는 겁에 질려 있었지만 새로 온 보호자가 있어서 안도했을 것 같았다. 하지만 밤새 그 개는 예상치 못한 증상을 보이기 시작했다.","다음 날 아침, 구조자는 개가 심하게 아픈 것을 발견하고 긴급 동물병원으로 향했다. 수의학 전문가의 도움으로 간신히 목숨을 건졌다고 한다. 우리 주변에서도 이런 뜻밖의 경우가 있을 수 있다는 생각에 마음이 무겁다."],"blog":"","blogAngle":[],"radar":null,"tag":"반전"},{"id":"2026-07-21_44","day":"2026-07-21","ts":1784336932000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"개와 고양이가 더운데도 해바라기 하는 진짜 이유","dek":"수의사가 밝힌 놀라운 원인은 바로 '본능'입니다.","source":"AOL.com","country":"","date":"07.18","read":"1분 읽기","plate":"AOL.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiggFBVV95cUxOWGFFRVhWWkdrYVFsRVZfWmFRWU9nNkt6Sm9aR2hDbkdLZG5sT3ltWjdVeU9XejhDaHJTQTI0SERmMHpnQ1c4SDB0N2VpNFdUeEh4V2VYRFlhUDBRN1drYi1Jb3VrcVpoQU5SS05sNFVudVR2cFlzVmtwWWg5VXF0X1RR?oc=5","body":["최근 이상고온이 이어지는 가운데, 많은 주인이 불안한 표정으로 개와 고양이가 무더운데도 창가에서 해바라기하는 모습을 목격한다고 합니다. '오늘 이렇게 더운데 왜 나가 앉아있을까'라는 질문이SNS에 많이 올라오고 있죠. 수의사에 따르면 이것은 수천 년 동안 형성된 강아지와 고양이의 본능적 행동이라고 합니다.","개의 조상은 늑대인데, 이들은 사냥 후 체온을 따뜻한 곳에서 회복시키는 습관이 있었습니다. 고양이 역시 낮에는 잠을 자고 밤에 활동하는 습관에서 비롯된 건가요? 라는 의문이 들죠. 사실 고양이는 원래 사막 출신이라 따뜻함을 선호하는 성향이 강합니다. 그래서 진짜 문제는 더운데도 해바라기를 멈추지 않는다는 점이 아니라, 우리 주인이 그 과정을 제대로 관리해주지 못한다는 것이겠네요.","진료실 밖에서 보면 이런 일도 있네요. 저는 차가운 타일에 드러누운 제 강아지를 보며 '너는 왜 이렇게 더운데...'라고 했는데, 알고 보니 그게 그들의 방식이었습니다. 주인은 그들의 본능을 이해하면서도 적절한 시점에서 그늘로 데려다주는 것이 중요하겠어요."],"blog":"","blogAngle":[],"radar":null,"tag":"반전"}],"isHome":false}</script>

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';

    return '<div style="margin-top:32px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 13px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">최근 브리핑</span><span style="font-size:12.5px;color:var(--color-label-alternative);">지난 며칠 사이 주요 기사</span></div>'

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;
        x.style.display=x.tagName==='P'?'-webkit-box':'block';
        if(slack()<0) x.style.display='none';
      });
      // ② 그래도 남으면 마지막 카드의 말줄임을 한 줄씩 푼다
      var ps=el.querySelectorAll('p[style*="line-clamp"]');
      if(!ps.length) return;
      var p=ps[ps.length-1], guard=0;
      while(guard++<20){
        if(slack()<26) break;                            // 한 줄 넣을 자리도 없다
        if(p.scrollHeight<=p.clientHeight+2) break;       // 더 보여줄 문장이 없다
        p.style.webkitLineClamp=(parseInt(getComputedStyle(p).webkitLineClamp)||3)+1;
      }
    }); });
  }

  function archiveView(){
    if(S.archive===null){ return '<div style="text-align:center;padding:72px 0;color:var(--color-label-alternative);">지난 브리핑을 불러오는 중…</div>'; }

        // 날짜 블록
        +'<div style="flex:none;width:74px;">'
          +'<div style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:'+(cur?'var(--color-primary-normal)':'var(--color-label-strong)')+';line-height:1.1;">'+parseInt(p[1],10)+'.'+p[2]+'</div>'
          +'<div style="font-size:11.5px;color:var(--color-label-alternative);margin-top:2px;">'+wd+'요일</div>'
