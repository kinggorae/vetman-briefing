<noscript><div style="max-width:720px;margin:0 auto;padding:40px 20px;font-family:sans-serif;">
<h1>베트맨랩 VetManLab 해외 브리핑 — 2026-07-22</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<ul style="list-style:none;padding:0;"><li style="margin-bottom:16px;"><a href="/article/2026-07-22_1-미국-보호자-46-비용-문제로-수의료-지연-경험"><b>미국 보호자 46%, 비용 문제로 수의료 지연 경험</b></a>
<div>2026년 Lovet Checkup Report에 따르면 미국 개·고양이 보호자 46%가 지난 1년간 비용 상승으로 수의료 이용을 지연하거나 건너뛴 경험이 있는 것으로 조사되었습니다.반면 응답자의 91%는 애완동물의 생명을 구하기 위해 부채를 감수할 의향이 있다고 답변하여 보호자의 의사결정과 실제 치료 접근성 사이의 괴리가 드러났습니다.</div>

<div>개 전십자인대 질환 환자 28마리를 대상으로 ultrasound-guided sciatic nerve block와 FLAGS 차단의 운동신경 마비 정도를 비교한 전향적 무작위대조 임상시험입니다. FLAGS 차단군에서 수술 후 2시간 측정된 운동기능 점수가 유의하게 낮았습니다.</div>
<small>최신 연구 · Veterinary anaesthesia and analgesia</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-22_28-개-아토피-피부염에서-T-세포의-피부-침윤과-IL17-발현"><b>개 아토피 피부염에서 γδ T 세포의 피부 침윤과 IL-17 발현</b></a>
<div>개 아토피 피부염 환견의 피부에서 γδ T 세포가 증가하며 IL-17F를 발현하는 것을 확인하고, 이 세포가 만성 염증과 가려움에 기여할 수 있음을 보고합니다. SCART1-like RNA 프로브가 개의 γδ T 세포 표지자로 유효함을 검증했습니다.</div>

<script id="vm-issue" type="application/json">{"date":"2026-07-22","dateLabel":"2026.07.22","dateline":"2026년 7월 22일 · 수요일","editionNo":"2,028","count":28,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"}],"articles":[{"id":"2026-07-22_1","legacySlug":null,"day":"2026-07-22","ts":1784660444000,"publishedAt":"2026-07-21T19:00:44.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":true,"title":"미국 보호자 46%, 비용 문제로 수의료 지연 경험","dek":"2026년 Lovet Checkup Report에 따르면 미국 개·고양이 보호자 46%가 지난 1년간 비용 상승으로 수의료 이용을 지연하거나 건너뛴 경험이 있는 것으로 조사되었습니다.반면 응답자의 91%는 애완동물의 생명을 구하기 위해 부채를 감수할 의향이 있다고 답변하여 보호자의 의사결정과 실제 치료 접근성 사이의 괴리가 드러났습니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-Worried-Woman-Taking-Care-Of-W-463023999-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/report-highlights-financial-barriers-shaping-veterinary-care-decisions/","body":["이번 조사는 독립 연구기관 Censuswide가 미국 개·고양이 보호자 2,000명을 대상으로 실시했으며, 비용이 수의료 이용의 가장 큰 장벽임이 확인되었습니다.응답자 44%가 가장 최근에 수의사가 필요했을 때 비용 문제로 진찰을 거의 받지 못했으며, 25%는 증상이 심각한지 판단이 어려워 진료를 미룬 것으로 파악되었습니다.","온라인 정보에 대한 의존도도 두드러졌습니다.응답자의 80%가 수의사를 방문하기 전에 온라인에서 증상을 검색했으며, 이는 2025년 75%에서 증가한 수치입니다.34%는 애완동물이 아플 때 가장 먼저 온라인이나 AI를 검색하며, 25%는 온라인·AI 정보에 의존한 후 진료를 미룬 것을 후회했다고 밝혔습니다.","재정적 부담은 진찰실 밖에서도 나타났습니다.응답자 37%가 지난 1년간 수의비 지불을 위해 카드 사용이나 대출을 했으며, 같은 비율이 수의비 지출을 위해 가계 지출을 줄였다고 응답했습니다.한국 동물병원에서도 비용 투명성 확보와 보호자Communication 강화가 중요해졌습니다."],"blog":"한국 동물병원 블로그에서 '수의비 관련 보호자 소통법' 또는 '온라인 정보 의존 위험성'을 다루는 콘텐츠 기획에 활용할 수 있습니다.","blogAngle":["미국 보호자 46%가 지난 1년간 비용 문제로 수의료 이용을 지연하거나 건너뛴 경험이 있습니다.","응답자 44%가 비용 문제로 진찰을 거의 받지 못하는 상황에 놓였으며, 25%는 증상 심각성 불확실성도 장벽이었습니다.","80%가 수의사 방문 전 온라인 검색을 하며, 34%는 애완동물 발병 시 가장 먼저 온라인·AI를 활용합니다.","37%가 수의비 지불을 위해 카드·대출을 사용했고, 같은 비율이 가계 지출을 줄였습니다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지가 아픈 것 같은데 비용이 부담스러워서 진료를 미뤄도 될까요?","script":"비용 문제는 진료 결정에 큰 부담이 되시죠. 증상이 심해 보이시면 가능한 빨리 검사가 필요하고, 비용에 대한 우려가시면 치료 옵션과 예상 비용을 미리 상담해보세요. 필요한 경우 분할 결제나 관련 지원 프로그램에 대해서도 물어보셔도 됩니다."},"clinical":"비용 관련 보호자 상담 시 치료 옵션별 예상 비용을 투명하게 안내하고, 필요시 분할 결제나 병원 내 지원 프로그램 정보 함께 제공하기","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_2","legacySlug":null,"day":"2026-07-22","ts":1784659153000,"publishedAt":"2026-07-21T18:39:13.000Z","cat":"clinical","kicker":"임상","isToday":true,"title":"응급수의과 전문수의사의 중환자관리 Q&A","dek":"응급수의가 중환자관리의 핵심과 일반적인 응급실 오해에 대해 설명했습니다. 한국 동물병원에서 응급환자를 다루는 실무에 바로 적용할 수 있는 통찰을 담았습니다.","source":"DVM360","country":"","date":"07.22","read":"1분 읽기","plate":"DVM360","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMirAFBVV95cUxNN2ZyTjFfaWRwQ1RTOWdCOFhSRXkxb2xQTzZ5OEEwanVTalYzUHBDdGRBSXJ0aDhLWVJHbTh4VmRMX3hQQTdicjFSQV80S2h3TTdIRmR4Tks1clNyQmNzUVl1U2pHQWFuQWRPNnZ0THVkdmFvNmFPcWlRM0ZNc0lWa0c2ei1lNmxqTUdrWGtGWU12YTFhbVpUemtzd0REU0ljUjVOSzVudUJUaThJ?oc=5","body":["응급수의 진료에서는 환자의 상태를 빠르게 평가하고 중증도를 정확히 판단하는 것이 무엇보다 중요합니다. 전문 응급수의는 응급실에 내원하는 많은 동물들이 초기 상담에서 예상보다 훨씬 심각한 상태인 경우가 많다고ointerview에서 밝혔습니다. 이는 예방의학적 접근의 필요성을 강조하며, 평소 건강검진의 중요성을 뒷받침하는 사례입니다.","응급 상황에서 흔히 접하는 오해 중 하나는 \"응급실은 모든 것을 해결해 준다\"는 것입니다. 실제로 중환자관리에서는-보호자의 적극적 참여와 지속적인 모니터링이 치료 성과에 큰 영향을 미칩니다. 또한 응급 상황에서의 불안정한 혈압 관리나 수액 요법 등에서 과도한 치료보다 적정한 치료가 더 중요하다는 점이 강조되었습니다.","한국 동물병원 관점에서 이 interview는 응급실 운영의 질적 향상에 도움이 되는Practical한 시사점을 제공합니다. 응급환자 진료 시-보호자와의 충분한 커뮤니케이션과 치료 기대치 설정이 치료 만족도를 높일 수 있습니다. 또한 중환자관리에서 예방의학의 역할과 적정 치료의 중요성을 직원 교육에 반영하는 것이 권장됩니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원 응급실 이용 시 주의사항'이나 '응급 상황에서-보호자가 알아야 할 5가지 사실'이라는 제목으로 응급실의 현실과 올바른 이용 방법을 안내하는 글로 활용할 수 있습니다","blogAngle":["응급환자 평가에서 초기 중증도 판별이 치료 방향을 결정하는 핵심 요소입니다","응급실 오해 중 하나는 모든 문제가 응급실에서 해결 가능하다는 기대입니다","중환자관리에서-보호자의 적극적 참여와 지속적인 모니터링이 치료 성과에 중요합니다","적정한 치료가 과도한 치료보다 더 나은 결과를 낼 수 있습니다"],"radar":{"owner":{"soon":true,"q":"응급실에 갔을 때 우리 강아지/고양이 상태가 얼마나 심각한지 어떻게 알 수 있나요?","script":"응급실에서는 환자의 호흡, 맥박, 의식 상태 등을 빠르게 평가해서 중증도를 판단합니다. 생각보다 상태가 심각한 경우도 많으니, 초기 평가 결과를 잘 들어주시고 추가 검사가 필요한 경우 협조해 주세요."},"clinical":"응급환자 진료 시 보호자와의 충분한 커뮤니케이션과 치료 기대치 설정이 치료 성과에 영향을 미친다는 점 반영하여 응급실 운영 프로토콜을 점검합니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_3","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 척수 수막염에서 발견된 진균성 농피전증 1례","dek":"영국에서 미니어처 슈나우저 한 마리의 척수에서 진균 감염이 발생한 드문 사례가 보고되었습니다. MRI와 조직검사를 통해 진균성 농피전증으로 확인되었고, 수술과 항진균제로 치료 후 증상이 호전된 사례입니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.22","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":null,"sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1882308/full","body":["진균성 중추신경계 감염은 개에서 매우 드문 질환입니다. 7살 수컷 미니어처 슈나우저가 급성으로 진행하는 후지 무력감과 비정상 보행으로 내원했습니다. 임상검사에서 후지 마비 소견을 보였으며, T3-L3 부위의 척수병변이 의심되어 MRI를 실시했습니다.","MRI에서 T12-T13 부위에 조영 증강되는 척수 내 병변이 발견되었으며, 심각한 척수 부종과 수막 강화 소견을 보였습니다. 뇌척수액 분석에서 단핵구성 세포 증가(309 cells/μL)와 단백질 증가가 확인되었으나, Neospara caninum과 Toxoplasma gondii 혈청검사는 음성이었습니다. Steroid 치료를 시작했으나 증상이 악화되어 탐색적 수술을 실시했습니다.","수술 중 T12-T13 부위에서 견고한 척수 내 종괴를 적출하였으며, 조직검사에서 진균사체를 동반한 염증성 농피전증으로 확인되었습니다. Fluconazole 치료를 시작하여 6개월 후 추적 MRI에서 병변이 완전히 사라졌으며, 뇌척수액 소견도 호전되었습니다. 이후 12개월간 치료를 지속했으며, 최종적으로 경미한 후지마비만 남기고 보행 가능한 상태로 유지되었습니다.","이 사례는 개에서 원인 불명의 수막척수염 감별진단에 진균 감염을 포함시켜야 함을 시사합니다. 특히 영상소견과 뇌척수액 소견이 비특이적이어서 최종 진단에 조직검사가 필수적이라는 점을 기억해야 합니다. 항진균제 치료와 수술적 감압이 효과적일 수 있으며, 장기 추적 관찰이 중요합니다."],"blog":"한국 동물병원에서는 원인 불명의 수막척수염 환자에서 진균 감염을 감별진단에 포함시키고, 영상소견과 뇌척수액 분석만으로 치료 반응이 없는 경우 조직검사를 고려해야 한다는 점을 블로그 글로 공유할 수 있습니다.","blogAngle":["7살 미니어처 슈나우저에서 척수 내 진균성 농피전증이 발생하여 후지 마비 증상을 보였습니다.","MRI에서 T12-T13 부위에 조영 증강되는 척수 내 병변이 관찰되었으며, 뇌척수액에서 단핵구성 세포 증가와 단백질 증가가 확인되었습니다.","수술적 적출과 Fluconazole 치료 후 6개월 만에 MRI상 병변이 완전히 사라졌습니다.","18개월 추적 동안 경미한 후지마비만 남기고 양호한 상태로 유지되었습니다."],"radar":{"owner":{"soon":false,"q":"우리 강아지가 갑자기 뒷다리가 힘들어졌는데, 진균 감염일 수도 있나요?","script":"진균성 척수 감염은 개에서 정말 드문 질환입니다. 보통 세균이나바이러스 감염이 더 흔하죠. 다만 원인 불명의 수막척수염이 있을 때는 진균도 감별 진단에 포함시킬 수 있습니다. 정확한 원인은 MRI와 뇌척수액 검사, 때로는 조직검사로만 알 수 있습니다."},"clinical":"신경학적 증상(후지 마비, 비정상 보행)을 보이는 개에서 영상소견과 뇌척수액 소견이 비특이적일 때, 원인 불명의 수막척수염 감별진단에 진균 감염을 포함시켜 조직검사를 통한 최종 진단을 고려할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_4","legacySlug":null,"day":"2026-07-22","ts":1784597028000,"publishedAt":"2026-07-21T01:23:48.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"심장사상충 새로운주로 확산… 개·고양이 위험 증가 경고","dek":"미국 내에서 심장사상충이 전통적 발생 지역을 넘어 빠르게 확산되고 있어 수의사들이 경고하고 있습니다. 기후 변화와 모기 서식지 확장이 주요 원인으로 지목되면서, 연간 예방 치료를 받지 않는 동물들의 감염 위험이 높아지고 있습니다.","source":"Yahoo Creators","country":"","date":"07.21","read":"1분 읽기","plate":"Yahoo Creators","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi4gFBVV95cUxNc1E3ODA0eHByV1NfdkkyYkIyMjJUd2xUWUpHdGx0SEIwZmpKUjFZNzVEMjhLWkJqV2JIanBOQmpoZ3A4aDNGR3BEekduUU9vMXk2NEpzcWx5RWN4bzFqU2wzSE5kbUV5TzVPZmlPS3RFcXdrWjR6YnNrSm5wRHNic1VOa3I4cm1kckxxSks4VHd2TzVFOThEOFV4S053RG16MDNNcm1uMzJmc3RHTUVpeXliNVJwWUdhZExnbmJuUW5JRmt2aGlnVTNqRnpkeGcyRll2NVdjQnVIVFlSNmdvVElB?oc=5","body":["미국 전문가들에 따르면 심장사상충은 전통적으로 남부 지역에서 많이 발생했지만, 최근 북부 지역으로도 빠르게 확산되고 있습니다. 특히 미주리, 인디애나, 오하이오 등에서 감염 사례가 크게 증가했으며, 이는 기후 온난화로 모기 활동 기간이 길어지는 것과 관련이 있습니다.","수의사들은 매년 예방 약물을 투약하고 정기적인 검사를 받는 것이 핵심이라고 강조합니다. 심장사상충은 치료가 어렵고 비용이 많이 들기 때문에, 예방이 가장 중요한 질병입니다. Cornell University 수의과대학의 연구에 따르면 예방 약 복용을 중단한 동물에서 감염 사례가 급증하고 있습니다.","한국 동물병원들도 이러한 해외 확산 추세를 주시해야 합니다. 국내에서도 모기 활동철인 여름철에 심장사상충 감염 위험이 높아질 수 있으며, 해외 여행을 동반한 동반동물의 경우 더 주의가 필요합니다. 동물 소유자들에게 예방의 중요성을 안내하고, 필요시 검사를 권장하는 것이 좋습니다."],"blog":"한국 동물병원 블로그에서 ‘반려동물 심장사상충 예방, 확실하게 하는 방법은?’이라는 제목으로 국내 현실에 맞는 예방 가이드 글을 작성하면 좋습니다","blogAngle":["심장사상충이 미국 내에서 전통적 발생 지역을 넘어 북부로 빠르게 확산되고 있습니다","기후 변화로 모기 서식지가 확대되면서 연간 활동 기간이 길어지고 있습니다","정기 검사 및 예방 약 복용이 감염 예방의 핵심 방법입니다","한국 동물병원에서도 해외 여행 동반 동물 및 계절적 감염 위험에 대한 주의가 필요합니다"],"radar":{"owner":{"soon":true,"q":"여름인데 심장사상충 예방약 안 먹이면 위험한가요?","script":"네, 심장사상충은 모기가 매개하는 질병이라서 한국에서도 여름철이면 감염 위험이 있어요. 매년 예방약을 투여하고 정기적으로 검사를 받으시면 거의 예방할 수 있어요. 예방이 가장 중요하니까 꼭 챙겨주세요."},"clinical":"여름철 심장사상충 예방 프로토콜 재점검 및 보호자 예방 교육 강화","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_5","legacySlug":null,"day":"2026-07-22","ts":1784670754000,"publishedAt":"2026-07-21T21:52:34.000Z","cat":"clinical","kicker":"임상","isToday":true,"title":"반려동물과 가족을 위한 광견병 예방 가이드","dek":"광견병은 치사율이 Nearly 100%에 달하는 치명적 바이러스 질환으로, 매년 전 세계적으로 수만 명의 사상자가 발생하고 있습니다.","source":"ABC Columbia","country":"","date":"07.22","read":"1분 읽기","plate":"ABC Columbia","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiowFBVV95cUxOYm5jLVh6UmN4Y1hDR1hFZDFZQkg1MFZ4cDVLbWdKOHJqazJRRXRGR09XakNpcWVjOTBVbVUtSnVUTDVzSDFwenIwNHVJS1JEd1hHaTZQcml4QjVqdy00aEVaWWRBZEgtMmpnRkVGTzAyYlhqNXZ0YktUbEJKQVpDVWlfdzlNVmlmYnBYbXJYRDFvVTBUVlJ0RmN6cU8xOFVTT1NJ?oc=5","body":["광견병은 라비바이러스에 의해 발생하는 질환으로, 감염된 동물에 물리거나 할푼arker에 노출될 때 전파됩니다. 현재까지 치료법이 없어 예방이 유일한 방어 수단입니다.","반려동물의 경우 매년 예방접종이 필수적이며, 특히 야외 활동이 많은 동물은 더욱 주의가 필요합니다. 노출 후 즉시 세척과 의료기관 방문이 중요합니다.","한국 동물병원에서는 예방접종 외에도 노출 후 처치 프로토콜을 신속하게 진행할 수 있으며, 이는 발병을 효과적으로 예방합니다."],"blog":"한국 동물병원 블로그에서 광견병 예방의 중요성을 강조하고, 정기 예방접종의 필요성을 알리는 콘텐츠를 제작할 수 있습니다","blogAngle":["광견병은 치료 불가능한 치명적 질환이며, 예방이 유일한 방어 수단입니다.","반려동물은 매년 정기적인 예방접종을 받아야 하며, 이는 법적 의무입니다.","야생 동물과의 접촉을 피하고, 노출 시 즉시 세척 및 의료기관 방문이 필수적입니다.","한국 동물병원은 노출 후 처치와 예방접종 관리에서 핵심적인 역할을 합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 광견병 예방접종을 매년 꼭 받아야 하는지, 그냥 한 번만 받아도 되나요?","script":"광견병 예방접종은 법적으로 매년 반드시 해야 하는 필수 예방접종입니다. 치료법이 없어서 예방이 유일한 방법이고, 노출 후에도 빠르게 처치하면 발병을 막을 수 있어요. 매년 정기적으로 예방접종을 받으시고, 혹시 동물에 물렸다면 즉시 세척하고 병원을 찾아가세요."},"clinical":"반려동물 예방접종 기록에서 광견병 예방접종력을 정기적으로 확인하고, 미접종 동물에 대해 보호자에게 안내","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_6","legacySlug":null,"day":"2026-07-22","ts":1784441723000,"publishedAt":"2026-07-19T06:15:23.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"나이지리아 광역수도, 광견병 사망자 발생에 전문가들 촉구","dek":"나이지리아 광역수도(FCT)에서 광견병 발생으로 2명이 사망하는 사고가 발생했습니다. 건강 전문가들은 애완동물의 예방접종을 강화할 것을 긴급히 권고하고 있습니다.","source":"Peoples Gazette Nigeria","country":"","date":"07.19","read":"1분 읽기","plate":"Peoples Gazette Nigeria","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMipAFBVV95cUxQOFVRcFhlSDN6WElRZXZRdy05RkZ3aFl3VlRsOWVWV01renM3eDNaOEFPVVdUbjc5Y3VwNDhLLWR1QUowbDBwYlMzcFBJTzZ1RnU2R0tGd2dueWZJbU5EU2RmN0o0d1hZVEZzOWxJaWhocS03RkhYc1JqRnpzRkM2MUwtRVliSDZVVUFMVF9MT0lkNGVUVTNlY1JrWWxWb2p6bE1kYQ?oc=5","body":["나이지리아의 수도권을 관할하는 광역수도(Federal Capital Territory) 지역에서 광견병 확산이 확인되었습니다. 해당 지역 보건당국에 따르면 이번 발병으로 2명의 사망자가 발생했으며, 이는 해당 지역에서 최근 발생한 가장 심각한 광견병 사고 중 하나입니다. 광견병은 치료하지 않을 경우 치사율이 거의 100%에 달하는 위험한 질병입니다.","보건 전문가들은 이번 사고의 원인으로 Vaccination coverage gaps 예방접종률 저하와 함께 지역사회 내 민반견 관리 미흡을 지목했습니다. 전문가는 \"모든 개와 고양이는 정기적으로 광견병 예방접종을 받아야 한다\"며, 특히 노출 후Immediate shelter 노출 시 즉각적인 의료 처치가 필수적이라고 강조했습니다. 또한 미접종 애완동물의 경우 근접 접촉 시 사람에게 전염될 수 있음을 경고했습니다.","한국 동물병원에서도 이번 사례는 중요한 시사점을 제공합니다. 국내에서는 광견병 발생이 드물지만, 해외 여행이나 입국 동물과의 접촉 시 위험이 존재합니다. 따라서 진료 시 예방접종 여부를 확인하고, 해외 여행력을 파악하는 문진이 중요합니다. 또한 소유주들에게 정기 예방접종의 필요성을 안내하는atient education 환자 교육이 필요합니다."],"blog":"국내 광견병 발생은 드물지만, 진료 시 해외 여행력 확인과 예방접종 권고로 위험을 사전 차단하는 사례를 작성할 수 있습니다","blogAngle":["나이지리아 광역수도에서 광견병 발생으로 2명 사망","보건 전문가들, 모든 개와 고양이의 정기 광견병 예방접종 권고","예방접종률 저하와 민반견 관리가 이번 발병의 주요 원인으로 분석됨","한국 동물병원에서는 해외 여행력 문진과 예방접종 안내가 중요합니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지/고양이가 해외 여행 안 가도 광견병 예방접종 해야 하나요?","script":"광견병은 치료하지 않으면 치사율이 거의 100%에 달하는 위험한 질병입니다. 국내에서는 발생이 드물지만, 해외 여행이나 입국 동물과의 접촉 시 위험이 있을 수 있어 정기 예방접종을 유지하는 것이 권장됩니다."},"clinical":"외래 진료 시 해외 여행력 문진에 광견병 예방접종 여부 확인을 추가하고, 미접종 동물의 보호자에게 예방접종 필요성을 안내한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_7","legacySlug":null,"day":"2026-07-22","ts":1784655232000,"publishedAt":"2026-07-21T17:33:52.000Z","cat":"clinical","kicker":"임상","isToday":true,"title":"뉴욕주 광견병 위험 증가…애완동물과 가족을 지키는 예방 방법","dek":"뉴욕주에서 광견병 위험이 확산됨에 따라 동물보건 당국이 애완동물 소유주들의 예방접종과 야생동물 접촉 주의사항을 안내하고 있습니다.","source":"WNYT.com","country":"","date":"07.22","read":"1분 읽기","plate":"WNYT.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMihAFBVV95cUxPZkFPY3d5UmVnS2VKcDZZV3hXLXZEekxqaWlNa3lLd05ENE1wVVQ2ZktsS3pwNU9FcVFvUmlhQUdPLTAtNUZ3OEY1SkNyYUxCX285ME9VZ3ZpMFQ5QTNoYVV2eERMOE51T1JHWTVXRm84NmtmTldieXh2Wjg2N2VwZjg5dHI?oc=5","body":["뉴욕주 동물보건 당국은 최근 Franklin County를 중심으로 광견병 사례가 확인됨에 따라 주의가 필요하다고 밝혔습니다. 광견병은 치사율이 100%에 달하는 치명적인 바이러스 질환으로, 동물과 사람의 감염 모두 사소한 노출 후 증상 발현 시 치료가 불가능합니다. 매년 전 세계적으로 약 5만9,000명이 광견병으로 사망하며, 그 중 40%가 아동입니다.","애완동물의 경우 개와 고양이에 대한 정기적인 예방접종이 가장 효과적인 예방 방법입니다. 또한 야생 동물(박쥐, 너구리, 스컹크, 여우 등)과 직접 접촉하지 않도록 하고, 애완동물을 야외에서 자유롭게 방목하는 것을 금지해야 합니다. 만약 동물에게 물렸거나 할퀴린 경우, 즉시 비누와 물로 상처를 씻고 의료기관을 방문해야 합니다.","한국 동물병원에서도 유사한 상황을 예방하기 위해 예방접종 중요성을 강조할 필요가 있습니다. 특히 야생동물 접촉 기회가 많은 애완동물이나 외부 활동을 많이 하는 강아지에 대해서는 추가적인 주의가 필요합니다. 또한 애완동물 소유주들에게 노출 후 응급 처치의 중요성을 안내하는 것이 좋습니다."],"blog":"한국 동물병원 블로그에서 '우리 강아지의 예방접종, 놓치고 계신가요?'라는 제목으로 예방접종 중요성과 야외 활동 시 주의점을 다루는 글이 되면 좋습니다","blogAngle":["광견병은 치사율 100%의 치명적 바이러스 질환으로, 증상 발현 후 치료가 불가능합니다","개와 고양이에 대한 예방접종이 가장 효과적인 예방 방법입니다","야생동물(박쥐, 너구리, 스컹크 등)과 직접 접촉을 피해야 합니다","동물에게 물린 경우 즉시 비누와 물로 상처를 씻고 의료기관을 방문해야 합니다"],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지 광견병 예방접종은 몇 년마다 맞아야 하는 거예요?","script":"개와 고양이의 광견병 예방접종은 국가 규정에 따라 1년 또는 3년마다 접종하셔야 합니다. 정기적인 예방접종이 가장 중요한 예방 방법이고, 야생동물과 접촉했다면 반드시 병원에 오셔서 확인받으세요."},"clinical":"광견병 예방접종 국가 규정을 점검하고, 진료 시 야생동물 접촉 문진을 포함하는지 확인한다","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_8","legacySlug":null,"day":"2026-07-22","ts":1784654261000,"publishedAt":"2026-07-21T17:17:41.000Z","cat":"practice_management","kicker":"병원 경영","isToday":true,"title":"농촌 수의사 부족, 해결책은 다른 곳에 있을까","dek":"미국 농촌 지역에서 대축수 수의사의 심각한 부족이 지속되고 있으며, 전문가들은 전통적인 채용 방식에 의문을 제기하고 있습니다. 이 문제의 근본 원인이 인력 자체가 아닌 구조적 접근법에 있는지를 검토해 볼 필요가 있습니다.","source":"Bovine Veterinarian","country":"","date":"07.22","read":"1분 읽기","plate":"Bovine Veterinarian","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMinAFBVV95cUxNZlIxTW1mWXZhNDNKMm1tV01SdWl4Rkl4RG1fZVA4ekNJa1BOalBHV0hRelgwZ2ZHWEJrQWhNTXVWRWs4Y1lkUHhFR21nUk50OEFaVi1FLTBSLVlKdTBxRnRodm05RlZxYloxVzg3SllTNFZRQThsTVhJQzF1R0g5UW15ODNDNkVZZFdCaVA0OVZIcXFTd2NITTJyd3g?oc=5","body":["미국 농촌 지역의 수의사 부족은 수십 년간 누적되어 온 구조적 문제입니다. 농촌 지역은 도시 대비 봉급 경쟁력이 낮고, 진료 시설이 부족하며, 사회적 인프라가 열악하다는 인식이 자리 잡혀 있습니다. 현재의 주요 채용 전략은 도시 출신 수의학 대학생들을 농촌로 유인하는 데 초점을 맞추고 있으나, 이 접근법의 효과성에 의문이 제기되고 있습니다.","전문가들은 오히려 농촌 지역 출신이거나 농촌에서 자라난 학생들을 중심으로 한 접근이 더 효과적일 수 있다고 주장합니다. 이러한 학생들은 지역 사회와의 유대 관계가 이미 형성되어 있어 이주율이 낮고, 지역 특유의 어려움을 불편 없이 받아들이는 경향이 있습니다. 현재 수의학 대학의 도시 집중화와 교육 과정의 도시 중심 커리큘럼이 이러한 다양성을 저해하고 있다는 분석도 나오고 있습니다.","한국의 동물 병원 입장에서도 이 논의는 시사하는 바가 큽니다. 농축산 분야에서 일하는 수의사 인력을 확보하기 위해서는 도시 중심의 채용 관행에서 벗어나 지역의 잠재 인력을 조기에 발굴하고 지원하는 체계를 고려해야 합니다. 한국 수의계에서도 농촌 현장 경험 기회를 확대하고, 지역 기반의 인재를 양성하는 교육 프로그램 개발이 논의될 수 있을 것입니다."],"blog":"한국 동물 병원 블로그에서는 농축산 현장에서 성장한 수의대생들을 위한 멘토십 프로그램의 필요성에 대해 다룬 글이 좋은 반응을 얻을 수 있을 것입니다.","blogAngle":["미국 농촌 지역에서 대축수 수의사 부족이 장기화되고 있으며, 전통적인 도시 출신 인력 유인 전략의 효과성에 의문이 제기되고 있습니다.","전문가들은 지역 사회와 유대가 있는 농촌 출신 수의학 전공자를 집중적으로 지원하는 것이 장기적 유지율 향상에 더 효과적일 수 있다고 주장합니다.","수의학 교육의 도시 집중화가 잠재적 농촌 수의사 후보의 다양성을 제한하고 있다는 지적이 있습니다.","한국에서도 농축산 분야 수의사 확보를 위해 지역 기반 인력 양성 체계 구축의 필요성이 대두될 수 있습니다."],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_9","legacySlug":"2026-07-22_9-개-장-Microbiome-연구-새-시대-열었다","day":"2026-07-22","ts":1784638844000,"publishedAt":"2026-07-21T13:00:44.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"개 장 미생물군집 연구 새 시대 열었다","dek":"연구자들이 최근 개 장내 미생물군집에 관한 가장 종합적인 데이터베이스를 구축했습니다. 기존에 인간 데이터를 활용해 인식하던 세균의 25%에서 크게 확대된 이 연구는 개의 건강 관리 접근 방식에 근본적 변화를 가져올 것으로 기대됩니다.","source":"IVC Journal","country":"미국","date":"07.21","read":"1분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_p6h544p6h544p6h5-600x367.png","sourceUrl":"https://ivcjournal.com/unlocking-the-canine-gut-a-new-era-in-dog-microbiome-research/","body":["수의사들은 오랫동안 개 환자의 장 건강의 중요성을 인식해 왔습니다. 그러나 개 미생물군집에 대한 이해는 놀라울 정도로 제한적이었습니다. 지금까지 연구자들은 개 장내 미생물군집을 연구할 때 주로 인간 데이터베이스에 의존해 왔는데, 이는 큰 문제였습니다. 개는 작은 인간이 아니며, 그들의 장내 세균은 매우 다른 숙주, 식단, 환경과 수백만 년간 공진화를 반영합니다.","최신 시퀀싱 방법을 광범위한 샘플 세트에 적용한 연구진은 이제까지 만들어진 가장 완전한 개 장내 미생물군집 자원을 구축했습니다. 연구 결과는 소화, 면역 기능, 대사, 영양소에 미생물군집이 중요한 역할을 한다는 것을 밝혔습니다. 새로 발견된 종들은 알려진 독력 인자를 보이지 않았으며, 이는 숙주에게 유익한 공생 생물임을 시사합니다.","이 연구는 많은 이들이 의심해 온 점을 재확인합니다. 개의 미생물군집은 독특하며 그 자체로 연구받을 가치가 있습니다. 개의 특화된 데이터베이스가 확대됨에 따라 수의사들은 더 나은 진단 도구, 표적 프로바이오틱 치료, 만성 소화기 질환에서 면역 기능과 영양에 이르기까지 장내 세균이 어떻게 영향을 미치는지에 대한 더 깊은 이해를 기대할 수 있습니다."],"blog":"개 장 미생물군집의 종 다양성과 기능에 대한 최신 연구 결과를 바탕으로, 한국 동물병원에서 영양사와 프로바이오틱 상담 시 활용할 수 있는 교육 자료를 제작해 볼 수 있습니다.","blogAngle":["연구팀이 인간 데이터베이스 의존에서 벗어나 개 특화 미생물군집 데이터베이스를 구축하여 인식 가능 세균 비율을 크게 확대했습니다.","새로 확인된 장내 세균 종들은 알려진 독력 인자를 보이지 않아 숙주에게 유익한 공생 생물으로 판단됩니다.","연구를 통해 소화, 면역, 대사, 영양 등 다양한 기능에서 미생물군집의 역할을 최초로 규명했습니다.","건강한 개의 항생제 내성 패턴 기준선을 수립하여 항생제 관리에 귀중한 데이터를 제공합니다."],"radar":{"owner":{"soon":true,"q":"선생님, 강아지 장 건강에 좋은 프로바이오틱스나 보충제 먹여도 될까요?","script":"개의 장 는 사람과 달라서 사람의 프로바이오틱스를 그대로 주는 건 적절하지 않을 수 있어요. 현재 연구가 진행 중이지만, 아직 임상에서 바로 적용할 만한 확정적인 권고는 없으니 장 문제가 있다면 진료로 확인해 보시는 게 좋겠습니다."},"clinical":"개 장 건강 보충제·프로바이오틱스 처방 시 사람용이 아닌 개 전용 제품을 선택하고, 해당 제품의 연구 근거를 점검하는 것이 좋습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_10","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개와 고양이 프로바이오틱 기능성 사료 최신 연구 동향","dek":"개와 고양이 기능성 사료에서 프로바이오틱 활용이 급증하고 있는 가운데, 숙주특이적 균주 개발의 최신 연구가 정리되었습니다. 향후 정밀 프로바이오틱 시대가 도래합니다에 대비한 업계의 방향성이 제시되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.22","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":null,"sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1881134/full","body":["글로벌 반려동물 산업의 급속한 성장과 함께 반려동물의 건강 관리에 대한 관심이 높아지면서, 기능성 사료 시장이 빠르게 확대되고 있습니다. 프로바이오틱은 안전성과 무독성, 다중 건강 조절이라는 장점으로 가장 널리 사용되는 기능성 소재로 자리 잡았습니다.","연구에 따르면 프로 바이오틱은 개와 고양이의 설사, 변비, 염증성 장질환 등 소화기 질환을 효과적으로 완화하는 것으로 보고되었습니다. 또한 만성 신장병, 비만, 알레르기, 구취 등의 임상 증상 완화에 도움이 되는 것으로 나타났습니다. 균주별 기능으로는 장벽 기능 강화, 면역 조절, 대사 항상성 유지 등에 작용합니다.","현재 과제로는 숙주특이성 부족, 엄격한 임상시험 부족, 가공 과정에서의 안정성 문제가 지적됩니다. 한국 동물병원에서는 프로바이오틱 사료 처방 시 개별 동물의 상태를 고려한 맞춤형 영양 관리가 중요하며, 향후 정밀 프로바이오틱 개발 방향에 대한 지속적인 관심이 필요합니다."],"blog":"한국 동물병원에서는 프로바이오틱 사료 처방 시 단순히 제품 선별에 그치지 않고, 개체별 장 건강 상태와 질병 이력을 고려한 맞춤형 영양 상담 서비스를 제공하는 방안이 블로그 콘텐츠 소재가 될 수 있습니다","blogAngle":["프로바이오틱은 개와 고양이의 소화기 질환부터 만성 신장병, 비만, 알레르기까지 다양한 건강 문제에 활용됩니다","숙주특이적 균주 개발이 중요하나, 현재까지의 프로바이오틱 제품은 개와 고양이 각각의 특성에 충분히 맞춤화되지 않았습니다","정밀 영양(Precision 영양) 관점에서 개별 동물에 맞는 프로바이오틱 개발이 향후 주요 과제로 제시됩니다","가공 과정에서의 안정성 확보와 엄격한 임상시험 기준 수립이 업계 과제로 남아 있습니다"],"radar":{"owner":{"soon":true,"q":"강아지／고양이 소화기 문제에 프로바이오틱 사료 먹이면 좋을까요?","script":"프로바이오틱이 소화기 건강에 도움이 될 수 있다는 연구가 있지만, 효과가 보장된 것은 아니에요. 특히 이미 다른 질환이 있는 경우에는 사료 바꾸기 전에 수의사와 상담하는 것이 안전해요."},"clinical":"프로바이오틱 사료 처방 시 보호자에게 '증상 완화를 보장하는 것이 아니라 보조적으로 활용할 수 있다'고 명확히 안내하고, 기존 질환이 있는 동물은 처방 전 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_11","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 귀염염 Pseudomonas aeruginosa의 항균제 감수성 및 유전체 저항성 분석","dek":"헝가리에서 수집된 개 귀염염 관련 Pseudomonas aeruginosa 110개 균주를 대상으로 표현형 항균제 감수성 검사와 유전체 분석을 실시하여 내성 메커니즘을 규명했습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.22","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":null,"sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1902036/full","body":["Pseudomonas aeruginosa는 개 귀염염의 주요 원인균으로, 특히 만성, 재발성, 치료 저항성 증례에서 문제가 됩니다. 이 균주는 낮은 외막 투과성, biofilm 형성 능력, efflux 펌프 시스템 및 추가 저항성 유전자 획득 능력을 갖추고 있어 경험적 치료가 어렵고 지역별 감시가 필수적입니다.","본 연구에서는 110개 균주에 대해 14가지 항균제 및 소독제에 대한 최소 억제 농도(MIC) 검사를 실시하고, 주요 MIC 범위와 저항성 프로파일을 포함하는 70개 균주를 선정하여 전장유전체 분석을 수행했습니다. 분석 결과, 다양한 항균제 내성 유전자가 검출되었으며, 이는 임상에서 선택되는 항균제의 효과를 평가하는 데 중요한 근거가 됩니다.","한국 동물병원에서는 만성 귀염염 증례에서 Pseudomonas aeruginosa 감수를 제대로 확인하기 어려운 상황이 있을 수 있습니다. 이번 연구는 지역별 내성 현황 조사의 필요성과 항균제 선택 시 표현형 감수성 검사와 유전체 분석을 병행하는 것의 중요성을 제시합니다."],"blog":"한국 동물병원에서도 만성 귀염염 증례의 균주별 내성 프로파일을 분석하여 지역별 가이드라인을 수립하는 데 활용할 수 있습니다.","blogAngle":["개 귀염염 관련 Pseudomonas aeruginosa 110개 균주에 대해 14가지 항균제 및 소독제의 MIC 검사를 실시했습니다.","70개 균주의 전장유전체 분석을 통해 다양한 항균제 내성 유전자가 검출되었습니다.","낮은 외막 투과성, biofilm 형성, efflux 펌프 시스템이 내성 발달에 기여합니다.","지역별 내성 현황 조사와 표현형 감수성 검사의 중요성이 강조됩니다."],"radar":{"owner":{"soon":true,"q":"강아지 귀염염이 오래되니까 항생제가 잘 안 듣는 것 같은데, 세균 내성 문제일 수 있나요?","script":"만성 귀염염에서는 같은 균이 항생제 내성을 얻을 수 있어요. 그래서 효과가 없는 항생제를 계속 쓰기보다는, 세균 배양 검사를 통해 어떤 약이 실제로 듣는지 확인하는 게 중요합니다."},"clinical":"만성·재발성 개 중이염 환자군에서 세균 배양 및 감수성 검사를 먼저 실시하고, 경험적 항생제 사용 후 호전되지 않으면 유전체 분석까지 고려하는 프로토콜 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_12","legacySlug":null,"day":"2026-07-22","ts":1784496600000,"publishedAt":"2026-07-19T21:30:00.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"퍼듀수의대 학생 정원 50% 확대... 성장통 예상","dek":"미국 퍼듀대학교수의대가 학생 정원을 50% 확대한다고 발표했습니다. 전국적인 수의사 부족 상황에서 나온 결정인 만큼, 업계에서는 확대의 효과와 함께 수반될 과제에 관심이 집중되고 있습니다.","source":"nwitimes.com","country":"","date":"07.20","read":"1분 읽기","plate":"nwitimes.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMilAFBVV95cUxQMS1EdVhTXy1lWGNMU3JkcVg1YUVFcElzVmVXdVp4emd2TUZucmNZeHltU3BFWlVJeGRJQmNxY0VLb3Y2Y3Y2WGJmcnRvTlVncW9NS3FBMXRlZGdTeXRkNU5VeTFZRmxyTlk1ZW05MElNczRfeGdWQktqal9ab0tCYmszNmEybjdqejEwMzhDM0luS3Ba?oc=5","body":["퍼듀대학교수의대는 미국 중서부에서 가장 오래된 수의대 중 하나로, 연간 약 100명의 수의사를 배출해왔습니다. 미국수의사회(AVMA)에 따르면 미국 전체적으로 2023년 기준 약 4만4000명의 수의사 부채가 발생하고 있으며, 특히 소동물 진료 분야에서 인력 부족이 심화되고 있습니다. 이러한 상황에서 퍼듀대는 지역사회과 산업계의 수요에 대응하기 위해 정원 확대를 결정하게 되었습니다.","계획에 따르면 퍼듀수의대는 향후 5년간 학생 정원을 현재 수준에서 50%까지 확대할 예정입니다. 이를 위해 임상 실습 시설 확장과 신규 교수 채용이 필요하며, 학교측은 이를 위해 수천만 달러의 투자를 검토하고 있습니다. 동시에 기존의 교육 품질 유지와 임상 실습 기회 제공에 대한 우려도 제기되고 있습니다. 일부 전문가들은 급격한 확대가 교육 역량을 희석시킬 수 있다며 신중한 접근을 권고하고 있습니다.","한국 동물병원 관점에서 보면, 미국 수의계의 인력 충족 노력은 글로벌 수의사 공급망에 장기적으로 영향을 미칠 수 있습니다. 한국의 수의사 부족 상황과 비교할 때, 해외 사례가 국내 수의계 정책에 참고가 될 만합니다. 특히 임상 실습 교육의 질 관리와 졸업 후 인력 배치 방안은 한국에서도 논의가 필요한 주제입니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원 신규 수의사 채용 현황과 해외 수의대 확대의 영향'을 주제로 인력 확보 전략을 다뤄볼 수 있습니다","blogAngle":["퍼듀수의대가 학생 정원을 5년간 50% 확대할 계획입니다","미국은 약 4만4000명의 수의사 부족 상태로, 인력 충족이 긴급 과제입니다","교육 품질 유지와 임상 실습 기회 확대가 동시에 요구됩니다","한국 수의계에서도 인력 확보와 교육 품질 관리에 대한 논의가 필요합니다"],"radar":{"owner":null,"clinical":"국내 수의대 정원 확대 가능성을 고려해 임상 실습 교육 질 관리 방안과 졸업 후 인력 배치 전략을 선제적으로 점검할 필요가 있습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_13","legacySlug":null,"day":"2026-07-22","ts":1784648715000,"publishedAt":"2026-07-21T15:45:15.000Z","cat":"clinical","kicker":"임상","isToday":true,"title":"미국 윈체스터서 박쥐 광견병 양성 확인…주거지역 경고","dek":"미국 켄터키주 윈체스터 인근 Shanahan Lane 지역에서 박쥐가 광견병 검사로 양성 반응을 나타냈습니다. 이번 사례는 애완동물과 야생동물 간 광견병 전파 위험성을 재차 상기시키는 사건입니다.","source":"Winchester Sun","country":"","date":"07.22","read":"1분 읽기","plate":"Winchester Sun","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMikAFBVV95cUxQbWotdkc1dW1OcTB1N1c4cUtHRURqMjZmT29EdHVwOERRekRaWFdGUE41MU44RHRfbGR6aXM4N1FKQVV6MlBIZi1zMWo5R2dNVHk1TmRVOUJVeVAybkJvVGc5Vk84WG9YQmU5b1VFc1FkV2ZudGVpNVNHR20zWVNYQ0l0ckxraERLaXM5czMwdm4?oc=5","body":["미국 질병통제예방센터(CDC)와 각 주 보건당국은 야생 동물에서 광견병이 발견될 경우 인근 주민들에게 경고를 발령하고 예방 조치를 안내하는 체계를 갖추고 있습니다. 박쥐는 미국에서 광견병 매개체로 가장 흔히 발견되는 야생 동물 중 하나로, 침입한 건물이나 노출된 피부에 물린 경우 광견병 바이러스에 노출될 수 있습니다.","현지 보건 당국은 이번 검출에 대해 해당 지역 주민들에게 애완동물의 예방접종 상태를 점검하고, 야생동물과 접촉한 경우 즉시 의료기관에 문의할 것을 권고했습니다. 또한 박쥐와 같은 야생동물을 발견해도 직접 손으로 잡거나 만지지 않도록 경고했습니다.","한국 동물병원에서도 야생동물에 노출된 이력이 있는 동물 환자가 내원할 경우 광견병의 가능성을 우선적으로 고려해야 합니다. 특히 밖에서 자유롭게 나들이하는 고양이나 개에서 야생동물에 물린 병력이 있을 경우 광견병 예방 프로토콜에 따른 조치와 보호자 교육이 중요합니다."],"blog":"한국 동물병원 블로그에서 ‘야외 활동 후 이상 행동 보이는 강아지, 무엇을 확인해야 하는가?’라는 제목으로 광견병 예방과 야생동물 접촉 이력 확인의 중요성을 다루는 글을 쓸 수 있습니다","blogAngle":["미국 켄터키주 윈체스터 인근에서 박쥐가 광견병 양성으로 확인되어 지역사회에 경고가 발령되었습니다","박쥐는 미국에서 광견병 매개 야생동물 중 가장 빈번한 종으로, 물리면 치명적 감염 위험이 있습니다","보건 당국은 주민들에게 애완동물의 예방접종 상태 점검과 야생동물 접촉 시 의료기관 방문을 권고합니다","한국 동물병원에서는 야외 활동 후 이상 증세를 보이는 동물에서 야생동물 접촉 가능성을 반드시 확인해야 합니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지가 밖에서 고양이나 다른 동물한테 물렸는데 광견병 검사 받아야 하나요?","script":"야생동물에 물렸거나 접촉한 기록이 있다면 광견병 가능성을 배제할 수 없어서 반드시 진찰을 받아야 합니다. 예방접종이 되어 있는지, 노출 당시 상황은 어땠는지 파악한 뒤 필요한 조치를 설명해 드리겠습니다."},"clinical":"야생동물에 노출된 이력이 있는 동물 환자가 내원할 경우 광견병 가능성을 우선적으로 고려하고, 예방접종 상태 및 접촉 경력을 반드시 확인하도록 문진 프로토콜을 점검하세요.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_14","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"인도 일차 진료수의사의 개 특발성 간질 관리 실태 조사","dek":"인도와 같이 수의 신경과 전문의가 부족한 국가에서 일차 진료수의사가 개 특발성 간질을 어떻게 관리하는지 관한 실태 조사가 발표되었습니다. 전문의의 교육 자료가 수의사의 자신감 향상에 긍정적 영향을 미친 것으로 확인되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.22","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":null,"sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1868929/full","body":["미국 노스캐롤라이나 주립대학교 수의학과 연구팀이 인도 일차 진료수의사 187명을 대상으로 개 특발성 간질 관리 실태를 조사했습니다. 인도는 수의 신경과 전문의가 부족하여 일차 진료수의사가 간질 환자를 직접 관리하는 경우가 많습니다. 연구는 1단계 설문조사와 6개월 후 후속 설문을 통한 2단계로 진행되었으며, 수의사의 관리 자신감을 1~5점으로 평가했습니다.","조사 결과 페노바르비탈이 가장 많이 처방된 항간질제로, 효능을 이유로 선택했습니다. 응답자의 63%는 정기적인 혈액 검사를 권장했고, 45%는 페노바르비탈 또는 칼륨 브로마이드의 혈중 농도를 6~12개월마다 측정할 것을 권장했습니다. 반면 33%는 정기적인 혈중 농도 측정을 실시하지 않는 것으로 보고했습니다. 장기적인 간질 관리와 약물 부작용 관리가 가장 큰 어려움으로 평가되었습니다.","2단계 조사에 참여한 36명 중 47%가 교육 자료를 매우 유용하다고 평가했습니다. 평균 자신감 점수는 1단계 3.3점에서 2단계 3.69점으로 상승했습니다. 그러나 56%는 두 조사 간 변화가 없다고 보고했습니다. 이 연구는 한국에서도 일차 진료수의사의 간질 관리 역량 강화를 위해 전문의 교육 자료의 활용이 효과적일 수 있음을 시사합니다."],"blog":"한국 동물병원에서도 일차 진료수의사의 신경과 질환 관리 역량 강화를 위한 전문 교육 자료 개발과 활용 가능성을 고민해 볼 수 있습니다","blogAngle":["인도 일차 진료수의사 187명을 대상으로 한 조사에서 페노바르비탈이 가장 흔히 처방된 항간질제로 확인되었습니다","응답자의 3분의 1 이상이 정기적인 항간질제 혈중 농도 측정을 실시하지 않는 것으로 나타났습니다","장기적인 간질 관리와 약물 부작용 관리가 수의사에게 가장 큰 도전 과제로 평가되었습니다","교육 자료 제공 후 수의사의 평균 자신감 점수가 3.3점에서 3.69점으로 유의미하게 상승했습니다"],"radar":{"owner":null,"clinical":"개 간질 환자에서 페노바르비탈 등 항간질제 혈중 농도 정기 측정 여부와 간질 관리 자신감을 점검하고, 보호자에게 장기 관리 계획과 약물 부작용 가능성을 충분히 안내하는지 자문해 보세요.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_15","legacySlug":null,"day":"2026-07-22","ts":1784567633000,"publishedAt":"2026-07-20T17:13:53.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"오하이오 주하원, 수의사 인력 부족 해결 법안 통과","dek":"오하이오 주하원이 수의사 인력 부족 문제를 해결하기 위한 법안을 통과시켰습니다. 농촌 지역 수의사 확보를 위한 다양한 지원 방안이 포함된 이 법안은 미국 전역의 인력난 대응 사례로 주목받고 있습니다.","source":"Ohio House of Representatives (.gov)","country":"","date":"07.21","read":"1분 읽기","plate":"Ohio House of Representatives (.gov)","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMipgFBVV95cUxPZGRjdWo2Uks4a3VlM1NfZ0hqdTJxWjNFX0ViZ21qb3RTUHR2QUhKRlNnYzdfTGk1dmJvRGJkbVNhcXNXMm5nd281a3o1cUQ2NDVYWnVUN2tUNHlsQlM0dmNnR2dWaTk5eWxic1FvT3R6XzNTcFVoX3h6ZXR3a2ZBeGhjeW5LTHlqU1h6RTlaQ0Fic0FyOWJrRktQSGRFX2IyUTlwQ2pn?oc=5","body":["미국 전역에서 수의사 인력 부족이 심각한 사회문제로 대두되고 있습니다. 특히 농촌 지역에서는 수의사를 구하기 어려워 축산업과 동반 동물 진료에 차질을 빚고 있습니다. 오하이오 주는 이러한 상황에서 주 정권 차원에서 법적 해결책을 모색하게 되었습니다.","이번 법안은 수의사 면허 취득 요건을 일부 완화하고, 농촌 지역에서 일정 기간 근무한 수의사에게 학자금 상환 지원을 제공하는 내용을 담고 있습니다. 또한 농촌 지역 지원 민간 수의사에게 세제 혜택을 부여하는 조항도 포함되어 있습니다. 이를 통해 부족한 수의사 인력을 농촌 지역에 유도하려는 의도가 반영되어 있습니다.","한국 동물병원에도 시사하는 바가 있습니다. 한국의 중소도시와 농촌 지역 역시 수의사 인력 부족을 경험하고 있어, 인력 유인 정책의 필요성이 대두될 수 있습니다. 원문에서는 구체적인 지원금 규모와 면허 완화 범위를 확인할 수 있어, 한국의 정책 수립 시 참고가 될 수 있습니다."],"blog":"한국의 중소 동물병원에서도 인력 확보 전략을 마련할 때, 농촌 지역 지원 제도의 사례를 참고하는 콘텐츠를 제작해 볼 수 있습니다.","blogAngle":["오하이오 주하원이 수의사 부족 해결을 위한 법안을 가결했습니다.","법안에는 학자금 상환 지원과 세제 혜택 등 농촌 유인 정책이 포함되어 있습니다.","미국 전역에서 농촌 지역 수의사 확보가 긴급 과제로 부상하고 있습니다.","한국 중소도시의 수의사 부족 문제에도 정책적 대응이 필요할 수 있습니다."],"radar":{"owner":null,"clinical":"자원의 인력난 관련 동향 및 대안 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_16","legacySlug":null,"day":"2026-07-22","ts":1784567688000,"publishedAt":"2026-07-20T17:14:48.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"라신County 박쥐에서 광견병 양성 확인...주의 필요","dek":"위스콘신주 라신County에서 박쥐가 광견병 양성 판정을 받았습니다. 이번 사례는 동물병원에서 Münral 감염병 관리의 중요성을 다시 한번 상기시킵니다.","source":"WTMJ","country":"","date":"07.21","read":"1분 읽기","plate":"WTMJ","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijgFBVV95cUxPMDNSQ3RhREhMTkswMDY3OV9UUkxjdmJqc2N0YjFRdG5PUnBqMWFrWTMwMFBXSF83MzFOSFJodlpXSVRZalFEM0FndGxtcXhya3lxekxDLUMxUWZnT0g3ZTY0UC00ODYyaVd6a29faHp3OTRvUGxBZkxaamF0MU95RGczdFZlYno2ODM4SXh3?oc=5","body":["라신County 공중보건당국은 해당 지역에서 포획된 박쥐의 광견병 검사가 양성으로 나왔으며, 이에 따라 지역 주민들에게 야생 박쥐와의 접촉을 피할 것을 권고했습니다. 광견병은 치료하지 않을 경우 치명적일 수 있는 바이러스 질환으로, 동물에서 인간으로 전파될 수 있습니다.","공중보건당국은 애완동물 소유자들에게 예방접종을 이행하고, 야생 동물과의 접촉을 최소화할 것을 권고했습니다. 또한 박쥐가 집 안으로 진입하는 경우 전문적으로 처리해야 하며, 노출 의심 시 즉시 의료기관과 동물병원에 상담할 것을 강조했습니다.","한국 동물병원에서도 야생 동물에 의한 감염 위험에 대한 인식이 높아지고 있습니다. 특히 개·고양이의 광견병 예방접종률 향상이 중요하며, 환자에게 야생 동물 접촉 후 이상 증상이 나타나면 신속한 대응이 필요합니다."],"blog":"한국 동물병원 블로그에서 '야외 활동 증가철, 애완동물의 광견병 예방관리' 주제로 활용할 수 있습니다.","blogAngle":["라신County의 박쥐에서 광견병 바이러스가 검출되었습니다.","공중보건당국은 야생 박쥐와의 접촉 금지를 권고했습니다.","광견병은 치료하지 않으면 치명적일 수 있는 질환입니다.","한국 동물병원에서는 예방접종과 신속한 진료 대응이 중요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 광견병 예방접종 언제 했는지 확인해 주세요.","script":"기록을 확인해 드리겠습니다. 광견병 예방접종은 법적 의무이고, 매년 추가접종이 필요합니다. 야생동물과 접촉했거나 이상 증상이 있다면 즉시 내원해 주세요."},"clinical":"개·고양이 광견병 예방접종 기록을 점검하고, 미접종 동물에게는 접종을 권장합니다","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_17","legacySlug":null,"day":"2026-07-22","ts":1784672976000,"publishedAt":"2026-07-21T22:29:36.000Z","cat":"practice_management","kicker":"병원 경영","isToday":true,"title":"콜로라도수의사, 약물·음주 위반으로 면허 포기","dek":"미국 콜로라도주의 한 수의사가 약물 및 음주 관련 위반 혐의로 면허를 포기했습니다. 이는 동물병원에서의 약물 오용과 전문가 윤리 문제에 대한 관심을 촉발하고 있습니다.","source":"KRDO","country":"","date":"07.22","read":"1분 읽기","plate":"KRDO","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigAFBVV95cUxNYm9XRXc5ZENtbGtuajVUMG1FQThmdk9Kd280a2FhZ1FBM3YyNG5HemxBUnNFT0xmblpGYVJONGs2N0JYSHZSQ1dJSFNDcHVQOEVoR3VuV2tJNFRYUG4zMVFHLXlRX1RNZlJTdmJFaTMwaEx4U3FXaWlzWmdJZUR2Ug?oc=5","body":["미국 뉴스 채널 KRDO13의 조사보도에 따르면, 콜로라도주의 한 수의사가 주 수의사회에 면허 포기를 제출했습니다. 해당 수의사는 약물 및 음주 관련 위반 혐의가 제기되었으며, 주 당국이 이 사건을 수사 중에 있었습니다. 면허 포기는 행정 처분 절차의 일환으로, 향후 해당 수의사가 동 주에서 진료 활동을 하는데 큰 제약이 따를 것으로 보입니다.","조사 결과, 해당 수의사는 진료 중 마약류 또는 향정신성 약물을 오용한 것으로 의심받고 있습니다. 또한 음주 상태에서 진료를 제공한 의혹도 제기되고 있습니다. 이러한 위반은 동물 환자뿐만 아니라 해당 동물들을 동반한 보호자들에게도 심각한 위험을 초래할 수 있습니다. 주 당국은 유사한 사건의 재발 방지를 위해 면허 심사 기준을 강화할 계획을 밝혔습니다.","한국 동물병원에서도 약물 관리와 전문가 윤리 유지의 중요성이 부각되는 사안입니다. 마약류 및 향정신성 약물의 철저한 관리, 진료 전 음주 상태 확인, 그리고 직원들의 정신건강 관리 체계가 필요합니다. 한국수의사회와 동물병원 단체들은 이러한 문제를 예방하기 위한 가이드라인을 점검하고 강화할 필요가 있습니다."],"blog":"한국 동물병원 블로그에서는 '수의사의 정신건강과 전문성 유지'라는 주제로 직원 건강 관리 및 윤리 교육의 중요성을 다룬 글을 작성하면 좋습니다","blogAngle":["콜로라도주 수의사가 약물 및 음주 위반 혐의로 면허를 포기했습니다","마약류 오용과 음주 상태 진료 의혹이 제기되어 주 당국이 수사했습니다","동물 환자뿐만 아니라 보호자들에게도 심각한 위험이 초래될 수 있습니다","한국 동물병원에서도 약물 관리 체계와 전문가 윤리 강화를 점검해야 합니다"],"radar":{"owner":null,"clinical":"자율적으로 병원 내 약물 관리 현황을 점검하고, 직원 건강 상태 확인 및 음주 상태에서의 진료 금지 내부 규정 강화","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-22_18","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 역사세포육종, 독립적 클론 원인 최대 45%","dek":"개의 진행성 역사세포육종에서 PTPN11 유전자 이종 돌연변이가 흔하게 관찰되며, 이는 종양이 전이가 아닌 독립적으로 발생할 수 있음을 시사합니다.","source":"PloS one","country":"","date":"07.22","read":"2분 읽기","plate":"PloS one","image":null,"sourceUrl":"https://doi.org/10.1371/journal.pone.0345429","body":["개 역사세포육종은 인간에서 희귀하고 공격적인 종양으로, 비교 의학 모델로서 중요합니다. 본 연구는 PTPN11 유전자의 두 가지 주요 돌연변이(E76와 G503)가 개의 역사세포육종에서 가장 흔한 돌연변이 유형이며, 특히 전이성으로 알려진 진행성 형태(DHS)와 강하게 연관되어 있습니다. 38마리의 DHS 발현 개에서 복부와 흉부 장기의 종양 쌍을 대상으로 고감도 디지털 PCR로 돌연변이를 분석하였습니다.","28마리에서 PTPN11 돌연변이가 발견된 종양 쌍 중 3마리(11%)에서 상이한 PTPN11 돌연변이가 직접 확인되었습니다. 분석의 검출 한계를 보정 후, 이 코호트에서 최대 24~45%의 DHS 사례가 독립적인 클론에서 유래한 돌연변이를 보유할 것으로 추정되었습니다. 또한 동일한 환자로부터 유래한 두 세포주에서 체세포 돌연변이와 복제수 변이를 NGS로 분석하여 클론의 독립적 발생을 확인하였습니다.","이 연구 결과는 상당수의 DHS 사례가 동시에 또는 단기간 내에 유전적으로 상이한 병변으로 발생할 수 있음을 보여주며, DHS가 주로 전이성이라는 기존의 가정에 도전합니다. 이는 예후 판단과 치료 전략에 중요한 영향을 미칩니다. 그러나 표본 수가 제한적이고 단일 기관 연구이므로, 더 큰 코호트에서의 확인이 필요합니다. 한국의 동물병원에서는 이러한 발견을 바탕으로 종양 샘플 다수 확보 시 유전자 검사 확대를 고려할 수 있습니다."],"blog":"애견 보호자들에게는 치료 전 여러 병변의 유전자 검사가 예후 예측에 도움이 될 수 있음을 안내할 수 있습니다.","blogAngle":["38마리의 진행성 역사세포육종 개에서 복부-흉부 종양 쌍 28쌍을 분석하였습니다","28쌍 중 3쌍(11%)에서 상이한 PTPN11 돌연변이가 직접 검출되었습니다","보정 후 추정치에 따르면 24~45%에서 독립적 클론 발생 가능성이 있습니다","동일 환자로부터 유래한 두 세포주의 NGS 분석으로 독립적 클론이 확인되었습니다"],"radar":{"owner":null,"clinical":"종양 샘플 다수 확보 시 PTPN11 유전자 검사 확대를 고려하고, 독립적 클론 발생 가능성을 치료 계획 수립에 참고","evidence":{"design":"단일 기관 후향적 코호트","n":"개 38마리 (종양 쌍 분석)","stars":2,"note":"단일 기관 연구로 표본 수가 제한적이고, 보정된 추정치(24~45%)는 분석의 검출 한계를 기반으로 한 수치임"}},"tag":"","tier":"deep"},{"id":"2026-07-22_19","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"강아지 유방종양 진단 생물표지자로서의 혈청 TP53 자가항체","dek":"재구성 TP53 단백질을 활용한 ELISA 분석 결과, 강아지 유방종양의 60%에서 TP53 자가항체가 검출되고 건강한 대조군에서는 0%로 나타나 진단 정확도가 매우 높은 것으로 나타났습니다.","source":"Molecular biology reports","country":"","date":"07.22","read":"2분 읽기","plate":"Molecular biology reports","image":null,"sourceUrl":"https://doi.org/10.1007/s11033-026-12368-8","body":["강아지 유방종양(CMT)은 인간 유방암과 병리학적 특징과 TP53 경로 변화가 유사하여 비교 종양학 연구 모델로 활용됩니다. 본 연구는 재구성 canine TP53 단백질을 발현하여 간접 ELISA와 dot blot으로 141개 강아지 혈청을 분석하였으며, 인간 유방암 50례와 건강한 대조군 50례, 그리고 NMU유도 쥐 유방종양 모델을 함께 비교 분석하였습니다.","강아지 유방종양 환자에서 TP53 자가항체가 60.0% 검출되고 건강한 개에서는 검출되지 않아 통계적으로 유의미한 차이(p\u003c0.0001)를 보였습니다. 진단 정확도는 AUC 0.9587, 민감도 60%, 특이도 100%로 나타났습니다. 인간 유방암에서도 유사한 경향(AUC 0.8956, 민감도 52%, 특이도 98%)이 관찰되었으며, 쥐 모델에서는 종양이 형성되기 전에도 자가항체가 나타나는 것이 확인되었습니다.","한국 동물병원 임상에서 비침습적 혈액 검사로 유방종양의 초기 진단 및 선별에 활용될 수 있는 가능성을 보여줍니다. 다만 본 연구는 단일 기관에서 수행되었으며, 종양 병기별 세분화된 분석이 부족하여 한계가 있음을 고려해야 합니다. 보호자들에게 강아지 유방종양 조기 발견을 위한 새로운 비침습적 진단 도구로서의 가능성을 안내할 수 있습니다."],"blog":"강아지 유방종양은 인간 유방암과 매우 유사한 특성을 가지며, 혈액 검사만으로 조기에 발견할 수 있는 새로운 가능성이 열렸습니다","blogAngle":["강아지 유방종양의 60%에서 혈청 TP53 자가항체가 검출되고 건강한 대조군에서는 0%로 특이도가 100%입니다","진단 정확도 AUC가 0.9587으로 나타나 고감도·고특이도 진단 도구로 활용 가능성이 있습니다","NMU유도 쥐 모델에서 종양 형성 전에도 TP53 자가항체가 검출되어 조기 진단 표지자로서의 잠재력을 보입니다","인간 유방암(민감도 52%, 특이도 98%)에서도 유사한 결과가 재현되어 종양학 연구 모델로서 강아지 유방종양의 가치를 재확인합니다"],"radar":{"owner":{"soon":true,"q":"강아지 유방종양도 사람처럼 피 검사로 초기 진단할 수 있어요?","script":"이 연구는 강아지 유방종양을 피 검사로 찾는 새로운 방법을 찾았는데, 아직 임상에서 바로 쓰이기엔 더 많은 검증이 필요해요. 현재로서는 정기적인 건강검진과 몸을 만져서 확인하는 방법이 가장 중요하고, 중성화 수술을 받으면 유방종양 위험을 낮출 수 있으니 고려해 보세요."},"clinical":"본 연구는 임상 적용 전 단계로 파악하고, 기존 유방종양 검사 프로토콜(촉진·영상)을 유지하되, 향후 혈청 생물표지자 연구 동향을 지속적으로 모니터링한다.","evidence":{"design":"후향적 코호트","n":"개 141마리, 인간 50례, 쥐 모델","stars":3,"note":"단일 기관 연구여서 일반화에 주의가 필요하며, 종양 병기별 분석이 부족하다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_20","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 안와 및 폐 임파종의 제한 확산 소견 첫 보고","dek":"고양이 안와 임파종과 추정 폐 임파종에서 확산강조MRI의 제한 확산을 처음으로 보고하며, 이 영상기법이 임파종 감별에 유용할 수 있음을 확인했습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.22","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70218","body":["10세 터키 앙고라 고양이가 왼쪽 결막 부종과 안구 돌출로 내원했습니다. 초음파와 전산단층촬영에서 안와 종양과 왼쪽 폐 전엽 종양이 발견되었고, 확산강조영상(DWI)을 포함한 자기공명영상을 시행했습니다.","자기공명영상에서 안와 종양(ADC = 0.56 × 10⁻³ mm²/s)과 폐 종양(ADC = 0.53 × 10⁻³ mm²/s) 모두 제한 확산 소견을 보여 고세포 밀도가 의심되었습니다. 조직병리학으로 안와 임파종이 확인되었고, 세포학적으로 폐 임파종이 추정되었습니다.","본 연구는 고양이 임파종의 DWI 소견을 처음 보고한 것으로, 이 기법이 임파종과 다른 종양 유형을 감별하는 데 도움이 될 수 있음을 시사합니다. 하지만 단일 사례이고 후향적 분석으로, 더 많은 증례 연구가 필요합니다. 한국 동물병원에서 안와나 폐 종양을 가진 고양이에서 DWI MRI 검사를 고려할 때, 제한 확산 소견은 임파종 가능성을 높일 수 있는 단서로 활용할 수 있습니다."],"blog":"고양이 눈이 돌출되거나 폐에 종양이 발견된다면, 확산강조MRI 검사를 통해 임파종 가능성을 확인할 수 있다는 점을 보호자에게 설명하는 데 활용할 수 있습니다.","blogAngle":["10세 고양이에서 안와 종양과 폐 종양이 동시에 발견되었고, 두 종양 모두 DWI에서 제한 확산 소견을 보였습니다.","안와 종양의 ADC 값은 0.56 × 10⁻³ mm²/s, 폐 종양은 0.53 × 10⁻³ mm²/s로 고세포 밀도를 시사하는 저ADC 값을 나타냈습니다.","조직병리학으로 안와 임파종이 확인되었고, 폐 임파종은 세포학적으로 추정되었습니다.","이 보고는 고양이 안와 및 폐 임파종의 DWI 제한 확산을 처음 기술한 것으로, 임파종 감별에 DWI의 잠재적 유용성을 보여줍니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이 안구 돌출이 다른 종양이 아니라 임파종인지 MRI로 알 수 있나요?","script":"확산강조MRI에서 제한 확산 소견이 보이면 세포가 빽빽한 종양, 즉 임파종 가능성을 생각해볼 수 있습니다. 다만 단일 증례 보고라서 모든 경우에 적용하려면 더 많은 연구가 필요하고, 최종 진단은 조직검사로 확인해야 합니다."},"clinical":"고양이 안와 종양 또는 폐 종양이 의심될 때 DWI를 포함한 MRI 검사를 고려하고, 제한 확산 소견을 임파종 감별 단서로 참고하되 조직병리 확인을 거쳐야 한다.","evidence":{"design":"증례보고","n":"고양이 1마리","stars":1,"note":"단일 증례이고 후향적 분석이라서 결과의 일반화에 주의가 필요하며, 더 많은 증례 연구가 필요하다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_21","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 전십자 인대 파열 동반 무릎뼈 탈구의 신규 절골술 치료","dek":"전십자 인대 파열과 중증 무릎뼈 탈구를 동시에 가진 고양이에서 변형 경골고지 평형 절골술(mTPLO)을 시행하여 단일 수술로 두 가지 문제를 동시에 교정하는 데 성공했습니다. 이는 고양이에서 mTPLO를 보고한 세계 최초의 사례입니다.","source":"Veterinary medicine and science","country":"","date":"07.22","read":"2분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71085","body":["12세 수컷 러시아 블루 고양이가 만성 오른뒷다리 절름걸음증을 보여 검사 결과 전십자 인대 파열과 3등급 무릎뼈 탈구가 동시에 확인되었습니다. 경골고지 각도(TPA)는 35도였으며, 경골결절의 안쪽 변위가 관찰되었습니다. 외측 관절절개를 통해 관절을 탐색하고, 연골패임 Recession과 내측 이행 및 외측 강화술을 병행하여 무릎뼈 탈구를 교정하면서 동시에 변형 경골고지 평형 절골술을 실시했습니다.","수술 후 경골고지 각도는 5도로 감소하였으며, 2mm 오프셋 플레이트로 고정을 완료했습니다.imaging 확인 결과 경골결절의 외측 전위가 확인되었고, 골 접촉 비율은 0.83이었습니다. 수술 후 4개월에 방사선 검사상 골유합이 확인되었으며, 보행 패턴과 정형외과 검사에서 무릎뼈 안정성과 전방 경골 추진력의 소실이 확인되어 수술 전 악화 상태와 유사한 수준으로 호전되었습니다.","이 사례는 고양이에서 mTPLO를 적용한 최초 보고로서, 고양이의 수술 후 운동 제한이 어려운 점을 고려할 때 단일 절골 설계와 골 접촉 유지가 우수한 안정성을 제공할 수 있음을 시사합니다. 내측 근위 경골각의 유의한 변화가 없어 2mm 오프셋의 안전성이 뒷받침되었습니다. 그러나 단일 사례 보고이므로 추가 연구가 필요합니다.","고양이 전십자 인대 파열과 무릎뼈 탈구가 동반된 경우, 경험이 있는 수의사가 단일 수술로 두 문제를 동시에 해결할 수 있으며, 적절한 내과적 관리와 재활을 통해 기능을 회복할 수 있다는 가능성을 보여줍니다."],"blog":"고양이에서도 개와 마찬가지로 전십자 인대 파열과 무릎뼈 탈구를 동반한 경우 절골술로 치료할 수 있으며, 특히 고양이의 수술 후 관리 어려움을 고려할 때 안정적인 고정이 가능한 이 방법이 유용할 수 있습니다.","blogAngle":["12세 고양이에서 전십자 인대 파열과 3등급 무릎뼈 탈구를 변형 경골고지 평형 절골술로 동시에 교정했습니다.","경골고지 각도가 수술 전 35도에서 수술 후 5도로 감소하였으며, 2mm 오프셋 플레이트를 사용한 단일 절골로 치료했습니다.","골 접촉 비율 0.83으로 유지되며, 수술 후 4개월에 방사선 검사상 완전한 골유합이 확인되었습니다.","보행 및 무릎뼈 안정성이 수술 전 악화 상태 이전 수준으로 호전되어 우수한 기능적 결과를 달성했습니다."],"radar":{"owner":{"soon":true,"q":"고양이가 뒷다리를 절름거리면 전십자 인대 파열일 수도 있나요?","script":"전십자 인대 파열은 고양이에서도 볼 수 있는 질환입니다. 다리 절름거림이 계속되면 무릎 관절을 정형외과적으로 검사하고 필요하면 방사선이나 초음파를 찍어봐야 합니다. 무릎뼈 탈구가 함께 있을 수 있어서 수술이 필요할 수도 있습니다."},"clinical":"고양이에서 뒷다리 절름걸음이 보이면 전십자 인대 파열과 무릎뼈 탈구를 동시에 의심하고 정형외과 검진 시 반드시 무릎뼈 안정성도 함께 평가한다.","evidence":{"design":"증례보고","n":"고양이 1마리","stars":1,"note":"단일 사례 보고이므로 이 수술 기법의 유효성이나 안전성을 일반화하기 어렵고, 추가적인 연구가 필요하다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_22","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"커큐민, 고양이 만성콩팥병에서 신장 보호 효과 확인","dek":"IRIS 3기 만성콩팥병 고양이 16마리를 대상으로 커큐민 보충제의 효과를 검증한 연구입니다. 커큐민이 신장 기능 지표와 산화 스트레스, 염증, 세포사멸 표지자를 호전시키는 것을 확인했습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.22","read":"2분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag138","body":["만성콩팥병은 고양이에서 산화 스트레스, 염증, 세포사멸이 특징적으로 나타나는 질환입니다. 본 연구는 IRIS 3기 만성콩팥병 고양이에서 경구 커큐민 보충이 신장, 산화, 염증, 세포사멸 표지자에 어떠한 영향을 미치는지 검증하고자 했습니다. 전향적 무작위 시험으로 medical treatment 단독군(MT, 8마리)과 medical treatment에 커큐민 추가군(MT+C, 8마리)을 설정했습니다. 커큐민은 80mg/고양이/일을 2회 분복으로 60일간 경구 투여했습니다.","주요 결과로 혈청 SDMA 농도는 MT+C군에서 MT군 대비 day 30, 45, 60에 유의하게 낮았습니다(P\u003c0.01). 요단백/크레아티닌 비는 MT+C군에서 시간에 따라 감소했으며 후기 시점에서 MT군보다 낮았습니다. 총항산화 상태는 증가하고 총산화 상태는 감소했으며, day 45에 총산화 상태에서 군 간 유의한 차이가 관찰되었습니다. nuclear factor kappa B와 caspase-3 결과도 커큐민 처리군에서 염증과 세포사멸 활동 감소와 일치했습니다.","한국 동물병원 임상 관점에서 이 연구는 IRIS 3기 만성콩팥병 고양이의 보존적 치료제로 커큐민 가능성을 제시합니다. 다만, 표본수가 16마리로 소규모이며 단일 기관 연구이므로 결과의 일반화에 한계가 있습니다. 향후 더 큰 규모의 전향적 연구가 필요합니다."],"blog":"고양이 만성콩팥병 관리에 영양 보충제를 활용하는 방법과 최신 연구 결과를 보호자에게 설명하는.blog 글 소재로 사용할 수 있습니다","blogAngle":["IRIS 3기 만성콩팥병 고양이 16마리를 대상으로 60일간 커큐민 80mg/고양이/일 투여군과 대조군을 비교했습니다","혈청 SDMA는 day 30, 45, 60에서 커큐민 추가군이 대조군 대비 유의하게 낮았습니다(P\u003c0.01)","요단백/크레아티닌 비가 커큐민 추가군에서 감소하고 총항산화 상태가 증가했습니다","염증 표지자(nuclear factor kappa B)와 세포사멸 표지자(caspase-3)가 커큐민 추가군에서 감소했습니다"],"radar":{"owner":{"soon":true,"q":"커큐민 보충제가 우리 고양이 신장병에 도움이 될까요?","script":"연구에서 커큐민이 산화 스트레스와 염증을 줄이는 효과가 확인되었지만, 아직 대규모 연구가 없어서 보충제를 시작하기 전에 반드시 수의사와 상의해야 합니다. 현재 복용 중인 약이 있다면 상호작용 가능성도 확인해 주세요."},"clinical":"고양이 만성콩팥병 보호자에게 보충제 사용을 권장하기 전에 현재 처방약과의 상호작용을 점검하고, 근거가 부족한 점도 안내할 것","evidence":{"design":"전향적 무작위 시험","n":"고양이 16마리","stars":3,"note":"16마리 소규모 단일기관 연구로 결과의 일반화에 주의가 필요하며, 더 큰 규모의 전향적 연구가 필요하다"}},"tag":"","tier":"deep"},{"id":"2026-07-22_23","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개·소 레프토스피라증 진단용 재조합 단백질 기반 검사법 개발","dek":"개 300마리와 소 98마리의 혈청을 대상으로 재조합 Loa22 단백질을 이용한 라텍스 응집 검사(LAT)와 간접 ELISA(iELISA)를 개발하고 기존 미세응집 검사(MAT)와 비교했습니다.","source":"Archives of microbiology","country":"","date":"07.22","read":"2분 읽기","plate":"Archives of microbiology","image":null,"sourceUrl":"https://doi.org/10.1007/s00203-026-05072-5","body":["레프토스피라증은 개와 소에서 중요한 인수공통질병으로, 본 연구는 재조합 Loa22(rLoa22) 단백질을 기반으로 한 혈청학적 검사법을 개발하고 그 진단 정확도를 평가하는 것을 목적으로 했습니다. microscopic agglutination test(MAT)를 기준으로 양성과 음성 혈청을 분류한 후, LAT는 라텍스 비드에 rLoa22를 코팅하여 표준화했으며 iELISA는 ROC 분석을 통해 최적 cutoff값을 확정했습니다.","iELISA는 개에서 AUC 0.988, 소에서 AUC 1.00을 나타내었으며 민감도 100%, 특이도 96.81% 이상을 달성했습니다. MAT와의 일치도는 개에서 κ=0.91, 소에서 κ=0.97으로 매우 높았습니다. rLoa22 기반 LAT는 민감도 100%, 개에서 특이도 89.36%, 소에서 특이도 91.67%를 보였으며 MAT와의 일치도는 양쪽 종에서 κ=0.79였습니다. Brucella나 장내세균감염과의 교차반응은 검출되지 않았으나, 고농도 항체에서 prozone 효과가 관찰되었습니다.","본 검사법은 레프토스피라증이 풍토병인 지역이나 검사 자원이 제한된 곳에서 스크리너로 유용할 것으로 기대됩니다. 다만 MAT-양성 샘플 수가 상대적으로 적어 민감도가 과도하게 평가되었을 가능성이 있으므로, 더 많은 MAT-양성 샘플을 통한 검증이 필요합니다. 또한 prozone 효과에 따른 위음성 가능성을 임상에서 고려해야 합니다."],"blog":"강아지나 소가 갑자기 발열, 구토, 오한 등의 증상을 보이며 최근 물과 접촉한 적이 있다면 레프토스피라증 가능성을 의심해 보라는 내용의 블로그 기사를 작성하면 좋습니다.","blogAngle":["iELISA는 개(AUC 0.988)와 소(AUC 1.00)에서 모두 우수한 진단 성능을 보여 민감도 100%, 특이도 96.81% 이상을 달성했습니다","LAT는 민감도 100%, 개에서 특이도 89.36%, 소에서 특이도 91.67%를 보였으며 MAT와 각각 κ=0.79의 상당한 일치도를 나타냈습니다","Brucella나 장내세균감염 혈청과의 교차반응은 없었으나, 고농도 항체에서 prozone 효과가 관찰되어 주의가 필요합니다","연구에 사용된 MAT-양성 샘플 수가 제한적이어서 민감도 결과의 일반화에 한계가 있을 수 있습니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 레프토스피라 예방접종했는데, 이제 검사해서 예방 효과가 제대로 되었는지 확인도 가능한가요?","script":"현재 연구에서 개발된 새로운 검사법이 예방접종 효과를 확인하는 데 유용할 수 있습니다. 다만 아직 일반 병원에서 널리 사용되기까지는 시간이 걸릴 수 있고, 예방접종은 여전히 가장 중요한 예방 수단입니다. 정확한 평가는 수의사와 상담해 보세요."},"clinical":"레프토스피라증 의심 증상이 있는 동물에서 새로운 ELISA 검사법의 활용 가능성을 점검하되, 효과로 인한 위음성 가능성을 고려하여 결과 해석에 주의한다.","evidence":{"design":"진단 정확도 연구(전향적 코호트)","n":"개 300마리, 소 98마리","stars":3,"note":"MAT-양성 샘플 수가 상대적으로 적어 민감도가 과대평가되었을 수 있으며, 단일 기관 연구로 일반화에 한계가 있다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_24","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 뇌과립세포종 최초 SRT 치료 사례 – 종양 용적 56.8% 감소","dek":"개의 뇌 실질에 발생한 과립세포종을 집중 방사선 치료(SRT)로 치료한 사례를 보고하며, 이는 세포학적·조직학적으로 확인된 최초의 사례입니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.22","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70228","body":["12세 수컷 Shih Tzu가 좌측 대뇌에 발생한 것으로 의심되는 뇌과립세포종으로 내원하였습니다. 집중 방사선 치료는 3일 연속 8Gy 용량으로 시행하였으며, 이후 정기적인 자기공명영상(MRI) 추적 검사를 실시하였습니다.","치료 후 임상 증상은 완전히 소실되었으며, 치료 후 9개월째 MRI에서 최대 56.8%의 종양 용적 감소를 확인하였습니다. 그러나 추적 MRI에서 진행성 뇌 미세출혈이 관찰되었고, 치료 후 18개월에 신경학적 악화가 발생하여 안락사하였습니다. 부검, 세포학적, 조직학적 분석으로 과립세포종이 확인되었습니다.","본 사례는 개의 뇌과립세포종에서 SRT가 종양 축소 효과를 보였으나, 장기 추적에서 미세출혈과 신경학적 악화가 발생할 수 있음을 보여줍니다. 단일 사례 보고이므로 한국 동물병원에서 보편적인 치료 가이드라인으로 적용하기에는 한계가 있으며, 추가적인 연구가 필요합니다."],"blog":"뇌종양 진단을 받은 강아지의 보호자에게 집중 방사선 치료 옵션과 장기 추적 관찰의 중요성을 설명하는Blog 글감으로 활용할 수 있습니다.","blogAngle":["12세 수컷 Shih Tzu의 좌측 대뇌 과립세포종을 3일 연속 집중 방사선 치료(8Gy)로 치료하였습니다.","치료 후 9개월째 MRI에서 최대 56.8%의 종양 용적 감소를 확인하였습니다.","추적 MRI에서 진행성 뇌 미세출혈이 관찰되었으며, 18개월 후 신경학적 악화로 안락사하였습니다.","부검, 세포학적, 조직학적으로 과립세포종이 확인되었으며, 이는 세포학적으로 확인된 최초의 사례입니다."],"radar":{"owner":null,"clinical":"단일 증례보고이므로 다른 뇌종양 환자에게 동일 치료를 바로 적용하기보다는, 유사 환자가 있을 때 이 사례를 참고로 논의하는 수준이 적절합니다.","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례이며 장기 추적에서 미세출혈·신경학적 악화도 발생했으므로 치료 효과와 안전성을 일반화하기 어렵습니다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_25","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"수중 트레드밀, 개 추간판 수술 후 보행 회복 단축","dek":"수중 트레드밀 요법이 추간판 질환 수술을 받은 개의 신경학적 기능 회복을 표준 재활보다 빠르게 하는지 확인했습니다. 6주간의 치료에서 유의미한 회복 속도 차이를 보였습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.22","read":"2분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag134","body":["이 연구는 추간판 질환으로 수술적 감압술(반혀리절제술 또는 복부 슬롯 수술)을 받은 개를 대상으로 후향적 짝짓기 코호트 연구로 수행되었습니다. 수중 트레드밀 그룹 17마리와 대조군 17마리가 품종, 수술 유형, 체중(10% 이내 차이)으로 1:1 짝짓기 되었고, 주 2회 6주간 수중 트레드밀 요법을 받은 군과 주인이 guided 운동을 한 대조군을 비교했습니다. Olby Open Field Score(OFS)를 수술 전과 주 6주 동안 매주 평가하여 기준선 대비 변화량(ΔOFS)을 측정했고, 독립 보행 회복 시간(OFS ≥12)을 주요 평가 변수로 삼았습니다.","수중 트레드밀 그룹은 대조군에 비해 2주차부터 지속적으로 더 큰 ΔOFS를 보였습니다(2주차: +4 vs +2, 3주차: +6 vs +3). 독립 보행 회복 소요 시간은 수중 트레드밀 그룹이 7~35일(중앙값)으로 대조군 14~42일에 비해 유의하게 짧았고(Mann-Whitney U, P=0.0069), 감염이나 상처 합병증을 포함한 수중 트레드밀 관련 이상 반응은 관찰되지 않았습니다.","이 연구는 단일 기관 후향적 설계로 표본 크기가 작아(z17마리/그룹) 근거 수준에 한계가 있습니다. 그럼에도 수중 트레드밀 요법이 추간판 수술 후 신경학적 회복을 빠르게 하는 객관적 근거를 제공하며, 한국 동물병원에서 수술 후 재활 관리에 수중 트레드밀을 활용하는 것이 회복 결과를 개선할 수 있는 옵션이 될 수 있습니다. 보호자에게 수술 후 조기 재활의 중요성을 설명하고 수중 트레드밀 치료를 권고하는 데 임상적으로 유용한 정보입니다."],"blog":"추간판 질환으로 수술 받은 강아지의 보호자에게 수중 트레드밀 재활이 빠르고 안전한 보행 회복을 도운다는 최신 연구 결과를 소개하며, 수술 후 재활의 중요성을 권유하는 글을 작성해 보세요.","blogAngle":["수중 트레드밀 그룹은 대조군에 비해 2주차부터 ΔOFS가 지속적으로 높았으며(2주차 +4 vs +2, 3주차 +6 vs +3) 신경학적 회복 속도가 더 빠릅니다.","독립 보행 회복 중앙 소요 시간은 수중 트레드밀 그룹이 7~35일으로 대조군(14~42일)보다 약 1주 단축되었습니다(P=0.0069).","연구 기간 동안 수중 트레드밀 관련 감염, 상처 합병증 등의 이상 반응은 발생하지 않아 치료 안전성이 확인되었습니다.","후향적 짝짓기 코호트 연구로 표본 크기가 작다(각 그룹 17마리)하여 결과 해석에 한계가 있음을 고려해야 합니다."],"radar":{"owner":{"soon":true,"q":"강아지 추간판 수술 후에 수중 트레드밀 같은 물리치료를 받으면 회복이 빨라지나요?","script":"연구에 따르면 수중 트레드밀이 신경학적 회복을 빠르게 할 수 있다는 근거가 있습니다. 다만 강아지마다 상황이 다르므로 수술 후 재활 계획을 함께 상담해 보겠습니다."},"clinical":"추간판 수술 후 환자 대해 수중 트레드밀 재활 프로토콜 도입 검토","evidence":{"design":"후향적 짝짓기 코호트","n":"개 34마리(17마리/그룹)","stars":2,"note":"단일 기관 후향적으로 표본 크기가 작아 일반화에 주의해야 함"}},"tag":"","tier":"deep"},{"id":"2026-07-22_26","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"구강 감염에서 유래한 강아지의 경막하 농양 1예","dek":"6개월령 수 Bernese Mountain Dog에서 구강 상악 어금니 치아 농양이 두개내 경막하 농양으로 진행된 드문 사례를 MRI 소견으로 확인했습니다. 구강 질환이 중추신경계까지 침범할 수 있음을 보여주는 중요한 보고입니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.22","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70210","body":["본 연구는 Auburn University 소동물병원에 진행성 신경학 증상으로 내원한 6개월령 암수 Bernese Mountain Dog 1마리를 대상으로 하였습니다. MRI 검사에서 좌측 대뇌 반구를 차지하는 경막하 종괴가 관찰되었으며, T2 고신호, T1 저신호를 보이고 중선 우측 전위, 좌측 뇌실 압박, 천막하 및 tentorial 탈장이 동반되었습니다.","주요 영상 소견으로 마지막 좌측 상악 어금니에서 시신경초까지 뻗어가는 T2 고신호/T1 저신호의 tract가 조영 증강되었으며, 이는 치아 근관 농양 또는 구강 관통상과 연관된 농양, 두개내 농양, 두개내압 증가에 합치하는 소견이었습니다.","본 증례는 단일 사례 보고로 일반화에 한계가 있으나, 강아지에서 구강 감염이 두개내 농양으로 진행될 수 있음을 시사합니다. 특히 어린 강아지에서 신경학 증상이 나타나면 구강 감염의 합병증을 감별해야 하며, MRI에서 비정상 tract 확인이 중요한 단서가 됩니다. 임상가들은 구강 질환의 중증도를 과소평가하지 않도록 주의해야 합니다."],"blog":"강아지의 구강 질환이 두개내 농양으로 진행될 수 있다는점은 보호자들이 사료 섭취나 구강 위생을 소홀히 하지 말아야 함을 상기시키는 블로그 소재가 됩니다.","blogAngle":["6개월령 강아지에서 좌측 대뇌 반구를 차지하는 경막하 종괴가 확인되었습니다.","MRI에서 마지막 상악 어금니에서 시신경초까지 연결되는 조영 증강된 경로가 관찰되어 구강 원인이 명확히졌습니다.","중선 전위, 뇌실 압박, 탈장 소견으로 두개내압 상승이 동반되었습니다.","본 증례는 구강 질환이 중추신경계 합병증을 유발할 수 있음을 보여주는 단일 증례 보고입니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 치아 문제가 신경계 증상을 일으킬 수 있나요?","script":"구강 감염이 두개내 농양까지 진행될 수는 있지만 매우 드문 경우입니다. 강아지에서 신경학 증상이 나타나면 구강 검진도 함께 하는 것이 좋습니다. 구체적인 진단은 MRI 등 영상 검사로 확인해야 합니다."},"clinical":"신경학 증상을 보이는 개에서 치과 검진 및 MRI에서 구강에서 두개내로 연결되는 비정상 통로 유무를 점검하는 프로토콜을 검토하세요.","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례 보고로 일반화에 한계가 있으며, 근거 수준이 낮습니다."}},"tag":"","tier":"deep"},{"id":"2026-07-22_27","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 무릎수술에서 FLAGS 차단, 운동마비 감소 확인","dek":"개 전십자인대 질환 환자 28마리를 대상으로 ultrasound-guided sciatic nerve block와 FLAGS 차단의 운동신경 마비 정도를 비교한 전향적 무작위대조 임상시험입니다. FLAGS 차단군에서 수술 후 2시간 측정된 운동기능 점수가 유의하게 낮았습니다.","source":"Veterinary anaesthesia and analgesia","country":"","date":"07.22","read":"2분 읽기","plate":"Veterinary anaesthesia and analgesia","image":null,"sourceUrl":"https://doi.org/10.1016/j.vaa.2026.101231","body":["본 연구는 개의 전십자인대 질환으로 무릎 수술을 받는 28마리를 대상으로 ultrasound-guided sciatic nerve block(SCIATIC군, 15마리)와 FLAGS 차단(FLAGS군, 13마리)를 비교한 전향적 무작위 공개 임상 임상시험입니다. 두 군 모두 전신마취하에 대퇴신경 차단을 먼저 시행하였으며, SCIATIC군에서는 후방 접근법으로 sciatic nerve block를, FLAGS군에서는 대퇴 과두 높이에서 lateral에서 medial 방향으로 바늘을 삽입하여 과두 사이(poplietal동맥 전방)에 약물을 주사하는 ultrasound-guided FLAGS 차단을 실시했습니다. 각 부위에 0.5% bupivacaine 0.1 ml/kg을 주사했습니다.","수술 중 심박수, 호흡수 또는 평균동맥압이 기초값(피부절개 전)에서 2분 이상 20% 이상 증가할 경우 구제진통을 제공하도록 설계하였으나, 두 군 모두 구제진통이 필요하지 않았습니다. 수술 후 2시간에 patellar, sciatic, gastrocnemius, cranial tibial, withdrawal 반사각을 평가하여 종합 motor 점수(0~10점)를 측정하였으며, 점수가 낮을수록 운동기능이 양호함을 의미합니다. 그 결과 FLAGS군은 SCIATIC군 대비 유의하게 낮은 motor 점수를 보였습니다[SCIATIC: 3(0-8), FLAGS: 0(0-5), p=0.032].","FLAGS 차단은 sciatic nerve block과 유사한 진통 효과를 제공하면서도 수술 후 운동신경 마비를 감소시킬 수 있어, 개 무릎 수술 후 빠른 기능 회복이 필요한 임상 상황에서 유용할 것으로 생각됩니다. 그러나 표본 수가 각 군 13~15마리로 상대적으로 적고 단일 기관에서 수행되었으므로, 향후 추가적인 다기관 연구가 필요합니다. 한국의 동물병원에서는 전십자인대 수술 후 개의 보행 회복 평가 시 이러한 운동기능 점수 시스템을 참고할 수 있습니다."],"blog":"반려견 전십자인대 수술 후 다리 마비 없이 더 빠르게 걸을 수 있게 하는 새로운 진통 방법으로, 보호자들이 수술 후 애완동물의 회복 과정을 이해하는 데 참고가 될 수 있습니다.","blogAngle":["전십자인대 질환 개 28마리를 SCIATIC군(15마리)과 FLAGS군(13마리)으로 무작위 배정하여 비교했습니다.","수술 후 2시간 종합 운동점수에서 FLAGS군(0점)이 SCIATIC군(3점)보다 유의하게 낮았습니다(p=0.032).","두 군 모두 수술 중 구제진통이 필요하지 않았습니다.","FLAGS 차단은 운동기능 저하를 최소화하면서도 효과적인 진통을 제공할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지 무릎 수술 후 언제까지 운동 마비가 지속되고 얼마나 빨리 걸을 수 있어요?","script":"이 연구에 따르면 FLAGS 차단이 보다 수술 후 운동신경 마비를 줄일 수 있다는 결과가 나왔습니다. 하지만 실제 회복 속도는 강아지 개체 차이가 있고, 수술 후 재활 계획은 담당 수의사와 상담해 보시는 것이 좋습니다."},"clinical":"전십자인대 수술 후 개 보행 평가 시 운동기능 점수(,,,, 반사각) 시스템을 참고하여 점검","evidence":{"design":"전향적 무작위대조 시험","n":"개 28마리(SCIATIC군 15, FLAGS군 13)","stars":3,"note":"단일 기관에서 수행되어 일반화에 주의가 필요하며 더 큰 규모의 연구가 필요합니다"}},"tag":"","tier":"deep"},{"id":"2026-07-22_28","legacySlug":null,"day":"2026-07-22","ts":1784646000000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 아토피 피부염에서 γδ T 세포의 피부 침윤과 IL-17 발현","dek":"개 아토피 피부염 환견의 피부에서 γδ T 세포가 증가하며 IL-17F를 발현하는 것을 확인하고, 이 세포가 만성 염증과 가려움에 기여할 수 있음을 보고합니다. SCART1-like RNA 프로브가 개의 γδ T 세포 표지자로 유효함을 검증했습니다.","source":"Veterinary immunology and immunopathology","country":"","date":"07.22","read":"2분 읽기","plate":"Veterinary immunology and immunopathology","image":null,"sourceUrl":"https://doi.org/10.1016/j.vetimm.2026.111124","body":["본 연구는 건강한 개 4마리와 아토피 피부염 환견 5마리(비병변 및 병변 부위)의 피부 생검물을 대상으로 RNA in situ hybridization(RNAScope)과 단백질 공검출을 수행하여 γδ T 세포의 IL-17F 및 IL-23 수용체 발현을 정량 분석했습니다. Prospective study로 설계되었으며, 형광 공초점 현미경으로 신호를 정량화했습니다.","아토피 피부염 환견은 대조군에 비해 진피 γδ T 세포가 유의하게 증가했으며(P=0.0055), IL-17F를 공발현하는 γδ T 세포가 진피에서 급격히 증가했습니다(P\u003c0.001). 표피 차이는 유의하지 않았습니다. IL-23 수용체 공발현은 질환 상태에 따라 다르지 않았으나, 표피 γδ T 세포의 IL-23 수용체 발현은 보호자가 보고한 가려움 중증도와 역상관을 보였습니다. SCART1-like RNA를 발현하는 γδ T 세포는 아토피 피부염에서 증가했으며 전체 γδ T 세포 신호와 강하게 상관했습니다.","본 연구는 아토피 피부염의 병인에 진피 IL-17 연관 γδ T 세포 축이 관여할 수 있음을 제시합니다. 표본 수가 9마리로 적고 단일 기관 연구이므로 해석에 한계가 있으며, 추가 연구가 필요합니다. 임상적으로는 γδ T 세포와 IL-17 경로가 새로운 치료 표적이 될 가능성을 시사합니다."],"blog":"강아지가 물어뜯고 긁어대는 아토피 피부염의 원인에 γδ T 세포라는 면역 세포가 깊이 관여한다는 최신 연구 결과를 보호자에게 설명하는 글로 활용할 수 있습니다.","blogAngle":["아토피 피부염 환견의 진피 γδ T 세포가 대조군 대비 유의하게 증가했습니다(P=0.0055).","진피에서 IL-17F를 공발현하는 γδ T 세포가 급격히 증가했으며 통계적 유의성이 높았습니다(P\u003c0.001).","표피 γδ T 세포의 IL-23 수용체 발현은 가려움 중증도와 역상관을 보였습니다.","SCART1-like RNA가 개의 γδ T 세포 표지자로 유효함을 검증했습니다."],"radar":{"owner":{"soon":true,"q":"아토피 피부염 있는 강아지에게 새로운 치료 표적이 있는지 알려주세요","script":"현재 연구에서 γδ T 세포와 IL-17 경로가 아토피 피부염에 관여할 수 있다는 근거가 나왔습니다만, 아직 사람에게 사용하는 약을 개에 바로 적용할 수 있는지는 추가 연구가 필요합니다. 새 치료제가 나오려면 시간이 걸리므로, 지금은 기존 치료를 잘 따라 주시는 것이 중요합니다."},"clinical":"아토피 피부염 환견의 가려움 평가 시 보호자가 보고한 증상 점수와 IL-23 수용체 발현 상관관계를 향후 진료 모니터링에 참고","evidence":{"design":"전향적 연구","n":"개 9마리(건강 4, 아토피 5)","stars":2,"note":"표본 수가 9마리로 매우 적고 단일 기관 연구라 결과의 일반화에 주의가 필요합니다"}},"tag":"","tier":"deep"}],"briefs":[],"stories":[{"id":"2026-07-22_33","legacySlug":null,"day":"2026-07-22","ts":1784592065000,"publishedAt":"2026-07-21T00:01:05.000Z","cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"MLB팀에 물린 라쿤? 시애틀 팬들 \"공식 창립자인데 이상해\"","dek":"시애틀 라쿤의 창립자가 MLB에 등장했다가 팬들한테 까입니다.","source":"MyNorthwest.com","country":"","date":"07.21","read":"1분 읽기","plate":"MyNorthwest.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMid0FVX3lxTE8wWHE1SzdyM1JrVG5qYlRIT1QyTk9tX3Q2a1VXM3A1SE8yVGNUQ1FhVWtHTFIzX29XckZfTDBkd3V6cjYxMlBzMGtLc3JmSnFzSjNnQ1ZwSmFnV1pYSDJYNTRiU3hDMFRaTXVPVVpqRkg0ZEQ0b2lr?oc=5","body":["시애틀 Mariners가 최근 인터넷에서 대박 난 라쿤 'Jimothy'를 팀 공식 캐릭터로 삼았습니다. 그런데 정작 라쿤을 키웠다는 Jake와 Spike가 \"형식적으로만 갖다놓고 정작 느낌이 다르다\"며 아쉬움을 토로했답니다.","둘은 \"진짜 라쿤을 한번도 못 만나봤는지 이 정도 표현은 아니잖아\"라는 식으로 비판했어요. 라쿤 팬들 사이에서도 MLB가 이 트렌드를 제대로 활용 못 한다는 목소리가 나왔습니다. 진료실 밖에서 보면 유행에 편승하려는 시도도 만만치 않죠.","하지만 마냥 까만 것만은 아닌 게, 라쿤의 인기를 팀 마케팅에 딱 맞게 가져오려고 했다는 점에서 의도는 괜찮았다는 의견도 있어요. 바이럴을 제대로 즐기려면 당사자들한테도 제대로 물어봐야죠, 라는 경고도 되네요."],"blog":"","blogAngle":[],"radar":null,"tag":"웃김","tier":"deep"}],"isHome":false}</script>

  function loadSearch(){
    if(SEARCH_INDEX||searchLoading) return;
    searchLoading=true; render();
    // 검색 색인은 날짜별 청크로 나눠 둔다. 매일 새 글이 추가되어도 과거 청크의
    // CDN 캐시를 무효화하지 않고, 장애·구버전 배포에서는 기존 search.json으로 폴백한다.
    fetch('/search-manifest.json').then(function(r){if(!r.ok)throw new Error('manifest');return r.json();}).then(function(manifest){
      var chunks=Array.isArray(manifest.chunks)?manifest.chunks:[];
      if(!chunks.length) throw new Error('empty manifest');
      return Promise.all(chunks.map(function(chunk){return fetch(chunk.href).then(function(r){if(!r.ok)throw new Error('chunk');return r.json();});}))
        .then(function(parts){ return parts.reduce(function(all,part){ return all.concat(Array.isArray(part.items)?part.items:[]); },[]); });
    }).catch(function(){
      return fetch('/search.json').then(function(r){if(!r.ok)throw new Error('search');return r.json();}).then(function(data){return Array.isArray(data.items)?data.items:[];});
    }).then(function(items){
      SEARCH_INDEX=items;
      SEARCH_INDEX.forEach(function(a){ byId[a.id]=a; });
      searchLoading=false; render();
    }).catch(function(){ searchLoading=false; toast('전체 검색 색인을 불러오지 못했습니다'); });
  }

  // 검색 중에는 전체 색인(과거 브리핑 포함)을 대상으로 한다.
  function sorted(){
    var base=S.query.trim()&&SEARCH_INDEX?SEARCH_INDEX:(S.query.trim()?DATA.articles.concat(DATA.briefs||[],DATA.recent||[],DATA.stories||[]):DATA.articles);
    var arr=base.slice(); if(S.sort==='latest'){ arr.sort(function(x,y){return y.ts-x.ts;}); } return arr;
  }
  function match(a,q){ return (a.title+' '+a.dek+' '+a.source+' '+a.kicker+' '+(a.body||[]).join(' ')).toLowerCase().indexOf(q)>=0; }
  function activeList(){
    var arr=sorted();
    if(S.cat!=='all') arr=arr.filter(function(a){return a.cat===S.cat;});
    if(S.unreadOnly) arr=arr.filter(function(a){return !isRead(a.id);});
    var q=S.query.trim().toLowerCase();
    if(q) arr=arr.filter(function(a){return match(a,q);});
    return arr;
  }
  // 현재 문맥의 순서 있는 목록(연속 읽기용)
  function contextList(){

    if(S.view==='ideas') return Object.keys(S.ideas).map(function(k){return S.ideas[k];});
    if(S.query.trim()) return activeList();                     // 검색 중엔 검색 결과로 연속 읽기
    var cur=byId[S.openId];
    if(cur&&cur.tier==='brief') return (DATA.briefs||[]);       // 브리프도 다음/이전으로 읽기
    if(cur&&cur.cat==='watercooler') return (DATA.stories||[]); // 진료실 밖 이야기끼리 연속 읽기

    +'<div class="vm-fp-body" style="column-count:2;column-gap:30px;column-rule:1px solid var(--color-line-normal);font-size:14.5px;line-height:1.75;color:var(--color-label-neutral);">'+body+'</div>'

    +'</article>';
  }
  // 브리프: 제목만 촘촘히 쌓는 왼쪽 단. 밀도로 신문 느낌을 만든다.
  function briefRow(a,i){
    return '<div class="vm-brief-r'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--color-line-normal);cursor:pointer;">'
    +'<span style="flex:none;font-family:var(--font-display);font-size:11px;font-weight:800;color:var(--color-primary-normal);padding-top:3px;">'+String(i+1).padStart(2,'0')+'</span>'
    +'<div style="min-width:0;"><div class="vm-hl" style="font-size:13.5px;font-weight:700;line-height:1.4;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</div>'

  }
  // 쿼드: 같은 무게 4장. 제목 크기를 통일해 가로 리듬을 만든다.
  function quadCard(a,i){
    return '<article class="vm-quad-c'+readCls(a.id)+'" data-open="'+a.id+'" style="cursor:pointer;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px;"><span style="font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-primary-normal);">'+e(a.kicker)+'</span>'+bookmarkBtn(a.id,14,'plain')+'</div>'
    +cardMedia(a,14)
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:18px;line-height:1.28;font-weight:700;letter-spacing:-.015em;margin:0 0 7px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:13px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.dek)+'</p>'
    +'<div style="font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--color-label-alternative);">'+e(a.source)+'</div></article>';
  }
  // 피처: 가로로 넓게 눕힌 해설 기사. 진료 포인트를 항상 노출한다.
  function featureCard(a){
    var r=a.radar||{};
    return '<article class="vm-feat'+readCls(a.id)+'" data-open="'+a.id+'" style="cursor:pointer;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;"><div style="display:flex;align-items:center;gap:7px;"><span style="font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-primary-normal);">깊이 보기 · '+e(a.kicker)+'</span>'+tag(a.isToday,16,10)+'</div>'+bookmarkBtn(a.id,15,'plain')+'</div>'
    +cardMedia(a,20,'2.2/1')
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.025em;margin:0 0 10px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:15px;line-height:1.7;color:var(--color-label-neutral);margin:0 0 12px;max-width:64ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.dek)+'</p>'
    // 자리가 남으면 본문 첫 문단까지 펼쳐 '해설' 기사답게 만든다
    + ((a.body||[])[0]?'<p class="vm-fill" style="display:none;font-size:14.5px;line-height:1.75;color:var(--color-label-neutral);margin:0 0 12px;max-width:64ch;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.body[0])+'</p>':'')
    + (r.clinical?'<div style="margin:0 0 12px;padding-left:12px;border-left:2px solid var(--color-primary-normal);font-size:13px;line-height:1.6;color:var(--color-label-neutral);max-width:62ch;"><b style="color:var(--color-primary-normal);font-weight:700;">진료 포인트</b> '+e(r.clinical)+'</div>':'')
    +'<div style="font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--color-label-alternative);">'+metaShort(a)+'</div></article>';
  }
  function railCard(a){
    return '<article class="vm-rail'+readCls(a.id)+'" data-open="'+a.id+'" style="padding:20px 0;border-top:1px solid var(--color-line-normal);cursor:pointer;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-primary-normal);">'+e(a.kicker)+'</span>'+tag(a.isToday,16,10)+'</div>'+bookmarkBtn(a.id,15,'plain')+'</div>'
    +cardMedia(a,15)
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:21px;line-height:1.28;font-weight:700;letter-spacing:-.017em;margin:0 0 8px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:14px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.dek)+'</p>'
    +'<div style="font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-label-alternative);">'+metaShort(a)+'</div></article>';
  }
  function mostRead(list){
    return '<div style="margin-top:14px;border-top:2px solid var(--color-label-strong);padding-top:14px;"><div style="font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--color-label-strong);margin-bottom:6px;">주목 브리핑 TOP 5</div>'
    + list.map(function(a,i){ return '<div class="vm-mr'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--color-line-normal);cursor:pointer;"><span style="flex:none;font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--color-primary-normal);width:20px;line-height:1;">'+(i+1)+'</span><div><div class="vm-mrt" style="font-size:14px;font-weight:700;line-height:1.35;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</div><div style="margin-top:3px;font-size:11px;text-transform:uppercase;letter-spacing:.02em;color:var(--color-label-alternative);">'+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div></div></div>'; }).join('')+'</div>';

  function bandCard(a){
    return '<article class="vm-card'+readCls(a.id)+'" data-open="'+a.id+'" style="background:var(--color-background-normal);padding:24px 22px 26px;display:flex;flex-direction:column;cursor:pointer;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-primary-normal);">'+e(a.kicker)+'</span>'+tag(a.isToday,16,10)+'</div>'+bookmarkBtn(a.id,15,'plain')+'</div>'
    +cardMedia(a,15)
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:19px;line-height:1.32;font-weight:700;letter-spacing:-.015em;margin:0 0 10px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:13.5px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.dek)+'</p>'
    +'<div style="margin-top:auto;font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-label-alternative);">'+metaShort(a)+'</div></article>';
  }
  function rowCard(a){
    var ideaBtn = '<button data-idea="'+a.id+'" title="글감 담기" style="flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--color-line-normal);background:var(--color-background-normal);border-radius:9px;cursor:pointer;color:'+(isIdea(a.id)?'var(--color-primary-normal)':'var(--color-label-assistive)')+';">'+IDEA.replace(/W/g,16)+'</button>';
    return '<article class="vm-row'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:20px;padding:24px 0;border-bottom:1px solid var(--color-line-normal);cursor:pointer;">'
    +(a.image?'<div class="vm-row-thumb" style="flex:none;width:180px;aspect-ratio:16/10;position:relative;overflow:hidden;border-radius:10px;background:var(--color-background-alternative);">'+plateImg(a,{big:16})+'</div>':'')
    +'<div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;"><span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-primary-normal);">'+e(a.kicker)+'</span>'+tag(a.isToday,16,10)+'</div>'
    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.017em;margin:0 0 8px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:14.5px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 8px;max-width:70ch;">'+e(a.dek)+'</p>'
    +'<div style="font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-label-alternative);">'+meta(a)+'</div></div>'
    +'<div style="flex:none;display:flex;flex-direction:column;gap:8px;">'+bookmarkBtn(a.id,17,'box')+ideaBtn+'</div></article>';

  function catRow(){
    if(!DATA.cats.length) return '';
    var chips='<button class="vm-chip" data-cat="all" aria-pressed="'+(S.cat==='all')+'">전체</button>';
    chips+=DATA.cats.map(function(c){return '<button class="vm-chip" data-cat="'+c.key+'" aria-pressed="'+(S.cat===c.key)+'">'+e(c.label)+'</button>';}).join('');
    var total=DATA.articles.length, readCnt=DATA.articles.filter(function(a){return isRead(a.id);}).length;
    var pct=total?Math.round(readCnt/total*100):0;
    return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 4px;">'
    +'<div style="display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:0;">'+chips+'</div>'
    +'<button class="vm-chip" data-act="unread" aria-pressed="'+S.unreadOnly+'">안 읽은 글만</button>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;padding:8px 0 2px;font-size:11.5px;color:var(--color-label-alternative);"><div style="flex:1;height:4px;border-radius:99px;background:var(--color-material-base);overflow:hidden;"><div class="vm-progress" style="width:'+pct+'%;"></div></div><span style="font-variant-numeric:tabular-nums;">'+readCnt+' / '+total+' 읽음</span></div>';
  }

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.
  function qaColumn(arr){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var soon=arr.filter(function(a){return a.radar&&a.radar.owner&&a.radar.owner.q;}).slice(0,6);
    if(soon.length<3) return '';
    var items=soon.map(function(a){
      return '<div class="vm-qa-i'+readCls(a.id)+'" data-open="'+a.id+'" style="cursor:pointer;padding:15px 0;border-top:1px solid var(--color-line-normal);">'
      +'<div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-label-alternative);margin-bottom:6px;">'+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div>'
      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';
    }).join('');
    return '<div style="margin-top:6px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 4px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 문답</span><span style="font-size:12.5px;color:var(--color-label-alternative);">이번 주, 보호자가 묻는 것</span></div>'
    +'<div class="vm-qa-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:0 44px;">'+items+'</div></div>';
  }

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){
    var pad=(3-(list.length%3))%3, fill='';
    for(var i=0;i<pad;i++) fill+='<div class="vm-band-fill" style="background:var(--color-background-normal);"></div>';
    return '<div class="vm-band" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--color-line-normal);">'+list.map(bandCard).join('')+fill+'</div>';
  }

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var list=DATA.recent||[]; if(!list.length) return '';
    return '<div style="margin-top:32px;"><div style="border-top:2px solid var(--color-label-strong);padding:16px 0 13px;display:flex;align-items:baseline;gap:10px;"><span style="font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">최근 브리핑</span><span style="font-size:12.5px;color:var(--color-label-alternative);">지난 며칠 사이 주요 기사</span></div>'
    +bandGrid(list)+'</div>';
  }

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var list=DATA.stories||[]; if(list.length<3) return '';
    var rows=list.map(function(a,i){
      return '<div class="vm-story'+readCls(a.id)+'" data-open="'+a.id+'" style="display:flex;gap:14px;align-items:baseline;padding:14px 2px;border-top:1px solid var(--color-line-normal);cursor:pointer;">'
      +'<span style="flex:none;width:20px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--color-label-assistive);text-align:center;">'+(i+1)+'</span>'
      +'<div style="min-width:0;flex:1;">'
      +'<div class="vm-hl" style="font-size:15.5px;font-weight:700;line-height:1.45;color:var(--color-label-strong);text-wrap:pretty;">'+(a.tag?'<span style="color:var(--color-primary-normal);font-weight:800;">['+e(a.tag)+']</span> ':'')+e(a.title)+'</div>'
      +'<div style="margin-top:4px;font-size:11.5px;color:var(--color-label-alternative);">'+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div>'
      +'</div><span style="flex:none;color:var(--color-label-assistive);align-self:center;">'+ARR+'</span></div>';
    }).join('');
    return '<div style="margin-top:32px;padding:22px 24px 24px;background:var(--color-background-alternative);border-radius:16px;">'
    +'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:2px;"><span style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">반려동물 화제</span><span style="font-size:12.5px;color:var(--color-label-alternative);">출처가 확인된 해외 화제 이야기</span></div>'
    +'<div>'+rows+'</div></div>';
  }
  // 간추린 소식(브리프) — 본문이 짧은 단신은 기사 행이 아니라 카드로 보여준다.
  // 기본 12건만 노출하고, 나머지는 사용자가 요청할 때 펼친다.
  function briefsBoard(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';
    var list=DATA.briefs||[]; if(!list.length) return '';
    var visible=S.briefAll?list:list.slice(0,12);
    var rows=visible.map(function(a){
      return '<button class="vm-brief-card'+readCls(a.id)+'" data-open="'+a.id+'">'
      +'<div class="vm-brief-meta">간추린 · '+[a.source,a.country].filter(Boolean).map(e).join(' · ')+'</div>'
      +'<div class="vm-brief-title">'+e(a.title)+'</div>'

      +'<div class="vm-brief-open">자세히 보기 '+ARR+'</div></button>';

    +(list.length>visible.length?'<div style="display:flex;justify-content:center;margin-top:16px;"><button data-act="brief-more" style="border:1px solid var(--color-line-strong);background:var(--color-background-normal);color:var(--color-label-strong);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:9px;">간추린 소식 '+list.length+'건 전체 보기</button></div>':'')
    +(S.briefAll&&list.length>12?'<div style="display:flex;justify-content:center;margin-top:16px;"><button data-act="brief-less" style="border:0;background:transparent;color:var(--color-label-alternative);cursor:pointer;font-family:inherit;font-size:12px;">간추린 소식 접기</button></div>':'')

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;
        x.style.display=x.tagName==='P'?'-webkit-box':'block';
        if(slack()<0) x.style.display='none';
      });
      // ② 그래도 남으면 마지막 카드의 말줄임을 한 줄씩 푼다
      var ps=el.querySelectorAll('p[style*="line-clamp"]');
      if(!ps.length) return;
      var p=ps[ps.length-1], guard=0;
      while(guard++<20){
        if(slack()<26) break;                            // 한 줄 넣을 자리도 없다
        if(p.scrollHeight<=p.clientHeight+2) break;       // 더 보여줄 문장이 없다
        p.style.webkitLineClamp=(parseInt(getComputedStyle(p).webkitLineClamp)||3)+1;
      }
    }); });
  }
