<script id="vm-issue" type="application/json">{"date":"2026-07-20","dateLabel":"2026.07.20","dateline":"2026년 7월 20일 · 월요일","editionNo":"2,026","count":35,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-07-20_1","day":"2026-07-20","ts":1783666824000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제","dek":"강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.","source":"Veterinary Practice News","country":"미국","date":"07.10","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/palliative-care-pain.jpg","sourceUrl":"https://www.veterinarypracticenews.com/palliative-approaches-chronic-pain/","body":["관절염은 노령 동물의 만성 통증 원인 1위입니다. 강아지는 1세 이상 약 20%에서 발생하며 나이가 들수록 급격히 증가하고, 고양이는 10세 이상 60~90%에서 방사선 검사상 변성 관절 질환이 관찰되지만 여전히 진단률이 낮습니다. 고령 환자가 되면 관절염은 신장 질환, 간 기능 저하, 인지 장애, 종양과 함께 복합적으로 나타나며, 치료 목표는 완치에서 안녕으로 전환됩니다.","다중 약물 요법이 핵심입니다. NSAID(카르프로펜, 멜록시캄, 데라복시브, 그라프리프란트 등)가 기초 치료이며, 다당류 글루코사민 주사제와 오메가3 보충제를 병용합니다. 효과가 제한적일 때 가바펜틴(신경병성 통증), 아만타딘(중추 과민화), 항-NGF 단일클론항체(베디벳맙-개, 프루네벳맙-고양이)를 추가합니다. 개에서 아세트아미노펜을 NSAID와 병용하면 추가 진통 효과가 있으며, 조절이 어려운 경우 아형 케타민 정맥 주사로 중추 과민화를 완화할 수 있습니다.","비약물 치료도 중요합니다. 침구, 레이저 치료(광변조치료), 펄스 전자기장 치료 등이 증거를 축적하고 있으며, 약물과 다른 기전으로 작용해 신장·간 부담 없이 보완 효과를 냅니다. 가장 활용도가 낮은 처치는 구조화된 운동입니다. 오히려 움직임을 제한하면 근육 위축, 체중 증가로 통증이 악화되므로, 짧은 산책을 처방하듯 정기적으로 처방하고, 수중 트레드밀은 관절 부하를 줄이면서 근육 강화에 효과적입니다. 고양이는 낮은 휴식처, 먹이 퍼즐, 장난감을 통한 움직임을 권장합니다."],"blog":"한국 동물병원 블로그에서 '노령 강아지/고양이 관절염,-관리 제대로 알아보자'라는 제목으로 보호자를 위한 안내글로 활용할 수 있습니다","blogAngle":["고령 관절염 환자의 치료 목표는 완치가 아닌 통증 완화와 기능 유지입니다","NSAID 단독 치료로 부족할 때 가바펜틴, 아만타딘, 항-NGF 단일클론항체 등 보조 약물을 단계적으로 추가합니다","침구·레이저·전자기장 치료는 약물과 다른 경로로 진통 효과를 발휘해 고령 환자에서 유용합니다","운동 제한은 오히려 해롭고, 짧은 규칙적 산책과 수중 트레드밀이 근육 유지에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지 관절염 있는데, 약물 외에 통증 조절에 좋은 방법은 없나요?","script":"관절염은 노령 동물에서 완치가 어려운 흔한 질환입니다. 약물 치료뿐만 아니라 레이저나 펄스 전자기장 같은 보습 치료, 그리고 짧은 산책이나 수중 트레드밀 같은 적절한 운동도 통증 조절에 도움을 드릴 수 있습니다. 각 동물의 상태에 맞게 조합해서 조절해 보겠습니다."},"clinical":"고령 관절염 환자에게 NSAID 기본 처방 외에 비약물 치료(레이저, 펄스 전자기장, 수중 트레드밀) 옵션 상담 및 처방 고려","evidence":null},"tag":""},{"id":"2026-07-20_2","day":"2026-07-20","ts":1784174400000,"cat":"clinical","kicker":"임상","isToday":false,"title":"가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때","dek":"수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.","source":"Dr. Andy Roark","country":"미국","date":"07.16","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-408-blog-pic.jpg","sourceUrl":"https://drandyroark.com/when-the-chill-protocol-isnt-chilling/","body":["반려동물의 수의사 방문 스트레스는 흔한 문제입니다. 기존에 많이 사용하는 가바펜틴과 트라조돈만으로는 충분한 진정 효과를 얻지 못하는 경우가 있습니다. 특히 불안이 심각한 동물에서는 오히려 진정이 안 되거나 과도한 진정만 되고 불안은 그대로 남아있는 상태가 될 수 있습니다.","Dr. Chris Pachel은 클로니딘, 벤조디아제핀, 덱스메데토미딘 같은 대안적 약물들을 소개합니다. 중요한 것은 진정이 불안감을 감추고 있는지 확인하는 것입니다. 진정만 되고 불안이 해소되지 않으면 근본적인 행동 문제를 해결하지 못합니다. 집에서의 시험 투여, 안전 계획 수립, 에세프로메진과 'chill protocol' 변형 버전의 주의점도 함께 다룹니다.","한국 동물병원에서도 불안 동반 환자에게 기존 약물이 효과 없을 때 대안적 선택지가 있다는 점은 유용합니다. 그러나 모든 약물 사용은 개별 환자 상태를 고려하고, 필요하다면 수의 행동학 전문의와 상담하는 것이 좋습니다. 특히 홈 테스트 실행 시에는 소유자와의 충분한 논의가 선행되어야 합니다."],"blog":"자꾸 손을 물거나 짖는 불안한 강아지에게 기존 진정제가 안 먹힐 때, 대안적 약물 선택과 올바른 용량 조절 방법을 진료 블로그에 정리하면 도움이 됩니다.","blogAngle":["가바펜틴과 트라조돈 외에 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 진정제 옵션이 있습니다","진정이 불안감을 감추고 있는지 확인하고, 단순 진정 아닌 근본적 불안 해소를 목표로 해야 합니다","집에서의 시험 투여와 안전 계획 수립이 중요하며, 에세프로메진 사용 시 주의가 필요합니다","불안이 심각한 환자에게는 수의 행동학 전문의와 상담하는 것이 권장됩니다"],"radar":{"owner":null,"clinical":"불안 동반 환자에서 가바펜틴/트라조돈 효과 없을 때 클로니딘, 벤조디아제핀, 덱스메데토미딘 등 대안적 약물 도입을 고려하되, 진정만 되고 불안이 남아있는지는 반드시 재평가할 것","evidence":null},"tag":""},{"id":"2026-07-20_3","day":"2026-07-20","ts":1784282456000,"cat":"clinical","kicker":"임상","isToday":false,"title":"중고도 공포·불안 강아지의 수의과 진료실 대처법","dek":"수의과 방문 시 중고도 수준의 공포, 불안, 스트레스를 보이는 강아지에 대한 핸들링 기술을 소개합니다. 강제 처치가 트라우마를 악화시킬 수 있어 의료·환경·행동 치료의 조합이 필수적입니다.","source":"VetGirl","country":"미국","date":"07.17","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/07/Handling-techniques-for-Dogs-with-for-Moderate-to-High-Levels-of-Fear-Anxiety-or-Stress.png","sourceUrl":"https://vetgirlontherun.com/handling-techniques-for-dogs-with-moderate-to-high-levels-of-fear-anxiety-or-stress-vetgirl-veterinary-continuing-education-blogs/","body":["모든 수의과 방문은 강아지에 지속적인 기억을 남깁니다. 각 진료 시 공포나 불안을 경험하는 강아지를 어떻게 다루는지가 향후 행동과 진료 협조도에 직접적인 영향을 미칩니다. 중고도 공포 상태의 강아지는 이미 부정적 경험을 하고 있으며, 추가 트라우마를 최소화하는 것이 매우 중요합니다.","5~8분간의 적응 기간 후에도 중고도 공포를 보이는 강아지는 아직 시술이 준비되지 않은 상태입니다. 강제 진료는 공포를 악화시키고 트라우마 기억을 형성합니다. 이 상태의 강아지는 전투, 도주, 불안, 정지 모드에 있으며 생명에 위협을 느끼고 간식, 장난감, 상호작용을 피합니다. 이러한 강아지에는 의료적(전처방 약물, 효과적인 진정제), 환경적(저스트레스 핸들링), 행동적 치료의 조합이 필요합니다.","진료 긴급도는 세 가지로 구분됩니다. 응급 환자는 즉각적 치료가 필요하며 빠른 작용 정맥 또는 근육 진정제를 사용하고 과도한 억제를 피합니다. 안정적 질환 방문에서는 진정을 서두를 필요 없이 전처방 약물과 저스트레스 기법을 병행할 수 있으며, 선택적 진료(예방검진, 수술, 치과)는 강아지 스트레스 수준에 따라 연기할 수 있습니다. Chip와 Luna 사례에서처럼 반복적인 긍정적 경험과 적절한 약물 조합으로 공포 강아지도 차�.balanceeren 진료를 받아들이게 됩니다."],"blog":"한국 동물병원 블로그에서 '진료실 공포를 낮추는 첫 방문 자세 유도법' 또는 '전처방 약물의 실제 적용 사례'로 풀어낼 수 있는 주제입니다.","blogAngle":["5~8분 적응 후에도 중고도 공포를 보이는 강아지는 시술 준비가 되어 있지 않으며, 강제 처치는 트라우마를 악화시킵니다.","진료 긴급도에 따라 응급, 안정적 질환, 선택적 진료로 분류하고 각각 다른 접근이 필요합니다.","전처방 약물(가바펜틴, 덱스메데토미딘 등)과 저스트레스 핸들링 기법을 병행하여 긍정적 경험을 만들어갈 수 있습니다.","반복적인 긍정적 경험과 인내를 통해 이전에 트라우마를 경험한 강아지도 진료를 받아들이게 할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 수의사 가면 너무 무서워해하는데, 어떻게 해야 스트레스 없는 진료가 가능할까요?","script":"강아지가 진료실을 무서워하는 것은해요. 단, 스트레스 핸들링 기법과 전처방 약물을 적절히 병행하면 점진적으로 스트레스를 줄일 수 있습니다. 처음에는 간단한 예방접종부터 시작해서 긍정적 경험을 쌓어나가는 것이 중요합니다."},"clinical":"진료실에 도입되는 강아지에 대해 5~8분 적응 시간을 확보하고, 저스트레스 핸들링 프로토콜과 필요시 전처방 약물 사용을 점검한다.","evidence":null},"tag":""},{"id":"2026-07-20_4","day":"2026-07-20","ts":1783677608000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 당뇨병 관리의 새로운 선택지, SGLT2 억제제","dek":"수의학에서 당뇨병 관리 방법이 빠르게 진화하고 있습니다. 특히 고양이에서 SGLT2 억제제 기반 복합요법이 기존 인슐린 치료 대안으로 주목받고 있습니다.","source":"VetGirl","country":"미국","date":"07.10","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/07/CGM.jpg","sourceUrl":"https://vetgirlontherun.com/whats-new-in-diabetes-management-vetgirl-veterinary-continuing-education-blogs/","body":["지난 20년간 인간 당뇨병 치료와 모니터링에서 큰 진전이 있었으나, 수의학에서는 최근에서야 이를 적용하기 시작했습니다. 개의 당뇨병은 췌장 베타 세포의 인슐린 생성 실패로 인해 제1형 당뇨병과 유사하여 인슐린 치료가 필수적입니다. 반면 고양이의 최대 80%는 인슐린 저항성이 원인인 제2형 당뇨병으로, 자체 인슐린을 아직 생산하고 있어 새로운 치료 옵션이 가능합니다.","Bexagliflozin과 velagliflozin은 고양이 당뇨병 치료에 승인된 SGLT2 억제제입니다. 적절히 선택된 환자에게 80~90%의 효과를 보이며, 인슐린을 전혀 생산하지 않는 고양이는 대상이 아닙니다. 치료 시작 후 3일, 1주, 2주, 4주, 12주에 걸쳐 케톤을 측정하고, 초기 프레프락타민과 4주, 12주 프레프락타민을 비교하여 혈당 조절을 평가합니다. 가장 흔한 부작용은 위장관 증상이고, 가장 심각한 부작용은 정상혈당성 케톤산증입니다.","한국 동물병원에서는 건강한 당뇨병 고양이 환자에게 SGLT2 억제제 치료를 고려할 수 있습니다. 다만 케톤산증이나 심각한 동반 질환이 있는 경우는 인슐린 치료로 전환해야 합니다. 향후 인슐린과 SGLT2 억제제 병용 치료 등 추가 연구가 기대되며, 신장이나 심혈관 보호 효과에 대한 수의학 연구도 진행될 전망입니다."],"blog":"블로그 글감으로 활용한다면, ‘고양이 당뇨병, 이제 인슐린 주사만능 시대는 끝?’ 같은 제목으로 SGLT2 억제제의 장단점을 설명하며 주치와의 상담 중요성을 강조하는 콘텐츠를 작성할 수 있습니다.","blogAngle":["고양이 당뇨병의 최대 80%는 인슐린 저항성이 원인이며, 아직 인슐린을 생산하는 고양이가 SGLT2 억제제 치료 후보가 됩니다.","Bexagliflozin과 velagliflozin은 적절한 환자에게 80~90%의 효과를 보입니다.","SGLT2 억제제 치료 시 정상혈당성 케톤산증 발생 가능성으로 인해 지속적인 케톤 모니터링이 필수적입니다.","치료 시작 후 초기 3개월간은 정기적인 프레프락타민 검사와 케톤 측정이 권장됩니다."],"radar":{"owner":{"soon":true,"q":"새로운 당뇨병 약이 있다던데, 우리 고양이도 쓸 수 있어요?","script":"SGLT2 억제제는 효과가 있지만 모든 고양이에 다 적합하지 않습니다. 고양이가 아직 인슐린을 스스로 만들고 있는지 확인하고, 케톤 수치를 잘 모니터링해야 합니다. 정확한 건 진료에서 혈액 검사와 경과 관찰을 해봐야 알 수 있습니다."},"clinical":"고양이 당뇨병 환자에게 SGLT2 억제제 치료를 고려하기 전, 인슐린 생산 능력 평가와 함께 케톤 모니터링 프로토콜을 수립하고 를 통한 혈당 조절 평가 일정을 계획한다.","evidence":null},"tag":""},{"id":"2026-07-20_5","day":"2026-07-20","ts":1784311256000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 관절염, 치료적 운동으로 관절 가동성과 근육량 개선","dek":"최근 임상 연구에서 구조화된 치료적 운동이 관절염 환 개의 관절 가동성과 근육량을 유의미하게 개선한다는 객관적 증거가 제시되었습니다. 이는 통증 관리 약물과 함께 재활 치료를 표준 치료 구성요소로 권고해야 할 근거가 됩니다.","source":"IVC Journal","country":"미국","date":"07.18","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_fozjorfozjorfozj-1-600x352.png","sourceUrl":"https://ivcjournal.com/structured-therapeutic-exercise-significantly-improves-joint-mobility-and-muscle-mass-in-dogs/","body":["관절염은 노령 개에서 가장 흔한 만성 질환 중 하나로, 관절 통증과 가동성 저하, 근육 위축을 유발합니다. 전통적으로 NSAID 등 약물 치료가 주축을 이루었으나, 최근 다학제적 접근의 중요성이 강조되고 있습니다. 구조화된 치료적 운동은 관절 주변 근육 강화와 관절 가동성 유지에 도움을 줄 것으로 예상되어 온 바, 이를 뒷받침할 체계적인 연구가 필요한 상태였습니다.","이번 연구는 관절염 진단을 받은 개를 대상으로 구조화된 치료적 운동을 시행한 후, 운동 전후의 관절 가동성과 근육량을 측정하여 객관적 개선 증거를 제시했습니다. 연구 결과, 운동을 수행한 집단에서 대조군 대비 관절 가동 범위와 근육량이 유의미하게 증가한 것으로 확인되었습니다. 이는 치료적 운동이 단순한 보완 요법을 넘어 관절염 관리의 핵심 구성요소가 될 수 있음을 시사합니다.","한국 동물병원 관점에서 보면, 이 연구 결과는 재활 치료의 증거 기반을 강화하는 자료입니다. 관절염 환 개를 진료할 때 약물 처방만 아니라 운동 처방을 함께 고려해야 하며, 필요한 경우에는 물리치료실과의 협업을 통해 맞춤형 운동 프로그램을 설계하는 것이 권고될 수 있습니다. 또한 보호자에게 운동의 중요성을 설명할 때 과학적 근거를 함께 전달하면 치료 순응도 향상에 도움이 될 것입니다."],"blog":"한국 동물병원 블로그나 SNS에서 관절염 관리법에 대한 콘텐츠를 제작할 때, 이번 연구 결과를 인용하며 재활 운동의 중요성을 소개하고, 동물병원에서 제공 가능한 운동 처방 서비스를 안내하는 글을 작성할 수 있습니다.","blogAngle":["구조화된 치료적 운동이 관절염 환 개의 관절 가동성을 통계적으로 유의미하게 개선한다는 객관적 증거가 연구를 통해 확인되었습니다.","운동 처치군에서 근육량이 증가하여 관절 주변 지지 근육 강화 효과를 입증했습니다.","연구 결과는 재활 치료를 관절염의 다학제적 관리에서 표준 구성요소로 포함시켜야 한다는 주장을 뒷받침합니다.","약물 치료와 생활습관 개입, 그리고 치료적 운동을 병합하는 통합적 접근의 효과를 확인할 수 있었습니다."],"radar":{"owner":{"soon":true,"q":"관절염 진단받았는데, 집에서 어떤 운동을 해야 통증도 줄고 관절도 좋아질 수 있나요?","script":"최근 연구에서 치료적 운동이 관절염 환 개의 관절 가동성과 근육량 개선에 도움이 될 수 있다는 근거가 나왔습니다. 다만 개마다 증상과 상태가 다르니, 어떤 운동이 적합한지 직접 상담해서 맞는 프로그램을 시작하시는 게 좋습니다."},"clinical":"관절염 환자 개 진료 시 약물 처방뿐 아니라 운동 처방도 함께 고려하고, 필요시 물리치료실과의 협업 가능성을 점검","evidence":null},"tag":""},{"id":"2026-07-20_6","day":"2026-07-20","ts":1784409296000,"cat":"industry","kicker":"업계","isToday":false,"title":"애완동물 병원 방문 시 AI가 실제로 하는 일 — AVMA 회장 인터뷰","dek":"미국수의사회(AVMA) 회장이 애완동물 진료실에서 인공지능이 실제로 어떻게 활용되고 있는지 밝혔습니다. 진단 지원에서 환자 관리까지 AI의 현재 역할과 한계를 분석합니다.","source":"Yahoo Creators","country":"","date":"07.19","read":"1분 읽기","plate":"Yahoo Creators","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi2gFBVV95cUxOTUNMLXpUWE9XbW9KM3NQeS1pSG96cEpjeEpEeVI4bE5GTmRwLWptOHVOT3hnZFhtUW83YWREZnp5YS1nSzlmOW05ekVUMXJJYVE5RjZpRmlHcU84LW9sM1RsWkx3YW9DdF9EM1o1aDFwV1h0SjhaY2dmclM4MkhTNTNUc2oxcWpyN2JFMnZlVkNTRnNIQ3FjQktFNGY2dlNkYTBnMTJpckNJSUhuU0FydzhlcUZkMWthT2lDQkJ4dlo2V1RaNkxFdVhhRVdxV3kyRjhtd0lZWXUtUQ?oc=5","body":["AI는 현재 수의 진료에서 진단 도구로 활용되기 시작했지만, 최종 결정은 여전히 수의사가 내립니다. AVMA 회장에 따르면 AI는 방사선 영상 분석, 혈액 검사 결과 해석, 증상 패턴 인식 등에서 수의사를 보조하는 역할을 합니다. 예를 들어 이상 음영이 있는 X-ray 영상을 표시해주거나 비정상적인 혈액 수치를 강조해주는 식입니다.","다만 AI는 만능 해결사가 아니라 단순히 도구일 뿐이라는 점이 강조됩니다. 실제 진료에서는 동물 소유자와의 소통, 복잡한 임상 판단, 개별 환자에 맞는 치료 계획 세우기 등 AI가 대체할 수 없는 영역이 많습니다. 또한 환자의 개인 병력이나 특성까지 고려한 종합적 판단은 경험 많은 수의사의 역량이 필요합니다.","한국 동물병원에서도 AI 도입이 가속되고 있는 상황에서, 수의사들은 AI를 도구로 활용하면서도 전문성 있는 진료 역량을 강화해야 합니다. 특히 AI가 제안한 진단이나 치료 옵션에 대해 소유자에게 설명하고 최종 판단을 내리는 것은 여전히 수의사의 역할입니다. AI와 수의사의 협업 모델이 향후 진료의 표준이 될 전망입니다."],"blog":"한국 병원 블로그 글감으로 활용한다면, \"우리 병원에서 AI를 이렇게 활용하고 있습니다\"라는 실제 적용 사례이나 AI 보조 진단의 한계와 장점을 소개하는 콘텐츠가 효과적입니다.","blogAngle":["AI는 현재 수의사 진단을 보조하는 도구로 활용되며, 최종 진료 결정은 여전히 수의사가 내립니다.","영상 분석, 혈액 검사 결과 해석, 증상 패턴 인식 등에서 AI가 수의사를 지원합니다.","동물 소유자와의 소통, 복잡한 임상 판단 등 AI가 대체할 수 없는 영역이 여전히 존재합니다.","한국 동물병원에서도 AI 도입이 확대되는 상황에서 수의사의 전문성이 더욱 중요해졌습니다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지 진료할 때 AI도 사용하세요?","script":"네, 많은 동물병원에서 AI를 도우미 도구로 활용하고 있어요. X-나 혈액 검사 결과를 먼저 선별검사해서 보여주거나, 비정상 소견을 강조해줍니다. 하지만 최종 진단과 치료 계획은 반드시 수의사가 직접 확인하고 결정합니다. AI는 단순히 도우미 역할일 뿐이에요."},"clinical":"자가 진료실 AI 활용 현황 점검, 보호자에게 AI 보조 진단 결과를 설명하는 프로토콜 수립","evidence":null},"tag":""},{"id":"2026-07-20_7","day":"2026-07-20","ts":1784307508000,"cat":"clinical","kicker":"임상","isToday":false,"title":"수의 진료에서 수술 후 호흡 억제 및 폐합병증: 문헌 고찰","dek":"개의와 고양이에서 수술 후 발생할 수 있는 호흡 억제와 폐합병증의 위험 요인과 관리 전략을 최신 문헌을 통해 정리했습니다. 마취에서 회복되는 과정에서 이러한 합병증이 생명을 위협할 수 있어 수의 임상에서 주의가 필요합니다.","source":"Cureus","country":"","date":"07.18","read":"2분 읽기","plate":"Cureus","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi-AFBVV95cUxOR3B5UVVFeHFXcVFfWUhLX3VYcnVTQks4Q1ZnZVlnS09yY0I0ZzJiRDJBOVczWEwtVVJmQUNuZ2xORzNQa0FIZ2FlRkpteWJkRmR5dlU5Z1locEFkMjBvOFBvTlgyLXJyalNVYkJMRm8wazVaNGtycmR1dGplVnR2Zi1QTjhJZDZzZ3RBS2ZYczBFbVI3RUtSOEUyaHhIMXlQaWpsei01ZVZPeU9Pcl9tMjl3aWdPd1hPckVFTkdrTGgtbHlhNXJuVVF6dzhRSG8ya1NFOEpiSWRDSVN5QTl0THVERHFSbzlKRmkzdW9wbk5hTFZJYzZFeQ?oc=5","body":["수의 진료에서 수술 후 호흡 억제는 마취제, 진통제, 특히 오피오이드 계열 약물의 잔류 효과로 인해 흔히 발생합니다. 다른 위험 요인으로는 고령 동물, 짧은 주둥이 품종(단두종), 비만, 기존 호흡기 질환이 있습니다. 문헌에 따르면 개의에서 마취 후 폐합병증 발생률은 1~5% 수준으로 보고되고 있으며, 이는 환자의 예후에 중요한 영향을 미칩니다.","호흡 억제의 조기 발견을 위해 마취 회복실에서 산소 포화도, 호흡 수, 호흡 패턴을 지속적으로 모니터링해야 합니다. 고위험 환자에게는 마취 전 폐기능 평가와 함께 마취 중 보조 호흡 유지가 권장됩니다. 오피오이드 사용 시 반전제(나록손 등)의 적절한 시점 사용과 함께 술 후 진통 프로토콜의 최적화가 중요하며, 원문에서 구체적인 약물 용량과 치료 가이드라인이 제시되어 있습니다.","한국 동물병원에서도 수술 후 호흡 관리의 중요성이 강조됩니다. 특히 고령 동물이나 특성 품종의 수술에서 회복 관리 프로토콜을 마련하고, 마취 회복실에서 기본적인 모니터링 체계를 갖추는 것이 필요합니다. 이러한 체계적인 관리는 마취 관련 사망률을 낮추는 데 기여할 수 있으며, 한국 수의학회나 관련 학회의 가이드라인을 참고하여 임상에서 적용할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '마취 후 회복 관리: 우리 병원 모니터링 프로토콜 소개'라는 제목으로 실제 임상에서 적용 가능한 점검 사항을 정리하여 올리면 좋은 콘텐츠가 될 수 있습니다.","blogAngle":["수의 진료에서 수술 후 호흡 억제는 오피오이드 마취제 잔류, 고령, 특성 품종, 비만 등 다양한 위험 요인과 관련됩니다.","단두 품종과 기존 호흡기 질환이 있는 동물에서 마취 후 폐합병증 발생 위험이 더 높습니다.","마취 회복실에서 산소 포화도, 호흡 수, 호흡 패턴에 대한 지속적 모니터링이 조기 발견에 필수적입니다.","고위험 환자의 마취 전 폐기능 평가와 술 후 체계적인 회복 관리가 합병증 예방에 중요합니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지가 수술하고 나니 숨쉬는 게 좀 느리고 얕은데 괜찮은가요?","script":"마취 뒤 숨쉬는 게 평소보다 느려 보이실 수 있는데, 이런 호흡 억제는 마취 약물의 영향으로 흔히 생기는 일시적인 현상입니다. 특히 고령이거나 코가 짧은 품종, 비만인 경우 더 주의를 해야 하므로, 회복실에서 몰빵하면서 계속 살펴보고 있어요."},"clinical":"고위험 환자(고령, 비만, 브라케시세팔릭 품종) 마취 전 폐기능 간단 문진 점검하고 회복실 모니터링 프로토콜(산소 포화도, 호흡 수·패턴) 강화 여부 확인","evidence":null},"tag":""},{"id":"2026-07-20_8","day":"2026-07-20","ts":1784212209000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개에서 쿼럼 센싱 조절제: 세균 신호 차단을 통한 장 건강 관리","dek":"항생제 내성이 심각해지는 가운데, 세균을 죽이지 않고 세균 간 신호를 차단하는 새로운 접근법인 쿼럼 센싱 조절제가 개의 장 건강과 회복력 향상에 주목받고 있습니다.","source":"IVC Journal","country":"미국","date":"07.16","read":"1분 읽기","plate":"IVC Journal","image":"http://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_a0enosa0enosa0en-600x366.png","sourceUrl":"https://ivcjournal.com/quorum-sensing-modulators-from-bacterial-signaling-to-gut-health-and-performance/","body":["세균은 단독으로 존재하지 않고 쿼럼 센싱이라는 화학적 신호 시스템을 통해 서로 소통합니다. 일정 개체수에 도달하면 세균은 집단을 형성하고 biofilm을 만들고 독소를 생산하며 병원성 인자를 발현하는 등 집단 행동을 Coordinating합니다. 이는 개의 장이나 조직 내 병원성 세균이 충분히 많아지면 더 공격적으로 변할 수 있다는 것을 의미합니다.","쿼럼 센싱(QS) 조절제는 이러한 세균 간 소통을 방해하여 병원성 세균이 해로운 반응을 조직화하지 못하게 합니다. 기존 항생제가 유익한 세균까지 함께 제거하여 dysbiosis(장균총 불균형)를 유발하는 것과 달리, QS 조절제는 해로운 세균의 신호만 차단함으로써 유익한 미생물 생태계를 보존합니다. 근무견, 스포츠견, 질병 회복기 개에서 장 건강은 성능과 회복에 직접적으로 연결됩니다.","현재 QS 조절제에 대한 수의학 연구는 아직 초기 단계이며, 개의 임상 적용은 완전히 표준화되지 않았습니다. 수의사는 동료 검토 문헌과 개 모델에서의 검증 여부를 확인하고 증거 기반 의학에 기반한 치료 결정을 내려야 합니다. 이 분야가 발전함에 따라 기존 probiotic이나 오메가3 지방산과 함께 활용 가능성을 탐색할 수 있을 것입니다."],"blog":"한국 동물병원 블로그에서는 '항생제 대안으로서의 쿼럼 센싱 조절제, 신뢰할 수 있는 제품일까?'라는 제목으로 최신 연구 동향과 함께 근무견· 스포츠견 Owners를 위한 장 건강 관리 팁을 다룰 수 있습니다","blogAngle":["쿼럼 센싱은 세균이 일정 개체수에 도달하면 집단 행동(독소 생산, biofilm 형성 등)을 Coordinating하는 신호 시스템입니다","QS 조절제는 세균을 죽이지 않고 세균 간 신호를 차단함으로써 유익한 장균총을 보존합니다","항생제 사용으로 인한 dysbiosis(IBD, 만성 설사 등)를 피할 수 있는 표적 치료 전략으로 주목받습니다","현재까지 개의 임상 적용은 표준화되지 않았으며, 증거 기반 평가가 필요합니다"],"radar":{"owner":{"soon":false,"q":"이 새로운 장 건강 약이 우리 강아지에게 효과가 있나요?","script":"현재 이 치료법은 아직 연구 초기 단계여서 개의 임상 적용이 완전히 표준화되지 않았습니다. 아직 충분한 증거가 구축되지 않은 상황이라 신중하게 접근해야 합니다."},"clinical":"개의 장 치료에서 새로운 접근법을 검토할 때 기존 프로바이오틱스, 오메가3 지방산 등 검증된 치료법과 병행 가능성을 평가한다","evidence":null},"tag":""},{"id":"2026-07-20_9","day":"2026-07-20","ts":1784142047000,"cat":"clinical","kicker":"임상","isToday":false,"title":"노령개 인지기능장애, 영양보충제로 관리한다","dek":"수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS) 진단이 증가하고 있습니다. 본 기사는 노령개 뇌건강 관리를 위한 근거 중심의 영양보충제를 소개합니다.","source":"IVC Journal","country":"미국","date":"07.16","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_n7kd57n7kd57n7kd-600x327.png","sourceUrl":"https://ivcjournal.com/nutraceutical-protocols-for-canine-cognitive-dysfunction/","body":["수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS)가 임상에서 흔한 진단이 되고 있습니다. 인간의 알츠하이머병과 유사하게 뇌 내에서 베타아밀로이드 단백질이 점진적으로 축적되어 신경세포 손상과 행동적 저하를 유발합니다. 세레길린과 같은 약물 치료가 주요 치료법이지만, 영양보충제 지원이 포괄적인 관리 계획의 일부로 주목받고 있습니다.","장쇄 오메가3 지방산(EPA, DHA)은 노령개 뇌건강을 위해 가장 증거가 강한 영양보충제입니다. DHA는 신경세포막의 주요 구조 성분으로 인지 기능 개선과 신경염 감소에 기여합니다. 특정 처방 사료는 강화된 오메가3 수준으로 뇌건강을 지원하도록 처방되어 있으며, 일관된 치료 수준의 어류 지방산을 제공하는 편리한 방법입니다. 처방 사료가 아닌 경우 어류유 보충제를 고려할 수 있으며, NASC 품질 인증 제품 선택을 권장합니다. 산화 스트레스는 CDS의 신경퇴화에 중요한 역할을 하며, 비타민 E, C, 베타카로틴, 셀레늄 등의 항산화가 이 메커니즘에 직접적으로 작용하도록 처방 사료에 항산화제 혼합물이 혼합되어 있습니다.","한국 동물병원에서 노령개 환자를 진료할 때 근거에 기반한 영양보충제 권고를 치료 도구로 활용할 수 있습니다. 특히 고급 사료 사용과 함께 어류유, 항산화제 보충제를 조합하는 프로토콜이 효과적입니다. 보충제 권장 시 신뢰할 수 있는 제조사의 제품을 선택하도록 안내하고, CDS 관리에서는 영양보충제를 초기부터 환경적 강화 및 행동 관리와 함께 통합하는 것이 가장 효과적입니다."],"blog":"노령개 보호자를 대상으로 한 블로그 글에서 '노년에 나타나는 우리 강아지의 행동 변화, 인지기능장애 아닐까요?'라는 주제로 CDS 조기 증상과 영양관리 방법을 다루면 좋습니다.","blogAngle":["노령개 인지기능장애(CDS)는 베타아밀로이드 단백질 축적으로 인한 신경세포 손상과 행동 저하를 특징으로 합니다.","장쇄 오메가3 지방산(DHA, EPA)은 신경세포막 건강과 신경염 감소에 효과가 입증된 주요 영양보충제입니다.","항산화제(비타민 E, C, 베타카로틴, 셀레늄)는 산화 스트레스로 인한 신경퇴화를 늦추는 데 중요합니다.","영양보충제는 처방 사료, 환경 강화, 약물 치료와 병행할 때 가장 효과적입니다."],"radar":{"owner":{"soon":true,"q":"노령개가 요즘 집 안에서 방향 감각을 잃거나 제 이름을 불러도 그냥 무시하는 것 같아요. 먹이는 뭐가 좋을까요?","script":"노령개의 인지기능장애는 노화에 따른 뇌 변화가 원인일 수 있습니다. 어류유 보충제와 항산화제가 뇌건강에 도움이 될 수 있다는 연구가 있지만, 효과가 나타나는 속도와 정도는 개마다 다를 수 있습니다. 어느 보충제든 본격적으로 시작하기 전에 반드시 수의사와 상담해서 현재 건강 상태에 맞는 제품을 선택하고 적절한 용량을 확인하는 것이 안전합니다."},"clinical":"노령개 환자 문진 시 인지 기능 저하 징후(방향 감각 상실, 낮/밤 역전, 활동성 저하 등) 체크리스트에 포함시키고, 어류유·항산화제 보충제 권고 가능 여부 점검","evidence":null},"tag":""},{"id":"2026-07-20_10","day":"2026-07-20","ts":1783688459000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 microbiome 조절로 항생제 의존도 낮추기","dek":"항생제 내성(AMR) 문제가 심화되면서 수의학에서도 항생제 대신 microbiome 조절을 통해 만성 질환을 관리하려는 연구가 활발해지고 있습니다. 특히 개에서 프로바이오틱스·프리바이오틱스 활용이 항생제 사용을 줄일 수 있는 유망한 대안으로 주목받고 있습니다.","source":"IVC Journal","country":"미국","date":"07.10","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_ndu0lyndu0lyndu0-600x344.png","sourceUrl":"https://ivcjournal.com/gut-microbiome-modulation-in-dogs-to-reduce-antimicrobial-use-and-amr/","body":["항생제 내성은 인의학과 수의학 모두에서 가장 시급한 글로벌 과제로 대두되고 있습니다. 항생제가 꼭 필요한지, 대안적 전략으로 같은 임상 목표를 달성할 수 있는지 검토가 적극적으로 이루어지고 있으며, 개의 microbiome 조절이 특히 만성 위장관 질환에서 유망한 접근법으로 부상하고 있습니다.","개의 위장관에는 소화, 면역 조절, 행동 건강에 중요한 역할을 하는 복잡한 미생물 생태계가 자리 잡고 있습니다. 개의 면역 약 70%가 위장관에 집중해 있어 미생물 균형이 전체 건강의 핵심 기둥이 됩니다. 이 균형이 깨진 상태(dysbiosis)는 만성 장질환, 피부질환, 요로감염, 불안 등 다양한 질환과 연결되며, 과거에는 이러한 질환을 항생제로 관리해왔습니다.","항생제 반응성 설사(ARD), 특히 티로신 반응성 설사는 젊은 대형견에서 흔한 증후군입니다. 항생제가 효과적이지만 반복적·장기 사용은 항생제 내성 우려를 제기합니다. 최근 연구에서는 프로바이오틱스, 프리바이오틱스, 식이 수정을 통해 미생물 균형을 회복하면 항생제 의존도를 낮출 수 있는지 탐색하고 있습니다. 한국의 동물병원에서도 만성·재발성 위장관 질환에 microbiome 조절 전략을 도입하면 불필요한 항생제 사용을 줄이면서도 임상 결과를 유지할 수 있는Responsible한 경로를 마련할 수 있을 것입니다.","동물 건강과 공중 건강의 수호자로서, microbiome을 치료 표적으로 삼는 것은 우수한 전략입니다. 특히 한국 동물병원 현장에서는 항생제 장기 사용이 필요한 만성 질환 환자 개에서 프로바이오틱스·식이 요법 등의 대안적 접근을 고려해볼 만합니다."],"blog":"한국 동물병원 블로그에서는 만성 설사·피부 질환·요로 감염 환자 개의 치료 과정에서 microbiome 조절(프로바이오틱스, 프리바이오틱스, 식이 변경)을 항생제 대안으로 소개하는 영상을 제작하거나 과학 게시물을 작성하는 것을 제안합니다.","blogAngle":["개의 위장관에는 전체 면역 약 70%가 집약되어 있어 microbiome 균형이 건강의 핵심 요소입니다","Dysbiosis는 만성 장질환, 피부질환, 요로감염, 불안 등 다양한 질환과 연관되어 있으며, 과거엔 항생제로 관리하는 경우가 많았습니다","티로신 반응성 설사를 포함한 항생제 반응성 설증후군에서 프로바이오틱스·프리바이오틱스·식이 수정이 항생제 대안으로 연구되고 있습니다","만성·재발성 위장관 질환에 microbiome 조절 전략을 통합하면 불필요한 항생제 사용을 줄이면서 임상 결과를 유지할 수 있습니다"],"radar":{"owner":{"soon":true,"q":"강아지가 반복 설사를 하는데, 항생제 대신 프로바이오틱스나 식이 요법으로 관리할 수 있나요?","script":"미생물 균형을 회복하는 식이 관리가 일부 경미한 위장관 문제에 도움이 될 수 있습니다. 다만 항생제가 꼭 필요한 경우도 있고, 각 동물마다 상황이 다르므로 현재 증상과 과거 병력을 자세히 살펴보고 결정해야 합니다. 프로바이오틱스나 식이 요법 도입 전엔 반드시 수의사랑 상담해 주세요."},"clinical":"만성·재발성 위장관 질환 개환자에서 프로바이오틱스·식이 요법 대안 도입 가능성을 진료 시 함께 논의하고, 불필요한 항생제 장기 사용은 점진적으로 줄여나가는 방향 검토","evidence":null},"tag":""},{"id":"2026-07-20_11","day":"2026-07-20","ts":1783896193000,"cat":"clinical","kicker":"임상","isToday":false,"title":"노령견 전지 보폭 감소, 치매 조기 경고 신호 가능성","dek":"미국 연구팀이 노령견의 전지 보폭이 인지 기능 저하와 연관되어 있음을 확인했습니다. 이는 개 치매의 조기 발견 도구로 보폭 측정을 활용할 수 있음을 시사합니다.","source":"Vet Practice Magazine","country":"호주","date":"07.13","read":"2분 읽기","plate":"Vet Practice Magazine","image":"https://www.vetpracticemag.com.au/wp-content/uploads/2026/07/dog-stride.jpg","sourceUrl":"https://www.vetpracticemag.com.au/shorter-front-leg-strides-can-be-an-early-warning-sign-of-dementia-in-senior-dogs/","body":["노르스캐롤라이나 주립대학교 연구팀은 Longitudinal Study of Canine Neuroimaging 연구의 일환으로 88마리의 노령견을 대상으로 6개월마다 3일간 종합 검사를 진행했습니다. 개들은 평균 12.7세(품종별 수명의 75%)에 연구에 등록되었고, 인지 기능, 이동 능력, 시력, 청력, 근력을 평가받았습니다. 보폭 측정은 5미터 보행로를 따라 평소 속도로 걸을 때 영상으로 촬영하여 분석했습니다.","분석 결과, 전지의 상대 보폭(체크기 보정)이 인지 기능 저하 지표인 CADES 점수 증가와 유의미한 상관관계를 보였습니다. 구체적으로 CADES 점수가 10점 증가할 때마다 전지 상대 보폭이 평균 1.2% 감소했습니다. 주목할 점은 이러한 감소가 단순 노화가 아닌 인지 기능 악화에 기인한다는 것입니다. 반면 후지의 상대 보폭은 연령이나 인지 점수와 유의미한 변화가 나타나지 않았습니다.","한국 동물병원에서 노령견 고객에게 정기 검진 시 보폭 변화를 추적하는 것이 치매 조기 발견에 도움이 될 수 있습니다. 현재 CADES와 같은 인지 기능 평가 도구는 국내에서 아직 널리 사용되지 않으나, 보폭 측정은 비교적 간단하게 임상에 도입할 수 있는 도구로 기대됩니다. 향후 한국 개들의 노화 데이터를 확보하기 위한 국내 연구가 필요할 것입니다."],"blog":"노령견 고객에게 종합 예방 검진 프로그램 도입 시 보폭 측정을 포함시키는 방안을 검토해볼 수 있습니다","blogAngle":["노령견의 전지 보폭 감소가 인지 기능 저하와 연관됨이 통계적으로 확인되었습니다","CADES 점수 10점 증가 시 전지 상대 보폭이 평균 1.2% 감소했습니다","후지 보폭은 연령이나 인지 기능과 유의미한 상관관계를 보이지 않았습니다","보폭 측정이 개 치매 조기 발견을 위한 간단하고 유용한 도구가 될 수 있습니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 전지 보폭이 줄어들었는데 이것이 치매 경고 신호일까요?","script":"전지 보폭 감소가 인지 기능 저하와 연관될 수 있다는 연구 결과가 있습니다. 하지만 보폭 감소가 반드시 치매를 의미하지는 않으며, 노화의 정상적 변화일 수도 있습니다. 정확한 판단을 위해 노령견 전문 검진에서 신경학적 평가와 인지 기능 검사를 받아보시는 것을 권장합니다."},"clinical":"노령견 고객에게 보폭 변화를 문진에 포함시키고, 가능하다면 보행로를 이용한 간단한 보폭 측정 및 기록을 정기 검진에 도입할 것을 검토한다.","evidence":null},"tag":""},{"id":"2026-07-20_12","day":"2026-07-20","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"동물 의학에서 DNA 기반 기생충 검사 도입 확대","dek":"영국에서 PCR 기술을 활용한 동물 기생충 검사가 기존의 현미경 검사를 대체하며 정확도를 높이고 있습니다. 수의학계에서는 이러한 분자진단법의 도입이 임상 현장에 어떤 변화를 가져올지 논의하고 있습니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70997?af=R","body":["동물 의학 분야에서 DNA 기반 PCR(중합효소연쇄반응) 검사가 기생충 진단에 빠르게 도입되고 있습니다. 전통적인 현미경 검사법은 검출 한계가 있고 전문가의 경험에 의존하는 반면, PCR 기술은 미량의 기생충 DNA도 감지할 수 있어 정확도가 크게 향상됩니다.","영국 수의학회(BSAVA)와 관련 학회들은 최근 PCR 기반 검사의 임상적 유용성에 대한 가이드라인을 발표했습니다. 이 검사법은 사료나 환경 샘플에서도 기생충을 검출할 수 있어 동물 복지 향상과 공중보건 측면에서도 의미가 있다고 강조하고 있습니다.","한국 동물병원에서도 PCR 검사의 도입이 적극적으로 논의되고 있습니다. 특히 기생충 감염이 의심스러운 경우 신속하고 정확한 진단이 필요한 상황에서 DNA 기반 검사가 유용할 것으로 평가됩니다. 다만 검사 비용과 장비 도입이 부담이 될 수 있어 병원 규모에 따른 단계적 도입이 권장됩니다."],"blog":"우리 동물병원에서는 기생충 감염이 의심되는 환자들에게 PCR 검사의 장점을 안내하고, 비용과 정확도를 고려한 검사 선택지를 제공하는 방안을 블로그 글로 다뤄볼 수 있습니다","blogAngle":["PCR 기술은 현미경 검사보다 미량의 기생충 DNA까지 감지할 수 있어 진단 정확도가 높습니다","영국 수의학회는 PCR 기반 기생충 검사 가이드라인을 공식 발표했습니다","환경 샘플이나 사료에서도 기생충 검출이 가능해 예방 의학에도 활용됩니다","한국의 경우 검사 비용과 장비 도입 부담으로 단계적 도입이 현실적입니다"],"radar":{"owner":{"soon":true,"q":"강아지/고양이 기생충 검사할 때 PCR 검사도 가능한가요?","script":"PCR 검사는 기존의 현미경 검사보다 미량의 기생충 DNA까지 감지할 수 있어서 더 정확한 진단이 가능합니다. 다만 검사 비용이 더 들고 장비가 필요한 관계서, 병원마다 도입 상황은 다를 수 있어요. 기생충 감염 의심 시 상황에 따라 방법을 결정하시면 됩니다."},"clinical":"기생충 검사 프로토콜에 PCR 도입 가능성 점검 - 기존 현미경 검사에서 발견되지 않았던 미량 감염 확인에 활용 고려","evidence":null},"tag":""},{"id":"2026-07-20_13","day":"2026-07-20","ts":1784314140000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"푸르듀 수의대, 수의사 부족 해결 위한 확장 계획 발표","dek":"미국 인디애나주 푸르듀 대학 수의대가 심각한 수의사 부족 현상에 대응해 캠퍼스 확장을 추진합니다. 지역사회 동물 의료 접근성 향상이 핵심 목표다.","source":"Indiana Public Media","country":"","date":"07.18","read":"1분 읽기","plate":"Indiana Public Media","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMipwFBVV95cUxPMGZBbDJyckpINHR4WEpfLWt2cTBIMHV3M0F6bDA4N016NnpCX0V2dnBGWWhQS0VYdllMQS1BUnVGaTJWeWNsUE9jVXgtUFNHT3VrbGtHS3B6UzZMaUc3NXJWWHNpUE9STmtuOGo5VUNhd29tek9vaENwUDUxRVdVSHNFMTlWQjRZWVN1a1FRaEtTbzh5RTN5R24xQms3SGRfa3IxNzFjZw?oc=5","body":["미국 전역적으로 수의사 공급 부족이 심화되고 있는 가운데, 푸르듀 대학 수의대학(College of Veterinary Medicine)은 학생 정원 확대와 시설 투자를 포함한 확장 계획을 검토하고 있습니다. 특히 농촌 지역에서의 동물 의료 접근성 저하가 지역사회에 미치는 영향을 우려하는 목소리가 높아지고 있습니다.","푸르듀 수의대는 학생 임상 실습 기회 확대와 지역사회 동물병원과의 파트너십 강화를 통해 지역 수의사 양성에 집중할 계획입니다. 이는 졸업 후 해당 지역에 잔류하는 수의사를 확보하려는 전략으로 분석됩니다. 인디애나주 내 수의사 1인당 동물 밀도는 지속적으로 상승하고 있습니다.","한국 동물병원 관점에서 보면, 농촌·외곽 지역 수의사 부족 문제는 한국에서도 동일하게 발생하는 구조적 문제다. 수의대 확장이 단순히 입학 정원 확대에 그치지 않고, 지역 기반 임상 교육 강화와 연계되어야 한다는 시사점을 제공합니다. 향후 수의사 배출 확대 시 졸업생의 지역 잔류율을 높이기 위한 제도적 노력의 필요성이 대두됩니다."],"blog":"한국 동물병원 블로그에서는 '우리 지역에도 수의사가 필요하다: 농촌 수의사 부족 해결을 위한 제언'이라는 제목으로, 한국 rural veterinarian 부족 실태와 대학교육 연계 방안을 다뤄볼 만합니다.","blogAngle":["푸르듀 대학 수의대가 학생 정원 확대와 시설 투자를 통한 확장 계획을 추진 중","미국 전역적인 수의사 부족 상황에서 농촌 지역 동물 의료 접근성 저하가 문제로 대두","푸르듀 수의대는 지역사회 동물병원과의 파트너십을 강화하여 지역 양성에 집중","한국에서도 농촌 지역 수의사 부족은 구조적 문제로, 지역 잔류율 제고 방안이 필요합니다"],"radar":{"owner":null,"clinical":"후보 수의사 채용 시 지역 연계 프로그램 참여 여부 확인하고, 인턴·레지던트 프로그램 확대 가능성 점검","evidence":null},"tag":""},{"id":"2026-07-20_14","day":"2026-07-20","ts":1784350802000,"cat":"clinical","kicker":"임상","isToday":false,"title":"반려동물 비만 치료제 개발 진행 중, 하반기 출시 예정","dek":"미국에서 애완동물 전용 비만 치료제가 하반기 출시를 목표로 개발 중입니다. 강아지와 고양이의 비만이 심각해지면서 동물 의학계와 반려동물 사육자들의 관심이 집중되고 있습니다.","source":"CNBC","country":"","date":"07.18","read":"2분 읽기","plate":"CNBC","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMifEFVX3lxTFAzS0RWQklHSlFEc1BwTC1Vbm5fOHZzUzlGUzJTcjJGNWNGN1FOWXlxZ243UEZjNGVuQV9EanFfUnRVUXREckVrQUsteEVyY3BiVTJqV3JBQXNQY3hURlV3MDV4Q2l6ZEVtaTc5R1ByWDlrWWx4d25yQWtWTVHSAYIBQVVfeXFMUG80QUhhTmcweGNtRHk1bjZMVlhvVmdpRklMaUljbm8wbXFLWFpWek5BVno2UVc3VDdXQ1MzaFdCcXFCWE92VVpoNXNSbEI3dGh0X1pLcFRiay1JUHd5clN5OVVQMU5qMkFLbHpidUttU3J0OGxIOXJKY0N3bG1EWkZUZw?oc=5","body":["반려동물 비만이 인간에서와 마찬가지로 심각한 건강 문제로 대두되고 있습니다. 미국 애완동물 제품 위원회(Pet Food Institute)에 따르면 미국 내 60% 이상의 강아지와 고양이가 과체중이거나 비만인 것으로 보고되었습니다. 비만은 당뇨, 관절 질환, 심장 질환 등 다양한 2차 질환을 유발하며 평균 수명 단축의 주요 원인으로 지목되고 있습니다.","현재 개발 중인 동물용 비만 치료제는 GLP-1 수용체 작용제로, 식욕을 억제하고 포도당 대사를 개선하는 기전을 가집니다. 이 약물은 기존에 인간 비만 치료제로 사용되던 성분을 동물용으로 재처방한 것으로, 상반기 중 FDA 승인을 목표로 임상 시험이 진행 중입니다. 강아지 대상 임상에서는 유의미한 체중 감량 효과가 관찰되었으며 부작용 프로필도 관리 가능한 수준으로 보고되었습니다.","한국 동물병원 입장에서는 이 치료제의 국내 도입 가능성과 시기, 그리고 국내 반려동물 비만 현황에 대한 인식 제고가 중요합니다. 현재 국내에도 보호자들과수의사들 사이에서 반려동물 비만에 대한 관심이 증가하고 있으며, 식이 관리와 운동 처방 외에 약물적 개입에 대한 수요가 있을 것으로 예상됩니다. 다만 국내 도입 전까지는 기존 비만 관리 프로그램의 철저한 이행이 핵심이 될 것입니다."],"blog":"국내 도입 전, 우리 병원 보호자들에게는 현재 진행 중인 해외 동물 비만 치료제 개발 소식을 접고 비만 관리 상담을 진행하는 것이 좋은 기회가 될 수 있습니다","blogAngle":["미국에서 하반기 출시를 목표로 반려동물 전용 비만 치료제가 개발 중이며, 현재 임상 시험 단계에 있습니다","개발된 약물은 GLP-1 수용체 작용제로, 식욕 억제와 포도당 대사 개선 기전을 가집니다","미국 내 60% 이상의 강아지와 고양이가 과체중이거나 비만인 것으로 보고되어 반려동물 건강 문제가 심각합니다","한국 동물병원에서는 국내 도입 전까지 식이 관리와 운동 처방 중심의 비만 관리 프로그램을 철저히 이행해야 합니다"],"radar":{"owner":{"soon":true,"q":"비만 약물이 한국에 언제 도입되나요?","script":"아직 미국에서 개발 중인 약물이라 한국 도입 시기는 아직 정해진 게 없습니다. 국내 도입 전까지는 기존처럼 식이 관리와 운동으로 비만 치료를 진행하게 됩니다. 새 약물 소식이 나오면 그때 다시 알려드릴게요."},"clinical":"비만 문진 시 체중 변화를 그래프로 나타내고, 보호자와 함께 현실적인 체중 감량 목표 설정 여부 점검","evidence":null},"tag":""},{"id":"2026-07-20_15","day":"2026-07-20","ts":1783964986000,"cat":"clinical","kicker":"임상","isToday":false,"title":"야생동물부터 애완동물까지, 신뢰 기반 의료의 공통 원칙","dek":"미국 동물병원협회(AVMA) 총회에서 디즈니 동물전문수의와 AVMA 회장이 함께 신뢰 구축, 환경 자극(enrichment), 긍정적 강화가 동물의 두려움과 스트레스를 줄이는 방법을 논의했습니다.","source":"Veterinary Practice News","country":"미국","date":"07.14","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/Drs-Penning-and-Bailey-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/wildlife-medicine-companion-animal-care-connection-avma-2026/","body":["디즈니 애니멀 킹덤의 테마파크에서 야생동물 의료 경험을 가진 Dr. Mark Penning은 호랑이와 코뿔소와 같은 동물들에게 진정제 없이 Certain 의료 절차를 수행할 수 있다고 밝혔는데, 이는 동물과 관리자 간에 형성된 신뢰 덕분입니다.","AVMA 회장 Dr. Michael Q. Bailey와 함께한 이번 행사에서는 동반동물 의료에도 동일한 원칙을 적용할 수 있다고 강조했습니다. 긍정적 조기 신뢰 구축, 환경 자극 활동과 음식 퍼즐을 통한 자연적 행동 유도, 신체 언어 주의 깊게 관찰, 일관된 일상 유지 및 정기적인 동물병원 방문이 권장되었습니다.","한국 동물병원 관점에서 보면, 이러한 접근법은 특히 anxious하거나 공격적인 동물들에게 유용할 수 있습니다. 존중하는 취급이 인간-동물 관계의 기반이 되며, 정신적으로 자극받은 동물들은 동물병원 방문 시 더 불안감이 낮아지는 것으로 나타났습니다."],"blog":"한국 동물병원 블로그에서는 '반려동물의 동물병원 스트레스 줄이기: 전문가가 권장하는 신뢰 구축 방법'이라는 제목으로 이 내용을 활용할 수 있습니다.","blogAngle":["야생동물 의료에서도 신뢰 구축을 통해 진정제 없이 의료 절차가 가능할 수 있습니다.","긍정적 강화와 환경 자극은 동반동물의 스트레스 감소에 효과적입니다.","동물의 신체 언어를 주의 깊게 관찰하고 일관된 일정을 유지하는 것이 중요합니다.","정기적인 동물병원 방문과 존중하는 취급이 동물과 보호자 간 유대감을 강화합니다."],"radar":{"owner":{"soon":true,"q":"강아지를 병원 데려갈 때 너무 불안해하는데, 집에서 미리 준비할 수 있는 방법이 있나요?","script":"환경 자극 활동이나 음식 퍼즐을 통해 집에서 긍정적으로 노출시켜 보면 도움이 될 수 있습니다. 동물병원에 정기적으로 방문해서 주사나 검사를 무조건 맞추기보다는 먼저 친해지는 시간을 가지는 것도 중요합니다. 보호자가 침착하게 대응하면 동물도 안정을 찾기 쉽습니다."},"clinical":"불안이나 공격성을 보이는 동물에 대한 진찰 시 환경 자극과 긍정적 강화 프로토콜 도입을 점검하고, 보호자와의 협력으로 스트레스 저하 전략을 논의하는 것이 좋습니다.","evidence":null},"tag":""},{"id":"2026-07-20_16","day":"2026-07-20","ts":1783896158000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"반려동물 Enrichment의 모든 것: 5가지 범주로 이해하는 동물 복지","dek":"lockdown 경험이 우리에게 보여준 것—안전과 만족은 같지 않다는 점. Katie Hank수의사는 많은 문제 행동이 단순한 행동 문제가 아니라 심리적·환경적 욕구 미충족의 증상이라고 주장합니다.","source":"Vet Practice Magazine","country":"호주","date":"07.13","read":"2분 읽기","plate":"Vet Practice Magazine","image":"https://www.vetpracticemag.com.au/wp-content/uploads/2026/06/pet-enrichment.jpg","sourceUrl":"https://www.vetpracticemag.com.au/the-importance-of-pet-enrichment/","body":["지난 수 년간 Katie Hank수의사는 신체적으로 건강하지만 심리적으로 어려움을 겪는 개들에게 행동 치료약을 처방하면서 전통적인 반려동물 돌봄 접근법에 의문을 품게 되었습니다. 동물원에서 축적된 enrichment 및 복지 경험을 바탕으로, 그녀는 companion animal 돌봄에서 중요한 사각지대를 발견했습니다. 바로 반려동물 보호자가 Enrichment를 생각하는 방식의 창의성 부족입니다.","Hank수의사에 따르면 많은 보호자들은 한두 가지 Enrichment 범주—예를 들어 신체적 Enrichment를 위한 산책과 인지/음식 Enrichment를 위한 퍼즐 장난감—에만 의존합니다. 그녀가 강조하는 5가지 환경 최적화 범주(사회적, 인지, 신체, 서식지, 감각 및 음식)를 살펴보고 더 의식적이고 창의적으로 제공해야 합니다. 그녀가 개발한 Savvy Enrichment 앱은 530개 이상의 활동을 무료로 제공하며 동물 종, 에너지 수준, 보호자가 사용 가능한 시간에 맞춘 맞춤형 일일 Enrichment 계획을 제안합니다.","한국 동물병원 관점에서 이 기사의 시사점은 명확합니다. Hank수의사는 수의들이 먼저 자신의 반려동물에서 Enrichment 활동을 높이면 복지와 유대감의 이점을 목격하게 되고, 이것이 클라이언트 추천으로 자연스럽게 이어질 것으로 기대합니다. 진료실에서 Feliway와 Adaptil 확산기 사용, 토끼와 고양이, 개를 분리하여 스트레스 감소시키기, 입원 동물에 간단한 환경 조성(고양이에게 상자 속 부드러운 침대, 기니피그에게 숨을 수 있는 straw 침대 등)을 추가하는 것부터 시작할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '진료실에서도 가능한 간단한 Enrichment—입원 동물 스트레스 줄이는 Practical한 방법들'이라는 제목으로, Feliway·Adaptil 활용 사례와 함께 보호자에게 추천할 수 있는 일상 Enrichment 팁을 정리한 기사를 쓸 수 있습니다.","blogAngle":["개, 고양이, 새, 도마뱀은 사실상 인간에 의해 생활이 규제되는 사육 동물이며, 대부분의 문제 행동은 심리적·환경적 욕구 미충족의 증상입니다.","5가지 환경 최적화 범주(사회적, 인지, 신체, 서식지, 감각 및 음식)를 모두 고려하고 보호자들은 더 창의적으로 Enrichment를 제공해야 합니다.","Enrichment는 돈이 많이 들지 않으며, 보호자의 태도 변화가 핵심입니다—예를 들어 산책 중 스마트폰 대신 개와 상호작용하고 나무 냄새 맡기기를 허용하는 것만으로도 감각·인지 Enrichment가 됩니다.","수의사들이 가정에서 먼저 반려동물의 Enrichment 수준을 높이면 클라이언트에게 더 설득력 있게 권장할 수 있으며, Enrichment와 복지 논의가 일상적인 진료 상담에 통합되어야 합니다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지/고양이에게 집에서 어떤 놀이나 환경 자극을 해줄 수 있을까요?","script":"반려동물의 문제 행동 중 일부는 심리적·환경적 욕구 미충족에서 비롯될 수 있어요. 산책이나 퍼즐 장난감처럼 한두 가지에만 의존하기보다는 사회적, 인지, 신체, 서식지, 감각, 음식까지 다양한 범주의 활동을 골고루 제공하는 것이 좋습니다. 무료 앱에서 종과 에너지 수준에 맞는 맞춤형 아이디어를 얻을 수 있습니다."},"clinical":"진료실 내 입원 동물 환경 조성(고양이 상자 침대, 기니피그 짚 침대 등)과 고양이/강아지 페로몬 확산기 사용 여부를 점검하고, 보호자 상담 시 5가지 환경 자극 범주별 활동 권장 가이드라인을 구축할 것","evidence":null},"tag":""},{"id":"2026-07-20_17","day":"2026-07-20","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"수의학 영역 항생제 적정 사용 가이드라인 업데이트","dek":"영국 수의계가 동물 진료에서의 항생제 사용 지침을 전면 개정했습니다. 인수공통감염균 증가로 항생제 내성 문제가 심각해지면서, 수의사들의 처방 관행 변화가 요구되고 있습니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70995?af=R","body":["현재까지 수의학 분야에서는 인간 의학에 비해 항생제 사용 규제와 가이드라인이 부족한 실정이었습니다. 영국 수의사협회(BVA)는 최근 모든 수의사 회원이 항생제 처방 시 항생제 내성 위험성을 반드시 고려해야 한다고 강조하며, 전면적인 가이드라인 개정을 추진했습니다.","개정된 지침의 핵심은 예방적 항생제 사용의 원칙적 금지와 함께, 반드시 필요한 경우 최소 효과용량(Minimum Inhibitory Concentration, MIC)에 기반한 용량 설정입니다. 또한 동일 약물 재처방 시 마다 치료 효과를 재평가하고, 효과가 없을 경우 즉시 중단하거나 대체제를 고려해야 합니다.","한국 동물병원에서도 항생제 내성에 대한 인식이 높아지는 만큼, 이 가이드라인의 접근 방식이 참고 될 수 있습니다. 특히 한국에서는 아직 항생제 처방에 대한 시스템적 관리가 미흡한 만큼, 수의사 개인의 판단에 의존하기보다 병원 차원의 처방 프로토콜 정립이 필요합니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원 항생제 처방 원칙'이라는 제목으로 항생제 내성 대응 실천 방안을 소개하는 글을 작성하면 좋을 것입니다","blogAngle":["영국 수의사협회가 항생제 사용 가이드라인을 전면 개정하여 예방적 사용을 원칙적으로 금지했습니다","항생제 처방 시 반드시 최소 효과용량(MIC)에 기반한 용량 설정을 권고합니다","동일 약물 재처방 시마다 치료 효과를 재평가하고, 효과 없으면 즉시 중단 또는 대체제를 고려해야 합니다","한국 동물병원에서도 병원 차원의 항생제 처방 프로토콜 정립이 필요합니다"],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지한테 항생제 그냥 막 쓰시는 건 아닌가요? 성 관련 문제 때문에 불안한데 어떻게 되는 거예요?","script":"걱정하지 마세요. 요즘에는 항생제 내성을 생각해서 꼭 필요한 경우에만 가장 낮은 효과를 보이는 용량으로 처방하고, 약 효과가 없으면 바로 중단하거나 다른 약으로 바꿉니다. 앞으로는 처방하실 때 더 신중하게 설명해 드릴게요."},"clinical":"병원 내 항생제 처방 프로토콜을 점검하고, 예방적 사용 금지와 MIC 기반 용량 설정 원칙을 반영한 지침을 수립하세요.","evidence":null},"tag":""},{"id":"2026-07-20_18","day":"2026-07-20","ts":1784289087000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 관절염 약물 다조콕스, 수술 전 진통제로 영국서 신규 허가","dek":"유럽의학청(EMA)이 개의 관절염 치료약 다조콕스(daxocox)의 수술 전(perioperative) 사용을 추가로 승인했습니다. 기존에 관절염 치료제로만 사용되던 약물이 수술 환경에서도 활용 가능해졌습니다.","source":"Veterinary Record","country":"영국","date":"07.17","read":"1분 읽기","plate":"Veterinary Record","image":null,"sourceUrl":"https://bvajournals.onlinelibrary.wiley.com/doi/10.1002/vetr.70998?af=R","body":["다조콕스는 개의 관절염 치료에 널리 사용되는 비스테로이드 소염진통제(NSAID) 성분의 약물입니다. 이번 허가는 개에서 수술 전 단계의 진통 관리에도 이 약물을 사용할 수 있도록 적용 범위를 확장한 것입니다. 유럽 여러 국가에서 관절염 치료제로 시판되어 온 약물로, 안전성과 유효성이 입증된 바 있습니다.","수술 전 진통제는 개 의료에서 중요한 부분을 차지합니다. 수술 전 적절한 진통 관리는 수술 후 통증 감소와 회복 속도 개선에 도움을 줍니다. 다만 모든 NSAID가 수술 전 사용에 적합한 것은 아니며, 약물별 특성과 수술 유형을 고려한 신중한 선택이 필요합니다.","한국 동물병원 관점에서 보면, 다조콕스의 수술 전 사용 허가는 진통제 선택지가 하나 늘어난 것으로 볼 수 있습니다. 관절염 환견이 수술을 받아야 하는 경우, 기존에 사용하던 약물을 수술 전후로 이어서 활용할 수 있는지 검토하는 데 참고할 만합니다. 구체적 용량과 처치 방법은 원문을 참조하고, 각 병원의 실제 상황에 맞춰 판단해야 합니다."],"blog":"병원의 블로그나 SNS에서 '관절염 약으로 수술 전 진통도 할 수 있다'를 주제로 다조콕스 사례를 소개하며 진통제 선택의 폭을 언급하는 글을 쓸 수 있습니다","blogAngle":["다조콕스의 수술 전 사용이 영국에서 추가로 허가되었습니다","NSAID 성분의 관절염 치료제가 수술 환경으로도 활용 가능해졌습니다","수술 전 진통제 선택 시 약물 특성과 수술 유형을 고려해야 합니다","관절염 환견의 수술 시 기존 약물 연속 사용 가능성을 검토할 수 있습니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지가 관절염 때문에 다조콕스를 먹고 있는데, 수술할 때 이 약을 계속 사용할 수 있나요?","script":"다조콕스가 수술 전 진통제로 새로 허가되어서, 관절염이 있는 강아지가 수술받을 때 기존의 약을 이어서 쓸 수 있는 옵션이 생겼습니다. 다만 수술 종류와 동물의 상태를 꼭 확인해야 하므로, 수술 전에 자세히 상담해 보시겠어요?"},"clinical":"관절염 환견의 수술 계획 시 기존 NSAID를 수술 전후로 이어서 사용할 수 있는지 프로토콜을 점검하고, 다조콕스의 수술 전 사용 허가를 하나의 선택지로 검토한다.","evidence":null},"tag":""},{"id":"2026-07-20_19","day":"2026-07-20","ts":1784325500000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"반려동물 보험, 수의사가 말하는 가입 전 필수 체크포인트","dek":"미국 수의사가 반려동물 보험의 실체와 가입 전 반드시 고려해야 할 핵심 포인트를 설명했습니다. 보험 선택이 진료 현장에서 어떤 문제를 일으키는지 확인해 봅니다.","source":"Yahoo Creators","country":"","date":"07.18","read":"1분 읽기","plate":"Yahoo Creators","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi6gFBVV95cUxPVkdja2JVb1FkR2dMaGxPdWhiUjBDVV8wY09mWDNJT3JhNHRsckk3VW1MRkRwTmpFemhYWmtKckpXR1FqMnRtb2dBTE9peVlTeDdLaEdpOFNpX19xck0tOEh3RHVwODF3TW5KVWg3VHI4anRGNjkzUzlzZTlaMUZOYmQ5UldjVEUwTDg4WXNKNGducFJBU2Vyem8ySVp4SmxETTE2YlhSeGk5VmlQVkRnTjd1Q0VEcV9MOEUtT2dVSnJSeFNHbm1xNm9IZ0l3Uk5IT3ozbTd0VklwcXhOdG1EMXVJM3U1bmNsRUE?oc=5","body":["반려동물 보험 시장이 성장하면서 점점 많아지는 주인이 가입을 고려하고 있습니다. 그러나 보험 업계 관계자에 따르면 보험회사들은 특정 질환이나 품종에 따라 급격하게 보험금을 차등화하는 경향이 있어, 실제 보상 과정에서 기대와 다른 경험을 하는 주인이 많습니다.","수의사에 따르면 실제로 많이 발생하는 질병, 예를 들어 비후성 심근증, 종양 관련 질환들은 보장 한도가 낮거나 보상에서 제외되는 경우가 빈번합니다. 특히 고급 품종의 경우 유전적 질환 발생률이 높아 보험금이 크게 차이나며, 이는 보험 가입 시 확인이 필수적인 부분입니다.","한국 동물병원 입장에서는 보험 가입 여부가 진료 선택에 영향을 미칠 수 있습니다. 주인이 보험 혜택을 기대하지만 실제로는 보장 범위가 제한적이라는 사실에 실망하는 경우가 있어, 진료 전 보험 적용 가능 여부를 함께 확인하는 진료 상담이 중요해졌습니다."],"blog":"한국 동물병원 블로그에 '보험 들이려니 고민되시나요? 수의사가 알려주는 보험 선택 꿀팁'이라는 제목으로 보험 가입 시 확인해야 할 핵심 체크리스트를 정리한 글을 작성하면 좋습니다","blogAngle":["보험회사들은 특정 질환과 품종에 따라 보험금을 급격하게 차등화하는 경향이 있습니다","유전적 질환이 많이 발생하는 품종은 보험료가 높거나 보상 범위가 제한될 수 있습니다","실제 발생 빈도가 높은 질병들이 보장에서 제외되거나 한도가 낮은 경우가 많습니다","진료 전 보험 보장 범위를 확인하는 상담이 병원 신뢰도 향상에 도움이 됩니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 보험 들었는데, 이번에 걸린 이 병은 보상 되나요?","script":"보험마다 보장 범위가 다르고, 특히 종양이나 심장병은 보상 한도가 낮거나 제외된 경우가 많습니다. 정확한 건 가입하신 보험 약관을 확인하시는 게 가장 정확해요."},"clinical":"보험 가입 여부를 묻는 보호자에게 진료 전 보상 가능 여부를 함께 확인하는 상담 프로토콜 점검","evidence":null},"tag":""},{"id":"2026-07-20_20","day":"2026-07-20","ts":1784401638000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 벼룩·진드기 예방, 사계절이 중요","dek":"수의사들이 가정에서 키우는 개에 대해 일 년 내내 벼룩과 진드기 예방을 실천할 것을 권고합니다. 겨울철에도 실내 온도가 따뜻해지면서 해충이 생존할 수 있어 계절에 관계없는 예방이 필요합니다.","source":"MSN","country":"","date":"07.19","read":"1분 읽기","plate":"MSN","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiswFBVV95cUxNUVlGWDM5X1NMdDgtUnlidUlseHNGWGpHQW1KOWJPZi1WZjJMdndDNXJtMzdLQzIyOEdzekU4b2dUVnhYZG8wOWtYWWxLZjhKVkVTVkJaN094bUpjMmZLUUhIWHdLN2JfX0p4VFB4d18zdEhWUjRCbDRDVTcyUGdIX19lRWpEV2FkVnVxX1J4MEhfS01pQnp5bEhjb295MkdnbEFfOE0xUjE3a2Z1ZkVCVC1VZw?oc=5","body":["미국 수의학회(AVMA)와 수의사들은 강아지와 성견 모두에게 일 년 내내 벼룩과 진드기 예방약을 사용하라고 강조합니다. 따뜻한 집에서 겨울에도 진드기가 살아남을 수 있고, 벼룩은 한 번 묻으면 번식해 문제됩니다. 과거에는 여름철만 주의했지만, 현재는 사계절 예방이 표준으로 자리잡았습니다.","진드기는 숲과 잔디밭에서 개에게 옮겨지고, 벼룩은 다른 동물이나 카페트, 침구에서 발견됩니다. 예방 약물은 경구, 외용, 목걸이 등 다양한 형태로 있으며, 수의사와 상의해 개에게 맞는 제품을 선택해야 합니다. 예방을 소홀히 하면 파이어(flea allergy dermatitis), 진드기 매개 질병, 심할 경우 빈혈까지 올 수 있습니다.","한국 동물병원에서도 봄철 외래 방문 시 예방 상담이 활발하지만, 겨울철에는 상대적으로 관심이 낮습니다. 그러나 요즘은 집안이 따뜻하고 산책 기회도 많아 일 년 내내 예방을 권하는 추세다. 동물병원에서는 예방 약 처방과 함께 환경 관리 방법도 함께 안내하면 도움이 될 것입니다."],"blog":"한국 동물병원 블로그에서 '겨울에도 벼룩 진드기 예방해야 할까?'라는 제목으로 계절별 예방 중요성을 다루는 글을 써보면 좋을 것입니다","blogAngle":["수의사들은 개를 키우는 모든 가정에서 일 년 내내 벼룩과 진드기 예방을 권장합니다","겨울철 따뜻한 실내 환경에서도 진드기와 벼룩이 생존하고 번식할 수 있습니다","예방 약물은 종류가 다양하므로 수의사와 상담 후 개에게 맞는 제품을 선택해야 합니다","예방을 소홀히 하면 알레르기 반응, 감염병, 빈혈 등 심각한 건강 문제를 야기할 수 있습니다"],"radar":{"owner":{"soon":true,"q":"겨울인데도 우리 강아지한테 벼룩·진드기 예방약을 계속 써야 하는 거예요?","script":"네, 요즘은 집안이 따뜻해서 겨울에도 벼룩과 진드기가 생존할 수 있어요. 그래서 사계절 내내 예방약을 쓰는 것이 권장되고 있답니다. 어떤 약이 우리 강아지에게 맞는지 수의사와 상의해 보세요."},"clinical":"내외래 방문 시 예방 약 처방과 함께 환경 관리 방법(카페트, 침구 세탁 등)도 함께 안내하는 프로토콜을 점검해 보세요.","evidence":null},"tag":""},{"id":"2026-07-20_21","day":"2026-07-20","ts":1784821016943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 요로결석의 비수술적 파쇄 치료 가능성","dek":"초음파 유도 버스트 파동쇄석술이 고양이의 폐쇄성 요로결석 치료에 안전하고 효과적임을 확인했습니다. 기존 수술적 치료 옵션이 제한적인 상황에서 새로운 최소 침습적 대안이 될 수 있습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.20","read":"2분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag136","body":["고양이의 요로결석은 사망률을 높이는 주요 원인이나, 수술 외의 치료 옵션이 매우 제한적입니다. 본 연구는 수의학용 버스트 파동쇄석술 장치의 안전성과 유효성을 평가하기 위해 11마리의 고양이(10마리는 일측성, 1마리는 양측성 요로폐쇄)를 대상으로 단일군 임상시험을 진행했습니다. 전신마취 하에 90분 이하의 치료를 시행하였으며, 총 12개의 요관에 17개의 요로결석을 치료했습니다.","결과의 경우, 5개 요관은 1회, 6개 요관은 2회, 1개 요관은 3회의 치료를 받아 총 20회의 시술이 이루어졌습니다. 12개 요관 중 11개(92%)에서 결석의 파쇄가 관찰되었고, 추적 영상검사를 시행한 10개 요관 중 8개(80%)에서 결석 배출 및 요관 확장이 감소했습니다. 결석이 배출된 고양이에서 중등도 혈청 크레아티닌 변화는 1~3주 후 중앙값 -29%(범위 -56%~28%)였습니다.","임상적 측면에서, 이 연구는 수술이 어려운 고양이의 요로결석에 대해 최소 침습적 치료 옵션을 제공할 수 있음을 시사합니다. 다만, 대조군이 없는 단일군 시험이며 표본 수가 11마리로 적다는 한계가 있어, 다기관 연구를 통한 추가 검증이 필요합니다. 잔여 결석 파편에 의한 폐쇄 악화로 재치료가 필요한 심각한 이상반응도 1건 발생하여 주의가 필요합니다."],"blog":"고양이가 밥을 먹지 않거나 소변량에 이상이 있다면 요로결석을 의심하고 신속한 진찰을 받는 것이 중요하며, 비수술적 파쇄 치료 옵션이 이제 선택지가 될 수 있습니다.","blogAngle":["11마리 고양이(12개 요관, 17개 결석)에서 버스트 파동쇄석술 시행 결과 92%(11/12)에서 결석 파쇄가 확인되었습니다","추적 영상검사 결과 80%(8/10)에서 결석 배출 및 요관 확장 감소를 확인했습니다","결석 배출된 고양이에서 혈청 크레아티닌 중앙값 29% 감소(1~3주 시점)","잔여 결석 파편에 의한 폐쇄 악화로 재치료가 필요했던 심각한 이상반응 1건 발생"],"radar":{"owner":{"soon":true,"q":"고양이 요로결석 수술 없이 치료할 수 있는 방법이 없나요?","script":"최근 연구에서 초음파로 결석을 파쇄하는 방법이 있긴 한데, 아직 국내에서 널리 도입된 방법은 아니에요. 고양이의 결석 위치와 크기, 전신 상태에 따라 방법이 다르니까, 진찰을 받고 상담해 보시는 게 좋겠습니다."},"clinical":"고양이에서 배변 행동 변화, 배수 감소 등 요로문제 의심 증상이 있으면 신속 내원하도록 보호자에게 안내","evidence":{"design":"단일군 임상시험","n":"고양이 11마리 (요관 12개, 결석 17개)","stars":2,"note":"대조군이 없고 표본 수가 11마리로 적어 결과의 일반화에 주의가 필요하며, 잔여 결석 파편으로 인한 재치료가 필요한 심각한 이상반응도 발생함"}},"tag":""},{"id":"2026-07-20_22","day":"2026-07-20","ts":1784821015943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"수의대병원 개 피부염 다제내성균 유병률 연구","dek":"2021~2024년 3년여간 416마리의 개에서 채취한 배양 검체를 분석한 결과, 전체 검체의 42%에서 다제내성균이 검출되었습니다. 이 연구는 동물병원 내 다제내성균 감시와 항균제 관리의 중요성을 뒷받침합니다.","source":"Journal of the American Animal Hospital…","country":"","date":"07.20","read":"2분 읽기","plate":"Journal of the American Animal Hospital…","image":null,"sourceUrl":"https://doi.org/10.5326/JAAHA-MS-7554","body":["본 연구는 한수의대병원에서 2021년 8월부터 2024년 11월까지 개 피부 감염에서 다제내성균의 유병률을 파악하고, 진료과별·감염 유형별 차이를 분석하기 위해 수행되었습니다. 병원 기록과 일반 피부 배양 검체를 후향적으로 검토하였으며, 총 416마리 환자에서 438건의 배양 검체와 647개 균주를 분석하였습니다.","분석 결과, 182건의 검체에서 196주의 다제내성균이 분리되어 배양 검체 기준 42%, 균주 기준 30%의 유병률을 보였습니다. 진료과별로는 일차진료과(68%), 신경과(62%), 피부과(49%), 외과(44%) 순으로 높았습니다. 감염 유형별로는 표재성 수술 부위 감염(34%), 농양(33%), 상처(30%), 종괴(28%), 농양(13%)이었습니다. 다제내성균 중 Staphylococcus pseudintermedius가 가장 흔하게 분리되었습니다.","한국 동물병원 임상 관점에서 이 연구는 일차진료과와 신경과에서 다제내성균 노출 위험이 높다는 점을 시사합니다. 특히 농양에 비해 농양과 상처에서 다제내성균 비율이 높은 것은 항균제 처방 전 배양 검사의 중요성을 강조합니다. 다만 본 연구는 단일 기관 후향적 분석으로, 표본의 대표성에 한계가 있음을 감안해야 합니다."],"blog":"반려견이 피부 문제가 생겼을 때 항균제를 함부로 사용하면 오히려 치료가 어려워질 수 있다는 점을 보호자에게 알려주는 내용을 작성해보세요.","blogAngle":["배양 검체 기준 다제내성균 유병률은 42%(182/438), 균주 기준 30%(196/647)이었습니다","진료과별 다제내성균 비율은 일차진료과 68%, 신경과 62%, 피부과 49%, 외과 44% 순","감염 유형별로는 표재성 수술 부위 감염 34%, 농양 33%, 상처 30%, 종괴 28%, 농양 13%","다제내성균의 가장 흔한 원인균은 Staphylococcus pseudintermedius였습니다"],"radar":{"owner":{"soon":false,"q":"우리 애가 병원 방문 시 다제내성균에 감염될 위험은 없나요?","script":"본 연구는 특정 병원 내 다제내성균 유병률을 조사한 것으로, 모든 동물병원에 일반화할 수는 없습니다. 동물병원에서는 항상 감염 관리 프로그램을 운영하고 있으며, 필요한 경우 검사를 통해 적절한 조치를 취합니다."},"clinical":"일차진료과와 신경과에서 다제내성균 검출율이 높으므로, 해당 진료과 환자의 피부 감염 치료 시 배양 검사 시행을 더욱 고려해야 한다.","evidence":{"design":"단일기관 후향적 분석","n":"개 416마리, 검체 438건, 균주 647개","stars":2,"note":"단일 기관 후향적 분석으로, 표본의 대표성에 한계가 있음을 감안해야 한다."}},"tag":""},{"id":"2026-07-20_23","day":"2026-07-20","ts":1784821014943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 전염성 복막염 치료용 GS-441524 경구현탁액 개발 및 물리화학적 안정성 평가","dek":"고양이 전염성 복막염 치료 핵심 약물인 GS-441524의 50 mg/mL 경구현탁액을 개발하고 다양한 온도조건에서 12주간 안정성을 평가했습니다.","source":"Veterinary medicine and science","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71073","body":["연구 배경 및 목적: GS-441524는 고양이 전염성 복막염(FIP) 치료에 중요한 항바이러스제이지만, 현재 동물용 의약품으로 승인된 제품이 없습니다. 본 연구는 규제되지 않은 제품에 대한 품질 보장 대안을 제공하기 위해 50 mg/mL 경구현탁액을 개발하고 물리화학적 안정성을 평가했습니다.","연구 방법: Syrspend SF pH 4.0과 동물용 조미료를 사용하여 3개 독립 배치를 제조했습니다. 5°C, 25°C/60% RH, 40°C/75% RH(수송 시뮬레이션) 조건에서 12주간 안정성을 평가했습니다. 반복 투약 후 28일간의 사용 중 안정성도 평가했습니다. 안정성은 초기 값의 90-110%(45-55 mg/mL) 내 약물 농도 유지, pH 3.5-4.5, 밀도 1.02-1.04 g/mL로 정의했습니다.","주요 결과 및 시사점: 모든 배치가 모든 조건에서 사전 정의된 허용 한계 내에 남아 있었습니다. 이 제형은 체중 조절 치료를 위한 GS-441524의 정확한 경구 투약을 가능하게 하며, 미승인 제품에 대한 규제 대안을 제공합니다. 그러나 본 연구는 물리화학적 안정성만 평가했으며, 약동학 및 임상 성과는 평가하지 않았습니다. 따라서 향후 약동학 및 임상 연구가 필요하며, 표본이 소규모이므로 실제 임상 적용 시 한계가 있을 수 있습니다."],"blog":"고양이 전염성 복막염에 대한 새로운 치료 옵션으로 기대되는 GS-441524현탁액이 수의사 감독 하에 조제될 수 있는 품질 기준을 제시한 연구입니다.","blogAngle":["Syrspend SF pH 4.0 기반 50 mg/mL GS-441524 경구현탁액 3개 배치 제조","12주간 모든 온도조건(5°C, 25°C, 40°C/75% RH)에서 약물 농도 90-110% 유지","28일 반복 투약 후에도 안정성 기준 충족(pH 3.5-4.5, 밀도 1.02-1.04 g/mL)","임상 적용을 위해서는 약동학 및 임상 연구 추가 필요"],"radar":{"owner":{"soon":true,"q":"GS-441524 경구약을 우리 고양이에게 쓸 수 있어요?","script":"현재 GS-441524는 한국에서 동물용 의약품으로 승인되지 않았습니다. 해외에서 개인적으로 들여올 경우 품질관리가 어렵고 부작용 발생 시 법적 책임이 불명확합니다. 승인된 치료 대안이 있으시면 그걸 먼저 고려하는 게 좋겠습니다."},"clinical":"국내 승인 FIP 치료제 여부 및 미승인 약물 사용 시 주의사항 점검","evidence":{"design":"안정성 연구(물리화학적)","n":"3개 독립 배치","stars":2,"note":"물리화학적 안정성만 평가, 약동학 및 임상 성과 미평가, 소규모 표본으로 실제 임상 적용 시 한계 존재"}},"tag":""},{"id":"2026-07-20_24","day":"2026-07-20","ts":1784821013943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"안면구조가 짧은 개와 고양이에서 흔한 눈 질환, 종합 분석","dek":"터키 한 대학 수의학대학에서 안면구조가 짧은 개 10마리와 고양이 30마리의 눈 건강을 조사한 결과, 종에 따라 다른 눈 질환이 흔함을 확인하고 정기적 안과 검사의 필요성을 제시했습니다.","source":"Canadian journal of veterinary research","country":"","date":"07.20","read":"2분 읽기","plate":"Canadian journal of veterinary research","image":null,"sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/42460135/","body":["안면구조가 짧은 동물에서 나타나는 안면비대성안증후군(BOS)은 다양한 눈 표면 질환을 유발합니다. 터키에서는 이러한 질환에 대한 데이터가 부족하여, 2022년 12월부터 2024년 5월까지 아크사라이 대학 수의학대학 외과 클리닉에서 안면구조가 짧은 동물 40마리(고양이 30마리, 개 10마리)를 대상으로 사르머 눈물 검사(STT-1), 눈물막 파괴 시간(TFBUT), 형광 염색 등 안과 검사를 실시했습니다.","개에서는 건성각결막염과 각막 궤양이 각각 5마리(50%)로 가장 많았고, 고양이에서는 세균성 결막염 19마리(63%)와 각막 궤양 10마리(33%)가 우세했습니다. 개에서 연령과 STT-1 수치 사이에 중간 수준의 음의 상관관계(r=-0.636, p=0.048)가 확인되었고, 두 종 모두에서 STT-1과 TFBUT 사이에 양의 상관관계가 나타났습니다.","본 연구는 안면구조가 짧은 동물에서 BOS 관련 눈 질환이 흔함을 재확인하며, STT-1과 형광 염색을 포함한 정기적인 안과 검사가 조기 진단에 도움이 될 수 있음을 시사합니다. 그러나 표본이 적고 단일 기관에서의 연구이므로, 결과를 일반화하는 데 한계가 있습니다. 한국 동물병원에서도 안면구조가 짧은 종을 진료할 때 안과 검사를 정기적으로 실시할 것을 권장합니다.","핵심 결과: 안면구조가 짧은 개 10마리 중 50%(5마리)에서 건성각결막염과 각막 궤양이 발견되었고, 고양이 30마리 중 63%(19마리)에서 세균성 결막염이 가장 흔했습니다. 개에서 연령이 증가할수록 눈물 분비량이 감소하는 음의 상관관계(r=-0.636)가 확인되었습니다. STT-1 수치와 TFBUT가 두 종 모두에서 양의 상관관계를 보여 눈 건강 평가에 함께 활용될 수 있습니다."],"blog":"안면이 짧은 고양이나 개를 키우는 보호자들은 평소 눈물 분비량, 눈 분비물, 각막 상태를 주의 깊게 관찰하고 정기적인 안과 검진을 받으라","blogAngle":["안면구조가 짧은 개 10마리 중 5마리(50%)에서 건성각결막염과 각막 궤양이 가장 흔하게 나타났습니다","고양이 30마리 중 19마리(63%)에서 세균성 결막염이 우세했습니다","개의 경우 연령이 증가할수록 STT-1 수치가 감소하는 음의 상관관계(r=-0.636, p=0.048)가 확인되었습니다","STT-1과 TFBUT 수치가 두 종 모두에서 양의 상관관계를 보여 눈 건강 종합 지표로 활용될 수 있습니다"],"radar":{"owner":{"soon":true,"q":"안면이 짧은 강아지/고양이라 정기적으로 눈 검사를 받아야 하나요?","script":"안면이 짧은 품종은 눈 건강에 문제가 생기기 쉽습니다. 눈물이 많거나 눈이 빨개지는 증상이 있으면 안과 검사를 받으시는 것이 좋습니다."},"clinical":"브라키세팔릭 종 진료 시 STT-1과 형광 염색을 포함한 안과 검사 프로토콜 적용을 점검하고, 고령 동물에서 더 주의 깊게 눈물 분비량을 평가할 것","evidence":{"design":"단면조사","n":"개 10마리, 고양이 30마리 (총 40마리)","stars":2,"note":"단일 기관 연구로 표본 크기가 작아 결과를 일반화하는 데 주의가 필요함"}},"tag":""},{"id":"2026-07-20_25","day":"2026-07-20","ts":1784821012943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"수의학에서 박테리오신의 항생제 대안 가능성 검토","dek":"본 검토는 수의학 분야의 박테리오신 연구에서 박테리오신이 기존 항생제의 대안으로 활용될 수 있는지를 검토하고, 임상 적용을 위한 전환 장벽을 분석했습니다.","source":"International journal of molecular scien…","country":"","date":"07.20","read":"1분 읽기","plate":"International journal of molecular scien…","image":null,"sourceUrl":"https://doi.org/10.3390/ijms27135812","body":["항생제 내성 문제가 전 세계적인 위기로 대두되면서 수의학 분야의 박테리오신 연구에서도 항생제 대안 물질에 대한 관심이 높아지고 있습니다. 본 고찰은 수의학 분야의 특이성을 반영한 박테리오신 연구의 격차를 메우고자 수행되었으며, 분자 작용 기전(지질 II, 박테리아 RNA 중합효소, 세포질막)과 임상 배치 전략(국소 치료, 항생제 병용, 생물막 내성 해소)을 검토했습니다.","임상 전 증거는 소 유방염, 개 농피증 및 외이염에서 박테리오신의 효과를 보여주었으며, MRSA, MRSP, 콜리스틴 내성균, XDR균 등 다제내성 pathogens에 대한 efficacy도 보고되었습니다. 그러나 약동학적 특성, 규제 요건, 증거 수준 등 전환 장벽이 존재하며, 정밀 나노운반체, 생물막 표적 치료, 동물 마이크로바이옴에서의 신규 분자 개발이 미래 방향으로 제시되었습니다.","임상적 시사점: 현재 대부분의 증거는 임상 전 연구에서 비롯되었으며, 대규모 임상 시험이 부족한 한계가 있습니다. 한국의 동물병원에서 박테리오신 치료를 도입하기 위해서는 추가 임상 연구가 필요하며, 특히 국내 분변 마이크로바이옴 기반 신규 균주 개발이 권장됩니다."],"blog":"반려동물 보호자들이 우려하는 다제내성균 감염 문제에 대해 기존의 합성 항생제가 아닌 천연 박테리오신 기반 치료 옵션이 향후 개발될 수 있을 것으로 기대됩니다.","blogAngle":["수의학 분야는 전 세계 항생제 소비의 약 3/4를 차지하여 AMR 위기의 중요한 거점임","박테리오신은 지질 II, RNA 중합효소, 세포질막을 표적하여 기존 항생제와 다른 작용 기전을 가짐","소 유방염, 개 농피증, 외이염 및 다제내성균 감염에서 임상 전 효과가 보고됨","전환 장벽으로 약동학적 특성, 규제 요건, 증거 부족이 제시됨"],"radar":{"owner":null,"clinical":"다제내성균 감염 환축이 증가하는 상황에서 박테리오신 기반 치료제 개발 동향을 관심을 가지고 추적하되, 현재로는 임상 적용이 제한적이므로 기존 항생제 프로토콜과 감염관리 원칙을 준수하는 것이 중요합니다.","evidence":{"design":"체계적 문헌고찰","n":"","stars":3,"note":"검토 논문으로 개별 연구의 질과 일관성에 대한 평가가 필요하며, 임상 전 증거가 대부분이므로 실제 동물 임상 효과는 추가 검증이 필요합니다."}},"tag":""},{"id":"2026-07-20_26","day":"2026-07-20","ts":1784821011943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 폐활성 담낭염 35례: 임상 양상과 치료 결과","dek":"개의 희귀하고 심각한 담낭염인 폐활성 담낭염의 임상 양상과 예후를 후향적으로 분석하여 치료 전략 수립에 필요한 근거를 제시했습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.20","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag113","body":["4개 대학병원에서 2000년부터 2024년 사이에 폐활성 담낭염으로 진단된 가정 소유 개 35마리를 대상으로 의무기록을 후향적으로 검토했습니다. 초음파 또는 전산단층촬영으로 진단된 증례를 분석했습니다.","가장 흔한 임상 증상은 구토(66%), 기력저하(66%), 식욕부진(43%)이었습니다. 실험실 검사상 염증성 백혈구 증가(68%)와 간효소 상승(85%), 고빌리루빈혈증(일부)이 관찰되었습니다. 배양된 세균은 대장균(13균주)과 클로스트리듐(12균주)이 가장 흔했습니다. 담낭절제술을 받은 14마리 중 4마리(29%)가 수술 후 사망했으며, 약물치료만 받은 11마리는 모두 퇴원했습니다. 6개월 이상 추적 관찰된 6마리 중 5마리가 생존했습니다.","개의 폐활성 담낭염은 구토와 기력저하로 나타나며, 염증성 백혈구 증가와 간효소 상승을 동반합니다. 담낭절제술은 원인균 배양 검체를 확보할 수 있지만 약물치료만으로도 생존이 가능할 수 있습니다. 단, 본 연구는 후향적 연구로 표본이 적고 다기관 연구이지만, 희귀 질환에 대한 유용한 임상 데이터를 제공합니다."],"blog":"애완견이 갑자기 구토와 기력저하를 보인다면 간담도 질환 가능성을 고려하고, 특히 간효소 상승이 동반되면 신속한 영상의학적 검사가 필요합니다.","blogAngle":["35마리 증례 분석 결과, 구토(66%)와 기력저하(66%)가 가장 흔한 임상 증상이었습니다.","염증성 백혈구 증가(68%)와 간효소 상승(85%)이 주요 실험실 이상 소견이었습니다.","대장균(13균주)과 클로스트리듐(12균주)이 가장 흔한 원인균이었습니다.","담낭절제술 후 사망률은 29%(4/14)이었으며, 약물치료만 받은 11마리는 모두 생존했습니다."],"radar":{"owner":null,"clinical":"개의 담낭 질환 의심 시 간효소 상승 여부와 복부 초음파에서 담낭벽 비후 또는 폐활성 소견 유무 함께 점검","evidence":{"design":"후향적 다기관 코호트","n":"개 35마리","stars":2,"note":"후향적 연구로 표본 크기가 작고(35마리), 약물치료군과 수술군 간 선택 편향 가능성 있어 결과 해석에 주의 필요"}},"tag":""},{"id":"2026-07-20_27","day":"2026-07-20","ts":1784821010943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 에틸렌글리콜 중독에서 Lactate Gap의 진단·치료 종결 지표 활용","dek":"개 에틸렌글리콜 중독 의심 환자에서 서로 다른 분석기 간 lactate 측정값의 불일치(lactate gap)를 진단 도구와 간헐적 혈액투석 종료 시점 결정에 활용할 수 있음을 보고합니다.","source":"The Canadian veterinary journal","country":"","date":"07.20","read":"1분 읽기","plate":"The Canadian veterinary journal","image":null,"sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/42368698/","body":["18개월령 개가 응급실로 내원하여 두 종류의 분석기에서 측정한 lactate 값에 현저한 불일치(lactate gap)가 관찰되고, 상승된 anion gap과 신성 azotemia가 동반되어 에틸렌글리콜 중독이 의심되었습니다.","간헐적 혈액투석을 실시하여 lactate gap이 정상화될 때까지 치료를 지속하였으며, 이를 통해 lactate gap이 치료 반응과 투석 종료 시점을 결정하는 지표로 활용될 수 있음이 확인되었습니다.","본 보고서는 단일 증례이며 추가 연구가 필요하지만, 한국 동물병원 응급 진료에서 lactate gap 측정으로 에틸렌글리콜 중독을 신속히 감별하고 적절한 투석 치료 기간을 결정하는 데 참고가 될 수 있습니다. 단, lactate gap은 특정 분석기 조합에서만 관찰될 수 있으므로 적용 시 분석기 특성을 고려해야 합니다."],"blog":"강아지가 갑자기 쓰러졌는데 응급실 lactate 검사 결과가 이상하다? 그 차이가 에틸렌글리콜 중독 신호일 수 있습니다.","blogAngle":["18개월령 개에서 두 분석기 간 lactate 측정값 차이가 5 mmol/L 이상 나는 lactate gap이 관찰되었습니다.","상승된 anion gap과 신성 azotemia가 함께 나타나 에틸렌글리콜 중독이 강력히 의심되었습니다.","간헐적혈액투석을 실시하여 lactate gap이 정상화될 때까지 치료하였고, 이를 투석 종결 지표로 활용하였습니다.","단일 증례 보고서이므로 추가 연구가 필요합니다."],"radar":{"owner":null,"clinical":"에틸렌글리콜 중독 의심 시 응급실 보유 분석기에서 측정 가능 여부 점검, 간헐적 혈액투석 치료 시 정상화까지 치료 기간 결정하는 프로토콜 검토","evidence":{"design":"증례보고","n":"개 1마리","stars":1,"note":"단일 증례 보고로, 분석기 종류에 따라 관찰 여부가 달라질 수 있어 일반화에 주의가 필요합니다."}},"tag":""},{"id":"2026-07-20_28","day":"2026-07-20","ts":1784821009943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개와 고양이 스마트폰 안저 영상 시스템 비교: OQVet 화질 최고","dek":"스마트폰 기반 안저 영상 시스템 4종의 실현 가능성과 화질을 비교한 결과, OQVet이 가장 높은 화질 점수와 평가자 선호도를 기록하며 참고 카메라 대비 일부 검사에서 우위를 보였습니다.","source":"Veterinary ophthalmology","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary ophthalmology","image":null,"sourceUrl":"https://doi.org/10.1111/vop.70210","body":["본 연구는 개의와 고양이에서 스마트폰 기반 안저 영상 시스템 4종(iExaminer Panoptic, NUN WFE-02S, OQVet, VistaView)의 실현 가능성과 화질을 handheld 적외선 안저 카메라(Aurora)와 비교하기 위해 수행되었습니다. 10마리의 개와 10마리의 고양이 총 40안을 대상으로 mydriatic 20안과 non-mydriatic 20안에서 영상을 획득했습니다.","모든 장비와 조건에서 영상 획득 성공률이 100%를 기록했습니다. 화질은 장비 간 유의미한 차이가 있었으며, SBFI 시스템 중 OQVet이 중앙값 7점(IQR 6-8)으로 최고 점수를 받았고, VistaView 6점(IQR 5-8), NUN 5점(IQR 4-7), iExaminer 4점(IQR 3-5) 순이었습니다. OQVet은 평가자 선호도 표의 약 50%를 획득했습니다. 참고 카메라 Aurora는 77.5% 검사에서 최고 화질을 보였으나, OQVet(15%)과 VistaView(7.5%)가 일부 검사에서 앞서기도 했습니다. 동공확장은 화질과 영상 획득 시간에 유의미한 영향을 주지 않았습니다.","스마트폰 기반 안저 영상은 개와 고양이에서 신뢰할 수 있는 망막 영상을 가능 하며, 임상에서 망막 문서화와 선별검사에 접근 가능한 도구로 활용될 수 있습니다. 다만 본 연구는 단일기관에서 20마리 동물만 수행되어 표본이 작으며, 후향적 평가의 한계가 있습니다."],"blog":"반려동물 안과 검사 받고 싶어하시는 보호자분들께, 스마트폰 어댑터를 활용한 안저 검사가 신뢰할 만한 결과를 제공할 수 있다는 점을 안내할 수 있습니다.","blogAngle":["스마트폰 기반 4종 안저 영상 시스템 모두 100% 영상 획득 성공률을 달성했습니다","OQVet이 SBFI 시스템 중 최고 화질 중앙값 7점(IQR 6-8)을 기록하고 평가자 선호도 약 50%를 획득했습니다","참고 카메라 Aurora는 77.5% 검사에서 최고 화질을 보였으나, OQVet과 VistaView가 일부 검사에서 앞서기도 했습니다","동공확장은 화질과 영상 획득 시간에 유의미한 영향을 주지 않아 비확장 상태 영상도 유효합니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 안저 검사할 때 어떤 기기로 해요?","script":"스마트폰 기반 안저 카메라도 전통적인 전문 안저 카메라 못지 않게 선별검사나 간단한 문서화에 쓸 수 있다는 연구 결과가 있습니다. 구체적인 장비 선택은 검사 목적과 동물의 상태에 따라 수의사가 판단합니다."},"clinical":"자가 진료 환경에서 사용하는 스마트폰 안저 시스템의 화질을 이 연구 결과와 비교하여 점검하고, 필요시 등 고화질 시스템 도입을 검토해 볼 수 있다","evidence":{"design":"단일기관 전향적 비교 연구","n":"개 10마리, 고양이 10마리 (총 40안)","stars":2,"note":"20마리 소규모 표본이고 후향적 평가로 인한 선택편향 가능, 단일기관 연구여서 일반화에 주의 필요"}},"tag":""},{"id":"2026-07-20_29","day":"2026-07-20","ts":1784821008943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개의 만성 장염, 주인의 돌봄 부담감과 삶의 질에 미치는 영향","dek":"개의 만성 장염 환양이 건강한 개를 키우는 환양보다 상당한 심리적 부담과 낮은 삶의 질을 경험하며, 특히 개 건강에 대한 우려가 가장 큰 부담원이라는 사실을 확인했습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.20","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag128","body":["개의 만성 장염은 평생 관리 필요로 하며 주인의 돌봄 부담을 유발할 수 있습니다. 이 단면 연구는 자기보고 설문지를 통해 만성 장염 환양 223명과 건강한 개 환양 447명의 정서적·사회적·재무적 부담과 개-주인 관계를 Zarit Burden Interview와 Monash Dog Owner Relationship Scale을 기반으로 평가했습니다.","만성 장염 환양은 대조군에 비해 상당한 심리적 부담과 낮은 삶의 질을 보고했습니다. 심각한 임상 증상의 빈번한 발현이 부담감 증가와 삶의 질 저하와 유의하게 관련되었습니다. 그러나 대부분의 주인이 개에 대한 정서적 유대감과 애착을 유지하여 개-주인 관계는 대체로 온전하게 남아있었습니다. 부담감 기여 요인으로는 동물병원 방문 빈도, 개의 시간 소모적 인식, 재정적 부담이 확인되었으나, 개의 고통·증상 재발·죽음에 대한 우려가 가장 중요한 부담원으로 꼽혔습니다.","만성 장염 환양의 돌봄 부담은 상당하며 주인의 삶의 질에 부정적 영향을 미칩니다. 다만 개에 대한 정서적 유대는 유지되므로, 수의사는 치료 과정에서 보호자의 심리적 안녕도 함께 고려해야 합니다. 이 연구는 단면 설계와 자기보고 방식의 한계가 있으며, 추후 전향적 연구가 필요합니다."],"blog":"반려견이 만성 장염 진단을 받으면 치료만큼이나 보호자 자신의 정서적·재정적 부담도 함께 관리해야 한다는 점을 함께 다루는 것이 좋습니다.","blogAngle":["만성 장염 개를 키우는 주인은 건강한 개 환양보다 유의하게 높은 심리적 부담과 낮은 삶의 질을 보고했습니다","심각한 임상 증상의 발현 빈도가 높을수록 주인의 돌봄 부담감이 증가하고 삶의 질이 저하되었습니다","동물병원 방문, 시간 소모적 인식, 재정적 부담이 부담감 요인으로 확인되었으나, 개 건강에 대한 우려가 가장 큰 부담원이었습니다","대부분의 주인이 개에 대한 정서적 유대와 애착을 유지하여 개-주인 관계가 대체로 온전하게 남아있었습니다"],"radar":{"owner":{"soon":true,"q":"우리 강아지 장염이 오래되니까 제가 너무 부담되네요, 제가 잘 돌보고 있는 건가요?","script":"만성 장염을 가진 개를 키우시는 보호자분들은 실제로 상당한 돌봄 부담을 느끼십니다. 치료를 통해 증상이 잘 조절되면 부담도 줄어들 수 있으므로 함께 적극적으로 관리해 보아요."},"clinical":"만성 장염 환양 보호자의 심리적 부담감 문진 항목을 진료 문진에 추가하거나, 진료 과정에서 보호자의 정서적 안녕을 확인하는 시간을 확보하는 것을 검토","evidence":{"design":"단면조사","n":"만성 장염 환양 223명, 건강한 개 환양 447명","stars":2,"note":"단면 설계와 자기보고 방식이므로 인과관계 파악에 한계가 있으며, 추적 관찰이 필요하다"}},"tag":""},{"id":"2026-07-20_30","day":"2026-07-20","ts":1784821007943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"보더테리어의 식이 반응성 전신 호산구증가 1례","dek":"재발성 복통과 현저한 호산구증가를 보이는 보더테리어에서 글루텐 무함유 가수분해 식이만으로 치료에 성공한 사례를 보고합니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.20","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag133","body":["15개월령 수컷 보더테리어가 6개월간의 재발성 급성 복통, 떨림, 구토, 연변을 주소로 동물병원에 내원하였습니다. 전혈검사에서 지속적인 현저한 호산구증가가 확인되었고, CT에서 복부 임파선 비대가 관찰되었습니다. 세침흡인 세포학적 검사상 호산구성 및 호중구성 화농성 육아종성 임파선염이 확인되었고, 개복술 중 공장 및 장골 임파선, 간, 공장 조직 생검을 시행하였습니다.","조직학적 검사상 현저한 호산구 침윤이 관찰되었으나 특정 원인균은 동정되지 않았습니다. 기존 보고에서는 prednisolone과 hydroxyurea 병합 요법이 필요하였으나, 본 증례에서는 글루텐 무함유 가수분해 식이(Purina Pro Plan Veterinary Diets HA)만으로 임상증상과 호산구증가가 호전되었습니다.","본 증례는 단일 사례보고로 일반화에 한계가 있으나, 식이 알레르기가 호산구성 다기관 침윤의 원인일 수 있음을 시사합니다. 한국 동물병원에서 호산구증가와 위장관 증상을 보이는 동물에서 표준 검사 후에도 원인이 불명확할 경우 식이 교체를 진단적 치료 옵션으로 고려할 수 있습니다."],"blog":"반려견이 갑작스러운 복통과 설사를 반복할 때, 단순 위장관염이 아니라 식이 알레르기가 원인일 수 있으며 식이 교체가 호전의 열쇠가 될 수 있습니다","blogAngle":["15개월령 보더테리어에서 6개월간 지속된 재발성 복통, 떨림, 구토, 연변과 현저한 전신 호산구증가가 관찰되었습니다","CT에서 복부 임파선 비대가, 조직 생검에서 원인 불명의 현저한 호산구 침윤이 확인되었습니다","글루텐 무함유 가수분해 식이 단독 투여로 임상증상과 호산구증가가 호전되었습니다","본 방법은 prednisolone과 hydroxyurea 병합 요법이 필요했던 기존 보고와 다른 치료 접근을 제시합니다"],"radar":{"owner":{"soon":true,"q":"강아지가 계속 복통과 설사를 하는데, 식이 알레르기 때문일까요?","script":"식이 알레르기는 호산구증가와 위장관 증상의 원인 중 하나일 수 있습니다. 표준 검사 후에도 원인이 잘 안 보이면 식이 교체를 진단적 치료 옵션으로 고려해 볼 수 있습니다. 정확한 원인은 추가 검사로 확인해 보아야 합니다."},"clinical":"호산구증가와 위장관 증상을 보이는 개에서 표준 검사 후에도 원인이 불명확할 경우 글루텐 무함유 가수분해 식이 교체를 진단적 치료 옵션으로 고려하고 경과 관찰","evidence":{"design":"증례보고","n":"보더테리어 1마리","stars":1,"note":"단일 사례보고여서 일반화에 주의가 필요하며, 다른 원인 배제를 위한 표준 검사 누락 여부도 고려해야 함"}},"tag":""},{"id":"2026-07-20_31","day":"2026-07-20","ts":1784821006943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 췌장 초음파 검사, 관찰자 간 결과 차이 커","dek":"104명의 수의학 전문의가 개 췌장 초음파 영상을 분석한 결과, 관찰자 간 일치도가 낮아 초음파 판독의 주관성이 문제임이 확인되었습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.20","read":"1분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70202","body":["복부 초음파는 개에서 췌장 질환 진단에 중요하지만, 해석이 검사자마다 달라질 수 있다는 문제점이 있었습니다. 15장의 개 췌장 초음파 영상을 수의학 전문의 104명이 독립적으로 검토했으며, 이 중 24명은 약 2.5개월 후 다시 검토하여 관찰자 내 일치도도 평가했습니다. 상대적 에코원성, 에코 질감, 윤곽, 임상 해석을 분석했습니다.","관찰자 간 평균 일치도는 낮았고(Kα=0.34), 관찰자 내 일치도는 중간 수준이었습니다(PABAK=0.49). 전체 췌장 에코원성(0.58)과 장간막 지방 대비 에코원성(0.53)에서 일치도가 가장 높았으며, 준객관적 척도의 에코 질감도 비교적 높은 일치도를 보였습니다(0.50). 그러나 임상적 중요성(0.35)과 원인 우선순위(0.14)에 대한 관찰자 간 일치도는 매우 낮았습니다. 경력 10년 미만의 초기 경력 수의학 전문의가 전체 에코원성에서 중간 수준 일치도(0.71)를 보이며 가장 높은 관찰자 간 일치도를 나타냈습니다.","이 연구는 개 췌장 초음파 판독에서 검사자 간 상당한 차이가 있음을 보여줍니다. 특히 임상적 판단과 원인 진단에서 일치도가 현저히 낮아, 초음파만으로 확실한 진단을 내리기 어려움을 시사합니다. 평가 기준의 표준화가 필요하며, 이는 단일 기관·후향적 연구의 한계를 감안해야 합니다."],"blog":"보호자들에게는 초음파 검사 결과가 검사자의 주관적 판단에 영향을 받을 수 있음을 설명하고, 필요하다면 추가 검사나 다른 전문가의 소견을 참고할 것을 권유할 수 있습니다.","blogAngle":["104명의 수의학 전문의 분석 결과, 관찰자 간 평균 일치도는 낮은 수준이었습니다(Kα=0.34).","전체 췌장 에코원성과 장간막 지방 대비 에코원성이 가장 높은 일치도를 보였습니다(각각 0.58, 0.53).","임상적 중요성과 원인 우선순위 판독의 일치도는 매우 낮았습니다(각각 0.35, 0.14).","경력 10년 미만의 초기 경력 전문의가 전체 에코원성에서 중간 수준 일치도(0.71)를 보였습니다."],"radar":{"owner":{"soon":true,"q":"초음파로 우리 강아지 췌장염 제대로 확인할 수 있어요?","script":"초음파만으로 췌장염을 확실히 판단하기는 어려워요. 검사자마다 영상을 다르게 해석할 수 있어서, 조영 초음파 검사 같은 다른 검사와 함께 종합해서 판단해야 합니다."},"clinical":"췌장 초음파 판독의 주관성을 줄이기 위해 평가 기준을 표준화하고, 필요시 조영 초음파 검사를 보완적으로 활용하는 프로토콜을 점검해야 한다.","evidence":{"design":"단면조사","n":"영상 15장, 수의학 전문의 104명","stars":2,"note":"단일 기관 후향적 연구로 일반화에 한계가 있으며, 다양한 기관·영상을 포함한 추가 연구가 필요하다."}},"tag":""},{"id":"2026-07-20_32","day":"2026-07-20","ts":1784821005943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"강아지·고양이 기생충, 진화하는 위협을 대비하라","dek":"기후변화와 글로벌 이동 증가로 강아지·고양이 기생충의 분포와 특성이 급변하고 있으며, 새로운 병원체 출현과 내성 획득이 가속화되고 있음을 보고합니다. 이 변화에 대응하려면 수의학과 보건학의 긴밀한 협력과 진단 역량 강화가 필수적입니다.","source":"Trends in parasitology","country":"","date":"07.20","read":"1분 읽기","plate":"Trends in parasitology","image":null,"sourceUrl":"https://doi.org/10.1016/j.pt.2026.05.007","body":["본 연구는 강아지·고양이 기생충의 변화를 다양한 학문적 관점에서 분석한 종합 보고서입니다. 기후변화와 글로벌 여행·무역 증가가 기생충의 분포를 재구성하고 있으며, 일부 종은 새로운 지역에 출현하거나 중간 숙주를 바꾸는 등 병원성 발현 양상이 변하고 있습니다.","연구 결과, 유전자 재조합과 잡종 형성이 병원성과 전파 패턴을 변화시킨 새로운 변이주를 만들어내고 있으며, 진단 역량의 한계로 인해 오랫동안 간과되어 온 기생충들도 확인되었습니다. 이러한 변화는 동반 동물 기생충학이 더욱 역동적이고 예측 불가능해질 것임을 시사합니다.","한국 동물병원 임상 관점에서 보면, 최근 해외 여행 후 애완동물의 기생충 감염 사례가 증가하고 있어 여행력을 철저히 확인해야 합니다. 표본 크기나 특정 지역 데이터가 제시되지 않은 종합 보고서이므로, 한국 내 실태 연구가 추가로 필요하며, 예방접종과 구충제 사용의 중요성을 보호자에게 지속적으로 안내하는 것이 중요합니다."],"blog":"반려동물을 키우는 보호자들은 해외 여행 시 기생충 감염 위험을 반드시 인식하고, 예방적 구충제를 정기적으로 사용해야 합니다","blogAngle":["기후변화와 글로벌 이동 증가로 기생충의 지리적 분포와 출현 패턴이 크게 달라지고 있습니다","일부 기생충은 새로운 숙주로 전이하거나 약제 내성을 획득하고 있습니다","유전자 재조합으로 병원성과 전파력이 변한 새로운 변이주가 출현하고 있습니다","진단 역량 부족으로 인해 오랫동안 간과되어 온 기생충이 발견되고 있습니다"],"radar":{"owner":{"soon":true,"q":"최근 해외 여행 다녀왔는데 우리 강아지/고양이 기생충 감염 위험은 없나요?","script":"해외 여행 후에는 기생충 감염 가능성을 확인하기 위해 변 검사를 해보는 것이 좋습니다. 평소부터 정기적인 구충제 예방도 중요하고, 여행 계획이 있다면 사전에 수의사와 상의해 예방 방법을 상담하세요."},"clinical":"외래 문진 시 여행력 칸을 반드시 확인하고, 해외 여행 후 동물에게서 이상 증상이 있으면 기생충 감별 검사를 포함시키는 진료 프로토콜을 점검하세요.","evidence":{"design":"체계적 문헌고찰","n":"","stars":1,"note":"표본 수가 제시되지 않은 종합 보고서이며, 근거 수준이 낮아 특정 임상 권고 적용 시 추가 연구 확인이 필요합니다."}},"tag":""},{"id":"2026-07-20_33","day":"2026-07-20","ts":1784821004943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"저장용 MRI, 개 뇌 영상에서 기존 1.5T와 유사한 해부학적 시각화 가능","dek":"0.05T 저장용 MRI가 개의 뇌 영상에서 측방 뇌실 등 주요 해부학적 구조를 기존 1.5T MRI와 유사하게 시각화할 수 있음을 확인했습니다. 저장된 환경에서도 접근 가능한 뇌영상 검사로 자원 제한 지역 수의임상에 활용될 수 있는 가능성을 제시한 최초의 수의학 연구입니다.","source":"The veterinary quarterly","country":"","date":"07.20","read":"2분 읽기","plate":"The veterinary quarterly","image":null,"sourceUrl":"https://doi.org/10.1080/01652176.2026.2696026","body":["이 연구는 자원 제한 지역에서 고자장 MRI의 높은 비용으로 인한 의료 접근성 문제를 해결하기 위해 개발된 0.05T 저장용 MRI를 수의임상에 처음 적용한 파일럿 연구입니다. 개의 사체 뇌 프로토콜을 임상 환자로 전환하여 21마리 다른 개 환자에서 획득한 0.05T 이미지를 기존 1.5T 이미지와 비교했습니다. 15개 해부학적 구조의 가시성을 횡단면 T1강조 조영 후영상과 T2강조영상에 대해 1~3점 척도로 평가했습니다.","주요 결과에서 측방 뇌실은 모든 시퀀스와 시스템 조합에서 89.3%~100%의 비율로 최고 점수(3점)를 받아 가장 잘 시각화되었습니다. T2강조영상의 경우 중뇌수조(56.3%~100%), 제4뇌실(77.1%~100%), 시상(68.8%~100%)에서도 우수한 확인율을 보였습니다. 절대 시각 등급 특성 분석 결과, 이러한 구조들에 대해 0.05T 시스템이 1.5T MRI와 비교 가능한 성능을 보이는 것으로 확인되었습니다.","한국 동물병원 임상 관점에서, 저장용 MRI는 고자장 MRI 장비가 부족한 중소 동물병원이나 외래 진료 현장에서 뇌영상 검사를 제공할 수 있는 대안이 될 수 있습니다. 다만, 21마리 단일기관 파일럿 연구로 표본수가 작고, 모든 해부학적 구조를 평가한 것이 아니라 제한된 구조만 확인했다는 한계가 있습니다. 향후 더 많은 환자를 대상으로Prospective 연구가 필요합니다."],"blog":"반려견이 뇌질환이 의심될 때 고비용의MRI 대신 더 접근하기 쉬운 저장용 MRI로 검사를 받을 수 있는 시대가 올 수 있습니다.","blogAngle":["0.05T MRI에서 측방 뇌실은 89.3%~100%의 비율로 가장 선명하게 시각화되었습니다.","T2강조영상에서 중뇌수조, 제4뇌실, 시상이 56.3%~100% 범위에서 확인되었습니다.","0.05T 시스템이 15개 해부학적 구조 중 주요 구조에서 1.5T MRI와 동등한 성능을 보였습니다.","본 연구는 수의학 임상 환경에서 0.05T MRI를 사용한 최초의 보고입니다."],"radar":{"owner":null,"clinical":"0.05T MRI의 뇌영상 시각화 성능을 확인했으니, 고자장 MRI 의뢰 기준을 점검하고 자원 제한 환경에서의 영상 검사 대안 가능성을 고려","evidence":{"design":"단일기관 파일럿 연구","n":"개 21마리","stars":2,"note":"21마리 소규모 표본에 제한된 해부학적 구조만 평가되어 일반화에 주의 필요"}},"tag":""},{"id":"2026-07-20_34","day":"2026-07-20","ts":1784821003943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개·고양이 흉부 X-ray에서 인공지능으로 폐렴 진단하기","dek":"이 연구는 개와 고양이의 흉부 X-ray에서 딥러닝 모델로 폐렴을 자동 진단하는 파이프라인을 개발했습니다. 정면 및 측면 투사 모두에서 90% 이상의 정확도와 0.94 이상의 AUC를 달성하여 임상 활용 가능성을 보여주었습니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.20","read":"2분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70170","body":["현재 수의사 흉부 X-ray 판독은 수동으로 진행되어 판독자 간 차이가 크고 초기 병변 발견 민감도가 낮은 문제가 있습니다. 본 연구는 PaddleSeg 기반 의미론적 분할로 흉부 영역을 추출하고 Mamba 프레임워크로 분류하는 AI 진단 파이프라인을 구축했습니다. Gradient-weighted Class Activation Mapping을 통해 판독 과정을 해석할 수 있게 했으며, 다차원 불확실성과 해석 가능성을 통합한 AI Risk Index(ARI) 모듈도 제안했습니다.","의미론적 분할에서 흉부 영역 추출 정확도를 나타내는 mIoU는 0.8999를 달성했습니다. 정면(VD/DV) 투사 분류에서는 정확도 90.35%, macro F1-score 0.9034, AUC 0.9438을 보였습니다. 측면 투사에서도 정확도 89.8%, macro F1-score 0.8965, AUC 0.9361으로 강건한 성능을 유지했습니다.","임상적 시사점: 이 AI 파이프라인은 동물병원에서 흉부 X-ray 판독 보조 도구로 활용될 수 있으며, 초기 폐렴 발견율을 높이고 판독자 간 차이를 줄일 수 있습니다. 다만, 본 연구는 특정 데이터셋에서 개발·평가된 것으로, 다양한 동물병원 환경에서의 전향적 검증이 필요합니다. ARI 모듈은 AI 판독의 불확실성을 정량화하여 임상의가 최종 판독을 내릴 때 참고할 수 있는 해석 가능한 정보를 제공합니다."],"blog":"반려동물의 폐렴이 의심될 때, AI-assisted X-ray 분석이 신속하고 일관된 preliminary screening을 제공하여 치료 시작 시점을 앞당길 수 있습니다.","blogAngle":["PaddleSeg 의미론적 분할로 흉부 영역 추출 정확도(mIoU) 0.8999 달성","정면(VD/DV) 투사 분류에서 정확도 90.35%, AUC 0.9438","측면 투사 분류에서 정확도 89.8%, AUC 0.9361","불확실성과 해석 가능성을 통합한 AI Risk Index(ARI) 모듈 개발"],"radar":{"owner":null,"clinical":"자 동물원에서 흉부 X- 판독 시 AI 보조 도구 활용을 고려하되, 다양한 환경에서의 전향적 검증이 충분치 않은 상태이므로 기존 판독 프로토콜을 유지하고 결과의 이중 확인을 병행할 것","evidence":{"design":"설계 불명확","n":"","stars":2,"note":"특정 데이터셋에서 개발·평가되어 다양한 동물병원 환경으로의 일반화에 주의 필요"}},"tag":""},{"id":"2026-07-20_35","day":"2026-07-20","ts":1784821002943,"cat":"research","kicker":"최신 연구","isToday":false,"title":"경미한 심근병증, 소변관 우회술 예후에 영향 없어","dek":"고양이의 경미한 심근병증은 피하 요관 우회술(SUB) 후 예후에 영향을 주지 않으며, 입원 당시 체액 과부하와 높은 혈청 크레아티닌 수치가 생존율을 예측하는 주요 인자로 확인되었습니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.20","read":"2분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag127","body":["본 연구는 2010~2022년 몬트리올 대학수의대학병원에서 SUBPlacement를 받은 94마리의 고양이를 대상으로 후향적으로 분석하였습니다. 64마리(68%)에서 심초음파를 시행하였으며, 그 중 26마리(40%)에서 심근병증이 진단되었습니다. 심근병증의 85%(22/26)는 비후성 또는 비후성 폐쇄성 심근병증이었고, 대부분(22/26)은 경미한 단계였으며 좌심방 크기(LA:AoSAX)가 정상(\u003c1.6)이었습니다.","심근병증이 있는 고양이와 없는 고양이 사이의 입원 기간, 생존 시간, 신장 회복 또는 체액 과부하 발생률에 유의한 차이는 없었습니다. 체액 과부하는 45%(29/64)에서 발생하였으며, 이는 중앙생존 기간 430일(40~1260일)로 1020일(494~1668일)에 비해 유의하게 짧았다(P=0.005). 입원 시 혈청 크레아티닌은 체액 과부하 그룹에서 평균 11.12±5.93mg/dL로 정상 그룹(6.16±5.44mg/dL)보다 높았고(P\u003c0.001), 나쁜 예후와 연관되었다(P=0.01). 좌심방 크기(LA:AoSAX)는 체액 과부하나 생존율과 연관되지 않았습니다.","경미한 심근병증은 흔한 동반 질환이었으나 SUB 시술의 금기 사항으로 고려되어서는 안 됩니다. 그러나 더 진행된 심장 질환의 영향은 여전히 알려지지 않았습니다. 임상적으로는 체액 과부하 발생 여부와 입원 시 크레아티닌 수치가 예후 예측에 더 중요한 지표가 되며, 특히 만성 신장 질환이 있는 고양이에서 심초음파 검사와 함께 체액 상태 모니터링이 필요합니다. 단일 기관 후향적 연구로 표본 크기에 한계가 있음을 고려해야 합니다."],"blog":"고양이 신장병과 심장병을 함께 않고 있는 보호자들에게, 경미한 심장 질환이 있어도 소변관 우회술이 가능한 경우를 설명하며 체액 관리의 중요성을 안내하는 글이 좋습니다.","blogAngle":["94마리 중 64마리에서 심초음파를 시행한 결과 40%(26/64)에서 심근병증이 확인되었고, 85%는 비후성 심근병증이었습니다","심근병증 유무에 따라 입원 기간, 생존 시간, 신장 회복에 유의한 차이 없어 경미한 심근병증은 SUB 시술 금기가 아니다","체액 과부하 발생 시 중앙생존 기간이 430일로 정상(1020일) 대비 유의하게 짧았다(P=0.005)","입원 시 혈청 크레아티민 수치가 높을수록(11.12mg/dL vs 6.16mg/dL) 예후가 나쁘며(P=0.01), 좌심방 크기는 예후와 무관하였습니다"],"radar":{"owner":null,"clinical":"SUB 시술 전 심초음파에서 경미한 심근병증이 발견되더라도 시술 금기로 고려하지 말고, 입원 시 체액 상태와 크레아티닌 수치를 예후 예측의 주요 지표로 모니터링할 것","evidence":{"design":"단일기관 후향적 연구","n":"고양이 94마리(심초음파 시행 64마리)","stars":2,"note":"단일 기관 후향적 연구로 표본 크기가 제한적이고 선택 편향이 있을 수 있어 일반화에 주의가 필요합니다"}},"tag":""}],"stories":[{"id":"2026-07-20_36","day":"2026-07-20","ts":1784312841000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"시애틀 떠든 너구리 '지모디', 희귀 척추 질환 가능성","dek":"시애틀에서 돌발 행보로 화제가 된 너구리 '지모디'의 특이한 움직임이 질병 때문일 수 있다는 수의사 의견이 나왔습니다.","source":"MyNorthwest.com","country":"","date":"07.18","read":"1분 읽기","plate":"MyNorthwest.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMidkFVX3lxTE9qdlFjckttbzJfeVlsTjRuU1ZWeXdqT1o2WVN2ckl3aDVjN0xIcC1oX0gxa0hJR2xXT2JnajM5MEZJRTdzY1I4RExnNDBpZEtySzU1MkdyZmdwYV83SERNc3pia29jdktBTm1qWjRxazV5NkdHTEE?oc=5","body":["시애틀 시민들에게 사랑받는 너구리 '지모디'가 최근 인터넷에서 화제가 됐습니다. 특이하게도 이 너구리는 두 발로 걸으며, 그 모습이 마치 인분을 서빙하는 것처럼 보여 많은 이들의 사랑을 받았습니다.해당 지역에서는 보기 드문 행동으로 주민들 사이에서 화제가 되고 있습니다."],"blog":"","blogAngle":[],"radar":null,"tag":"반전"},{"id":"2026-07-20_37","day":"2026-07-20","ts":1782370800000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"영국 요크셔수의들, 헤리오트 정신으로 Pop-up 진료소 열어","dek":"영국의 유명수의사 헤리오트의 유산이 현대 동물병원에 영감을 주었습니다.","source":"Vet Times","country":"","date":"06.25","read":"1분 읽기","plate":"Vet Times","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMixgFBVV95cUxPbERwRmtTeHpYVmJZXzJubGU2T0tNWHpqZmFTYTBvR2FZRWtZSk5LR2twblMzLXh6anZrT1gwT0lfeklfZDItZ01zMlFMNkZIcHU1SUlxNFptRElvRlM0OHBvUTdsQzFFM05qMGk4NjBTSHM1WVRRQS1Hc3hLdzF0aC1GWm1ldURaR1hHQTdzUV96X2hqX2tHZlhNV2NSN0FqNDc0M0JNbm1jZnlaWExMRDJGT2VsTFdzWlZ1aHlSbXBzVFhCVHc?oc=5","body":["영국 요크셔 지방수의 그룹이 헤리오트 선생님의 정신을 이어받는 Pop-up 진료소를 열었습니다. 영국의 대표적인수의사 작가인 헤리오트는 '모든 생명은 아름답다'라는 작품으로 전 세계 독자들의 사랑을 받았습니다. 이번 진료소는 그의 발자취를 따라 아이들부터 어른까지 동물 사랑을 전달하는 자리입니다.","헤리오트 선생님이 실제로 환자들을 돌보던 요크셔의 현장은 지금도 많은 이들의 꿈과 희망이 됩니다. 진료실 밖에서 보면 이렇게 그들의 발자취를 이어받는 이야기들이 곳곳에서 이어지고 있네요."],"blog":"","blogAngle":[],"radar":null,"tag":"훈훈"},{"id":"2026-07-20_38","day":"2026-07-20","ts":1782889200000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"미국 가구 절반 이상이 강아지·고양이 키운다","dek":"포브스 조사로 본 최신 반려동물 소유 추이","source":"Forbes","country":"","date":"07.01","read":"1분 읽기","plate":"Forbes","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiekFVX3lxTFBYekVOSlZSQmpNVnlFaG1yQm5vRWN0aXd4bmhGZG1YcXVDaEVLVVJabDdnZVNxS1RUd1l2NUlLTE9sTU9MMkhBLUN2WlFUMXVhSGRlWG5TRkZmSWZMckNkVFJEV080UVBVX1ZfbnhobHZ5elo0QTJPMVVn?oc=5","body":["포브스가 발표한 최신 통계에 따르면, 미국 가구 중 절반 이상에서 강아지나 고양이를 키우고 있다고 합니다. 전체 가구 대비 약 과반수가 이른바 '펫맘' '펫파'로 살아가고 있는 거죠. 이 수치는 지난 몇 년간 큰 변화 없이 이어져 오고 있습니다.","또한 돈을 쓰는 부분에서도 Interesting한 변화가 관찰된다고 합니다. 단순 사료에서 시작해 프리미엄 간식, 보험, 동물병원 진료비까지 점점 지출이 늘어나는 추세입니다. 진료실 밖에서 보면 이렇게나 많은 강아지·고양이가 가족으로 함께 사는 시대네요."],"blog":"","blogAngle":[],"radar":null,"tag":"훈훈"},{"id":"2026-07-20_39","day":"2026-07-20","ts":1782284400000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"애완견 다리 절름거림에 놀란 주인...수의사 방문 후 드러난 충격적 진실","dek":"평소 건강하던 강아지가 갑자기 다리를 절며 아파했다. 주인이 급히 동물병원을 찾았는데, 뜻밖의 원인이 드러나 모두를 놀라게 했다.","source":"tag24.com","country":"","date":"06.24","read":"1분 읽기","plate":"tag24.com","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMixgFBVV95cUxQYU43Y05mcE5zcW8yalZEVlRNMGlrVG9SMFlhNE1DMEJYS1ZQUFNxOHhfbE9yR05CSkEwNm9aenAtemowS3J0U1hHdUhOZV9Tc1J0bzJHTlpCSlpYVWk5MktUaF9kU2wtakZfMkl6NE5JWEk1V0hMLVBkR2FmTG1YbFM4cUdDZlhzTW0xVXdHN2lZQURSak94dUdiSk10eVBjcmtWQzZQRVFGZkJoVFJ6djdDSFg0cHFkRkotaXlGRUo1YWQ2LXc?oc=5","body":["어느 날 평소처럼 산책을 나가던 강아지가 갑자기 다리를 절며 발을 짚었다. 주인은 즉시 동물병원으로 급히 달려갔고, 수의사는 정밀 검사를 시작했다. 몇 가지 검사를 한 후 수의사의 표정이 잠시 굳어졌다.","결과를 들은 주인은 완전히 예상치 못한 사실에 할 말을 잃었다. 다리 통증의 원인이 단순한 부상이나 관절 문제가 아니라, 강아지가 자신의 발가락을 무심코 물어뜯어 생긴 상처였다는 것. 약간의 통증이 이렇게 큰 문제가 될 수 있다는 사실에 많은 사람들이 놀랐다. 진료를 받아 강아지는 빠르게 회복하고 있으며, 주인은 앞으로 더 주의 깊게 살펴달라는 말을 들었다."],"blog":"","blogAngle":[],"radar":null,"tag":"충격"},{"id":"2026-07-20_40","day":"2026-07-20","ts":1782370800000,"cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"중국의 '반려 동물 세대'가 들고 일어나다","dek":"애완동물 키우는 중국인 급증, 젊은 세대가 동물 권리 외침","source":"The New York Times","country":"","date":"06.25","read":"1분 읽기","plate":"The New York Times","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiiAFBVV95cUxQQWNFMGVpS2NBeHAzUHdGcElCYXEyMDFPQlZwZVEwMzkxdXdhcWVOS0ZtbjA5UE1HZWxLM3dfRzloSUVGbXBDUUdxQ1BKbkdROVhpWWkxalFLWlBmaG5FUGkxeTc1Y1FoY3RpZ21JbW54ZmpMTFZiQUswZlBueFNuVU1LeVlBdV9m?oc=5","body":["최근 중국에서 애완동물을 키우는 가정이 급격히 늘고 있습니다. 단순한 동반자를 넘어 하나의 가족 구성원으로 여기는 문화가 확산되면서, 동물 복지 문제가 사회적 화두로 떠올랐습니다. 특히 2030세대 젊은이들이 \"반려동물도 생명권이 있다\"고 주장하며 목소리를 높이고 있습니다.","영국 귀족층에서 유래한 '펫 맘' 문화가 중국 도시 젊은이들 사이에서 새로운 트렌드로 자리 잡았습니다. 유기동물 보호 활동, 동물학대 근절 캠페인 등이 활발해지면서 사회 전반에 동물에 대한 인식이 변화하고 있습니다. 진료를 기다리는 강아지만 바라봐도 Mong 같은 진정한 사랑이 느껴지네요."],"blog":"","blogAngle":[],"radar":null,"tag":"감동"}]}</script>

    + (r.clinical?'<div style="margin:0 0 12px;padding-left:12px;border-left:2px solid var(--color-primary-normal);font-size:13px;line-height:1.6;color:var(--color-label-neutral);max-width:62ch;"><b style="color:var(--color-primary-normal);font-weight:700;">진료 포인트</b> '+e(r.clinical)+'</div>':'')
    +'<div style="font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--color-label-alternative);">'+metaShort(a)+'</div></article>';

  function railCard(a){

    +'<h3 class="vm-hl" style="font-family:var(--font-display);font-size:21px;line-height:1.28;font-weight:700;letter-spacing:-.017em;margin:0 0 8px;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.title)+'</h3>'
    +'<p style="font-size:14px;line-height:1.6;color:var(--color-label-neutral);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;">'+e(a.dek)+'</p>'
    +'<div style="font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-label-alternative);">'+metaShort(a)+'</div></article>';
