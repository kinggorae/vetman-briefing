tion","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://pubmed.ncbi.nlm.nih.gov/42368698/","inLanguage":"ko"}},{"@type":"ListItem","position":28,"item":{"@type":"NewsArticle","headline":"개와 고양이 스마트폰 안저 영상 시스템 비교: OQVet 화질 최고","description":"스마트폰 기반 안저 영상 시스템 4종의 실현 가능성과 화질을 비교한 결과, OQVet이 가장 높은 화질 점수와 평가자 선호도를 기록하며 참고 카메라 대비 일부 검사에서 우위를 보였습니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_28","datePublished":"2026-07-23T15:36:49.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1111/vop.70210","inLanguage":"ko"}},{"@type":"ListItem","position":29,"item":{"@type":"NewsArticle","headline":"개의 만성 장염, 주인의 돌봄 부담감과 삶의 질에 미치는 영향","description":"개의 만성 장염 환양이 건강한 개를 키우는 환양보다 상당한 심리적 부담과 낮은 삶의 질을 경험하며, 특히 개 건강에 대한 우려가 가장 큰 부담원이라는 사실을 확인했습니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_29","datePublished":"2026-07-23T15:36:48.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1093/jvimsj/aalag128","inLanguage":"ko"}},{"@type":"ListItem","position":30,"item":{"@type":"NewsArticle","headline":"보더테리어의 식이 반응성 전신 호산구증가 1례","description":"재발성 복통과 현저한 호산구증가를 보이는 보더테리어에서 글루텐 무함유 가수분해 식이만으로 치료에 성공한 사례를 보고합니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_30","datePublished":"2026-07-23T15:36:47.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1093/jvimsj/aalag133","inLanguage":"ko"}},{"@type":"ListItem","position":31,"item":{"@type":"NewsArticle","headline":"개 췌장 초음파 검사, 관찰자 간 결과 차이 커","description":"104명의 수의학 전문의가 개 췌장 초음파 영상을 분석한 결과, 관찰자 간 일치도가 낮아 초음파 판독의 주관성이 문제임이 확인되었습니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_31","datePublished":"2026-07-23T15:36:46.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1111/vru.70202","inLanguage":"ko"}},{"@type":"ListItem","position":32,"item":{"@type":"NewsArticle","headline":"강아지·고양이 기생충, 진화하는 위협을 대비하라","description":"기후변화와 글로벌 이동 증가로 강아지·고양이 기생충의 분포와 특성이 급변하고 있으며, 새로운 병원체 출현과 내성 획득이 가속화되고 있음을 보고합니다. 이 변화에 대응하려면 수의학과 보건학의 긴밀한 협력과 진단 역량 강화가 필수적입니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_32","datePublished":"2026-07-23T15:36:45.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1016/j.pt.2026.05.007","inLanguage":"ko"}},{"@type":"ListItem","position":33,"item":{"@type":"NewsArticle","headline":"저장용 MRI, 개 뇌 영상에서 기존 1.5T와 유사한 해부학적 시각화 가능","description":"0.05T 저장용 MRI가 개의 뇌 영상에서 측방 뇌실 등 주요 해부학적 구조를 기존 1.5T MRI와 유사하게 시각화할 수 있음을 확인했습니다. 저장된 환경에서도 접근 가능한 뇌영상 검사로 자원 제한 지역 수의임상에 활용될 수 있는 가능성을 제시한 최초의 수의학 연구입니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_33","datePublished":"2026-07-23T15:36:44.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1080/01652176.2026.2696026","inLanguage":"ko"}},{"@type":"ListItem","position":34,"item":{"@type":"NewsArticle","headline":"개·고양이 흉부 X-ray에서 인공지능으로 폐렴 진단하기","description":"이 연구는 개와 고양이의 흉부 X-ray에서 딥러닝 모델로 폐렴을 자동 진단하는 파이프라인을 개발했습니다. 정면 및 측면 투사 모두에서 90% 이상의 정확도와 0.94 이상의 AUC를 달성하여 임상 활용 가능성을 보여주었습니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_34","datePublished":"2026-07-23T15:36:43.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1111/vru.70170","inLanguage":"ko"}},{"@type":"ListItem","position":35,"item":{"@type":"NewsArticle","headline":"경미한 심근병증, 소변관 우회술 예후에 영향 없어","description":"고양이의 경미한 심근병증은 피하 요관 우회술(SUB) 후 예후에 영향을 주지 않으며, 입원 당시 체액 과부하와 높은 혈청 크레아티닌 수치가 생존율을 예측하는 주요 인자로 확인되었습니다.","url":"https://news.vetmanlab.com/issues/2026-07-20#2026-07-20_35","datePublished":"2026-07-23T15:36:42.943Z","publisher":{"@type":"Organization","name":"베트맨랩","alternateName":"VetManLab","url":"https://news.vetmanlab.com"},"isBasedOn":"https://doi.org/10.1093/jvimsj/aalag127","inLanguage":"ko"}}]}</script>

<h1>베트맨랩 VetMan 해외 브리핑 — 2026-07-20</h1>
<p>베트맨랩(VetManLab)이 만드는, 한국 동물병원을 위한 해외 수의 임상·연구·업계 브리핑입니다.</p>
<ul style="list-style:none;padding:0;"><li style="margin-bottom:16px;"><a href="/article/2026-07-20_1-고령-동물-관절염-통증-약물비약물-복합-관리의-실제"><b>고령 동물 관절염 통증, 약물+비약물 복합 관리의 실제</b></a>
<div>강아지 5마리 중 1마리, 고양이 10세 이상 60~90%에서 발생하는 관절염. 완치가 어려운 고령 환자에서 기능과 삶의 질을 유지하는 완화 통증 관리의 실제를 알아봅니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_2-가바펜틴트라조돈-말고-진정-프로토콜이-안-먹힐-때"><b>가바펜틴·트라조돈 말고: 진정 프로토콜이 안 먹힐 때</b></a>
<div>수UCC 행동학 전문의가 불안 동반 동물 진정제 선택지와 주의점을 공개합니다. 기존 약물이 효과가 없을 때 대안적 약물과 올바른 용량 조절 방법을 알아봅니다.</div>
<small>임상 · Dr. Andy Roark · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_3-중고도-공포불안-강아지의-수의과-진료실-대처법"><b>중고도 공포·불안 강아지의 수의과 진료실 대처법</b></a>
<div>수의과 방문 시 중고도 수준의 공포, 불안, 스트레스를 보이는 강아지에 대한 핸들링 기술을 소개합니다. 강제 처치가 트라우마를 악화시킬 수 있어 의료·환경·행동 치료의 조합이 필수적입니다.</div>
<small>임상 · VetGirl · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_4-고양이-당뇨병-관리의-새로운-선택지-SGLT2-억제제"><b>고양이 당뇨병 관리의 새로운 선택지, SGLT2 억제제</b></a>
<div>수의학에서 당뇨병 관리 방법이 빠르게 진화하고 있습니다. 특히 고양이에서 SGLT2 억제제 기반 복합요법이 기존 인슐린 치료 대안으로 주목받고 있습니다.</div>
<small>임상 · VetGirl · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_5-개의-관절염-치료적-운동으로-관절-가동성과-근육량-개선"><b>개의 관절염, 치료적 운동으로 관절 가동성과 근육량 개선</b></a>
<div>최근 임상 연구에서 구조화된 치료적 운동이 관절염 환 개의 관절 가동성과 근육량을 유의미하게 개선한다는 객관적 증거가 제시되었습니다. 이는 통증 관리 약물과 함께 재활 치료를 표준 치료 구성요소로 권고해야 할 근거가 됩니다.</div>
<small>임상 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_6-애완동물-병원-방문-시-AI가-실제로-하는-일-AVMA-회장-인터뷰"><b>애완동물 병원 방문 시 AI가 실제로 하는 일 — AVMA 회장 인터뷰</b></a>
<div>미국수의사회(AVMA) 회장이 애완동물 진료실에서 인공지능이 실제로 어떻게 활용되고 있는지 밝혔습니다. 진단 지원에서 환자 관리까지 AI의 현재 역할과 한계를 분석합니다.</div>
<small>업계 · Yahoo Creators</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_7-수의-진료에서-수술-후-호흡-억제-및-폐합병증-문헌-고찰"><b>수의 진료에서 수술 후 호흡 억제 및 폐합병증: 문헌 고찰</b></a>
<div>개의와 고양이에서 수술 후 발생할 수 있는 호흡 억제와 폐합병증의 위험 요인과 관리 전략을 최신 문헌을 통해 정리했습니다. 마취에서 회복되는 과정에서 이러한 합병증이 생명을 위협할 수 있어 수의 임상에서 주의가 필요합니다.</div>
<small>임상 · Cureus</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_8-개에서-쿼럼-센싱-조절제-세균-신호-차단을-통한-장-건강-관리"><b>개에서 쿼럼 센싱 조절제: 세균 신호 차단을 통한 장 건강 관리</b></a>
<div>항생제 내성이 심각해지는 가운데, 세균을 죽이지 않고 세균 간 신호를 차단하는 새로운 접근법인 쿼럼 센싱 조절제가 개의 장 건강과 회복력 향상에 주목받고 있습니다.</div>
<small>임상 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_9-노령개-인지기능장애-영양보충제로-관리한다"><b>노령개 인지기능장애, 영양보충제로 관리한다</b></a>
<div>수의학 발전으로 개 수명이 늘어나면서 인지기능장애 증후군(CDS) 진단이 증가하고 있습니다. 본 기사는 노령개 뇌건강 관리를 위한 근거 중심의 영양보충제를 소개합니다.</div>
<small>임상 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_10-개-microbiome-조절로-항생제-의존도-낮추기"><b>개 microbiome 조절로 항생제 의존도 낮추기</b></a>
<div>항생제 내성(AMR) 문제가 심화되면서 수의학에서도 항생제 대신 microbiome 조절을 통해 만성 질환을 관리하려는 연구가 활발해지고 있습니다. 특히 개에서 프로바이오틱스·프리바이오틱스 활용이 항생제 사용을 줄일 수 있는 유망한 대안으로 주목받고 있습니다.</div>
<small>임상 · IVC Journal · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_11-노령견-전지-보폭-감소-치매-조기-경고-신호-가능성"><b>노령견 전지 보폭 감소, 치매 조기 경고 신호 가능성</b></a>
<div>미국 연구팀이 노령견의 전지 보폭이 인지 기능 저하와 연관되어 있음을 확인했습니다. 이는 개 치매의 조기 발견 도구로 보폭 측정을 활용할 수 있음을 시사합니다.</div>
<small>임상 · Vet Practice Magazine · 호주</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_12-동물-의학에서-DNA-기반-기생충-검사-도입-확대"><b>동물 의학에서 DNA 기반 기생충 검사 도입 확대</b></a>
<div>영국에서 PCR 기술을 활용한 동물 기생충 검사가 기존의 현미경 검사를 대체하며 정확도를 높이고 있습니다. 수의학계에서는 이러한 분자진단법의 도입이 임상 현장에 어떤 변화를 가져올지 논의하고 있습니다.</div>
<small>임상 · Veterinary Record · 영국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_13-푸르듀-수의대-수의사-부족-해결-위한-확장-계획-발표"><b>푸르듀 수의대, 수의사 부족 해결 위한 확장 계획 발표</b></a>
<div>미국 인디애나주 푸르듀 대학 수의대가 심각한 수의사 부족 현상에 대응해 캠퍼스 확장을 추진합니다. 지역사회 동물 의료 접근성 향상이 핵심 목표다.</div>
<small>병원 경영 · Indiana Public Media</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_14-반려동물-비만-치료제-개발-진행-중-하반기-출시-예정"><b>반려동물 비만 치료제 개발 진행 중, 하반기 출시 예정</b></a>
<div>미국에서 애완동물 전용 비만 치료제가 하반기 출시를 목표로 개발 중입니다. 강아지와 고양이의 비만이 심각해지면서 동물 의학계와 반려동물 사육자들의 관심이 집중되고 있습니다.</div>
<small>임상 · CNBC</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_15-야생동물부터-애완동물까지-신뢰-기반-의료의-공통-원칙"><b>야생동물부터 애완동물까지, 신뢰 기반 의료의 공통 원칙</b></a>
<div>미국 동물병원협회(AVMA) 총회에서 디즈니 동물전문수의와 AVMA 회장이 함께 신뢰 구축, 환경 자극(enrichment), 긍정적 강화가 동물의 두려움과 스트레스를 줄이는 방법을 논의했습니다.</div>
<small>임상 · Veterinary Practice News · 미국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_16-반려동물-Enrichment의-모든-것-5가지-범주로-이해하는-동물-복지"><b>반려동물 Enrichment의 모든 것: 5가지 범주로 이해하는 동물 복지</b></a>
<div>lockdown 경험이 우리에게 보여준 것—안전과 만족은 같지 않다는 점. Katie Hank수의사는 많은 문제 행동이 단순한 행동 문제가 아니라 심리적·환경적 욕구 미충족의 증상이라고 주장합니다.</div>
<small>보호자 소통 · Vet Practice Magazine · 호주</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_17-수의학-영역-항생제-적정-사용-가이드라인-업데이트"><b>수의학 영역 항생제 적정 사용 가이드라인 업데이트</b></a>
<div>영국 수의계가 동물 진료에서의 항생제 사용 지침을 전면 개정했습니다. 인수공통감염균 증가로 항생제 내성 문제가 심각해지면서, 수의사들의 처방 관행 변화가 요구되고 있습니다.</div>
<small>임상 · Veterinary Record · 영국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_18-개-관절염-약물-다조콕스-수술-전-진통제로-영국서-신규-허가"><b>개 관절염 약물 다조콕스, 수술 전 진통제로 영국서 신규 허가</b></a>
<div>유럽의학청(EMA)이 개의 관절염 치료약 다조콕스(daxocox)의 수술 전(perioperative) 사용을 추가로 승인했습니다. 기존에 관절염 치료제로만 사용되던 약물이 수술 환경에서도 활용 가능해졌습니다.</div>
<small>임상 · Veterinary Record · 영국</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_19-반려동물-보험-수의사가-말하는-가입-전-필수-체크포인트"><b>반려동물 보험, 수의사가 말하는 가입 전 필수 체크포인트</b></a>
<div>미국 수의사가 반려동물 보험의 실체와 가입 전 반드시 고려해야 할 핵심 포인트를 설명했습니다. 보험 선택이 진료 현장에서 어떤 문제를 일으키는지 확인해 봅니다.</div>
<small>보호자 소통 · Yahoo Creators</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_20-개-벼룩진드기-예방-사계절이-중요"><b>개 벼룩·진드기 예방, 사계절이 중요</b></a>
<div>수의사들이 가정에서 키우는 개에 대해 일 년 내내 벼룩과 진드기 예방을 실천할 것을 권고합니다. 겨울철에도 실내 온도가 따뜻해지면서 해충이 생존할 수 있어 계절에 관계없는 예방이 필요합니다.</div>
<small>임상 · MSN</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_21-고양이-요로결석의-비수술적-파쇄-치료-가능성"><b>고양이 요로결석의 비수술적 파쇄 치료 가능성</b></a>
<div>초음파 유도 버스트 파동쇄석술이 고양이의 폐쇄성 요로결석 치료에 안전하고 효과적임을 확인했습니다. 기존 수술적 치료 옵션이 제한적인 상황에서 새로운 최소 침습적 대안이 될 수 있습니다.</div>
<small>최신 연구 · Journal of veterinary internal medicine</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_22-수의대병원-개-피부염-다제내성균-유병률-연구"><b>수의대병원 개 피부염 다제내성균 유병률 연구</b></a>
<div>2021~2024년 3년여간 416마리의 개에서 채취한 배양 검체를 분석한 결과, 전체 검체의 42%에서 다제내성균이 검출되었습니다. 이 연구는 동물병원 내 다제내성균 감시와 항균제 관리의 중요성을 뒷받침합니다.</div>
<small>최신 연구 · Journal of the American Animal Hospital…</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_23-고양이-전염성-복막염-치료용-GS441524-경구현탁액-개발-및-물리화학"><b>고양이 전염성 복막염 치료용 GS-441524 경구현탁액 개발 및 물리화학적 안정성 평가</b></a>
<div>고양이 전염성 복막염 치료 핵심 약물인 GS-441524의 50 mg/mL 경구현탁액을 개발하고 다양한 온도조건에서 12주간 안정성을 평가했습니다.</div>
<small>최신 연구 · Veterinary medicine and science</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_24-안면구조가-짧은-개와-고양이에서-흔한-눈-질환-종합-분석"><b>안면구조가 짧은 개와 고양이에서 흔한 눈 질환, 종합 분석</b></a>
<div>터키 한 대학 수의학대학에서 안면구조가 짧은 개 10마리와 고양이 30마리의 눈 건강을 조사한 결과, 종에 따라 다른 눈 질환이 흔함을 확인하고 정기적 안과 검사의 필요성을 제시했습니다.</div>
<small>최신 연구 · Canadian journal of veterinary research</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_25-수의학에서-박테리오신의-항생제-대안-가능성-검토"><b>수의학에서 박테리오신의 항생제 대안 가능성 검토</b></a>
<div>본 검토는 수의학 분야의 박테리오신 연구에서 박테리오신이 기존 항생제의 대안으로 활용될 수 있는지를 검토하고, 임상 적용을 위한 전환 장벽을 분석했습니다.</div>
<small>최신 연구 · International journal of molecular scien…</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_26-개의-폐활성-담낭염-35례-임상-양상과-치료-결과"><b>개의 폐활성 담낭염 35례: 임상 양상과 치료 결과</b></a>
<div>개의 희귀하고 심각한 담낭염인 폐활성 담낭염의 임상 양상과 예후를 후향적으로 분석하여 치료 전략 수립에 필요한 근거를 제시했습니다.</div>
<small>최신 연구 · Journal of veterinary internal medicine</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_27-개-에틸렌글리콜-중독에서-Lactate-Gap의-진단치료-종결-지표-활용"><b>개 에틸렌글리콜 중독에서 Lactate Gap의 진단·치료 종결 지표 활용</b></a>
<div>개 에틸렌글리콜 중독 의심 환자에서 서로 다른 분석기 간 lactate 측정값의 불일치(lactate gap)를 진단 도구와 간헐적 혈액투석 종료 시점 결정에 활용할 수 있음을 보고합니다.</div>
<small>최신 연구 · The Canadian veterinary journal</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_28-개와-고양이-스마트폰-안저-영상-시스템-비교-OQVet-화질-최고"><b>개와 고양이 스마트폰 안저 영상 시스템 비교: OQVet 화질 최고</b></a>
<div>스마트폰 기반 안저 영상 시스템 4종의 실현 가능성과 화질을 비교한 결과, OQVet이 가장 높은 화질 점수와 평가자 선호도를 기록하며 참고 카메라 대비 일부 검사에서 우위를 보였습니다.</div>
<small>최신 연구 · Veterinary ophthalmology</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_29-개의-만성-장염-주인의-돌봄-부담감과-삶의-질에-미치는-영향"><b>개의 만성 장염, 주인의 돌봄 부담감과 삶의 질에 미치는 영향</b></a>
<div>개의 만성 장염 환양이 건강한 개를 키우는 환양보다 상당한 심리적 부담과 낮은 삶의 질을 경험하며, 특히 개 건강에 대한 우려가 가장 큰 부담원이라는 사실을 확인했습니다.</div>
<small>최신 연구 · Journal of veterinary internal medicine</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_30-보더테리어의-식이-반응성-전신-호산구증가-1례"><b>보더테리어의 식이 반응성 전신 호산구증가 1례</b></a>
<div>재발성 복통과 현저한 호산구증가를 보이는 보더테리어에서 글루텐 무함유 가수분해 식이만으로 치료에 성공한 사례를 보고합니다.</div>
<small>최신 연구 · Journal of veterinary internal medicine</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_31-개-췌장-초음파-검사-관찰자-간-결과-차이-커"><b>개 췌장 초음파 검사, 관찰자 간 결과 차이 커</b></a>
<div>104명의 수의학 전문의가 개 췌장 초음파 영상을 분석한 결과, 관찰자 간 일치도가 낮아 초음파 판독의 주관성이 문제임이 확인되었습니다.</div>
<small>최신 연구 · Veterinary radiology &amp; ultrasound</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_32-강아지고양이-기생충-진화하는-위협을-대비하라"><b>강아지·고양이 기생충, 진화하는 위협을 대비하라</b></a>
<div>기후변화와 글로벌 이동 증가로 강아지·고양이 기생충의 분포와 특성이 급변하고 있으며, 새로운 병원체 출현과 내성 획득이 가속화되고 있음을 보고합니다. 이 변화에 대응하려면 수의학과 보건학의 긴밀한 협력과 진단 역량 강화가 필수적입니다.</div>
<small>최신 연구 · Trends in parasitology</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_33-저장용-MRI-개-뇌-영상에서-기존-15T와-유사한-해부학적-시각화-가능"><b>저장용 MRI, 개 뇌 영상에서 기존 1.5T와 유사한 해부학적 시각화 가능</b></a>
<div>0.05T 저장용 MRI가 개의 뇌 영상에서 측방 뇌실 등 주요 해부학적 구조를 기존 1.5T MRI와 유사하게 시각화할 수 있음을 확인했습니다. 저장된 환경에서도 접근 가능한 뇌영상 검사로 자원 제한 지역 수의임상에 활용될 수 있는 가능성을 제시한 최초의 수의학 연구입니다.</div>
<small>최신 연구 · The veterinary quarterly</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_34-개고양이-흉부-Xray에서-인공지능으로-폐렴-진단하기"><b>개·고양이 흉부 X-ray에서 인공지능으로 폐렴 진단하기</b></a>
<div>이 연구는 개와 고양이의 흉부 X-ray에서 딥러닝 모델로 폐렴을 자동 진단하는 파이프라인을 개발했습니다. 정면 및 측면 투사 모두에서 90% 이상의 정확도와 0.94 이상의 AUC를 달성하여 임상 활용 가능성을 보여주었습니다.</div>
<small>최신 연구 · Veterinary radiology &amp; ultrasound</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-20_35-경미한-심근병증-소변관-우회술-예후에-영향-없어"><b>경미한 심근병증, 소변관 우회술 예후에 영향 없어</b></a>
<div>고양이의 경미한 심근병증은 피하 요관 우회술(SUB) 후 예후에 영향을 주지 않으며, 입원 당시 체액 과부하와 높은 혈청 크레아티닌 수치가 생존율을 예측하는 주요 인자로 확인되었습니다.</div>
