<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의 AI 필기 도구, 사용법과 한계 살펴보기</h2><p><b>수의계에서 도입이 확산되는 AI 필기 도구의 활용 원칙과 주의사항, 그리고 신입 수의사를 위한 멘토링 문화의 중요성에 대한 전문가의 조언을 정리했다.</b></p>
<p>AI 필기 도구는 exam room 대화를 수초 만에 깔끔한 진료 기록으로 정리해 주는 유용한 도구다. 그러나 이 도구는 초안 작성 도구일 뿐이며, 최종적으로|name은 Veterinarian의 이름이 기록에 남는다는 점을 명심해야 한다. 약물 이름, 용량, 농도, 투여 경로, 숫자, 그리고 어느 발, 귀, 눈인지 같은 세부 사항에서 AI가 실수를 저지를 수 있으며, 이를 확인하지 않으면 환자에게 해를 끼칠 수 있다.</p><p>도구를 사용하기 전에 해당 서비스가 어떤 데이터를 기록·저장·삭제·공유하는지, 그리고 학습 데이터로 활용하는지 반드시 확인해야 한다. 또한 현재 거주 지역의 녹음 및 동의 관련 법규를 점검하고, 클라이언트에게 &quot;AI 도구를 사용하며 진료 후 직접 확인한다&quot;는 점을 명확히 안내해야 한다. 대부분의 클라이언트는 공개적으로 안내받으면 이를 이해하지만, 반대할 경우 다른 방법으로 기록을 작성해야 한다.</p><p>신입 수의사들이 멘토링, 솔직한 피드백, 지속 가능한 일정을 요청하는 것은 &quot;나약함&quot;이 아니라 &quot;profession을 오래 유지하기 위한 최소한의 요구&quot;다. 많은 수의사들이 &quot;빠져들어가서 헤쳐나가라&quot;는 방식으로 훈련 받았고, 이로 인해 유능한 인력이 떠나는 현상이 나타났다. 공식 프로그램이 없어도 하루 15분간의 케이스 리뷰만으로도 충분한 멘토링이 되므로, 일정을 요청하고 솔직한 피드백을 요청하는 것이 중요하다.</p>

<h2>동물병원 채용 실패 루프를 끊는 9가지 HR 도구</h2><p><b>채용 반응형으로 대응하다 보면 성과 없는 루프에 갇히기 쉽습니다. 미국 전문 미디어에서는 동물병원이 반드시 갖춰야 할 HR 도구 9가지를 제시했습니다.</b></p>
<p>동물병원 채용에서 가장 흔한 패턴은 누군가 사직하면 급히 채용광고를내고 &quot;경험이 있다&quot;는 이유만으로 빠르게 채용하는 것입니다. 하지만 6개월 만에 성과 미달, 의욕 상실, 퇴직으로 이어지는 이 사이클은 비용도 크지만 팀의 사기 와 생산성에도 큰 타격을 줍니다. 좋은 인력을 확보하려면 채용을 행정 노동이 아닌 시스템으로 접근해야 합니다.</p><p>핵심 HR 도구로는 직무 기술서, 인사 정책 매뉴얼, 표준화된 지원서와 면접 질문, 사전 정의된 급여 범위, 채용 예산, 구조화된 온보딩, 사명 이해 오리엔테이션, 체계적인 교육 시스템이 있습니다. 특히 처음 90일이 중요하며, &quot;사물함 here's your locker&quot;식 온보딩은 그저 즉흥입니다. 교육을 &quot;경험이 있으면 필요 없다&quot;는 assumption도 위험합니다. 모든 병원은 업무 방식이 다르기 때문에 문서화된 교육 시스템이 필수이며, 이는 경력 개발로 이어지는 평생 학습입니다.</p><p>한국 동물병원에서도 같은 문제가 반복되고 있습니다. 채용 절차가 미흡하면 팀 문화가 흔들리고, 명확한 급여 기준이 없으면 신규 채용자가 기존 직원보다 많은 급여를 받는 역차별 문제가 생깁니다. 인건비가 수익에 미치는 영향을 생각하면 채용 예산 수립도 필수입니다. 체계적인 HR 시스템은 실패적인 채용 루프를 끊고 지속 가능한 성장을 위한 토대가 됩니다.</p>
<p>원문: <a href="https://todaysveterinarybusiness.com/9-hr-tools-every-veterinary-practice-needs/" rel="nofollow">Today's Veterinary Business</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의사 영양 상담, 실제로 얼마나 이루어질까</h2><p><b>최근 연구에서 수의사 진료 중 영양 상담이 포함된 비율이 단 16%에 불과한 것으로 나타났다. 561명의 수의사를 대상으로 한 설문조사로 barriers와 solutions을 분석한 이 연구는 한국 동물병원에도 시사하는 바가 크다.</b></p>
<p>연구에 따르면 이전 연구들에서도 진료 중 영양 상담 비율이 낮게 측정되었으며, 특히 사육자 중 25%가 수의사 스태프와 영양에 대해 한번도 논의한 적이 없다고 응답했다. 미 Virginia-Maryland College of Veterinary Medicine의 Megan Shepherd 연구자는 소동물 수의사 561명을 대상으로 영양 상담의 빈도, 수의사의 자신감, 그리고 장벽과 해결책을 파악하기 위한 익명 설문조사를 실시했다.</p><p>연구 결과 가장 큰 장벽은 사육자들의 다양한 목표와 기대, 그리고 수의사 자신의 경험에 따른 편향인 것으로 나타났다. Shepherd 연구자는 사육자의 목표(예: 관절 건강, 수명 연장 등)를 파악한 후 신체 Condition 점수와 연계하여 설명하는 것을 권장하며, '당신의 목표를 위해서는 건강한 체중 유지가 중요하다'라는 메시지가 효과적이라고 조언했다. 또한 영양은 팀 스포츠로서 수의사 technician과 지원 Staff도 상담 과정에 참여할 수 있으며, 무료로 제공되는 Mark Morris Institute와 BalanceIT 같은 영양 데이터베이스를 활용할 수 있다.</p><p>한국 동물병원 관점에서 보면, 이 연구는 영양 상담의 중요성과 구체적인 실천 방식을 보여준다. 상담 시 사육자의 목표를 먼저 파악하고, 동물의 현재 식이 상태를 평가한 후 근거에 기반한 권장을 하는 것이 핵심이다. technician이 영양 이력을 검토하고 상담을 시작하거나 주도할 수 있으며, 문서 자료를 함께 제공하면 사육자의 이해도를 높일 수 있다. 영양 상담은 동물 건강 향상뿐 아니라 사육자 신뢰 구축의 좋은 기회가 될 수 있다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/personal-professional-development/breaking-the-barriers-to-positive-in-clinic-nutrition-conversations/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>동물병원 소프트웨어 감사, 90분 안에 자가 점검하는 법</h2><p><b>동물병원 소프트웨어 전문가가 제안한 90분 감사 방법. 중복 구독과 수동 데이터 입력으로 숨겨지는 비용을 파악하고 연간 구독비를 최적화할 수 있다.</b></p>
<p>대부분의 동물병원들은 소프트웨어를 체계적으로 감시한 적이 없습니다. 병원 관리 소프트웨어가 처음 도입되고, 그다음 고객 커뮤니케이션 도구, 결제 플랫폼, 온라인 약국, 예약 시스템, 검사실 통합, 리뷰 서비스, 그리고 최근에는 AI 기록 자동화 도구까지 하나씩 쌓입니다. 각 결정은 그때그때 합리적으로 보였지만, 결과적으로 8~10개의 별도 도구를 사용하게 됩니다. 이 비용은 대부분 보이지 않습니다. 매달 청구되는 금액이 충분히 작아 누구도 의심하지 않고, 활성화하지 않은 모듈에 대한 비용, 그리고 도구 간 데이터를 수동으로 이동하는 데 걸리는 직원 시간이 대표적인 예입니다. 많은 병원에서는 통합 레이어가 소프트웨어가 아니라 사람, 주로 병원 관리자이며 이 작업은 어떤 청구서에도 나타나지 않습니다.</p><p>90분 감사 방법은 4단계로 진행됩니다. 첫 번째, 모든 소프트웨어 목록을 작성하고 실제 청구서를 확인하며 팀이 사용하는 무료 도구도 포함시킵니다. 두 번째, 같은 기능을 하는 도구를 찾아 중복을 확인합니다. 예를 들어 PIMS와 별도 플랫폼에서 중복으로 알림을 보내거나, 두 개의 결제 프로세서를 사용하는 경우가 있습니다. 세 번째, 수동으로 데이터를 입력해야 하는 틈을 파악합니다. 예약 도구와 PIMS에 같은 정보를 두 번 입력하거나, 검사 결과를 수동으로 인쇄하고 붙이는 작업이 대표적인 예입니다. 이 비용은 절대 청구서에 반영되지 않으며 직원 시간과 실수, 번아웃으로 이어집니다. 네 번째, 실제 비용을 확인한 후 3~5가지 항목만 선택해 담당자와 기한을 정해 실행합니다. 마지막으로 모든 갱신 날짜를 공유 캘린더에 60~90일 전에 알림을 설정해두어야 합니다.</p><p>한국 동물병원들도 유사한 상황에 처해 있습니다. 국내 동물병원 관리 소프트웨어들도 다양한 기능을 제공하지만, 실제 사용 중인 기능과 미사용 기능의 차이를 파악하기 어려운 경우가 많습니다. 중복 구독과 수동 데이터 입력으로 인한 숨겨진 비용은 한국 병원에서도 분명히 존재할 것입니다. 특히 국내 소프트웨어 특성상 월정액 구독제가 일반적이고, 갱신 시점 놓치면 자동 연장되는 구조가 많으므로 이 감사 방법이 더욱 중요합니다. 이 기사를 참고해 병원 소프트웨어 목록을 한 번 점검해보면 연간 구독비를 상당한 금액 절감할 수 있을 것입니다.</p>

<h2>24시간 동물병원 개축 시 임상 운영 연속성 유지 사례</h2><p><b>미국 사우스캐롤라이나 소재 24시간 동물병원 CHARLESTON VETERINARY REFERRAL CENTER가 16개월간 기존 시설을 그대로 운영하면서 3만2700제곱피트 규모의 확장을 완료한 사례를 소개합니다.</b></p>
<p>미국에서 전문 및 응급 동물의료에 대한 수요가 증가하면서 많은 병원들이 이전이 아닌 기존 시설 확장을 선택하고 있습니다. 그러나 임상 운영을 중단하지 않으면서 건설을 진행하려면 기존 방식과 근본적으로 다른 접근이 필요합니다. 해당 병원은 연간 약 2만6000명의 환자를 치료하며, 외과, 진단, 치료 공간에 대한 중단 없는 접근이 필수적입니다.</p><p>이 프로젝트의 핵심 과제는 기존 시설 내에 있던 6개의 수술실 전체를 운영하면서 증축 공사를 진행하는 것이었습니다. 프로젝트 팀은 수술실 2개를 우선 완성하여 전환이 가능하도록 순서화를 조정했고, 이로 인해 최소 2개의 완전한 수술실이 항상 사용 가능한 상태를 유지했습니다. 동시에 활성 외과 수술실과 인접한 구역에서는 임시 배리어와 음압 시스템을 통해 먼지·오염 물질이 임상 공간으로 확산되지 않도록 감염 관리 프로토콜을 엄격히 시행했습니다. CT 영상 서비스의 경우 임시 이동식 CT 스캐너를 배치하고 영구 CT실 건설 시간을 기존 3개월에서 약 1개월로 단축하여 주당 12~16건의 CT 검사가 지속될 수 있었습니다.</p><p>한국 동물병원에서도 개축이나 리노베이션 시 임상 운영 연속성 유지가 중요한 과제입니다. 소규모 병원이라도 수술실이나 영상 진단 장비를 잠시이라도 중단하면 환자 흐름에 차질이 발생할 수 있습니다. 임시 시설 활용, 건설 구간 세분화, 인력 스케줄 조정 등 이 사례의 접근법은 한국 병원에서도 참고할 만한 전략입니다. 특히 응급 및 전문 동물병원은 환자 특성상 진료 중단이 곧 환자 결과에 직접적인 영향을 미칠 수 있어, 개축 전 초기 단계에서의 운영 기반 사정과 시스템 통합 계획이 필수적입니다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/maintaining-continuity-during-renovation/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개방형 API가 동물 병원 소프트웨어의 미래를 바꾼다</h2><p><b>동물 병원 관리 프로그램(PIMS) 업계가 폐쇄적 시스템에서 벗어나 개방형 API를 표준으로 삼아야 한다는 주장이 제기되고 있다. 이는 환자 진료 품질과 병원 운영 효율성에 직접적인 영향을 미치는 문제다.</b></p>
<p>현재 많은 동물 병원 관리 프로그램은 특정 제조사 제품만 연동 가능한 폐쇄적인 시스템을 채택하고 있어, 동물 병원들이 원하는 도구를 자유롭게 선택하지 못하고 있다. 호텔업과 의료계 등 다른 산업에서는 이미 개방형 API를 통해 다양한 도구들을 원활하게 연결하여 운영 효율성을 높이고 비용을 절감하고 있다.</p><p>폐쇄적인 API 구조는 스타트업의 혁신을 가로막고, 동물 병원들이 선호하는 도구(원격 진료, 재고 관리, AI 필기 도구 등)와의 통합을 어렵게 만들어 수동 데이터 입력과 중복 기록이라는 비효율을 초래한다. 이를 극복하려면 PIMS 공급업체들이 데이터 주위를 둘러싼 ‘벽’을 낮추고 안전한 개방형 API를 제공해야 한다.</p><p>한국 동물 병원들도 관리 프로그램 선택 시 연동 가능성을 확인하고, 원격 진료나 AI 진단 도구 등 다양한 기술 도입을 위해서는 반드시 API 개방성이 필수적임을 인식해야 한다. 현재 국내 시장에 다양한 동물 병원용 소프트웨어가 도입되는 만큼, 각 소프트웨어 간 연동성 확보가 향후 병원 경쟁력의 핵심이 될 것이다.</p>
<p>원문: <a href="https://todaysveterinarybusiness.com/why-veterinary-software-should-embrace-open-apis/" rel="nofollow">Today's Veterinary Business</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>동물병원 수익성 강화 위한 4가지 핵심 KPI 관리법</h2><p><b>미국 동물병원 매출 증가율이 CPI 인플레이션률보다 낮은 반면 인건비와 물류비용은 빠르게 상승하고 있습니다. 신규 고객 수, 환자 방문 수, 의사 진료 건수, 평균 진료비를 체계적으로 측정하고 관리해야 수익성 향상이 가능하다는 전문가 분석입니다.</b></p>
<p>최근 2년간 동물병원 매출 증가율이 소비자물가지수(CPI) 상승률을 밑돌고 있습니다. 2025년 CPI는 2.7% 상승했지만 동물병원 평균 매출 증가율은 2.1%에 그쳤으며, 2026년 들어 이 격차가 더 벌어지고 있습니다. 동시에 상품 원가와 인건비 상승폭이 CPI보다 높아 수익 마진이 압박받고 있는 상황입니다. 이러한 환경에서 병원 경영자는 네 가지 핵심 성과지표(KPI)를Monthly로 추출하고 연도별 추이를 비교 분석해야 합니다.</p><p>첫 번째 KPI는 월간 신규 고객 수로, 전체 진료 의사 수 대비 월 15명 이하는 향후 의사 수 감소를 예고하는 경고 신호입니다. 월 20명 이상 확보하는 병원은 의사 수와 매출 모두 증가 추세입니다. 두 번째는 환자 방문 수로, 진료 외 입원, 사료 구매 등을 포함한 포괄적 지표입니다. 최근 5년간 신규 고객과 환자 방문이 감소한 병원은 가격 인상을 통해 일시적으로 매출을 유지할 수 있으나, 장기적으로는 반드시 방문 수 감소를 경험하게 됩니다. 세 번째는 의사별 진료 건수로, 진료 또는 수술이 필요한 의료 거래만 추적합니다. 한 의사가 한 달에 140건 이하로 진료하면 업무량이 부족하다는 신호입니다. 네 번째는 평균 진료비로, 예방 의학 수준을 나타내며 진료비가 معا찰료의 3.5~4.0배 수준이어야 이상적입니다.</p><p>한국 동물병원에서도 동일한 관리 원칙이 적용됩니다. 신규 고객 유입이 뜸해지면 지역 수요 감소인지 진료 역량 부족인지 점검해야 하며, 의사별 진료 건수를 추적하면 개인별 효율성과 팀 운영 문제를 조기에 파악할 수 있습니다. 평균 진료비를 분석하면 예방 처치와 진단 검사의 권장 여부가 드러나며, 의사 간 진료 역량 차이를 확인하고 표준화된 진료 기준을 확립하는 데 활용할 수 있습니다. 원문에서는 진료비의 구체적 목표치와 검사 서비스 매출 비율(20% 이상) 등에 대한 세부 기준을 확인할 수 있습니다.</p>
<p>원문: <a href="https://todaysveterinarybusiness.com/measure-monitor-and-manage-kpis-to-increase-clinic-revenue/" rel="nofollow">Today's Veterinary Business</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의 리더십의 새로운 시대: 기업 동물병원 운영의 핵심</h2><p><b>미국 기업 동물병원 현장에서 수의사가 경영진의 역할을 어떻게 수행해야 하는지에 대한 심층 분석이 공개되었다. 대규모 그룹 진료가 증가하는 현재, 임상 전문가의 리더십이 진료실과 이사회를 연결하는 핵심 요소로 부상하고 있다.</b></p>
<p>기업 동물병원이 이제 보편화되면서, 독립 진료와 기업 진료의 논쟁은 의미를 잃었다. 대신 누구에게 이 분야를 형성할 권한을 부여할 것인지가 핵심 쟁점이 되었다. 데이터를 분석하는 전문가들과 현장에서 동물을 돌보고 고객과 직면하는 진료 팀 사이의 균형을 어떻게 맞출 것인지가 성공의 열쇠다.</p><p>진료 리더들은 여러 가지 선택과 균형점을 직면한다. 중앙집중식 리더십은 확장이 빠르지만 지역 현실을 무시할 위험이 있고, 하향식 모델은 혁신을 촉진하지만 신뢰와 인내가 필요하다. 진료 가이드라인은 표준화를 지원하지만 너무 엄격하면 전문적 판단을 저해한다. 보상 체계는 단순한 수학 문제가 아니라 메시지이며, 급여보다 생산성을 강조하면 양보다 질이 소홀해질 수 있다.</p><p>한국 동물병원에도 이러한 시사점이 적용된다. 기업 병원이 아닌 중소 규모 병원에서도 경영진과 임상진 사이의 괴리를 줄이는 것이 중요하다. 진료 프로토콜은 강제가 아닌 대화의 가이드로 활용하고, 보상 체계는 양뿐 아니라 품질과 협업도 고려해야 한다. 또한 Fear Free 인증과 같은 자격증이 단순한 장식이 아닌 실제 진료 문화의 변화로 이어져야 한다.</p>

null},"tag":""},{"id":"2026-07-08_2","day":"2026-07-08","ts":1783457357000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"동물병원 채용 실패 루프를 끊는 9가지 HR 도구","dek":"채용 반응형으로 대응하다 보면 성과 없는 루프에 갇히기 쉽습니다. 미국 전문 미디어에서는 동물병원이 반드시 갖춰야 할 HR 도구 9가지를 제시했습니다.","source":"Today's Veterinary Business","country":"미국","date":"07.08","read":"2분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/Weinstein_Entrepreneurship_TVBAugSep26_MainImage.png","sourceUrl":"https://todaysveterinarybusiness.com/9-hr-tools-every-veterinary-practice-needs/","body":["동물병원 채용에서 가장 흔한 패턴은 누군가 사직하면 급히 채용광고를내고 \"경험이 있다\"는 이유만으로 빠르게 채용하는 것입니다. 하지만 6개월 만에 성과 미달, 의욕 상실, 퇴직으로 이어지는 이 사이클은 비용도 크지만 팀의 사기 와 생산성에도 큰 타격을 줍니다. 좋은 인력을 확보하려면 채용을 행정 노동이 아닌 시스템으로 접근해야 합니다.","핵심 HR 도구로는 직무 기술서, 인사 정책 매뉴얼, 표준화된 지원서와 면접 질문, 사전 정의된 급여 범위, 채용 예산, 구조화된 온보딩, 사명 이해 오리엔테이션, 체계적인 교육 시스템이 있습니다. 특히 처음 90일이 중요하며, \"사물함 here's your locker\"식 온보딩은 그저 즉흥입니다. 교육을 \"경험이 있으면 필요 없다\"는 assumption도 위험합니다. 모든 병원은 업무 방식이 다르기 때문에 문서화된 교육 시스템이 필수이며, 이는 경력 개발로 이어지는 평생 학습입니다.","한국 동물병원에서도 같은 문제가 반복되고 있습니다. 채용 절차가 미흡하면 팀 문화가 흔들리고, 명확한 급여 기준이 없으면 신규 채용자가 기존 직원보다 많은 급여를 받는 역차별 문제가 생깁니다. 인건비가 수익에 미치는 영향을 생각하면 채용 예산 수립도 필수입니다. 체계적인 HR 시스템은 실패적인 채용 루프를 끊고 지속 가능한 성장을 위한 토대가 됩니다."],"blog":"한국 동물병원 블로그에서는 \"우리 병원 신규 채용, 제대로 된 온보딩 프로세스가 있나요?\"라는 제목으로 자신의 병원의 채용 및 교육 시스템을 점검하는 글로 활용해 볼 만합니다.","blogAngle":["직무 기술서가 없으면 팀마다 저마다의 성공 정의를 만들어 성과 평가와 훈련의 일관성이 무너집니다","처음 90일 온보딩이 직원 유지율을 결정하며, 구조화된 계획과 멘토 배치가 중요합니다","사전 정의된 급여 범위는 공정성뿐 아니라 내부 임금 압축을 방지합니다","채용 결정은 한 명의 리더에게맡기지 않고 여러 관점을 가진 채용 팀으로 진행해야 합니다"],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":""},{"id":"2026-07-08_3","day":"2026-07-08","ts":1783454085000,"cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"수의사 영양 상담, 실제로 얼마나 이루어질까","dek":"최근 연구에서 수의사 진료 중 영양 상담이 포함된 비율이 단 16%에 불과한 것으로 나타났다. 561명의 수의사를 대상으로 한 설문조사로 barriers와 solutions을 분석한 이 연구는 한국 동물병원에도 시사하는 바가 크다.","source":"Today's Veterinary Practice","country":"미국","date":"07.08","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/07/ResearchWrapped_0726_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/personal-professional-development/breaking-the-barriers-to-positive-in-clinic-nutrition-conversations/","body":["연구에 따르면 이전 연구들에서도 진료 중 영양 상담 비율이 낮게 측정되었으며, 특히 사육자 중 25%가 수의사 스태프와 영양에 대해 한번도 논의한 적이 없다고 응답했다. 미 Virginia-Maryland College of Veterinary Medicine의 Megan Shepherd 연구자는 소동물 수의사 561명을 대상으로 영양 상담의 빈도, 수의사의 자신감, 그리고 장벽과 해결책을 파악하기 위한 익명 설문조사를 실시했다.","연구 결과 가장 큰 장벽은 사육자들의 다양한 목표와 기대, 그리고 수의사 자신의 경험에 따른 편향인 것으로 나타났다. Shepherd 연구자는 사육자의 목표(예: 관절 건강, 수명 연장 등)를 파악한 후 신체 Condition 점수와 연계하여 설명하는 것을 권장하며, '당신의 목표를 위해서는 건강한 체중 유지가 중요하다'라는 메시지가 효과적이라고 조언했다. 또한 영양은 팀 스포츠로서 수의사 technician과 지원 Staff도 상담 과정에 참여할 수 있으며, 무료로 제공되는 Mark Morris Institute와 BalanceIT 같은 영양 데이터베이스를 활용할 수 있다.","한국 동물병원 관점에서 보면, 이 연구는 영양 상담의 중요성과 구체적인 실천 방식을 보여준다. 상담 시 사육자의 목표를 먼저 파악하고, 동물의 현재 식이 상태를 평가한 후 근거에 기반한 권장을 하는 것이 핵심이다. technician이 영양 이력을 검토하고 상담을 시작하거나 주도할 수 있으며, 문서 자료를 함께 제공하면 사육자의 이해도를 높일 수 있다. 영양 상담은 동물 건강 향상뿐 아니라 사육자 신뢰 구축의 좋은 기회가 될 수 있다."],"blog":"한국 동물병원 블로그에 【영양 상담으로 동물 건강과 사육자 신뢰를 동시에 잡는 방법】이라는 제목으로, 연구에서 제시된 사육자 목표 파악 → 현재 식이 평가 → 근거 기반 권장의 3단계를 실제 상담 예시와 함께 소개하는 글을 쓸 수 있습니다.","blogAngle":["연구에 따르면 수의사 진료 중 영양 상담이 이루어지는 비율은 단 16%에 불과하며, 25%의 사육자가 영양 상담 경험이 없다.","561명의 수의사를 대상으로 한 설문조사로 영양 상담 장벽과 해결책이 분석되었으며, 사육자의 목표를 파악하고 연계하여 설명하는 것이 효과적인 것으로 나타났다.","영양 상담에서 수의사 Technicians와 지원 Staff도 중요한 역할을 할 수 있으며, 무료 데이터베이스(Mark Morris Institute, BalanceIT)를 활용할 수 있다.","영양 상담은 동물 건강뿐 아니라 사육자 신뢰 구축의 기회가 되므로, 다양한 형식과 반복을 통해 효과적으로 전달할 필요가 있다."],"radar":{"owner":{"soon":true,"q":"선생님, 우리 강아지 영양 상담도 받을 수 있어요?","script":"네, 영양 상담 가능합니다. 상담 때는 먼저 보호자분의 목표를 확인하고 동물의 현재 체상태를 평가한 후 맞춤 권장을 드려요. 영양사가 영양 이력을 먼저 확인하고 제가 최종 권고를 도와드리는 방식입니다."},"clinical":"영양 상담 프로토콜을 점검하고 영양사가 상담을 시작하거나 주도할 수 있도록 팀 교육을 강화하며, 같은 무료 영양 데이터베이스 활용을 검토하세요.","evidence":null},"tag":""},{"id":"2026-07-08_4","day":"2026-07-08","ts":1783457472000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"동물병원 소프트웨어 감사, 90분 안에 자가 점검하는 법","dek":"동물병원 소프트웨어 전문가가 제안한 90분 감사 방법. 중복 구독과 수동 데이터 입력으로 숨겨지는 비용을 파악하고 연간 구독비를 최적화할 수 있다.","source":"Today's Veterinary Business","country":"미국","date":"07.08","read":"2분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/Wysocki_Innovation_TVBAugSep26_MainImage.png","sourceUrl":"https://todaysveterinarybusiness.com/how-to-perform-a-veterinary-software-audit-in-90-minutes/","body":["대부분의 동물병원들은 소프트웨어를 체계적으로 감시한 적이 없습니다. 병원 관리 소프트웨어가 처음 도입되고, 그다음 고객 커뮤니케이션 도구, 결제 플랫폼, 온라인 약국, 예약 시스템, 검사실 통합, 리뷰 서비스, 그리고 최근에는 AI 기록 자동화 도구까지 하나씩 쌓입니다. 각 결정은 그때그때 합리적으로 보였지만, 결과적으로 8~10개의 별도 도구를 사용하게 됩니다. 이 비용은 대부분 보이지 않습니다. 매달 청구되는 금액이 충분히 작아 누구도 의심하지 않고, 활성화하지 않은 모듈에 대한 비용, 그리고 도구 간 데이터를 수동으로 이동하는 데 걸리는 직원 시간이 대표적인 예입니다. 많은 병원에서는 통합 레이어가 소프트웨어가 아니라 사람, 주로 병원 관리자이며 이 작업은 어떤 청구서에도 나타나지 않습니다.","90분 감사 방법은 4단계로 진행됩니다. 첫 번째, 모든 소프트웨어 목록을 작성하고 실제 청구서를 확인하며 팀이 사용하는 무료 도구도 포함시킵니다. 두 번째, 같은 기능을 하는 도구를 찾아 중복을 확인합니다. 예를 들어 PIMS와 별도 플랫폼에서 중복으로 알림을 보내거나, 두 개의 결제 프로세서를 사용하는 경우가 있습니다. 세 번째, 수동으로 데이터를 입력해야 하는 틈을 파악합니다. 예약 도구와 PIMS에 같은 정보를 두 번 입력하거나, 검사 결과를 수동으로 인쇄하고 붙이는 작업이 대표적인 예입니다. 이 비용은 절대 청구서에 반영되지 않으며 직원 시간과 실수, 번아웃으로 이어집니다. 네 번째, 실제 비용을 확인한 후 3~5가지 항목만 선택해 담당자와 기한을 정해 실행합니다. 마지막으로 모든 갱신 날짜를 공유 캘린더에 60~90일 전에 알림을 설정해두어야 합니다.","한국 동물병원들도 유사한 상황에 처해 있습니다. 국내 동물병원 관리 소프트웨어들도 다양한 기능을 제공하지만, 실제 사용 중인 기능과 미사용 기능의 차이를 파악하기 어려운 경우가 많습니다. 중복 구독과 수동 데이터 입력으로 인한 숨겨진 비용은 한국 병원에서도 분명히 존재할 것입니다. 특히 국내 소프트웨어 특성상 월정액 구독제가 일반적이고, 갱신 시점 놓치면 자동 연장되는 구조가 많으므로 이 감사 방법이 더욱 중요합니다. 이 기사를 참고해 병원 소프트웨어 목록을 한 번 점검해보면 연간 구독비를 상당한 금액 절감할 수 있을 것입니다."],"blog":"한국 동물병원 블로그나 뉴스레터에 '우리 병원 소프트웨어 점검하고 연간 구독비 절감하기'라는 제목으로 이 감사 방법을 소개하면 실무진들의 관심을 끌 수 있을 것입니다.","blogAngle":["90분 소프트웨어 감사로 현재 사용하는 모든 도구의 중복 기능을 파악하고 연간 구독비를 확인할 수 있습니다.","수동 데이터 입력 작업은 청구서에 반영되지 않지만 직원 시간과 실수, 번아웃이라는 엄청난 비용을 초래합니다.","감사 결과 중 3~5가지 항목만 선택해 담당자와 기한을 정해 실행에 옮기세요.","모든 소프트웨어 갱신 날짜를 캘린더에 60~90일 전에 알림을 설정하면 자동 연장 비용을 방지할 수 있습니다."],"radar":{"owner":{"soon":false,"q":"이 병원 소프트웨어 비용이 제가 내는 진료비에 영향을 주나요?","script":"소프트웨어 비용은 진료비에 포함되지 않도록 관리하고 있습니다. 대신 효율적인 시스템으로 더 나은 진료 서비스를 제공할 수 있도록 노력하고 있답니다."},"clinical":"90분 감사 4단계를 실천하여 병원 소프트웨어 목록 작성, 중복 도구 확인, 수동 입력 틈 파악, 실제 비용 확인 후 최적화할 3~5개 항목 선정 및 갱신 알림 설정","evidence":null},"tag":""},{"id":"2026-07-08_5","day":"2026-07-08","ts":1783522337000,"cat":"practice_management","kicker":"병원 경영","isToday":true,"title":"24시간 동물병원 개축 시 임상 운영 연속성 유지 사례","dek":"미국 사우스캐롤라이나 소재 24시간 동물병원 CHARLESTON VETERINARY REFERRAL CENTER가 16개월간 기존 시설을 그대로 운영하면서 3만2700제곱피트 규모의 확장을 완료한 사례를 소개합니다.","source":"Veterinary Practice News","country":"미국","date":"07.08","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/25_12_5488_Edit_1.jpg","sourceUrl":"https://www.veterinarypracticenews.com/maintaining-continuity-during-renovation/","body":["미국에서 전문 및 응급 동물의료에 대한 수요가 증가하면서 많은 병원들이 이전이 아닌 기존 시설 확장을 선택하고 있습니다. 그러나 임상 운영을 중단하지 않으면서 건설을 진행하려면 기존 방식과 근본적으로 다른 접근이 필요합니다. 해당 병원은 연간 약 2만6000명의 환자를 치료하며, 외과, 진단, 치료 공간에 대한 중단 없는 접근이 필수적입니다.","이 프로젝트의 핵심 과제는 기존 시설 내에 있던 6개의 수술실 전체를 운영하면서 증축 공사를 진행하는 것이었습니다. 프로젝트 팀은 수술실 2개를 우선 완성하여 전환이 가능하도록 순서화를 조정했고, 이로 인해 최소 2개의 완전한 수술실이 항상 사용 가능한 상태를 유지했습니다. 동시에 활성 외과 수술실과 인접한 구역에서는 임시 배리어와 음압 시스템을 통해 먼지·오염 물질이 임상 공간으로 확산되지 않도록 감염 관리 프로토콜을 엄격히 시행했습니다. CT 영상 서비스의 경우 임시 이동식 CT 스캐너를 배치하고 영구 CT실 건설 시간을 기존 3개월에서 약 1개월로 단축하여 주당 12~16건의 CT 검사가 지속될 수 있었습니다.","한국 동물병원에서도 개축이나 리노베이션 시 임상 운영 연속성 유지가 중요한 과제입니다. 소규모 병원이라도 수술실이나 영상 진단 장비를 잠시이라도 중단하면 환자 흐름에 차질이 발생할 수 있습니다. 임시 시설 활용, 건설 구간 세분화, 인력 스케줄 조정 등 이 사례의 접근법은 한국 병원에서도 참고할 만한 전략입니다. 특히 응급 및 전문 동물병원은 환자 특성상 진료 중단이 곧 환자 결과에 직접적인 영향을 미칠 수 있어, 개축 전 초기 단계에서의 운영 기반 사정과 시스템 통합 계획이 필수적입니다."],"blog":"국내 동물병원에서도 증축이나 리노베이션을 계획할 때, 임상 운영을 유지하기 위한 임시 시설·분할 순서화·인력 스케줄 조정 전략을 미리 수립하는 과정을 병원 블로그나 내부 교육 자료로 공유하면 유용할 것입니다","blogAngle":["24시간 동물병원에서 개축은 시설적 과제가 아닌 운영 과제이며, 응급 환자나 수술 스케줄은 공사로 인해 중단될 수 없습니다","수술실 순서화를 조정하여 최소 2개의 수술실을 항상 사용 가능하게 유지하고, 건설 구역과 임상 공간을 음압 시스템으로 분리하여 감염 위험을 관리했습니다","임시 CT 스캐너 활용과 건설 기간 단축으로 영상 진단 서비스를 중단 없이 유지했으며, 이는 주당 12~16건의 CT 검사가 필요한 병원에게 필수적이었습니다","의료가스, 전력, 공조 시스템의 기존 인프라와의 통합은 병원 운영 중 신중하게 계획·순서화되어야 하며, 이 사례에서는 5500리터의 벌크 산소 저장탱크가 설치되었습니다"],"radar":{"owner":{"soon":false,"q":"개축공사 기간에도 병원 진료가 계속되나요?","script":"개축공사에는 임시 시설을 마련하거나 시공 구역을 세분화해서 진료가 끊기지 않도록 합니다. 구체적인 계획은 각 병원 규모와 상황에 따라 다릅니다."},"clinical":"병원 개축·리노베이션 시 기존 진료 인프라(수술실, 영상 진단실) 연속성 확보 방안을 사전에 수립하고, 단계적 전환 프로토콜을 마련할 것","evidence":null},"tag":""},{"id":"2026-07-08_6","day":"2026-07-08","ts":1783457783000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"개방형 API가 동물 병원 소프트웨어의 미래를 바꾼다","dek":"동물 병원 관리 프로그램(PIMS) 업계가 폐쇄적 시스템에서 벗어나 개방형 API를 표준으로 삼아야 한다는 주장이 제기되고 있다. 이는 환자 진료 품질과 병원 운영 효율성에 직접적인 영향을 미치는 문제다.","source":"Today's Veterinary Business","country":"미국","date":"07.08","read":"1분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/Viewpoints_TVBAugSep26_MainImage.png","sourceUrl":"https://todaysveterinarybusiness.com/why-veterinary-software-should-embrace-open-apis/","body":["현재 많은 동물 병원 관리 프로그램은 특정 제조사 제품만 연동 가능한 폐쇄적인 시스템을 채택하고 있어, 동물 병원들이 원하는 도구를 자유롭게 선택하지 못하고 있다. 호텔업과 의료계 등 다른 산업에서는 이미 개방형 API를 통해 다양한 도구들을 원활하게 연결하여 운영 효율성을 높이고 비용을 절감하고 있다.","폐쇄적인 API 구조는 스타트업의 혁신을 가로막고, 동물 병원들이 선호하는 도구(원격 진료, 재고 관리, AI 필기 도구 등)와의 통합을 어렵게 만들어 수동 데이터 입력과 중복 기록이라는 비효율을 초래한다. 이를 극복하려면 PIMS 공급업체들이 데이터 주위를 둘러싼 ‘벽’을 낮추고 안전한 개방형 API를 제공해야 한다.","한국 동물 병원들도 관리 프로그램 선택 시 연동 가능성을 확인하고, 원격 진료나 AI 진단 도구 등 다양한 기술 도입을 위해서는 반드시 API 개방성이 필수적임을 인식해야 한다. 현재 국내 시장에 다양한 동물 병원용 소프트웨어가 도입되는 만큼, 각 소프트웨어 간 연동성 확보가 향후 병원 경쟁력의 핵심이 될 것이다."],"blog":"국내 동물 병원 관리 프로그램 사용 시 다양한 외부 도구(원격 진료, AI 필기, 재고 관리 등)와의 연동 가능성을 확인하고, 자체 병원 환경에 맞는 소프트웨어 조합을 구축하는 방법을 블로그로 공유하면 읽자 들에게 실용적인 정보가 될 것이다","blogAngle":["동물 병원 관리 프로그램 업계는 다른 산업(호텔업, 의료계)과 달리 개방형 API 도입이 지연되고 있다","폐쇄적 시스템은 혁신을 억압하고 병원 운영 비효율을 초래한다","개방형 API는 최상의 도구들이 자유롭게 경쟁하고 연동될 수 있게 한다","한국 동물 병원들도 소프트웨어 선택 시 연동 가능성을 중요한 기준으로 삼아야 한다"],"radar":{"owner":null,"clinical":"현재 사용 중인 PIMS의 API 개방성 및 외부 도구 연동 가능성을 소프트웨어 공급업체에 직접 확인하고, 원격 진료·AI 필기 등 필요한 도구 도입 시 연동 이슈가 없는지 사전 점검할 것","evidence":null},"tag":""},{"id":"2026-07-08_7","day":"2026-07-08","ts":1783457311000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"동물병원 수익성 강화 위한 4가지 핵심 KPI 관리법","dek":"미국 동물병원 매출 증가율이 CPI 인플레이션률보다 낮은 반면 인건비와 물류비용은 빠르게 상승하고 있습니다. 신규 고객 수, 환자 방문 수, 의사 진료 건수, 평균 진료비를 체계적으로 측정하고 관리해야 수익성 향상이 가능하다는 전문가 분석입니다.","source":"Today's Veterinary Business","country":"미국","date":"07.08","read":"2분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/Castner_MoneyMatters_TVBAugSep26_MainImage.png","sourceUrl":"https://todaysveterinarybusiness.com/measure-monitor-and-manage-kpis-to-increase-clinic-revenue/","body":["최근 2년간 동물병원 매출 증가율이 소비자물가지수(CPI) 상승률을 밑돌고 있습니다. 2025년 CPI는 2.7% 상승했지만 동물병원 평균 매출 증가율은 2.1%에 그쳤으며, 2026년 들어 이 격차가 더 벌어지고 있습니다. 동시에 상품 원가와 인건비 상승폭이 CPI보다 높아 수익 마진이 압박받고 있는 상황입니다. 이러한 환경에서 병원 경영자는 네 가지 핵심 성과지표(KPI)를Monthly로 추출하고 연도별 추이를 비교 분석해야 합니다.","첫 번째 KPI는 월간 신규 고객 수로, 전체 진료 의사 수 대비 월 15명 이하는 향후 의사 수 감소를 예고하는 경고 신호입니다. 월 20명 이상 확보하는 병원은 의사 수와 매출 모두 증가 추세입니다. 두 번째는 환자 방문 수로, 진료 외 입원, 사료 구매 등을 포함한 포괄적 지표입니다. 최근 5년간 신규 고객과 환자 방문이 감소한 병원은 가격 인상을 통해 일시적으로 매출을 유지할 수 있으나, 장기적으로는 반드시 방문 수 감소를 경험하게 됩니다. 세 번째는 의사별 진료 건수로, 진료 또는 수술이 필요한 의료 거래만 추적합니다. 한 의사가 한 달에 140건 이하로 진료하면 업무량이 부족하다는 신호입니다. 네 번째는 평균 진료비로, 예방 의학 수준을 나타내며 진료비가 معا찰료의 3.5~4.0배 수준이어야 이상적입니다.","한국 동물병원에서도 동일한 관리 원칙이 적용됩니다. 신규 고객 유입이 뜸해지면 지역 수요 감소인지 진료 역량 부족인지 점검해야 하며, 의사별 진료 건수를 추적하면 개인별 효율성과 팀 운영 문제를 조기에 파악할 수 있습니다. 평균 진료비를 분석하면 예방 처치와 진단 검사의 권장 여부가 드러나며, 의사 간 진료 역량 차이를 확인하고 표준화된 진료 기준을 확립하는 데 활용할 수 있습니다. 원문에서는 진료비의 구체적 목표치와 검사 서비스 매출 비율(20% 이상) 등에 대한 세부 기준을 확인할 수 있습니다."],"blog":"한국 동물병원 블로그에서 '우리 병원 KPI 점검하기'라는 제목으로 우리 병원의 신규 고객 수와 의사별 진료 건수를 분석하고 개선 방안을 제시하는 글을 작성하면 좋습니다","blogAngle":["2025년 미국 동물병원 평균 매출 증가율(2.1%)은 CPI 상승률(2.7%)보다 낮았으며, 원가와 인건비 상승으로 수익 마진이 압박받고 있습니다","월간 신규 고객 수가 전체 의사 수 대비 15명 이하면 향후 의사 수 감소 신호, 20명 이상이면 성장 신호입니다","의사별 진료 건수 추적은 환자들이 얼마나 많은 진료를 받고 있는지를 보여주며, 한 달에 140건 이하는 업무량 부족을 의미합니다","평균 진료비가 معا찰료의 3.5~4.0배 수준이어야 예방 의학 수준이 충분하며, 의사 간 진료비 차이는 진료 품질 불균형을 나타냅니다"],"radar":{"owner":null,"clinical":"자신의 동물병원에서 월간 신규 고객 수, 의사별 진료 건수, 평균 진료비를 실제로 측정·비교하고 업계 평균과 차이가 크면 경영 개선점을 파악한다","evidence":null},"tag":""},{"id":"2026-07-08_8","day":"2026-07-08","ts":1783456972000,"cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"수의 리더십의 새로운 시대: 기업 동물병원 운영의 핵심","dek":"미국 기업 동물병원 현장에서 수의사가 경영진의 역할을 어떻게 수행해야 하는지에 대한 심층 분석이 공개되었다. 대규모 그룹 진료가 증가하는 현재, 임상 전문가의 리더십이 진료실과 이사회를 연결하는 핵심 요소로 부상하고 있다.","source":"Today's Veterinary Business","country":"미국","date":"07.08","read":"1분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/06/Lester_CreativeDisruption_TVBAugSep26_MainImage.png","sourceUrl":"https://todaysveterinarybusiness.com/understanding-the-role-of-the-chief-veterinary-officer/","body":["기업 동물병원이 이제 보편화되면서, 독립 진료와 기업 진료의 논쟁은 의미를 잃었다. 대신 누구에게 이 분야를 형성할 권한을 부여할 것인지가 핵심 쟁점이 되었다. 데이터를 분석하는 전문가들과 현장에서 동물을 돌보고 고객과 직면하는 진료 팀 사이의 균형을 어떻게 맞출 것인지가 성공의 열쇠다.","진료 리더들은 여러 가지 선택과 균형점을 직면한다. 중앙집중식 리더십은 확장이 빠르지만 지역 현실을 무시할 위험이 있고, 하향식 모델은 혁신을 촉진하지만 신뢰와 인내가 필요하다. 진료 가이드라인은 표준화를 지원하지만 너무 엄격하면 전문적 판단을 저해한다. 보상 체계는 단순한 수학 문제가 아니라 메시지이며, 급여보다 생산성을 강조하면 양보다 질이 소홀해질 수 있다.","한국 동물병원에도 이러한 시사점이 적용된다. 기업 병원이 아닌 중소 규모 병원에서도 경영진과 임상진 사이의 괴리를 줄이는 것이 중요하다. 진료 프로토콜은 강제가 아닌 대화의 가이드로 활용하고, 보상 체계는 양뿐 아니라 품질과 협업도 고려해야 한다. 또한 Fear Free 인증과 같은 자격증이 단순한 장식이 아닌 실제 진료 문화의 변화로 이어져야 한다."],"blog":"한국 동물병원에서도 경영진과 임상진의 소통 개선, 진료 프로토콜의 적정 수준, 보상 체계 개선을 위한 내부 토론의 글로 활용할 수 있다.","blogAngle":["기업 동물병원에서 수의사 리더십의 역할이 더욱 중요해지고 있으며, 임상 전문가가 이사회와 진료실을 연결하는 핵심 고리다.","리더십 모델, 기술 선택, 진료 프로토콜, 보상 체계 등에서 표준화와 지역 자율성 사이의 균형이 필수적이다.","진료 가이드라인은 확장을 지원하지만 너무 엄격하면 정형화된 의학이 되어 전문적 판단을 저해할 수 있다.","한국 중소 동물병원에서도 임상진과 경영진의 소통, 진료 품질 중심의 보상, 자격증의 실질적 적용이 중요한 시사점이다."],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":""}],"stories":[]}</script>

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.
  function qaColumn(arr){

      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';

  }

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){
    var pad=(3-(list.length%3))%3, fill='';

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){

      +'<span style="flex:none;width:20px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--color-label-assistive);text-align:center;">'+(i+1)+'</span>'

    }).join('');
    return '<div style="margin-top:32px;padding:22px 24px 24px;background:var(--color-background-alternative);border-radius:16px;">'
    +'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:2px;"><span style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 밖 이야기</span><span style="font-size:12.5px;color:var(--color-label-alternative);">해외에서 화제가 된 반려동물·병원 썰</span></div>'

  function homeView(){
    var arr=activeList();

  function listView(items,emptyT,emptyH){

    return '<div style="padding-top:16px;"><div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;"><button data-act="makedraft" style="display:inline-flex;align-items:center;gap:8px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">✍️ AI 블로그 초안 만들기</button><button data-act="copyall" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--color-primary-normal);border:1px solid var(--color-primary-normal);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 전체 복사</button></div>'+items.map(ideaCard).join('')+'</div>';

  function draftModal(){

      var r=d.result;
      var titles=(r.titles||[]).map(function(t,i){return '<button data-act="copytitle" data-t="'+encodeURIComponent(t)+'" style="display:block;width:100%;text-align:left;border:1px solid var(--color-line-normal);background:var(--color-background-normal);border-radius:9px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--color-label-strong);">'+(i+1)+'. '+e(t)+'</button>';}).join('');
      var tags=(r.hashtags||[]).map(function(t){return '<span style="display:inline-block;font-size:12.5px;color:var(--color-primary-normal);background:rgba(0,102,255,.08);border-radius:99px;padding:3px 10px;margin:0 6px 6px 0;">'+e(t)+'</span>';}).join('');
      inner='<div style="padding:22px 24px 26px;">'
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin-bottom:8px;">제목 후보 (클릭하면 복사)</div>'+titles
        +'<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary-normal);margin:18px 0 8px;">본문</div>'
        +'<div style="white-space:pre-wrap;font-size:15px;line-height:1.85;color:var(--color-label-neutral);background:var(--color-background-alternative);border-radius:10px;padding:16px 18px;">'+e(r.body||'')+'</div>'
        +'<div style="margin:16px 0 8px;">'+tags+'</div>'
        +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button data-act="copydraft" style="display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 제목+본문+태그 전체 복사</button><button data-act="draftclose" style="border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 16px;border-radius:10px;">닫기</button></div>'
        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'
        +'</div>';
    }
    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?'구독 신청 완료! 매일 아침 받아보세요':(res.error||'실패')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  // SPA라 기사를 열어도 페이지 이동이 없어 GA4가 조회를 못 잡는다 — 직접 보낸다
  function track(a){
    if(typeof gtag!=='function'||!a) return;
    try{
      gtag('event','article_view',{article_id:a.id,article_title:a.title,category:a.cat,source:a.source,issue_date:a.day});
    }catch(e){}
  }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); track(byId[id]); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
</html>
