<small>최신 연구 · Veterinary radiology &amp; ultrasound</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-24_22-디오드-레이저로-치료한-고양이-눈꺼풀-아포크린-낭포선종증-4례"><b>디오드 레이저로 치료한 고양이 눈꺼풀 아포크린 낭포선종증 4례</b></a>
<div>눈꺼풀에 발생하는 희귀한 양성 종양인 아포크린 낭포선종증(PAC)을 디오드 레이저로 치료한 고양이 4례를 보고합니다. 재발 없이 완전히 치유되었으며, 이는 기존 치료법 대비 안전하고 효과적인 대안이 될 수 있음을 보여줍니다.</div>
<small>최신 연구 · Journal of feline medicine and surgery</small></li><li style="margin-bottom:16px;"><a href="/article/2026-07-24_23-개-안면신경장애의-안과적-특징중두개견에서-각막염-더-빈번"><b>개 안면신경장애의 안과적 특징—중두개견에서 각막염 더 빈번</b></a>
<div>스페인 바르셀로나 Autonomous 대학 수의과대학 병원의 14년간 후향적 연구로 안면신경기능장애를 가진 74마리 개(84안)에서 안구 이상 소견을 분석하여 중두개견과 비중두개견 간의 임상적 차이를 보고합니다.</div>

<script id="vm-issue" type="application/json">{"date":"2026-07-24","dateLabel":"2026.07.24","dateline":"2026년 7월 24일 · 금요일","editionNo":"2,030","count":23,"cats":[{"key":"research","label":"최신 연구"},{"key":"clinical","label":"임상"},{"key":"practice_management","label":"병원 경영"},{"key":"client_communication","label":"보호자 소통"},{"key":"career","label":"커리어"}],"articles":[{"id":"2026-07-24_1","legacySlug":null,"day":"2026-07-24","ts":1784806303000,"publishedAt":"2026-07-23T11:31:43.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"소동물 종양 조기 발견, 천자흡인검사가 답이다","dek":"소동물 임상에서 가장 가치 있는 진단 도구 중 하나인 천자흡인검사(FNA)의 기술적 핵심과 활용법에 대한 전문 가이드를 소개합니다. 크기나 모양만으로는 종양의 양성을 판단할 수 없으며, 1개월 이상 지속되는 종괴나 1cm 이상 큰 종괴는 반드시 검사가 필요합니다.","source":"Veterinary Practice News","country":"미국","date":"07.23","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/FNA-aspiration-technique-300.jpg","sourceUrl":"https://www.veterinarypracticenews.com/art-of-aspirate-collection-techniques-slide-preparation-common-mistakes/","body":["천자흡인검사는 빠르고 비용이 적으며 최소침습적인 진단 도구로, 수 분 내에 진단 정보를 제공할 수 있습니다. 특히 수의학에서 초기 종양 발견은 매우 중요한데, 피부 종괴, 림프절 비대, 구강 병변 등이 초기에는 양성으로 보일 수 있지만 조기 세포학적 평가로 염증성 병변이나 악성 종양을 조기에 발견할 수 있습니다. 따라서 ‘모든 종괴는 천자흡인검사한다’는 원칙이 임상에서 강조됩니다.","천자흡인검사에는 음압을 사용하는 흡인법과 모세관 작용을 이용하는 비흡인법 두 가지 기법이 있습니다. 대부분 종괴에는 22게이지 바늘을 사용하며, 혈관이 많은 조직에서는 25게이지 바늘로 혈액 오염을 줄일 수 있습니다. 음압이 너무 강하면 세포 손상과 혈액 오염이 증가하므로, 표피 종괴에서는 더 깨끗한 표본을 제공하는 모세관 기법을 선호하는 수의사들도 있습니다. 검체 수집 후 바로 슬라이드를 건조시키고 95% 메탄올로 2~5분간 고정한 후 염색합니다.","한국 동물병원에서는 1개월 이상 지속되는 종괴나 1cm 이상의 종괴에 대해 Routine하게 천자흡인검사를 실시하는 것이 좋습니다. 검체 준비 시 음압 조절과 슬라이드 spreading 기법에 주의하면 진단 가능한 표본 획득률을 크게 높일 수 있습니다. 세포병리 전문의의 판독이 필요할 수 있으므로, 의심스러운 종괴는 전문 검사기관으로 전송하는 체계적인 흐름을 마련하는 것이 관점입니다."],"blog":"한국 동물병원 블로그에서 ‘반려동물 종괴 발견 시보호자가 알아야 할 점검 사항’ 콘텐츠로 활용할 수 있습니다.","blogAngle":["종괴의 크기와 모양만으로는 양성인지 악성인지 판단할 수 없어서 천자흡인검사가 필수적입니다.","1개월 이상 지속되는 종괴나 1cm 이상 큰 종괴는 반드시 천자흡인검사를 실시해야 합니다.","음압 조절과 바늘 크기 선택이 혈액 오염을 줄이는 핵심 요령입니다.","표면 피부 종괴에서는 모세관 기법이 더 깨끗한 표본을 제공할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 강아지/고양이 몸에 종괴가 있는데, 이것이 종양인지 바로 검사를 받아야 하나요?","script":"1개월 이상 지속되는 종괴나 1 이상 큰 종괴는 천자흡인검사를 해보는 것이 좋습니다. 빠르고 비용이 적으며 최소침습적인 검사라서 추가 검사나 치료 방향을 결정하는 데 도움이 됩니다."},"clinical":"1개월 이상 지속되는 종괴나 1 이상 큰 종괴에 대한 천자흡인검사 프로토콜을 진료 체계에 표준화하고, 의심 종괴는 세포병리 전문 검사기관으로 전송하는 체계적 흐름을 마련한다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_2","legacySlug":null,"day":"2026-07-24","ts":1784835660000,"publishedAt":"2026-07-23T19:41:00.000Z","cat":"clinical","kicker":"임상","isToday":true,"title":"캔 카운티, 애완동물 광견병 예방접종 효과 저하 가능성 발표","dek":"미국 일리노이주 캔 카운티 당국이 지난 해 동물에게 예방접종한 광견병 백신이 효과를 잃었을 수 있으며 리콜되었다고 발표했습니다. 해당 백신은 운송 과정에서 적절한 온도 관리를 받지 못해 효력이 저하된 것으로 파악되었습니다.","source":"CBS News","country":"","date":"07.24","read":"1분 읽기","plate":"CBS News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijAFBVV95cUxQMVNURGEzN2ZzYkFGQ2l6QVB4bjBYajMyQ1NXSU9ENlhuSzBtS1VzU2s1NVRnOWVYQzNXQUh5ZThyNFItTTdPYlI5cGdxU3pBNW1XXy1vanJoR0p5aFJEaHJudmlQSGxCbXlVbk5kdUl6anc0cERoZDdfWmQ5RlRPTmo5OFVHRURIR0ZoUA?oc=5","body":["광견병은 치사율이 100%에 달하는 치명적인 바이러스 질환으로, 동물과 인간 모두에게 치명적입니다. 따라서 대부분의 국가에서 개와 고양이에 대한 광견병 예방접종은 법적 필수 사항입니다. 미국에서는 연간 수백만 건의 광견병 예방접종이 실시되며, 예방접종을 받은 동물의 발병 사례는 극히 드뭅니다.","캔 카운티 당국에 따르면, 지난 해 제공된 일부 광견병 백신 배치가 권장 보관 온도를 충족하지 못한 상태로 운송된 것으로 밝혀졌습니다. 효력이 저하된 백신으로 예방접종한 동물은 광견병에 대한 완전한 보호력을 얻지 못했을 가능성이 있습니다. 당국은 영향을 받은 동물들에게 추가 예방접종을 권장하며, 해당 배치는 이미 회수되었습니다.","한국의 동물병원에서도 냉장 및 온도 관리 체계의 중요성을 다시 한번 확인하는 계기가 됩니다. 국내에서 사용되는 광견병-vaccine 역시 유통 과정에서 온도 관리 실패 시 효력 저하의 위험이 존재합니다. 동물병원에서는 예방접종 시 해당 백 sin의 유통 기류와 보관 상태를 점검하고, 보호자에게 예방접종을 받은 동물이라도 추가 노출 위험이 있음을 안내하는 것이 좋습니다."],"blog":"한국 동물병원 블로그에서는 '우리 병원백신 관리 시스템 소개' 또는 '강아지·고양이 예방접종 후 주의사항'이라는 제목으로 이번 해외 사례를 인용하여 운영하는 것이 좋습니다.","blogAngle":["캔 카운티에서 지난 해 예방접종한 광견병-vaccine이 운송 중 온도 관리 실패로 효력 저하 가능성","영향받은 동물들은 완전한 광견병 보호력을 얻지 못했을 수 있어 추가 예방접종 권장","백신은 이미 회수되었으며 별도의 안전 사고 보고는 아직 없음","동물병원에서는 예방접종백신의 보관 및 유통 관리 철저가 중요"],"radar":{"owner":{"soon":true,"q":"우리 강아지/고양이 예방접종 했는데, 이거 때문에 광견병 방어가 안 되는 건 아닌가요?","script":"광견병 예방접종은 매우 중요합니다. 일반적으로 국내에서 유통되는 백신은 엄격한 온도 관리를 거치므로 문제가 없습니다. 다만, 예방접종 후에도 동물 건강에 이상이 있거나 노출 위험이 있었다면 수의사와 상담해 보세요."},"clinical":"동물병원에서 예방접종 시 해당 백신의 유통 기류와 보관 상태를 점검하고, 보호자에게 예방접종을 받은 동물이라도 추가 노출 위험이 있음을 안내하는 것이 좋습니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_3","legacySlug":null,"day":"2026-07-24","ts":1784661355000,"publishedAt":"2026-07-21T19:15:55.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"미국 콜로라도에 고양이 전용 동물병원 개원... 진료 공백 해소 도전","dek":"미국 콜로라도주 Aurora에 고양이 전용 동물병원이 가을에 개원합니다. 약 7600만 마리의 고양이가 미국 가정에서 사육되지만, 2025년 의료를 받은 고양이는 약 3분의 1에 불과해 개(70%)와의 큰 격차가 보고되었습니다.","source":"Veterinary Practice News","country":"미국","date":"07.22","read":"2분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/bigstock-Doctor-Veterinarian-At-Clinic-214965265-scaled.jpg","sourceUrl":"https://www.veterinarypracticenews.com/new-feline-only-organizations-aims-close-gap-veterinary-care/","body":["미국 CATalyst Council의 '2026 State of the Cat Report'에 따르면 고양이 진료 격차의 주요 원인은 동물병원 방문에 대한 스트레스, 고양이 운반용 케이지 운송의 어려움, 치료비에 대한 불확실성 등으로 분석됩니다. 고양이 전용 병원 CatsOnly Veterinary Services는 이러한 장벽을 낮추는 것을 목표로 합니다.","CatsOnly의 Craig Wallace 공동창립자 겸 CEO는 \"고양이 보호자가 관을 다르기 때문에가 아니라 동물병원 진화가 개 중심으로 이루어져 왔다\"고 밝혔습니다. 병원에는 고양이 의학 및 행동 전문가들로 구성된 의료자문위원회가 임상 방향을 이끌며, 첫 번째 병원은 Aurora의 Stanley Marketplace에 개원하고 2027년 초 Denver 지역에 두 번째 병원을 열 계획입니다.","한국 동물병원에게도 시사점이 있습니다. 국내 고양이 사육 비율은 지속적으로 증가하고 있으나, 고양이 주인의 병원 방문 저조는 유사한 패턴을 보입니다. 고양이 진료 특화 공간이나 이동식 진료 서비스 도입 검토가 필요하며, 고양이의 특성을 고려한 환경 조성(예: 냄새 관리, 낮은 소음, 개별 대기 공간)이 경쟁력이 될 수 있습니다."],"blog":"고양이 보호자들의 병원 방문 장벽을 낮추는 서비스 모델(고양이 전용 대기 공간, 이동식 진료, 가격 정보 투명화 등)을 한국 동물병원 블로그에 소개한다면 차별화된 마케팅 자료가 될 수 있습니다.","blogAngle":["미국 가정에는 약 7600만 마리의 고양이가 사육되지만, 2025년 의료를 받은 고양이는 약 33%에 불과합니다.","CatsOnly는 고양이 이동 스트레스, 병원 스트레스, 치료비 불확실성 등 3가지를 주요 장벽으로 인식하고 있습니다.","의료자문위원회에 고양이 전문 수의사 및 전문가들이 참여하여 고양이 관점의 진료 모델을 설계합니다.","한국에서도 고양이 전용 진료 공간이나 서비스 도입이 고객 충성도 확보에 기여할 수 있습니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이도 동물병원 가면 너무 스트레스 엄청 받는데, 병원 환경이 달라진 건 없나요?","script":"고양이 보호자님, 요즘 고양이 전용 공간을 둔 병원이 관심을 받고 있죠. 아직 한국에 본격적인 고양이 전용 병원은 드물지만, 고양이 스트레스를 낮추는 환경(냄새 관리, 조용한 대기 공간 등)을 갖춘 병원을 찾아보시는 것도 방법입니다. 고양이 진료 경험이 많은 병원에 먼저 문의해 보세요."},"clinical":"고양이 환자가 동물병원에서 진료 환경(냄새, 소음, 대기 공간)을 점검하고, 고양이 스트레스를 줄이는 환경 조성 가능성을 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_4","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"염소백시균 불활화 백신, 돼지 살모넬라 choleraesuis 감염 예방 효과","dek":"스페인 연구팀이 돼지에서 살모넬라 choleraesuis에 대한 예방법을 탐구했습니다. 불활화시킨 염소유래 BCG 균주와 전통적 백신을 병용했을 때 세균 배양량이 가장 낮았으며 이질 혈청형에 대한 면역 반응도 개선된 것으로 나타났습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1879508/full","body":["살모넬라 enterica subsp. enterica serovar choleraesuis는 돼지에서 심한 전신 질환을 유발하며 경제적 손실과 인수공통 감염 위험을 초래하는 병원체입니다. 현재 사용되는 백신은 표적 균주뿐 아니라 비표적 균주에 대해서도 보호 효과가 제한적이라는 문제가 있습니다.","연구팀은 훈련면역 개념을 적용하여 불활화시킨 돼지유래 BCG 균주(dpB)와 전통적인 살모넬라 choleraesuis 백신을 함께 투여했을 때의 효과를 확인했습니다. 그 결과, 불활화 dpB를 병용한 그룹에서 분변과 회맹막림프절에서의 살모넬라 검출량이 가장 낮았고, 이질 혈청형에 대한 면역 반응도 개선되는 경향을 보였습니다. 반면 생균 dpB를 투여한 그룹에서는 폐 병변이 가장 심하고 탐식 능력이 가장 낮았으며 사이토카인 균형이 깨지는 모습이 관찰되었습니다.","이 연구는 동물병원에서 Vaccination 전략을 개발할 때 균주의 생존 여부가 치료 효과에 중요한 영향을 미친다는 점을 시사합니다. 특히 불활화 균주를 활용하면 과도한 염증 반응 없이도 넓은 범위의 보호 면역을 얻을 수 있을 것으로 기대됩니다. 한국 중소 돼지 농가에서도 이와 같은 복합 백신 접근법이 살모넬라 감염 관리에 도움이 될 수 있습니다."],"blog":"한국 동물병원에서는 돼지 농가 고객에게 살모넬라 예방을 위한 Vaccination 전략 상담 시 균주의 생존 여부가 보호 효과에 미치는 영향을 함께 설명하는 콘텐츠를 제작할 수 있습니다.","blogAngle":["살모넬라 choleraesuis는 돼지에서 심한 전신 질환을 유발하며 현재 백신의 보호 효과가 제한적입니다.","불활화 dpB와 전통적 백신을 병용한 그룹에서 세균 배양량이 가장 낮았습니다.","생균 dpB를 투여한 그룹은 오히려 폐 병변이 악화되고 면역 균형이 깨지는 부작용을 보였습니다.","불활화 균주를 활용한 훈련면역 접근이 이질 혈청형에도 효과적인 보호를 제공할 수 있습니다."],"radar":{"owner":{"soon":false,"q":"우리 강아지도 살모넬라 예방 주사가 가능한가요?","script":"강아지에서 살모넬라 감염은 드물지 않으며, 주로 환경이나 음식물을 통해 전파됩니다. 현재 강아지 전용 살모넬라 백신은 상용화되어 있지 않지만, 위장관 건강 관리와 위생 관리가 예방에 중요합니다. 구체적인 예방 방법은 진료 시 상담해 드리겠습니다."},"clinical":"개의 및 고양이 대상 살모넬라 예방접종 여부 및 각 동물별 맞춤 예방 관리법 점검","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_5","legacySlug":"2026-07-24_5-개-Taurine-영양학-심장대사질환-예방-위한-최신-지향","day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 타우린 영양학: 심장·대사질환 예방 위한 최신 지향","dek":"타우린이 개의 심장, 신경, 시각, 생식 기관의 기능을 조절하는 핵심 영양소로 재조명되고 있습니다. 특정 품종에서 발생하는 확장형 심근병증과 타우린 결핍의 연관성이 보고되면서 개의 영양 관리에 새로운 패러다임이 제시되고 있습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"1분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1812065/full","body":["개의 타우린 대사는 품종, 체구크기, 생리적 상태에 따라 큰 개인차이를 보입니다. 특히 대형견과 중형견은 내인성 합성 능력이 제한적이어서 식이적 보충이 필수적입니다. 연구에 따르면 개의 전혈, 혈장, 혈청 내 타우린 농도는 품종별로 상이하며, 이 차이는 유전적 요인과 식이 구성에 의해 영향을 받습니다.","타우린은 심장 기능 조절에서 핵심적 역할을 하며, 결핍 시 확장형 심근병증(dilated cardiomyopathy) 발생 위험이 증가합니다. 이 외에도 시신경, 중추신경계, 생식기관의 기능 유지 및 지방 대사 조절에 관여합니다. 특히 고령 개, 임신·수유 중인 개, 운동량이 많은 작업견에서는 타우린 요구량이 증가하여 식이 보충이 권장됩니다.","한국 동물병원 실무에서 고려해야 할 점은 개의 품종별 특성과 생활습관에 맞춘 영양 전략의 필요성입니다. 특히 대형견 번식자에게 타우린 보충의 중요성을 안내하고, 심장질환 임상 징후가 있는 개에서 타우린 농도 검사를 고려해야 합니다. 이 논문은 맞춤형 기능성 사료 개발과 예방수의학 관점의 영양 관리 방향을 제시합니다."],"blog":"국내 대형견 사육자 및 번식자를 대상으로 '심장질환 예방을 위한 타우린 영양 관리' 주제로 교육 캠페인 콘텐츠로 활용할 수 있습니다.","blogAngle":["타우린은 개의 조건부 필수 아미노산으로 심장, 신경, 시각, 지방 대사 조절에 관여합니다.","품종과 체구에 따른 타우린 대사 차이로 인해 대형견에서 확장형 심근병증 발생 위험이 높아집니다.","고령 개, 임신·수유 개, 작업견에서는 생리적 요구량 증가로 외인성 보충이 필요합니다.","개의 타우린 영양 관리는 예방수의학과 기능성 사료 전략의 핵심 영역으로 부상하고 있습니다."],"radar":{"owner":{"soon":true,"q":"대형견인데 심장건강을 위해 타우린 보충제를 줘도 될까요?","script":"타우린은 심장 근육 기능에 중요한 영양소이지만, 모든 개에게 무조건 보충이 필요한 건 아닙니다. 특히 대형견은 자체 합성 능력이 부족하여 식이 보충이 권장되기도 하지만, 현재 심장질환이 있는지가 중요합니다. 정확한 것은 심장 초음파와 혈액검사 등 진료를 통해 확인하는 것이 맞아요."},"clinical":"심장질환 임상 징후가 있는 개(특히 대형견)에서 타우린 농도 검사 실시 여부 점검, 대형견 번식 고객에게 예방적 영양 안내 시행","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_6","legacySlug":null,"day":"2026-07-24","ts":1784617200000,"publishedAt":"2026-07-21T07:00:00.000Z","cat":"clinical","kicker":"임상","isToday":false,"title":"신대륙 파리유충 미국 확산... 동물병원 경고","dek":"미국 농무부APHIS가 신대륙 파리유충(NWS) 대유행 확산에 따른 긴급 경고를 발령했습니다. 이 기생 파리는 온혈동물의 상처에 알을 낳아 유충이 조직을 파고드는 치명적 질환입니다.","source":"aphis.usda.gov","country":"","date":"07.21","read":"1분 읽기","plate":"aphis.usda.gov","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigAFBVV95cUxNcnp4eEc5X1JGV3llb18xS1hMekV6bXNSWjhDWjhIb2d0ZnlEaExqalh6WTAwMV9xYzJSNFZoeDJFZmdOYmJ2WGt3RXBrbkZKYmc1ckF1aVFBNjRNX2Jpbm0taWRLeGR3MWN1czFiQVg2UXA1ZnhnWWIwTm5sZDFjeA?oc=5","body":["신대륙 파리유충은 파리목(Oestridae)과에 속하는 Cochliomyia hominivorax종의 유충으로, 따뜻한 피부를 가진 포유류의 상처에 기생합니다. 암 파리는 열린 상처에 수백 개의 알을 낳으며, 부화한 유충은 조직을 뚫고 들어가는 특성이 있습니다. 20세기 중반 미국과 중앙아메리카 지역 근절 프로그램의 성과를 이루어내었으나, 최근 Fla주에서 확인되면서 확산 우려가 커지고 있습니다.","최근 Fla주에서 야생 동물의 상처에서 신대륙 파리유충이 검출되면서 농축산 업계에 경고음이 울리고 있습니다. 이 파리는 소, 양, 돼지 등 가축뿐만 아니라 개, 고양이 등 애완동물과 인간에게도 감염될 수 있으며, 치료하지 않을 경우 사망에 이를 수 있습니다. 현재 Fla주 남부 지역을 중심으로 조기 경보가 발령되었으며, 인근 주들은 검역 강화에 나섰습니다.","한국 동물병원에서도 최근 해외 여행 이력이 있는 동물이나 수입 동물을 진료할 때 주의를 기울여야 합니다. 특히 귀, 코, 눈 주위의 상처를 입체적으로 검사하고, 유충 발견 시 원문 참고 수준의 처치와 함께 관련 기관에 보고해야 합니다. 앞으로 중소 동물병원에서도 이 기생충에 대한 인식 제고가 필요합니다."],"blog":"한국 동물병원 블로그에서는 '최근 미국서 대유행한 신대륙 파리유충, 국내에서는?'이라는 제목으로 해외 여행 반려동물의 상처 관리 점검법을 다룬다면 좋은 콘텐츠가 됩니다.","blogAngle":["신대륙 파리유충은 온혈동물의 상처에 기생하여 조직을 파고드는 치명적 기생충입니다.","Fla주에서 야생 동물 감염이 확인되어 미국 전역에 긴급 경보가 발령되었습니다.","감염 시 상처 세척, 유충 제거, 항생제 투여 등 집요한 관리가 필요하며, 원문 참고 수준의 처치가 요구됩니다.","해외 여행 이력이 있는 동물을 진료할 때 이 파리유충 가능성도 고려해야 합니다."],"radar":{"owner":null,"clinical":"수입 동물이나 해외 여행 이력이 있는 동물의 상처 진료 시 신대륙 파리유충 가능성을 고려하고, 특히 귀·코·눈 주위 상처를 주의 깊게 검사하세요.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_7","legacySlug":null,"day":"2026-07-24","ts":1784753879000,"publishedAt":"2026-07-22T20:57:59.000Z","cat":"practice_management","kicker":"병원 경영","isToday":false,"title":"AAVSB, 미국 수의진료보조 자격시험 개발 담당","dek":"미국 수의사국면허평가위원회(AAVSB)가 수의진료보조(VPA) 자격시험 개발을 맡게 되었습니다. 이는 미국 전역에서 수의진료보조 종사자의 자격 기준을 통일하기 위한 법적 요구에 따른 것입니다.","source":"DVM360","country":"","date":"07.23","read":"1분 읽기","plate":"DVM360","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMigwFBVV95cUxOWjJXcjlYU3Y0ajEyVHdaUGlVdm5aZHB5aVhxTzQtRGNCYzNaNjd0ZUlDMTgzeHBBNjMyNGVheWNMRWFWeTBzUC1aNDdId0hZR1VNRDNRLW1maWhEYXhrQTVHTm1sNmctS3J3OVpacHlPQV9WeldwdGRqYWFpUGJ2UVh4VQ?oc=5","body":["미국에서는 주별로 수의진료보조의 면허 요건이 상이하여, 일부 주에서는 별도의 면허나 자격증이 필수인 반면 다른 주에서는 경험만으로 업무를 수행할 수 있었습니다. 이러한 불균형은 종사자들의 이직 장벽이 되고, 소비자 보호 측면에서도 우려가 제기되어왔습니다. 이를 해결하기 위해 전국 단위의 통일된 자격 시험 체계가 필요하게 되었습니다.","AAVSB는 이미 수의사 면허 시험(NBE)을 운영하는 경험이 있는 기관으로, VPA 시험 개발을 통해 수의진료보조 종사자들의 전국 상호 인정 가능성을 모색하고 있습니다. 시험 개발 과정에는 기술표준 설정, 항목 개발, 검증 단계가 포함될 예정이며, 각 주별로 자발적으로 채택할 수 있는 구조로 운영될 것입니다.","한국 동물병원 입장에서는 수의진료보조 인력 양성과 자격 관리 체계에 대한 논의가 필요한 시점입니다. 미국에서 진행 중인 이러한 전국 표준화 노력은 한국에서도 참고할 만한 사안이며, 특히 동물 의료 서비스 품질 보장 측면에서 자격 기준의 중요성이 부각될 수 있습니다."],"blog":"한국 동물병원 블로그에서는 '수의진료보조 자격, 어디까지 체계화해야 하는가'라는 제목으로 미국 사례를 소개하며 한국의 인력 자격 관리 방향을 논의하는 글이 될 수 있습니다.","blogAngle":["AAVSB가 수의진료보조(VPA) 국가 자격시험 개발을 담당하게 되었습니다","미국 내 주별 면허 요건 차이로 인해 전국 상호 인정의 필요성이 대두되었습니다","AAVSB는 기존 수의사 면허 시험 운영 경험을 바탕으로 시험 개발을 진행합니다","한국에서도 수의진료보조 인력의 자격 표준화 논의가 필요할 수 있습니다"],"radar":{"owner":null,"clinical":"한국 동물병원에서도 수의진료보조 인력의 자격 기준과 교육 체계 정립 가능성을 검토할 시점입니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_8","legacySlug":null,"day":"2026-07-24","ts":1784797662000,"publishedAt":"2026-07-23T09:07:42.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"동물병원 진료비 상승 이유와 대처법","dek":"미국 샌안토니오에서 동물병원 진료비가 지속적으로 상승하고 있습니다. 경기 침체에도 동물 의료비가 올라가는 배경에는 어떤 이유가 있을까요.","source":"San Antonio Express-News","country":"","date":"07.23","read":"1분 읽기","plate":"San Antonio Express-News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMijgFBVV95cUxNWTFMNV90MXBNYkgzUnV0Mkg4cFN6V1UwdnJla0JpSXI5RU5jZlhWRXhKN1JxTjMwTWJmZ0hiLU5ZYXdMRlpBMHpHa2tzeVVTMS1GQURUa0dkaWdlZHZ4VVI1QjdUVWh4NmhEUVBVT1k0VVR3UDlMdDUwdGhIS01uX2hJdF9OZEJJTUtodEpB?oc=5","body":["최근 미국 동물병원 업계에서는 진료비 상승이 큰 화제입니다. 샌안토니오 지역뿐만 아니라 전국적으로 동물 의료 비용이 증가하고 있으며, 이는 단순한 물가 상승만으로는 설명할 수 없습니다. 동물 의료 기술의 발전과 함께 동물병원 운영에 필요한 다양한 비용이 크게 상승했습니다.","진료비 상승의 주요 원인으로 분석되는 것은 직원 인건비, 약품 및 의료용품 비용, 그리고 시설 유지비입니다. 특히 동물병원 종사자의 최저임금 상승과 수의사 보조 인력 부족으로 인한 급여 경쟁이 비용 상승의 핵심 요인으로 작용합니다. 또한 고급 의료 장비 도입과 최신 치료법 도입으로 초기 투자 비용이 증가했으며, 이는 진료비에 반영되고 있습니다.","한국 동물병원들도 이러한 추세를 참고할 필요가 있습니다. 진료비 상승에 대해 동물 보호자들에게 투명하게 설명하고, 비용 구조를 공유하는 것이 신뢰 구축에 도움이 됩니다. 또한 운영 효율화 방안을 모색하고, 환자 당 진료 시간을 최적화하는 것이 중요합니다. 궁극적으로 진료비 상승을 서비스 품질 향상의 기회로 삼아야 합니다."],"blog":"한국 동물병원 블로그에 '진료비 상승의 진짜 이유와 우리 병원만의 차별화 전략'이라는 제목으로 글을 쓸 수 있습니다","blogAngle":["미국 동물병원에서 직원 인건비와 약품 비용 상승이 진료비 상승의 주요 원인으로 작용하고 있습니다","동물 의료 기술 발전과 고급 장비 투자 비용이 진료비에 반영되고 있습니다","동물병원 보조 인력 부족으로 인한 급여 경쟁이 비용 상승을 가중시키고 있습니다","한국 동물병원들은 진료비 상승에 대해 투명하게 소통하고 운영 효율화를 모색해야 합니다"],"radar":{"owner":{"soon":true,"q":"왜 동물병원 진료비가 이렇게 많이 올라가는 건가요?","script":"진료비 상승에는 직원 인건비, 약품 비용, 최신 장비 도입 등 여러 비용이 영향을 합니다. 그래도 우리는 항상 최선의 진료를 제공하려 노력하고 있습니다."},"clinical":"한국 동물병원에서도 진료비 상승 원인을 보호자에게 투명하게 안내하고, 운영 효율화와 진료 시간 최적화를 점검할 것.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_9","legacySlug":null,"day":"2026-07-24","ts":1784751298000,"publishedAt":"2026-07-22T20:14:58.000Z","cat":"career","kicker":"커리어","isToday":false,"title":"수의병리학 위기, AI 진단 시대 지속 가능한 모델 필요","dek":"수의 임상병리학자들이 급여 압축과 고볼륨 업무 환경으로 인한 번아웃을 경험하고 있습니다. AI 진단 기술이 '있으면 좋은' 진단에서 '필요 없는' 진단으로 변화를 이끌어낼 수 있다는 우려가 제기되고 있습니다.","source":"Dr. Andy Roark","country":"미국","date":"07.23","read":"2분 읽기","plate":"Dr. Andy Roark","image":null,"sourceUrl":"https://drandyroark.com/cry-for-help-from-pathology/","body":["수의 임상병리학 현장은 최근 어두운 상황을 겪고 있습니다. Dr. Eric Fish에 따르면, 임상병리학자들의 급여 압축이 심화되어 전문 병리학자가 신입 가정의학과 수의사보다 적게 버는 현상이 나타나고 있습니다. 또한 실험실 시장 Consolidation으로 가격이 하락하고, 디지털화가 세포검사를 포인트오브케어 고볼륨 workflow로 전환하면서 케이스당 보너스가 8~12달러까지 떨어지는 상황입니다.","병리학자들은 단순한 검사진행자가 아닌 의학적 고문을 제공하는 상담 전문가의 역할을 강조합니다. 그러나 현재 디지털화와 자동화 흐름은 검사를 빠르게 처리하는 '돌아다니며 태우는' 작업으로 전락하고 있으며, 비용과 턴어라운드 시간 압박으로 세포검사의 가치가 점점 떨어지고 있습니다. 이러한 변화로 인해 상담 실험실 의학이 내과 전문의로 이동하고 있는 현실입니다.","한국 동물병원 관점에서 보면, AI 진단 도구가 보편화될 경우 외부 검체 분석 의뢰 구조에 변화가 올 수 있습니다. 그러나 최종 의학적 판단에는 여전히 인간 병리학자의 역할이 필수적이며, AI가 병리학자를 대체하기보다는 증례 분류와 선별 작업을 도와주는 보완 도구로 활용되는 미래가 이상적입니다. 한국의 수의사들도 이러한 기술 변화에 대응하며 전문성의 가치를 인식하고 강화해야 합니다."],"blog":"한국 동물병원에서도 AI 진단 도입 시 전문병리학자의 역할을 어떻게 보존하고 강화할 것인지에 대한 논의가 필요하며, 이는 향후 수의의료 품질 유지를 위한 핵심 과제가 될 것입니다","blogAngle":["수의 임상병리학자들의 급여 압축이 심화되어 전문 병리학자가 신입 수의사보다 적게 버는 현상이 발생하고 있습니다","디지털화와 고볼륨 workflow 전환으로 케이스당 보너스가 8~12달러까지 하락했습니다","AI 기술이 '있으면 좋은' 진단에서 '필요 없는' 진단으로 전환될 가능성에 대한 우려가 제기됩니다","상담병리학의 가치는 검사와 해석의 결합에 있으며, AI는 인간 전문가를 대체하지 않고 보완하는 방향으로 발전해야 합니다"],"radar":{"owner":null,"clinical":null,"evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_10","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"clinical","kicker":"임상","isToday":false,"title":"구제역 바이러스 3D 단백질이 네크로프토시스 유도 — RIPK3 경로 활성화 확인","dek":"중국 간쑤 농업대학교 연구팀이 구제역(FMD)바이러스가 숙주 세포에서 RIPK3/MLKL 경로를 통한 네크로프토시스를 유도한다는 사실을 발견했습니다. 특히 비구조 단백질 3D가 RIPK3와 직접 상호작용하여 이 경로를 활성화하는 것이 확인되었습니다.","source":"Frontiers in Veterinary Science","country":"","date":"07.24","read":"2분 읽기","plate":"Frontiers in Veterinary Science","image":"https://d2csxpduxe849s.cloudfront.net/media/E32629C6-9347-4F84-81FEAEF7BFA342B3/72F1DABB-FDF2-445B-A224B93D812926F9/F0B31557-8D28-4052-957B14963A316F59/WebsiteWebP_XL-FVETS_Main Visual_Green_Website.webp","sourceUrl":"https://www.frontiersin.org/journals/veterinary-science/articles/10.3389/fvets.2026.1872229/full","body":["구제역(FMD)은 구제역바이러스(FMDV)에 의해 발생하는 고감염성 전염병으로, 상피세포에서 수포성 병변을 유발할 뿐 아니라 심근과 골격근 조직에서도 증식하여 심근염을 일으키고 감염 동물에서 치명적 결과를 초래할 수 있습니다. RIPK3/MLKL 매개 네크로프토시스는 바이러스 감염에서 중요한 역할을 하는 전염성 세포 사멸 과정입니다.","연구팀은 PK-15 세포와 BHK-21 세포에서 FMDV 감염이 RIPK3/MLKL 경로를 활성화하고 네크로프토시스를 유도하는지 분석했습니다. GSK'872(RIPK3 인산화 저해제)와 NSA(MLKL 인산화 저해제)를 사용한 저해 실험에서 RIPK3 또는 MLKL 인산화를 억제하면 FMDV VP1 발현과 바이러스 역가가 유의하게 감소하였으며, 이는 네크로프토시스 경로가 FMDV 증식을 촉진함을 나타냅니다. 또한 Co-면역침강 분석과 AlphaFold3 구조 예측을 통해 비구조 단백질 3D가 RIPK3의 RHIM 영역과 직접 결합하며, 3D의 R320, H322, E324, Y346 잔류구가 RIPK3의 N466, V469, K471 잔류구와 상호작용함을 확인했습니다.","한국 동물병원 관점에서 이 발견은 구제역의 발병 메커니즘 이해에 새로운 시각을 제공합니다. 네크로프토시스가 바이러스 증식을 촉진한다는 사실은 향후 항바이러스 전략 수립 시 세포 사멸 경로를 표적으로 하는 접근 가능성을 열어줍니다. 또한 구제역은 소, 돼지, 양 등 가축에서 대규모 경제적 손실을 초래하는 질병으로, 이번 연구 결과는 한국 가축 축산업의 질병 관리 및 방제 정책 수립에도 참고가 될 수 있습니다."],"blog":"한국 동물병원 블로그에서는 '가축 질병의 세포 수준 발병 기전' 또는 '구제역 최신 연구 동향' 제목으로 이 내용을 다뤘을 때, 수의학과 학생이나 축산농가에게 전문적이면서도 접근하기 쉬운 콘텐츠가 될 수 있습니다.","blogAngle":["FMDV 감염이 PK-15와 BHK-21 세포에서 RIPK3/MLKL 경로를 활성화하여 네크로프토시스를 유도합니다.","비구조 단백질 3D가 RIPK3와 직접 상호작용하여 네크로프토시스 경로를 활성화하는 핵심 단백질임이 확인되었습니다.","RIPK3 또는 MLKL 인산화를 억제하면 바이러스 VP1 발현과 역가가 감소하여 네크로프토시스가 바이러스 증식을 촉진함을 보여줍니다.","AlphaFold3 예측 결과, 3D 단백질의 R320, H322, E324, Y346 잔류구가 RIPK3의 RHIM 영역과 결합합니다."],"radar":{"owner":null,"clinical":"구제역은 소, 돼지, 양 등 가축 질병이므로 개·고양이 진료 중심 한국 동물병원에 직접적인 임상 적용은 없으나, 연구 동향으로서 주목할만합니다.","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_11","legacySlug":null,"day":"2026-07-24","ts":1784643870000,"publishedAt":"2026-07-21T14:24:30.000Z","cat":"client_communication","kicker":"보호자 소통","isToday":false,"title":"노령 개·고양이 건강 관리, 수의사가 전하는 핵심 팁","dek":"노령 동물들의 건강 관리는 젊은 시절과 다른 접근이 필요합니다. 수의사가 경험에서 우러난 실질적인 관리법을 소개합니다.","source":"Yahoo Creators","country":"","date":"07.21","read":"1분 읽기","plate":"Yahoo Creators","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMiyAFBVV95cUxOdmp2MVczcTlZQy1xanZoZzJQWjAwQ1JCbndMekpRSDA1OXo4cnpPVi0tQVR4dDZUSy13YnJfcUM5ZlFyalBUa0duUlhIdHhTMW5yUFVCMU9NX1RDWl9sNzl6VzZ2VGltalZZdjdrWWhpRVFWQ1MtVF8yMkU4cGhjU2FnRm1JZnBfRFlFb1VBbnFHVVUyYkhWdXJuVTdmaUEwcEI4cWJDaHRha080WkV1SW1jZnRwRWkzejVicURHbS1BSFd4cVdLTg?oc=5","body":["노령 동물은 젊은 시절보다 신체 기능이 점차 저하됩니다. 관절염, 치아 질환, 신장 기능 저하 등이 흔하게 나타납니다. 정기적인 건강 검진을 통해 조기 발견과 관리가 중요합니다.","식이 관리도 노령 동물의 건강을 좌우하는 핵심 요소입니다. 연령에 맞는 영양 공급과 체중 관리가 필요합니다. 수분의 섭취량과 배변 상태도 일상적으로 확인하는 것이 좋습니다.","우리 병원에서는 노령 동물들의 삶의 질 향상을 위한 맞춤 관리를 권장합니다. 환경 조정, 적절한 운동, 스트레스 최소화 등이 중요합니다. 보호자분의 세심한 관찰과 수의사와의 정기적인 소통이 건강을 지탱하는 힘이 됩니다."],"blog":"한국 동물병원 블로그에 '노령 동물 진료 경험담'으로 전개하면 읽을만합니다","blogAngle":["노령 동물은 정기적인 건강 검진이 젊은 시절보다 더욱 중요합니다","식이 요법과 영양 관리가 건강 유지의 핵심입니다","일상적인 배변·배뇨 상태 관찰이 질병 발견에 도움이 됩니다","환경 조정과 스트레스 관리가 삶의 질을 향상시킵니다"],"radar":{"owner":{"soon":true,"q":"노령 강아지·고양이 건강 관리에는 어떤 점들을 특히 주의해야 하나요?","script":"노령 동물은 젊은 시절과 달리 신체 기능이 점차 저하되어 관절염, 치아 질환, 신장 기능 저하 등이 흔하게 나타납니다. 정기적인 건강 검진을 통해 조기 발견과 관리가 중요하며, 연령에 맞는 영양 공급과 체중 관리, 수분 섭취량 및 배변 상태 확인도 일상적으로 점검해 주세요."},"clinical":"노령 동물 건강 검진 프로토콜에 관절·치아·신장 기능 검사 항목 확대 적용 검토","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_12","legacySlug":null,"day":"2026-07-24","ts":1784835195000,"publishedAt":"2026-07-23T19:33:15.000Z","cat":"career","kicker":"커리어","isToday":true,"title":"수의대 커뮤니티 메디슨, 지역에서 동물과 사람 만나","dek":"미국 수의대들의 지역사회 의료 프로그램이 가정없거나 저소득 가정의 동물들에게 직접 찾아가는 서비스로 발전하고 있습니다. 이는 동물 건강 접근성 확대와 수의사 인력 확보의 새로운 방향으로 주목받고 있습니다.","source":"American Animal Hospital Association - A…","country":"","date":"07.24","read":"1분 읽기","plate":"American Animal Hospital Association - A…","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMi0wFBVV95cUxPcHplcFVEMFJlX3pfeEdrSnZHVjd6eFhTUU9kUWxxNXV5SDlXMHVXWHd0aHhydFBmRElUTFB0djhSSlNacVBQcGlCU1VhNVdRQ2pCUVRueXc2SVM4b05KUHlxMUlIanNSN2NHd2V4a2lTRlV2STFmblpiUnM2S2Jid09VRGJfaFJlWk0zb0lkUE85SVhMREJaRG96WmRPUnd3VnZSOW1nTENXdWVJRHdQRURoaFVLMlBydWpLenp6V2pZQW5FSFFKTUUwTmdnVzlYbXg0?oc=5","body":["미국의 여러 수의대에서는 전통적인 병원 중심 의료에서 벗어나 지역사회로 나가는 Shelter Medicine 및 Community Medicine 프로그램을 강화하고 있습니다. Cornell 대, Colorado State 대, Texas A&M 대 등은 가정없거나 저소득 가정의 동물들에게 무료 또는 저렴한 의료 서비스를 제공하는 프로그램을 운영하며, 동물과 사람의 welfare를 동시에 향상시키는 것을 목표로 하고 있습니다.","이러한 프로그램은 단순한 진료 제공을 넘어 수의대 학생들에게 실제 지역사회에서 복합적인 문제를 다루는 경험을 제공합니다. 학생들은 동물 유기, 주거 불안정, 경제적 궁핍 등 다양한 사회적 요인이 동물 건강에 미치는 영향을 직접 배우게 되며, 이는 졸업 후 다양한 환경에서 일하는 데 필요한 역량을 키우는 데 도움이 됩니다.","한국의 동물병원 입장에서도 시사하는 바가 큽니다. 한국의 경우에도 동물 복지와 함께 발생할 수 있는 사회적인 문제들이 증가하고 있으며, 지역 사회 중심의 의료 서비스 모델에 대한 관심이 높아지고 있습니다. 수의대 교육에서 이러한 접근을 도입하거나 동물병원 차원에서 지역사회 협력 프로그램을 검토하는 것이 미래 방향이 될 수 있습니다."],"blog":"한국 동물병원 블로그에서 '지역 사회 동물 의료의 가능성'이라는 제목으로 한국의 동물 복지 문제와 병원 차원의 지역사회 참여 방안을 논의하는 글로 전개할 수 있습니다.","blogAngle":["미국 주요 수의대들이 지역사회 동물 의료 프로그램을 확대하며 가정없고 저소득 가정의 동물들에게 직접 서비스를 제공하고 있습니다.","학생들이 지역사회에서 복합적인 사회적 문제를 경험하며 실전 역량을 키울 수 있는 교육적 가치를 제공합니다.","프로그램은 동물 건강 증진과 함께 인류의 welfare까지 고려하는 포괄적 접근을 추구합니다.","한국 동물병원에서도 지역사회 협력 모델에 대한 검토와 논의가 필요한 시점입니다."],"radar":{"owner":null,"clinical":"지역사회 기반 동물 의료 서비스 모델에 대한 검토 및 동물 복지 관련 사회적 문제 인식을 진료 현장에 반영할 것","evidence":null},"tag":"","tier":"deep"},{"id":"2026-07-24_13","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 정자 선별용 마이크로플루idik 시스템 실용성 평가","dek":"개의 정자 선별을 위한 ZyMöt 마이크로플루idik 시스템을 평가한 결과, 현재 프로토콜에서는 적용이 불가능하다는 결론에 도달했습니다.","source":"Reproduction in domestic animals","country":"","date":"07.24","read":"1분 읽기","plate":"Reproduction in domestic animals","image":null,"sourceUrl":"https://doi.org/10.1111/rda.70284","body":["본 연구는 6마리 개에서 채취한 정액 시료를 대상으로 ZyMöt 시스템을 활용한 정자 선별의 가능성을 평가했습니다. 컴퓨터 보조 정자 분석(CASA)과 세포 흐름 분석법 등 기본 및 고급 정액 분석 방법을 적용하여 정자 생존률, 형태, 운동성, 세포막 무결성,acrosome 무결성, 미토콘드리아막 전위 등을 분석했습니다.","연구 결과, ZyMöt 멤브레인은 사망하거나 운동성이 낮은 정자, 기형 정자를 유지할 수 있는 것으로 나타났습니다. 그러나 선별된 정자 집단에서 평가된 모든 매개변수의 유의미한 개선이 관찰되지 않았습니다. 또한 선별 과정에서 상당한 수의 정자 손실이 발생했습니다.","한국 동물병원 임상 관점에서, 이 시스템은 현재 개발된 프로토콜으로는 개의 생식 의료에 적용하기 어렵다는 한계가 있습니다. 단 6마리 개만 대상으로 했고 단일 기관 후향적 연구이므로, 더 많은 표본 수와 다양한 프로토콜을 통한 추가 연구가 필요합니다. 정자 선별 기술은 계속 발전하고 있으므로, 향후 개 특유의 생리적 특성에 맞는 마이크로플루idik 방법 개발이 기대됩니다."],"blog":"개의 불임 치료나 인공수정 시 newest 정자 선별 기술을 기대하셨다면, 아직 현실적으로 적용하기 어려운 상태입니다. 수의사와 상담하여 각 치료법에 맞는 최선의 방법을 선택하세요.","blogAngle":["6마리 개 정액 시료를 대상으로 ZyMöt 시스템을 평가했습니다.","ZyMöt 멤브레인은 사망·저운동성·기형 정자를 제거할 수는 있었지만, 선별된 정자 집단에서 유의미한 개선이 없었습니다.","선별 과정 중 상당한 총 정자 수 손실이 발생했습니다.","현재 프로토콜에서는 개의 정자 선별에 ZyMöt 시스템 적용이 불가능합니다."],"radar":{"owner":null,"clinical":"정자 선별 기술의 한계를 인지하고, 번식 관리 시 정자 분석 프로토콜을 면밀히 점검하며 신기술 도입 시 신중하게 평가할 것","evidence":{"design":"단일 기관 후향적 연구","n":"개 6마리","stars":2,"note":"표본 수가 6마리로 매우 적어 결과의 일반화에 주의가 필요하며, 추가 연구가 필요하다"}},"tag":"","tier":"deep"},{"id":"2026-07-24_14","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"임신 말기 암컷 개에서 아디슨 위기로 오인된 응급 상황","dek":"임신 말기 Golden Retriever에서 아디슨 위기 증상과 유사한 전기질양, 고칼륨혈증을 보인 사례를 보고하며, 생후 수일 내 사망한 강아지들에서 폐 미성숙이 확인되었습니다.","source":"Veterinary medicine and science","country":"","date":"07.24","read":"2분 읽기","plate":"Veterinary medicine and science","image":null,"sourceUrl":"https://doi.org/10.1002/vms3.71078","body":["3세 된 임신 Golden Retriever가 배란 후 52일째 오심, 식욕 감퇴, 구토, 다뇨, 다음 증으로 내원하여 보존적 치료를 받았습니다. 2일 후 환축이 재입원하여 복부 팽윤, 혈변 등이 나타났고, 혈액 검사에서 재생성 경미한 빈혈, Neutrophilia, 대사성 산증, 저칼슘혈증, 저나트륨혈증, 고칼륨혈증, Na:K 비율 24:1을 보여 아디슨 위기가 의심되었습니다.","다음 날 기초 코르티솔은 참고 Range의 상한값보다 약간 높았고, 환축 상태 악화로 덱사메타손을 투여한 후 배란 후 57일차 제왕절개를 시행하여 11마리의 강아지가 Apgar 점수 8-9/10으로 출산되었습니다. 수술 후 환축은 즉시 악화되어 4일간 집중 치료를 받았고, 수술 2일 후 ACTH자극검사 결과 아디슨병은 확인되지 않았습니다. 초기 Apgar 점수가 양호했음에도 10마리의 강아지가 사망하였고, 부검 결과 8마리에서 폐성숙이 canalicular 단계에 머물러 폐 미성숙이 확인되었습니다.","본 사례는 임신 말기 암컷에서 아디슨 위기를 임상적으로 닮은 상황의 감별이 필요하며, 특히 다량 수액 요법과 glucocorticoid 투여로 인한 조기 출산 가능성을 고려해야 함을 시사합니다. 또한 모체의 glucocorticoid 투여로 인한 신생아 폐 성숙 유도는 신뢰할 수 없으며, 이는 한국 동물병원에서 임신 동물 응급 관리 시 중요한 참고점이 됩니다."],"blog":"임신 말기 개에서 구토, 무력감, 다뇨 등이 나타나면 아디슨 위기뿐 아니라 자궁 내 감염이나 태아 문제를 의심하고 신속한 혈액 검사와 초음파 검사가 필요하며, 특히 조기 출산이 예상되는 경우 신생아 폐 성숙 여부를 평가하는 것이 중요합니다.","blogAngle":["임신 말기 암컷에서 오심, 구토, 저나트륨혈증, 고칼륨혈증 등 아디슨 위기 유사 증상이 나타날 수 있으며, 이는 Addison병이 아닐 수도 있습니다.","ACTH자극검사상 아디슨병이 확인되지 않았으나, 임상 증상과 혈액 소견이 아디슨 위기를 강력히 시사하는 소견을 보였습니다.","11마리 중 1마리만 생존하였고, 사망한 10마리의 부검에서 폐 성숙이 canalicular 단계에 머물러 있어 폐 미성숙이 주된 사망 원인이었습니다.","모체에 glucocorticoid를 투여했음에도 신생아 폐 성숙을 유도하지 못해, 조기 출산 시 강아지 생존율이 낮을 수 있음을 보여줍니다."],"radar":{"owner":{"soon":true,"q":"임신 말기에 오심, 구토, 다뇨 이런 증상이 나타나면 아디슨병인가요?","script":"아디슨과 비슷한 증상이 나타나도 임신 말기에는 다른 원인이 있을 수 있습니다. 수액 요법이나 스테로이드 투여로 인해 조기 출산이 유도될 수 있고, 모체에게 투여한 스테로이드가 강아지 폐 성숙을 보장하지는 않습니다."},"clinical":"임신 말기 암컷에서 아디슨 유사 증상 감별 시 수액·스테로이드 투여로 인한 조기 출산 가능성을 고려하고, 신생아 폐 성숙 유도에 의존하지 않도록 한다.","evidence":{"design":"증례보고","n":"개 1마리 및 강아지 11마리","stars":1,"note":"단일 증례로 일반화 어려우며, 특정 사례에 국한될 수 있다"}},"tag":"","tier":"deep"},{"id":"2026-07-24_15","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 요로감염 원인균의 다제내성 실태","dek":"브라질 리우데자네이루 지역 고양이 요로감염에서 다제내성균이 55.8%에 달함을 확인했습니다. 이는 경험적 항생제 사용의 한계를 보여주며 소변 배양검사의 필요성을 뒷받침합니다.","source":"Veterinary research communications","country":"","date":"07.24","read":"2분 읽기","plate":"Veterinary research communications","image":null,"sourceUrl":"https://doi.org/10.1007/s11259-026-11415-w","body":["본 연구는 2020년부터 2024년까지 브라질 리우데자네이루 지역 고양이 요로감염 환자로부터 분리된 448개 균주를 대상으로 세균학적 역학 및 항생제 내성 양상을 분석했습니다.Disk diffusion법을 실시하였으며 CLSI VET01S와 BrCAST 기준을 적용하여 내성을 판정했습니다.","주요 분리균은 대장균(45.1%), 프로테우스속(16.3%), 클레bsiella속(12.5%)이었습니다.ISCAID 가이드라인에서 1차 선택약으로 권장되는 항생제에 대한 내성이 높아서, 대장균의 경우 트리메토프림-설파메톡사조르(57.2%), 세팔렉신(52.5%), 아목시실린-클라불산(43.9%)에서 높은 내성률을 보였습니다.베테리나리 플루오로퀴놀론(에노록사신 28.5%, 마보플록사신 20.9%)은 중간 수준의 내성이었으며, 니트로푸란토인 내성은 37.7%였습니다.3세대 세팔로스포린과 카바페넴은 가장 높은 활성을 유지했습니다(세프타지딤 13.2%; 메로페넴 0%).전체 균주의 55.8%에서 다제내성이 관찰되었으며, 프로테우스속(79.5%)과 대장균(57.9%)에서 가장 높았습니다.","한국 동물병원 임상 관점에서 본 연구의 시사점은 첫째, 경험적 항생제 선택 시 기존에 생각하던 것보다 내성률이 높을 수 있다는 점입니다.둘째, 중증 사례에서는 소변 배양 및 감수성 검사를 먼저 실시하는 것이 치료 실패를 줄일 수 있습니다.본 연구는 단일 지역 후향적 분석이라는 한계가 있으나, 한국에서도 고양이 요로감염 원인균의 내성 양상 모니터링이 필요함을 시사합니다."],"blog":"고양이 요로감염이 생겼을 때 무조건 항생제를 먹이는 것이 아니라, 수의사의 검사를 받고 맞는 약을 선택하는 것이 고양이를 지키는 방법입니다.","blogAngle":["448개 균주 분석 결과 대장균이 45.1%로 가장 우세한 원인균이었습니다.","ISCAID 1차 선택약에 대한 대장균 내성률이 트리메토프림-설파메톡사조르 57.2%, 세팔렉신 52.5%로 매우 높았습니다.","전체 균주의 55.8%에서 다제내성이 확인되었고, 프로테우스속에서 79.5%로 가장 높았습니다.","3세대 세팔로스포린 내성은 대장균의 22.8%에서 검출되었으며, 5개 균주에서 카바페넴 내성이 확인되었습니다."],"radar":{"owner":{"soon":true,"q":"고양이 요로감염이 생기면 어떤 항생제를 사용해야 하나요?","script":"고양이 요로감염이 의심될 때 무조건 항생제를 시작하기보다는, 가능하면 소변 검사를 받아 원인균과 맞는 항생제를 확인하는 것이 좋습니다. 특히 재발하거나 중증인 경우엔 배양검사가 치료 성공률을 높일 수 있습니다."},"clinical":"고양이 요로감염 환축에서 경험적 항생제 사용 전 소변 배양 및 감수성 검사 실시 여부를 진료 프로토콜에 점검하고, 중증·재발 사례에서는 배양검사를 우선 고려합니다.","evidence":{"design":"단일기관 후향적 분석","n":"균주 448개","stars":2,"note":"브라질 리우데자네이루 단일 지역 연구로 한국의 내성 양상과 다를 수 있어 주의가 필요합니다."}},"tag":"","tier":"deep"},{"id":"2026-07-24_16","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"고양이 의인성 고혈칼슘증 및 급성 신장 손상, 혈액투석으로 성공적 치료","dek":"4세 고양이가 요도 폐쇄 진단 후 포도당산(글루콘산) 칼슘 과용으로 인한 의인성 고혈칼슘증과 급성 신장 손상을 발생하였으며, 혈액투석 치료를 통해 생존한 사례를 보고합니다.","source":"Journal of veterinary internal medicine","country":"","date":"07.24","read":"1분 읽기","plate":"Journal of veterinary internal medicine","image":null,"sourceUrl":"https://doi.org/10.1093/jvimsj/aalag142","body":["4세 수컷 고양이가 구토, 식욕 부진, 배뇨 이상으로 내원하여 요도 폐쇄로 진단받았습니다. 입원 후 포도당산(글루콘산) 칼슘 과용으로 인해 이온화 칼슘 4 mmol/L 이상(총 칼슘 57 mg/dL), 혈청 크레아티닌 9.81 mg/dL의 의인성 고혈칼슘증과 급성 신장 손상이 발생하였습니다. 입원 약 12시간 후 고양이는 혼수 상태에 빠지고 심혈관 불안정이 나타났습니다.","Prismaflex 플랫폼의 연속 정맥-정맥 혈액투석 여과 방식으로 6시간 혈액투석 치료를 실시하였습니다. 치료 중 고혈칼슘증이 해결되었고, 혈청 크레아티닌은 72시간 내에 1.01 mg/dL로 정상화되었습니다. 고양이는 입원 6일 후 퇴원하였습니다. 퇴원 후 상부 호흡기 및 위장관 질환 증상이 나타나, 상부 위장관 내시경 및 기관지경 검사에서 기관과 위 점막의 미만성 석회화가 확인되었습니다.","본 사례는 수의학에서 급성 신장 손상과 의인성 고혈칼슘증을 혈액투석로 성공적으로 치료할 수 있음을 보여주며, 장기적 후유증의 독특한 증거를 제공합니다. 그러나 단일 사례 보고이므로 일반화에 한계가 있습니다. 보호자에게 칼슘제 투약 시 용량을 정확히 확인하고, 고혈칼슘증 발생 시 신속한 치료의 중요성을 안내해야 합니다."],"blog":"고양이 요도 폐쇄 치료 후 칼슘제 과용으로 인한 고칼륨혈증과 신장 손상이 발생할 수 있음을 보호자에게 안내하고, 이러한 합병증 발생 시 신속한 혈액투석 치료가 생명을 구할 수 있다는 점을 설명하는 블로그 글을 작성할 수 있습니다.","blogAngle":["4세 수컷 고양이가 포도당산(글루콘산) 칼슘 과용으로 총 칼슘 57 mg/dL, 이온화 칼슘 4 mmol/L 이상의 고혈칼슘증과 크레아티닌 9.81 mg/dL의 급성 신장 손상을 발생하였습니다.","6시간 혈액투석 치료 후 고혈칼슘증이 해결되었고, 72시간 내 크레아티닌이 1.01 mg/dL로 정상화되어 입원 6일 후 퇴원하였습니다.","퇴원 후 시행한 내시경 및 기관지경 검사에서 기관과 위 점막의 미만성 석회화가 확인되어 장기적 후유증이 보고되었습니다.","단일 사례 보고로 일반화에 한계가 있으나, 혈액투석이 고양이의 의인성 고혈칼슘증 및 급성 신장 손상 치료에 효과적일 수 있음을 시사합니다."],"radar":{"owner":{"soon":true,"q":"고양이에게 칼슘 보충제를 줬는데 너무 많이 준 건 아닌지 불안합니다.","script":"의인성 고혈칼슘증은 전체 고혈칼슘증의 5% 미만을 차지하는 드문 합병증입니다. 보호자가 칼슘제나 영양 보충제를 복용시킬 때는 반드시 수의사의 처방과 지시를 따르 시기 바랍니다. 고양이에게 이상 증상이 나타나면 바로 내원해 주세요."},"clinical":"고혈칼슘증 입원 환자에서 칼슘제 투약량 재점검 권유","evidence":{"design":"증례보고","n":"고양이 1마리","stars":1,"note":"단일 사례 보고이므로 일반화에 한계가 있습니다."}},"tag":"","tier":"deep"},{"id":"2026-07-24_17","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"건강 고양이에서 베ξagliflozin 약동학, 경구 생체이용률 78%로 하루 1회 투여 적합","dek":"고양이 당뇨병 치료제인 bexagliflozin의 건강한 고양이에서의 약동학을 최초로 규명하여, 경구 투여 시 빠른 흡수와 높은 생체이용률, 하루 1회 투여에 적합한 반감기를 확인했습니다.","source":"Journal of veterinary pharmacology and t…","country":"","date":"07.24","read":"1분 읽기","plate":"Journal of veterinary pharmacology and t…","image":null,"sourceUrl":"https://doi.org/10.1111/jvp.70072","body":["본 연구는 건강한 성체 고양이 16마리를 대상으로 1mg/kg 정맥 주사 및 15mg 경구 투여(Bexacat)를 이주기 연구로 실시했습니다. 연구는 금식 상태에서 진행되었으며, 투약 후 72시간까지 연속적으로 혈장을 채취하여 LC-MS/MS 방법으로 분석했습니다.","정맥 투여 후 bexagliflozin의 혈장 클리어런스는 348mL/h/kg으로 낮았고, 말단 상 분포용적은 3.5L/kg, 정상상태 분포용적은 1.7L/kg이었습니다. 말단 반감기는 7.0시간이었습니다. 경구 투여 후 흡수는 신속하였으며(중앙 Tmax 1시간, 범위 0.5~4시간), Cmax는 1780ng/mL, 말단 반감기는 6.9시간이었습니다. 절대 생체이용률은 78%(90% 신뢰구간: 73%~83%)였으며, 수태기별 노출량은 유사했습니다.","임상적으로 bexagliflozin은 고양이 당뇨병에서 하루 1회 투여가 가능할 것으로 기대됩니다. 다만 본 연구는 건강한 고양이 16마리에서 단일 투여로 수행되어 실제 환자에서의 장기 투여 효과와 내약성은 추가 연구가 필요하며, 한국 동물병원에서 처방 시 이 점을 고려해야 합니다."],"blog":"고양이 당뇨병 보호자에게 bexagliflozin이 얼마나 잘 흡수되고 하루 한 번만 투여하면 되는 새 약물임을 설명하는 블로그 글 소재로 활용할 수 있습니다.","blogAngle":["정맥 투여 후 클리어런스는 348mL/h/kg, 반감기는 7.0시간입니다.","경구 투여 시 중앙흡수시간(Tmax)은 1시간, 최고혈중농도(Cmax)는 1780ng/mL입니다.","절대 생체이용률은 78%(90% 신뢰구간: 73%~83%)로 높습니다.","경구 투여 후 반감기가 6.9시간으로 하루 1회 투여에 적합합니다."],"radar":{"owner":{"soon":true,"q":"우리 고양이 당뇨병에 이 약 얼마나 자주 먹여야 하나요?","script":"연구에 따르면 하루에 한 번 복용하면 됩니다. 흡수가 빠르고 약효가 24시간 지속됩니다. 하지만 각 고양이의 상태가 다르므로, 구체적인 투약은 검사를 통해 확인해야 합니다."},"clinical":"임상 적용 전 실제 당뇨병 고양이에서 장기 투여 효과와 안전성을 추가로 확인해야 합니다","evidence":{"design":"비랜덤화 비교 시험(건강한 고양이 16마리)","n":"고양이 16마리","stars":2,"note":"단일 투여 연구로 건강한 고양이에서만 수행되어 실제 환자 적용 시 주의가 필요합니다"}},"tag":"","tier":"deep"},{"id":"2026-07-24_18","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"GnRH 차단Vaccine Improvac, 고양이 피임 효과 확인","dek":"성체 암고양이에 GnRH 백신 Improvac를 투여하여 발정 행동과 난소·자궁 조직 변화를 검토한 연구입니다. 외과적 불임수술 대신 피하 주사로 발정을 억제할 수 있는 가능성을 확인했습니다.","source":"Reproduction in domestic animals","country":"","date":"07.24","read":"2분 읽기","plate":"Reproduction in domestic animals","image":null,"sourceUrl":"https://doi.org/10.1111/rda.70268","body":["이 연구는 집단 사육된 성체 암고양이 12마리를 대상으로 Improvac의 임상적·생식 기능에 대한 효과를 조사했습니다. 처리군 9마리에는 0.5mL의 Improvac를, 대조군 3마리에는 식염수를 피하 주사했으며, 30일 간격으로 두 차례 투여했습니다. 발정은 행동 관찰과 질 세포학적으로 확인했으며, 처리군은 투약 후 120일, 270일, 330일에 난소자궁적출술을 시행하여 조직 검사를 실시했습니다.","대조군 모든 암고양이는 12~20일마다 발정 증상을 나타낸 반면, 처리군 9마리 중 7마리(77.8%)는 난소자궁적출술 시까지 발정 증상이 나타나지 않았습니다. 다만 2마리에서는 각각 10일과 45일 후 발정이 관찰되었습니다. 임상적·혈액학적·생화학적 수치는 정상 범위 내에 유지되었으며, vaccinated 투여 부위에 무통성 연조직 종괴가 발생했지만 연구 종료 시점에는 소실되었습니다. 조직학적으로 처리군에서 난소 여포 낭포와 자궁 내막 위축 변화가 관찰되었습니다.","한국 동물병원 임상에의 시사점은 외과적 불임수술(난소자궁적출술) 대신 비외과적 피임 선택지가 될 수 있다는 점입니다. 다만 표본수가 적고(처리군 9마리) 단일 기관 연구라는 한계가 있으며, vaccinated-associated 종괴의 장기적 예후와 일부 고양이에서 발정이 재현되는 현상에 대한 추가 연구가 필요합니다. 현재로서는 GnRH 차단 vaccinated가 기존 불임수술 대안으로 적합한지 판단하기에 아직 증거가 부족합니다."],"blog":"보호자들에게는 외과적 수술 없이도 고양이 발정을 조절할 수 있는 새로운 비외과적 피임법에 대한 최신 연구 소식을 전할 수 있습니다.","blogAngle":["처리군 9마리 중 7마리(77.8%)가 난소자궁적출술 시까지 발정 억제 상태를 유지했습니다.","임상·혈액·생화학적 수치는 정상 범위 내에 유지되어 단기적 안전성을 확인했습니다.","조직 검사상 난소 여포 낭포와 자궁 내막 위축이 관찰되었으며, vaccinated 투여 부위에 일시적 연조직 종괴가 발생했습니다.","대조군 3마리는 12~20일마다 규칙적인 발정 주기를 보였으나, 처리군 2마리에서는 vaccinated 투여 후에도 발정이 확인되어 100% 효과는 아니었습니다."],"radar":{"owner":{"soon":true,"q":"고양이도 수술 없이 주사로 피임할 수 있어요?","script":"현재 연구에 따르면 백신이 일부 고양이에서 발정을 억제할 수 있는 것으로 나타났습니다. 하지만 아직 증거가 부족하고, 일부 고양이에서는 효과가 없거나 다시 발정할 수 있습니다. 구체적인 방법은 수의사와 상담해 보세요."},"clinical":"표본수가 9마리로 너무 적으므로, 현재로서는 의 고양이 피임 치료 도입은 보류하고 기존 난소자궁적출술을 표준 치료로 유지하는 것이 적절합니다.","evidence":{"design":"무작위대조시험","n":"처리군 9마리, 대조군 3마리","stars":2,"note":"단일 기관 소규모 연구로 일반화에 주의가 필요하며, 일부 고양이에서 발정이 재현된 이유에 대한 추가 연구가 필요합니다."}},"tag":"","tier":"deep"},{"id":"2026-07-24_19","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"elastin 분해 산물 저해로 노화된 마우스·개·인간 모델에서 관절 변성 완화","dek":"elastin 분해 산물이 관절염의 새로운 병인 물질임을 규명하고, elastase 저해제가 노화 관련 관절염 치료 후보물질로 가능성이 있음을 확인했습니다.","source":"Proceedings of the National Academy of S…","country":"","date":"07.24","read":"2분 읽기","plate":"Proceedings of the National Academy of S…","image":null,"sourceUrl":"https://doi.org/10.1073/pnas.2537622123","body":["관절염은 세포외 기질 분해가 핵심 병리 소견으로 작용하지만, 분해된 기질의 역할은 잘 알려지지 않았습니다. 본 연구는 elastin 분해 산물(elastin fragments)이 노화 관련 관절염의 전신적 구동 인자임을 규명하기 위해 수행되었습니다. 두 기관의 관절염 환자 활액에서 elastin fragment 농도가 유의하게 증가해 있었으며, 마우스 및 인간 관절 조직 배양에서 elastin fragment가 관절 조직을 손상시켰습니다.","기전적으로 Valine-Glycine-Valine-Alanine-Proline-Glycine(VGVAPG) oligopeptide(E-motif)가 elastin 수용체 복합체의 구성성분인 neuraminidase-1을 통해 대식세포의 염증성 인자 분비를 유도했고, 이 인자와 E-motif가 함께 연골세포의 serum amyloid A3 단백질 발현을 상향 조절해 연골 변성을 촉진했습니다. 치료적으로 호중구 elastase의 골수 특이적 유전자 결pé제 및 임상 적용 약물인 sivelestat의 약리학적 저해가 elastin fragment 수치를 낮추어 자연 노화 마우스에서 관절 변성을 완화했습니다. sivelestat은 개에서 1년간 전신 안전성을 보였고, 자연 노화 개 및 인간 관절 조직 배양에서 관절염 유사 표현형을 완화했습니다.","한국 동물병원 임상 관점에서 본 연구는 노화된 동물에서 관절염 치료 시 elastin 분해 산물 감소를 표적으로 하는 치료 전략의 가능성을 제시합니다. 다만 본 연구는 마우스 및 개 모델 중심의 실험으로, 실제 임상에 적용하기 위해서는 다양한 품종·체중의 동물에서 추가 검증이 필요하며, sivelestat의 동물용 제제 개발과 용량 설정에 관한 후속 연구가 요구됩니다."],"blog":"노화한 애완동물 관절염의 원인에 대해 보호자들에게 elastin 분해 산물이라는 새로운 개념을 소개하고, 조기 발견과 elastase 저해제 치료 가능성을 안내하는 글로 활용할 수 있습니다.","blogAngle":["관절염 환자 활액에서 elastin fragment 농도가 두 기관 모두에서 유의하게 증가했습니다.","VGVAPG(E-motif)가 neuraminidase-1을 경유해 대식세포 염증을 유발하고, 연골세포 변성을 촉진하는 병적 교차작용을 확인했습니다.","호중구 elastase 결핍 및 sivelestat 저해가 elastin fragment 감소를 통해 관절 변성을 완화했습니다.","sivelestat은 개에서 1년간 안전성을 보였으며, type II collagen, fibronectin, hyaluronic acid, aggrecan 분해 산물도 연골 변성을 유발함을 추가로 확인했습니다."],"radar":{"owner":{"soon":true,"q":"노령 강아지 관절염에 저해제 치료가 효과가 있나요?","script":"아직 실제로 동물에게서 검증된 치료는 아닙니다. 마우스와 개 실험에서 긍정적 결과가 나왔지만, 실제 임상에서 쓰려면 품종별·체중별 추가 연구가 필요해요. 현재는 관절염이 있는 노령 동물에서 체중 관리와 적절한 운동, 관절 보충제를 함께 사용하는 것이 현실적인 접근입니다."},"clinical":"노령 동물 문진 시 관절염 증상 여부를 체계적으로 파악하고, 필요시 전통적 관절염 관리법(체중 조절, 운동처방, 보충제) 함께 고려","evidence":{"design":"전향적 코호트(활액 분석) 및 마우스·개 실험연구","n":"관절염 환자 n=42, 마우스 및 개 실험 모델","stars":2,"note":"마우스·개 실험 중심이므로 실제 동물 임상에 직접 적용하기엔 한계가 있으며, 사람·동물의 종 차이도 고려해야 함"}},"tag":"","tier":"deep"},{"id":"2026-07-24_20","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"로도코커스 에퀴 감염 송아지의 관절·골수염 병리 소견","dek":"두 마리의 2개월령 송아지에서 로도코커스 에퀴 감염에 의한 뼈와 관절 병변의 해부병리학적 소견을 보고합니다. 이 병균은 폐렴뿐 아니라 근골격계 침범도 흔하므로, 송아지 관절염 감별 진단에 중요합니다.","source":"Veterinary research communications","country":"","date":"07.24","read":"2분 읽기","plate":"Veterinary research communications","image":null,"sourceUrl":"https://doi.org/10.1007/s11259-026-11317-x","body":["로도코커스 에퀴는 6개월 이하 송아지에서 폐렴을 주로 일으키지만 관절염과 골수염 등의 폐외 병변도 자주 보고됩니다. 특히 근골격계 병변의 대조직 및 현미경 소견은 아직 충분히 알려져 있지 않아, 본 연구는 이 병균의 병원성 잠재력을 파악하기 위해 두 마리의 송아지 사체를 대상으로 부검을 실시했습니다.","첫 번째 사례는 2개월령 수컷 Quarter Horse로 경부 외상 의심 소견을 보였으며, 부검 결과 축추-후두 관절염과 농양성 육아종성 골수염이 확인되었고, 축추의 병적 골절과 농양성 경막염으로 인한 척수 압박이 관찰되었습니다. 두 번째 사례는 2개월령 수컷 Brazilian Sport Horse로 좌측 무릎관절과 우측 어깨관절의 종대 및 절름거림을 보였으며, 무릎 관절염과 대퇴골의 고름성 골수염, 에피피ipsis 판의 국소 분리가 확인되었습니다. 두 사례 모두 농양성 폐렴과 림프절염을 동반했으며, 현미경 검사에서 그람양성 코키바실러가 검출되었고 첫 번째 사례에서 MALDI-TOF으로 로도코커스 에퀴가 동정되었습니다.","본 연구는 로도코커스 에퀴 감염이 송아지에서 중추신경계 침범을 동반한 중증 근골격계 병변을 유발할 수 있음을 보여줍니다. 특히 2개월령 이하 송아지에서 관절 종대와 절름거림이 동반된 경우 이 병균을 감별 진단에 포함해야 하며, 조기 발견을 위해 임상 증상과 영상학적 소견을 결합한 접근이 필요합니다. 단, 2마리 소규모 연구이므로 대규모 연구가 뒷받침되어야 합니다."],"blog":"송아지가 절름거리거나 관절이 부어오르면 단순 외상뿐 아니라 세균 감염도 의심해야 합니다. 특히 로도코커스 에퀴는 폐렴뿐 아니라 뼈와 관절까지 침범할 수 있는 병원체입니다.","blogAngle":["2개월령 이하 송아지에서 로도코커스 에퀴 감염에 의한 관절염과 골수염이 발생할 수 있습니다.","첫 번째 사례에서는 축추-후두 관절염, 축추 병적 골절, 농양성 경막염이 확인되었습니다.","두 번째 사례에서는 무릎 관절염, 대퇴골 골수염, 에피피ipsis 판 분리가 관찰되었습니다.","두 사례 모두 농양성 폐렴과 림프절염을 동반했습니다."],"radar":{"owner":null,"clinical":"예년에 송아지 사육 시 관절 종대·절름거림이 있으면 로도코커스 에퀴 감염을 감별 진단에 포함시킬 것","evidence":{"design":"증례보고","n":"송아지 2마리","stars":1,"note":"2마리 소규모 사례이므로 일반화에 주의 필요, 대규모 전향적 연구가 필요함"}},"tag":"","tier":"deep"},{"id":"2026-07-24_21","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"프렌치불도그 신장-대동맥 비율 초음파 기준치 확립","dek":"프렌치불도그 50마리를 대상으로 신장길이와 대동맥 직경의 비율(KL/AoD) 기준치를 최초로 확립하였으며, 성별에 따라 유의한 차이가 있음을 보고합니다.","source":"Veterinary radiology & ultrasound","country":"","date":"07.24","read":"2분 읽기","plate":"Veterinary radiology & ultrasound","image":null,"sourceUrl":"https://doi.org/10.1111/vru.70224","body":["본 연구는 건강한 프렌치불도그 50마리를 대상으로 신장길이와 대동맥 직경의 비율(KL/AoD) 기준치를 확립하고 성별, 연령, 체중, 신장 위치, 대동맥 스캔 평면의 영향을 평가하기 위해 실시되었습니다. 신장은 시상면에서, 대동맥은 좌신동맥 직하방에서 종단면(AoDL)과 횡단면(AoDT)으로 각각 측정하였으며, 측정자 1인이 각 측정값을 3회 반복하여 반복성을 평가하였습니다.","ICC 값이 0.88~0.96으로 우수한 신뢰도를 보였습니다. 평균 좌신장 길이는 5.06±0.44cm, 우신장은 5.05±0.44cm였으며, 종단면 대동맥 직경(0.70±0.08cm)은 횡단면(0.75±0.10cm)과 유의한 차이를 보였습니다. 좌우 신장 간 유의한 차이는 없었고(p>0.61), 성별은 모든 매개변수에 유의한 영향을 미쳤습니다(p\u003c0.001). 종단면 KL/AoD 기준범위는 6.30~8.33(수컷 6.43~8.38, 암컷 5.97~7.91), 횡단면은 5.59~7.92(수컷 5.75~7.97, 암컷 4.96~7.65)였습니다.","한국 동물병원에서 프렌치불도그의 신장 초음파 검사 시 종단면 대동맥을 기준으로sex-specific한 기준범위를 적용하면 신장 비대 등 병변 진단의 정확도가 높아질 수 있습니다. 다만 표본이 50마리로 단일기관에서 수행되어 다른 집단으로의 일반화에 한계가 있음을 고려해야 합니다."],"blog":"프렌치불도그를 키우는 보호자에게는 해당 종 특유의 신장 크기 기준치가 있다는 점을 알리고, 정기적인 초음파 검사의 중요성을 강조하는 블로그 글을 작성할 수 있습니다.","blogAngle":["프렌치불도그 50마리의 KL/AoD 비율 기준치를 종단면 기준 6.30~8.33, 횡단면 기준 5.59~7.92로 최초로 확립했습니다.","측정 반복성 ICC가 0.88~0.96으로 우수하여 임상 적용이 신뢰할만 합니다.","성별이 모든 측정값에 유의한 영향을 미쳐(p\u003c0.001) 수컷이 암컷보다 더 높은 KL/AoD 비율을 보였습니다.","대동맥 종단면(0.70cm)과 횡단면(0.75cm) 직경이 유의하게 달라 스캔 평면에 따라 기준범위를 구분 적용해야 합니다."],"radar":{"owner":null,"clinical":"프렌치불도그 신장 초음파 검사 시 종단면 대동맥을 기준으로 성별별 기준범위를 적용하여 신장 비대 진단 정확도를 점검한다.","evidence":{"design":"단면조사","n":"프렌치불도그 50마리","stars":2,"note":"단일기관 연구로 표본 수가 적고 프렌치불도그 단일 품종이라 다른 집단으로의 일반화에 주의가 필요하다."}},"tag":"","tier":"deep"},{"id":"2026-07-24_22","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"디오드 레이저로 치료한 고양이 눈꺼풀 아포크린 낭포선종증 4례","dek":"눈꺼풀에 발생하는 희귀한 양성 종양인 아포크린 낭포선종증(PAC)을 디오드 레이저로 치료한 고양이 4례를 보고합니다. 재발 없이 완전히 치유되었으며, 이는 기존 치료법 대비 안전하고 효과적인 대안이 될 수 있음을 보여줍니다.","source":"Journal of feline medicine and surgery","country":"","date":"07.24","read":"1분 읽기","plate":"Journal of feline medicine and surgery","image":null,"sourceUrl":"https://doi.org/10.1177/1098612X261446575","body":["이 연구는 2019년부터 2024년까지 개인 동물병원 안과와 피부과에 내원한 4마리의 고양이를 대상으로 한 후향적 사례 시리즈입니다. 대상 고양이는 페르시안 3마리와 시베리안 1마리였으며, 눈꺼풀에 1개월에서 1년 동안 진행된 회색 병변이 1개 이상 발견되었습니다. 3마리에서 조직학적 검사를 실시하여 PAC로 진단되었고, 1마리에서는 수술 중 병변이 파열되어 조직학적 진단이 불가능했습니다.","모든 고양이는 전마취 하에 디오드 레이저 증발법으로 치료받았습니다. 치료 후 가장 오래 추적 관찰된 1례에서는 6년 동안 재발이 나타나지 않았으며, 다른 3례에서도 재발이 보고되지 않았습니다. 수술 후 통증과 염증은 최소화되었고, 모든 치료 부위에서 병변이 완전히 사라졌습니다.","이 연구는 소규모 후향적 사례 시리즈이므로 근거 수준에 한계가 있습니다. 그러나 한국 동물병원에서 PAC 진단 시 디오드 레이저 치료가 유용한 대안이 될 수 있으며, 특히 조직학적 진단이 어려운 경우에도 수술적 제거가 가능하다는 시사점을 제공합니다. 장비 비용과 적절한 교육이 필요하다는 점도 고려해야 합니다."],"blog":"눈꺼풀에 작은 회색 물집이 나타났다면 페르시안 고양이에서 희귀한 종양일 수 있으므로 초기 진찰이 중요합니다.","blogAngle":["4마리 고양이(페르시안 3마리, 시베리안 1마리)의 눈꺼풀 PAC를 디오드 레이저로 치료하여 최장 6년 추적 관찰 기간 동안 재발이 없었습니다.","3마리에서 조직학적 검사를 통해 PAC로 진단되었고, 나머지 1마리는 수술 중 병변 파열로 진단이 불가능했습니다.","치료 후 통증과 염증이 최소화되었으며, 모든 치료 부위에서 완전한 치유가 이루어졌습니다.","이 연구는 소규모 후향적 시리즈로 향후 더 많은 사례를 통한 검증이 필요합니다."],"radar":{"owner":null,"clinical":"눈꺼풀 종양 의심 고양이에서 디오드 레이저 치료 가능성을 점검하고, 필요시 해당 장비 운영 여부와 협력 동물병원 안과 협진 경로를 확인합니다.","evidence":{"design":"후향적 사례 시리즈","n":"고양이 4마리","stars":2,"note":"4례의 소규모 후향적 연구로 일반화에 한계가 있으며, 대조군이 없고 추적 관찰 기간이 사례마다 다르다."}},"tag":"","tier":"deep"},{"id":"2026-07-24_23","legacySlug":null,"day":"2026-07-24","ts":1784818800000,"publishedAt":null,"cat":"research","kicker":"최신 연구","isToday":false,"title":"개 안면신경장애의 안과적 특징—중두개견에서 각막염 더 빈번","dek":"스페인 바르셀로나 Autonomous 대학 수의과대학 병원의 14년간 후향적 연구로 안면신경기능장애를 가진 74마리 개(84안)에서 안구 이상 소견을 분석하여 중두개견과 비중두개견 간의 임상적 차이를 보고합니다.","source":"Veterinary ophthalmology","country":"","date":"07.24","read":"2분 읽기","plate":"Veterinary ophthalmology","image":null,"sourceUrl":"https://doi.org/10.1111/vop.70219","body":["본 연구는 2009년부터 2023년까지 안면신경기능장애(FND)로 진단된 74마리 개(84안)의 의무기록을 후향적으로 검토했습니다. 원발 질환은 특발성이 14.9%, 의인성이 13.5%, 중이염이 12.2%로 가장 많았고, French Bulldog이 27.0%(20마리)로 최다 발병 종이었습니다. 안면신경 마비는 63.1%, 부분마비(paresis)는 36.9%에서 관찰되었습니다.","각막 민감도와 Schirmer 눈물시험 수치가 유의하게 감소했으며, 특히 61.9%에서 궤양성 각막염이 발생하여 중두개견에서 더 빈번하고 심각했습니다(p=0.007). 안면신경 기능은 47.6%에서만 회복되었으며, 회복율은 성별에 따라 유의한 차이를 보였습니다(p=0.043). 낮은 각막 민감도(esthésiometry 수치, p=0.023)와 전방염(p=0.037)이 불량한 안구 예후와 관련되었고, 연구 종료 시 14안(17.6%)이 안구적출되었습니다.","한국 동물병원에서 안면신경장애 환개를 진료할 때는 안구표면 질환, 특히 신경성건성각막염과 신경마비성 궤양성각막염의 조기 발견과 관리가 시력 보존에 중요합니다. 특히 중두개견에서는 각막염 발생 위험이 높아 사전 예방적 관리와 동반 질환에 대한 주의 깊은 모니터링이 필요하며, 본 연구는 단일기관 후향적 분석이므로 다기관 전향적 연구가 뒷받침될 필요가 있습니다."],"blog":"반려견 안면마비로 고통받는 보호자를 위해, 안면신경장애는 눈물 감소와 각막 손상을 유발할 수 있어 빠른 안과 검사와 지속적인 관리 없이는 시력 상실까지 이어질 수 있음을 안내할 수 있습니다.","blogAngle":["74마리(84안) 분석 결과, 61.9%에서 궤양성각막염이 발생했으며 중두개견에서 유의하게 더 빈번했습니다(p=0.007).","안면신경 기능은 47.6%에서만 회복되어 예후가 불량하며, 낮은 각막 민감도와 전방염이 시력 상실 위험 인자입니다.","연구 종료 시 14안(17.6%)이 안구적출되어 안면신경장애가 심각한 시각 위협 요인임을 확인했습니다.","중두개견은 비중두개견보다 각막 합병증이 더 심각하므로, 이 종에서 안면신경장애 발생 시 초기 안과 관리 강화가 필요합니다."],"radar":{"owner":{"soon":true,"q":"중두개견이 안면신경장애 생기면 각막염 위험이 더 높은가요?","script":"네, 이 연구에서 중두개견이 각막염에 걸릴 위험이 더 높았고, 61.9%에서 궤양성 각막염이 발생했습니다. 안면신경이 마비되면 눈물이 줄어들고 각막 민감도가 떨어져 상처를 느끼지 못하기 때문에 더 심각해지기 쉽습니다. 따라서 안면신경장애가 확인된 개에서는 반드시 안구 표면 상태를 자주 점검하고 인공눈물 등을 예방적으로 사용하는 것이 시력 보존에 중요합니다."},"clinical":"안면신경장애 환자에서 매 방문 시 각막 민감도, 눈물량, 각막 상태를 체계적으로 점검하고, 중두개견에서는 특히 예방적 안구 관리 프로토콜 적용을 검토할 것","evidence":{"design":"단일기관 후향적 연구","n":"개 74마리(84안)","stars":2,"note":"단일기관 후향적 분석으로 중두개견과 비중두개견 간 차이가 있지만 후속 다기관 전향적 연구가 필요하다"}},"tag":"","tier":"deep"}],"briefs":[],"stories":[{"id":"2026-07-24_24","legacySlug":null,"day":"2026-07-24","ts":1783701715000,"publishedAt":"2026-07-10T16:41:55.000Z","cat":"watercooler","kicker":"진료실 밖 이야기","isToday":false,"title":"반려동물 진료비, 알고 보면 놀라운 사실들","dek":"수의사 진료비에 숨겨진 변화와 비용 내역에 대한 주의사항","source":"MoneyMagpie","country":"","date":"07.11","read":"1분 읽기","plate":"MoneyMagpie","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMipgFBVV95cUxQSHF3SzY3ei1BYXFQVEFmLV9DbFNZSXRZOEo0QkJQalcteGtqcmNUOHh0NGdaMFhlMlhieVowWWN4NzdjUUlscXduRVhuV0JoUkJWeE1XbENkZjE5MkNsU0xJWTBUcjJjM3hlWHB0NW5mMGFsT3ZGR19Rel9HTWlSUzNlS3ZqQ0EwSEtHTmVwRzI4enJ5bS0zQTRZNzhSU05UckRJVGNn?oc=5","body":["최근 해외에서 반려동물 진료비에 대한 논란이 뜨겁습니다. 생각보다 내역서에서 예상치 못한 항목들이 부과되거나, 이전과 다른 기준으로 비용이 책정되고 있다는 것입니다. 특히 응급 진료나 특수 검사의 경우 처음 예상했던 금액과 상당한 차이가 날 수 있죠.","진료 받기 전에 세부 비용을 미리 확인하는 것이 중요해졌습니다. 같은 진료라도 병원마다 가격 편차가 크고, 보험 적용 여부도 천차만별입니다. 진료실 밖에서 보면 이런 일도 있네요, 우리 아이 병원비 장보고 나면 정말 긴장됩니다."],"blog":"","blogAngle":[],"radar":null,"tag":"황당","tier":"deep"},{"id":"2026-07-24_25","legacySlug":null,"day":"2026-07-24","ts":1784840700000,"publishedAt":"2026-07-23T21:05:00.000Z","cat":"watercooler","kicker":"진료실 밖 이야기","isToday":true,"title":"반려동물 진료비 5천만원?...'반려동물 부채 위기' 속보","dek":"미국에서 반려동물 진료비로 수천만원씩 빚을 지는 가구들이 급증하고 있습니다.","source":"New York Post","country":"","date":"07.24","read":"1분 읽기","plate":"New York Post","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMib0FVX3lxTFBPcmFBQ2VlWW42eTdwU25HMlFZU1RMbjZKNmp4X2FWS3ZWZG9lX05vTXctX0ZBLTQ1WlB3TFQwMy1FTmJHYTAxSGdhSlA1V2Q5SEZsLWNmdFVnRlVzeTlFaGo0QkRaYm9EV2NtdGMxbw?oc=5","body":["미국 언론에 따르면 2026년 현재 반려동물 한 마리의 진료비가 최대 5천만원(약 5만 달러)에 달하는 사례가 잇따라 화제입니다. 현대화된 진료 기술과 장비 비용이 상승하면서 동물병원 진료비가 크게 뛰었으며, 이에 따른 가구별 부채가 급증하고 있다고 합니다.","특히 응급수술이나 만성질환 치료의 경우 보험이 적용되지 않는 경우가 많아 주인이 감당하기 어려운 금액이 되는 상황입니다. 진료를 받으면 파산할 수 있다는 우려까지 제기되고 있으며, 진료를 포기하는 강아지·고양이 주인의 이야기도 나오고 있습니다. 우리 주위에서도 애완동물을 키우는 친구들이 진료비 때문에 두통을 느낄 법하죠."],"blog":"","blogAngle":[],"radar":null,"tag":"황당","tier":"deep"},{"id":"2026-07-24_26","legacySlug":null,"day":"2026-07-24","ts":1784823361000,"publishedAt":"2026-07-23T16:16:01.000Z","cat":"watercooler","kicker":"진료실 밖 이야기","isToday":true,"title":"반려동물 진료비 이렇게 비싸졌어?","dek":"미국서 동물병원 비용 급등, 사람들이 진료를 못 받는 사례 속속","source":"CBS News","country":"","date":"07.24","read":"1분 읽기","plate":"CBS News","image":null,"sourceUrl":"https://news.google.com/rss/articles/CBMieEFVX3lxTE9XdlZJUVJPeEs2eGJRNC1mMmZJNV9oRHczeGdfcGZsZ0Q3dUxJa1JlbTEzM2NNWkVfaUg1ZFQwOXBfdi1TTnNORDZhdkQwRVdFYThOTkdGeFlWeEFIMUlIT1dSSTF1V0FUeFV4NWJnZGhtek9LMnRPOQ?oc=5","body":["미국에서 애완동물을 키우는 가정들이 Animal병원 비용 상승으로 어려움을 겪고 있습니다. 예전에는 몇 만원이던 진찰비가 이제는 몇 배로 뛰었을 뿐 아니라, 처방약과 검사 비용도 상당해 집안 재정에 부담이 되고 있습니다.","어떤 젊은 사람은 자신의 개를 치료하려했는데 비용이 너무 높아 눈물을 흘렸다고 합니다. 모든 사람들이 이러한 비용을 감당할 수 는 없어서, 일부 사람들은 동물 shelter에 데리러 가거나 치료를 포기하는 경우도 있다고 합니다.","진료실 밖에서 보면 이런 일도 있네요. 우리 주변에서도 동물 진료비를 부담스러워하는 분들 많으시죠."],"blog":"","blogAngle":[],"radar":null,"tag":"논란","tier":"deep"}],"isHome":false}</script>

  function loadSearch(){
    if(SEARCH_INDEX||searchLoading) return;
    searchLoading=true; render();
    // 검색 색인은 날짜별 청크로 나눠 둔다. 매일 새 글이 추가되어도 과거 청크의
    // CDN 캐시를 무효화하지 않고, 장애·구버전 배포에서는 기존 search.json으로 폴백한다.
    fetch('/search-manifest.json').then(function(r){if(!r.ok)throw new Error('manifest');return r.json();}).then(function(manifest){
      var chunks=Array.isArray(manifest.chunks)?manifest.chunks:[];
      if(!chunks.length) throw new Error('empty manifest');
      return Promise.all(chunks.map(function(chunk){return fetch(chunk.href).then(function(r){if(!r.ok)throw new Error('chunk');return r.json();});})
        .then(function(parts){ return parts.reduce(function(all,part){ return all.concat(Array.isArray(part.items)?part.items:[]); },[]); });
    }).catch(function(){
      return fetch('/search.json').then(function(r){if(!r.ok)throw new Error('search');return r.json();}).then(function(data){return Array.isArray(data.items)?data.items:[];});
    }).then(function(items){
      SEARCH_INDEX=items;
      SEARCH_INDEX.forEach(function(a){ byId[a.id]=a; });
      searchLoading=false; render();
    }).catch(function(){ searchLoading=false; toast('전체 검색 색인을 불러오지 못했습니다'); });
  }

  // 검색 중에는 전체 색인(과거 브리핑 포함)을 대상으로 한다.
  function sorted(){
    var base=S.query.trim()&&SEARCH_INDEX?SEARCH_INDEX:(S.query.trim()?DATA.articles.concat(DATA.briefs||[],DATA.recent||[],DATA.stories||[]):DATA.articles);
    var arr=base.slice(); if(S.sort==='latest'){ arr.sort(function(x,y){return y.ts-x.ts;}); } return arr;
  }
  function match(a,q){ return (a.title+' '+a.dek+' '+a.source+' '+a.kicker+' '+(a.body||[]).join(' ')).toLowerCase().indexOf(q)>=0; }
  function activeList(){
    var arr=sorted();
    if(S.cat!=='all') arr=arr.filter(function(a){return a.cat===S.cat;});
    if(S.unreadOnly) arr=arr.filter(function(a){return !isRead(a.id);});
    var q=S.query.trim().toLowerCase();
    if(q) arr=arr.filter(function(a){return match(a,q);});
    return arr;
  }
  // 현재 문맥의 순서 있는 목록(연속 읽기용)
  function contextList(){
    if(S.view==='saved') return Object.keys(S.saved).map(function(k){return S.saved[k];});
    if(S.view==='ideas') return Object.keys(S.ideas).map(function(k){return S.ideas[k];});
    if(S.query.trim()) return activeList();                     // 검색 중엔 검색 결과로 연속 읽기
    var cur=byId[S.openId];
    if(cur&&cur.tier==='brief') return (DATA.briefs||[]);       // 브리프도 다음/이전으로 읽기
    if(cur&&cur.cat==='watercooler') return (DATA.stories||[]); // 진료실 밖 이야기끼리 연속 읽기
    if(cur&&cur.day!==DATA.date) return (DATA.recent||[]);      // 최근 브리핑끼리 연속 읽기
    return activeList();
  }

  function evLine(a){

  // 폴드 3단 맞춤기 — 톱기사 높이를 기준선으로 삼아, 왼쪽 브리프 개수와 오른쪽
  // 카드 수를 조정해 세 단이 같은 지점에서 끝나게 한다. 브리프 행(약 60px)이
  // 잘게 나뉘어 있어 미세 조정은 왼쪽이 담당한다.
  var FP={brief:7,side:2,busy:false,steps:0};
  function fitFold(){
    if(FP.busy||S.view!=='home'||S.openId||innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell'), B=document.getElementById('vm-brief'), R=document.getElementById('vm-side');
    if(!C||!B||!R||!B.lastElementChild||!R.lastElementChild) return;
    var target=C.getBoundingClientRect().height;
    function used(el){ return el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top; }
    var bUnit=B.lastElementChild.getBoundingClientRect().height||60;
    var rUnit=R.lastElementChild.getBoundingClientRect().height||260;
    var wantB=Math.max(3,Math.min(14,FP.brief+Math.round((target-used(B))/bUnit)));
    var wantR=Math.max(1,Math.min(4,FP.side+Math.round((target-used(R))/rUnit)));
    if((wantB!==FP.brief||wantR!==FP.side)&&FP.steps<5){
      FP.brief=wantB; FP.side=wantR; FP.steps++;
      FP.busy=true; render(); FP.busy=false;
      setTimeout(fitFold,16);
      return;
    }
    fillSlack();
  }
  // 남는 여백은 빈칸으로 두지 않고, 짧은 단의 말줄임(line-clamp)을 풀어 글로 채운다.
  function fillSlack(){
    if(innerWidth<=900) return;
    var C=document.getElementById('vm-leadcell');
    if(!C) return;
    var pairs=[[C.getBoundingClientRect().height,['vm-brief','vm-side']]];
    var FL=document.getElementById('vm-feat-l'), FR=document.getElementById('vm-feat-r');
    // 피처 구역도 같은 방식으로 — 짧은 쪽(보통 해설 기사)을 TOP 5 높이까지 늘린다
    if(FL&&FR) pairs.push([Math.max(FL.getBoundingClientRect().height,FR.getBoundingClientRect().height)-56,['vm-feat-l','vm-feat-r']]);
    pairs.forEach(function(pr){ var target=pr[0]; pr[1].forEach(function(id){
      var el=document.getElementById(id);
      if(!el||!el.lastElementChild) return;
      function slack(){ return target-(el.lastElementChild.getBoundingClientRect().bottom-el.getBoundingClientRect().top); }
      // ① 숨겨둔 블록(진료 포인트 등)을 먼저 편다. 넘치면 되돌린다
      [].slice.call(el.querySelectorAll('.vm-fill')).forEach(function(x){
        if(slack()<40) return;
        x.style.display=x.tagName==='P'?'-webkit-box':'block';
        if(slack()<0) x.style.display='none';
      });
      // ② 그래도 남으면 마지막 카드의 말줄임을 한 줄씩 푼다
      var ps=el.querySelectorAll('p[style*="line-clamp"]');
      if(!ps.length) return;
      var p=ps[ps.length-1], guard=0;
      while(guard++<20){
        if(slack()<26) break;                            // 한 줄 넣을 자리도 없다
        if(p.scrollHeight<=p.clientHeight+2) break;       // 더 보여줄 문장이 없다
        p.style.webkitLineClamp=(parseInt(getComputedStyle(p).webkitLineClamp)||3)+1;
      }
    }); });
  }

  addEventListener('resize',function(){ clearTimeout(balTimer); balTimer=setTimeout(function(){ FP.steps=0; fitFold(); },160); });

    +'<div id="vm-fold" class="vm-fold" style="display:grid;grid-template-columns:1fr 2.3fr 1.15fr;gap:0;border-bottom:3px solid var(--color-label-strong);padding-bottom:30px;">'

      +'<div id="vm-brief" style="grid-column:1;grid-row:1;padding:26px 26px 0 0;">'
        +'<div style="font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-label-strong);padding-bottom:10px;border-bottom:2px solid var(--color-label-strong);">한눈에</div>'
        +brief.map(briefRow).join('')+'</div>'
      +'<div id="vm-side" style="grid-column:3;grid-row:1;padding:26px 0 0 26px;">'+side.map(railCard).join('')+sponsorBlock(slotAt('fold'))+'</div>'

    +sponsorBlock(slotAt('mid'),true)
    // ③ 쿼드 — 같은 무게 4단
    // 칸이 다 차지 않으면 빈 셀이 생긴다 → 카드 수에 맞춰 단 수를 줄이고, 2장 미만이면 생략
    +(quad.length>=2?'<div class="vm-quadzone" style="display:grid;grid-template-columns:repeat('+quad.length+',1fr);gap:0;border-bottom:2px solid var(--color-label-strong);">'

        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'

      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'

  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('/api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email,website:(document.getElementById('vm-hp')||{}).value||''})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?(res.already?'이미 구독 중입니다':'구독 신청 완료! 매일 아침 받아보세요'):(res.error||'잠시 후 다시 시도해 주세요')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  // SPA라 기사를 열어도 페이지 이동이 없어 GA4가 조회를 못 잡는다 — 직접 보낸다
  function track(a){
    if(typeof gtag!=='function'||!a) return;
    try{
      gtag('event','article_view',{article_id:a.id,article_title:a.title,category:a.cat,source:a.source,issue_date:a.day});
    }catch(e){}
  }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); track(byId[id]); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('/archive.json').then(function(r){if(!r.ok)throw new Error('archive');return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('/data/'+date+'.json').then(function(r){if(!r.ok)throw new Error('issue');return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','/issues/'+date);}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav');
      // 홈이 아닌 페이지(주간·날짜별)에서 '홈'을 누르면 그 페이지엔 홈 데이터가 없다 → 실제 홈으로 이동
      if(v==='home'&&!DATA.isHome){ location.href='/'; return; }
      S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetManLab 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });

  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
