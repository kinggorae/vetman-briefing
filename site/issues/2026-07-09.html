<h1>VetMan 해외 브리핑 — 2026-07-09</h1>
<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개 경추 추간판 질환 통합 재활치료 사례 – 외과와 한의학 협업의 가능성</h2><p><b>미국에서 외과적 감압술 후 한의학적 통합 치료를 적용한 경추 추간판 질환 개 사례가 공개되었습니다. 수술 후 발생한 합병증이 빠르게 호전되면서 통합수의학의 효과를 입증했습니다.</b></p>
<p>경추 추간판 질환은 소동물 신경과에서 주요한 도전 과제로, 많은 경우 수술적 개입과 집중적인 재활이 필요합니다. 이번 사례는 전통적인 신경외과와 한의학의 보완 치료를 결합한 통합적 접근법의 잠재력을 보여줍니다.</p><p>5세 수컷 비글(체중 17.7kg)이 급성 경추 추간판 탈출(C2-C3)으로 내원하여 신경학적 검사상 이완성 사지 마비 판명을 받고 ventrical slot fenestration 감압술을 시행받았습니다. 수술 후 환자에게 상당한 합병증이 발생했고, 재활의학과로 전원되어 구조화된 재활 프로그램이 시작되었습니다. 전통적인 물리치료와 함께 침술 등 한의학적 통합 치료를 적용한 결과, 통증과 부종이 수일 내에 호전되기 시작했으며 신경학적 기능이 점진적으로 회복되기 시작했습니다.</p><p>이 사례는 한국 동물병원에 중요한 시사점을 제공합니다. 척수 손상 환자의 재활에서 침술 같은 통합 치료를 활용하면 회복 성과를 개선할 수 있다는 점을 보여주는 사례입니다. 한국 수의학계에서도 전통 한의학적 치료법을 재활 프로토콜에 통합하는 방안을 고려해 볼 필요가 있으며, 이는 환자 복지 향상과 진료 품질 격상에도 기여할 수 있을 것입니다.</p><p>원문에서는 구체적인 침술 치료 횟수, 침 자극 부위, 사용된 약물 명칭과 용량에 대한 상세 정보가 포함되어 있지 않아 이 부분에 대한 세부 사항은 원문 참고가 필요합니다.</p>
<p>원문: <a href="https://ivcjournal.com/integrative-rehabilitation-in-canine-cervical-disc-disease-a-case-report/" rel="nofollow">IVC Journal</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 삶의 질 평가 도구 FelQoL 개발</h2><p><b>고양이는 수의사 방문 시 아픔을 숨기는 습관이 있어 건강한 상태를 파악하기 어렵습니다. 영국·미국 공동 연구팀이 고양이의 가정 환경에서의 행동을 평가하는 새로운 도구를 개발했습니다.</b></p>
<p>고양이는 특히 동물병원 방문 시 아픔을 숨기는 습성이 있어 수의사들이 정확한 건강 상태를 평가하기 어렵다는 문제가 있습니다. 영국 Waltham 동물과학연구소와 Mars Veterinary Health, Royal Canin, University of Bristol 연구팀이 고양이의 삶의 질을 평가할 수 있는 도구를 개발했습니다.</p><p>연구팀은 미국과 영국에서 1,324명의 고양이 보호자로부터 설문 조사를 수집하여 고양이의 행복과 삶의 질과 관련된 7가지 핵심 영역을 파악했습니다. 이 도구(FelQoL)는 보호자가 집에서 작성하는 설문 형식으로 구성되어 있고, Journal of Feline Medicine and Surgery에 2편의 연구 논문으로 발표되었습니다.</p><p>한국 동물병원에서도 이 도구를 활용할 수 있습니다. 보호자가 집에서 정기적으로 고양이의 삶의 질을 평가하고, 변화가 느껴질 때 신속하게 동물병원을 방문하도록 안내할 수 있습니다. 또한 진료 시 고양이의 삶의 질에 대한 논의의 질을 높이는 데 활용할 수 있을 것입니다.</p>
<p>원문: <a href="https://todaysveterinarybusiness.com/new-tool-evaluates-feline-well-being/" rel="nofollow">Today's Veterinary Business</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>빈혈 검사, MCHC만으로는 부족하다-CHCM의 임상적 가치</h2><p><b>최근 동물병원에서 빠른 CBC(전혈구계산) 검사가 보편화되면서 정확성과 깊이 있는 진단에 대한 기대도 높아지고 있습니다. 특히 MCHC(평균 적혈구혈색소농도)는 빈혈 평가에 흔히 사용되지만, 측정 방식의 한계로 인해 미세한 병변을 놓칠 수 있다는 점을 최근 연구가 지적하고 있습니다.</b></p>
<p>동물병원 임상 현장에서 CBC는Consult 즉시 환자의 혈액 상태를 파악할 수 있는 핵심 진단 도구로 자리 잡았습니다. 빈혈 검사에서는 적혈구 지표인 MCHC가 광범위하게 활용되는데, 이는 혈색소 농도와 Hematocrit로부터 계산된 값으로 전체 적혈구 집단의 평균을 나타냅니다. 그러나 이는 개별 세포 수준이 아닌 집단 평균치이기 때문에, 초기 질환이나 일부 세포에만 영향이 미치는 경우 미묘한 저색소증을 감지하지 못할 수 있습니다.</p><p>MCHC는 또한 분석 전 단계의 인공물에 취약합니다. 지질혈증, 황달, 용혈, 다수의 Heinz 소체, 적혈구 응집 등이 있으면 MCHC가 인위적으로 높아질 수 있어 해석이 어려워집니다. 반면 CHCM(Cellular Hemoglobin Concentration Mean)은 개별 적혈구를 직접 분석하여 세포 내 실제 혈색소 농도를 측정합니다. 이 방법은 용혈이나 지질혈증 등의 간섭영향으로부터 비교적 자유로워 더 신뢰할 수 있는 결과를 제공하며, 최근 Zoetis의 Vetscan OptiCell에서 최초의_point-of-care 측정으로 도입되었습니다.</p><p>7세 보더콜리 코디 사례에서 CBC 결과 Hematocrit 28.1%의 비재생성 빈혈이 확인되었습니다. MCHC는 경계값을 보여 저색소증을 명확히 밝히지 못했지만, CHCM은 세포 내 혈색소 농도 감소를 확인하여 계산 지표만으로는 불분명했던 병소를 명확히 했습니다. 이는 한국 동물병원에서도 CBC 결과와 임상 증상이 맞지 않거나 미묘한 소견이 있을 때 CHCM 활용을 고려할 필요가 있음을 시사합니다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/chcm-vs-mchc-why-measured-hemoglobin-matters/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>수의백신 개발 단계와 근거기반 가이드라인의 현재 동향</h2><p><b>수의학 분야에서도 사람의학과 마찬가지로 백신 개발 단계별 연구 목표와 보호 지표 설정이 중요해지고 있습니다. 특히 수의백신 인허가 과정이 사람의백신보다 간소화된 만큼, 근거에 기반한 가이드라인의 필요성이 커지고 있습니다.</b></p>
<p>백신 개발은Phase 0에서 개념 입증, Phase I·II에서 보호 지표 확인과 최적 용량 결정, Phase III에서 자연 노출을 통한 유효성·안전성 증빙으로 진행됩니다. 사람의학에서는 Phase IV 사후 임상시험이 필수이지만, 수의학에서는 동일한 종으로 도전 실험이 가능하고 Phase IIb trial만으로 인허가되는 경우가 많아 개발 기간이 단축됩니다.</p><p>자의백신은 안전성과 순수성만 검증되며 효능 검증은 면제됩니다. 상용백신이 없거나 부족한 가축 질병에 한해수의사 직접 관리 하에 제한적으로 사용되는 것으로, 인허가 절차 간소화의 대표적인 사례입니다. 이러한 점에서 수의백신 승인은 종 특유의 요인보다 규제 환경이 더 관대한 편입니다.</p><p>최근 유럽 ENOVAT 프로젝트처럼 근거에 기반한 항균 치료 가이드라인을 개발하려는 시도도 이루어지고 있습니다. 체계적 문헌고찰 방식의 도입이 증가하면서, 수의학 분야도 합의 중심에서 근거 중심 가이드라인으로 전환하는 움직임이 본격화되고 있습니다. 한국 동물병원에서도 최신 백신 프로토콜을 적용할 때 이러한 국제 동향을 참고할 필요가 있습니다.</p><p>원문의 구체적 수치와 사례는 원문을 참고하시기 바랍니다.</p>
<p>원문: <a href="https://www.veterinarypracticenews.com/overview-veterinary-vaccine-research-regulations-guidelines/" rel="nofollow">Veterinary Practice News</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>원격진료 플랫폼 'Dutch'의 위험성 - 수의학적 안전장치 해체 우려</h2><p><b>미국의 반려동물 원격진료 플랫폼 'Dutch'가 동물병원 진찰을 생략하고 약물을 처방하는 모델에 대해 수의학 경제학자가 경고했습니다. 안전장치 제거가 혁신이 아닌 위험 요소가 될 수 있다는 지적입니다.</b></p>
<p>원격진료 플랫폼 Dutch가 “약속된 더 싼 가격, 더 쉬운 접근성”을 내세워 제한을 줄이는 방식으로 발전하고 있다. 수의경제학자 매트 살루아 박사는 최근 팟캐스트에서 이 모델을 ‘트로이 목마'에 비유하며 경고했다. 그는 VCPR(수의사-환자-보호자 관계)과 신체검사와 같은 안전장치를 제거하는 것이 혁신이 아니라 위험 요소라고 강조했다.</p><p>약국 수익이 동물병원 서비스를 보조하는 현재의 경제 구조도 중요한 배경이다. Dutch와 같은 플랫폼이 직접 약물을 처방·판매하면 동물병원의 수익 구조가 흔들릴 수 있다. 또한 진찰 없이 오진이 발생할 경우 오히려 진료비가 증가할 수 있고, 특히 중환 동물에서 증상 발현이 지연되는 치명적 결과로 이어질 수 있다. 누가 의료적 결정의 책임을 진다는 문제도 남아 있다.</p><p>한국 동물병원 관점에서 보면, 원격진료 플랫폼의 장점이면서 동시에 위험이 될 수 있는 부분은 보호자의 ‘편의성 추구'이다. 진찰을 생략한 약물 처방은 빠른 해결을 줄 수 있지만, 뒤따르는 부작용이나 오진의 비용을 생각해봐야 한다. 우리 병원에서도 원격진료 도입 시 어떤 안전장치를 유지할 것인지 기준을 마련하는 것이 필요하다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-07-09","dateLabel":"2026.07.09","dateline":"2026년 7월 9일 · 목요일","editionNo":"2,015","count":5,"cats":[{"key":"clinical","label":"임상"},{"key":"industry","label":"업계"}],"articles":[{"id":"2026-07-09_1","day":"2026-07-09","ts":1783602014000,"cat":"clinical","kicker":"임상","isToday":true,"title":"개 경추 추간판 질환 통합 재활치료 사례 – 외과와 한의학 협업의 가능성","dek":"미국에서 외과적 감압술 후 한의학적 통합 치료를 적용한 경추 추간판 질환 개 사례가 공개되었습니다. 수술 후 발생한 합병증이 빠르게 호전되면서 통합수의학의 효과를 입증했습니다.","source":"IVC Journal","country":"미국","date":"07.09","read":"2분 읽기","plate":"IVC Journal","image":"https://ivcjournal.com/wp-content/uploads/Gemini_Generated_Image_1xvizs1xvizs1xvi-600x342.png","sourceUrl":"https://ivcjournal.com/integrative-rehabilitation-in-canine-cervical-disc-disease-a-case-report/","body":["경추 추간판 질환은 소동물 신경과에서 주요한 도전 과제로, 많은 경우 수술적 개입과 집중적인 재활이 필요합니다. 이번 사례는 전통적인 신경외과와 한의학의 보완 치료를 결합한 통합적 접근법의 잠재력을 보여줍니다.","5세 수컷 비글(체중 17.7kg)이 급성 경추 추간판 탈출(C2-C3)으로 내원하여 신경학적 검사상 이완성 사지 마비 판명을 받고 ventrical slot fenestration 감압술을 시행받았습니다. 수술 후 환자에게 상당한 합병증이 발생했고, 재활의학과로 전원되어 구조화된 재활 프로그램이 시작되었습니다. 전통적인 물리치료와 함께 침술 등 한의학적 통합 치료를 적용한 결과, 통증과 부종이 수일 내에 호전되기 시작했으며 신경학적 기능이 점진적으로 회복되기 시작했습니다.","이 사례는 한국 동물병원에 중요한 시사점을 제공합니다. 척수 손상 환자의 재활에서 침술 같은 통합 치료를 활용하면 회복 성과를 개선할 수 있다는 점을 보여주는 사례입니다. 한국 수의학계에서도 전통 한의학적 치료법을 재활 프로토콜에 통합하는 방안을 고려해 볼 필요가 있으며, 이는 환자 복지 향상과 진료 품질 격상에도 기여할 수 있을 것입니다.","원문에서는 구체적인 침술 치료 횟수, 침 자극 부위, 사용된 약물 명칭과 용량에 대한 상세 정보가 포함되어 있지 않아 이 부분에 대한 세부 사항은 원문 참고가 필요합니다."],"blog":"한국 동물병원 블로그에서는 '반려동물 경추 질환, 수술 후 재활의 새로운 선택지는?' 같은 제목으로 통합수의학 도입 가능성을 다룬다면 동물주인들의 큰 관심을 끌 수 있을 것입니다.","blogAngle":["5세 비글에서 급성 경추 추간판 탈출(C2-C3)로 인한 사지 마비 진단 후 ventrical slot fenestration 시행","수술 후 합병증 발생 시 재활의학과에서 전통적인 물리치료와 한의학적 통합 치료 병행","통증과 부종이 수일 내에 호전되고 신경학적 기능이 점차 회복되어 수 주 내 퇴원 및 기능 회복 달성","통합수의학적 접근이 척수 손상 개 환자 재활에서 전통적인 치료만으로는 얻기 어려운 효과를 제공할 수 있음"]},{"id":"2026-07-09_2","day":"2026-07-09","ts":1783524770000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 삶의 질 평가 도구 FelQoL 개발","dek":"고양이는 수의사 방문 시 아픔을 숨기는 습관이 있어 건강한 상태를 파악하기 어렵습니다. 영국·미국 공동 연구팀이 고양이의 가정 환경에서의 행동을 평가하는 새로운 도구를 개발했습니다.","source":"Today's Veterinary Business","country":"미국","date":"07.09","read":"1분 읽기","plate":"Today's Veterinary Business","image":"https://todaysveterinarybusiness.com/wp-content/uploads/sites/2/2026/07/shutterstock_2718364467.jpg","sourceUrl":"https://todaysveterinarybusiness.com/new-tool-evaluates-feline-well-being/","body":["고양이는 특히 동물병원 방문 시 아픔을 숨기는 습성이 있어 수의사들이 정확한 건강 상태를 평가하기 어렵다는 문제가 있습니다. 영국 Waltham 동물과학연구소와 Mars Veterinary Health, Royal Canin, University of Bristol 연구팀이 고양이의 삶의 질을 평가할 수 있는 도구를 개발했습니다.","연구팀은 미국과 영국에서 1,324명의 고양이 보호자로부터 설문 조사를 수집하여 고양이의 행복과 삶의 질과 관련된 7가지 핵심 영역을 파악했습니다. 이 도구(FelQoL)는 보호자가 집에서 작성하는 설문 형식으로 구성되어 있고, Journal of Feline Medicine and Surgery에 2편의 연구 논문으로 발표되었습니다.","한국 동물병원에서도 이 도구를 활용할 수 있습니다. 보호자가 집에서 정기적으로 고양이의 삶의 질을 평가하고, 변화가 느껴질 때 신속하게 동물병원을 방문하도록 안내할 수 있습니다. 또한 진료 시 고양이의 삶의 질에 대한 논의의 질을 높이는 데 활용할 수 있을 것입니다."],"blog":"고양이 보호자를 대상으로 자가 평가 체크리스트를 제공하여 병원 방문 권유와 건강 관리 교육 콘텐츠로 활용할 수 있습니다","blogAngle":["고양이는 아픔을 숨기는 습성이 있어 수의사가 건강 상태를 평가하기 어렵습니다","1,324명 보호자 설문조사를 바탕으로 7가지 영역을 평가하는 FelQoL 도구가 개발되었습니다","Journal of Feline Medicine and Surgery에 발표된 가장 포괄적인 고양이 웰빙 연구입니다","보호자와 수의사가 협력하여 고양이의 삶의 질을 향상시키는 데 활용할 수 있습니다"]},{"id":"2026-07-09_3","day":"2026-07-09","ts":1783535003000,"cat":"clinical","kicker":"임상","isToday":false,"title":"빈혈 검사, MCHC만으로는 부족하다-CHCM의 임상적 가치","dek":"최근 동물병원에서 빠른 CBC(전혈구계산) 검사가 보편화되면서 정확성과 깊이 있는 진단에 대한 기대도 높아지고 있습니다. 특히 MCHC(평균 적혈구혈색소농도)는 빈혈 평가에 흔히 사용되지만, 측정 방식의 한계로 인해 미세한 병변을 놓칠 수 있다는 점을 최근 연구가 지적하고 있습니다.","source":"Today's Veterinary Practice","country":"미국","date":"07.09","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/07/Zoetis_CHCMAdvertorial_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/chcm-vs-mchc-why-measured-hemoglobin-matters/","body":["동물병원 임상 현장에서 CBC는Consult 즉시 환자의 혈액 상태를 파악할 수 있는 핵심 진단 도구로 자리 잡았습니다. 빈혈 검사에서는 적혈구 지표인 MCHC가 광범위하게 활용되는데, 이는 혈색소 농도와 Hematocrit로부터 계산된 값으로 전체 적혈구 집단의 평균을 나타냅니다. 그러나 이는 개별 세포 수준이 아닌 집단 평균치이기 때문에, 초기 질환이나 일부 세포에만 영향이 미치는 경우 미묘한 저색소증을 감지하지 못할 수 있습니다.","MCHC는 또한 분석 전 단계의 인공물에 취약합니다. 지질혈증, 황달, 용혈, 다수의 Heinz 소체, 적혈구 응집 등이 있으면 MCHC가 인위적으로 높아질 수 있어 해석이 어려워집니다. 반면 CHCM(Cellular Hemoglobin Concentration Mean)은 개별 적혈구를 직접 분석하여 세포 내 실제 혈색소 농도를 측정합니다. 이 방법은 용혈이나 지질혈증 등의 간섭영향으로부터 비교적 자유로워 더 신뢰할 수 있는 결과를 제공하며, 최근 Zoetis의 Vetscan OptiCell에서 최초의_point-of-care 측정으로 도입되었습니다.","7세 보더콜리 코디 사례에서 CBC 결과 Hematocrit 28.1%의 비재생성 빈혈이 확인되었습니다. MCHC는 경계값을 보여 저색소증을 명확히 밝히지 못했지만, CHCM은 세포 내 혈색소 농도 감소를 확인하여 계산 지표만으로는 불분명했던 병소를 명확히 했습니다. 이는 한국 동물병원에서도 CBC 결과와 임상 증상이 맞지 않거나 미묘한 소견이 있을 때 CHCM 활용을 고려할 필요가 있음을 시사합니다."],"blog":"한국 동물병원 블로그에서는 'CBC 검사에서 MCHC만으로는 빈혈의 원인을 놓칠 수 있다'를 주제로 CHCM의 임상적 활용 사례와 함께 소개하면 좋습니다","blogAngle":["MCHC는 혈색소 농도와 Hematocrit로부터 계산된 평균값으로, 개별 세포의 상태를 직접 반영하지 못한다","CHCM은 개별 적혈구의 혈색소 농도를 직접 측정하여 미묘한 저색소증이나 혼합 세포 집단을 감지할 수 있다","MCHC는 용혈, 지질혈증, 응집 등의 인공물에 의해 인위적으로 상승할 수 있어 해석이 어렵다","Vetscan OptiCell은 최초로 CHCM을_point-of-care에서 측정할 수 있는 장비로, 동물병원에서도 실험실 수준의 정밀도를 제공합니다"]},{"id":"2026-07-09_4","day":"2026-07-09","ts":1783594993000,"cat":"clinical","kicker":"임상","isToday":true,"title":"수의백신 개발 단계와 근거기반 가이드라인의 현재 동향","dek":"수의학 분야에서도 사람의학과 마찬가지로 백신 개발 단계별 연구 목표와 보호 지표 설정이 중요해지고 있습니다. 특히 수의백신 인허가 과정이 사람의백신보다 간소화된 만큼, 근거에 기반한 가이드라인의 필요성이 커지고 있습니다.","source":"Veterinary Practice News","country":"미국","date":"07.09","read":"1분 읽기","plate":"Veterinary Practice News","image":"https://www.veterinarypracticenews.com/wp-content/uploads/2026/07/ebvma-vaccines-unpacked.jpg","sourceUrl":"https://www.veterinarypracticenews.com/overview-veterinary-vaccine-research-regulations-guidelines/","body":["백신 개발은Phase 0에서 개념 입증, Phase I·II에서 보호 지표 확인과 최적 용량 결정, Phase III에서 자연 노출을 통한 유효성·안전성 증빙으로 진행됩니다. 사람의학에서는 Phase IV 사후 임상시험이 필수이지만, 수의학에서는 동일한 종으로 도전 실험이 가능하고 Phase IIb trial만으로 인허가되는 경우가 많아 개발 기간이 단축됩니다.","자의백신은 안전성과 순수성만 검증되며 효능 검증은 면제됩니다. 상용백신이 없거나 부족한 가축 질병에 한해수의사 직접 관리 하에 제한적으로 사용되는 것으로, 인허가 절차 간소화의 대표적인 사례입니다. 이러한 점에서 수의백신 승인은 종 특유의 요인보다 규제 환경이 더 관대한 편입니다.","최근 유럽 ENOVAT 프로젝트처럼 근거에 기반한 항균 치료 가이드라인을 개발하려는 시도도 이루어지고 있습니다. 체계적 문헌고찰 방식의 도입이 증가하면서, 수의학 분야도 합의 중심에서 근거 중심 가이드라인으로 전환하는 움직임이 본격화되고 있습니다. 한국 동물병원에서도 최신 백신 프로토콜을 적용할 때 이러한 국제 동향을 참고할 필요가 있습니다.","원문의 구체적 수치와 사례는 원문을 참고하시기 바랍니다."],"blog":"한국 동물병원에서는 최신 수의백신 가이드라인을 적용할 때, 국제적인 근거기반 권고안과 국내 실정을 병행 고려하는 방향으로 블로그 콘텐츠를 구성할 수 있습니다.","blogAngle":["수의백신은 동일한 종으로 한 도전 실험이 가능하여 인허가 과정이 사람의백신보다 간소화됩니다.","자의백신은 효능 검증 없이 안전성·순수성만 확인하고,수의사 관리 하 제한 사용되는 특수한 카테고리입니다.","근거기반 가이드라인은 체계적 문헌고찰을 통해 과학적 근거를 종합하여 권고안을 도출하는 방식입니다.","체계적 문헌고찰 방식의 확산으로 수의학 분야도 합의 중심에서 근거 중심 권고안으로 전환하고 있습니다."]},{"id":"2026-07-09_5","day":"2026-07-09","ts":1783569600000,"cat":"industry","kicker":"업계","isToday":true,"title":"원격진료 플랫폼 'Dutch'의 위험성 - 수의학적 안전장치 해체 우려","dek":"미국의 반려동물 원격진료 플랫폼 'Dutch'가 동물병원 진찰을 생략하고 약물을 처방하는 모델에 대해 수의학 경제학자가 경고했습니다. 안전장치 제거가 혁신이 아닌 위험 요소가 될 수 있다는 지적입니다.","source":"Dr. Andy Roark","country":"미국","date":"07.09","read":"1분 읽기","plate":"Dr. Andy Roark","image":"https://drandyroark.com/wp-content/uploads/cos-407-blog-pic.jpg","sourceUrl":"https://drandyroark.com/dangers-of-dutch/","body":["원격진료 플랫폼 Dutch가 “약속된 더 싼 가격, 더 쉬운 접근성”을 내세워 제한을 줄이는 방식으로 발전하고 있다. 수의경제학자 매트 살루아 박사는 최근 팟캐스트에서 이 모델을 ‘트로이 목마'에 비유하며 경고했다. 그는 VCPR(수의사-환자-보호자 관계)과 신체검사와 같은 안전장치를 제거하는 것이 혁신이 아니라 위험 요소라고 강조했다.","약국 수익이 동물병원 서비스를 보조하는 현재의 경제 구조도 중요한 배경이다. Dutch와 같은 플랫폼이 직접 약물을 처방·판매하면 동물병원의 수익 구조가 흔들릴 수 있다. 또한 진찰 없이 오진이 발생할 경우 오히려 진료비가 증가할 수 있고, 특히 중환 동물에서 증상 발현이 지연되는 치명적 결과로 이어질 수 있다. 누가 의료적 결정의 책임을 진다는 문제도 남아 있다.","한국 동물병원 관점에서 보면, 원격진료 플랫폼의 장점이면서 동시에 위험이 될 수 있는 부분은 보호자의 ‘편의성 추구'이다. 진찰을 생략한 약물 처방은 빠른 해결을 줄 수 있지만, 뒤따르는 부작용이나 오진의 비용을 생각해봐야 한다. 우리 병원에서도 원격진료 도입 시 어떤 안전장치를 유지할 것인지 기준을 마련하는 것이 필요하다."],"blog":"한국 동물병원 블로그에서는 “원격진료, 편리함 뒤의 위험” 주제로 보호자에게 진찰의 중요성을 안내하는 글을 쓸 수 있습니다","blogAngle":["Dutch 플랫폼은 VCPR(수의사-환자-보호자 관계) 없이 진찰을 생략하고 약물을 처방하는 모델을 제공합니다","진찰 없는 오진은 심각한 질병의 치료 지연과 전체 진료비 증가로 이어질 수 있습니다","약국 수익이 병원 서비스 보조 구조를 유지하는 기존 모델에 영향 줄 수 있습니다","한국 동물병원에서도 원격진료 도입 시 안전장치 기준을 마련할 필요가 있습니다"]}]}</script>

  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }

  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }

  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }

  function loadDate(date){

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
