<article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 만성질환에서 장유래 독소 관리와 영양 전략</h2><p><b>고양이 만성질환(CKD)에서 장에서 유래하는 다양한 독소들이 신장 손상 진행과 임상 증상에 중요한 역할을 한다는 최신 연구 결과가 제시되었다. 이러한 독소들의 관리를 위한 영양학적 접근법이 주목받고 있다.</b></p>
<p>만성질환을 가진 고양이에서 혈액 요소질소와 크레아티닌 외에도 다양한 요독물질이 축적되어 임상 증상을 악화시킨다. 이러한 독소들은 신장 손상과 전신 염증을 유발하여 질환 진행을 가속화하는 것으로 알려져 있다. 특히 창내 세균에 의한 영양소 발효 부산물인 인돌-3-초산, 인독설페이트, 파크레졸, 페닐아세트산, 트리메틸아민 N-옥사이드 등이 사람과 고양이 모두에서 임상적 관련성이 보고되었다.</p><p>정상적인 신장 기능을 가진 개체에서는 이러한 독소들이 효과적으로 제거되지만, 사구체 여과율이 감소한 고양이에서는 독소가 비례하여 축적된다. 또한 위장관 요인과 식이 성분이 장내 미생물 유래 독소 생산과 흡수를 증가시키는 것으로 나타났다. 연구에 따르면 여러 독소 농도가 IRIS 질환 중증도와 상관관계를 보이며, 일부 독소들은 신장의 항산화 능력을 저하시켜 신장 세관 손상을 악화시킨다.</p><p>영양 관리는 독소 농도를 낮추는 핵심 전략이다. 단백질 제한은 인 조절과 함께 독소 전구체 형성을 줄일 수 있어 중요하다. 다만, 고양이는 필수적인 육식동물로 최소 단백질 요구량을 충족해야 하며, 중등도에서 고단백 식이(100kcal당 8~11g)를 피하는 것이 낮은 단백질 식이(100kcal당 5.3~7g) 간 차이보다 더 큰 효과를 보이는 것으로 보고되었다. 고단백질의 소화율도 중요하며, 소화되지 않은 단백질이 결장에 도달하면 독소 전구체를 증가시킨다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/nutrition/nutritional-management-of-uremic-toxin-accumulation-in-cats-with-chronic-kidney-disease/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개의 단백질 손실 장염, 조기 진단이 생사를 가른다</h2><p><b>개의 위장관에서 과도한 단백질 손실이 발생하는 치명적 증후군인 단백질 손실 장염(PLE)은 만성 염증성 장염과 장 임파관확장증이 주된 원인으로, 문헌 고찰에 따르면 PLE 진단 시 54%의 개에서 생명이 끝난 것으로 보고되었다.</b></p>
<p>단백질 손실 장염(PLE)은 위장관 내강으로 단백질이 과도하게 손실되어 저단백혈증과 기타 전신 합병증을 유발하는 생명을 위협하는 증후군이다. 가장 흔한 원인은 만성 염증성 장염(CIE)과 장 임파관확장증(IL)으로, 이들은 독립적으로 또는 동시에 발생할 수 있다. PLE는 모든 연령과 품종에서 발생할 수 있으나, 일부 품종(소프트코티드 휘튼 테리어 등)에서 더 자주 보고되고 있으며, 감염성, 종양성, 내분비성, 기계적, 염증성 질환 등 다양한 원인으로 이차적으로 발생할 수 있다.</p><p>임상 증상으로는 만성, 재발성 또는 진행성 위장관 징후인 구토, 설사, 체중감소, 식욕 변화(식욕 감퇴 또는 식욕 항진)가 가장 흔하다. 저알부민혈증으로 인한 삼출성 질환으로 말초 부종, 복막 삼출, 흉막 삼출이 나타날 수 있으며, 일부 개에서는 위장관 징후가 없을 수도 있다. 진단은 저알부민혈증 확인, 비위장관 원인 배제, 기초 장 질환 식별에 중점을 두고 접근하며, 요단백 분석, 담즙산자극검사, 부신피질기능저하증 검사가 포함된다. 치료의 근간은 고흡수성, 저지방 식이 요법이며, 만성 염증성 장염 환자는 저알레르기 식이가 유익할 수 있다.</p><p>한국 동물병원 관점에서 PLE는 조기 발견과 개별화된 다각적 치료가 매우 중요한 질환이다. 임상의들은 만성 위장관 징후를 보이는 개에서 저단백혈증 소견 시 PLE 가능성을 반드시 고려해야 하며, 비위장관 원인(신장, 간, 부신피질기능저하증)을 체계적으로 배제하는 과정이 필요하다. 식이 요법이 치료의 핵심이므로, 저지방 고단백 식이의 효과적 모니터링과 함께 비타민 결핍 교정 및 필요시 면역억제 치료를 병행하는 통합적 접근이 권장된다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/gastroenterology/decoding-canine-protein-losing-enteropathy/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>고양이 배변 문제, 예방은 대화에서 시작된다</h2><p><b>고양이가 배변 상자를 사용하지 않는 문제는 수의료진이 가장 자주 마주하는 갈등 상황 중 하나다. 전문가들은 이를 '문제'가 되기 전에 사전에 대화하고, 상자 환경을 점검하는 것이 예방의 핵심이라고 강조한다.</b></p>
<p>고양이의 배변 문제(house soiling)는 보호자들이 가장 많이 상담 찾아오는 주제 중 하나로, 고양이와 보호자 모두에게 큰 스트레스를 유발한다. 수수의료진은 보호자가 문제를 발견한 첫 번째이자 유일한 접촉 점일 수 있으며, 초기 징후를 놓치지 않으면 개입 효과가 가장 높다. &quot;한 달에 한 번만 상자를 놓쳤다&quot;는 보호자의 한마디도 단순한 일회성이 아니라 고양이가 무언가를 표현하는 신호일 수 있다.</p><p>고양이는 보복이나 장난이 아닌 통증을 느끼거나, 스트레스, 고양이 간 갈등, 이동 장애, 만족되지 않은 욕구 등으로 배변 문제를 일으킨다. 개방형 질문을 통해 (&quot;상자 환경이 어떻게 되나요?&quot;, &quot;고양이가 가장 잘 쉬는 곳에서 상자가 얼마나 떨어져 있나요?&quot;) 실질적인 정보를 얻을 수 있고, 사진이나 영상도 유용하다. 이동 장애가 있거나 관절염이 있는 고양이는 낮은 입구의 상자가 필요하고, 소화기 문제가 있는 고양이는 휴식 공간 근처에 추가 상자를 두는 것이 좋다.</p><p>한국 동물병원에서도 모든 고양이 상담 시 화장실 대화를 일상화할 필요가 있다. 상자의 위치, 종류, 청소 주기, 모래 선호도, 사회적 상호작용, 스트레스 신호 등을 점검하는 행동력을 체계적으로 파악해야 한다. 이는 단순한 환경 점검을 넘어 고양이의 건강 문제를 조기에 발견하고 전반적인 복지를 향상시키는 기반이 된다.</p>
<p>원문: <a href="https://vetgirlontherun.com/why-the-litterbox-conversation-matters-rethinking-feline-house-soiling-in-veterinary-practice-vetgirl-veterinary-continuing-education-blog/" rel="nofollow">VetGirl</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개의당뇨병 관리에서 연속혈당측정기 활용 최신 동향</h2><p><b>연속혈당측정기(CGM)가 개의 당뇨병 관리에서 기존 병원 내 혈당 곡선 검사를 대신할 수 있는지 최신 연구 결과를 정리합니다. 동물 전용 제품이 출시되기 전까지는 인체용 기기의 한계와 주의점이 존재합니다.</b></p>
<p>최근 개의당뇨병 관리에서 연속혈당측정기(CGM) 사용이 증가하고 있습니다. CGM은 지속적인 모니터링과 병원 방문 횟수 감소라는 장점이 있으며, 단일 수치보다는 추세를 관찰할 수 있다는 점에서수의사에게도 유용합니다. 그러나 현재 수의학 분야에서 가장 보편적으로 사용되는 FreeStyle Libre 시스템은 인체용으로 설계되어 FDA 동물 사용 승인을 받지 않았습니다.</p><p>FreeStyle Libre 14일 시스템의 경우 초기 연구에서 당뇨병 개에서 임상적 정확도가 허용 가능한 수준으로 보고되었으나, 저혈당 범위 측정 정확도는 떨어지는 것으로 확인되었습니다. 급격한 혈당 변화 시에도 정확도가 저하되며, 피부 두께와 탈수 등의 요인이 영향을 미칠 수 있습니다. 고양이에서도 유사한 결과가 관찰되어 저혈당 상황에서 혈중 포도당 농도를 과대평가하는 경향이 있습니다. 가장 흔한 합병증은 가벼운 피부 변화이며, 드물게 기기가 적용된 동물에서 기흉이 보고된 바 있습니다.</p><p>한국 동물병원에서 CGM을 활용하려면 실제 적용 전 인체용 기기의 한계와 부작용에 대해 소유주에게 충분한 설명이 필요합니다. 측정값이 낮을 경우 반드시 전통적인 혈당 측정법으로 재확인해야 하고, 특히 저혈당 구간에서의 정확도 문제를 인지하고 있어야 합니다. 향후 동물 전용 CGM 출시 가능성이 있으므로 최신 동향을 지속적으로 추적할 것을 권장합니다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/endocrinology/continuous-glucose-monitor-use-in-small-animal-medicine/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>개 폐충감염의 진단과 치료: 임상에서 반드시 고려해야 할 원인</h2><p><b>미국에서 개 호흡기 질환의 원인 중 폐충은 드물지만, 적절한 진단검사가 이루어지지 않으면 간과되기 쉽습니다. 수의사들은 기침을 하는 개에서 다양한 폐충 종을 감별 진단하고 정확한 치료를 실시해야 합니다.</b></p>
<p>개 호흡기 감염은 세균, 바이러스, 진균, 기생충 등 다양한 원인에 의해 발생할 수 있습니다. 이 중 기생충 원인은 전체 비율이 낮아 간과되기 쉽지만, 적절한 진단 검사를 수행하면 폐충 감별이 가능합니다. 미국 개에서 발견되는 폐충에는 사상충류(Eucoleus aerophilus, Eucoleus boehmi, Crenosoma vulpis, Filaroides 종)와 분충류(Paragonimus kellicotti)가 있으며, 각 종마다 분포 지역과 임상 증상이 다릅니다.</p><p>Eucoleus boehmi는 코 점막에 서식하며 재채기, 코 분비물, 코출혈을 유발합니다. 유병률은 약 0.3%이며, FDA 승인 약물이 없어 목시덱틴(피부 도포) 또는 밀베마이신옥심이 비표준 치료제로 사용됩니다. Eucoleus aerophilus는 기관지와 폐포에 서식하며 만성 기침, 천식, 호흡 곤란을 보이고, 유병률은 약 0.04%입니다. Crenosoma vulpis(여우 폐충)는 미국 북동부에서 주로 발견되며 특정 지역에서 기침을 하는 개의 20.8%에서 검출되기도 합니다. 진단은 원심 분변 부유 검사, Baermann 검사, 기관지 내시경 등을 종합적으로 활용합니다.</p><p>한국 동물병원 관점에서, 만성 기침을 보이는 개에서 폐충을 감별 진단하는 것이 중요합니다. 특히 해외 여행 이력이 있거나 특정 지역의 환자에서 더 주의해야 합니다. 치료 약제가 제한적이어서 비표준 약물 사용이 필요할 수 있으며, 치료 효과 판정을 위해 추적 검사가 권장됩니다. 예방을 위해서는 환경 위생 관리와 함께 기생충 예방 약물 사용이 도움이 됩니다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/parasitology/diagnosis-and-treatment-of-lungworms-in-dogs/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>통조림 Dressing에서 생명 구하는 해독제로, 정맥 내 지방 유제 치료의 탄생</h2><p><b>동물 의학에서 중독 치료의 획기적 수단으로 자리 잡은 정맥 내 지방 유제(ILE) 치료가 일반적인 식용 유지와 밀접한 연관성을 가지고 있음을 소개합니다.</b></p>
<p>1962년 영양 공급제로 처음 사용된 Intralipid는 대두유에 계란 인지질을 혼합해 만든 무균 유제입니다. 바로 마요네즈를 만드는 원리와 동일한 유화 원리—계란으로 기름과 물을 안정적으로 섞는 방식—에서 영감을 받았습니다. 이후 수십 년간 영양 공급 목적으로만 사용되던 이 치료제가 1998년 부피바카인 유발 심정지 치료에 효과적임을 발견하면서 방향이 바뀌었습니다.</p><p>2006년 인체에서 첫 번째 ‘지질 구제’ 사례가 보고된 이후, ILE은 국소 마취제 독성 치료의 일차 치료제로 자리 잡았습니다. 현재는 이버멕틴, 칼슘 채널 차단제 등 지용성 약물 과량 복용 시에도 널리 사용되고 있습니다. ‘지질 싱크’ 모델과 ‘지질 셔틀’ 모델이 독소를 포착해 해독 기관으로 운반하는 메커니즘을 설명합니다.</p><p>한국 동물병원에서도 중독 응급 상황에서 ILE 치료의 가능성을 검토할 시점입니다. 특히 지용성 약물에 의한 중독 사례에서 기존의 해독제 치료가 효과가 없을 때, ILE이 보완적 치료 옵션이 될 수 있습니다. 다만 용량과 처치 방법은 원문의 상세 가이드를 참고해야 합니다.</p>
<p>원문: <a href="https://todaysveterinarypractice.com/personal-professional-development/from-salad-dressing-to-lifesaving-antidote-the-unexpected-path-of-iles/" rel="nofollow">Today's Veterinary Practice</a></p></article><article style="margin-bottom:28px;border-bottom:1px solid #ddd;padding-bottom:20px;">
<h2>애완동물 환각버섯 중독 증가...수의사 주목 필요</h2><p><b>미국에서 환각버섯이 사회적·법적으로 수용되면서 애완동물의 우발적인 중독 사례가 급증하고 있습니다. 환각버섯 함유 제품에는 다양한 유해물질이 혼합되어 있어 체계적 관리가 필요한 상황입니다.</b></p>
<p>환각버섯(‘매직 Mushrooms’)의 인기가 최근 몇 년간 급증하고 있습니다. Psilocybin이 주요 환각 성분으로 미국 몇 개 주에서 완전히 또는 부분적으로 비범죄화되면서 ‘자연’ 성분에 대한 관심과 함께 기능성 버섯(예: lion's mane, cordyceps, reishi, chaga)도 인기를 얻었습니다. 이러한 제품은 초콜릿이나 젤리 형태로 판매되는 경우가 많아 애완동물이 실수로 먹기 쉽고, 일부 제품에서는 초콜릿 중독도 동시에 발생합니다.</p><p>2024년 한 회사에서 판매된 환각버섯 초콜릿 바와 젤리 제품 145건의 인간 질병, 59건의 입원, 2건의 의심 사망과 관련되어 리콜되었습니다. 제품 분석 결과 22개 샘플에서 muscimol, psilocin, psilacetin, pregabalin, 카바 식물 유래 성분 등이 검출되었습니다. 동물에서 psilocybin 버섯은 의식 변화, 실조, 발성, 동공 확대, 고열을 일으키고, muscarine 함유 버섯은 SLUDGE 증후군(타액 분비, 눈물, 배변, 구토 등)을, isoxazole 버섯은 구토, 실조, 환각, 경련을 유발할 수 있습니다.</p><p>한국 동물병원에서도 환각버섯 함유 제품에 노출된 동물환자가 발생할 가능성이 있습니다. 현재 국내 상황은 미국과 다르지만, 해외 여행이나 온라인 구매를 통해 이러한 제품에 접근할 수 있습니다. 또한 제품 성분에 대한 규제가 없어 다양한 유해물질이 혼합될 수 있어 의심 환자의 병력 청취 시 환자 가족의 환각버섯 사용 여부도 확인해야 합니다. 치료는 증상 치료 중심으로 atropine 등 약물 사용이 원문에 자세히 설명되어 있습니다.</p>

<script id="vm-issue" type="application/json">{"date":"2026-06-19","dateLabel":"2026.06.19","dateline":"2026년 6월 19일 · 금요일","editionNo":"1,995","count":7,"cats":[{"key":"clinical","label":"임상"},{"key":"client_communication","label":"보호자 소통"}],"articles":[{"id":"2026-06-19_1","day":"2026-06-19","ts":1781808895000,"cat":"clinical","kicker":"임상","isToday":false,"title":"고양이 만성질환에서 장유래 독소 관리와 영양 전략","dek":"고양이 만성질환(CKD)에서 장에서 유래하는 다양한 독소들이 신장 손상 진행과 임상 증상에 중요한 역할을 한다는 최신 연구 결과가 제시되었다. 이러한 독소들의 관리를 위한 영양학적 접근법이 주목받고 있다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/06/Jugan_UremicToxinsNutrition_TVPJulAug26_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/nutrition/nutritional-management-of-uremic-toxin-accumulation-in-cats-with-chronic-kidney-disease/","body":["만성질환을 가진 고양이에서 혈액 요소질소와 크레아티닌 외에도 다양한 요독물질이 축적되어 임상 증상을 악화시킨다. 이러한 독소들은 신장 손상과 전신 염증을 유발하여 질환 진행을 가속화하는 것으로 알려져 있다. 특히 창내 세균에 의한 영양소 발효 부산물인 인돌-3-초산, 인독설페이트, 파크레졸, 페닐아세트산, 트리메틸아민 N-옥사이드 등이 사람과 고양이 모두에서 임상적 관련성이 보고되었다.","정상적인 신장 기능을 가진 개체에서는 이러한 독소들이 효과적으로 제거되지만, 사구체 여과율이 감소한 고양이에서는 독소가 비례하여 축적된다. 또한 위장관 요인과 식이 성분이 장내 미생물 유래 독소 생산과 흡수를 증가시키는 것으로 나타났다. 연구에 따르면 여러 독소 농도가 IRIS 질환 중증도와 상관관계를 보이며, 일부 독소들은 신장의 항산화 능력을 저하시켜 신장 세관 손상을 악화시킨다.","영양 관리는 독소 농도를 낮추는 핵심 전략이다. 단백질 제한은 인 조절과 함께 독소 전구체 형성을 줄일 수 있어 중요하다. 다만, 고양이는 필수적인 육식동물로 최소 단백질 요구량을 충족해야 하며, 중등도에서 고단백 식이(100kcal당 8~11g)를 피하는 것이 낮은 단백질 식이(100kcal당 5.3~7g) 간 차이보다 더 큰 효과를 보이는 것으로 보고되었다. 고단백질의 소화율도 중요하며, 소화되지 않은 단백질이 결장에 도달하면 독소 전구체를 증가시킨다."],"blog":"한국 동물병원에서는 만성질환 고양이 고객에게 단백질 섭취량 검토와 고소화성 단백질 선택의 중요성을 상담 콘텐츠로 활용할 수 있다.","blogAngle":["장유래 독소 약 100종이 고양이 만성질환의 임상 증상과 질환 진행에 관여한다.","독소 농도가 높을수록 IRIS 중증도가 높아지며, 일부 독소는 신장 손상을 직접 악화시킨다.","단백질 제한은 독소 전구체 형성을 줄이되 필수 아미노산 섭취는 보장해야 한다.","고단백질 식이 피하기가 낮은 단백질 식이 간 차이보다 독소 감소에 더 효과적이다."],"radar":null,"tag":""},{"id":"2026-06-19_2","day":"2026-06-19","ts":1781808849000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의 단백질 손실 장염, 조기 진단이 생사를 가른다","dek":"개의 위장관에서 과도한 단백질 손실이 발생하는 치명적 증후군인 단백질 손실 장염(PLE)은 만성 염증성 장염과 장 임파관확장증이 주된 원인으로, 문헌 고찰에 따르면 PLE 진단 시 54%의 개에서 생명이 끝난 것으로 보고되었다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/06/Schmid_CaninePLE_TVPJulAug26_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/gastroenterology/decoding-canine-protein-losing-enteropathy/","body":["단백질 손실 장염(PLE)은 위장관 내강으로 단백질이 과도하게 손실되어 저단백혈증과 기타 전신 합병증을 유발하는 생명을 위협하는 증후군이다. 가장 흔한 원인은 만성 염증성 장염(CIE)과 장 임파관확장증(IL)으로, 이들은 독립적으로 또는 동시에 발생할 수 있다. PLE는 모든 연령과 품종에서 발생할 수 있으나, 일부 품종(소프트코티드 휘튼 테리어 등)에서 더 자주 보고되고 있으며, 감염성, 종양성, 내분비성, 기계적, 염증성 질환 등 다양한 원인으로 이차적으로 발생할 수 있다.","임상 증상으로는 만성, 재발성 또는 진행성 위장관 징후인 구토, 설사, 체중감소, 식욕 변화(식욕 감퇴 또는 식욕 항진)가 가장 흔하다. 저알부민혈증으로 인한 삼출성 질환으로 말초 부종, 복막 삼출, 흉막 삼출이 나타날 수 있으며, 일부 개에서는 위장관 징후가 없을 수도 있다. 진단은 저알부민혈증 확인, 비위장관 원인 배제, 기초 장 질환 식별에 중점을 두고 접근하며, 요단백 분석, 담즙산자극검사, 부신피질기능저하증 검사가 포함된다. 치료의 근간은 고흡수성, 저지방 식이 요법이며, 만성 염증성 장염 환자는 저알레르기 식이가 유익할 수 있다.","한국 동물병원 관점에서 PLE는 조기 발견과 개별화된 다각적 치료가 매우 중요한 질환이다. 임상의들은 만성 위장관 징후를 보이는 개에서 저단백혈증 소견 시 PLE 가능성을 반드시 고려해야 하며, 비위장관 원인(신장, 간, 부신피질기능저하증)을 체계적으로 배제하는 과정이 필요하다. 식이 요법이 치료의 핵심이므로, 저지방 고단백 식이의 효과적 모니터링과 함께 비타민 결핍 교정 및 필요시 면역억제 치료를 병행하는 통합적 접근이 권장된다."],"blog":"만성 설사나 구토를 보이는 환자에서 저단백혈증 소견 시 PLE 가능성을 반드시 고려하고, 비위장관 원인 배제 후 기초 장 질환에 맞춘 개별화된 치료 계획을 세우는 것이 중요함을 강조하는 병원 블로그 글을 작성할 수 있다","blogAngle":["PLE는 위장관으로의 과도한 단백질 손실로 인해 저단백혈증을 유발하는 생명을 위협하는 증후군이다","만성 염증성 장염(CIE)과 장 임파관확장증(IL)이 가장 흔한 원인이며, 두 질환이 동시에 존재할 수 있다","임상 증상으로는 만성 구토, 설사, 체중감소와 함께 저알부민혈증에 의한 부종, 삼출 등이 나타난다","치료의 핵심은 고흡수성 저지방 식이 요법이며, 일부 환자에게 면역억제제가 필요할 수 있다"],"radar":null,"tag":""},{"id":"2026-06-19_3","day":"2026-06-19","ts":1781863233000,"cat":"client_communication","kicker":"보호자 소통","isToday":true,"title":"고양이 배변 문제, 예방은 대화에서 시작된다","dek":"고양이가 배변 상자를 사용하지 않는 문제는 수의료진이 가장 자주 마주하는 갈등 상황 중 하나다. 전문가들은 이를 '문제'가 되기 전에 사전에 대화하고, 상자 환경을 점검하는 것이 예방의 핵심이라고 강조한다.","source":"VetGirl","country":"미국","date":"06.19","read":"2분 읽기","plate":"VetGirl","image":"https://vetgirlontherun.com/wp-content/uploads/2026/06/30-e1765900489776.png","sourceUrl":"https://vetgirlontherun.com/why-the-litterbox-conversation-matters-rethinking-feline-house-soiling-in-veterinary-practice-vetgirl-veterinary-continuing-education-blog/","body":["고양이의 배변 문제(house soiling)는 보호자들이 가장 많이 상담 찾아오는 주제 중 하나로, 고양이와 보호자 모두에게 큰 스트레스를 유발한다. 수수의료진은 보호자가 문제를 발견한 첫 번째이자 유일한 접촉 점일 수 있으며, 초기 징후를 놓치지 않으면 개입 효과가 가장 높다. \"한 달에 한 번만 상자를 놓쳤다\"는 보호자의 한마디도 단순한 일회성이 아니라 고양이가 무언가를 표현하는 신호일 수 있다.","고양이는 보복이나 장난이 아닌 통증을 느끼거나, 스트레스, 고양이 간 갈등, 이동 장애, 만족되지 않은 욕구 등으로 배변 문제를 일으킨다. 개방형 질문을 통해 (\"상자 환경이 어떻게 되나요?\", \"고양이가 가장 잘 쉬는 곳에서 상자가 얼마나 떨어져 있나요?\") 실질적인 정보를 얻을 수 있고, 사진이나 영상도 유용하다. 이동 장애가 있거나 관절염이 있는 고양이는 낮은 입구의 상자가 필요하고, 소화기 문제가 있는 고양이는 휴식 공간 근처에 추가 상자를 두는 것이 좋다.","한국 동물병원에서도 모든 고양이 상담 시 화장실 대화를 일상화할 필요가 있다. 상자의 위치, 종류, 청소 주기, 모래 선호도, 사회적 상호작용, 스트레스 신호 등을 점검하는 행동력을 체계적으로 파악해야 한다. 이는 단순한 환경 점검을 넘어 고양이의 건강 문제를 조기에 발견하고 전반적인 복지를 향상시키는 기반이 된다."],"blog":"한국 동물병원 블로그에 \"고양이 상자 환경 체크리스트\"로 활용하면 좋은 주제이며, 보호자와의 소통 기술 예시와 함께 독자들의 관심을 끌 수 있는 콘텐츠가 될 것이다.","blogAngle":["고양이 배변 문제는 '문제'가 되기 전, 초기 징후 때 개입하는 것이 가장 효과적이다.","개방형 질문과 사진·영상 활용으로 상자 환경의 문제점을 쉽게 파악할 수 있다.","통증, 스트레스, 이동 장애 등 다양한 원인을 고려한 포괄적 평가가 필요하다.","모든 고양이 상담에 화장실 대화를 일상적으로 포함시켜 예방과 조기 발견을 강화해야 한다."],"radar":null,"tag":""},{"id":"2026-06-19_4","day":"2026-06-19","ts":1781808930000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개의당뇨병 관리에서 연속혈당측정기 활용 최신 동향","dek":"연속혈당측정기(CGM)가 개의 당뇨병 관리에서 기존 병원 내 혈당 곡선 검사를 대신할 수 있는지 최신 연구 결과를 정리합니다. 동물 전용 제품이 출시되기 전까지는 인체용 기기의 한계와 주의점이 존재합니다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/06/Patterson_CGMs_TVPJulAug26_Fig2.png","sourceUrl":"https://todaysveterinarypractice.com/endocrinology/continuous-glucose-monitor-use-in-small-animal-medicine/","body":["최근 개의당뇨병 관리에서 연속혈당측정기(CGM) 사용이 증가하고 있습니다. CGM은 지속적인 모니터링과 병원 방문 횟수 감소라는 장점이 있으며, 단일 수치보다는 추세를 관찰할 수 있다는 점에서수의사에게도 유용합니다. 그러나 현재 수의학 분야에서 가장 보편적으로 사용되는 FreeStyle Libre 시스템은 인체용으로 설계되어 FDA 동물 사용 승인을 받지 않았습니다.","FreeStyle Libre 14일 시스템의 경우 초기 연구에서 당뇨병 개에서 임상적 정확도가 허용 가능한 수준으로 보고되었으나, 저혈당 범위 측정 정확도는 떨어지는 것으로 확인되었습니다. 급격한 혈당 변화 시에도 정확도가 저하되며, 피부 두께와 탈수 등의 요인이 영향을 미칠 수 있습니다. 고양이에서도 유사한 결과가 관찰되어 저혈당 상황에서 혈중 포도당 농도를 과대평가하는 경향이 있습니다. 가장 흔한 합병증은 가벼운 피부 변화이며, 드물게 기기가 적용된 동물에서 기흉이 보고된 바 있습니다.","한국 동물병원에서 CGM을 활용하려면 실제 적용 전 인체용 기기의 한계와 부작용에 대해 소유주에게 충분한 설명이 필요합니다. 측정값이 낮을 경우 반드시 전통적인 혈당 측정법으로 재확인해야 하고, 특히 저혈당 구간에서의 정확도 문제를 인지하고 있어야 합니다. 향후 동물 전용 CGM 출시 가능성이 있으므로 최신 동향을 지속적으로 추적할 것을 권장합니다."],"blog":"한국 동물병원 블로그나 소셜 미디어에서 당뇨병 관리 상담 시 CGM 활용의 장단점을 proprietários에게 정확히 안내하는 콘텐츠로 활용할 수 있습니다.","blogAngle":["연속혈당측정기(CGM)는 개의 당뇨병 관리에서 추세 기반 치료 결정에 유용하지만 현재는 인체용 기기를 동물에 비승인 사용해야 하는 상황이다","저혈당 범위와 급격한 혈당 변화 시 CGM 측정값의 정확도가 낮아 전통적 혈당 측정법으로 확인이 필수적이다","가장 흔한 부작용은 가벼운 피부 변화이며, 드물지만 기흉 등의 심각한 합병증도 보고되어 주의가 필요하다","동물 전용 CGM(GluCurve Pet CGM)이 출시 예정이므로 향후 동향을 주시할 필요가 있다"],"radar":null,"tag":""},{"id":"2026-06-19_5","day":"2026-06-19","ts":1781808919000,"cat":"clinical","kicker":"임상","isToday":false,"title":"개 폐충감염의 진단과 치료: 임상에서 반드시 고려해야 할 원인","dek":"미국에서 개 호흡기 질환의 원인 중 폐충은 드물지만, 적절한 진단검사가 이루어지지 않으면 간과되기 쉽습니다. 수의사들은 기침을 하는 개에서 다양한 폐충 종을 감별 진단하고 정확한 치료를 실시해야 합니다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/06/JesudossChelladurai_Lungworms_TVPJulAug26_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/parasitology/diagnosis-and-treatment-of-lungworms-in-dogs/","body":["개 호흡기 감염은 세균, 바이러스, 진균, 기생충 등 다양한 원인에 의해 발생할 수 있습니다. 이 중 기생충 원인은 전체 비율이 낮아 간과되기 쉽지만, 적절한 진단 검사를 수행하면 폐충 감별이 가능합니다. 미국 개에서 발견되는 폐충에는 사상충류(Eucoleus aerophilus, Eucoleus boehmi, Crenosoma vulpis, Filaroides 종)와 분충류(Paragonimus kellicotti)가 있으며, 각 종마다 분포 지역과 임상 증상이 다릅니다.","Eucoleus boehmi는 코 점막에 서식하며 재채기, 코 분비물, 코출혈을 유발합니다. 유병률은 약 0.3%이며, FDA 승인 약물이 없어 목시덱틴(피부 도포) 또는 밀베마이신옥심이 비표준 치료제로 사용됩니다. Eucoleus aerophilus는 기관지와 폐포에 서식하며 만성 기침, 천식, 호흡 곤란을 보이고, 유병률은 약 0.04%입니다. Crenosoma vulpis(여우 폐충)는 미국 북동부에서 주로 발견되며 특정 지역에서 기침을 하는 개의 20.8%에서 검출되기도 합니다. 진단은 원심 분변 부유 검사, Baermann 검사, 기관지 내시경 등을 종합적으로 활용합니다.","한국 동물병원 관점에서, 만성 기침을 보이는 개에서 폐충을 감별 진단하는 것이 중요합니다. 특히 해외 여행 이력이 있거나 특정 지역의 환자에서 더 주의해야 합니다. 치료 약제가 제한적이어서 비표준 약물 사용이 필요할 수 있으며, 치료 효과 판정을 위해 추적 검사가 권장됩니다. 예방을 위해서는 환경 위생 관리와 함께 기생충 예방 약물 사용이 도움이 됩니다."],"blog":"만성 기침을 보이는 개 환자에서 폐충을 감별 진단해야 하는 이유와 구체적인 검사 및 치료 접근법을 한국의 수의사 동료들에게 안내하는 콘텐츠로 활용할 수 있습니다.","blogAngle":["미국에서 발견되는 개 폐충은 Eucoleus, Crenosoma, Filaroides, Paragonimus 등 여러 종이며, 각각 서식 부위와 임상 증상이 다르다.","폐충 감별 진단에는 원심 분변 부유 검사, Baermann 검사, 기관지 내시경 등이 사용되며, 종에 따라 최적의 진단 방법이 다르다.","대부분의 폐충 감염에는 FDA 승인 약물이 없어 비표준 치료제로 목시덱틴, 밀베마이신옥심, 페넴벤다졸 등이 사용된다.","Crenosoma vulpis는 미국 북동부 특정 지역에서 기침 개에서 20% 이상 검출되어 지역적으로 중요한 원인이다."],"radar":null,"tag":""},{"id":"2026-06-19_6","day":"2026-06-19","ts":1781808970000,"cat":"clinical","kicker":"임상","isToday":false,"title":"통조림 Dressing에서 생명 구하는 해독제로, 정맥 내 지방 유제 치료의 탄생","dek":"동물 의학에서 중독 치료의 획기적 수단으로 자리 잡은 정맥 내 지방 유제(ILE) 치료가 일반적인 식용 유지와 밀접한 연관성을 가지고 있음을 소개합니다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"1분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2019/04/T1905C01Slider.gif","sourceUrl":"https://todaysveterinarypractice.com/personal-professional-development/from-salad-dressing-to-lifesaving-antidote-the-unexpected-path-of-iles/","body":["1962년 영양 공급제로 처음 사용된 Intralipid는 대두유에 계란 인지질을 혼합해 만든 무균 유제입니다. 바로 마요네즈를 만드는 원리와 동일한 유화 원리—계란으로 기름과 물을 안정적으로 섞는 방식—에서 영감을 받았습니다. 이후 수십 년간 영양 공급 목적으로만 사용되던 이 치료제가 1998년 부피바카인 유발 심정지 치료에 효과적임을 발견하면서 방향이 바뀌었습니다.","2006년 인체에서 첫 번째 ‘지질 구제’ 사례가 보고된 이후, ILE은 국소 마취제 독성 치료의 일차 치료제로 자리 잡았습니다. 현재는 이버멕틴, 칼슘 채널 차단제 등 지용성 약물 과량 복용 시에도 널리 사용되고 있습니다. ‘지질 싱크’ 모델과 ‘지질 셔틀’ 모델이 독소를 포착해 해독 기관으로 운반하는 메커니즘을 설명합니다.","한국 동물병원에서도 중독 응급 상황에서 ILE 치료의 가능성을 검토할 시점입니다. 특히 지용성 약물에 의한 중독 사례에서 기존의 해독제 치료가 효과가 없을 때, ILE이 보완적 치료 옵션이 될 수 있습니다. 다만 용량과 처치 방법은 원문의 상세 가이드를 참고해야 합니다."],"blog":"한국 동물병원 블로그에서 ‘우리 병원 응급실 이렇게 준비합니다: 지용성 약물 중독 대처법’ 제목으로 ILE 치료의 원리와 적용 상황을 설명하는 콘텐츠를 제작할 수 있습니다","blogAngle":["ILE은 대두유와 계란 인지질을 유화시킨 정맥 주사제로, 원리는 마요네즈와 동일합니다","1998년 부피바카인 유발 심정지 치료 효과가 발견된 후 응급 치료제로 전환되었습니다","이제 ivermectin, 칼슘 채널 차단제 등 다양한 지용성 약물 과량 복용에 사용됩니다","한국 동물병원에서는 기존 해독제가 효과가 없는 중독 상황에서 보완 치료 옵션으로 검토할 가치가 있습니다"],"radar":null,"tag":""},{"id":"2026-06-19_7","day":"2026-06-19","ts":1781808942000,"cat":"clinical","kicker":"임상","isToday":false,"title":"애완동물 환각버섯 중독 증가...수의사 주목 필요","dek":"미국에서 환각버섯이 사회적·법적으로 수용되면서 애완동물의 우발적인 중독 사례가 급증하고 있습니다. 환각버섯 함유 제품에는 다양한 유해물질이 혼합되어 있어 체계적 관리가 필요한 상황입니다.","source":"Today's Veterinary Practice","country":"미국","date":"06.19","read":"2분 읽기","plate":"Today's Veterinary Practice","image":"https://todaysveterinarypractice.com/wp-content/uploads/sites/4/2026/06/Wismer_BeyondtheClinic_TVPJulAug26_MainImage.png","sourceUrl":"https://todaysveterinarypractice.com/toxicology/hallucinogenic-mushroom-intoxications-are-getting-higher/","body":["환각버섯(‘매직 Mushrooms’)의 인기가 최근 몇 년간 급증하고 있습니다. Psilocybin이 주요 환각 성분으로 미국 몇 개 주에서 완전히 또는 부분적으로 비범죄화되면서 ‘자연’ 성분에 대한 관심과 함께 기능성 버섯(예: lion's mane, cordyceps, reishi, chaga)도 인기를 얻었습니다. 이러한 제품은 초콜릿이나 젤리 형태로 판매되는 경우가 많아 애완동물이 실수로 먹기 쉽고, 일부 제품에서는 초콜릿 중독도 동시에 발생합니다.","2024년 한 회사에서 판매된 환각버섯 초콜릿 바와 젤리 제품 145건의 인간 질병, 59건의 입원, 2건의 의심 사망과 관련되어 리콜되었습니다. 제품 분석 결과 22개 샘플에서 muscimol, psilocin, psilacetin, pregabalin, 카바 식물 유래 성분 등이 검출되었습니다. 동물에서 psilocybin 버섯은 의식 변화, 실조, 발성, 동공 확대, 고열을 일으키고, muscarine 함유 버섯은 SLUDGE 증후군(타액 분비, 눈물, 배변, 구토 등)을, isoxazole 버섯은 구토, 실조, 환각, 경련을 유발할 수 있습니다.","한국 동물병원에서도 환각버섯 함유 제품에 노출된 동물환자가 발생할 가능성이 있습니다. 현재 국내 상황은 미국과 다르지만, 해외 여행이나 온라인 구매를 통해 이러한 제품에 접근할 수 있습니다. 또한 제품 성분에 대한 규제가 없어 다양한 유해물질이 혼합될 수 있어 의심 환자의 병력 청취 시 환자 가족의 환각버섯 사용 여부도 확인해야 합니다. 치료는 증상 치료 중심으로 atropine 등 약물 사용이 원문에 자세히 설명되어 있습니다."],"blog":"국내에서도 해외 여행객이나 온라인 쇼핑을 통해 환각버섯 제품에 노출될 수 있으므로, 이상 행동 보이는 애완동물 접수 시 가족력에서 환각물질 노출 여부 확인을 권유하는 블로그 글을 작성해 볼 만합니다.","blogAngle":["미국에서 환각버섯 관련 제품이 2024년 145건의 인간 질병과 연관되어 리콜되었으며, 분석 결과 여러 유해물질이 혼합되어 있었음","애완동물에서 psilocybin 버섯 중독 시 의식 변화, 실조, 발성, 고열이 흔하고, muscarine 중독 시 SLUDGE 증후군이 나타나며, isoxazole 버섯은 구토, 경련, 저체온을 유발할 수 있음","환각버섯 제품은 초콜릿이나 젤리 형태로 판매되어 애완동물의 실수 섭취 위험이 높고, 초콜릿 중독이 동시에 발생할 수 있음","환각버섯 중독의 증상 지속 시간은 보통 6~24시간이며, 환자 가족의 환각버섯 사용 병력 확인이 진단에 중요함"],"radar":null,"tag":""}],"stories":[]}</script>

  // 프런트페이지 편집 칼럼 "진료실 문답" — 보호자 질문을 신문 Q&A 지면처럼.
  function qaColumn(arr){

      +'<div class="vm-hl" style="font-family:var(--font-display);font-size:17px;line-height:1.42;font-weight:700;color:var(--color-label-strong);text-wrap:pretty;">'+e(a.radar.owner.q)+'</div></div>';

  }

  // 3열 밴드 그리드. 마지막 줄이 안 차면 빈 칸에 배경색이 드러나므로 채움 셀을 넣는다
  // (모바일 1열에서는 채움 셀을 숨긴다).
  function bandGrid(list){
    var pad=(3-(list.length%3))%3, fill='';

  // "최근 브리핑" — 오늘 발행분이 적은 날에도 1면이 허전하지 않도록 지난 며칠 기사를 함께.
  function recentSection(){
    if(S.cat!=='all'||S.unreadOnly||S.query.trim()||DATA.weekly) return '';

  // "진료실 밖 이야기" — 네이트판식 화제글 보드(신뢰 뉴스와 분리, 캐주얼)
  function storyBoard(){

      +'<span style="flex:none;width:20px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--color-label-assistive);text-align:center;">'+(i+1)+'</span>'

    }).join('');
    return '<div style="margin-top:32px;padding:22px 24px 24px;background:var(--color-background-alternative);border-radius:16px;">'
    +'<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:2px;"><span style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--color-label-strong);">진료실 밖 이야기</span><span style="font-size:12.5px;color:var(--color-label-alternative);">해외에서 화제가 된 반려동물·병원 썰</span></div>'

  function homeView(){
    var arr=activeList();

  function listView(items,emptyT,emptyH){

    return '<div style="padding-top:16px;"><div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;"><button data-act="makedraft" style="display:inline-flex;align-items:center;gap:8px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">✍️ AI 블로그 초안 만들기</button><button data-act="copyall" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--color-primary-normal);border:1px solid var(--color-primary-normal);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 전체 복사</button></div>'+items.map(ideaCard).join('')+'</div>';

        +'<div style="white-space:pre-wrap;font-size:15px;line-height:1.85;color:var(--color-label-neutral);background:var(--color-background-alternative);border-radius:10px;padding:16px 18px;">'+e(r.body||'')+'</div>'
        +'<div style="margin:16px 0 8px;">'+tags+'</div>'
        +'<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;"><button data-act="copydraft" style="display:inline-flex;align-items:center;gap:6px;background:var(--color-primary-normal);color:#fff;border:0;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:10px;">'+COPY+' 제목+본문+태그 전체 복사</button><button data-act="draftclose" style="border:1px solid var(--color-line-normal);background:var(--color-background-normal);color:var(--color-label-neutral);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 16px;border-radius:10px;">닫기</button></div>'
        +'<p style="margin:14px 0 0;font-size:11px;color:var(--color-label-alternative);line-height:1.5;">AI가 생성한 초안입니다. 발행 전 사실관계·의료광고 규정을 확인하고 병원 톤에 맞게 다듬어 사용하세요.</p>'
        +'</div>';
    }
    return '<div data-act="draftclose" style="position:fixed;inset:0;background:var(--color-material-dimmer);z-index:70;animation:vmFade .18s ease-out;"></div>'
      +'<div data-theme="'+S.theme+'" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);overflow:auto;background:var(--color-background-normal);color:var(--color-label-normal);border-radius:16px;z-index:71;box-shadow:var(--elevation-5);animation:vmFade .2s ease-out;font-family:var(--font-sans);">'
      +'<div style="position:sticky;top:0;background:var(--color-background-normal);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--color-line-normal);"><div style="font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--color-label-strong);">✍️ 블로그 초안</div><button data-act="draftclose" style="width:32px;height:32px;border:0;background:var(--color-material-base);border-radius:8px;cursor:pointer;color:var(--color-label-neutral);display:inline-flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'
      +inner+'</div>';
  }
  function makeDraft(ideas){
    if(!ideas.length){ toast('먼저 글감을 담아주세요'); return; }
    S.draft={loading:true,n:ideas.length}; render();
    fetch('api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ideas:ideas})})
      .then(function(r){return r.json();})
      .then(function(res){ if(res.error){ S.draft={error:res.error}; } else { S.draft={result:res}; } render(); })
      .catch(function(err){ S.draft={error:'네트워크 오류 ('+err.message+')'}; render(); });
  }
  function draftFullText(r){ return (r.titles&&r.titles[0]?r.titles[0]+'\n\n':'')+(r.body||'')+'\n\n'+((r.hashtags||[]).join(' ')); }

  // ── 기능 C: 공유 ──
  function shareArticle(a){
    var url=location.origin+location.pathname+'#'+a.id;
    if(navigator.share){ navigator.share({title:a.title,text:a.dek,url:url}).catch(function(){}); }
    else { copy(url,'링크를 복사했습니다'); }
  }
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>';

  // ── 기능 B: 구독 ──
  function subscribe(email){
    fetch('api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json();})
      .then(function(res){ toast(res.ok?'구독 신청 완료! 매일 아침 받아보세요':(res.error||'실패')); })
      .catch(function(){ toast('네트워크 오류'); });
  }
  function markRead(id){ if(!S.read[id]){ S.read[id]=1; persist('read',S.read); } }
  function openArticle(id){
    if(byId[id]){ S.openId=id; S.blogOpen=true; S.searchFocus=false; markRead(id); var db; render(); db=document.getElementById('vm-db'); if(db) db.scrollTop=0; }
    else { var d=id.split('_')[0]; location.href = (location.pathname.indexOf('/issues/')>=0?'':'issues/')+d+'.html#'+id; }
  }
  function toggleIdea(id){
    var a=byId[id]; if(!a && S.ideas[id]){ delete S.ideas[id]; persist('ideas',S.ideas); toast('글감함에서 뺐습니다'); render(); return; }
    if(!a) return;
    if(S.ideas[id]){ delete S.ideas[id]; toast('글감함에서 뺐습니다'); } else { S.ideas[id]=snap(a); toast('글감함에 담았습니다'); }
    persist('ideas',S.ideas); render();
  }
  function blogText(a){ return a.blog + (a.blogAngle&&a.blogAngle.length?'\n\n[이렇게 풀어보세요]\n'+a.blogAngle.map(function(x){return '· '+x;}).join('\n'):'') + '\n\n(출처: '+a.source+(a.country?' · '+a.country:'')+')'; }
  function copy(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast(msg); }

  function loadArchive(){
    fetch('archive.json').then(function(r){return r.json();}).then(function(list){ S.archive=list; render(); }).catch(function(){ S.archive=[]; render(); });
  }
  function loadDate(date){
    if(date===DATA.date){ S.view='home'; render(); return; }
    S.loadingDate=date; render();
    fetch('data/'+date+'.json').then(function(r){return r.json();}).then(function(d){ DATA=d; indexDay(); S.view='home'; S.openId=null; S.query=''; S.cat='all'; S.showAll=false; S.loadingDate=null; try{history.replaceState(null,'','issues/'+date+'.html');}catch(e){} render(); }).catch(function(){ S.loadingDate=null; toast('불러오지 못했습니다'); render(); });
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-save],[data-idea],[data-open],[data-act],[data-nav],[data-cat],[data-date],[data-href]');
    if(!el) return;
    if(el.hasAttribute('data-href')){ ev.stopPropagation(); location.href=el.getAttribute('data-href'); return; }
    if(el.hasAttribute('data-save')){ ev.stopPropagation(); var id=el.getAttribute('data-save'); var a=byId[id]; if(S.saved[id]){ delete S.saved[id]; } else { S.saved[id]= a?snap(a):(S.saved[id]||{id:id}); } persist('saved',S.saved); render(); return; }
    if(el.hasAttribute('data-idea')){ ev.stopPropagation(); toggleIdea(el.getAttribute('data-idea')); return; }
    if(el.hasAttribute('data-nav')){ ev.stopPropagation(); var v=el.getAttribute('data-nav'); S.view=v; S.openId=null; if(v!=='home'&&v!=='archive') S.query=''; if(v==='home') S.query=''; if(v==='archive'&&S.archive===null) loadArchive(); S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-cat')){ ev.stopPropagation(); S.cat=el.getAttribute('data-cat'); S.showAll=false; S.searchFocus=false; render(); return; }
    if(el.hasAttribute('data-date')){ ev.stopPropagation(); loadDate(el.getAttribute('data-date')); return; }
    var act=el.getAttribute('data-act');
    if(act){
      ev.stopPropagation();
      if(act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; persist('theme',S.theme); }
      else if(act==='rel'){ S.sort='rel'; }
      else if(act==='latest'){ S.sort='latest'; }
      else if(act==='unread'){ S.unreadOnly=!S.unreadOnly; S.showAll=false; }
      else if(act==='more'){ S.showAll=true; }
      else if(act==='close'){ S.openId=null; }
      else if(act==='blog'){ S.blogOpen=!S.blogOpen; }
      else if(act==='prev'||act==='next'){ var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); var t=act==='next'?ctx[i+1]:ctx[i-1]; if(t){ openArticle(t.id); return; } }
      else if(act==='fs+'){ S.fs=Math.min(1.5,Math.round((S.fs+0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='fs-'){ S.fs=Math.max(0.85,Math.round((S.fs-0.1)*10)/10); persist('fs',S.fs); }
      else if(act==='copylink'){ copy(location.origin+location.pathname+'#'+el.getAttribute('data-id'),'링크를 복사했습니다'); return; }
      else if(act==='copyblog'){ copy(blogText(byId[el.getAttribute('data-id')]),'글감을 복사했습니다'); return; }
      else if(act==='copyscript'){ var a=byId[el.getAttribute('data-id')]; var o=a&&a.radar&&a.radar.owner; if(o){ copy((o.q?'[보호자 예상 질문]\n'+o.q+'\n\n':'')+'[설명]\n'+(o.script||''),'보호자 설명을 복사했습니다'); } return; }
      else if(act==='copyone'){ var a=S.ideas[el.getAttribute('data-id')]; if(a) copy(blogText(a),'글감을 복사했습니다'); return; }
      else if(act==='copyall'){ var items=Object.keys(S.ideas).map(function(k){return S.ideas[k];}); var t='# VetMan 해외 브리핑 — 블로그 글감 모음\n\n'+items.map(function(a,i){return (i+1)+'. '+blogText(a);}).join('\n\n———\n\n'); copy(t,items.length+'개 글감을 초안으로 복사했습니다'); return; }
      else if(act==='makedraft'){ makeDraft(Object.keys(S.ideas).map(function(k){return S.ideas[k];})); return; }
      else if(act==='makedraftone'){ var a=byId[el.getAttribute('data-id')]; if(a) makeDraft([snap(a)]); return; }
      else if(act==='draftclose'){ S.draft=null; render(); return; }
      else if(act==='copytitle'){ copy(decodeURIComponent(el.getAttribute('data-t')),'제목을 복사했습니다'); return; }
      else if(act==='copydraft'){ if(S.draft&&S.draft.result) copy(draftFullText(S.draft.result),'초안을 복사했습니다'); return; }
      else if(act==='share'){ var a=byId[el.getAttribute('data-id')]; if(a) shareArticle(a); return; }
      S.searchFocus=false; render(); return;
    }
    if(el.hasAttribute('data-open')){ openArticle(el.getAttribute('data-open')); }
  });
  document.addEventListener('input',function(ev){ if(ev.target.id==='vm-q'){ S.query=ev.target.value; S.searchFocus=true; S.caret=ev.target.selectionStart; if(S.query.trim()){ S.view='home'; } render(); } });
  document.addEventListener('submit',function(ev){ if(ev.target.id==='vm-sub'){ ev.preventDefault(); var em=document.getElementById('vm-email'); if(em&&em.value) subscribe(em.value.trim()); } });
  document.addEventListener('keydown',function(ev){
    var t=ev.target, typing = t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
    if(ev.key==='Escape'){ if(S.draft){ S.draft=null; render(); } else if(S.openId){ S.openId=null; render(); } return; }
    if(typing) return;
    if(S.openId && (ev.key==='ArrowRight'||ev.key==='j')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i+1]) openArticle(ctx[i+1].id); }
    else if(S.openId && (ev.key==='ArrowLeft'||ev.key==='k')){ ev.preventDefault(); var ctx=contextList(),ids=ctx.map(function(x){return x.id;}),i=ids.indexOf(S.openId); if(ctx[i-1]) openArticle(ctx[i-1].id); }
    else if((ev.key==='s'||ev.key==='S') && S.openId){ var id=S.openId,a=byId[id]; if(S.saved[id]) delete S.saved[id]; else S.saved[id]=snap(a); persist('saved',S.saved); render(); }
    else if((ev.key==='d'||ev.key==='D') && S.openId){ toggleIdea(S.openId); }
    else if(ev.key==='/'){ ev.preventDefault(); S.view='home'; S.searchFocus=true; render(); }
  });
  if(location.hash && byId[location.hash.slice(1)]){ S.openId=location.hash.slice(1); markRead(S.openId); }
  render();
})();</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
