name: Daily source-first newsroom

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-source-first-newsroom
      cancel-in-progress: false
    # 후보별 호출 상한과 실패 체크포인트를 두고, 전체 잡도 무한정 늘어지지
    # 않도록 제한한다. 실패 시 알림 이슈가 열려 운영자가 바로 확인한다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ubuntu-latest에는 한글 폰트가 없다. editorial-cards.js가 SVG에
      # font-family="Arial, Apple SD Gothic Neo, …"만 지정해뒀는데 둘 다
      # macOS 전용이라, CI에서 sharp가 래스터라이즈하면 한글이 전부
      # tofu(네모)로 깨진다 — 여기서 렌더링될 카드가 og:image로도 쓰인다.
      # npm run build가 prebuild(카드 생성)를 자동으로 먼저 돌리므로 그 전에 설치한다.
      - name: Install Korean font for editorial cards
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - name: Run unit tests
        run: npm test
      - name: Check official source health
        run: npm run sources:health
      - name: Diagnose official feeds without changing registry
        # RECORD_FEED_HISTORY=1은 원래 shadow-newsroom.yml에만 있었는데, 그
        # 워크플로는 permissions: contents: read라 reports/를 리포에 커밋하지
        # 못하고 artifact로만 올린다. 그래서 reports/feed-history.json이
        # 2026-07-29의 2건에서 멈춰 있었다. validate-feed-candidates는
        # consecutiveSuccessfulRuns >= 3을 요구하므로 어떤 대체 피드도 영원히
        # 승인될 수 없었고, sources.js가 3회 미만이면 healthy를 degraded로
        # 강등해 "healthy 0"처럼 보이던 것도 상당 부분 이 교착 탓이었다.
        # 이 잡은 reports/를 커밋하므로 여기서 기록해야 이력이 실제로 쌓인다.
        run: npm run sources:diagnose
        env:
          RECORD_FEED_HISTORY: "1"
      - name: Collect source-first draft candidates
        # 고유 후보가 하루 수백 건 쌓이므로 점수 상위 220건을 처리한다.
        # 상위 48건은 심층 생성해 색인 후보로 만들고, 나머지는 짧은 브리프로
        # 재활용한다. 실제 공개는 품질 게이트를 통과한 하루 90건으로 제한한다.
        # 원문 확인과 짧은 브리프 생성은 제한 병렬 풀에서 순서를 보존하며 처리된다.
        # 소스별 18건 상한으로 특정 대형 피드가 화면을 독식하지 않게 하면서
        # 새 학술·대학 피드도 매일 노출될 수 있도록 한다.
        # 개별 호출은 2분, SDK 숨은 재시도는 0회로 제한한다. 한 후보가
        # 실패하면 ingest.js가 경고 초안을 체크포인트하고 다음 후보로 간다.
        timeout-minutes: 95
        run: npm run ingest:all -- --generate --volume --pubmed --deep-limit=48 --max=220 --per-source=18
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'MiniMax-M2' }}
          # 짧은 브리프는 본문·radar보다 호출량이 작아 4개까지 병렬 처리한다.
          LLM_CONCURRENCY: "4"
          FULLTEXT_CONCURRENCY: "8"
          LLM_TIMEOUT_MS: "120000"
          LLM_MAX_RETRIES: "0"
          # 한 후보가 외국어·짧은 본문·레이더 재생성 루프를 독점하지 않게 한다.
          LLM_GENERATION_ATTEMPTS: "2"
          LLM_RADAR_ATTEMPTS: "2"
          LLM_JSON_ATTEMPTS: "2"
      - name: Upload newsroom reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-first-newsroom-${{ github.run_id }}
          path: |
            reports/source-health.json
            reports/source-health.md
            reports/feed-diagnostics.json
            reports/feed-diagnostics.md
            reports/ingest-report.json
            reports/ingest-report.md
            reports/ingest-progress.json
            reports/ingest-progress.md
            reports/update-candidates.json
            reports/draft-newsroom.json
            reports/language-audit.json
            reports/terminology-audit.json
            reports/claims-audit.json
            reports/end-to-end-drafts.md
            reports/operations-status.json
            reports/operations-status.md
            reports/image-rights-queue.json
            reports/image-rights-queue.md
            reports/deploy-guard.json
            reports/retention-guard.json
            reports/brief-release.json
            data/drafts
          if-no-files-found: ignore

      - name: Require a meaningful ingestion result
        if: success()
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/ingest-report.json', 'utf8'));
          const counts = report.counts || {};
          const drafts = Number(counts.drafts || 0);
          const fresh = Number(counts.freshAvailable || 0);
          const failed = Number(counts.generationFailed || 0);
          console.log(JSON.stringify({ fresh, drafts, generationFailed: failed }));
          if (fresh > 0 && drafts === 0) {
            throw new Error('Fresh source items were found, but source-first generated zero drafts.');
          }
          if (drafts > 0 && failed >= drafts) {
            throw new Error('Every source-first draft failed generation.');
          }
          NODE
      # 복원 지점용 태그는 두지 않는다. GITHUB_TOKEN은 워크플로 파일이 얽힌 ref를
      # 푸시할 수 없어(refusing to allow a GitHub App to ... without `workflows`
      # permission) 태그 푸시가 거부되고, 그 뒤 발행 단계가 통째로 건너뛰어진다.
      # 발행 커밋 자체가 되돌릴 수 있는 지점이고, publish-control은 별도로
      # .editorial-backups에 이전 이슈를 남긴다.

      # ready-public-brief만 발행한다. high-risk 임상 기사와 언어·주장 경고가 있는
      # 초안은 여기서 걸러져 data/drafts에 남는다. low-risk 심층 기사는
      # index-low-risk로, 나머지는 public-brief로 등급을 나눈다. 하루 90건 목표에
      # 미달하면 이슈 파일을 만들지 않고 잡을 실패시켜 조용한 결번을 막는다.
      - name: Release ready public briefs
        id: release
        run: |
          npm run brief:release-ready -- --apply --target=90
          DATE=$(TZ=Asia/Seoul date +%F)
          COUNT=$(node -e 'const fs=require("node:fs");const p="reports/brief-release.json";const d=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{};console.log(Number(d.released||0))')
          TOTAL=$(node -e 'const fs=require("node:fs");const p="reports/brief-release.json";const d=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{};console.log(Number(d.existing||0)+Number(d.released||0))')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "오늘($DATE) 발행 $COUNT건 · 누적 $TOTAL/90건"

      - name: Build and validate publication set
        run: |
          npm run build
          npm run validate
          npm run ops:status
          npm run image:rights:queue
          npm run ops:queue
          npm run ops:sync
          npm run deploy:guard
          npm run seo:audit
          npm run seo:contract
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/seo-audit.json', 'utf8'));
          if ((report.critical?.length ?? 0) > 0) throw new Error('SEO critical 오류가 있습니다.');
          NODE

      # 기존 공개 기사는 다음 날 발행분과 무관하게 보존되어야 한다. 검색
      # 인덱스에서 조용히 사라지는 경우에는 배포하지 않고 이력과 함께 실패시킨다.
      - name: Guard public article retention
        run: npm run retention:guard
        env:
          RETENTION_BASE_REF: HEAD^

      - name: Commit publication set, drafts and reports
        run: |
          git config user.name "vetman-briefing-newsroom"
          git config user.email "actions@users.noreply.github.com"
          # .source-cache는 .gitignore 대상이라 git add에 넣으면 exit 1로 잡 전체가 죽는다. 넣지 않는다.
          # .github는 담지 않는다. GITHUB_TOKEN은 워크플로 파일을 푸시할 수 없다.
          git add data site reports
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "daily: $(date -u +%F) briefing (${{ steps.release.outputs.count }}건)"
          # 실행 중 main이 앞서갔을 수 있다. 리베이스 후 올린다.
          # --autostash가 없으면 "cannot pull with rebase: You have unstaged
          # changes"로 거부된다. data/site/reports만 스테이징하므로 빌드가
          # 건드린 다른 파일이 항상 미스테이징으로 남는다.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Require daily target
        if: success()
        run: |
          TOTAL=$(node -e 'const fs=require("node:fs");const p="reports/brief-release.json";const d=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):{};console.log(Number(d.existing||0)+Number(d.released||0))')
          if [ "$TOTAL" -lt 90 ]; then
            echo "일일 목표 90건 미달($TOTAL건) — 후보·리포트는 커밋했고 다음 실행에서 재시도합니다."
            exit 1
          fi
          echo "일일 목표 달성: $TOTAL/90건"

      - name: Deploy to Cloudflare Pages
        if: steps.release.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 미설정 — 배포 건너뜀"
            exit 0
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      - name: Verify production deployment
        if: steps.release.outputs.count != '0'
        run: |
          VERIFY_ATTEMPTS=6 VERIFY_DELAY_MS=5000 npm run verify:deployment

      - name: Monitor production contract
        if: steps.release.outputs.count != '0'
        env:
          MONITOR_MIN_LATEST_ITEMS: "90"
          MONITOR_REQUIRE_TODAY_AFTER_KST: "10"
          MONITOR_SW_CACHE: "vmcache-v8"
        run: npm run monitor:production

      - name: Upload production monitoring result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-monitor-daily-${{ github.run_id }}
          path: reports/production-monitoring.json
          if-no-files-found: ignore
          retention-days: 14

      # 배포가 끝난 뒤에 알려야 크롤러가 새 글을 실제로 받아간다
      - name: Notify search engines (IndexNow)
        if: steps.release.outputs.count != '0'
        continue-on-error: true
        run: node src/indexnow.js

      # 실패 알림 이슈가 열려 있는데 이번 실행은 성공했다면 복구된 것 —
      # 방치돼 "늘 열려있는" 알림으로 무시당하지 않도록 닫아준다.
      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label daily-briefing-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "복구됨: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          fi

      # 이 잡이 조용히 실패해도(2026-08-05, 08-06 사례) 아무도 몰랐다.
      # 어느 스텝에서 실패하든 이슈로 남겨 GitHub 알림(watcher 이메일)을 태운다.
      # 라벨로 열린 이슈를 찾아 있으면 댓글만 남기고, 없으면 새로 만든다 —
      # 연속 실패가 이슈를 계속 새로 만들지 않게.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-briefing-failure --color d73a4a --description "데일리 브리핑 파이프라인 실패" 2>/dev/null || true
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="데일리 브리핑 실행이 실패했습니다.$(printf '\n\n')로그: $RUN_URL"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label daily-briefing-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "데일리 브리핑 실패 $(TZ=Asia/Seoul date +%F)" --label daily-briefing-failure --body "$BODY"
          fi
