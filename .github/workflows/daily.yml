name: Daily source-first newsroom

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-source-first-newsroom
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check official source health
        run: npm run sources:health
      - name: Diagnose official feeds without changing registry
        run: npm run sources:diagnose
      - name: Collect source-first draft candidates
        run: npm run ingest:all -- --generate --max=30
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'MiniMax-M2' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '4' }}
      - name: Upload newsroom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-newsroom-${{ github.run_id }}
          path: |
            reports/source-health.json
            reports/source-health.md
            reports/feed-diagnostics.json
            reports/feed-diagnostics.md
            reports/ingest-report.json
            reports/ingest-report.md
            reports/update-candidates.json
            reports/draft-newsroom.json
            reports/language-audit.json
            reports/terminology-audit.json
            reports/claims-audit.json
            reports/end-to-end-drafts.md
            data/drafts
          if-no-files-found: ignore
      - name: Validate unchanged public publication set
        run: |
          npm run build
          npm run validate
          npm run seo:audit
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/seo-audit.json', 'utf8'));
          if ((report.counts?.index ?? 170) !== 170) throw new Error('기존 index 수가 source-first 수집에서 변경되었습니다.');
          if ((report.critical?.length ?? 0) > 0) throw new Error('SEO critical 오류가 있습니다.');
          NODE
      - name: Commit drafts and reports only
        run: |
          git config user.name "vetman-briefing-newsroom"
          git config user.email "actions@users.noreply.github.com"
          git add data/drafts reports/source-health.json reports/source-health.md reports/feed-diagnostics.json reports/feed-diagnostics.md reports/ingest-report.json reports/ingest-report.md reports/update-candidates.json reports/draft-newsroom.json reports/language-audit.json reports/terminology-audit.json reports/claims-audit.json reports/end-to-end-drafts.md .source-cache
          git diff --cached --quiet || git commit -m "newsroom: source-first draft candidates $(date -u +%F)"
          git push --atomic origin main
      - name: Explicit publication safety assertion
        run: |
          if find data/issues -maxdepth 1 -name "$(TZ=Asia/Seoul date +%F).json" -print -quit | grep -q .; then
            echo "기존 published issue는 변경하지 않았습니다. 신규 source-first 결과는 data/drafts에만 기록됩니다."
          fi
