name: Daily source-first newsroom

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-source-first-newsroom
      cancel-in-progress: false
    # 실측: 후보 60건 수집·생성에 63분(radar 포함), 발행·빌드·배포에 3분.
    # 동시 실행 8이 기대만큼 병렬을 주지 않아 75분은 여유가 9분뿐이라 90으로 둔다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Check official source health
        run: npm run sources:health
      - name: Diagnose official feeds without changing registry
        run: npm run sources:diagnose
      - name: Collect source-first draft candidates
        # 고유 후보가 하루 400건 넘게 쌓이는데 30건만 쓰고 있었다. 동시 실행을
        # 8로 올려 확보한 여유만큼 후보 수를 늘린다(생성 시간은 비슷하게 유지).
        # 선정은 점수 기반이라 소스별 상한(--per-source)은 걸지 않는다. 좋은
        # 후보를 많이 낸 매체가 많이 나가는 것이 의도한 동작이다.
        run: npm run ingest:all -- --generate --max=60
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'MiniMax-M2' }}
          LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY || '4' }}
      - name: Upload newsroom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-newsroom-${{ github.run_id }}
          path: |
            reports/source-health.json
            reports/source-health.md
            reports/feed-diagnostics.json
            reports/feed-diagnostics.md
            reports/ingest-report.json
            reports/ingest-report.md
            reports/update-candidates.json
            reports/draft-newsroom.json
            reports/language-audit.json
            reports/terminology-audit.json
            reports/claims-audit.json
            reports/end-to-end-drafts.md
            data/drafts
          if-no-files-found: ignore
      # 복원 지점용 태그는 두지 않는다. GITHUB_TOKEN은 워크플로 파일이 얽힌 ref를
      # 푸시할 수 없어(refusing to allow a GitHub App to ... without `workflows`
      # permission) 태그 푸시가 거부되고, 그 뒤 발행 단계가 통째로 건너뛰어진다.
      # 발행 커밋 자체가 되돌릴 수 있는 지점이고, publish-control은 별도로
      # .editorial-backups에 이전 이슈를 남긴다.

      # ready-public-brief만 발행한다. high-risk 임상 기사와 언어·주장 경고가 있는
      # 초안은 여기서 걸러져 data/drafts에 남는다. 발행분은 감수자를 주장하지 않는
      # public-brief 등급이라 noindex·sitemap/RSS 제외로 나간다.
      - name: Release ready public briefs
        id: release
        run: |
          npm run brief:release-ready -- --apply
          DATE=$(TZ=Asia/Seoul date +%F)
          COUNT=$(node -e 'const fs=require("node:fs");const p="data/issues/"+process.argv[1]+".json";console.log(fs.existsSync(p)?(JSON.parse(fs.readFileSync(p,"utf8")).items||[]).length:0)' "$DATE")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "오늘($DATE) 발행 $COUNT건"

      - name: Build and validate publication set
        run: |
          npm run build
          npm run validate
          npm run seo:audit
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/seo-audit.json', 'utf8'));
          if ((report.critical?.length ?? 0) > 0) throw new Error('SEO critical 오류가 있습니다.');
          NODE

      - name: Commit publication set, drafts and reports
        run: |
          git config user.name "vetman-briefing-newsroom"
          git config user.email "actions@users.noreply.github.com"
          # .source-cache는 .gitignore 대상이라 git add에 넣으면 exit 1로 잡 전체가 죽는다. 넣지 않는다.
          # .github는 담지 않는다. GITHUB_TOKEN은 워크플로 파일을 푸시할 수 없다.
          git add data site reports
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "daily: $(date -u +%F) briefing (${{ steps.release.outputs.count }}건)"
          # 실행 중 main이 앞서갔을 수 있다. 리베이스 후 올린다.
          # --autostash가 없으면 "cannot pull with rebase: You have unstaged
          # changes"로 거부된다. data/site/reports만 스테이징하므로 빌드가
          # 건드린 다른 파일이 항상 미스테이징으로 남는다.
          git pull --rebase --autostash origin main
          git push origin main

      - name: Deploy to Cloudflare Pages
        if: steps.release.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 미설정 — 배포 건너뜀"
            exit 0
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      - name: Verify production deployment
        if: steps.release.outputs.count != '0'
        run: |
          set -euo pipefail
          BASE="https://news.vetmanlab.com"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/latest.json" > /tmp/live-latest.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/robots.txt" > /tmp/live-robots.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const latest = JSON.parse(fs.readFileSync('/tmp/live-latest.json', 'utf8'));
          if (!/^\d{4}-\d{2}-\d{2}$/.test(latest.date)) throw new Error(`라이브 latest.json 날짜 형식 오류: ${latest.date || '없음'}`);
          const robots = fs.readFileSync('/tmp/live-robots.txt', 'utf8');
          for (const rule of ['Disallow: /admin', 'Disallow: /raw']) if (!robots.includes(rule)) throw new Error(`robots.txt에 ${rule} 없음`);
          console.log(`프로덕션 확인: ${latest.date} / ${latest.items?.length ?? 0}건`);
          NODE

      # 배포가 끝난 뒤에 알려야 크롤러가 새 글을 실제로 받아간다
      - name: Notify search engines (IndexNow)
        if: steps.release.outputs.count != '0'
        continue-on-error: true
        run: node src/indexnow.js
