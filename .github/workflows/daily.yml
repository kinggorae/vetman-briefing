name: Daily briefing

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 비공개 저장소는 Actions 무료 한도가 월 2,000분이다.
    # 폭주한 실행이 한도를 태우지 않도록 상한을 둔다(정상 실행은 30분 내외).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # 파이프라인이 데이터를 건드리기 전 상태에 복원 지점을 박아둔다.
      # 발행이 잘못되면 이 태그로 되돌리면 된다(태그는 커밋만 가리키므로 비용 없음).
      - name: Tag pre-run restore point
        run: |
          git config user.name "vetman-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          TAG="pre-run-$(date -u +%Y%m%d)"
          git tag -f -a "$TAG" -m "자동발행 직전 스냅샷 $(date -u +%FT%TZ)"
          git push -f origin "$TAG"

      - name: Run pipeline (collect → select → generate → publish)
        run: node src/run.js --publish
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'MiniMax-M2' }}

      - name: Build site
        run: npm run build

      # 발행 결과가 비정상이면 커밋하지 않는다. 빈 이슈를 밀어넣고 배포하면
      # 사이트가 통째로 비는데, 그 상태가 커밋되면 되돌릴 대상이 늘어난다.
      - name: Sanity check before commit
        run: |
          LATEST=$(ls -1 data/issues/*.json | grep -v draft | sort | tail -1)
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$LATEST','utf8')).items.length)")
          echo "최신 이슈 $LATEST — $COUNT건"
          if [ "$COUNT" -lt 5 ]; then
            echo "::error::기사가 $COUNT건뿐이다. 수집·생성 실패로 보고 발행을 중단한다."
            exit 1
          fi
          test -s site/index.html || { echo "::error::site/index.html이 비었다"; exit 1; }

      - name: Commit and push
        run: |
          git config user.name "vetman-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F) briefing"
          git push

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 미설정 — 배포 건너뜀"
            exit 0
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      # 배포가 끝난 뒤에 알려야 크롤러가 새 글을 실제로 받아간다
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node src/indexnow.js
