name: Daily briefing

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 비공개 저장소는 Actions 무료 한도가 월 2,000분이다.
    # 폭주한 실행이 한도를 태우지 않도록 상한을 둔다(정상 실행은 30분 내외).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Run pipeline (collect → select → generate → publish)
        run: node src/run.js --publish
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'MiniMax-M2' }}

      - name: Build site
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "vetman-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F) briefing"
          git push

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 미설정 — 배포 건너뜀"
            exit 0
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      # 배포가 끝난 뒤에 알려야 크롤러가 새 글을 실제로 받아간다
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node src/indexnow.js
