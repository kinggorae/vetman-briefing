name: Shadow newsroom

on:
  schedule:
    # 05:30 Asia/Seoul (UTC+9), every day.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-newsroom
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run shadow newsroom
        run: npm run shadow:run
      - name: Write seven-run trend
        if: always()
        run: npm run shadow:trend
      - name: Upload shadow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-newsroom-${{ github.run_id }}
          path: |
            reports/shadow/
            reports/feed-diagnostics.*
            reports/feed-history.json
            reports/feed-repair-validation.*
            reports/first-publish-candidates.*
          if-no-files-found: warn
          retention-days: 30
