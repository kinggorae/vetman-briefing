name: Deploy site

# 저장소에 이미 커밋된 발행분을 그대로 빌드해 배포한다.
# Cloudflare Pages에 git 연동이 없어 wrangler 배포를 거치지 않으면 라이브가
# 갱신되지 않는다. 대량 수집·생성 작업을 다시 돌리지 않고 배포만
# 필요할 때 쓴다. 데이터를 만들지도, 커밋하지도 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # daily.yml과 동일한 이유: CI에 한글 폰트가 없으면 npm run build가
      # 자동으로 돌리는 prebuild(에디토리얼 카드 생성)에서 한글이 깨진다.
      - name: Install Korean font for editorial cards
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -f

      - name: Run unit tests
        run: npm test

      - name: Build and validate
        run: |
          npm run build
          npm run validate
          npm run ops:status
          npm run image:rights:queue
          npm run ops:queue
          npm run ops:sync
          npm run deploy:guard
          npm run seo:audit
          npm run seo:contract
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/seo-audit.json', 'utf8'));
          if ((report.critical?.length ?? 0) > 0) throw new Error('SEO critical 오류가 있습니다.');
          NODE

      - name: Guard public article retention
        run: npm run retention:guard
        env:
          RETENTION_BASE_REF: HEAD^

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — 배포할 수 없습니다"
            exit 1
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      - name: Verify production deployment
        run: VERIFY_ATTEMPTS=6 VERIFY_DELAY_MS=5000 npm run verify:deployment

      - name: Monitor production feed and article contract
        env:
          # 기능 배포 직후에는 아직 이전 30건 최신호가 남아 있을 수 있다.
          # 새 일간 발행 잡이 목표 건수를 만들면 daily.yml에서 해당 계약을 검사한다.
          MONITOR_MIN_LATEST_ITEMS: "30"
          MONITOR_REQUIRE_TODAY_AFTER_KST: "10"
          MONITOR_SW_CACHE: "vmcache-v8"
        run: npm run monitor:production

      - name: Upload production monitoring result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-monitor-deploy-${{ github.run_id }}
          path: reports/production-monitoring.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node src/indexnow.js

      - name: Close recovered deploy issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label production-deploy-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "복구됨: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          fi

      - name: Notify on deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create production-deploy-failure --color d73a4a --description "Production 배포 또는 검증 실패" 2>/dev/null || true
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Production 배포 또는 검증이 실패했습니다.\n\n로그: $RUN_URL"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label production-deploy-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "Production deploy 실패 $(TZ=Asia/Seoul date +%F)" --label production-deploy-failure --body "$BODY"
          fi
