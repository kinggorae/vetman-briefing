name: Deploy site

# 저장소에 이미 커밋된 발행분을 그대로 빌드해 배포한다.
# Cloudflare Pages에 git 연동이 없어 wrangler 배포를 거치지 않으면 라이브가
# 갱신되지 않는다. 수집·생성(60건에 60분 이상)을 다시 돌리지 않고 배포만
# 필요할 때 쓴다. 데이터를 만들지도, 커밋하지도 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build and validate
        run: |
          npm run build
          npm run validate
          npm run seo:audit
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/seo-audit.json', 'utf8'));
          if ((report.critical?.length ?? 0) > 0) throw new Error('SEO critical 오류가 있습니다.');
          NODE

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "15178c9e9cab3b38e6b687feb568cb28"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 미설정 — 배포할 수 없습니다"
            exit 1
          fi
          npx wrangler pages deploy site --project-name vetman-briefing --branch main --commit-dirty=true

      - name: Verify production deployment
        run: |
          set -euo pipefail
          BASE="https://news.vetmanlab.com"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$BASE/latest.json" > /tmp/live-latest.json
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/robots.txt" > /tmp/live-robots.txt
          node - <<'NODE'
          const fs = require('node:fs');
          const latest = JSON.parse(fs.readFileSync('/tmp/live-latest.json', 'utf8'));
          if (!/^\d{4}-\d{2}-\d{2}$/.test(latest.date)) throw new Error(`라이브 latest.json 날짜 형식 오류: ${latest.date || '없음'}`);
          const robots = fs.readFileSync('/tmp/live-robots.txt', 'utf8');
          for (const rule of ['Disallow: /admin', 'Disallow: /raw']) if (!robots.includes(rule)) throw new Error(`robots.txt에 ${rule} 없음`);
          console.log(`프로덕션 확인: ${latest.date} / ${latest.items?.length ?? 0}건`);
          NODE

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node src/indexnow.js
