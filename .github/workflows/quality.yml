name: SEO and browser quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub-hosted Ubuntu already provides Playwright's system libraries;
      # install only the pinned browser binary to keep CI deterministic.
      - run: npx playwright install chromium
      - run: npm test
      # daily.yml/deploy.yml과 동일한 이유: npm run build의 prebuild가 에디토리얼
      # 카드를 생성하는데, CI에 한글 폰트가 없으면 렌더링이 깨진다.
      - name: Install Korean font for editorial cards
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - run: npm run build
      - run: npm run validate
      - run: npm run seo:audit
      - run: npm run review:stats
      - run: npm run review:packets
      - run: npm run source:stats
      - run: npm run source:registry:audit
      - run: npm run sources:diagnose
      - run: npm run sources:repair:validate
      - run: npm run sources:health
      - run: npm run ingest:dry
      - run: npm run updates:stats
      - run: npm run language:audit
      - run: npm run terminology:audit
      - run: npm run claims:audit
      - run: npm run publish:first-candidates
      - run: npm run shadow:trend
      - run: npm run review:queue
      - run: npm run draft:e2e
      - run: npm run test:browser
      - run: npm run lighthouse
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-browser-qa-${{ github.run_id }}
          path: |
            reports/seo-audit.json
            reports/review-stats.json
            reports/review-queue.json
            reports/source-stats.json
            reports/source-registry-audit.json
            reports/source-health.json
            reports/feed-diagnostics.json
            reports/feed-diagnostics.md
            reports/feed-history.json
            reports/feed-repair-validation.json
            reports/feed-repair-validation.md
            reports/ingest-report.json
            reports/update-candidates.json
            reports/language-audit.json
            reports/terminology-audit.json
            reports/claims-audit.json
            reports/draft-newsroom.json
            reports/end-to-end-drafts.md
            reports/first-publish-candidates.json
            reports/first-publish-candidates.md
            reports/shadow/
            reports/clinical-review-packets.json
            reports/seo-performance.json
            reports/playwright.json
            reports/lighthouse
            test-results
          if-no-files-found: ignore
