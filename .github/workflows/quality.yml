name: SEO and browser quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run seo:audit
      - run: npm run review:stats
      - run: npm run source:stats
      - run: npm run source:registry:audit
      - run: npm run test:browser
      - run: npm run lighthouse
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-browser-qa-${{ github.run_id }}
          path: |
            reports/seo-audit.json
            reports/review-stats.json
            reports/review-queue.json
            reports/source-stats.json
            reports/source-registry-audit.json
            reports/seo-performance.json
            reports/playwright.json
            reports/lighthouse
            test-results
          if-no-files-found: ignore
