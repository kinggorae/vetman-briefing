name: Production SEO monitoring

on:
  schedule:
    - cron: "0 1 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run monitor:production
      - name: Upload monitoring result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: reports/production-monitoring.json
          if-no-files-found: ignore
